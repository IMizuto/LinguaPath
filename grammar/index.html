  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = (d === "1");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>

  <script>
    if (localStorage.getItem("s4_vocab_dark") === "1") {
      document.documentElement.classList.add("dark");
      document.body.classList.add("dark");
    }
    window.toggleDark = function() {
      const isDark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", isDark);
      document.body.classList.toggle("dark", isDark);
      localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0");
      const mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? "#0f172a" : "#f1f5f9");
    };
    const ITEMS = window.STUDY4_GRAMMAR_DATA || [];
    const ALL_SECTIONS = Array.from(new Set(ITEMS.map(x => x.unitTitle + "||" + x.sectionName)));
    function canAccessLesson() { return true; }
    const listEl = document.getElementById("lessonList");
    const contentEl = document.getElementById("lessonContent");
    const searchInput = document.getElementById("searchInput");
    const sidebarEl = document.getElementById("sidebar");
    let completedMap = JSON.parse(localStorage.getItem("s4_grammar_done") || "{}");
    let activeId = localStorage.getItem("s4_grammar_last") || ITEMS[0]?.id;
    if (!ITEMS.some(x => x.id === activeId)) activeId = ITEMS[0]?.id;
    let activeProbIdx = 0;
    let currentUnitFilter = "ALL";
    let openSections = new Set();

    // Mở sẵn mục chủ đề chứa bài học hiện tại
    const initLesson = ITEMS.find(x => x.id === activeId);
    if (initLesson) openSections.add(initLesson.unitTitle + "||" + initLesson.sectionName);

    if (localStorage.getItem("s4_vocab_dark") === "1") document.body.classList.add("dark");

    window.toggleMenu = function(open) {
      sidebarEl.classList.toggle("open", open);
      document.body.classList.toggle("sidebar-open", open);
      const bd = document.getElementById("sidebarBackdrop");
      if (bd) bd.classList.toggle("open", open);
    };

    const UNIT_SHORT = {
      "[Grammar] Parts of speech - Từ loại": "1. Từ loại",
      "[Grammar] Tenses - Thì": "2. Các thì",
      "[Grammar] Clauses - Mệnh đề": "3. Mệnh đề",
      "[Grammar] in Writing - Văn viết": "4. Văn viết"
    };

    window.setUnitFilter = function(u) {
      currentUnitFilter = u;
      renderSidebar(searchInput.value);
    };

    window.toggleSection = function(secKey) {
      if (openSections.has(secKey)) openSections.delete(secKey);
      else openSections.add(secKey);
      renderSidebar(searchInput.value);
    };

    function renderUnitTabs() {
      const units = Array.from(new Set(ITEMS.map(x => x.unitTitle)));
      const tabsEl = document.getElementById("unitTabs");
      let html = `<button class="unit-tab ${currentUnitFilter === 'ALL' ? 'active' : ''}" onclick="setUnitFilter('ALL')">Tất cả</button>`;
      units.forEach(u => {
        const label = UNIT_SHORT[u] || u.replace("[Grammar] ", "");
        html += `<button class="unit-tab ${currentUnitFilter === u ? 'active' : ''}" onclick="setUnitFilter('${u.replace(/'/g, "\\'")}')">${label}</button>`;
      });
      tabsEl.innerHTML = html;
    }

    function renderSidebar(filterText = "") {
      renderUnitTabs();
      const q = filterText.toLowerCase().trim();
      listEl.innerHTML = "";

      // Gom bài học theo: Chương (unitTitle) -> Mục chủ đề (sectionName)
      const unitMap = new Map();
      ITEMS.forEach(l => {
        if (currentUnitFilter !== "ALL" && l.unitTitle !== currentUnitFilter) return;
        const match = !q || l.title.toLowerCase().includes(q) || l.sectionName.toLowerCase().includes(q) || (l.notesHtml || "").toLowerCase().includes(q);
        if (!match) return;
        if (!unitMap.has(l.unitTitle)) unitMap.set(l.unitTitle, new Map());
        const secMap = unitMap.get(l.unitTitle);
        if (!secMap.has(l.sectionName)) secMap.set(l.sectionName, []);
        secMap.get(l.sectionName).push(l);
      });

      unitMap.forEach((secMap, uTitle) => {
        const gDiv = document.createElement("div");
        gDiv.className = "unit-group";
        let unitTotal = 0, unitDone = 0;
        secMap.forEach(arr => {
          unitTotal += arr.length;
          unitDone += arr.filter(x => completedMap[x.id]).length;
        });

        gDiv.innerHTML = `<div class="unit-title"><span>${uTitle.replace("[Grammar] ", "")}</span><span>${unitDone}/${unitTotal}</span></div>`;

        let secIndex = 0;
        secMap.forEach((lessons, secName) => {
          secIndex++;
          const secKey = uTitle + "||" + secName;
          const globalSecIdx = ALL_SECTIONS.indexOf(secKey);
          const secUnlocked = true;
          const isOpen = (!!q || openSections.has(secKey)) && secUnlocked;
          const doneCount = lessons.filter(x => completedMap[x.id]).length;

          const secDiv = document.createElement("div");
          secDiv.className = "sec-group" + (isOpen ? " open" : "");
          if (!secUnlocked) secDiv.style.opacity = "0.78";

          const header = document.createElement("div");
          header.className = "sec-header";
          header.onclick = () => {
            if (!secUnlocked) {
              window.S4Auth.openActivateModal(secName);
              return;
            }
            toggleSection(secKey);
          };
          header.innerHTML = `
            <span style="line-height:1.35;">${secIndex}. ${secName}</span>
            <span class="sec-meta">
              <span style="${doneCount === lessons.length ? 'color:#16a34a;font-weight:800;' : ''}">${doneCount}/${lessons.length}</span>

            </span>
          `;
          secDiv.appendChild(header);

          const itemsWrap = document.createElement("div");
          itemsWrap.className = "sec-items";
          lessons.forEach(l => {
            const item = document.createElement("div");
            item.className = "lesson-item" + (l.id === activeId ? " active" : "");
            const icon = l.isPractice ? "✍️" : "🎬";
            const doneMark = completedMap[l.id] ? '<span class="done-dot">✅</span>' : '';
            item.innerHTML = `<span>${icon} Bài ${l.index}: ${l.title}</span>${doneMark}`;
            item.onclick = () => { selectItem(l.id); toggleMenu(false); };
            itemsWrap.appendChild(item);
          });
          secDiv.appendChild(itemsWrap);
          gDiv.appendChild(secDiv);
        });

        listEl.appendChild(gDiv);
      });
    }

    window.toggleDone = function(id) {
      completedMap[id] = !completedMap[id];
      localStorage.setItem("s4_grammar_done", JSON.stringify(completedMap));
      if (completedMap[id]) {
        try {
          const now = new Date();
          const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
          const days = JSON.parse(localStorage.getItem("s4_vocab_days_v2") || "{}");
          const arr = Array.isArray(days[today]) ? days[today] : [];
          const gKey = "g_" + id;
          if (!arr.includes(gKey)) arr.push(gKey);
          days[today] = arr;
          localStorage.setItem("s4_vocab_days_v2", JSON.stringify(days));
        } catch (e) {}
      }
      selectItem(id, false);
    };

    
window.S4FormatTheoryHtml = function(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return '';
  let html = rawHtml;

  // 1. Remove empty spacer paragraphs (<p>&nbsp;</p>, <p><span>&nbsp;</span></p>, etc.)
  html = html.replace(/<p\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>|<(?:span|strong|em|u)\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>)*<\/(?:span|strong|em|u)>)*<\/p>/gi, '');

  // 2. Convert Google Docs single-item <ol><li style="list-style-type:upper-roman|decimal"><h1|h2>...</h1|h2></li></ol> into structured section headers
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  html = html.replace(/<ol(?:\s+start="(\d+)")?\s*>\s*<li\b([^>]*)>\s*<(h[1-3])\b[^>]*>([\s\S]*?)<\/\3>\s*<\/li>\s*<\/ol>/gi, function(m, startNum, liAttr, hTag, inner) {
    const idx = startNum ? Math.max(1, parseInt(startNum, 10)) : 1;
    const isRoman = /upper-roman/i.test(liAttr);
    const isAlpha = /upper-alpha/i.test(liAttr);
    const badge = isRoman ? (ROMAN[idx - 1] || idx) : (isAlpha ? String.fromCharCode(64 + idx) : String(idx));
    const isSub = hTag.toLowerCase() !== 'h1' && !isRoman;
    const cleanInner = inner.replace(/&nbsp;/gi, ' ').trim();
    if (isSub) {
      return '<div class="s4-subsec-heading"><span class="s4-subsec-badge">' + badge + '</span><span class="s4-subsec-title">' + cleanInner + '</span></div>';
    }
    return '<div class="s4-sec-heading"><span class="s4-sec-badge">' + badge + '</span><span class="s4-sec-title">' + cleanInner + '</span></div>';
  });

  // 3. Convert Google Docs fake bullet paragraphs <p style="...list-style-type:disc...">...</p>
  html = html.replace(/<p\b([^>]*style\s*=\s*"[^"]*list-style-type\s*:\s*disc[^"]*"[^>]*)>([\s\S]*?)<\/p>/gi, '<p class="s4-pseudo-li">$2</p>');

  // 4. Process all tags with a style="..." attribute
  html = html.replace(/<([a-zA-Z0-9]+)\b([^>]*?)\sstyle\s*=\s*"([^"]*)"([^>]*)>/gi, function(full, tag, before, styleStr, after) {
    const t = tag.toLowerCase();
    const classes = [];
    let s = styleStr;

    // Highlight background colors -> soft pastel badge classes
    if (/background(?:-color)?\s*:\s*#ffff00\b/i.test(s)) {
      classes.push('s4-hl-amber');
      s = s.replace(/background(?:-color)?\s*:\s*#ffff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ffff\b/i.test(s)) {
      classes.push('s4-hl-sky');
      s = s.replace(/background(?:-color)?\s*:\s*#00ffff\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ff00\b/i.test(s)) {
      classes.push('s4-hl-emerald');
      s = s.replace(/background(?:-color)?\s*:\s*#00ff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#ff9900\b/i.test(s)) {
      classes.push('s4-hl-rose');
      s = s.replace(/background(?:-color)?\s*:\s*#ff9900\s*;?/gi, '');
    }

    // Table header / accent cell backgrounds (#9fc5e8, #a4c2f4)
    if (/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\b/i.test(s)) {
      classes.push('s4-td-accent');
      s = s.replace(/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\s*;?/gi, '');
    }

    // Strip white / light gray / transparent backgrounds that break Dark Mode
    s = s.replace(/background(?:-color)?\s*:\s*(?:#ffffff|#fff|#f1f3f5|white|transparent)\s*;?/gi, '');

    // Foreground text colors
    if (/(?:^|[;\s])color\s*:\s*#ff0000\b/i.test(s)) {
      classes.push('s4-txt-red');
      s = s.replace(/(?:^|[;\s])color\s*:\s*#ff0000\s*;?/gi, '');
    }
    if (/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))/i.test(s)) {
      classes.push('s4-txt-blue');
      s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))\s*;?/gi, '');
    }
    // Strip hardcoded dark/black text colors
    s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#000000|#000|black|#1a1a1a|#242938)\s*;?/gi, '');

    // Clean up table, td, th, img, span fixed pixel dimensions & borders
    if (t === 'table' || t === 'td' || t === 'th' || t === 'img' || t === 'span') {
      s = s.replace(/\b(?:width|height)\s*:\s*[\d.]+px\s*;?/gi, '');
      s = s.replace(/\btable-layout\s*:\s*fixed\s*;?/gi, '');
      s = s.replace(/\bborder(?:-(?:top|bottom|left|right))?\s*:\s*[\d.]+px\s+solid\s+#[0-9a-fA-F]+\s*;?/gi, '');
      s = s.replace(/\boverflow\s*:\s*hidden\s*;?/gi, '');
    }

    // Soften excessive Google Docs left margins and remove justify alignment
    s = s.replace(/\btext-align\s*:\s*justify\s*;?/gi, '');
    s = s.replace(/\bmargin-left\s*:\s*(\d+)px\s*;?/gi, function(_, px) {
      const n = parseInt(px, 10);
      if (n >= 120) return 'margin-left:28px;';
      if (n >= 70) return 'margin-left:20px;';
      if (n >= 36) return 'margin-left:12px;';
      return '';
    });

    s = s.replace(/;\s*;/g, ';').trim().replace(/^;+|;+$/g, '').trim();

    let combinedBeforeAfter = before + after;
    if (classes.length > 0) {
      if (/\bclass\s*=\s*"([^"]*)"/i.test(combinedBeforeAfter)) {
        combinedBeforeAfter = combinedBeforeAfter.replace(/\bclass\s*=\s*"([^"]*)"/i, function(_, existing) {
          return 'class="' + (existing + ' ' + classes.join(' ')).trim() + '"';
        });
      } else {
        combinedBeforeAfter = ' class="' + classes.join(' ') + '"' + combinedBeforeAfter;
      }
    }

    const styleAttr = s ? ' style="' + s + '"' : '';
    return '<' + tag + combinedBeforeAfter + styleAttr + '>';
  });

  // 5. Move leading/trailing spaces outside highlight pills so borders hug the words cleanly
  html = html.replace(/<span\s+class="(s4-hl-[a-z0-9\s-]+)">(\s*)([\s\S]*?)(\s*)<\/span>/gi, function(m, cls, lead, inner, trail) {
    if (!inner.trim()) return lead + trail;
    return (lead || '') + '<span class="' + cls + '">' + inner + '</span>' + (trail || '');
  });

  // 6. Merge accidentally split paragraph lines right before "⇒ Paragraph X" (e.g. Question 18 in L15)
  html = html.replace(/<p>([\s\S]*?,)<\/p>\s*<p>(\s*(?:<span[^>]*>)*\s*[a-z][\s\S]*?)<\/p>(?=\s*<p[^>]*>\s*(?:<[^>]+>)*\s*(?:⇒|→|=>)\s*Paragraph)/gi, '<p>$1 $2</p>');

  // 7. Classify <p> blocks into Step Callouts, Question Cards, Passage Excerpts, Answer Pills, and Note Callouts
  html = html.replace(/<p(\b[^>]*)>([\s\S]*?)<\/p>/gi, function(full, pAttr, inner) {
    if (/s4-pseudo-li/i.test(pAttr)) return full;
    const plain = inner.replace(/<[^>]+>/g, '').replace(/&nbsp;|\u00a0/g, ' ').replace(/&rarr;/g, '→').replace(/\s+/g, ' ').trim();
    if (!plain) return full;

    // 7a. Step Callout: "Bước 1: ...", "Bước 3 + Bước 4 + Bước 5"
    if (/^Bước\s*\d+/i.test(plain) && plain.length < 160) {
      return '<div class="s4-step-callout"><span class="s4-step-icon">🧭</span><div class="s4-step-body">' + inner + '</div></div>';
    }

    // 7b. Question Card: "Question 14: ...", "Practice 1: ..."
    if (/^(?:Question\s*\d+|Practice\s*\d+)\s*[:.]/i.test(plain)) {
      const decorated = inner.replace(/(?:<u>\s*)?(Question\s*\d+|Practice\s*\d+)\s*:?\s*(?:<\/u>)?(?:\s*<\/span>\s*<span[^>]*>)?\s*[:.]?\s*/i, '<span class="s4-q-badge">$1</span> ');
      return '<div class="s4-question-card">' + decorated + '</div>';
    }

    // 7c. Passage Excerpt: starts with "A. ", "B. ", ..., "I. " and is a passage paragraph (> 60 chars)
    if (/^[A-I]\.\s+/.test(plain) && plain.length > 60) {
      const decorated = inner.replace(/^(\s*(?:<[^>]+>\s*)*)([A-I])\.?(\s*(?:<\/[^>]+>\s*)*)/, '$1<span class="s4-para-badge">Đoạn $2</span>$3 ');
      return '<div class="s4-passage-excerpt">' + decorated + '</div>';
    }

    // 7d. Answer Pill or Conclusion Box: starts with "→", "⇒", "=>", or "Đáp án:"
    if (/^(?:→|⇒|=>)\s*/i.test(plain) || /^Đáp án\s*:/i.test(plain)) {
      const isShortAnswer = /^(?:→|⇒|=>)\s*(?:Paragraph\s+[A-Z]|Đáp án|Key|Answer|Main topic)/i.test(plain) || /^Đáp án\s*:/i.test(plain) || plain.length < 75;
      if (isShortAnswer) {
        return '<div class="s4-answer-wrap"><div class="s4-answer-pill">🎯 ' + inner.replace(/^(\s*(?:<[^>]+>\s*)*)(?:→|⇒|=>)\s*/, '$1') + '</div></div>';
      }
      return '<div class="s4-conclusion-box">' + inner + '</div>';
    }

    // 7e. Note Callout: starts with "Lưu ý:", "Chú ý:"
    if (/^(?:Lưu ý|Chú ý|Mẹo)\s*:/i.test(plain)) {
      return '<div class="s4-note-callout">💡 ' + inner + '</div>';
    }

    return full;
  });

  return html;
};

function selectItem(id, resetScroll = true) {
      let curLesson = ITEMS.find(x => x.id === id) || ITEMS[0];
      if (curLesson && !canAccessLesson(curLesson)) {
        if (window.S4Auth) window.S4Auth.openActivateModal(curLesson.sectionName);

      activeProbIdx = 0;
      localStorage.setItem("s4_grammar_last", id);
      if (curLesson) {
        openSections.clear();
        openSections.add(curLesson.unitTitle + "||" + curLesson.sectionName);
      }
      renderSidebar(searchInput.value);
      setTimeout(() => {
        const act = listEl.querySelector(".lesson-item.active");

      const isDone = !!completedMap[l.id];
      let btnsHtml = '<button class="btn btn-done ' + (isDone ? 'completed' : '') + '" onclick="toggleDone(\'' + l.id + '\')">' + (isDone ? '✅ Đã hoàn thành' : '⬜ Đánh dấu Đã học') + '</button>';
      if (l.localPdfPath) {
        btnsHtml += '<button class="btn btn-pdf" id="btnTogglePdf" onclick="togglePdf()">📑 Xem Slide PDF</button>';
        btnsHtml += '<a class="btn btn-pdf" style="background:#0284c7;" href="' + l.localPdfPath + '" target="_blank" title="Mở slide trong tab mới toàn màn hình">⛶ Mở tab mới</a>';
        btnsHtml += '<a class="btn btn-pdf" style="background:#475569;" href="' + l.localPdfPath + '" download title="Lưu slide về máy">⬇️ Tải PDF</a>';
      }
      if (l.videoUrl) {
        btnsHtml += '<a class="btn btn-yt" href="' + l.videoUrl + '" target="_blank">▶️ Mở Video trên YouTube</a>';
      }

        ${videoHtml}
        <div class="resources-bar">${btnsHtml}</div>
        ${l.localPdfPath ? `
        <div id="pdfWrapper" class="pdf-wrapper" style="display:none;margin-top:14px;">

            <span>📑 Slide bài giảng PDF</span>
            <a href="${l.localPdfPath}" target="_blank" class="btn btn-pdf" style="padding:4px 9px;font-size:11.5px;text-decoration:none;" title="Mở slide trong tab mới để phóng to">⛶ Mở tab mới toàn màn hình</a>
          </div>
          <iframe id="pdfFrame" class="pdf-preview" data-src="${l.localPdfPath}" style="width:100%;height:580px;border:1px solid var(--border);border-radius:0 0 10px 10px;background:#fff;display:block;"></iframe>
        </div>
        ` : ''}
        ${practiceHtml}
        ${l.notesHtml ? '<div class="notes-area">' + window.S4FormatTheoryHtml(l.notesHtml) + '</div>' : ''}
        <div class="nav-footer">
          ${prevItem ? '<button class="btn btn-done" onclick="selectItem(\'' + prevItem.id + '\')">&larr; Bài ' + prevItem.index + '</button>' : '<div></div>'}
          ${nextItem ? '<button class="btn btn-pdf" onclick="selectItem(\'' + nextItem.id + '\')">Bài ' + nextItem.index + ': ' + nextItem.title.slice(0, 28) + '... &rarr;</button>' : '<div></div>'}

    window.switchProb = function(idx) {
      activeProbIdx = idx;
      const l = ITEMS.find(x => x.id === activeId);
      if (l) renderPracticeQuestion(l);
    };

    function renderPracticeQuestion(lesson) {
      const box = document.getElementById("practiceContainer");
      if (!box) return;
      const q = lesson.questions[activeProbIdx];
      if (!q) return;

      let tabsHtml = "";
      if (lesson.questions.length > 1) {
        tabsHtml = '<div class="prob-tabs">' + lesson.questions.map((p, i) =>
          '<button class="prob-tab ' + (i === activeProbIdx ? 'active' : '') + '" onclick="switchProb(' + i + ')">Phần ' + (i + 1) + '</button>'
        ).join("") + '</div>';
      }

      box.innerHTML = `
        <div class="practice-card">
          <div class="practice-header">
            <div style="font-weight:800;font-size:16px;color:var(--primary);">✍️ Bài tập thực hành (${activeProbIdx + 1}/${lesson.questions.length})</div>
            ${tabsHtml}
          </div>
          <div class="prob-controls">
            <button class="btn btn-check" onclick="checkPracticeAnswers()">✔️ Kiểm tra đáp án</button>
            <button class="btn btn-show" onclick="showPracticeAnswers()">🏳️ Hiện đáp án & Giải thích</button>
            <button class="btn btn-clear" onclick="clearPracticeAnswers()">🔄 Làm lại</button>
          </div>
          <div id="scoreBanner" class="score-banner"></div>
          <div class="practice-body" id="practiceBody">${window.S4FormatTheoryHtml(q.bodyHtml)}</div>
        </div>
      `;

      const body = document.getElementById("practiceBody");
      // 1. Chuyển đổi các thẻ <span class="vocab-error" data-error="sai">đúng</span> của dạng bài Sửa lỗi sai thành ô nhập tương tác!
      body.querySelectorAll("span.vocab-error").forEach(span => {
        const wrongText = span.getAttribute("data-error") || "";
        const correctText = span.textContent.trim();
        const wrapper = document.createElement("span");
        wrapper.innerHTML = `<del style="color:#dc2626;font-weight:600;margin-right:4px;">${wrongText}</del><input type="text" class="vocab-input" data-answer="${correctText.replace(/"/g, '&quot;')}" placeholder="Sửa lại..." style="width:${Math.max(110, correctText.length * 10)}px;">`;
        span.replaceWith(wrapper);
      });

      // 2. Kích hoạt nút bấm "Giải thích chi tiết đáp án" (vốn dùng Bootstrap collapse trên web gốc)
      body.querySelectorAll('.g-problem-explanation-wrapper a[data-toggle="collapse"]').forEach(a => {
        a.onclick = (ev) => {
          ev.preventDefault();
          const target = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
          if (target) target.classList.toggle("show");
        };
      });
      // 3. Nhấn Enter trong ô điền từ bất kỳ để kiểm tra tức thì ô đó và hiện thông báo Đúng/Sai
      body.querySelectorAll("input[data-answer], select[data-answer]").forEach(el => {
        el.addEventListener("focus", () => {
          setTimeout(() => {
            try { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); } catch (e) {}
          }, 150);
        });
        el.addEventListener("input", () => {
          el.classList.remove("ans-correct", "ans-wrong");
          const next = el.nextElementSibling;
          if (next && next.classList.contains("ans-hint")) next.remove();
        });
        el.addEventListener("keydown", ev => {
          if (ev.key === "Enter") {
            ev.preventDefault();
            checkSingleField(el, true);
          }
        });
        el.addEventListener("change", () => {
          if (el.tagName === "SELECT" && el.value) checkSingleField(el, true);
        });
      });
    }

    let gToastTimer = null;
    function showGrammarToast(isGood, htmlMsg, durationMs) {
      let t = document.getElementById("s4GrammarToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4GrammarToast";
        document.body.appendChild(t);
      }
      if (gToastTimer) clearTimeout(gToastTimer);
      t.className = "s4-g-toast " + (isGood ? "good" : "warn");
      t.innerHTML = htmlMsg;
      requestAnimationFrame(() => t.classList.add("show"));
      gToastTimer = setTimeout(() => {
        t.classList.remove("show");
      }, durationMs || 2200);
    }

    function normalizeAns(str) {
      return (str || "").trim().replace(/\s+/g, " ").replace(/[.?!]+$/, "").toLowerCase();
    }

    function checkSingleField(el, notifyToast) {
      const next = el.nextElementSibling;
      if (next && next.classList.contains("ans-hint")) next.remove();
      const rawAns = (el.getAttribute("data-answer") || "").trim();
      const userVal = (el.value || "").trim();
      el.classList.remove("ans-correct", "ans-wrong");

      const validAnswers = rawAns.split(/\s*[/|]\s*/).map(normalizeAns);
      const normUser = normalizeAns(userVal);
      const isRight = normUser !== "" && (normUser === normalizeAns(rawAns) || validAnswers.includes(normUser));

      if (isRight) {
        el.classList.add("ans-correct");
        if (notifyToast) showGrammarToast(true, "✓ Chính xác", 1000);
      } else {
        el.classList.add("ans-wrong");
        const hint = document.createElement("span");
        hint.className = "ans-hint";
        hint.textContent = "✓ " + rawAns;
        el.insertAdjacentElement("afterend", hint);
        if (notifyToast) showGrammarToast(false, "✗ Đáp án: " + rawAns, 1600);
      }
      return isRight;
    }

    window.checkPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());

      let total = 0, correct = 0;
      const fields = body.querySelectorAll("[data-answer]");

      fields.forEach(el => {
        total++;
        if (checkSingleField(el, false)) correct++;
      });

      // Tự động mở khung Giải thích chi tiết (nếu có) sau khi bấm Kiểm tra
      const expCollapse = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
      if (expCollapse) expCollapse.classList.add("show");

      const banner = document.getElementById("scoreBanner");
      if (banner && total > 0) {
        banner.style.display = "block";
        const pct = Math.round((correct / total) * 100);
        const isGood = pct >= 80;
        banner.style.background = isGood ? "#dcfce7" : "#fee2e2";
        banner.style.color = isGood ? "#15803d" : "#b91c1c";
        banner.textContent = `Đúng ${correct}/${total} câu (${pct}%)`;
        showGrammarToast(isGood, `Đúng ${correct}/${total} câu (${pct}%)`, 1800);
      }
    };

    window.showPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());

      body.querySelectorAll("[data-answer]").forEach(el => {
        const rawAns = el.getAttribute("data-answer") || "";
        if (el.tagName === "SELECT") {
          const opts = Array.from(el.options);
          const matchOpt = opts.find(o => o.value.trim().toLowerCase() === rawAns.trim().toLowerCase() || o.textContent.trim().toLowerCase() === rawAns.trim().toLowerCase());
          if (matchOpt) el.value = matchOpt.value;
        } else {
          el.value = rawAns.trim();
        }
        el.classList.remove("ans-wrong");
        el.classList.add("ans-correct");
      });

      const expCollapse = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
      if (expCollapse) expCollapse.classList.add("show");
    };

    window.clearPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());
      body.querySelectorAll("[data-answer]").forEach(el => {
        el.value = "";
        el.classList.remove("ans-correct", "ans-wrong");
      });
      const banner = document.getElementById("scoreBanner");
      if (banner) banner.style.display = "none";
    };

    window.togglePdf = function() {
      const wrap = document.getElementById("pdfWrapper");
      const frame = document.getElementById("pdfFrame");
      const btn = document.getElementById("btnTogglePdf");
      if (!wrap || !frame) return;
      const isHidden = (wrap.style.display === "none" || !wrap.style.display);
      if (isHidden) {
        if (!frame.src || frame.src === "about:blank" || frame.src === window.location.href) {
          const ds = frame.getAttribute("data-src");
          if (ds) frame.src = ds;
        }
        wrap.style.display = "block";
        if (btn) btn.textContent = "📑 Ẩn Slide PDF";
        try { wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e) {}
      } else {
        wrap.style.display = "none";
        if (btn) btn.textContent = "📑 Xem Slide PDF";
      }
    };

    searchInput.oninput = () => renderSidebar(searchInput.value);
    renderSidebar();
    if (activeId) selectItem(activeId);
  </script>
  <script src="../assets/ghibli/ghibli-theme.js?v=25"></script>
</body>
</html>
