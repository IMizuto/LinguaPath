<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaThemeColor" content="#0d1813">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinguaPath">
  <link rel="manifest" href="../manifest.json">
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
      window.toggleDark = function() {
        if (window.toggleDarkModeOnly) {
          window.toggleDarkModeOnly();
        } else {
          var curD = localStorage.getItem("s4_vocab_dark");
          var curDark = !(curD === "0" || curD === "false");
          var nextDark = !curDark;
          localStorage.setItem("s4_vocab_dark", nextDark ? "1" : "0");
          document.documentElement.classList.toggle("dark", nextDark);
          if (document.body) document.body.classList.toggle("dark", nextDark);
          document.querySelectorAll('.dark-btn').forEach(function(b) {
            b.textContent = nextDark ? '☀️' : '🌙';
            b.title = nextDark ? 'Đang ở chế độ Tối — Bấm để chuyển sang Sáng' : 'Đang ở chế độ Sáng — Bấm để chuyển sang Tối';
          });
        }
      };
    } catch (e) {}
  })();
  </script>
<title>LinguaPath IELTS Reading — Free for Community</title>
  <link rel="icon" href="../icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --card: #334155;
    --border: rgba(148, 163, 184, 0.18);
    --text: #f8fafc;
    --sub-text: #cbd5e1;
    --muted: #94a3b8;
    --primary: #10b981;
    --primary-hover: #059669;
    --accent: #38bdf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --hl-gold: #fde68a;
    --hl-green: #34d399;
    --hl-cyan: #38bdf8;
    --box-sub: rgba(15, 23, 42, 0.6);
    --vi-bg: rgba(56, 189, 248, 0.1);
    --vi-text: #bae6fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* Topbar */
  .topbar {
    min-height: 58px;
    background:var(--box-sub);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
    z-index: 20;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-width: 0; }
  .back-btn {
    text-decoration: none;
    color: var(--text);
    background: rgba(255,255,255,0.07);
    padding: 7px 12px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .back-btn:hover { background: rgba(255,255,255,0.14); transform: translateX(-2px); }
  .brand-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .top-switch {
    display: flex;
    background: rgba(30, 41, 59, 0.9);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    -webkit-overflow-scrolling: touch;
  }
  .top-switch::-webkit-scrollbar { display: none; }
  .top-switch-btn {
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  @media (max-width: 1520px) and (min-width: 769px) {
    .topbar { padding: 6px 12px; gap: 6px 10px; }
    .topbar-left { order: 1; }
    .topbar-right { order: 2; margin-left: auto; }
    .top-switch { order: 3; flex: 1 0 100%; width: 100%; }
  }
  .top-switch-btn.active {
    background: var(--primary);
    color: #052e16;
  }
  .prog-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    color:var(--text);
    white-space: nowrap;
  }

  /* Workspace */
  .workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .sidebar {
    width: 355px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-height: 0;
    height: 100%;
  }
  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-row { display: flex; gap: 6px; }
  .search-input {
    flex: 1;
    padding: 8px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background:var(--box-sub);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
  }
  .search-input:focus { border-color: var(--primary); }
  .mini-btn {
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

  /* 3-Level Collapsible Tree Sidebar - Block flow so items never squish or overlap */
  .lesson-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    display: block;
  }
  .folder-box {
    border: 1px solid var(--border);
    border-radius: 11px;
    background:var(--box-sub);
    margin-bottom: 9px;
  }
  .folder-header {
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  .folder-header:hover { background: rgba(255,255,255,0.07); }
  .folder-title {
    font-size: 12.5px;
    font-weight: 800;
    color:var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.35;
  }
  .folder-meta {
    font-size: 11px;
    font-weight: 700;
    color:var(--hl-cyan);
    background: rgba(56, 189, 248, 0.12);
    padding: 2px 7px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .folder-body {
    padding: 6px 8px 8px;
    border-top: 1px solid var(--border);
    display: block;
  }
  .folder-box.collapsed > .folder-body { display: none; }
  .folder-arrow {
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.18s;
    display: inline-block;
  }
  .folder-box:not(.collapsed) > .folder-header .folder-arrow { transform: rotate(90deg); }

  /* Level 2 Book Folder */
  .subfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 9px;
    background: rgba(30, 41, 59, 0.5);
    margin-bottom: 6px;
  }
  .subfolder-header {
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color:var(--sub-text);
    user-select: none;
  }
  .subfolder-header:hover { background: rgba(255,255,255,0.05); }
  .subfolder-body {
    padding: 5px 6px 6px;
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    display: block;
    background:var(--box-sub);
  }
  .subfolder-box.collapsed > .subfolder-body { display: none; }
  .subfolder-box:not(.collapsed) > .subfolder-header .folder-arrow { transform: rotate(90deg); }

  /* Level 3 Test Folder */
  .testfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 7px;
    background: rgba(30, 41, 59, 0.35);
    margin-bottom: 5px;
  }
  .testfolder-header {
    padding: 6px 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    color:var(--muted);
    user-select: none;
  }
  .testfolder-header:hover { color:var(--text); background: rgba(255,255,255,0.04); }
  .testfolder-body {
    padding: 4px 5px 5px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
    display: block;
  }
  .testfolder-box.collapsed > .testfolder-body { display: none; }
  .testfolder-box:not(.collapsed) > .testfolder-header .folder-arrow { transform: rotate(90deg); }

  .lesson-item {
    padding: 8px 10px;
    border-radius: 7px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  .lesson-item:hover { background: rgba(255,255,255,0.07); }
  .lesson-item.active {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.45);
  }
  .lesson-item-title { font-size: 12px; font-weight: 600; color:var(--text); line-height: 1.35; }
  .lesson-item-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .done-badge {
    width: 17px; height: 17px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    flex-shrink: 0;
  }
  .lesson-item.done .done-badge {
    background: rgba(16, 185, 129, 0.22);
    color:var(--hl-green);
  }

  /* Main Area */
  .main-area { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 26px 60px; }
  .lesson-container { max-width: 1060px; margin: 0 auto;  }
  .lesson-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-unit-tag { font-size: 11px; font-weight: 800; color:var(--hl-cyan); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .lesson-title { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .btn {
    padding: 7px 13px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #052e16; }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }
  .btn-done.completed { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color:var(--hl-green); }

  /* Mode Bar */
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 18px;
    background: rgba(30, 41, 59, 0.85);
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .mode-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
  .mode-tab {
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.16s;
  }
  .mode-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .mode-tab.active {
    background: rgba(16, 185, 129, 0.18);
    color:var(--hl-green);
    border-color: rgba(16, 185, 129, 0.4);
  }

  /* Smart Learn & SRS Banner */
  .srs-stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 720px) { .srs-stats-bar { grid-template-columns: repeat(2, 1fr); } }
  .srs-stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .srs-stat-num { font-size: 20px; font-weight: 800; }
  .srs-stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  /* Smart Learn Card */
  .smart-box {
    max-width: 680px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .step-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .step-pill {
    flex: 1;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.08);
  }
  .step-pill.done { background: var(--primary); }
  .step-pill.active { background: #38bdf8; }
  .example-list {
    margin-top: 12px;
    padding: 12px 14px;
    background:var(--box-sub);
    border-radius: 10px;
    border-left: 3px solid #38bdf8;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    color:var(--text);
  }

  /* SRS Rating Buttons */
  .srs-rate-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .srs-btn {
    padding: 11px 10px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s;
  }
  .srs-btn:hover { transform: translateY(-2px); }
  .srs-btn.Hard { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .srs-btn.Good { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.45); color:var(--hl-gold); }
  .srs-btn.Easy { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }

  /* Video + Theory */
  .video-box {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .theory-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
    line-height: 1.75;
    font-size: 15px;
    color:var(--text);
  }
  .theory-card h1, .theory-card h2, .theory-card h3 { color:var(--hl-cyan); margin: 18px 0 10px; font-size: 18px; }
  .theory-card p { margin-bottom: 12px; }
  .theory-card ul, .theory-card ol { margin: 8px 0 14px 24px; }
  .theory-card li { margin-bottom: 6px; }
  .theory-card table { width: 100% !important; border-collapse: collapse; margin: 14px 0; background:var(--box-sub); }
  .theory-card td, .theory-card th { border: 1px solid var(--border) !important; padding: 8px 12px !important; color:var(--text) !important; }
  .theory-card img { max-width: 100% !important; height: auto !important; border-radius: 10px; margin: 10px 0; }

  /* Reading Split Layout */
  .reading-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 960px) { .reading-grid { grid-template-columns: 1fr; } }
  .passage-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px 26px; }
  .para-block { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px dashed rgba(148, 163, 184, 0.14); }
  .para-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .para-en { font-size: 15.5px; line-height: 1.8; color:var(--text); }
  .para-vi {
    margin-top: 8px;
    padding: 10px 14px;
    background:var(--vi-bg);
    border-left: 3px solid #38bdf8;
    border-radius: 6px;
    font-size: 13.8px;
    line-height: 1.65;
    color:var(--vi-text);
  }
  .vocab-hl {
    background: rgba(16, 185, 129, 0.18);
    color: #6ee7b7;
    border-bottom: 1.5px dashed #34d399;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .vocab-hl:hover { background: rgba(16, 185, 129, 0.35); color: #fff; }

  /* Reading Synonyms & Paraphrase (2-Column Split + Practice + Table) */
  .syn-subbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .syn-sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .syn-sub-btn {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--box-sub);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .syn-sub-btn:hover { border-color: var(--primary); }
  .syn-sub-btn.active {
    background: rgba(16, 185, 129, 0.22);
    border-color: #10b981;
    color: var(--hl-green);
  }
  .syn-pair-banner {
    padding: 10px 14px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13.5px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .syn-split-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 960px) {
    .syn-split-grid { grid-template-columns: 1fr; }
  }
  .syn-col-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    max-height: calc(100vh - 210px);
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }
  .syn-col-title {
    font-size: 12.5px;
    font-weight: 800;

<script>
const MANIFEST = window.STUDY4_READING_MANIFEST || { units: [] };
const DATA = {
  units: MANIFEST.units || []
};
const DONE_KEY = 's4_reading_done';
const LAST_KEY = 's4_reading_last_v2';
const SRS_KEY = 's4_reading_srs_v1';

let doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
let srsMap = JSON.parse(localStorage.getItem(SRS_KEY) || '{}');
let currentLesson = null;
let currentMode = 'smart'; // 'passage' | 'synonyms' | 'smart' | 'flashcard' | 'quiz' | 'listen' | 'match' | 'cloze' | 'list'
let synSubMode = 'learn'; // 'learn' | 'practice' | 'table'
let activeSynUid = '';
let synPracIdx = 0;
let synPracFeedback = '';
let synPracIsCorrect = false;
let synPracOptions = [];
let synPracCacheKey = '';
let synChunkState = 'idle';

function ensureSynonymsLoaded(cb) {
  if (window.__STUDY4_READ_SYNONYMS) {
    cb && cb();
    return;
  }
  if (synChunkState === 'loading') {
    const iv = setInterval(() => {
      if (window.__STUDY4_READ_SYNONYMS) {
        clearInterval(iv);
        cb && cb();
      }
    }, 30);
    return;
  }
  synChunkState = 'loading';
  const s = document.createElement('script');
  s.src = 'data/reading_synonyms.js';
  s.onload = () => {
    synChunkState = 'done';
    cb && cb();
  };
  s.onerror = () => {
    synChunkState = 'error';
    cb && cb();
  };
  document.head.appendChild(s);
}

function getActiveSynData() {
  if (!currentLesson) return { leftHtml: '', rightHtml: '', pairs: [] };
  const map = window.__STUDY4_READ_SYNONYMS || {};
  const fromChunk = map[currentLesson.id];
  const pairs = (fromChunk && fromChunk.pairs) || (currentLesson.problem && currentLesson.problem.synPairs) || [];
  return {
    leftHtml: fromChunk ? (fromChunk.leftHtml || '') : '',
    rightHtml: fromChunk ? (fromChunk.rightHtml || '') : '',
    pairs
  };
}

if (window.S4VocabEngine) {
  window.S4VocabEngine.init({
    srsKey: SRS_KEY,
    daysKey: 's4_reading_days_v1',
    settingsKey: 's4_reading_settings_v1',
    sessionKey: 's4_reading_vocab_session_v1',
    getSrsMap: () => srsMap,
    onSaveSrs: () => { saveSrs(); renderSidebar(); },

const chunkLoadWaiters = {};
function finishChunkLoad(unitId, loaded) {
  const waiters = chunkLoadWaiters[unitId] || [];
  delete chunkLoadWaiters[unitId];
  waiters.forEach(cb => { try { cb(loaded); } catch (e) { console.error(e); } });
}
function ensureChunkLoaded(unitId, cb) {
  if (window.__STUDY4_READ_CHUNK && window.__STUDY4_READ_CHUNK[unitId]) {
    const chunk = window.__STUDY4_READ_CHUNK[unitId];
    const targetUnit = DATA.units.find(u => u.unitId === unitId);
    if (targetUnit && chunk.items) {
      targetUnit.items = chunk.items;
    }
    (chunk.items || []).forEach(it => {
      const found = ALL_LESSONS.find(x => x.id === it.id);
      if (found) {
        Object.assign(found, it, { unitId, unitName: targetUnit ? targetUnit.unitName : '' });
      }
    });
    cb && cb(true);
    return;
  }

  if (cb) (chunkLoadWaiters[unitId] || (chunkLoadWaiters[unitId] = [])).push(cb);
  if (loadedChunks[unitId] === 'loading') {
    return;
  }

  loadedChunks[unitId] = 'loading';
  const s = document.createElement('script');
  s.src = `data/reading_${unitId}.js`;
  s.onload = function() {
    if (window.__STUDY4_READ_CHUNK && window.__STUDY4_READ_CHUNK[unitId]) {
      loadedChunks[unitId] = 'done';
      ensureChunkLoaded(unitId);
      finishChunkLoad(unitId, true);
    } else {
      loadedChunks[unitId] = 'error';
      console.error('Chunk loaded without data for ' + unitId);
      finishChunkLoad(unitId, false);
    }
  };
  s.onerror = function() {
    console.error('Failed to load chunk for ' + unitId);
    loadedChunks[unitId] = 'error';
    finishChunkLoad(unitId, false);
  };
  document.head.appendChild(s);
}

function getBookName(str) {
  const s = str || '';
  let m = s.match(/(IELTS Collection \d+|Collection \d+)/i);
  if (m) return m[1].replace(/^Collection/i, 'IELTS Collection');
  m = s.match(/(Practice Set \d+)/i);
  if (m) return m[1];
  if (/Simulation/i.test(s)) return 'IELTS Simulation Tests';
  if (/BC Test/i.test(s)) return 'British Council (BC) Tests';
  if (/Sample Test/i.test(s)) return 'IELTS Sample Tests';
  return 'Bộ đề khác';
}

function getTestName(str) {
  const s = str || '';
  const m = s.match(/(Test \d+)/i);
  return m ? m[1] : s.split('|')[0].trim();
}

const S4_BOOK_SERIES_ORDER = [
  { re: /^IELTS Collection\s*(\d+)/i, rank: 1 },
  { re: /Simulation/i, rank: 2 },
  { re: /British Council \(BC\)/i, rank: 3 },
  { re: /Asia Guide/i, rank: 4 },
  { re: /Sample Tests/i, rank: 5 },
  { re: /^Practice Set\s*(\d+)/i, rank: 6 }
];
function getBookSortKey(name) {
  for (const row of S4_BOOK_SERIES_ORDER) {
    const m = name.match(row.re);
    if (m) return [row.rank, m[1] ? parseInt(m[1], 10) : 0];
  }
  return [99, 0];
}
function sortBookKeys(keys) {
  return [...keys].sort((a, b) => {
    const ra = getBookSortKey(a), rb = getBookSortKey(b);
    return ra[0] !== rb[0] ? ra[0] - rb[0] : ra[1] - rb[1];
  });
}
function sortTestKeys(keys) {
  return [...keys].sort((a, b) => {
    const ma = a.match(/\bTest\s*(\d+)/i), mb = b.match(/\bTest\s*(\d+)/i);
    return (ma && mb) ? parseInt(ma[1], 10) - parseInt(mb[1], 10) : 0;
  });
}

let wordAudioToken = 0;
function playWordAudio(v, lang = 'en-GB') {
  if (!v) return;
  const token = ++wordAudioToken;
  const wordText = v.origin || v.word || v.term || '';
  const url = lang === 'en-US' ? (v.usAudio || v.ukAudio) : (v.ukAudio || v.usAudio);
  const isPrivateTts = url && (url.includes('/ai_services/tts') || url.includes('study4.com/login'));
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  const player = document.getElementById('ttsAudioPlayer');
  if (player) {
    try { player.pause(); } catch (e) {}
  }
  if (url && !isPrivateTts && player) {
    const fullUrl = url.startsWith('http') ? url : 'https://study4.com' + url;
    player.src = fullUrl;
    player.play().catch(() => {
      if (token !== wordAudioToken) return;
      speakWordFallback(wordText, lang, token);
    });
  } else {
    speakWordFallback(wordText, lang, token);
  }
}

function speakWordFallback(text, lang = 'en-GB', token = wordAudioToken) {
  if (token !== wordAudioToken) return;
  if (!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

  listEl.innerHTML = html || `<div class="s4-empty-state" style="margin-top:8px;padding:24px 12px;">
    <div style="font-size:26px;">🔍</div>
    <div style="font-size:13.5px;font-weight:800;color:var(--text);">Không tìm thấy mục Reading phù hợp</div>
    ${q ? `<div style="font-size:12px;">Từ khóa "<strong>${safeQ}</strong>" không khớp mục nào.</div>` : ''}
    <button type="button" class="s4-pz-clear-chip" onclick="window.clearReadingSidebarSearch()">✕ Xóa tìm kiếm</button>
  </div>`;
  if (!q) saveCacheSafe('s4_read_last_sidebar_html', listEl.innerHTML, 100000);
};

function getActiveVocabList() {
  if (!currentLesson || !currentLesson.problem) return [];
  if (currentLesson.problem.pType === 'topic_flashcards') {
    return (currentLesson.problem.words || []).map(w => ({
      term: w.word,
      origin: w.word,
      pos: (w.pos || '').replace(/[()]/g, ''),
      ipa: w.ipa || '',
      vi: w.defVi || '',
      en: w.defEn || '',
      examples: w.examples || [],
      ukAudio: w.ukAudio || '',
      usAudio: w.usAudio || ''
    }));
  }
  return currentLesson.problem.vocabList || [];
}


function closeMobileDrawerState() {
  const sb = document.querySelector('.sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (sb) sb.classList.remove('open');
  if (bd) bd.classList.remove('open');
  document.body.classList.remove('sidebar-open');
}

window.toggleMobileSidebar = function(force) {
  if (window.innerWidth > 768) {
    closeMobileDrawerState();
    const nextCol = (typeof force === 'boolean') ? !force : !document.body.classList.contains('sidebar-collapsed');
    document.body.classList.toggle('sidebar-collapsed', nextCol);
    const deskLbl = document.querySelector('#btnToggleSidebar .s4-desk-sb-lbl');
    if (deskLbl) deskLbl.textContent = nextCol ? '☰ Mở mục lục' : '◀ Ẩn mục lục';
    return;
  }
  const sb = document.querySelector('.sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (!sb) return;
  const isOpen = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', isOpen);
  if (bd) bd.classList.toggle('open', isOpen);
  document.body.classList.toggle('sidebar-open', isOpen);
};

window.addEventListener('resize', function () {
  if (window.innerWidth > 768) closeMobileDrawerState();
});
if (window.matchMedia) {
  const rMq = window.matchMedia('(min-width: 769px)');
  if (rMq.addEventListener) rMq.addEventListener('change', (e) => { if (e.matches) closeMobileDrawerState(); });
  else if (rMq.addListener) rMq.addListener((e) => { if (e.matches) closeMobileDrawerState(); });
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) closeMobileDrawerState();
});

window.selectLesson = function(id, forcedMode) {
  let meta = ALL_LESSONS.find(x => x.id === id);
  const isPzId = String(id || '').startsWith('read_pz_');
  if (!meta && isPzId) {
    if (window.S4PracticeZone && typeof window.S4PracticeZone.resolveReadingPzLesson === 'function') {
      meta = window.S4PracticeZone.resolveReadingPzLesson(id);
    }
    if (!meta && window.S4PracticeZone && typeof window.S4PracticeZone.getActiveReadLobbyLesson === 'function') {
      const act = window.S4PracticeZone.getActiveReadLobbyLesson();
      if (act && act.id === id) meta = act;
    }
    // Hỗ trợ gọi trực tiếp từ Lịch sử sau khi tải lại trang (chưa tải reading_practice_zone.js)
    if (!meta && !window.__STUDY4_READ_PZ && window.S4PracticeZone && typeof window.S4PracticeZone.ensureReadingPzLoaded === 'function') {
      window.S4PracticeZone.ensureReadingPzLoaded(() => {
        if (window.__STUDY4_READ_PZ) window.selectLesson(id, forcedMode);
      });
      return;
    }
  }
  if (!meta) return;

  const isPzDirect = !!(meta.isPzDirect || isPzId);
  const pzBtn = document.getElementById('topBtn_pz');
  const wasPzActive = (pzBtn && pzBtn.classList.contains('active')) ||
                      (window.S4PracticeZone && (window.S4PracticeZone.isReadingLobbyOpen() || window.S4PracticeZone.isReadingHubOpen()));

  // Nếu đang ở Practice Zone (ở Kho đề hoặc ở Sảnh) và chọn đề thi Unit 2 ở Sidebar:
  // Giữ nguyên chế độ Practice Zone và mở thẳng Sảnh thi của đề đó (chuẩn thống nhất 100% với Listening)
  if (wasPzActive && meta.unitId === 'u_2' && forcedMode !== 'practice_test') {
    if (pzBtn) pzBtn.classList.add('active');
    const u2Btn = document.getElementById('topBtn_u_2');
    if (u2Btn) u2Btn.classList.remove('active');
    if (!isPzDirect) {
      localStorage.setItem(LAST_KEY, id);
      syncActiveUnitUI(meta);
    }
    currentLesson = meta;
    window.currentLesson = meta;
    if (window.S4PracticeZone && window.S4PracticeZone.setActiveReadLobbyLesson) {
      window.S4PracticeZone.setActiveReadLobbyLesson(meta);
    }
    if (typeof window.s4PzOpenReadingLobby === 'function') {
      window.s4PzOpenReadingLobby(meta.id, true);
      renderSidebar();
      scrollActiveLessonIntoView(false);
      return;
    }
  }

  // Nếu chọn bài học khác Unit 2 hoặc không ở Practice Zone: đóng Hub và dọn dẹp CBT mode
  if (window.S4PracticeZone) {
    window.S4PracticeZone.setReadingHubOpen(false);
    if (meta.unitId !== 'u_2' || forcedMode !== 'lobby') {
      window.S4PracticeZone.closeReadingLobby();
    }
  }
  if (pzBtn) pzBtn.classList.toggle('active', forcedMode === 'practice_test');
  if (!isPzDirect) {
    localStorage.setItem(LAST_KEY, id);
    syncActiveUnitUI(meta);
  } else {
    ['u_3', 'u_2', 'u_1', 'u_4'].forEach(uid => {
      const btn = document.getElementById('topBtn_' + uid);
      if (btn) btn.classList.remove('active');
    });
  }

  if (forcedMode === 'practice_test') {
    if (pzBtn) pzBtn.classList.add('active');
    const u2Btn = document.getElementById('topBtn_u_2');
    if (u2Btn) u2Btn.classList.remove('active');
    if (window.S4PracticeZone) window.S4PracticeZone.enterCbtExamMode(false);
    else document.body.classList.add('s4-cbt-mode');
  } else {
    if (window.S4PracticeZone) {
      window.S4PracticeZone.exitCbtExamMode();
      if (window.S4PracticeZone.closeReadingLobby && forcedMode !== 'lobby') {
        window.S4PracticeZone.closeReadingLobby();
      }
    } else {
      document.body.classList.remove('s4-cbt-mode');
    }
  }

  currentLesson = meta;
  window.currentLesson = meta;
  if (meta.unitId === 'u_2' && window.S4PracticeZone && window.S4PracticeZone.setActiveReadLobbyLesson) {
    window.S4PracticeZone.setActiveReadLobbyLesson(meta);
  }

  renderSidebar();
  scrollActiveLessonIntoView(false);

  const finalizeLessonSelection = function(found) {
    if (!found) return;
    currentLesson = found;
    window.currentLesson = found;
    if (!found.isPzDirect && !String(found.id || '').startsWith('read_pz_')) {
      try {
        saveCacheSafe('s4_read_last_lesson_cache', JSON.stringify(found), 90000);
      } catch(e) {}
    }

    if (forcedMode) {
      currentMode = forcedMode;
    } else if (found.isPzDirect || String(found.id || '').startsWith('read_pz_')) {
      currentMode = 'practice_test';
    } else if (found.problem && found.problem.pType === 'topic_flashcards') {
      currentMode = 'smart_learn';
    } else if (found.problem && found.problem.pType === 'reading_vocab') {
      currentMode = 'passage';
    } else {
      currentMode = 'video';
    }

    if (window.innerWidth <= 768 && typeof toggleMobileSidebar === 'function') {
      toggleMobileSidebar(false);
    }

    selectedVocabIdx = 0;

    if (!found.isPzDirect && !String(found.id || '').startsWith('read_pz_') && (currentMode === 'practice_test' || currentMode === 'synonyms')) {
      ensureSynonymsLoaded(() => {
        renderSidebar();
        renderMain();
      });
    } else {
      renderSidebar();
      renderMain();
    }
    document.getElementById('mainArea').scrollTop = 0;
  };

  if (isPzDirect) {
    finalizeLessonSelection(meta);
    return;
  }

  ensureChunkLoaded(meta.unitId, function() {
    const found = ALL_LESSONS.find(x => x.id === id);
    finalizeLessonSelection(found);
  });
};

window.selectSynUid = function(uid, side) {
  if (!uid) return;
  if (synSubMode === 'practice' && side === 'left') {
    const synData = getActiveSynData();
    const pairs = synData.pairs || [];
    const curPair = pairs[synPracIdx];
    if (!curPair) return;
    if (uid === curPair.uid) {
      synPracIsCorrect = true;
      synPracFeedback = `✓ Chính xác! "${curPair.questionPhrase}" = "${curPair.passagePhrase}"`;
      activeSynUid = uid;
      renderMain();
      setTimeout(() => {
        if (currentMode === 'synonyms' && synSubMode === 'practice' && synPracIsCorrect) {
          stepSynPractice(1);
        }
      }, 1100);
    } else {
      synPracIsCorrect = false;
      const clickedPair = pairs.find(p => p.uid === uid);
      synPracFeedback = `✗ Chưa đúng (bạn vừa chọn "${clickedPair ? clickedPair.passagePhrase : '...'}") — Đáp án đúng: <span class="dic-ans-hint">✓ ${curPair.passagePhrase}</span>`;
      activeSynUid = curPair.uid;
      renderMain();
      setTimeout(() => scrollSynUidIntoView(curPair.uid, 'left'), 60);
    }
    return;
  }
  activeSynUid = uid;
  highlightActiveSynUidInDom(uid);
  const targetSide = side === 'left' ? 'right' : 'left';
  scrollSynUidIntoView(uid, targetSide);
};

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightVocabInText(text, vocabList) {
  if (!vocabList || !vocabList.length) return text;
  let result = text;
  const indexed = vocabList.map((v, idx) => ({ ...v, idx })).filter(v => v.term && v.term.length > 2);
  indexed.sort((a, b) => b.term.length - a.term.length);

  const placeholders = [];
  indexed.forEach(v => {
    const pattern = new RegExp(`\\b(${escapeRegExp(v.term)})\\b`, 'gi');
    result = result.replace(pattern, (match) => {
      const pid = `@@VOCAB_${placeholders.length}@@`;
      placeholders.push(`<span class="vocab-hl" onclick="inspectVocab(${v.idx})" title="${(v.vi || '').replace(/"/g, '&quot;')}">${match}</span>`);
      return pid;
    });
  });

  placeholders.forEach((html, i) => {
    result = result.replace(`@@VOCAB_${i}@@`, html);
  });
  return result;
}

window.S4FormatTheoryHtml = function(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return '';
  let html = rawHtml;

  // 1. Remove empty spacer paragraphs (<p>&nbsp;</p>, <p><span>&nbsp;</span></p>, etc.)
  html = html.replace(/<p\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>|<(?:span|strong|em|u)\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>)*<\/(?:span|strong|em|u)>)*<\/p>/gi, '');

  // 2. Convert Google Docs single-item <ol><li style="list-style-type:upper-roman|decimal"><h1|h2>...</h1|h2></li></ol> into structured section headers
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  html = html.replace(/<ol(?:\s+start="(\d+)")?\s*>\s*<li\b([^>]*)>\s*<(h[1-3])\b[^>]*>([\s\S]*?)<\/\3>\s*<\/li>\s*<\/ol>/gi, function(m, startNum, liAttr, hTag, inner) {
    const idx = startNum ? Math.max(1, parseInt(startNum, 10)) : 1;
    const isRoman = /upper-roman/i.test(liAttr);
    const isAlpha = /upper-alpha/i.test(liAttr);
    const badge = isRoman ? (ROMAN[idx - 1] || idx) : (isAlpha ? String.fromCharCode(64 + idx) : String(idx));
    const isSub = hTag.toLowerCase() !== 'h1' && !isRoman;
    const cleanInner = inner.replace(/&nbsp;/gi, ' ').trim();
    if (isSub) {
      return '<div class="s4-subsec-heading"><span class="s4-subsec-badge">' + badge + '</span><span class="s4-subsec-title">' + cleanInner + '</span></div>';
    }
    return '<div class="s4-sec-heading"><span class="s4-sec-badge">' + badge + '</span><span class="s4-sec-title">' + cleanInner + '</span></div>';
  });

  // 3. Convert Google Docs fake bullet paragraphs <p style="...list-style-type:disc...">...</p>
  html = html.replace(/<p\b([^>]*style\s*=\s*"[^"]*list-style-type\s*:\s*disc[^"]*"[^>]*)>([\s\S]*?)<\/p>/gi, '<p class="s4-pseudo-li">$2</p>');

  // 4. Process all tags with a style="..." attribute
  html = html.replace(/<([a-zA-Z0-9]+)\b([^>]*?)\sstyle\s*=\s*"([^"]*)"([^>]*)>/gi, function(full, tag, before, styleStr, after) {
    const t = tag.toLowerCase();
    const classes = [];
    let s = styleStr;

    // Highlight background colors -> soft pastel badge classes
    if (/background(?:-color)?\s*:\s*#ffff00\b/i.test(s)) {
      classes.push('s4-hl-amber');
      s = s.replace(/background(?:-color)?\s*:\s*#ffff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ffff\b/i.test(s)) {
      classes.push('s4-hl-sky');
      s = s.replace(/background(?:-color)?\s*:\s*#00ffff\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ff00\b/i.test(s)) {
      classes.push('s4-hl-emerald');
      s = s.replace(/background(?:-color)?\s*:\s*#00ff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#ff9900\b/i.test(s)) {
      classes.push('s4-hl-rose');
      s = s.replace(/background(?:-color)?\s*:\s*#ff9900\s*;?/gi, '');
    }

    // Table header / accent cell backgrounds (#9fc5e8, #a4c2f4)
    if (/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\b/i.test(s)) {
      classes.push('s4-td-accent');
      s = s.replace(/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\s*;?/gi, '');
    }

    // Strip white / light gray / transparent backgrounds that break Dark Mode
    s = s.replace(/background(?:-color)?\s*:\s*(?:#ffffff|#fff|#f1f3f5|white|transparent)\s*;?/gi, '');

    // Foreground text colors
    if (/(?:^|[;\s])color\s*:\s*#ff0000\b/i.test(s)) {
      classes.push('s4-txt-red');
      s = s.replace(/(?:^|[;\s])color\s*:\s*#ff0000\s*;?/gi, '');
    }
    if (/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))/i.test(s)) {
      classes.push('s4-txt-blue');
      s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))\s*;?/gi, '');
    }
    // Strip hardcoded dark/black text colors
    s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#000000|#000|black|#1a1a1a|#242938)\s*;?/gi, '');

    // Clean up table, td, th, img, span fixed pixel dimensions & borders
    if (t === 'table' || t === 'td' || t === 'th' || t === 'img' || t === 'span') {
      s = s.replace(/\b(?:width|height)\s*:\s*[\d.]+px\s*;?/gi, '');
      s = s.replace(/\btable-layout\s*:\s*fixed\s*;?/gi, '');
      s = s.replace(/\bborder(?:-(?:top|bottom|left|right))?\s*:\s*[\d.]+px\s+solid\s+#[0-9a-fA-F]+\s*;?/gi, '');
      s = s.replace(/\boverflow\s*:\s*hidden\s*;?/gi, '');
    }

    // Soften excessive Google Docs left margins and remove justify alignment
    s = s.replace(/\btext-align\s*:\s*justify\s*;?/gi, '');
    s = s.replace(/\bmargin-left\s*:\s*(\d+)px\s*;?/gi, function(_, px) {
      const n = parseInt(px, 10);
      if (n >= 120) return 'margin-left:28px;';
      if (n >= 70) return 'margin-left:20px;';
      if (n >= 36) return 'margin-left:12px;';
      return '';
    });

    s = s.replace(/;\s*;/g, ';').trim().replace(/^;+|;+$/g, '').trim();

    let combinedBeforeAfter = before + after;
    if (classes.length > 0) {
      if (/\bclass\s*=\s*"([^"]*)"/i.test(combinedBeforeAfter)) {
        combinedBeforeAfter = combinedBeforeAfter.replace(/\bclass\s*=\s*"([^"]*)"/i, function(_, existing) {
          return 'class="' + (existing + ' ' + classes.join(' ')).trim() + '"';
        });
      } else {
        combinedBeforeAfter = ' class="' + classes.join(' ') + '"' + combinedBeforeAfter;
      }
    }

    const styleAttr = s ? ' style="' + s + '"' : '';
    return '<' + tag + combinedBeforeAfter + styleAttr + '>';
  });

  // 5. Move leading/trailing spaces outside highlight pills so borders hug the words cleanly
  html = html.replace(/<span\s+class="(s4-hl-[a-z0-9\s-]+)">(\s*)([\s\S]*?)(\s*)<\/span>/gi, function(m, cls, lead, inner, trail) {
    if (!inner.trim()) return lead + trail;
    return (lead || '') + '<span class="' + cls + '">' + inner + '</span>' + (trail || '');
  });

  // 6. Merge accidentally split paragraph lines right before "⇒ Paragraph X" (e.g. Question 18 in L15)
  html = html.replace(/<p>([\s\S]*?,)<\/p>\s*<p>(\s*(?:<span[^>]*>)*\s*[a-z][\s\S]*?)<\/p>(?=\s*<p[^>]*>\s*(?:<[^>]+>)*\s*(?:⇒|→|=>)\s*Paragraph)/gi, '<p>$1 $2</p>');

  // 7. Classify <p> blocks into Step Callouts, Question Cards, Passage Excerpts, Answer Pills, and Note Callouts
  html = html.replace(/<p(\b[^>]*)>([\s\S]*?)<\/p>/gi, function(full, pAttr, inner) {
    if (/s4-pseudo-li/i.test(pAttr)) return full;
    const plain = inner.replace(/<[^>]+>/g, '').replace(/&nbsp;|\u00a0/g, ' ').replace(/&rarr;/g, '→').replace(/\s+/g, ' ').trim();
    if (!plain) return full;

    // 7a. Step Callout: "Bước 1: ...", "Bước 3 + Bước 4 + Bước 5"
    if (/^Bước\s*\d+/i.test(plain) && plain.length < 160) {
      return '<div class="s4-step-callout"><span class="s4-step-icon">🧭</span><div class="s4-step-body">' + inner + '</div></div>';
    }

    // 7b. Question Card: "Question 14: ...", "Practice 1: ..."
    if (/^(?:Question\s*\d+|Practice\s*\d+)\s*[:.]/i.test(plain)) {
      const decorated = inner.replace(/(?:<u>\s*)?(Question\s*\d+|Practice\s*\d+)\s*:?\s*(?:<\/u>)?(?:\s*<\/span>\s*<span[^>]*>)?\s*[:.]?\s*/i, '<span class="s4-q-badge">$1</span> ');
      return '<div class="s4-question-card">' + decorated + '</div>';
    }

    // 7c. Passage Excerpt: starts with "A. ", "B. ", ..., "I. " and is a passage paragraph (> 60 chars)
    if (/^[A-I]\.\s+/.test(plain) && plain.length > 60) {
      const decorated = inner.replace(/^(\s*(?:<[^>]+>\s*)*)([A-I])\.?(\s*(?:<\/[^>]+>\s*)*)/, '$1<span class="s4-para-badge">Đoạn $2</span>$3 ');
      return '<div class="s4-passage-excerpt">' + decorated + '</div>';
    }

    // 7d. Answer Pill or Conclusion Box: starts with "→", "⇒", "=>", or "Đáp án:"
    if (/^(?:→|⇒|=>)\s*/i.test(plain) || /^Đáp án\s*:/i.test(plain)) {
      const isShortAnswer = /^(?:→|⇒|=>)\s*(?:Paragraph\s+[A-Z]|Đáp án|Key|Answer|Main topic)/i.test(plain) || /^Đáp án\s*:/i.test(plain) || plain.length < 75;
      if (isShortAnswer) {
        return '<div class="s4-answer-wrap"><div class="s4-answer-pill">🎯 ' + inner.replace(/^(\s*(?:<[^>]+>\s*)*)(?:→|⇒|=>)\s*/, '$1') + '</div></div>';
      }
      return '<div class="s4-conclusion-box">' + inner + '</div>';
    }

    // 7e. Note Callout: starts with "Lưu ý:", "Chú ý:"
    if (/^(?:Lưu ý|Chú ý|Mẹo)\s*:/i.test(plain)) {
      return '<div class="s4-note-callout">💡 ' + inner + '</div>';
    }

    return full;
  });

  return html;
};

function getReadingUnitPool() {
  if (!currentLesson) return ALL_LESSONS;
  const unitList = ALL_LESSONS.filter(x => x.unitId === currentLesson.unitId);
  return unitList.length ? unitList : ALL_LESSONS;
}

window.stepReadingLesson = function(delta) {
  if (!currentLesson) return;
  const pool = getReadingUnitPool();
  const idx = pool.findIndex(x => x.id === currentLesson.id);
  const nextIdx = idx + Number(delta || 0);
  if (idx >= 0 && nextIdx >= 0 && nextIdx < pool.length) {
    selectLesson(pool[nextIdx].id);
  }
};

      }
    } else {
      bodyHtml = '<div id="s4VocabMount"></div>';
    }
  }

  const navPool = getReadingUnitPool();
  const navIdx = navPool.findIndex(x => x.id === currentLesson.id);
  const prevLessonObj = navIdx > 0 ? navPool[navIdx - 1] : null;
  const nextLessonObj = (navIdx >= 0 && navIdx + 1 < navPool.length) ? navPool[navIdx + 1] : null;
  const escNavTitle = (t) => String(t || '').replace(/"/g, '&quot;');
  const prevBtnAttrs = prevLessonObj
    ? `title="Bài trước: ${escNavTitle(prevLessonObj.title)}" onclick="stepReadingLesson(-1)"`
    : 'disabled title="Đã ở bài đầu tiên"';
  const nextBtnAttrs = nextLessonObj
    ? `title="Bài tiếp theo: ${escNavTitle(nextLessonObj.title)}" onclick="stepReadingLesson(1)"`
    : 'disabled title="Đã ở bài cuối cùng"';

  container.innerHTML = `
    <div class="lesson-header">
      <div>
        <div class="lesson-unit-tag">${currentLesson.group || currentLesson.unitName}</div>
        <h1 class="lesson-title">${currentLesson.title}</h1>
      </div>
      <div class="lesson-actions" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span class="s4-lesson-nav-group">
          <button type="button" class="btn mini-btn" id="btnPrevReadLesson" ${prevBtnAttrs}>◀ Bài trước</button>
          <button type="button" class="btn mini-btn" id="btnNextReadLesson" ${nextBtnAttrs}>Bài tiếp theo ▶</button>
        </span>
        <button class="btn btn-done ${isDone ? 'completed' : ''}" onclick="toggleDoneCurrent()">
          ${isDone ? '✓ Đã hoàn thành' : '○ Đánh dấu hoàn thành'}
        </button>
      </div>
    </div>
    ${bodyHtml}
    <div class="s4-lesson-footer-nav">
      <button type="button" class="btn mini-btn" ${prevBtnAttrs}>◀ Bài trước</button>
      <span class="s4-lesson-footer-pos">${navIdx >= 0 ? `Bài ${navIdx + 1}/${navPool.length}` : ''}</span>
      <button type="button" class="btn btn-primary" ${nextBtnAttrs}>Bài tiếp theo ▶</button>
    </div>
  `;

  if (pType === 'reading_vocab' && currentMode === 'passage') {
    renderInspectorOnly();
  } else if (pType === 'reading_vocab' && currentMode === 'practice_test' && window.S4PracticeZone) {
    ensureSynonymsLoaded(() => {
      window.S4PracticeZone.mountReadingDomEvents(currentLesson, ALL_LESSONS);
    });
    window.S4PracticeZone.mountReadingDomEvents(currentLesson, ALL_LESSONS);
  } else if (pType === 'reading_vocab' && currentMode === 'synonyms') {
    ensureSynonymsLoaded(() => {
      bindSynColumnClicks();
    });
    bindSynColumnClicks();
  } else if (pType !== 'video' && currentLesson.problem && window.S4VocabEngine) {
    const modeMap = { smart_learn: 'smart', srs_review: 'flashcard', flashcards: 'list', matching: 'match', spelling: 'cloze' };
    const m = (pType === 'topic_flashcards' && currentMode === 'smart_learn')
      ? null
      : (modeMap[currentMode] || (['smart','flashcard','quiz','listen','match','cloze','list'].includes(currentMode) ? currentMode : 'smart'));
    window.S4VocabEngine.mount('s4VocabMount', currentLesson.id, getActiveVocabList(), currentLesson.title, m);
  }
  try {
    saveCacheSafe('s4_read_last_rendered_html', container.innerHTML, 120000);
  } catch(e) {}
  if (window.applyThemeState) window.applyThemeState();
}

// Init: Restore instant cache or open default lesson
updateTopProgress();
const lastId = localStorage.getItem(LAST_KEY);
const defaultLesson = ALL_LESSONS.find(x => x.unitId === 'u_3') || ALL_LESSONS[0];
const initialLesson = ALL_LESSONS.find(x => x.id === lastId) || defaultLesson;

let cachedLesson = null;
try {
  cachedLesson = JSON.parse(localStorage.getItem('s4_read_last_lesson_cache') || 'null');
} catch(e) {}

if (cachedLesson && initialLesson && cachedLesson.id === initialLesson.id) {
  currentLesson = cachedLesson;
  syncActiveUnitUI(currentLesson);
  if (currentLesson.problem && currentLesson.problem.pType === 'topic_flashcards') {
    currentMode = 'smart_learn';
  } else if (currentLesson.problem && currentLesson.problem.pType === 'reading_vocab') {
    currentMode = 'passage';
  } else {
    currentMode = 'video';
  }
  renderSidebar();
  renderMain();
  scrollActiveLessonIntoView(false);
  ensureChunkLoaded(currentLesson.unitId, function() {
    const fresh = ALL_LESSONS.find(x => x.id === currentLesson.id);
    if (fresh) {
      const needReRender = !currentLesson.problem;
      currentLesson = fresh;
      if (needReRender) renderMain();
    }
    renderSidebar();
    scrollActiveLessonIntoView(false);
  });
} else if (initialLesson) {
  selectLesson(initialLesson.id);
}

</script>
