<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaThemeColor" content="#0d1813">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = (d === "1");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
      window.toggleDark = function() {
        if (window.toggleDarkModeOnly) {
          window.toggleDarkModeOnly();
        } else {
          var curDark = localStorage.getItem("s4_vocab_dark") !== "0";
          var nextDark = !curDark;
          localStorage.setItem("s4_vocab_dark", nextDark ? "1" : "0");
          document.documentElement.classList.toggle("dark", nextDark);
          if (document.body) document.body.classList.toggle("dark", nextDark);
          document.querySelectorAll('.dark-btn').forEach(function(b) {
            b.textContent = nextDark ? '☀️' : '🌙';
            b.title = nextDark ? 'Đang ở chế độ Tối — Bấm để chuyển sang Sáng' : 'Đang ở chế độ Sáng — Bấm để chuyển sang Tối';
          });
        }
      };
    } catch (e) {}
  })();
  </script>
<title>LinguaPath IELTS Reading — Free for Community</title>

<link rel="preload" href="data/reading_manifest.js" as="script">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --card: #334155;
    --border: rgba(148, 163, 184, 0.18);
    --text: #f8fafc;
    --sub-text: #cbd5e1;
    --muted: #94a3b8;
    --primary: #10b981;
    --primary-hover: #059669;
    --accent: #38bdf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --hl-gold: #fde68a;
    --hl-green: #34d399;
    --hl-cyan: #38bdf8;
    --box-sub: rgba(15, 23, 42, 0.6);
    --vi-bg: rgba(56, 189, 248, 0.1);
    --vi-text: #bae6fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* Topbar */
  .topbar {
    min-height: 58px;
    background:var(--box-sub);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
    z-index: 20;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    text-decoration: none;
    color: var(--text);
    background: rgba(255,255,255,0.07);
    padding: 7px 12px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .back-btn:hover { background: rgba(255,255,255,0.14); transform: translateX(-2px); }
  .brand-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .top-switch {
    display: flex;
    background: rgba(30, 41, 59, 0.9);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    gap: 4px;
    overflow-x: auto;
  }
  .top-switch-btn {
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
  }
  .top-switch-btn.active {
    background: var(--primary);
    color: #052e16;
  }
  .prog-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    color:var(--text);
    white-space: nowrap;
  }

  /* Workspace */
  .workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .sidebar {
    width: 355px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-height: 0;
    height: 100%;
  }
  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-row { display: flex; gap: 6px; }
  .search-input {
    flex: 1;
    padding: 8px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background:var(--box-sub);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
  }
  .search-input:focus { border-color: var(--primary); }
  .mini-btn {
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

  /* 3-Level Collapsible Tree Sidebar - Block flow so items never squish or overlap */
  .lesson-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    display: block;
  }
  .folder-box {
    border: 1px solid var(--border);
    border-radius: 11px;
    background:var(--box-sub);
    margin-bottom: 9px;
  }
  .folder-header {
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  .folder-header:hover { background: rgba(255,255,255,0.07); }
  .folder-title {
    font-size: 12.5px;
    font-weight: 800;
    color:var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.35;
  }
  .folder-meta {
    font-size: 11px;
    font-weight: 700;
    color:var(--hl-cyan);
    background: rgba(56, 189, 248, 0.12);
    padding: 2px 7px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .folder-body {
    padding: 6px 8px 8px;
    border-top: 1px solid var(--border);
    display: block;
  }
  .folder-box.collapsed > .folder-body { display: none; }
  .folder-arrow {
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.18s;
    display: inline-block;
  }
  .folder-box:not(.collapsed) > .folder-header .folder-arrow { transform: rotate(90deg); }

  /* Level 2 Book Folder */
  .subfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 9px;
    background: rgba(30, 41, 59, 0.5);
    margin-bottom: 6px;
  }
  .subfolder-header {
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color:var(--sub-text);
    user-select: none;
  }
  .subfolder-header:hover { background: rgba(255,255,255,0.05); }
  .subfolder-body {
    padding: 5px 6px 6px;
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    display: block;
    background:var(--box-sub);
  }
  .subfolder-box.collapsed > .subfolder-body { display: none; }
  .subfolder-box:not(.collapsed) > .subfolder-header .folder-arrow { transform: rotate(90deg); }

  /* Level 3 Test Folder */
  .testfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 7px;
    background: rgba(30, 41, 59, 0.35);
    margin-bottom: 5px;
  }
  .testfolder-header {
    padding: 6px 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    color:var(--muted);
    user-select: none;
  }
  .testfolder-header:hover { color:var(--text); background: rgba(255,255,255,0.04); }
  .testfolder-body {
    padding: 4px 5px 5px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
    display: block;
  }
  .testfolder-box.collapsed > .testfolder-body { display: none; }
  .testfolder-box:not(.collapsed) > .testfolder-header .folder-arrow { transform: rotate(90deg); }

  .lesson-item {
    padding: 8px 10px;
    border-radius: 7px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  .lesson-item:hover { background: rgba(255,255,255,0.07); }
  .lesson-item.active {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.45);
  }
  .lesson-item-title { font-size: 12px; font-weight: 600; color:var(--text); line-height: 1.35; }
  .lesson-item-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .done-badge {
    width: 17px; height: 17px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    flex-shrink: 0;
  }
  .lesson-item.done .done-badge {
    background: rgba(16, 185, 129, 0.22);
    color:var(--hl-green);
  }

  /* Main Area */
  .main-area { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 26px 60px; }
  .lesson-container { max-width: 1060px; margin: 0 auto;  }
  .lesson-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-unit-tag { font-size: 11px; font-weight: 800; color:var(--hl-cyan); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .lesson-title { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .btn {
    padding: 7px 13px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #052e16; }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }
  .btn-done.completed { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color:var(--hl-green); }

  /* Mode Bar */
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 18px;
    background: rgba(30, 41, 59, 0.85);
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .mode-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
  .mode-tab {
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.16s;
  }
  .mode-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .mode-tab.active {
    background: rgba(16, 185, 129, 0.18);
    color:var(--hl-green);
    border-color: rgba(16, 185, 129, 0.4);
  }

  /* Smart Learn & SRS Banner */
  .srs-stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 720px) { .srs-stats-bar { grid-template-columns: repeat(2, 1fr); } }
  .srs-stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .srs-stat-num { font-size: 20px; font-weight: 800; }
  .srs-stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  /* Smart Learn Card */
  .smart-box {
    max-width: 680px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .step-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .step-pill {
    flex: 1;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.08);
  }
  .step-pill.done { background: var(--primary); }
  .step-pill.active { background: #38bdf8; }
  .example-list {
    margin-top: 12px;
    padding: 12px 14px;
    background:var(--box-sub);
    border-radius: 10px;
    border-left: 3px solid #38bdf8;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    color:var(--text);
  }

  /* SRS Rating Buttons */
  .srs-rate-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .srs-btn {
    padding: 11px 10px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.15s;
  }
  .srs-btn:hover { transform: translateY(-2px); }
  .srs-btn.Hard { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .srs-btn.Good { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.45); color:var(--hl-gold); }
  .srs-btn.Easy { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }

  /* Video + Theory */
  .video-box {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .theory-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
    line-height: 1.75;
    font-size: 15px;
    color:var(--text);
  }
  .theory-card h1, .theory-card h2, .theory-card h3 { color:var(--hl-cyan); margin: 18px 0 10px; font-size: 18px; }
  .theory-card p { margin-bottom: 12px; }
  .theory-card ul, .theory-card ol { margin: 8px 0 14px 24px; }
  .theory-card li { margin-bottom: 6px; }
  .theory-card table { width: 100% !important; border-collapse: collapse; margin: 14px 0; background:var(--box-sub); }
  .theory-card td, .theory-card th { border: 1px solid var(--border) !important; padding: 8px 12px !important; color:var(--text) !important; }
  .theory-card img { max-width: 100% !important; height: auto !important; border-radius: 10px; margin: 10px 0; }

  /* Reading Split Layout */
  .reading-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 960px) { .reading-grid { grid-template-columns: 1fr; } }
  .passage-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px 26px; }
  .para-block { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px dashed rgba(148, 163, 184, 0.14); }
  .para-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .para-en { font-size: 15.5px; line-height: 1.8; color:var(--text); }
  .para-vi {
    margin-top: 8px;
    padding: 10px 14px;
    background:var(--vi-bg);
    border-left: 3px solid #38bdf8;
    border-radius: 6px;
    font-size: 13.8px;
    line-height: 1.65;
    color:var(--vi-text);
  }
  .vocab-hl {
    background: rgba(16, 185, 129, 0.18);
    color: #6ee7b7;
    border-bottom: 1.5px dashed #34d399;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .vocab-hl:hover { background: rgba(16, 185, 129, 0.35); color: #fff; }

  /* Reading Synonyms & Paraphrase (2-Column Split + Practice + Table) */
  .syn-subbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .syn-sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .syn-sub-btn {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--box-sub);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .syn-sub-btn:hover { border-color: var(--primary); }
  .syn-sub-btn.active {
    background: rgba(16, 185, 129, 0.22);
    border-color: #10b981;
    color: var(--hl-green);
  }
  .syn-pair-banner {
    padding: 10px 14px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13.5px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .syn-split-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 960px) {
    .syn-split-grid { grid-template-columns: 1fr; }
  }
  .syn-col-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    max-height: calc(100vh - 210px);
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }
  .syn-col-title {
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--hl-cyan);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .syn-col-card p { margin-bottom: 12px; }
  .syn-col-card .paraitem.synonym {
    background: rgba(245, 158, 11, 0.16);
    color: var(--hl-gold);
    border-bottom: 2px dashed #f59e0b;
    padding: 1px 5px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.16s;
  }

    background: rgba(245, 158, 11, 0.32);

<script>
(function() {
  if (location.protocol === 'file:') {
    location.href = 'http://localhost:8899/reading/index.html' + location.search + location.hash;
  }
})();

const MANIFEST = window.STUDY4_READING_MANIFEST || { units: [] };
const DATA = {
  units: MANIFEST.units || []
};
const DONE_KEY = 's4_reading_done';
const LAST_KEY = 's4_reading_last_v2';
const SRS_KEY = 's4_reading_srs_v1';

let doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
let srsMap = JSON.parse(localStorage.getItem(SRS_KEY) || '{}');
let currentLesson = null;
let currentMode = 'smart'; // 'passage' | 'synonyms' | 'smart' | 'flashcard' | 'quiz' | 'listen' | 'match' | 'cloze' | 'list'
let synSubMode = 'learn'; // 'learn' | 'practice' | 'table'
let activeSynUid = '';
let synPracIdx = 0;
let synPracFeedback = '';
let synPracIsCorrect = false;
let synPracOptions = [];
let synPracCacheKey = '';
let synChunkState = 'idle';

function ensureSynonymsLoaded(cb) {
  if (window.__STUDY4_READ_SYNONYMS) {
    cb && cb();
    return;
  }
  if (synChunkState === 'loading') {
    const iv = setInterval(() => {
      if (window.__STUDY4_READ_SYNONYMS) {
        clearInterval(iv);
        cb && cb();
      }
    }, 30);
    return;
  }
  synChunkState = 'loading';
  const s = document.createElement('script');
  s.src = 'data/reading_synonyms.js';
  s.onload = () => {
    synChunkState = 'done';
    cb && cb();
  };
  s.onerror = () => {
    synChunkState = 'error';
    cb && cb();
  };
  document.head.appendChild(s);
}

function getActiveSynData() {
  if (!currentLesson) return { leftHtml: '', rightHtml: '', pairs: [] };
  const map = window.__STUDY4_READ_SYNONYMS || {};
  const fromChunk = map[currentLesson.id];
  const pairs = (fromChunk && fromChunk.pairs) || (currentLesson.problem && currentLesson.problem.synPairs) || [];
  return {
    leftHtml: fromChunk ? (fromChunk.leftHtml || '') : '',
    rightHtml: fromChunk ? (fromChunk.rightHtml || '') : '',
    pairs
  };
}

if (window.S4VocabEngine) {
  window.S4VocabEngine.init({
    srsKey: SRS_KEY,
    daysKey: 's4_reading_days_v1',
    settingsKey: 's4_reading_settings_v1',
    getSrsMap: () => srsMap,
    onSaveSrs: () => { saveSrs(); renderSidebar(); },
    playWordAudio: (v, lang) => playWordAudio(v, lang),
    getExtraModeButtonsHtml: () => {
      if (currentLesson && currentLesson.problem && currentLesson.problem.pType === 'reading_vocab') {
        const paras = currentLesson.problem.paragraphs || [];
        const synCnt = currentLesson.problem.synCount || (currentLesson.problem.synPairs || []).length || 0;
        return `<button class="s4v-mode-btn" onclick="setMode('passage')">📖 Đọc song ngữ (${paras.length} đoạn)</button>` +
               `<button class="s4v-mode-btn" onclick="setMode('synonyms')">🔄 Đồng/Trái nghĩa (${synCnt})</button>`;
      }
      return '';
    }
  });
}
let showViTrans = true;
let selectedVocabIdx = 0;

// Folder collapse states
let collapsedUnits = { u_3: false, u_2: true, u_1: true, u_4: true };
let collapsedBooks = {};
let collapsedTests = {};

// Smart Learn batch state
let smartQueue = []; // array of { wordObj, key, step: 0..3, mistakes: 0 }
let smartCursor = 0;
let smartLocked = false;

// Free Drill states
let fcIndex = 0;
let fcFlipped = false;
let srsReviewQueue = [];
let srsReviewIdx = 0;
let quizIndex = 0;
let quizScore = 0;
let quizLocked = false;
let spellIndex = 0;
let listenIndex = 0;
let matchPairs = [];
let matchSelectedLeft = null;
let matchSelectedRight = null;
let matchedIds = new Set();

const loadedChunks = {};
function ensureChunkLoaded(unitId, cb) {
  if (window.__STUDY4_READ_CHUNK && window.__STUDY4_READ_CHUNK[unitId]) {
    const chunk = window.__STUDY4_READ_CHUNK[unitId];
    const targetUnit = DATA.units.find(u => u.unitId === unitId);
    if (targetUnit && chunk.items) {
      targetUnit.items = chunk.items;
    }
    (chunk.items || []).forEach(it => {
      const found = ALL_LESSONS.find(x => x.id === it.id);
      if (found) {
        Object.assign(found, it, { unitId, unitName: targetUnit ? targetUnit.unitName : '' });
      }
    });
    cb && cb();
    return;
  }

  if (loadedChunks[unitId] === 'loading') {
    const checkInt = setInterval(() => {
      if (window.__STUDY4_READ_CHUNK && window.__STUDY4_READ_CHUNK[unitId]) {
        clearInterval(checkInt);
        ensureChunkLoaded(unitId, cb);
      }
    }, 30);
    return;
  }

  loadedChunks[unitId] = 'loading';
  const s = document.createElement('script');
  s.src = `data/reading_${unitId}.js`;
  s.onload = function() {
    loadedChunks[unitId] = 'done';
    ensureChunkLoaded(unitId, cb);
  };
  s.onerror = function() {
    console.error('Failed to load chunk for ' + unitId);
    loadedChunks[unitId] = 'error';
    cb && cb();
  };
  document.head.appendChild(s);
}

function getAllLessons() {
  const list = [];
  (DATA.units || []).forEach(u => {
    (u.items || []).forEach((it, idx) => {
      list.push({ ...it, unitId: u.unitId, unitName: u.unitName, idxInUnit: it.idxInUnit !== undefined ? it.idxInUnit : idx });
    });
  });
  return list;
}

function getBookName(str) {
  const s = str || '';
  let m = s.match(/(IELTS Collection \d+|Collection \d+)/i);
  if (m) return m[1].replace(/^Collection/i, 'IELTS Collection');
  m = s.match(/(Practice Set \d+)/i);
  if (m) return m[1];
  if (/Simulation/i.test(s)) return 'IELTS Simulation Tests';
  if (/BC Test/i.test(s)) return 'British Council (BC) Tests';
  if (/Sample Test/i.test(s)) return 'IELTS Sample Tests';
  return 'Bộ đề khác';
}

function getTestName(str) {
  const s = str || '';
  const m = s.match(/(Test \d+)/i);
  return m ? m[1] : s.split('|')[0].trim();
}

function playWordAudio(v, lang = 'en-GB') {
  const wordText = v.origin || v.word || v.term || '';
  const url = lang === 'en-US' ? (v.usAudio || v.ukAudio) : (v.ukAudio || v.usAudio);
  const isPrivateTts = url && (url.includes('/ai_services/tts') || url.includes('study4.com/login'));
  if (url && !isPrivateTts) {
    const fullUrl = url.startsWith('http') ? url : 'https://study4.com' + url;
    const player = document.getElementById('ttsAudioPlayer');
    player.src = fullUrl;
    player.play().catch(() => speakWordFallback(wordText, lang));
  } else {
    speakWordFallback(wordText, lang);
  }
}

function speakWordFallback(text, lang = 'en-GB') {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function getActiveVocabList() {
  if (!currentLesson || !currentLesson.problem) return [];
  if (currentLesson.problem.pType === 'topic_flashcards') {
    return (currentLesson.problem.words || []).map(w => ({
      term: w.word,
      origin: w.word,
      pos: (w.pos || '').replace(/[()]/g, ''),
      ipa: w.ipa || '',
      vi: w.defVi || '',
      en: w.defEn || '',
      examples: w.examples || [],
      ukAudio: w.ukAudio || '',
      usAudio: w.usAudio || ''
    }));
  }
  return currentLesson.problem.vocabList || [];
}

function buildSmartLearnQueue() {
  const vList = getActiveVocabList();
  const unlearned = vList.filter(v => {
    const s = srsMap[getWordKey(v)];
    return !s || (!s.ignored && (!s.reps || s.reps === 0));
  });
  const source = unlearned.length > 0 ? unlearned : vList;
  smartQueue = source.slice(0, 10).map(v => ({
    wordObj: v,
    key: getWordKey(v),
    step: 0,
    mistakes: 0
  }));
  smartCursor = 0;
  smartLocked = false;
}

function buildSrsReviewQueue() {
  const vList = getActiveVocabList();
  const now = Date.now();
  const due = vList.filter(v => {
    const s = srsMap[getWordKey(v)];
    return s && !s.ignored && s.reps > 0 && (!s.due || now >= s.due);
  });
  srsReviewQueue = due.length > 0 ? due : vList.slice(0, 20);
  srsReviewIdx = 0;
  fcFlipped = false;
}

function initMatchingRound() {
  const vList = getActiveVocabList();
  const sample = [...vList].sort(() => Math.random() - 0.5).slice(0, 6);
  matchPairs = sample.map((v, i) => ({ id: i, term: v.origin || v.term, vi: v.vi, pos: v.pos, raw: v }));
  matchSelectedLeft = null;
  matchSelectedRight = null;
  matchedIds = new Set();
}

window.selectLesson = function(id, forcedMode) {
  const meta = ALL_LESSONS.find(x => x.id === id);
  if (!meta) return;
  if (window.S4PracticeZone) window.S4PracticeZone.setReadingHubOpen(false);
  const pzBtn = document.getElementById('topBtn_pz');
  if (pzBtn) pzBtn.classList.toggle('active', forcedMode === 'practice_test');
  localStorage.setItem(LAST_KEY, id);
  syncActiveUnitUI(meta);
  if (forcedMode === 'practice_test' && pzBtn) {
    pzBtn.classList.add('active');
    const u2Btn = document.getElementById('topBtn_u_2');
    if (u2Btn) u2Btn.classList.remove('active');
  }
  currentLesson = meta;
  renderSidebar();
  scrollActiveLessonIntoView(false);

  ensureChunkLoaded(meta.unitId, function() {
    const found = ALL_LESSONS.find(x => x.id === id);
    if (!found) return;
    currentLesson = found;
    try {
      localStorage.setItem('s4_read_last_lesson_cache', JSON.stringify(found));
    } catch(e) {}

    if (forcedMode) {
      currentMode = forcedMode;
    } else if (found.problem && found.problem.pType === 'topic_flashcards') {
      currentMode = 'smart_learn';
    } else if (found.problem && found.problem.pType === 'reading_vocab') {
      currentMode = 'passage';
    } else {
      currentMode = 'video';
    }

    if (window.innerWidth <= 768 && typeof toggleMobileSidebar === 'function') {
      toggleMobileSidebar(false);
    }

    selectedVocabIdx = 0;
    fcIndex = 0;
    fcFlipped = false;
    quizIndex = 0;
    quizScore = 0;
    spellIndex = 0;
    listenIndex = 0;
    buildSmartLearnQueue();
    buildSrsReviewQueue();
    initMatchingRound();

    if (currentMode === 'practice_test' || currentMode === 'synonyms') {
      ensureSynonymsLoaded(() => {
        renderSidebar();
        renderMain();

      renderSidebar();
      renderMain();

    const curPair = pairs[synPracIdx];

    if (uid === curPair.uid) {
      synPracIsCorrect = true;
      synPracFeedback = `✓ Chính xác! "${curPair.questionPhrase}" = "${curPair.passagePhrase}"`;
      activeSynUid = uid;
      renderMain();
      setTimeout(() => {

          stepSynPractice(1);

    } else {
      synPracIsCorrect = false;
      const clickedPair = pairs.find(p => p.uid === uid);
      synPracFeedback = `✗ Chưa đúng (bạn vừa chọn "${clickedPair ? clickedPair.passagePhrase : '...'}") — Đáp án đúng: <span class="dic-ans-hint">✓ ${curPair.passagePhrase}</span>`;

window.stepSynPractice = function(delta) {
  const synData = getActiveSynData();
  const pairs = synData.pairs || [];
  if (!pairs.length) return;
  synPracIdx = (synPracIdx + delta + pairs.length) % pairs.length;
  synPracFeedback = '';

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightVocabInText(text, vocabList) {
  if (!vocabList || !vocabList.length) return text;
  let result = text;
  const indexed = vocabList.map((v, idx) => ({ ...v, idx })).filter(v => v.term && v.term.length > 2);
  indexed.sort((a, b) => b.term.length - a.term.length);

  const placeholders = [];
  indexed.forEach(v => {
    const pattern = new RegExp(`\\b(${escapeRegExp(v.term)})\\b`, 'gi');
    result = result.replace(pattern, (match) => {
      const pid = `@@VOCAB_${placeholders.length}@@`;
      placeholders.push(`<span class="vocab-hl" onclick="inspectVocab(${v.idx})" title="${(v.vi || '').replace(/"/g, '&quot;')}">${match}</span>`);
      return pid;
    });
  });

  placeholders.forEach((html, i) => {
    result = result.replace(`@@VOCAB_${i}@@`, html);
  });
  return result;
}

window.S4FormatTheoryHtml = function(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return '';
  let html = rawHtml;

  // 1. Remove empty spacer paragraphs (<p>&nbsp;</p>, <p><span>&nbsp;</span></p>, etc.)
  html = html.replace(/<p\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>|<(?:span|strong|em|u)\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>)*<\/(?:span|strong|em|u)>)*<\/p>/gi, '');

  // 2. Convert Google Docs single-item <ol><li style="list-style-type:upper-roman|decimal"><h1|h2>...</h1|h2></li></ol> into structured section headers
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  html = html.replace(/<ol(?:\s+start="(\d+)")?\s*>\s*<li\b([^>]*)>\s*<(h[1-3])\b[^>]*>([\s\S]*?)<\/\3>\s*<\/li>\s*<\/ol>/gi, function(m, startNum, liAttr, hTag, inner) {
    const idx = startNum ? Math.max(1, parseInt(startNum, 10)) : 1;
    const isRoman = /upper-roman/i.test(liAttr);
    const isAlpha = /upper-alpha/i.test(liAttr);
    const badge = isRoman ? (ROMAN[idx - 1] || idx) : (isAlpha ? String.fromCharCode(64 + idx) : String(idx));
    const isSub = hTag.toLowerCase() !== 'h1' && !isRoman;
    const cleanInner = inner.replace(/&nbsp;/gi, ' ').trim();
    if (isSub) {
      return '<div class="s4-subsec-heading"><span class="s4-subsec-badge">' + badge + '</span><span class="s4-subsec-title">' + cleanInner + '</span></div>';
    }
    return '<div class="s4-sec-heading"><span class="s4-sec-badge">' + badge + '</span><span class="s4-sec-title">' + cleanInner + '</span></div>';
  });

  // 3. Convert Google Docs fake bullet paragraphs <p style="...list-style-type:disc...">...</p>
  html = html.replace(/<p\b([^>]*style\s*=\s*"[^"]*list-style-type\s*:\s*disc[^"]*"[^>]*)>([\s\S]*?)<\/p>/gi, '<p class="s4-pseudo-li">$2</p>');

  // 4. Process all tags with a style="..." attribute
  html = html.replace(/<([a-zA-Z0-9]+)\b([^>]*?)\sstyle\s*=\s*"([^"]*)"([^>]*)>/gi, function(full, tag, before, styleStr, after) {
    const t = tag.toLowerCase();
    const classes = [];
    let s = styleStr;

    // Highlight background colors -> soft pastel badge classes
    if (/background(?:-color)?\s*:\s*#ffff00\b/i.test(s)) {
      classes.push('s4-hl-amber');
      s = s.replace(/background(?:-color)?\s*:\s*#ffff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ffff\b/i.test(s)) {
      classes.push('s4-hl-sky');
      s = s.replace(/background(?:-color)?\s*:\s*#00ffff\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ff00\b/i.test(s)) {
      classes.push('s4-hl-emerald');
      s = s.replace(/background(?:-color)?\s*:\s*#00ff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#ff9900\b/i.test(s)) {
      classes.push('s4-hl-rose');
      s = s.replace(/background(?:-color)?\s*:\s*#ff9900\s*;?/gi, '');
    }

    // Table header / accent cell backgrounds (#9fc5e8, #a4c2f4)
    if (/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\b/i.test(s)) {
      classes.push('s4-td-accent');
      s = s.replace(/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\s*;?/gi, '');
    }

    // Strip white / light gray / transparent backgrounds that break Dark Mode
    s = s.replace(/background(?:-color)?\s*:\s*(?:#ffffff|#fff|#f1f3f5|white|transparent)\s*;?/gi, '');

    // Foreground text colors
    if (/(?:^|[;\s])color\s*:\s*#ff0000\b/i.test(s)) {
      classes.push('s4-txt-red');
      s = s.replace(/(?:^|[;\s])color\s*:\s*#ff0000\s*;?/gi, '');
    }
    if (/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))/i.test(s)) {
      classes.push('s4-txt-blue');
      s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))\s*;?/gi, '');
    }
    // Strip hardcoded dark/black text colors
    s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#000000|#000|black|#1a1a1a|#242938)\s*;?/gi, '');

    // Clean up table, td, th, img, span fixed pixel dimensions & borders
    if (t === 'table' || t === 'td' || t === 'th' || t === 'img' || t === 'span') {
      s = s.replace(/\b(?:width|height)\s*:\s*[\d.]+px\s*;?/gi, '');
      s = s.replace(/\btable-layout\s*:\s*fixed\s*;?/gi, '');
      s = s.replace(/\bborder(?:-(?:top|bottom|left|right))?\s*:\s*[\d.]+px\s+solid\s+#[0-9a-fA-F]+\s*;?/gi, '');
      s = s.replace(/\boverflow\s*:\s*hidden\s*;?/gi, '');
    }

    // Soften excessive Google Docs left margins and remove justify alignment
    s = s.replace(/\btext-align\s*:\s*justify\s*;?/gi, '');
    s = s.replace(/\bmargin-left\s*:\s*(\d+)px\s*;?/gi, function(_, px) {
      const n = parseInt(px, 10);
      if (n >= 120) return 'margin-left:28px;';
      if (n >= 70) return 'margin-left:20px;';
      if (n >= 36) return 'margin-left:12px;';
      return '';
    });

    s = s.replace(/;\s*;/g, ';').trim().replace(/^;+|;+$/g, '').trim();

    let combinedBeforeAfter = before + after;
    if (classes.length > 0) {
      if (/\bclass\s*=\s*"([^"]*)"/i.test(combinedBeforeAfter)) {
        combinedBeforeAfter = combinedBeforeAfter.replace(/\bclass\s*=\s*"([^"]*)"/i, function(_, existing) {
          return 'class="' + (existing + ' ' + classes.join(' ')).trim() + '"';
        });
      } else {
        combinedBeforeAfter = ' class="' + classes.join(' ') + '"' + combinedBeforeAfter;
      }
    }

    const styleAttr = s ? ' style="' + s + '"' : '';
    return '<' + tag + combinedBeforeAfter + styleAttr + '>';
  });

  // 5. Move leading/trailing spaces outside highlight pills so borders hug the words cleanly
  html = html.replace(/<span\s+class="(s4-hl-[a-z0-9\s-]+)">(\s*)([\s\S]*?)(\s*)<\/span>/gi, function(m, cls, lead, inner, trail) {
    if (!inner.trim()) return lead + trail;
    return (lead || '') + '<span class="' + cls + '">' + inner + '</span>' + (trail || '');
  });

  // 6. Merge accidentally split paragraph lines right before "⇒ Paragraph X" (e.g. Question 18 in L15)
  html = html.replace(/<p>([\s\S]*?,)<\/p>\s*<p>(\s*(?:<span[^>]*>)*\s*[a-z][\s\S]*?)<\/p>(?=\s*<p[^>]*>\s*(?:<[^>]+>)*\s*(?:⇒|→|=>)\s*Paragraph)/gi, '<p>$1 $2</p>');

  // 7. Classify <p> blocks into Step Callouts, Question Cards, Passage Excerpts, Answer Pills, and Note Callouts
  html = html.replace(/<p(\b[^>]*)>([\s\S]*?)<\/p>/gi, function(full, pAttr, inner) {
    if (/s4-pseudo-li/i.test(pAttr)) return full;
    const plain = inner.replace(/<[^>]+>/g, '').replace(/&nbsp;|\u00a0/g, ' ').replace(/&rarr;/g, '→').replace(/\s+/g, ' ').trim();
    if (!plain) return full;

    // 7a. Step Callout: "Bước 1: ...", "Bước 3 + Bước 4 + Bước 5"
    if (/^Bước\s*\d+/i.test(plain) && plain.length < 160) {
      return '<div class="s4-step-callout"><span class="s4-step-icon">🧭</span><div class="s4-step-body">' + inner + '</div></div>';
    }

    // 7b. Question Card: "Question 14: ...", "Practice 1: ..."
    if (/^(?:Question\s*\d+|Practice\s*\d+)\s*[:.]/i.test(plain)) {
      const decorated = inner.replace(/(?:<u>\s*)?(Question\s*\d+|Practice\s*\d+)\s*:?\s*(?:<\/u>)?(?:\s*<\/span>\s*<span[^>]*>)?\s*[:.]?\s*/i, '<span class="s4-q-badge">$1</span> ');
      return '<div class="s4-question-card">' + decorated + '</div>';
    }

    // 7c. Passage Excerpt: starts with "A. ", "B. ", ..., "I. " and is a passage paragraph (> 60 chars)
    if (/^[A-I]\.\s+/.test(plain) && plain.length > 60) {
      const decorated = inner.replace(/^(\s*(?:<[^>]+>\s*)*)([A-I])\.?(\s*(?:<\/[^>]+>\s*)*)/, '$1<span class="s4-para-badge">Đoạn $2</span>$3 ');
      return '<div class="s4-passage-excerpt">' + decorated + '</div>';
    }

    // 7d. Answer Pill or Conclusion Box: starts with "→", "⇒", "=>", or "Đáp án:"
    if (/^(?:→|⇒|=>)\s*/i.test(plain) || /^Đáp án\s*:/i.test(plain)) {
      const isShortAnswer = /^(?:→|⇒|=>)\s*(?:Paragraph\s+[A-Z]|Đáp án|Key|Answer|Main topic)/i.test(plain) || /^Đáp án\s*:/i.test(plain) || plain.length < 75;
      if (isShortAnswer) {
        return '<div class="s4-answer-wrap"><div class="s4-answer-pill">🎯 ' + inner.replace(/^(\s*(?:<[^>]+>\s*)*)(?:→|⇒|=>)\s*/, '$1') + '</div></div>';
      }
      return '<div class="s4-conclusion-box">' + inner + '</div>';
    }

    // 7e. Note Callout: starts with "Lưu ý:", "Chú ý:"
    if (/^(?:Lưu ý|Chú ý|Mẹo)\s*:/i.test(plain)) {
      return '<div class="s4-note-callout">💡 ' + inner + '</div>';
    }

    return full;
  });

  return html;
};

  if (step === 1) {
    const distractors = vList.filter(x => getWordKey(x) !== item.key).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [cur, ...distractors].sort(() => Math.random() - 0.5);
    return `
      <div class="smart-box">
        ${stepHeader}
        <div style="margin:14px 0 18px;">
          <div style="font-size:26px;font-weight:800;color:var(--hl-cyan);">${cur.origin || cur.term} <small style="font-size:14px;color:var(--muted);">${cur.ipa || ''} (${cur.pos || ''})</small></div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px;">Chọn nghĩa tiếng Việt chính xác của từ trên:</div>
        </div>
        <div>
          ${options.map(opt => `
            <button class="quiz-opt" onclick="smartCheckOption(this, ${opt === cur})">${opt.vi}</button>
          `).join('')}
        </div>
      </div>
    `;
  }

  if (step === 2) {
    const distractors = vList.filter(x => getWordKey(x) !== item.key).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [cur, ...distractors].sort(() => Math.random() - 0.5);
    const sampleEx = (cur.examples && cur.examples[0])
      ? cur.examples[0].replace(/\[([^\]]+)\]/gi, '<strong style="color:#f59e0b;">[ _____ ]</strong>').split('(=Dịch:')[0]
      : `📘 ${cur.en || ''}`;
    setTimeout(() => playWordAudio(cur, 'en-GB'), 80);

    return `
      <div class="smart-box">
        ${stepHeader}
        <div style="margin:14px 0 18px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <button class="btn btn-primary" onclick="playWordAudio(smartQueue[${smartCursor}].wordObj, 'en-GB')">🔊 Nghe phát âm</button>
            <span style="font-size:16px;font-weight:700;color:var(--hl-gold);">🇻🇳 ${cur.vi}</span>
          </div>
          <div style="padding:12px 14px;background:var(--box-sub);border-radius:10px;font-size:14.5px;line-height:1.6;">
            ${sampleEx}
          </div>
        </div>
        <div>
          ${options.map(opt => `
            <button class="quiz-opt" onclick="smartCheckOption(this, ${opt === cur})">
              <strong>${opt.origin || opt.term}</strong> <span style="color:var(--muted);font-size:12px;">${opt.ipa || ''}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Step 3: Spelling
  const target = (cur.origin || cur.term || '').trim();
  const hint = target ? `${target[0]}${' _'.repeat(Math.max(1, target.length - 1))} (${target.length} ký tự)` : '';
  return `
    <div class="smart-box">
      ${stepHeader}
      <div style="margin:12px 0;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:20px;font-weight:800;color:var(--hl-gold);">🇻🇳 ${cur.vi || ''}</span>

        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" onclick="smartCheckSpelling()">✔️ Kiểm tra (Enter)</button>
          <button class="btn" onclick="document.getElementById('smartSpellInput').value='${target.replace(/'/g, "\\'")}'; document.getElementById('smartSpellInput').focus();">💡 Hiện đáp án</button>
        </div>
      </div>
    </div>
  `;
}

window.smartIgnoreWord = function() {
  const item = smartQueue[smartCursor];
  if (!item) return;
  srsMap[item.key] = { ignored: true, updatedAt: Date.now() };
  saveSrs();
  smartQueue.splice(smartCursor, 1);
  if (smartCursor >= smartQueue.length) smartCursor = 0;
  renderMain();
  renderSidebar();
};

window.smartAdvanceStep = function(isSuccess) {
  const item = smartQueue[smartCursor];
  if (!item) return;
  if (isSuccess) {
    item.step++;
    if (item.step >= 4) {
      // Completed all 4 steps! Grade SM-2 automatically based on mistakes
      const prev = srsMap[item.key] || { reps: 0, interval: 0, ease: 2.5 };
      const quality = item.mistakes === 0 ? 5 : (item.mistakes === 1 ? 4 : 3);
      const reps = (prev.reps || 0) + 1;
      const interval = reps === 1 ? (quality === 5 ? 4 : 1) : Math.round((prev.interval || 1) * (prev.ease || 2.5));
      const ease = Math.max(1.3, (prev.ease || 2.5) + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
      srsMap[item.key] = {
        reps,
        interval,
        ease,
        due: Date.now() + interval * 86400000,
        updatedAt: Date.now()
      };
      saveSrs();
      smartQueue.splice(smartCursor, 1);
      if (smartCursor >= smartQueue.length) smartCursor = 0;
      renderSidebar();
    } else {
      smartCursor = (smartCursor + 1) % smartQueue.length;
    }
  } else {
    item.mistakes++;
  }
  renderMain();
};

window.smartCheckOption = function(btn, isCorrect) {
  if (smartLocked) return;
  smartLocked = true;
  const item = smartQueue[smartCursor];
  if (item) playWordAudio(item.wordObj, 'en-GB');

  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(() => {
      smartLocked = false;
      smartAdvanceStep(true);
    }, 950);
  } else {
    btn.classList.add('wrong');
    if (item) item.mistakes++;
    setTimeout(() => { smartLocked = false; }, 650);
  }
};

window.smartCheckSpelling = function() {
  const inp = document.getElementById('smartSpellInput');
  const fb = document.getElementById('smartSpellFeedback');
  const item = smartQueue[smartCursor];
  if (!inp || !item) return;
  const cur = item.wordObj;
  const target = (cur.origin || cur.term || '').trim().toLowerCase();
  const val = inp.value.trim().toLowerCase();

  inp.classList.remove('correct', 'wrong');
  void inp.offsetWidth;

  if (val === target) {
    inp.classList.add('correct');
    fb.style.color = '#34d399';
    fb.textContent = `✓ Chính xác! Đã thuộc từ "${cur.origin || cur.term}"`;
    playWordAudio(cur, 'en-GB');
    setTimeout(() => {
      smartAdvanceStep(true);
    }, 1050);
  } else {
    inp.classList.add('wrong');
    item.mistakes++;
    fb.style.color = '#f87171';
    fb.innerHTML = `✗ Chưa đúng — Đáp án đúng: <span class="dic-ans-hint">✓ ${cur.origin || cur.term}</span>`;
  }
};

window.rateSrsCard = function(grade) {
  const cur = srsReviewQueue[srsReviewIdx];
  if (!cur) return;
  const key = getWordKey(cur);
  const prev = srsMap[key] || { reps: 0, interval: 1, ease: 2.5 };
  let interval = 1, reps = (prev.reps || 0) + 1, ease = prev.ease || 2.5, dueOffsetMs = 86400000;

  if (grade === 'Hard') {
    interval = 0;
    dueOffsetMs = 10 * 60 * 1000; // 10 mins
    ease = Math.max(1.3, ease - 0.2);
  } else if (grade === 'Good') {
    interval = Math.max(1, Math.round((prev.interval || 1) * 1.5));
    dueOffsetMs = interval * 86400000;
  } else {
    interval = Math.max(4, Math.round((prev.interval || 2) * ease));
    dueOffsetMs = interval * 86400000;
    ease = ease + 0.1;
  }

  srsMap[key] = { reps, interval, ease, due: Date.now() + dueOffsetMs, updatedAt: Date.now() };
  saveSrs();
  fcFlipped = false;
  srsReviewIdx = (srsReviewIdx + 1) % srsReviewQueue.length;
  renderMain();
  renderSidebar();
};

};

window.checkListenOption = function(btn, isCorrect) {
  if (quizLocked) return;
  quizLocked = true;
  const vList = getActiveVocabList();
  if (isCorrect) {
    btn.classList.add('correct');
    setTimeout(() => {
      quizLocked = false;
      listenIndex = (listenIndex + 1) % vList.length;
      renderMain();
    }, 950);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => { quizLocked = false; }, 650);
  }
};

window.selectMatchLeft = function(id, idx) {
  const p = matchPairs[idx];
  if (p && p.raw) playWordAudio(p.raw, 'en-GB');
  matchSelectedLeft = id;
  checkMatchPair();
};

window.selectMatchRight = function(id) {
  matchSelectedRight = id;
  checkMatchPair();
};

function checkMatchPair() {
  if (matchSelectedLeft === null || matchSelectedRight === null) {
    renderMain();
    return;
  }
  if (matchSelectedLeft === matchSelectedRight) {
    matchedIds.add(matchSelectedLeft);
    matchSelectedLeft = null;
    matchSelectedRight = null;
    renderMain();
  } else {
    const rBtn = document.getElementById('matchRight_' + matchSelectedRight);
    if (rBtn) rBtn.classList.add('wrong');
    setTimeout(() => {
      matchSelectedLeft = null;
      matchSelectedRight = null;
      renderMain();
    }, 450);
  }
}

window.checkSpelling = function() {
  const inp = document.getElementById('spellInput');
  const fb = document.getElementById('spellFeedback');
  if (!inp) return;
  const vList = getActiveVocabList();
  const cur = vList[spellIndex];
  if (!cur) return;

  const target = (cur.origin || cur.term || '').trim().toLowerCase();
  const val = inp.value.trim().toLowerCase();

  inp.classList.remove('correct', 'wrong');
  void inp.offsetWidth;

  if (val === target || val === (cur.term || '').trim().toLowerCase()) {
    inp.classList.add('correct');
    fb.style.color = '#34d399';
    fb.textContent = `✓ Chính xác! ${cur.origin || cur.term} — ${cur.vi}`;
    playWordAudio(cur, 'en-GB');
    setTimeout(() => {
      spellIndex = (spellIndex + 1) % vList.length;
      renderMain();
    }, 1050);
  } else {
    inp.classList.add('wrong');
    fb.style.color = '#f87171';
    fb.innerHTML = `✗ Chưa đúng — Đáp án đúng: <span class="dic-ans-hint">✓ ${cur.origin || cur.term}</span>`;
  }
};

window.revealSpelling = function() {
  const inp = document.getElementById('spellInput');
  const fb = document.getElementById('spellFeedback');
  const vList = getActiveVocabList();
  const cur = vList[spellIndex];
  if (!cur || !inp) return;
  inp.value = cur.origin || cur.term;
  fb.style.color = '#38bdf8';
  fb.textContent = `💡 Đáp án: ${cur.origin || cur.term} (${cur.vi})`;
  playWordAudio(cur, 'en-GB');
};

window.nextSpelling = function() {
  const vList = getActiveVocabList();
  if (!vList.length) return;
  spellIndex = (spellIndex + 1) % vList.length;
  renderMain();
};

// Keyboard shortcut for Smart Learn Step 0
window.addEventListener('keydown', (e) => {
  if (currentMode === 'smart_learn' && smartQueue[smartCursor] && smartQueue[smartCursor].step === 0 && e.key === 'Enter') {
    e.preventDefault();
    smartAdvanceStep(true);
  }
});

// Init: Restore instant cache or open default lesson
updateTopProgress();
const lastId = localStorage.getItem(LAST_KEY);
const defaultLesson = ALL_LESSONS.find(x => x.unitId === 'u_3') || ALL_LESSONS[0];
const initialLesson = ALL_LESSONS.find(x => x.id === lastId) || defaultLesson;

let cachedLesson = null;
try {
  cachedLesson = JSON.parse(localStorage.getItem('s4_read_last_lesson_cache') || 'null');
} catch(e) {}

if (cachedLesson && initialLesson && cachedLesson.id === initialLesson.id) {
  currentLesson = cachedLesson;
  syncActiveUnitUI(currentLesson);
  if (currentLesson.problem && currentLesson.problem.pType === 'topic_flashcards') {
    currentMode = 'smart_learn';
  } else if (currentLesson.problem && currentLesson.problem.pType === 'reading_vocab') {
    currentMode = 'passage';
  } else {
    currentMode = 'video';
  }
  buildSmartLearnQueue();
  buildSrsReviewQueue();
  renderSidebar();
  renderMain();
  scrollActiveLessonIntoView(false);
  ensureChunkLoaded(currentLesson.unitId, function() {
    const fresh = ALL_LESSONS.find(x => x.id === currentLesson.id);
    if (fresh) {
      const needReRender = !currentLesson.problem;
      currentLesson = fresh;
      if (needReRender) renderMain();
    }
    renderSidebar();
    scrollActiveLessonIntoView(false);
  });
} else if (initialLesson) {
  selectLesson(initialLesson.id);
}

// Background idle preloading of other units
setTimeout(function() {
  const remainingUnits = ['u_3', 'u_1', 'u_4', 'u_2'].filter(u => !window.__STUDY4_READ_CHUNK || !window.__STUDY4_READ_CHUNK[u]);
  let idx = 0;
  function loadNext() {
    if (idx >= remainingUnits.length) return;
    ensureChunkLoaded(remainingUnits[idx++], function() {
      setTimeout(loadNext, 400);
    });
  }
  loadNext();
}, 1200);
