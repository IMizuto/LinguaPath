  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      if (s === "ghibli") document.documentElement.classList.add("theme-ghibli");
      if (isDark) document.documentElement.classList.add("dark");
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        var topPx = (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px";
        document.documentElement.style.setProperty("--s4-safe-top", topPx);
        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>

  <title>Luyện Nghe HSK 1–6 | LinguaPath</title>
  <link rel="stylesheet" href="../../assets/s4-ui.css?v=71">
  <link rel="stylesheet" href="../../assets/ghibli/ghibli-theme.css?v=32">
  <style>
    :root {
      --bg: var(--lg-wash, rgba(15, 23, 42, 0.06));
      --card: var(--lg-surface, rgba(255, 255, 255, 0.72));
      --card-strong: var(--lg-surface-strong, rgba(255, 255, 255, 0.86));
      --text: var(--lg-ink, #0f172a);
      --muted: var(--lg-ink-muted, #64748b);
      --border: var(--lg-hairline, rgba(148, 163, 184, 0.22));
      --primary: var(--lg-accent, #dc2626);
      --primary-solid: #dc2626;
      --ok: #16a34a; --danger: #dc2626;
      color-scheme: light;
    }
    html.dark, body.dark {
      --bg: var(--lg-wash, rgba(255, 255, 255, 0.06));
      --card: var(--lg-surface, rgba(15, 23, 42, 0.68));
      --card-strong: var(--lg-surface-strong, rgba(15, 23, 42, 0.82));
      --text: var(--lg-ink, #f8fafc);
      --muted: var(--lg-ink-muted, #94a3b8);
      --border: var(--lg-hairline, rgba(148, 163, 184, 0.22));
      --primary: var(--lg-accent, #f87171);
      --primary-solid: #e11d48;
      --ok: #4ade80; --danger: #f87171;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; max-width: 100%; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent !important; color: var(--lg-ink, var(--text)); min-height: 100vh;
    }
    .lp-chip-inline { display: inline-flex; align-items: center; gap: 5px; }
    .lp-hsk-topbar {
      width: calc(100% - 28px);
      max-width: 1200px;
      margin: calc(8px + var(--s4-safe-top, 0px)) auto 0;
    }
    .menu-btn { display: none; }
    .layout {
      max-width: 1200px; margin: 0 auto; display: grid;
      grid-template-columns: 290px minmax(0, 1fr); gap: 18px; padding: 14px 14px 70px;
    }
    .sidebar {
      background: var(--card-strong);
      backdrop-filter: var(--lg-blur, blur(10px));
      -webkit-backdrop-filter: var(--lg-blur, blur(10px));
      border: 1px solid var(--border); border-radius: 18px;
      padding: 12px; height: fit-content; position: sticky; top: 72px;
      max-height: calc(100vh - 92px); overflow-y: auto;
    }
    .sb-prog {
      padding: 10px; border-radius: 12px; background: var(--bg);
      border: 1px solid var(--border); margin-bottom: 10px; font-size: 12.5px;
    }
    .sb-prog-bar { height: 7px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 6px; }
    .sb-prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary-solid), #16a34a); transition: width 0.25s ease; }
    .sb-group { font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: var(--muted); margin: 12px 4px 6px; letter-spacing: 0.4px; }
    .sb-item {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--text); padding: 9px 10px; border-radius: 11px; cursor: pointer;
      display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; font-family: inherit;
    }
    .sb-item:hover { background: var(--bg); }
    .sb-item.active { background: var(--lg-accent-soft, rgba(220,38,38,0.14)); border-color: var(--primary); color: var(--primary); font-weight: 700; }
    .sb-code { font-size: 11px; font-weight: 800; opacity: 0.8; display: block; }
    .sb-name { font-size: 13px; line-height: 1.35; display: block; overflow-wrap: anywhere; }
    .sb-empty { text-align: center; padding: 22px 12px; color: var(--muted); font-size: 13.5px; }

    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%; padding: 9px 32px 9px 32px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 13.5px; font-family: inherit; outline: none;
    }
    .search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; display: inline-flex;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-clear {
      position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: var(--muted); cursor: pointer;
      padding: 4px 6px; display: none; align-items: center; justify-content: center;
    }
    .search-clear.show { display: inline-flex; }
    .filter-label {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--muted); margin: 8px 2px 5px;
    }
    .lv-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .lv-pill {
      padding: 5px 9px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 11.5px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease; white-space: nowrap;
    }
    .lv-pill:hover { border-color: var(--primary); }
    .lv-pill.active { background: var(--primary-solid); color: #fff; border-color: var(--primary-solid); }

    .mobile-filter-bar { display: none; margin-bottom: 14px; gap: 8px; flex-direction: column; }
    .mob-topic-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .mob-select-btn {
      padding: 7px 12px; border-radius: 10px; border: 1px solid var(--primary);
      background: var(--lg-accent-soft, rgba(220,38,38,0.12)); color: var(--primary); font-size: 12.5px;
      font-weight: 800; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .mob-count-pill {
      font-size: 12.5px; font-weight: 800; padding: 4px 10px; border-radius: 99px;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
    }
    .q-part-badge {
      display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 9px;
      border-radius: 99px; background: var(--lg-accent-soft, rgba(220,38,38,0.14)); color: var(--primary);
      margin-bottom: 7px;
    }
    .nav-btn {
      padding: 9px 14px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-weight: 700; font-size: 13px;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .nav-btn:hover:not(:disabled) { border-color: var(--primary); }

    .main-card {
      background: var(--card-strong);
      backdrop-filter: var(--lg-blur, blur(10px));
      -webkit-backdrop-filter: var(--lg-blur, blur(10px));
      border: 1px solid var(--border); border-radius: 18px;
      padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); min-width: 0;
    }
    .lesson-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 14px;
    }
    .lesson-badge {
      display: inline-block; font-size: 11.5px; font-weight: 800; padding: 3px 10px;
      border-radius: 99px; background: var(--lg-accent-soft, rgba(220,38,38,0.14)); color: var(--primary); margin-bottom: 6px;
    }
    .lesson-head h1 { margin: 0 0 4px; font-size: 21px; line-height: 1.3; }
    .lesson-head p { margin: 0; color: var(--muted); font-size: 13.5px; }
    .done-btn {
      padding: 9px 14px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-weight: 700; font-size: 13px;
      cursor: pointer; white-space: nowrap; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .done-btn.is-done { background: rgba(22,163,74,0.16); border-color: #16a34a; color: var(--ok); }

    .tip-box {
      background: var(--bg); border: 1px dashed var(--border);
      border-radius: 12px; padding: 9px 13px; font-size: 13px; margin-bottom: 14px; line-height: 1.5;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .ctrl-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .rate-group { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); }
    .rate-btn {
      padding: 7px 11px; border: none; background: transparent; color: var(--text);
      font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .rate-btn.on { background: var(--primary-solid); color: #fff; }
    .ctrl-btn {
      padding: 7px 11px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
    }
    .ctrl-btn.on { background: var(--lg-accent-soft, rgba(220,38,38,0.14)); border-color: var(--primary); color: var(--primary); }

    .score-banner {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 13px;
      padding: 11px 14px; margin-bottom: 18px; font-size: 13.5px;
    }
    .sec-h {
      font-size: 15.5px; font-weight: 800; margin: 20px 0 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .q-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 15px; margin-bottom: 14px;
    }
    .q-audio-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--border);
    }
    .play-btn {
      background: var(--primary-solid); color: #fff; border: none;
      border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
    }
    .play-btn:hover { filter: brightness(1.06); }
    .mini-btn {
      padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
    }
    .q-prompt { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; line-height: 1.45; }
    .q-stmt {
      padding: 9px 12px; border-radius: 10px; background: var(--card);
      border-left: 4px solid var(--primary); font-size: 14px; margin-bottom: 10px;
    }
    .opts-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .opt-btn {
      text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 13.5px; font-weight: 600;
      cursor: pointer; font-family: inherit; line-height: 1.4;
    }
    .opt-btn:hover { border-color: var(--primary); }
    .opt-btn.correct { background: rgba(22,163,74,0.16); border-color: #16a34a; color: var(--ok); }
    .opt-btn.wrong { background: rgba(220,38,38,0.16); border-color: #dc2626; color: var(--danger); }

    .transcript-box {
      margin-top: 10px; padding: 11px 13px; border-radius: 11px;
      background: var(--card); border: 1px solid var(--border);
    }
    .tr-zh { font-size: 17px; font-weight: 700; line-height: 1.65; }
    .tr-py { font-size: 13px; color: #2563eb; margin-top: 3px; font-weight: 600; }
    html.dark .tr-py { color: #60a5fa; }
    .tr-vi { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .tr-tok {
      cursor: pointer; border-radius: 4px; padding: 0 1px;
      border-bottom: 1.5px dotted rgba(37,99,235,0.4);
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .tr-tok:hover { background: rgba(37,99,235,0.14); color: var(--primary); border-bottom-color: var(--primary); }
    .tr-tools {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    }
    .tr-tap-hint {
      font-size: 11.5px; color: var(--muted); font-weight: 700;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .tr-write-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700;
      text-decoration: none; cursor: pointer; font-family: inherit;
      transition: border-color 0.14s ease, color 0.14s ease;
    }
    .tr-write-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Quick Dictionary & Writing Popup (Liquid Glass) */
    .lp-lpop-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.42); z-index: 998;
      display: none; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    }
    .lp-lpop-backdrop.show { display: block; }
    .lp-lpop-card {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%); width: min(430px, calc(100vw - 24px));
      background: var(--card-strong); color: var(--text);
      backdrop-filter: var(--lg-blur, blur(14px)); -webkit-backdrop-filter: var(--lg-blur, blur(14px));
      border: 1.5px solid var(--border); border-radius: 18px;
      padding: 15px 16px; z-index: 999; display: none;
      box-shadow: 0 18px 46px rgba(0,0,0,0.28);
    }
    .lp-lpop-card.show { display: block; animation: lpLpopIn 0.16s ease-out; }
    @keyframes lpLpopIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .lp-lpop-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .lp-lpop-zh { font-size: 30px; font-weight: 900; color: var(--primary); line-height: 1.15; }
    .lp-lpop-py { font-size: 15px; font-weight: 800; color: #2563eb; margin-left: 8px; }
    html.dark .lp-lpop-py { color: #60a5fa; }
    .lp-lpop-close {
      width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .lp-lpop-close:hover { border-color: var(--primary); color: var(--primary); }
    .lp-lpop-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 9px; }
    .lp-ltag {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px;
      font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    }
    .lp-ltag.pos { color: #2563eb; border-color: rgba(37,99,235,0.3); }
    html.dark .lp-ltag.pos { color: #93c5fd; }
    .lp-ltag.hv { color: #d97706; border-color: rgba(217,119,6,0.35); }
    .lp-lpop-vi {
      font-size: 14px; line-height: 1.5; background: var(--bg);
      border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px;
    }
    .lp-lpop-chars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .lp-lpop-char-btn {
      padding: 4px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .lp-lpop-char-btn:hover { border-color: var(--primary); color: var(--primary); }
    .lp-lpop-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .lp-lpop-btn {
      flex: 1; min-width: 120px; padding: 9px 12px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 13px; font-weight: 800; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit;
    }
    .lp-lpop-btn:hover { border-color: var(--primary); color: var(--primary); }
    .lp-lpop-btn.primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-color: transparent; }
    html.theme-ghibli .lp-lpop-btn.primary { background: linear-gradient(135deg, #2d6a4f, #40916c); }
    .hide-py .py-text { display: none; }
    .hide-vi .vi-text { display: none; }
    .exp-box { margin-top: 9px; font-size: 13px; color: var(--muted); line-height: 1.5; display: flex; align-items: flex-start; gap: 6px; }

    .dict-input {
      width: 100%; padding: 11px 13px; border-radius: 11px; border: 1.5px solid var(--border);
      background: var(--card); color: var(--text); font-size: 17px; font-family: inherit;
      margin: 8px 0 10px;
    }
    .dict-input:focus { outline: none; border-color: var(--primary); }
    .dict-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dict-res {
      margin-top: 10px; padding: 11px 13px; border-radius: 11px;
      background: var(--card); border: 1px solid var(--border); font-size: 13.5px; line-height: 1.6;
    }
    .char-ok { color: #16a34a; font-weight: 800; }
    html.dark .char-ok { color: #4ade80; }
    .char-miss { color: #dc2626; font-weight: 800; text-decoration: underline wavy; }
    html.dark .char-miss { color: #f87171; }

    .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 80; }
    body.drawer-open { overflow: hidden !important; }
    @media (max-width: 820px) {
      .menu-btn { display: inline-flex !important; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 70px; }
      .sidebar {
        display: none; position: fixed; top: 0; left: 0; bottom: 0; width: 84%; max-width: 320px;
        z-index: 90; border-radius: 0; max-height: 100vh; max-height: 100dvh;
        padding-top: calc(12px + var(--s4-top-inset, env(safe-area-inset-top, 0px)));
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }
      body.drawer-open .sidebar { display: block; }
      body.drawer-open .drawer-backdrop { display: block; }
      .mobile-filter-bar { display: flex; }
      .main-card { padding: 15px; border-radius: 15px; }
      .opts-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 580px) {
      .lp-hsk-topbar { width: calc(100% - 16px); }
      .lp-hide-sm { display: none !important; }
      .lp-brand-icon { display: none !important; }
      .lp-brand-title { font-size: 14px !important; }
    }
  </style>
</head>
<body>
  <div id="ghibliBackdropLayer" class="ghibli-backdrop-layer"></div>
  <div class="lp-aurora-layer" aria-hidden="true"></div>
  <div class="drawer-backdrop" onclick="toggleDrawer(false)"></div>

  <header class="lp-topbar lp-glass lp-hsk-topbar">

  <script>
    const HSK_L_SVG = {
      listening: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3Z"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      play: '<polygon points="6 4 20 12 6 20 6 4"/>',

      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',

      eyeOff: '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
      globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
      lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',

      award: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
      target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      menu: '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
      circle: '<circle cx="12" cy="12" r="9"/>',
      arrowLeft: '<polyline points="15 18 9 12 15 6"/>',
      arrowRight: '<polyline points="9 18 15 12 9 6"/>',
      volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
      sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>'
    };
    function lHskIcon(name, size) {
      const sz = size || 14;
      if (window.S4UI && typeof window.S4UI.icon === "function" && !["stop", "gauge", "eyeOff", "circle", "arrowLeft", "arrowRight", "volume", "sparkles"].includes(name)) {
        const s = window.S4UI.icon(name, sz);
        if (s && s.indexOf("<svg") !== -1) return s;
      }
      return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${HSK_L_SVG[name] || HSK_L_SVG.listening}</svg>`;
    }

    const DONE_KEY = "lp_hsk_listening_done_v1";
    const LAST_KEY = "lp_hsk_listening_last_v1";
    const lessons = window.LP_HSK_LISTENING_DATA || [];

    let doneMap = {};
    try { doneMap = JSON.parse(localStorage.getItem(DONE_KEY) || "{}") || {}; } catch (e) {}

    const urlParams = (() => {
      try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(""); }
    })();

    let filterLevel = (() => {
      const reqLv = Number(urlParams.get("level") || 0);
      return (reqLv >= 1 && reqLv <= 6) ? reqLv : 0;
    })();
    let searchQuery = (urlParams.get("q") || "").trim();

    let activeId = (() => {
      const reqId = (urlParams.get("id") || "").trim();
      if (reqId) {
        const byId = lessons.find((l) => l.id === reqId || l.id.startsWith(reqId));
        if (byId) return byId.id;
      }
      if (filterLevel > 0) {
        const hit = lessons.find((l) => Number(l.level) === filterLevel);
        if (hit) return hit.id;
      }
      const saved = localStorage.getItem(LAST_KEY);
      if (saved && lessons.some((l) => l.id === saved)) return saved;
      return lessons[0] ? lessons[0].id : "";
    })();

    let activeQIdx = 0;
    let isAudioPlaying = false;
    let playRate = 1.0; // 0.72 | 1.0
    let showAllTranscript = false;
    let showPinyin = true;
    let showVi = true;

    let qAnswers = {};
    let qShowTranscript = {};
    let dictInputs = {};
    let dictChecked = {};
    let dictHintShown = {};

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escAttr(s) {
      return esc(s).replace(/`/g, "&#96;");
    }
    function escJsAttr(s) {
      return esc(
        String(s == null ? "" : s)
          .replace(/\\/g, "\\\\")
          .replace(/\r?\n/g, " ")
          .replace(/'/g, "\\'")
      );
    }

    /* Quick Dictionary & Tap-to-Lookup Engine (synchronized with Reading & Lessons) */
    const lWordMap = new Map();
    const lCharMap = new Map();
    const lCoreGloss = {
      "我": { py: "wǒ", vi: "tôi, mình" }, "你": { py: "nǐ", vi: "bạn" }, "您": { py: "nín", vi: "ngài, thầy/cô" },
      "他": { py: "tā", vi: "anh ấy" }, "她": { py: "tā", vi: "cô ấy" }, "我们": { py: "wǒmen", vi: "chúng tôi" },
      "你们": { py: "nǐmen", vi: "các bạn" }, "他们": { py: "tāmen", vi: "họ" }, "大家": { py: "dàjiā", vi: "mọi người" },
      "的": { py: "de", vi: "của" }, "了": { py: "le", vi: "rồi / đã" }, "着": { py: "zhe", vi: "đang (trạng thái)" },
      "过": { py: "guò", vi: "đã từng" }, "吗": { py: "ma", vi: "không? (hỏi)" }, "呢": { py: "ne", vi: "còn…?" },
      "吧": { py: "ba", vi: "nhé / chắc là" }, "是": { py: "shì", vi: "là" }, "在": { py: "zài", vi: "ở / đang" },
      "有": { py: "yǒu", vi: "có" }, "没": { py: "méi", vi: "không / chưa" }, "没有": { py: "méiyǒu", vi: "không có / chưa" },
      "不": { py: "bù", vi: "không" }, "很": { py: "hěn", vi: "rất" }, "也": { py: "yě", vi: "cũng" },
      "都": { py: "dōu", vi: "đều" }, "还": { py: "hái", vi: "vẫn / còn" }, "就": { py: "jiù", vi: "thì / liền" },
      "才": { py: "cái", vi: "mới" }, "已经": { py: "yǐjīng", vi: "đã" }, "正在": { py: "zhèngzài", vi: "đang" },
      "和": { py: "hé", vi: "và" }, "跟": { py: "gēn", vi: "cùng với" }, "比": { py: "bǐ", vi: "so với" },
      "把": { py: "bǎ", vi: "đem (câu chữ 把)" }, "被": { py: "bèi", vi: "bị / được" }, "因为": { py: "yīnwèi", vi: "bởi vì" },
      "所以": { py: "suǒyǐ", vi: "cho nên" }, "虽然": { py: "suīrán", vi: "tuy rằng" }, "但是": { py: "dànshì", vi: "nhưng mà" },
      "如果": { py: "rúguǒ", vi: "nếu như" }, "可以": { py: "kěyǐ", vi: "có thể" }, "应该": { py: "yīnggāi", vi: "nên" },
      "觉得": { py: "juéde", vi: "cảm thấy" }, "认为": { py: "rènwéi", vi: "cho rằng" }, "希望": { py: "xīwàng", vi: "hy vọng" },
      "喜欢": { py: "xǐhuan", vi: "thích" }, "知道": { py: "zhīdào", vi: "biết" }, "准备": { py: "zhǔnbèi", vi: "chuẩn bị" },
      "今天": { py: "jīntiān", vi: "hôm nay" }, "明天": { py: "míngtiān", vi: "ngày mai" }, "昨天": { py: "zuótiān", vi: "hôm qua" },
      "现在": { py: "xiànzài", vi: "bây giờ" }, "时候": { py: "shíhou", vi: "lúc, khi" }, "问题": { py: "wèntí", vi: "vấn đề, câu hỏi" }
    };
    let lVocabIndexed = false;

    function indexListeningDict(arr) {
      if (!Array.isArray(arr) || lVocabIndexed) return;
      lVocabIndexed = true;
      for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        if (!v || !v.word) continue;
        const entry = {
          word: v.word,
          py: v.pinyin || "",
          hv: v.hanViet || "",
          pos: v.pos || "",
          radical: v.radical || "",
          level: Number(v.level || 0),
          vi: String(v.defVi || "").trim()
        };
        if (!lWordMap.has(v.word)) lWordMap.set(v.word, entry);
        if (Array.from(v.word).length === 1 && !lCharMap.has(v.word)) lCharMap.set(v.word, entry);
      }
    }

    function formatTranscriptZh(zh) {
      const chars = Array.from(String(zh || ""));
      let html = "";
      let i = 0;
      while (i < chars.length) {
        const ch = chars[i];
        if (!/[\u3400-\u9FFF]/.test(ch)) {
          html += esc(ch);
          i++;
          continue;
        }
        let matched = "";
        const maxLen = Math.min(4, chars.length - i);
        for (let len = maxLen; len >= 2; len--) {
          const sl = chars.slice(i, i + len).join("");
          if (/^[\u3400-\u9FFF]+$/.test(sl) && (lCoreGloss[sl] || lWordMap.has(sl))) {
            matched = sl;
            break;
          }
        }
        if (!matched) matched = ch;
        html += `<span class="tr-tok" onclick="tapListeningZh(event,'${escJsAttr(matched)}')" title="Chạm tra nghĩa nhanh &amp; tập viết">${esc(matched)}</span>`;
        i += Array.from(matched).length;
      }
      return html;
    }

    function pickTranscriptFocusWord(zh) {
      const chars = Array.from(String(zh || ""));
      let best = "";
      for (let i = 0; i < chars.length; i++) {
        if (!/[\u3400-\u9FFF]/.test(chars[i])) continue;
        for (let len = Math.min(4, chars.length - i); len >= 2; len--) {
          const sl = chars.slice(i, i + len).join("");
          if (/^[\u3400-\u9FFF]+$/.test(sl) && lWordMap.has(sl) && !lCoreGloss[sl]) {
            if (sl.length > best.length) best = sl;
            break;
          }
        }
        if (best.length >= 2) break;
      }
      if (best) return best;
      const pure = chars.filter((c) => /[\u3400-\u9FFF]/.test(c));
      return pure.slice(0, Math.min(4, pure.length)).join("");
    }

    function lookupListeningWord(term) {
      const w = String(term || "").trim();
      const wm = lWordMap.get(w) || null;
      const cm = lCharMap.get(w) || null;
      const ov = lCoreGloss[w] || null;
      const firstCh = Array.from(w)[0] || "";
      const firstCm = lCharMap.get(firstCh) || null;

      const py = (ov && ov.py) || (wm && wm.py) || (cm && cm.py) || "";
      const hv = (wm && wm.hv) || (cm && cm.hv) || "";
      const vi = (ov && ov.vi) || (wm && wm.vi) || (cm && cm.vi) || "";
      const pos = (wm && wm.pos) || (cm && cm.pos) || "";
      const radical = (wm && wm.radical) || (cm && cm.radical) || (firstCm && firstCm.radical) || "";
      const level = (wm && wm.level) || (cm && cm.level) || 0;

      const chars = Array.from(w).filter((c) => /[\u3400-\u9FFF]/.test(c));
      const charsBreakdown = chars.length > 1 ? chars.map((c) => {
        const ci = lCharMap.get(c) || lWordMap.get(c) || lCoreGloss[c] || {};
        return { ch: c, py: ci.py || "", hv: ci.hv || "", vi: String(ci.vi || "").slice(0, 36) };
      }) : [];

      return { word: w, py, hv, pos, radical, level, vi, charsBreakdown };
    }

    function ensureListenPopupDom() {
      let bd = document.getElementById("lpListenPopupBackdrop");
      let card = document.getElementById("lpListenPopup");
      if (!bd) {
        bd = document.createElement("div");
        bd.id = "lpListenPopupBackdrop";
        bd.className = "lp-lpop-backdrop";
        bd.onclick = closeListeningPopup;
        document.body.appendChild(bd);
      }
      if (!card) {
        card = document.createElement("div");
        card.id = "lpListenPopup";
        card.className = "lp-lpop-card";
        card.setAttribute("role", "dialog");
        card.setAttribute("aria-label", "Tra nhanh từ vựng bài nghe");
        document.body.appendChild(card);
      }
      return { bd, card };
    }

    function closeListeningPopup() {
      const bd = document.getElementById("lpListenPopupBackdrop");
      const card = document.getElementById("lpListenPopup");
      if (bd) bd.classList.remove("show");
      if (card) card.classList.remove("show");
    }

    function openListeningPopup(term) {
      const info = lookupListeningWord(term);
      if (!info || !info.word) return;
      const wUrl = "../writing/index.html?char=" + encodeURIComponent(info.word) +
        "&py=" + encodeURIComponent(info.py || "") +
        "&vi=" + encodeURIComponent(String(info.vi || "").slice(0, 80)) +
        "&from=listening";

      const dom = ensureListenPopupDom();
      dom.card.innerHTML = `
        <div class="lp-lpop-top">
          <div style="min-width:0;">
            <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;">
              <span class="lp-lpop-zh">${esc(info.word)}</span>
              ${info.py ? `<span class="lp-lpop-py">${esc(info.py)}</span>` : ""}
            </div>
            <div class="lp-lpop-tags">
              ${info.level ? `<span class="lp-ltag pos">HSK ${esc(info.level)}</span>` : ""}
              ${info.pos ? `<span class="lp-ltag pos">${esc(info.pos)}</span>` : ""}
              ${info.hv ? `<span class="lp-ltag hv">HV: ${esc(info.hv)}</span>` : ""}
              ${info.radical ? `<span class="lp-ltag">Bộ: ${esc(info.radical)}</span>` : ""}
            </div>
          </div>
          <button type="button" class="lp-lpop-close" onclick="closeListeningPopup()" aria-label="Đóng">${lHskIcon("close", 14)}</button>
        </div>
        <div class="lp-lpop-vi">
          <b>Nghĩa:</b> ${info.vi ? esc(info.vi) : '<span style="color:var(--muted);">Chưa có nghĩa tóm tắt riêng — bạn có thể bấm Tập viết để xem nét bút thuận.</span>'}
        </div>
        ${info.charsBreakdown.length ? `
          <div class="lp-lpop-chars">
            <span style="font-size:11.5px;color:var(--muted);font-weight:800;align-self:center;">Từng chữ:</span>
            ${info.charsBreakdown.map((cb) => `
              <button type="button" class="lp-lpop-char-btn" onclick="openListeningPopup('${escJsAttr(cb.ch)}');speakAudio('${escJsAttr(cb.ch)}', 0.9)">
                <b>${esc(cb.ch)}</b> ${cb.py ? esc(cb.py) : ""}${cb.hv ? " · " + esc(cb.hv) : ""}${cb.vi ? " — " + esc(cb.vi) : ""}
              </button>
            `).join("")}
          </div>
        ` : ""}
        <div class="lp-lpop-actions">
          <button type="button" class="lp-lpop-btn" onclick="speakAudio('${escJsAttr(info.word)}', 0.9)">${lHskIcon("volume", 14)} Nghe phát âm</button>
          <a class="lp-lpop-btn primary" href="${wUrl}">${lHskIcon("edit", 14)} Tập viết chữ này</a>
        </div>
      `;
      dom.bd.classList.add("show");
      dom.card.classList.add("show");
    }

    function tapListeningZh(ev, term) {
      if (ev && typeof ev.stopPropagation === "function") ev.stopPropagation();
      try {
        const sel = window.getSelection ? window.getSelection().toString().trim() : "";
        if (sel) return;
      } catch (e) {}
      const info = lookupListeningWord(term);
      speakAudio(info.word, 0.9);
      openListeningPopup(term);
    }

    function normSearch(s) {
      return String(s || "")
        .replace(/[đĐ]/g, "d")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[üǖǘǚǜ]/g, "u")
        .replace(/[āáǎà]/g, "a")
        .replace(/[ēéěè]/g, "e")
        .replace(/[īíǐì]/g, "i")
        .replace(/[ōóǒò]/g, "o")
        .replace(/[ūúǔù]/g, "u")
        .replace(/\s+/g, " ")
        .trim();
    }

    function matchHaystack(hayRaw, qRaw) {
      const qNorm = normSearch(qRaw);
      if (!qNorm) return true;
      if (window.S4UI && typeof window.S4UI.matchesSearch === "function") {
        if (window.S4UI.matchesSearch(hayRaw, qRaw)) return true;
      }
      const hayNorm = normSearch(hayRaw);
      const tokens = qNorm.split(" ").filter(Boolean);
      return hayNorm.includes(qNorm) || tokens.every((tk) => hayNorm.includes(tk));
    }

    function getFilteredLessons() {
      const qRaw = searchQuery.trim();
      return lessons.filter((l) => {
        if (filterLevel > 0 && Number(l.level) !== filterLevel) return false;
        if (!qRaw) return true;
        const hayRaw = [
          l.title, l.subtitle, l.badge, l.tips,
          "hsk " + l.level, "hsk" + l.level,
          ...(l.questions || []).map((q) => (q.partLabel || "") + " " + (q.prompt || "") + " " + (q.audioZh || "")),
          ...(l.dictations || []).map((d) => (d.zh || "") + " " + (d.vi || ""))
        ].join(" ");
        return matchHaystack(hayRaw, qRaw);
      });
    }

    function normalizeZh(str) {
      return String(str || "")
        .replace(/[\s，。？！、；：“”‘’（）()《》〈〉—…·,.?!;:'"-]/g, "")
        .trim();
    }

    function scoreDictation(targetZh, userZh) {
      const target = normalizeZh(targetZh);
      const user = normalizeZh(userZh);
      if (!target.length) return { pct: 0, exact: false, diffHtml: "" };
      let matched = 0;
      const uChars = Array.from(user);
      const tChars = Array.from(target);
      const used = new Array(uChars.length).fill(false);

      // Build ordered pointer matching so missing/extra characters don't shift everything
      let uPos = 0;
      let diffHtml = "";
      for (let i = 0; i < tChars.length; i++) {
        const ch = tChars[i];
        let foundAt = -1;
        for (let j = uPos; j < uChars.length; j++) {
          if (!used[j] && uChars[j] === ch) {
            foundAt = j;
            break;
          }
        }
        if (foundAt !== -1) {
          used[foundAt] = true;
          uPos = foundAt + 1;
          matched++;
          diffHtml += `<span class="char-ok">${esc(ch)}</span>`;
        } else {
          diffHtml += `<span class="char-miss">${esc(ch)}</span>`;
        }
      }
      const denom = Math.max(tChars.length, uChars.length, 1);
      const pct = Math.round((matched / denom) * 100);
      const extraCount = Math.max(0, uChars.length - matched);
      return { pct, exact: user === target, diffHtml, extraCount };
    }

      }, 0);
      return `
        <span class="lp-chip-inline">${lHskIcon("list", 14)} Kết quả: <b>Phần 1: ${qCorrect}/${qs.length}</b> (đã chọn ${qAnswered}/${qs.length}) • <b>Phần 2: ${dPerfect}/${ds.length}</b> đạt (&ge;85%)</span>

      `;

        <div class="tip-box"><span style="color:var(--primary);flex-shrink:0;margin-top:2px;">${lHskIcon("lightbulb", 15)}</span><span><b>Mẹo:</b> ${esc(l.tips)}</span></div>

        <div class="ctrl-bar">
          <div class="rate-group" role="group" aria-label="Tốc độ đọc">
            <button class="rate-btn ${playRate === 0.72 ? "on" : ""}" onclick="playRate=0.72;renderStage();">${lHskIcon("gauge", 13)} 0.72x</button>
            <button class="rate-btn ${playRate === 1.0 ? "on" : ""}" onclick="playRate=1.0;renderStage();">${lHskIcon("zap", 13)} 1.0x</button>
          </div>
          <button class="ctrl-btn ${showAllTranscript ? "on" : ""}" onclick="showAllTranscript=!showAllTranscript;renderStage();">
            ${lHskIcon("file", 13)} Transcript: ${showAllTranscript ? "Hiện" : "Ẩn"}
          </button>
          <button class="ctrl-btn ${showPinyin ? "on" : ""}" onclick="showPinyin=!showPinyin;renderStage();">
            ${lHskIcon("eye", 13)} Pinyin: ${showPinyin ? "Hiện" : "Ẩn"}
          </button>
          <button class="ctrl-btn ${showVi ? "on" : ""}" onclick="showVi=!showVi;renderStage();">
            ${lHskIcon("globe", 13)} Dịch Việt: ${showVi ? "Hiện" : "Ẩn"}
          </button>
          <button class="ctrl-btn" onclick="stopAudio()">${lHskIcon("stop", 13)} Dừng phát</button>
        </div>

        <div class="score-banner" id="listenScoreBanner">
          ${renderScoreBannerInner(l)}
        </div>

        <div class="sec-h"><span class="lp-chip-inline">${lHskIcon("listening", 16)} Phần 1: Nghe hiểu (${qs.length} câu)</span></div>
      `;

      qs.forEach((q, idx) => {
        html += `<div class="q-card" id="mcq_card_${idx}">${renderMcqCardInner(l, q, idx)}</div>`;
      });

      html += `<div class="sec-h"><span class="lp-chip-inline">${lHskIcon("edit", 16)} Phần 2: Chép chính tả (${ds.length} câu)</span></div>`;

      ds.forEach((d, idx) => {
        html += `<div class="q-card" id="dict_card_${idx}">${renderDictCardInner(l, d, idx)}</div>`;
      });

      html += `
        <div class="lp-lesson-nav lp-glass">
          <button class="nav-btn" ${prevLesson ? `onclick="selectLesson('${escAttr(prevLesson.id)}')"` : "disabled"}>${lHskIcon("arrowLeft", 14)} Đề trước</button>
          <button class="done-btn ${isDone ? "is-done" : ""}" onclick="toggleDone('${escAttr(l.id)}')">
            ${isDone ? lHskIcon("check", 14) : lHskIcon("circle", 14)} ${isDone ? "Đã hoàn thành" : "Đánh dấu hoàn thành"}
          </button>
          <button class="nav-btn" ${nextLesson ? `onclick="selectLesson('${escAttr(nextLesson.id)}')"` : "disabled"}>Đề tiếp ${lHskIcon("arrowRight", 14)}</button>
        </div>
      `;

      stage.className = "main-card" + (showPinyin ? "" : " hide-py") + (showVi ? "" : " hide-vi");
      stage.innerHTML = html;

      if (hadMobFocus) {
        const nextMob = document.getElementById("mobSearchInput");
        if (nextMob) {
          nextMob.focus();
          try { nextMob.setSelectionRange(selStart, selStart); } catch (e) {}
        }
      }
    }

    (function initListeningChromeAndKeys() {
      const themeBtn = document.getElementById("btnTheme");
      if (themeBtn) themeBtn.addEventListener("click", toggleDarkMode);
      if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
        window.S4UI.initSmartBackButton({
          element: "#lpBackBtn",
          defaultUrl: "../index.html",
          defaultLabel: "HSK",
          roadmapUrl: "../roadmap/index.html",
          roadmapLabel: "Lộ trình HSK"
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
        if (tag === "input" || tag === "textarea" || tag === "select" || (e.target && e.target.isContentEditable)) return;
        const filtered = getFilteredLessons();
        const curIdx = filtered.findIndex((x) => x.id === activeId);
        const l = filtered[curIdx];
        if (e.key === "ArrowLeft" && curIdx > 0) {
          e.preventDefault();
          selectLesson(filtered[curIdx - 1].id);
          return;
        }
        if (e.key === "ArrowRight" && curIdx >= 0 && curIdx < filtered.length - 1) {
          e.preventDefault();
          selectLesson(filtered[curIdx + 1].id);
          return;
        }
        if (e.key === " " || e.code === "Space") {
          if (tag === "button") return;
          e.preventDefault();
          if (isAudioPlaying) {
            stopAudio();
          } else if (l) {
            const qs = l.questions || [];
            const ds = l.dictations || [];
            const q = qs[Math.min(activeQIdx, Math.max(0, qs.length - 1))];
            const text = (q && q.audioZh) || (ds[0] && ds[0].zh) || "";
            if (text) speakAudio(text);
          }
          return;
        }
        if (/^[1-4]$/.test(e.key) && l) {
          const qs = l.questions || [];
          if (!qs.length) return;
          if (activeQIdx < 0 || activeQIdx >= qs.length) {
            const unans = qs.findIndex((_, i) => qAnswers[i] === undefined);
            activeQIdx = unans >= 0 ? unans : 0;
          }
          const oi = Number(e.key) - 1;
          const q = qs[activeQIdx];
          if (q && q.opts && oi < q.opts.length) {
            e.preventDefault();
            answerMcq(activeQIdx, oi);
          }
        }
      });
    })();

    syncThemeBtn();
    renderSidebar();
    renderStage();
    setTimeout(function () {
      if (Array.isArray(window.LP_HSK_VOCAB_DATA)) {
        indexListeningDict(window.LP_HSK_VOCAB_DATA);
        return;
      }
      const sc = document.createElement("script");
      sc.src = "../vocab/vocab_data.js?v=2";
      sc.async = true;
      sc.onload = function () {
        if (Array.isArray(window.LP_HSK_VOCAB_DATA)) {
          indexListeningDict(window.LP_HSK_VOCAB_DATA);
          const prevY = window.scrollY || 0;
          renderStage();
          if (prevY > 20) window.scrollTo(0, prevY);
        }
      };
      document.head.appendChild(sc);
    }, 80);
    window.addEventListener("pagehide", stopAudio);
  </script>
  <script src="../../auth.js?v=37"></script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
