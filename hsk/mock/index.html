      function updateLatestHistoryQuality(report) {
        if (!report || !report.qualitySummary) return;
        const data = loadResults();
        if (data.history.length && data.history[0].id === report.id && data.history[0].dateIso === report.dateIso) {
          data.history[0].qualityChecked = report.qualitySummary.checked;
          data.history[0].qualityTotal = report.qualitySummary.total;
        }
        if (data.bestById[report.id] && data.bestById[report.id].dateIso === report.dateIso) {
          data.bestById[report.id].qualityChecked = report.qualitySummary.checked;
          data.bestById[report.id].qualityTotal = report.qualitySummary.total;
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }

      function clearExamTimer() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startExamTimer() {
        clearExamTimer();
        timerId = setInterval(() => {
          if (state.screen !== "exam" || !state.exam) return;
          if (state.remainingSec > 0) {
            state.remainingSec -= 1;
            if (isSectionLockedMode() && state.sectionTimers) {
              state.sectionTimers[state.activeSection] = state.remainingSec;
            }
            if (state.remainingSec % 10 === 0) saveDraft();
            const tEl = document.getElementById("examTimerDisplay");
            if (tEl) {
              tEl.textContent = formatClock(state.remainingSec);
              tEl.classList.toggle("urgent", state.remainingSec > 0 && state.remainingSec < 300);
            }
          }
          // Tick HSK 6 essay_summary reading phase clocks
          const ws = state.exam.writing || [];
          let needRerenderWriting = false;
          ws.forEach((q, idx) => {
            if (q && q.type === "essay_summary") {
              const st = state.summaryState[idx];
              if (st && st.phase === "read" && st.readLeftSec > 0) {
                st.readLeftSec -= 1;
                const cEl = document.getElementById("summaryReadClock_" + idx);
                if (cEl) cEl.textContent = formatClock(st.readLeftSec);
                if (st.readLeftSec <= 0) {
                  st.phase = "write";
                  needRerenderWriting = true;
                  notifyToast("info", "Hết 10 phút đọc bài gốc — đã chuyển sang viết tóm tắt.");
                }
              }
            }
          });
          if (needRerenderWriting && state.activeSection === "writing") {
            render();
          }
          if (state.remainingSec <= 0) {
            if (isSectionLockedMode()) {
              const avail = getAvailableSections(state.exam);
              const curIdx = avail.indexOf(state.activeSection);
              state.lockedSections[state.activeSection] = true;
              if (curIdx >= 0 && curIdx + 1 < avail.length) {
                const nextSec = avail[curIdx + 1];
                stopAutoPlayListening();
                stopAudio();
                state.pendingAdvanceSec = "";
                state.activeSection = nextSec;
                state.focusedQIdx = 0;
                state.remainingSec = Math.max(60, Number(state.sectionTimers[nextSec] || 600));
                notifyToast("warn", "Hết giờ phần thi! Hệ thống đã khóa phần vừa qua và chuyển sang phần tiếp theo.");
                saveDraft();
                render();
                window.scrollTo({ top: 0, behavior: "smooth" });
                return;
              }
            }
            clearExamTimer();
            notifyToast("warn", "Đã hết giờ làm bài! Hệ thống tự động nộp bài.");
            finalizeSubmission();
          }
        }, 1000);
      }

      function getWritingUserText(q, val, idx) {
        if (!q) return "";
        if (q.type === "reorder") {
          const picked = Array.isArray(val) ? val : [];
          return picked.map((wi) => (q.words && q.words[wi] != null ? q.words[wi] : "")).join("");
        }
        if (q.type === "essay_summary") {
          const title = idx !== undefined && state.writingTitles ? String(state.writingTitles[idx] || "").trim() : "";
          const body = String(val || "").trim();
          return title ? `《${title}》\n${body}` : String(val || "");
        }
        return String(val || "");
      }

      function isWritingAnswered(q, idx) {
        const val = state.writingAnswers[idx];
        if (!q) return false;
        if (q.type === "reorder") return Array.isArray(val) && val.length > 0;
        return String(val || "").trim().length > 0;
      }

      function getProgressCounts() {
        const ex = state.exam;
        if (!ex) return { done: 0, total: 0 };
        if (ex.examKind === "hskk") {
          const items = ex.items || [];
          const done = items.filter((it) => {
            const r = state.hskkResponses[it.id];
            return Boolean(r && (r.done || r.audioUrl || countHanzi(r.transcript || state.hskkNotes[it.id] || "") > 0));
          }).length;
          return { done, total: items.length };
        }
        const ls = ex.listening || [];
        const rs = ex.reading || [];
        const ws = ex.writing || [];
        let done = 0;
        ls.forEach((_, i) => { if (state.listeningAnswers[i] !== undefined) done++; });
        rs.forEach((_, i) => { if (state.readingAnswers[i] !== undefined) done++; });
        ws.forEach((q, i) => { if (isWritingAnswered(q, i)) done++; });
        return { done, total: ls.length + rs.length + ws.length };
      }

      const OPEN_WRITING_RUBRIC = [
        { key: "content", label: "Nội dung & Đúng yêu cầu", hint: "Đúng chủ đề / giữ được ý chính văn bản nguồn (chấp nhận từ đồng nghĩa đúng ý)." },
        { key: "order", label: "Trật tự câu & Ngữ pháp", hint: "Đúng trật tự Chủ–Trạng–Vị–Bổ–Tân, dùng hợp lý 了/着/过/把/被." },
        { key: "vocab", label: "Từ vựng phù hợp ngữ cảnh", hint: "Chọn từ tự nhiên, không ghép rời từ khóa máy móc." },
        { key: "flow", label: "Mạch ý & Dấu câu", hint: "Câu văn trôi chảy, có liên kết ý và dấu câu đầy đủ." }
      ];

      function extractSourceKeyPoints(q) {
        if (!q || q.type !== "essay_summary") return [];
        const viRaw = String(q.sourceVi || "").trim();
        const zhRaw = String(q.sourceZh || "").trim();
        const viParts = viRaw.split(/(?<=[.!?。！？])\s+/).map((s) => s.trim()).filter((s) => s.length >= 18);
        const zhParts = zhRaw.split(/[。！？]/).map((s) => s.trim()).filter((s) => s.length >= 10);
        const out = [];
        const maxPts = Math.min(4, Math.max(viParts.length, zhParts.length));
        for (let i = 0; i < maxPts; i++) {
          out.push({
            key: "kp_" + i,
            label: viParts[i] || zhParts[i] || ("Ý chính #" + (i + 1))
          });
        }
        return out;
      }

      function evaluateWritingItem(q, rawVal) {
        const text = getWritingUserText(q, rawVal);
        const hCount = countHanzi(text);
        if (!q) return { ratio: 0, isFormalOnly: false, detail: "" };

        if (q.type === "reorder") {
          const uNorm = normalizeZh(text);
          const aNorm = normalizeZh(q.answer || "");
          const ok = Boolean(uNorm && aNorm && uNorm === aNorm);
          return { ratio: ok ? 1 : 0, isFormalOnly: false, detail: ok ? "Sắp xếp chính xác 100%" : "Chưa khớp đáp án chuẩn" };
        }

        if (q.type === "pinyin_write") {
          const uNorm = normalizeZh(text);
          const tNorm = normalizeZh(q.targetHanzi || "");
          const ok = Boolean(uNorm && tNorm && uNorm === tNorm);
          return { ratio: ok ? 1 : 0, isFormalOnly: false, detail: ok ? "Viết đúng chữ Hán" : "Chưa khớp chữ Hán mục tiêu" };
        }

        if (q.type === "make_sentence") {
          const req = (Array.isArray(q.requiredTokens) && q.requiredTokens.length)
            ? q.requiredTokens
            : (q.keyword ? [q.keyword] : []);
          const hasTokens = req.length > 0 && req.every((tk) => text.includes(tk));
          const hasLen = hCount >= 6;
          if (hasTokens && hasLen) {
            return {
              ratio: 1,
              isFormalOnly: true,
              formalPassed: true,
              detail: "Kiểm tra hình thức: Đủ từ khóa & độ dài (≥6 chữ Hán) — cần tự đối chiếu ngữ pháp & nghĩa"
            };
          }
          if ((hasTokens || hasLen) && text.trim().length > 0) {
            return {
              ratio: 0.5,
              isFormalOnly: true,
              formalPassed: false,
              detail: hasTokens
                ? "Kiểm tra hình thức: Đủ từ khóa nhưng câu ngắn (<6 chữ Hán)"
                : "Kiểm tra hình thức: Đạt độ dài nhưng thiếu từ khóa yêu cầu (nếu dùng từ đồng nghĩa đúng ý, đánh dấu ở bảng chất lượng)"
            };
          }
          return { ratio: 0, isFormalOnly: true, formalPassed: false, detail: "Kiểm tra hình thức: Chưa đạt yêu cầu đặt câu" };
        }

        if (q.type === "essay_keywords" || q.type === "essay_summary") {
          if (hCount === 0) return { ratio: 0, isFormalOnly: true, formalPassed: false, detail: "Chưa viết bài" };
          const kwList = Array.isArray(q.keywords) ? q.keywords : [];
          const hit = kwList.filter((kw) => kw && text.includes(kw)).length;
          const minC = Number(q.minChars) || (q.type === "essay_summary" ? 110 : 60);
          const lenRatio = Math.min(1, hCount / minC);
          const ratio = kwList.length > 0
            ? Math.min(1, Math.max(0, 0.6 * (hit / kwList.length) + 0.4 * lenRatio))
            : lenRatio;
          const hasPunct = /[，。！？；、,.!?;]/.test(text);
          const stuffWarn = (!hasPunct && hCount >= 12)
            ? " • Lưu ý: thiếu dấu câu ngắt ý (văn bản ghép từ khóa rời chỉ qua kiểm tra hình thức)"
            : "";
          const kwSummary = kwList.length > 0 ? `Trúng ${hit}/${kwList.length} từ khóa • ` : "";
          return {
            ratio,
            isFormalOnly: true,
            formalPassed: ratio >= 0.6,
            hitCount: hit,
            kwTotal: kwList.length,
            hCount,
            minC,
            detail: `Kiểm tra hình thức: ${kwSummary}${hCount}/${minC} chữ Hán${stuffWarn}`
          };
        }

        return { ratio: 0, isFormalOnly: false, detail: "" };
      }

      function computeQualitySummary(wReview) {
        let checked = 0;
        let total = 0;
        (wReview || []).forEach((item) => {
          if (!item || !item.ev || !item.ev.isFormalOnly) return;
          const checks = item.qualityChecks || {};
          OPEN_WRITING_RUBRIC.forEach((c) => {
            total++;
            if (checks[c.key]) checked++;
          });
          (item.sourceKeyPoints || []).forEach((kp) => {
            total++;
            if (checks[kp.key]) checked++;
          });
        });
        return { checked, total };
      }

      window.toggleMockWritingRubric = function (wIdx, key) {
        const rep = state.lastReport;
        if (!rep || !Array.isArray(rep.wReview)) return;
        const item = rep.wReview.find((x) => x.idx === wIdx);
        if (!item) return;
        if (!item.qualityChecks) item.qualityChecks = {};
        item.qualityChecks[key] = !item.qualityChecks[key];
        rep.qualitySummary = computeQualitySummary(rep.wReview);
        updateLatestHistoryQuality(rep);
        render();
      };

      function groupByPart(reviewArr) {
        const map = new Map();
        (reviewArr || []).forEach((item) => {
          const lbl = String((item.q && item.q.partLabel) || "Phần chung").trim();
          if (!map.has(lbl)) map.set(lbl, { label: lbl, right: 0, total: 0 });
          const entry = map.get(lbl);
          entry.total += 1;
          if (item.isOk) entry.right += 1;
        });
        return [...map.values()];
      }

      function computeReport() {
        const ex = state.exam;
        const ls = ex.listening || [];
        const rs = ex.reading || [];
        const ws = ex.writing || [];
        const hasWriting = ws.length > 0;

        let lRight = 0;
        const lReview = ls.map((q, i) => {
          const picked = state.listeningAnswers[i];
          const isOk = picked === q.ans;
          if (isOk) lRight++;
          return { idx: i, q, picked, isOk };
        });

        let rRight = 0;
        const rReview = rs.map((q, i) => {
          const picked = state.readingAnswers[i];
          const isOk = picked === q.ans;
          if (isOk) rRight++;
          return { idx: i, q, picked, isOk };
        });

        let wRatioSum = 0;
        let hasOpenWriting = false;
        const wReview = ws.map((q, i) => {
          const rawVal = state.writingAnswers[i];
          const ev = evaluateWritingItem(q, rawVal);
          if (ev.isFormalOnly) hasOpenWriting = true;
          wRatioSum += ev.ratio;
          return {
            idx: i,
            q,
            userText: getWritingUserText(q, rawVal, i),
            summaryTitle: q && q.type === "essay_summary" ? String((state.writingTitles && state.writingTitles[i]) || "").trim() : "",
            ratio: ev.ratio,
            pct: Math.round(ev.ratio * 100),
            isOk: ev.ratio >= 0.999,
            ev,
            qualityChecks: {},
            sourceKeyPoints: extractSourceKeyPoints(q)
          };
        });

        const hasListening = ls.length > 0;
        const hasReading = rs.length > 0;
        const activeCount = (hasListening ? 1 : 0) + (hasReading ? 1 : 0) + (hasWriting ? 1 : 0);
        const listeningScore = hasListening ? Math.round((lRight / ls.length) * 100) : 0;
        const readingScore = hasReading ? Math.round((rRight / rs.length) * 100) : 0;
        const writingScore = hasWriting ? Math.min(100, Math.round((wRatioSum / ws.length) * 100)) : 0;
        const totalScore = listeningScore + readingScore + (hasWriting ? writingScore : 0);
        const curScope = state.scope || "all";
        const scopedMaxScore = curScope === "all" ? Number(ex.maxScore || (hasWriting ? 300 : 200)) : Math.max(100, activeCount * 100);
        const scopedPassScore = curScope === "all" ? Number(ex.passScore || (hasWriting ? 180 : 120)) : Math.round(scopedMaxScore * 0.6);
        const passed = totalScore >= scopedPassScore;
        const qualitySummary = computeQualitySummary(wReview);

        return {
          id: ex.id,
          level: ex.level,
          title: ex.title,
          badge: ex.badge,
          isFullMock: Boolean(ex.isFullMock),
          scope: curScope,
          scopeLabel: getScopeLabel(curScope, state.partFilter),
          candidateName: getCandidateName(),
          candidateTicket: getTicketNo(ex.id, ex.level),
          maxScore: scopedMaxScore,
          passScore: scopedPassScore,
          hasListening,
          hasReading,
          hasWriting,
          hasOpenWriting,
          qualitySummary,
          listeningScore,
          readingScore,
          writingScore,
          lRight,
          lTotal: ls.length,
          rRight,
          rTotal: rs.length,
          wTotal: ws.length,
          lParts: groupByPart(lReview),
          rParts: groupByPart(rReview),
          totalScore,
          passed,
          mode: state.mode,
          dateIso: new Date().toISOString(),
          lReview,
          rReview,
          wReview
        };
      }

      function exitFullscreenIfNeeded() {
        try {
          if (document.fullscreenElement && typeof document.exitFullscreen === "function") {
            document.exitFullscreen().catch(() => {});
          }
        } catch (e) {}
        state.isFullscreen = false;
      }

      function finalizeSubmission() {
        if (!state.exam) return;
        if (state.exam.examKind === "hskk") {
          finalizeHskkSubmission();
          return;
        }
        stopAutoPlayListening();
        stopAudio();
        clearExamTimer();
        exitFullscreenIfNeeded();
        state.showSubmitModal = false;
        state.pendingAdvanceSec = "";
        state.showSheet = false;
        const report = computeReport();
        state.lastReport = report;
        saveResult(report);
        clearDraft(state.exam.id);
        state.reviewFilter = "all";
        state.screen = "report";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ---------- HSKK TIMED ORAL ENGINE (SƠ / TRUNG / CAO) ----------
      let hskkRunToken = 0;
      let hskkTickId = null;
      let hskkGlobalTickId = null;
      let hskkMediaRec = null;
      let hskkMediaStream = null;
      let hskkRecChunks = [];
      let hskkSpeechRec = null;
      let hskkMicTestTimer = null;

      const HSKK_RUBRIC = [
        { key: "pronunciation", label: "Phát âm & Thanh điệu", hint: "Phân biệt thanh 1/2/3/4, âm bật hơi & biến điệu tự nhiên." },
        { key: "fluency", label: "Độ trôi chảy & Ngắt nhịp", hint: "Nói liền mạch trong thời gian bấm giờ, không ngắc ngứ kéo dài." },
        { key: "grammar", label: "Ngữ pháp & Dùng từ", hint: "Câu hoàn chỉnh, cấu trúc hợp lý và từ vựng đúng ngữ cảnh." },
        { key: "task", label: "Hoàn thành yêu cầu đề", hint: "Đủ ý chính, trả lời đúng trọng tâm câu hỏi / ảnh tranh." }
      ];

      function playCtiBeep(freq, durMs) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = new Ctx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq || 880;
          gain.gain.setValueAtTime(0.001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (durMs || 300) / 1000);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + (durMs || 300) / 1000 + 0.02);
          setTimeout(() => { try { ctx.close(); } catch (e) {} }, (durMs || 300) + 120);
        } catch (e) {}
      }

      function stopActiveRecorder(saveToQId) {
        if (hskkSpeechRec) {
          try { hskkSpeechRec.onresult = null; hskkSpeechRec.onerror = null; hskkSpeechRec.stop(); } catch (e) {}
          hskkSpeechRec = null;
        }
        const rec = hskkMediaRec;
        const stream = hskkMediaStream;
        hskkMediaRec = null;
        hskkMediaStream = null;
        if (rec && rec.state !== "inactive") {
          try {
            rec.onstop = () => {
              if (saveToQId && hskkRecChunks.length) {
                const blob = new Blob(hskkRecChunks, { type: rec.mimeType || "audio/webm" });
                const url = URL.createObjectURL(blob);
                const prev = state.hskkResponses[saveToQId] || {};
                state.hskkResponses[saveToQId] = Object.assign({}, prev, { audioUrl: url });
                if (state.screen === "report") render();
              }
              hskkRecChunks = [];
              if (stream) stream.getTracks().forEach((t) => t.stop());
            };
            rec.stop();
            return;
          } catch (e) {}
        }
        if (stream) {
          try { stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
        }
      }

      function stopHskkEngine() {
        hskkRunToken++;
        if (hskkTickId) { clearInterval(hskkTickId); hskkTickId = null; }
        if (hskkGlobalTickId) { clearInterval(hskkGlobalTickId); hskkGlobalTickId = null; }
        if (hskkMicTestTimer) { clearTimeout(hskkMicTestTimer); hskkMicTestTimer = null; }
        stopActiveRecorder(null);
        stopAudio();
        state.hskkPhase = "idle";
        state.hskkPhaseLeft = 0;
      }

      window.testHskkMic = async function () {
        if (state.micTesting) return;
        state.micTesting = true;
        state.micStatusMsg = "Đang thu thử giọng nói trong 2.5 giây — hãy thử nói '你好'... ";
        render();
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" || typeof window.MediaRecorder === "undefined") {
          state.micTesting = false;
          state.micOk = false;
          state.micStatusMsg = "Trình duyệt chưa hỗ trợ thu âm trực tiếp — bạn vẫn có thể thi bấm giờ & dùng gõ văn bản/tự chấm.";
          render();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const rec = new MediaRecorder(stream);
          const chunks = [];
          rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
          rec.onstop = () => {
            stream.getTracks().forEach((t) => t.stop());
            state.micTesting = false;
            if (chunks.length) {
              const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
              state.micSampleUrl = URL.createObjectURL(blob);
              state.micOk = true;
              state.micStatusMsg = "Micro hoạt động tốt! Bạn có thể bấm nghe lại đoạn thu thử bên dưới.";
            } else {
              state.micOk = true;
              state.micStatusMsg = "Đã kết nối Micro sẵn sàng.";
            }
            playCtiBeep(880, 180);
            render();
          };
          playCtiBeep(880, 220);
          rec.start();
          hskkMicTestTimer = setTimeout(() => {
            if (rec.state !== "inactive") rec.stop();
          }, 2500);
        } catch (err) {
          state.micTesting = false;
          state.micOk = false;
          state.micStatusMsg = "Không truy cập được Micro (đang tắt/từ chối quyền). Bạn vẫn vào phòng thi bấm giờ và tự chấm bình thường.";
          render();
        }
      };

      function startHskkGlobalTimer() {
        if (hskkGlobalTickId) { clearInterval(hskkGlobalTickId); hskkGlobalTickId = null; }
        hskkGlobalTickId = setInterval(() => {
          if (state.screen !== "exam" || !state.exam || state.exam.examKind !== "hskk") return;
          if (state.remainingSec > 0) {
            state.remainingSec -= 1;
            const el = document.getElementById("examTimerDisplay");
            if (el) {
              el.textContent = formatClock(state.remainingSec);
              el.classList.toggle("urgent", state.remainingSec > 0 && state.remainingSec < 180);
            }
          }
          if (state.remainingSec <= 0) {
            notifyToast("warn", "Đã hết tổng thời gian thi HSKK! Hệ thống đang hoàn tất phiếu ghi nhận.");
            finalizeHskkSubmission();
          }
        }, 1000);
      }

      function startHskkExam(baseEx) {
        stopAutoPlayListening();
        stopHskkEngine();
        clearExamTimer();
        const ex = JSON.parse(JSON.stringify(baseEx));
        state.exam = ex;
        state.pendingMockId = ex.id;
        state.screen = "exam";
        state.focusedQIdx = 0;
        state.remainingSec = Number(ex.durationSec || (ex.durationMin || 20) * 60);
        state.hskkPhase = "idle";
        state.hskkPhaseLeft = 0;
        state.hskkPrepDone = false;
        state.hskkNotes = {};
        state.hskkResponses = {};
        state.hskkLiveTranscript = "";
        state.showSheet = false;
        state.showSubmitModal = false;
        render();
        startHskkGlobalTimer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateHskkClockDom() {
        const el = document.getElementById("hskkPhaseClock");
        if (el) el.textContent = formatClock(state.hskkPhaseLeft);
      }

      function beginHskkMediaCapture(item) {
        state.hskkLiveTranscript = (state.hskkResponses[item.id] && state.hskkResponses[item.id].transcript) || "";
        // SpeechRecognition live transcript (if browser supports it)
        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SR) {
            const sr = new SR();
            sr.lang = "zh-CN";
            sr.continuous = true;
            sr.interimResults = true;
            let finalAcc = state.hskkLiveTranscript ? state.hskkLiveTranscript + " " : "";
            sr.onresult = (ev) => {
              let interim = "";
              for (let i = ev.resultIndex; i < ev.results.length; i++) {
                const txt = (ev.results[i][0] && ev.results[i][0].transcript) || "";
                if (ev.results[i].isFinal) finalAcc += txt;
                else interim += txt;
              }
              state.hskkLiveTranscript = (finalAcc + interim).trim();
              const box = document.getElementById("hskkLiveTranscriptBox");
              if (box) box.textContent = state.hskkLiveTranscript || "Đang thu âm giọng nói...";
            };
            sr.onerror = () => {};
            sr.start();
            hskkSpeechRec = sr;
          }
        } catch (e) {}
        // MediaRecorder audio blob capture
        if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function" && typeof window.MediaRecorder !== "undefined") {
          navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            if (state.hskkPhase !== "recording") {
              stream.getTracks().forEach((t) => t.stop());
              return;
            }
            hskkMediaStream = stream;
            hskkRecChunks = [];
            const rec = new MediaRecorder(stream);
            rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) hskkRecChunks.push(ev.data); };
            rec.start();
            hskkMediaRec = rec;
          }).catch(() => {});
        }
      }

      function commitHskkResponse(item) {
        if (!item) return;
        const prev = state.hskkResponses[item.id] || {};
        const note = String(state.hskkNotes[item.id] || "");
        const tr = String(state.hskkLiveTranscript || prev.transcript || "").trim();
        const usedSec = Math.max(1, Number(item.speakSeconds || 10) - Math.max(0, state.hskkPhaseLeft));
        state.hskkResponses[item.id] = Object.assign({}, prev, {
          transcript: tr,
          note: note,
          durationSec: prev.durationSec || usedSec,
          done: true
        });
      }

      function enterHskkRecordingPhase(idx, myToken) {
        const ex = state.exam;
        const item = ex && ex.items ? ex.items[idx] : null;
        if (!item || myToken !== hskkRunToken || state.screen !== "exam") return;
        state.hskkPhase = "recording";
        state.hskkPhaseLeft = Number(item.speakSeconds || 10);
        playCtiBeep(880, 320);
        render();
        beginHskkMediaCapture(item);
        if (hskkTickId) clearInterval(hskkTickId);
        hskkTickId = setInterval(() => {
          if (myToken !== hskkRunToken || state.screen !== "exam" || state.hskkPhase !== "recording") {
            clearInterval(hskkTickId);
            hskkTickId = null;
            return;
          }
          state.hskkPhaseLeft -= 1;
          updateHskkClockDom();
          if (state.hskkPhaseLeft <= 0) {
            clearInterval(hskkTickId);
            hskkTickId = null;
            window.finishHskkItemNow(state.mode === "real");
          }
        }, 1000);
      }

      window.startHskkItemFlow = function (idxOverride) {
        const ex = state.exam;
        if (!ex || ex.examKind !== "hskk" || !Array.isArray(ex.items)) return;
        const idx = idxOverride !== undefined ? idxOverride : state.focusedQIdx;
        const item = ex.items[idx];
        if (!item) return;
        if (hskkTickId) { clearInterval(hskkTickId); hskkTickId = null; }
        stopActiveRecorder(null);
        stopAudio();
        state.focusedQIdx = idx;
        const myToken = ++hskkRunToken;

        // CTI Part Preparation Window (7m for HSKK 初级 P3, 10m for HSKK 中级/高级 P2+P3)
        if (ex.partPrepSec > 0 && item.qNo >= Number(ex.prepStartQNo || 999) && !state.hskkPrepDone) {
          state.hskkPhase = "part_prep";
          state.hskkPhaseLeft = Number(ex.partPrepSec || 420);
          render();
          hskkTickId = setInterval(() => {
            if (myToken !== hskkRunToken || state.screen !== "exam" || state.hskkPhase !== "part_prep") {
              clearInterval(hskkTickId);
              hskkTickId = null;
              return;
            }
            state.hskkPhaseLeft -= 1;
            updateHskkClockDom();
            if (state.hskkPhaseLeft <= 0) {
              clearInterval(hskkTickId);
              hskkTickId = null;
              window.skipHskkPrepEarly();
            }
          }, 1000);
          return;
        }

        if ((item.kind === "repeat" || item.kind === "listen_qa" || item.kind === "retell") && item.listenZh) {
          state.hskkPhase = "listening";
          state.hskkPhaseLeft = 0;
          render();
          const finishListen = () => {
            setTimeout(() => {
              if (myToken === hskkRunToken && state.screen === "exam") {
                enterHskkRecordingPhase(idx, myToken);
              }
            }, 350);
          };
          if (window.HskTTS && typeof window.HskTTS.speak === "function") {
            Promise.resolve(window.HskTTS.speak(item.listenZh, { rate: state.audioRate })).then(finishListen, finishListen);
          } else {
            finishListen();
          }
          return;
        }

        enterHskkRecordingPhase(idx, myToken);
      };

      window.skipHskkPrepEarly = function () {
        if (!state.exam || state.exam.examKind !== "hskk") return;
        if (hskkTickId) { clearInterval(hskkTickId); hskkTickId = null; }
        state.hskkPrepDone = true;
        window.startHskkItemFlow(state.focusedQIdx);
      };

      window.finishHskkItemNow = function (autoNext) {
        const ex = state.exam;
        if (!ex || ex.examKind !== "hskk") return;
        const idx = state.focusedQIdx;
        const item = ex.items && ex.items[idx];
        if (!item) return;
        if (hskkTickId) { clearInterval(hskkTickId); hskkTickId = null; }
        hskkRunToken++;
        commitHskkResponse(item);
        stopActiveRecorder(item.id);
        playCtiBeep(660, 180);
        state.hskkPhase = "idle";
        state.hskkPhaseLeft = 0;
        if (autoNext) {
          if (idx + 1 < ex.items.length) {
            state.focusedQIdx = idx + 1;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            if (state.mode === "real") {
              setTimeout(() => {
                if (state.screen === "exam" && state.exam && state.exam.examKind === "hskk") {
                  window.startHskkItemFlow(idx + 1);
                }
              }, 500);
            }
            return;
          }
          finalizeHskkSubmission();
          return;
        }
        render();
      };

      window.jumpHskkQuestion = function (idx) {
        const ex = state.exam;
        if (!ex || ex.examKind !== "hskk" || !ex.items) return;
        const nextIdx = Math.max(0, Math.min(ex.items.length - 1, Number(idx) || 0));
        if (state.hskkPhase === "recording" && ex.items[state.focusedQIdx]) {
          commitHskkResponse(ex.items[state.focusedQIdx]);
          stopActiveRecorder(ex.items[state.focusedQIdx].id);
        }
        if (hskkTickId) { clearInterval(hskkTickId); hskkTickId = null; }
        hskkRunToken++;
        stopAudio();
        state.hskkPhase = "idle";
        state.hskkPhaseLeft = 0;
        state.focusedQIdx = nextIdx;
        state.showSheet = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      window.stepHskkFocus = function (delta) {
        if (!state.exam || state.exam.examKind !== "hskk") return;
        const target = state.focusedQIdx + delta;
        if (target >= (state.exam.items || []).length) {
          window.requestSubmitExam();
          return;
        }
        window.jumpHskkQuestion(target);

      window.onHskkNoteInput = function (itemId, el) {

      };

      window.onHskkTranscriptInput = function (itemId, el) {

        state.hskkResponses[itemId] = Object.assign({}, prev, { transcript: val, done: Boolean(val.trim() || prev.audioUrl || prev.done) });
      };

      window.playHskkPromptSample = function (itemId) {
        const ex = state.exam || state.lastReport;
        const list = (ex && (ex.items || (ex.reviews || []).map((r) => r.item))) || [];
        const it = list.find((x) => x && x.id === itemId);
        const txt = (it && (it.listenZh || it.sampleZh || it.promptZh)) || "";
        if (txt && window.HskTTS && typeof window.HskTTS.speak === "function") {
          window.HskTTS.speak(txt, { rate: state.audioRate || 1.0 });
        }
      };

      function evaluateHskkItem(item, resp) {
        const r = resp || {};
        const tr = String(r.transcript || "").trim();
        const note = String(r.note || state.hskkNotes[item.id] || "").trim();
        const text = tr || note;
        const zhCount = countHanzi(text);
        const kws = Array.isArray(item.keywords) ? item.keywords : [];
        const hitKw = kws.filter((kw) => kw && text.includes(kw)).length;
        let autoScore = 0;
        let detail = "";
        if (r.audioUrl || r.done || zhCount > 0) {
          if (item.kind === "repeat" && item.listenZh) {
            const refChars = normalizeZh(item.listenZh).split("");
            const uNorm = normalizeZh(tr);
            if (uNorm.length > 0 && refChars.length > 0) {
              const matched = refChars.filter((ch) => uNorm.includes(ch)).length;
              const matchRatio = matched / refChars.length;
              autoScore = Math.round(matchRatio * 100);
              detail = `STT khớp ${matched}/${refChars.length} âm tiết (${autoScore}%)`;
            } else {
              autoScore = r.audioUrl ? 75 : (r.done ? 65 : 0);
              detail = r.audioUrl ? "Đã ghi âm bài nói (nghe lại & tự đánh giá thanh điệu)" : "Đã hoàn thành lượt nói bấm giờ";
            }
          } else if (zhCount > 0) {
            const kwPart = kws.length ? Math.round((hitKw / kws.length) * 50) : 45;
            const lenTarget = item.kind === "listen_qa" ? 8 : 35;
            const lenPart = Math.round(Math.min(1, zhCount / lenTarget) * 50);
            autoScore = Math.min(100, kwPart + lenPart);
            detail = `${zhCount} chữ Hán ghi nhận` + (kws.length ? ` • Trúng ${hitKw}/${kws.length} từ gợi ý` : "");
          } else {
            autoScore = r.audioUrl ? 75 : 65;
            detail = r.audioUrl ? "Đã thu âm giọng nói — nghe lại bên dưới để tự chấm" : "Đã hoàn thành lượt thi bấm giờ";
          }
        } else {
          autoScore = 0;
          detail = "Chưa ghi nhận lượt nói";
        }
        return { autoScore, zhCount, hitKw, kwTotal: kws.length, detail };
      }

      function finalizeHskkSubmission() {
        const ex = state.exam;
        if (!ex || ex.examKind !== "hskk") return;
        const curItem = ex.items && ex.items[state.focusedQIdx];
        if (state.hskkPhase === "recording" && curItem) {
          commitHskkResponse(curItem);
          stopActiveRecorder(curItem.id);
        } else {
          stopActiveRecorder(null);
        }
        stopHskkEngine();
        exitFullscreenIfNeeded();
        state.showSubmitModal = false;
        state.showSheet = false;

        const reviews = (ex.items || []).map((item, idx) => {
          const resp = state.hskkResponses[item.id] || {};
          const ev = evaluateHskkItem(item, resp);
          return {
            idx,
            item,
            resp,
            ev,
            qualityChecks: {}
          };
        });
        const answeredCount = reviews.filter((x) => x.resp.done || x.resp.audioUrl || countHanzi(x.resp.transcript || state.hskkNotes[x.item.id] || "") > 0).length;
        const totalScore = reviews.length
          ? Math.round(reviews.reduce((s, r) => s + r.ev.autoScore, 0) / reviews.length)
          : 0;
        const report = {
          examKind: "hskk",
          id: ex.id,
          tier: ex.tier,
          tierLabel: ex.tierLabel,
          level: ex.level,
          title: ex.title,
          badge: ex.badge,
          candidateName: getCandidateName(),
          candidateTicket: getTicketNo(ex.id, ex.level),
          mode: state.mode,
          maxScore: Number(ex.maxScore || 100),
          passScore: Number(ex.passScore || 60),
          totalScore,
          passed: totalScore >= Number(ex.passScore || 60),
          answeredCount,
          totalItems: reviews.length,
          dateIso: new Date().toISOString(),
          reviews
        };
        state.lastReport = report;
        saveHskkResult(report);
        state.screen = "report";

        state[cfg.loadingKey] = true;

        fullBundlePromises[cfg.key] = new Promise((resolve) => {
          const prev = document.querySelector(`script[data-lp-full-bundle="${cfg.key}"]`);
          if (prev) prev.remove();
          const sc = document.createElement("script");
          sc.src = cfg.src;
          sc.async = true;
          sc.dataset.lpFullBundle = cfg.key;
          sc.onload = () => {
            syncMockTests();
            state[cfg.loadedKey] = Array.isArray(window[cfg.globalName]);
            state[cfg.loadingKey] = false;
            if (!state[cfg.loadedKey]) {
              state[cfg.errorKey] = `Không nạp được dữ liệu ${cfg.label}.`;

            fullBundlePromises[cfg.key] = null;

          };
          document.head.appendChild(sc);
        });
        return fullBundlePromises[cfg.key];
      }

      function stopAutoPlayListening() {
        autoPlayToken += 1;
        clearAutoPlayTick();
        if (autoPlaySkipResolver) {
          const fn = autoPlaySkipResolver;
          autoPlaySkipResolver = null;
          fn(false);
        }
        state.autoPlayActive = false;

      function updateAutoPlayBarInPlace() {
        const dot = document.getElementById("cbtAutoPlayDot");
        const txt = document.getElementById("cbtAutoPlayText");
        const skipBtn = document.getElementById("cbtAutoPlaySkipBtn");
        const togBtn = document.getElementById("cbtAutoPlayToggleBtn");
        if (dot) {
          dot.className = "cbt-wave-dot" + (state.autoPlayStatus === "playing" ? " playing" : ((state.autoPlayStatus === "pause" || state.autoPlayStatus === "next") ? " waiting" : ""));
        }
        if (txt) {
          const maxP = state.exam ? getMaxListeningPlays(state.exam.level) : 2;
          const used = state.listeningPlays[state.focusedQIdx] || 0;
          if (state.autoPlayStatus === "playing") {
            txt.textContent = maxP === 99
              ? `Đang phát lượt ${used} (Luyện đề tự do)...`
              : `Đang phát lượt ${Math.min(used, maxP)}/${maxP} — tập trung nghe...`;
          } else if (state.autoPlayStatus === "pause") {
            txt.textContent = `Nghỉ ${state.autoPlayCountdown} giây trước khi nghe lại lượt 2/2...`;
          } else if (state.autoPlayStatus === "next") {
            txt.textContent = `Chuẩn bị chuyển sang câu tiếp theo (${state.autoPlayCountdown}s)...`;
          } else if (state.autoPlayStatus === "done") {
            txt.textContent = "Đã hoàn tất phát tự động các câu Nghe trong chặng này.";
          } else {
            txt.textContent = state.autoPlayEnabled ? "Phát tự động liên hoàn đang BẬT" : "Phát tự động đang TẮT (nghe thủ công)";
          }
        }
        if (skipBtn) {
          const waiting = state.autoPlayStatus === "pause" || state.autoPlayStatus === "next";
          skipBtn.style.display = waiting ? "inline-flex" : "none";
        }
        if (togBtn) {
          togBtn.classList.toggle("on", Boolean(state.autoPlayEnabled));
          togBtn.innerHTML = `${mockSvg(state.autoPlayEnabled ? "pause" : "play", 13)} ${state.autoPlayEnabled ? "Tạm dừng tự động" : "Bật tự động phát"}`;
        }
      }

      function waitAutoPlaySeconds(seconds, statusName, myToken) {
        return new Promise((resolve) => {
          clearAutoPlayTick();
          let left = Math.max(1, Number(seconds) || 1);
          state.autoPlayActive = true;
          state.autoPlayStatus = statusName;
          state.autoPlayCountdown = left;
          updateAutoPlayBarInPlace();
          const finish = (ok) => {
            clearAutoPlayTick();
            if (autoPlaySkipResolver === finish) autoPlaySkipResolver = null;
            resolve(ok && myToken === autoPlayToken);
          };
          autoPlaySkipResolver = finish;
          autoPlayTickId = setInterval(() => {
            if (myToken !== autoPlayToken || state.screen !== "exam" || state.activeSection !== "listening") {
              finish(false);
              return;
            }
            left -= 1;
            state.autoPlayCountdown = Math.max(0, left);
            updateAutoPlayBarInPlace();
            if (left <= 0) finish(true);
          }, 1000);
        });
      }

      function speakWithGuard(text, rate, myToken) {
        const clean = String(text || "");
        const r = Number(rate) || 1.0;
        const estMs = Math.max(4000, Math.min(25000, Math.round((clean.length * 360) / r)));
        const speakPromise = (window.HskTTS && typeof window.HskTTS.speak === "function")
          ? Promise.resolve(window.HskTTS.speak(clean, { rate: r })).catch(() => false)
          : Promise.resolve(false);
        const timerPromise = new Promise((res) => setTimeout(() => res(true), estMs));
        return Promise.race([speakPromise, timerPromise]).then(() => myToken === autoPlayToken);
      }

      function updateListeningQuotaUi(idx) {
        if (!state.exam) return;
        const maxPlays = getMaxListeningPlays(state.exam.level);
        const qBadge = document.getElementById("listenQuota_" + idx);
        const btn = document.getElementById("listenPlayBtn_" + idx);
        const nextUsed = state.listeningPlays[idx] || 0;
        if (state.mode === "real") {
          const left = Math.max(0, maxPlays - nextUsed);
          if (qBadge) qBadge.textContent = left > 0 ? `Còn ${left}/${maxPlays} lượt` : `Hết lượt (0/${maxPlays})`;
          if (btn && left <= 0) {
            btn.disabled = true;
            btn.innerHTML = `${mockSvg("volumeOff", 14)} Hết lượt nghe`;
          }
        } else if (qBadge) {
          qBadge.textContent = `Đã nghe ${nextUsed} lượt • Không giới hạn`;
        }
      }

      async function runCbtListeningCycle(idx) {
        if (!state.autoPlayEnabled || state.screen !== "exam" || state.activeSection !== "listening") return;
        const ex = state.exam;
        const ls = ex && ex.listening ? ex.listening : [];
        const q = ls[idx];
        if (!q) return;
        const maxPlays = getMaxListeningPlays(ex.level);
        const used = state.listeningPlays[idx] || 0;
        if (state.mode === "real" && used >= maxPlays) return;

        const myToken = ++autoPlayToken;
        state.listeningPlays[idx] = used + 1;
        state.autoPlayActive = true;
        state.autoPlayStatus = "playing";
        updateListeningQuotaUi(idx);
        updateAutoPlayBarInPlace();
        saveDraft();

        const okSpeak1 = await speakWithGuard(q.audioZh, state.audioRate, myToken);
        if (!okSpeak1 || state.screen !== "exam" || state.activeSection !== "listening" || state.focusedQIdx !== idx) return;

        const afterFirst = state.listeningPlays[idx] || 0;
        if (state.mode === "real" && maxPlays === 2 && afterFirst < 2 && state.autoPlayEnabled) {
          const okPause = await waitAutoPlaySeconds(3, "pause", myToken);
          if (!okPause || state.screen !== "exam" || state.activeSection !== "listening" || state.focusedQIdx !== idx) return;
          state.listeningPlays[idx] = afterFirst + 1;
          state.autoPlayStatus = "playing";
          updateListeningQuotaUi(idx);
          updateAutoPlayBarInPlace();
          saveDraft();
          const okSpeak2 = await speakWithGuard(q.audioZh, state.audioRate, myToken);
          if (!okSpeak2 || state.screen !== "exam" || state.activeSection !== "listening" || state.focusedQIdx !== idx) return;
        }

        if (!state.autoPlayEnabled) {
          state.autoPlayActive = false;
          state.autoPlayStatus = "idle";
          updateAutoPlayBarInPlace();
          return;
        }

        if (idx + 1 < ls.length) {
          const okNext = await waitAutoPlaySeconds(5, "next", myToken);

      window.highlightSelection = function () {
        if (state.activeSection !== "reading") return;
        const container = document.getElementById("cbtPassageBody");
        if (!container) return;
        const sel = window.getSelection ? window.getSelection() : null;
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
          notifyToast("info", "Hãy bôi đen đoạn chữ trong văn bản rồi bấm nút Bôi vàng.");
          return;
        }
        const range = sel.getRangeAt(0);
        if (!container.contains(range.commonAncestorContainer)) {
          notifyToast("info", "Chỉ bôi vàng được phần chữ bên trong khung Đoạn văn.");
          return;
        }
        try {
          const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
          const targets = [];
          let tn;
          while ((tn = walker.nextNode())) {
            if (!tn.nodeValue || !tn.nodeValue.trim()) continue;
            if (tn.parentElement && tn.parentElement.closest("mark.cbt-hl")) continue;
            const nodeRange = document.createRange();
            nodeRange.selectNodeContents(tn);
            if (
              range.compareBoundaryPoints(Range.END_TO_START, nodeRange) < 0 &&
              range.compareBoundaryPoints(Range.START_TO_END, nodeRange) > 0
            ) {
              const s = tn === range.startContainer ? range.startOffset : 0;
              const e = tn === range.endContainer ? range.endOffset : tn.nodeValue.length;
              if (e > s) targets.push({ tn, s, e });
            }
          }
          if (!targets.length) {
            sel.removeAllRanges();
            return;
          }
          targets.forEach(({ tn: textNode, s, e }) => {
            const val = textNode.nodeValue;
            const frag = document.createDocumentFragment();
            if (s > 0) frag.appendChild(document.createTextNode(val.slice(0, s)));
            const mark = document.createElement("mark");
            mark.className = "cbt-hl";
            mark.textContent = val.slice(s, e);
            frag.appendChild(mark);
            if (e < val.length) frag.appendChild(document.createTextNode(val.slice(e)));
            if (textNode.parentNode) textNode.parentNode.replaceChild(frag, textNode);
          });
          sel.removeAllRanges();
          state.highlights["reading:" + state.focusedQIdx] = container.innerHTML;
          saveDraft();
          const clrBtn = document.getElementById("cbtClearHlBtn");
          if (clrBtn) clrBtn.style.display = "inline-flex";
        } catch (err) {
          notifyToast("warn", "Không thể bôi vàng vùng chọn này, hãy thử chọn gọn trong đoạn.");
        }
      };

      function renderCheckin() {
        const baseEx = MOCK_TESTS.find((x) => x.id === state.pendingMockId) || HSKK_TESTS.find((x) => x.id === state.pendingMockId) || MOCK_TESTS[0];
        if (!baseEx) return renderLobby();
        if (baseEx.examKind === "hskk") return renderHskkCheckin(baseEx);
        const ticket = getTicketNo(baseEx.id, baseEx.level);
        const hasBaseWriting = (baseEx.writing || []).length > 0;
        if (state.scope === "writing" && !hasBaseWriting) state.scope = "all";
        const previewEx = buildScopedExam(baseEx, state.scope, state.partFilter);
        const lLen = (previewEx.listening || []).length;
        const rLen = (previewEx.reading || []).length;
        const wLen = (previewEx.writing || []).length;
        const totalQ = lLen + rLen + wLen;
        const mins = state.scope === "all"
          ? Math.round(Number(baseEx.durationSec || (baseEx.durationMin * 60) || 1500) / 60)
          : Number(previewEx.durationMin || 10);
        const maxListen = getMaxListeningPlays(baseEx.level);
        const partList = getExamPartList(baseEx, state.scope);
        const previewSecCount = getAvailableSections(previewEx).length;

                        <span>Chỉ Viết (书写)</span>
                        <span class="sp-sub">${(baseEx.writing || []).length} câu</span>

                  </div>
                  ${partList.length > 1 ? `
                    <div class="part-filter-row">
                      <button type="button" class="part-pill ${state.partFilter === "all" ? "active" : ""}" onclick="setCheckinPartFilter('all')">Tất cả các Phần (${partList.length})</button>
                      ${partList.map((pl) => `<button type="button" class="part-pill ${state.partFilter === pl ? "active" : ""}" onclick="setCheckinPartFilter('${escAttr(pl)}')">${esc(pl)}</button>`).join("")}

                <table class="spec-table">
                  <thead>
                    <tr><th>Chặng thi</th><th>Số câu</th><th>Quy chế CTI áp dụng</th></tr>
                  </thead>
                  <tbody>
                    ${lLen > 0 ? `<tr><td><b>1. Nghe hiểu (听力)</b></td><td>${lLen} câu</td><td>${state.mode === "real" ? `Tối đa ${maxListen} lượt/câu (HSK ${baseEx.level})` : "Không giới hạn lượt"}</td></tr>` : ""}
                    ${rLen > 0 ? `<tr><td><b>2. Đọc hiểu (阅读)</b></td><td>${rLen} câu</td><td>Chia đôi màn hình + Bôi vàng từ khóa</td></tr>` : ""}
                    ${wLen > 0 ? `<tr><td><b>3. Phần Viết (书写)</b></td><td>${wLen} câu</td><td>${Number(baseEx.level) === 6 ? "10p đọc gốc → Nhập tiêu đề &amp; Viết tóm tắt" : "Xếp từ / Gõ câu chữ Hán"}</td></tr>` : ""}

                <div style="font-size:12px;color:var(--muted);line-height:1.45;">

                    : (state.scope !== "all" ? "<b>Luyện tập theo phần:</b> Kết quả được lưu vào Lịch sử cá nhân, không ghi đè điểm tổng đánh giá Lộ trình." : "<b>Chế độ Luyện đề:</b> Tự do chuyển qua lại giữa các chặng và xem lại bài gốc HSK 6.")}

      function renderCbtNavRailInner(ex) {
        const ls = ex.listening || [];
        const rs = ex.reading || [];
        const ws = ex.writing || [];
        const lockMode = isSectionLockedMode();

        const makeGroup = (sec, iconName, title, arr, isDoneFn) => {
          if (!arr.length) return "";
          const isLocked = lockMode && Boolean(state.lockedSections && state.lockedSections[sec]);
          return `
            <div class="sheet-group">
              <div class="sheet-group-label" style="justify-content:space-between;">
                <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg(iconName, 13)} ${title}</span>
                ${isLocked ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);">${mockSvg("lock", 11)} Đã khóa</span>` : ""}
              </div>
              <div class="sheet-grid">
                ${arr.map((q, idx) => {
                  const done = isDoneFn(q, idx);
                  const fl = Boolean(state.flagged[sec + ":" + idx]);
                  const cur = state.activeSection === sec && state.focusedQIdx === idx;
                  return `<button class="sheet-cell ${done ? "done" : ""} ${fl ? "flagged" : ""} ${cur ? "is-current" : ""} ${isLocked ? "locked" : ""}" onclick="jumpToQuestion('${sec}', ${idx})" title="${isLocked ? "Đã khóa theo quy chế" : "Câu " + (idx + 1)}">${idx + 1}</button>`;
                }).join("")}
              </div>
            </div>
          `;
        };

        return `
          <div class="cbt-rail-head">
            <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg("layers", 14)} Bảng số câu</span>
            <span style="font-size:11.5px;color:var(--muted);font-weight:700;">Bấm để chuyển</span>
          </div>
          <div class="sheet-legend" style="margin-bottom:6px;gap:8px;font-size:11.5px;">
            <span><i class="sheet-dot done"></i>Đã làm</span>
            <span><i class="sheet-dot todo"></i>Chưa</span>
            <span><i class="sheet-dot flagged"></i>Cắm cờ</span>
          </div>
          ${makeGroup("listening", "volume", "1. Nghe hiểu", ls, (_, i) => state.listeningAnswers[i] !== undefined)}
          ${makeGroup("reading", "book", "2. Đọc hiểu", rs, (_, i) => state.readingAnswers[i] !== undefined)}
          ${makeGroup("writing", "edit", "3. Phần Viết", ws, (q, i) => isWritingAnswered(q, i))}
        `;
