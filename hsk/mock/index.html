      function renderOrderItemsHtml(orderItems, includeGloss) {
        if (!Array.isArray(orderItems) || !orderItems.length) return "";
        return `
          <div class="order-list">
            ${orderItems.map((it) => {
              if (typeof it === "string") {
                return `<div class="order-item">${esc(it)}</div>`;
              }
              return `
                <div class="order-item">
                  <b>${esc(it.key || "")}.</b> ${esc(it.zh || "")}
                  ${includeGloss && it.py ? `<div class="py-line">${esc(it.py)}</div>` : ""}
                  ${includeGloss && it.vi ? `<div class="vi-line">${esc(it.vi)}</div>` : ""}
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderSingleListening(ex, idx) {
        const ls = ex.listening || [];
        const q = ls[idx];
        if (!q) return `<div class="surface-card">Không tìm thấy câu hỏi Nghe.</div>`;
        const maxPlays = getMaxListeningPlays(ex.level);
        const used = state.listeningPlays[idx] || 0;
        const left = Math.max(0, maxPlays - used);
        const exhausted = state.mode === "real" && left <= 0;
        const picked = state.listeningAnswers[idx];
        const isFlag = Boolean(state.flagged["listening:" + idx]);
        const hasMatchBank = Array.isArray(q.matchBank) && q.matchBank.length > 0;
        const hasOptImgs = Array.isArray(q.optImgs) && q.optImgs.length > 0;
        const hasVisualMedia = Boolean(q.img) || hasOptImgs || (hasMatchBank && q.matchBank.some((it) => it && it.img));
        const quotaLabel = state.mode === "real"
          ? (left > 0 ? `Còn ${left}/${maxPlays} lượt` : `Hết lượt (0/${maxPlays})`)
          : `Đã nghe ${used} lượt • Không giới hạn`;
        const sceneBadge = hasVisualMedia ? null : inferSceneBadge(q, ex.level);
        const waitingNow = state.autoPlayStatus === "pause" || state.autoPlayStatus === "next";
        let autoTxt = state.autoPlayEnabled ? "Phát tự động liên hoàn đang BẬT" : "Phát tự động đang TẮT (nghe thủ công)";
        if (state.autoPlayStatus === "playing") {
          autoTxt = maxPlays === 99
            ? `Đang phát lượt ${used} (Luyện đề tự do)...`
            : `Đang phát lượt ${Math.min(used, maxPlays)}/${maxPlays} — tập trung nghe...`;
        } else if (state.autoPlayStatus === "pause") {
          autoTxt = `Nghỉ ${state.autoPlayCountdown} giây trước khi nghe lại lượt 2/2...`;
        } else if (state.autoPlayStatus === "next") {
          autoTxt = `Chuẩn bị chuyển sang câu tiếp theo (${state.autoPlayCountdown}s)...`;
        } else if (state.autoPlayStatus === "done") {
          autoTxt = "Đã hoàn tất phát tự động các câu Nghe trong chặng này.";
        }

        const usedElsewhere = {};
        if (hasMatchBank) {
          const grpKey = q.matchGroup || q.partLabel || "";
          ls.forEach((otherQ, otherIdx) => {
            if (otherIdx === idx || !otherQ || !Array.isArray(otherQ.matchBank)) return;
            if ((otherQ.matchGroup || otherQ.partLabel || "") !== grpKey) return;
            const ansIdx = state.listeningAnswers[otherIdx];
            if (ansIdx !== undefined && ansIdx !== null && usedElsewhere[ansIdx] === undefined) {
              usedElsewhere[ansIdx] = otherIdx + 1;
            }
          });
        }

        const bankHtml = hasMatchBank ? `
          <div class="cbt-hl-bar">
            <span class="cbt-hl-hint">${mockSvg("image", 13)} Bảng tranh ghép chung (A–${String.fromCharCode(64 + q.matchBank.length)})</span>
          </div>
          ${q.matchBank.some((it) => it && it.img) ? `
            <div class="cbt-bank-img-grid">
              ${q.matchBank.map((item, bi) => {
                const labelKey = (item && item.key) || String.fromCharCode(65 + bi);
                const byQ = usedElsewhere[bi];
                return `
                  <div class="cbt-bank-img-card ${byQ ? "used-elsewhere" : ""}">
                    <div class="cbt-bank-img-head">
                      <span>Tranh ${esc(labelKey)}</span>
                      ${byQ ? `<span class="cbt-bank-used-tag">Câu ${byQ}</span>` : ""}
                    </div>
                    <img src="${escAttr(item.img)}" alt="Tranh ${escAttr(labelKey)}" loading="lazy">
                  </div>
                `;
              }).join("")}
            </div>
          ` : `
            <div class="cbt-bank-list">
              ${q.matchBank.map((item, bi) => {
                const labelKey = (item && item.key) || String.fromCharCode(65 + bi);
                const labelText = typeof item === "string" ? item : ((item && (item.zh || item.text)) || "");
                const byQ = usedElsewhere[bi];
                return `
                  <div class="cbt-bank-item ${byQ ? "used-elsewhere" : ""}">
                    <span><b>${esc(labelKey)}.</b> ${esc(labelText)}</span>
                    ${byQ ? `<span class="cbt-bank-used-tag">Đã chọn Câu ${byQ}</span>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          `}
        ` : "";

        const listenBodyHtml = `
          ${sceneBadge ? `
            <div class="cbt-scene-card">
              <div class="cbt-scene-icon">${mockSvg("image", 18)}</div>
              <div class="cbt-scene-meta">
                <span class="cbt-scene-tag">Thẻ ngữ cảnh thị giác • ${esc(sceneBadge.tag)}</span>
                <span class="cbt-scene-title">${esc(sceneBadge.title)}</span>
              </div>
            </div>
          ` : ""}
          <div class="audio-box">
            <button class="play-btn" id="listenPlayBtn_${idx}" onclick="playListeningAudio(${idx})" ${exhausted ? "disabled" : ""}>
              ${exhausted ? `${mockSvg("volumeOff", 14)} Hết lượt nghe` : `${mockSvg("volume", 14)} Phát băng nghe (Câu ${idx + 1})`}
            </button>
            <span id="listenQuota_${idx}" style="font-size:12.5px;font-weight:800;color:var(--muted);">${quotaLabel}</span>
          </div>
          ${q.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(q.img)}" alt="Hình minh họa câu ${idx + 1}" loading="lazy"></div>` : ""}
          <div class="q-prompt">Câu ${idx + 1}/${ls.length}: ${esc(q.prompt)}</div>
          ${q.statement ? `<div class="q-stmt">“${esc(q.statement)}”</div>` : ""}
          ${hasOptImgs ? `
            <div class="cbt-opt-img-grid">
              ${q.optImgs.map((imgUrl, oi) => {
                const lbl = (q.opts && q.opts[oi]) || `Tranh ${String.fromCharCode(65 + oi)}`;
                return `
                  <button type="button" class="cbt-opt-img-card ${picked === oi ? "selected" : ""}" onclick="selectChoice('listening', ${idx}, ${oi})">
                    <img src="${escAttr(imgUrl)}" alt="${escAttr(lbl)}" loading="lazy">
                    <span class="cbt-opt-img-lbl">${String.fromCharCode(65 + oi)}. ${esc(lbl)}</span>
                  </button>
                `;
              }).join("")}
            </div>
          ` : `
            <div class="opts-grid" ${hasMatchBank ? 'style="grid-template-columns:minmax(0,1fr);"' : ""}>
              ${(q.opts || []).map((opt, oi) => {
                const prefix = q.type === "tf" ? "" : `${String.fromCharCode(65 + oi)}. `;
                const usedTag = usedElsewhere[oi] ? ` (Đã chọn Câu ${usedElsewhere[oi]})` : "";
                return `<button class="opt-btn ${picked === oi ? "selected" : ""}" onclick="selectChoice('listening', ${idx}, ${oi})">${prefix}${esc(opt)}${usedTag ? `<span style="font-size:11.5px;opacity:.75;margin-left:6px;">${esc(usedTag)}</span>` : ""}</button>`;
              }).join("")}
            </div>
          `}
        `;

        return `
          <div class="cbt-stage-banner">
            <span style="display:inline-flex;align-items:center;gap:6px;">${mockSvg(state.mode === "real" ? "target" : "book", 14)} ${state.mode === "real" ? `Thi thật HSK ${ex.level}: tối đa ${maxPlays} lượt nghe/câu, ẩn Transcript &amp; Pinyin.` : "Luyện đề: nghe không giới hạn lượt."}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:12px;font-weight:800;">Tốc độ:</span>
              <div class="rate-toggle">
                <button class="rate-opt ${state.audioRate === 0.85 ? "on" : ""}" data-rate="0.85" onclick="setAudioRate(0.85)">${mockSvg("clock", 12)} 0.85x</button>
                <button class="rate-opt ${state.audioRate === 1.0 ? "on" : ""}" data-rate="1" onclick="setAudioRate(1.0)">${mockSvg("zap", 12)} 1.0x</button>
              </div>
            </div>
          </div>
          <div class="cbt-autoplay-bar">
            <div class="cbt-autoplay-status">
              <span id="cbtAutoPlayDot" class="cbt-wave-dot ${state.autoPlayStatus === "playing" ? "playing" : (waitingNow ? "waiting" : "")}"></span>
              <span id="cbtAutoPlayText">${autoTxt}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <button type="button" id="cbtAutoPlaySkipBtn" class="tool-btn" style="padding:5px 10px;font-size:12px;display:${waitingNow ? "inline-flex" : "none"};" onclick="skipAutoPlayWait()">
                ${mockSvg("skipForward", 13)} Bỏ qua chờ
              </button>
              <button type="button" id="cbtAutoPlayToggleBtn" class="tool-btn ${state.autoPlayEnabled ? "on" : ""}" style="padding:5px 10px;font-size:12px;" onclick="toggleAutoPlay()">
                ${mockSvg(state.autoPlayEnabled ? "pause" : "play", 13)} ${state.autoPlayEnabled ? "Tạm dừng tự động" : "Bật tự động phát"}
              </button>
            </div>
          </div>
          <article class="q-card cbt-focus-card ${isFlag ? "is-flagged" : ""}" id="qCard_listening_${idx}">
            <div class="q-head-row">
              <span class="q-part-badge">${esc(q.partLabel || ("Nghe hiểu • Câu " + (idx + 1)))}</span>
              <button class="flag-btn ${isFlag ? "on" : ""}" onclick="toggleFlag('listening', ${idx})">${mockSvg("flag", 13)} ${isFlag ? "Đã cắm cờ" : "Cắm cờ"}</button>
            </div>
            ${hasMatchBank ? `
              <div class="cbt-split">
                <div class="cbt-passage-pane">${bankHtml}</div>
                <div class="cbt-question-pane">${listenBodyHtml}</div>
              </div>
            ` : listenBodyHtml}
          </article>
        `;
      }

      function renderSingleReading(ex, idx) {
        const rs = ex.reading || [];
        const q = rs[idx];
        if (!q) return `<div class="surface-card">Không tìm thấy câu hỏi Đọc.</div>`;
        const picked = state.readingAnswers[idx];
        const isFlag = Boolean(state.flagged["reading:" + idx]);
        const hasPassage = Boolean(q.passageZh);
        const hasOrder = q.kind === "order" && Array.isArray(q.orderItems) && q.orderItems.length > 0;
        const hasMatchBank = Array.isArray(q.matchBank) && q.matchBank.length > 0;
        const hasMatchImgBank = hasMatchBank && q.matchBank.some((it) => it && it.img);
        const useSplit = hasPassage || hasOrder || hasMatchBank;
        const hlKey = "reading:" + idx;
        const hasHl = Boolean(state.highlights[hlKey]);
        const passageHtml = state.highlights[hlKey] || esc(q.passageZh || "");
        const sceneBadge = (q.img || hasMatchImgBank) ? null : inferSceneBadge(q, ex.level);

        const usedElsewhere = {};
        if (hasMatchBank) {
          const grpKey = q.matchGroup || q.partLabel || "";
          rs.forEach((otherQ, otherIdx) => {
            if (otherIdx === idx || !otherQ || !Array.isArray(otherQ.matchBank)) return;
            if ((otherQ.matchGroup || otherQ.partLabel || "") !== grpKey) return;
            const ansIdx = state.readingAnswers[otherIdx];
            if (ansIdx !== undefined && ansIdx !== null && usedElsewhere[ansIdx] === undefined) {
              usedElsewhere[ansIdx] = otherIdx + 1;
            }
          });
        }

        const headHtml = `
          <div class="q-head-row">
            <span class="q-part-badge">${esc(q.partLabel || ("Đọc hiểu • Câu " + (idx + 1)))}</span>
            <button class="flag-btn ${isFlag ? "on" : ""}" onclick="toggleFlag('reading', ${idx})">${mockSvg("flag", 13)} ${isFlag ? "Đã cắm cờ" : "Cắm cờ"}</button>
          </div>
        `;

        const questionBlock = `
          ${q.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(q.img)}" alt="Hình minh họa câu ${idx + 1}" loading="lazy"></div>` : ""}
          ${sceneBadge && !useSplit ? `
            <div class="cbt-scene-card">
              <div class="cbt-scene-icon">${mockSvg("image", 18)}</div>
              <div class="cbt-scene-meta">
                <span class="cbt-scene-tag">Thẻ ngữ cảnh thị giác • ${esc(sceneBadge.tag)}</span>
                <span class="cbt-scene-title">${esc(sceneBadge.title)}</span>
              </div>
            </div>
          ` : ""}
          ${q.kind === "match" && !hasPassage && q.q && (q.q.includes("A:") || q.q.includes("甲：") || q.q.includes("女：") || q.q.includes("男："))
            ? `<div class="cbt-match-dialog"><div class="q-prompt" style="margin:0;">Câu ${idx + 1}/${rs.length}: ${esc(q.q)}</div></div>`
            : `<div class="q-prompt">Câu ${idx + 1}/${rs.length}: ${esc(q.q)}</div>`
          }
          <div class="opts-grid" ${useSplit ? 'style="grid-template-columns:minmax(0,1fr);"' : ""}>
            ${(q.opts || []).map((opt, oi) => {
              const prefix = q.kind === "tf" ? "" : `${String.fromCharCode(65 + oi)}. `;
              const usedTag = usedElsewhere[oi] ? ` (Đã chọn Câu ${usedElsewhere[oi]})` : "";
              return `<button class="opt-btn ${picked === oi ? "selected" : ""}" onclick="selectChoice('reading', ${idx}, ${oi})">${prefix}${esc(opt)}${usedTag ? `<span style="font-size:11.5px;opacity:.75;margin-left:6px;">${esc(usedTag)}</span>` : ""}</button>`;
            }).join("")}
          </div>
        `;

        if (!useSplit) {
          return `
            <article class="q-card cbt-focus-card ${isFlag ? "is-flagged" : ""}" id="qCard_reading_${idx}">
              ${headHtml}
              ${questionBlock}
            </article>
          `;
        }

        return `
          <article class="q-card cbt-focus-card ${isFlag ? "is-flagged" : ""}" id="qCard_reading_${idx}">
            ${headHtml}
            <div class="cbt-split">
              <div class="cbt-passage-pane">
                ${sceneBadge ? `
                  <div class="cbt-scene-card">
                    <div class="cbt-scene-icon">${mockSvg("image", 18)}</div>
                    <div class="cbt-scene-meta">
                      <span class="cbt-scene-tag">Thẻ ngữ cảnh thị giác • ${esc(sceneBadge.tag)}</span>
                      <span class="cbt-scene-title">${esc(sceneBadge.title)}</span>
                    </div>
                  </div>
                ` : ""}
                ${hasPassage ? `
                  <div class="cbt-hl-bar">
                    <span class="cbt-hl-hint">${mockSvg("book", 13)} Văn bản đọc hiểu</span>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                      <button type="button" class="tool-btn" style="padding:4px 9px;font-size:11.5px;" onclick="highlightSelection()">${mockSvg("highlighter", 12)} Bôi vàng</button>
                      <button type="button" id="cbtClearHlBtn" class="tool-btn" style="padding:4px 9px;font-size:11.5px;display:${hasHl ? "inline-flex" : "none"};" onclick="clearPassageHighlight()">${mockSvg("close", 12)} Xóa bôi vàng</button>
                    </div>
                  </div>
                  <div class="${q.kind === "match" ? "cbt-match-dialog" : "passage-box"}" id="cbtPassageBody">${passageHtml}</div>
                ` : ""}
                ${hasMatchBank ? `
                  <div class="cbt-hl-bar">
                    <span class="cbt-hl-hint">${mockSvg(hasMatchImgBank ? "image" : "layers", 13)} ${hasMatchImgBank ? "Bảng tranh ghép chung" : "Ngân hàng ghép chung"} (A–${String.fromCharCode(64 + q.matchBank.length)})</span>
                  </div>
                  ${hasMatchImgBank ? `
                    <div class="cbt-bank-img-grid">
                      ${q.matchBank.map((item, bi) => {
                        const labelKey = (item && item.key) || String.fromCharCode(65 + bi);
                        const byQ = usedElsewhere[bi];
                        return `
                          <div class="cbt-bank-img-card ${byQ ? "used-elsewhere" : ""}">
                            <div class="cbt-bank-img-head">
                              <span>Tranh ${esc(labelKey)}</span>
                              ${byQ ? `<span class="cbt-bank-used-tag">Câu ${byQ}</span>` : ""}
                            </div>
                            <img src="${escAttr(item.img)}" alt="Tranh ${escAttr(labelKey)}" loading="lazy">
                          </div>
                        `;
                      }).join("")}
                    </div>
                  ` : `
                    <div class="cbt-bank-list">
                      ${q.matchBank.map((item, bi) => {
                        const labelKey = (item && item.key) || String.fromCharCode(65 + bi);
                        const labelText = typeof item === "string" ? item : ((item && (item.zh || item.text)) || "");
                        const byQ = usedElsewhere[bi];
                        return `
                          <div class="cbt-bank-item ${byQ ? "used-elsewhere" : ""}">
                            <span><b>${esc(labelKey)}.</b> ${esc(labelText)}</span>
                            ${byQ ? `<span class="cbt-bank-used-tag">Đã chọn Câu ${byQ}</span>` : ""}
                          </div>
                        `;
                      }).join("")}
                    </div>
                  `}
                ` : ""}
                ${hasOrder ? `
                  <div class="cbt-hl-bar">
                    <span class="cbt-hl-hint">${mockSvg("layers", 13)} Các câu cần sắp xếp thứ tự</span>
                  </div>
                  ${renderOrderItemsHtml(q.orderItems, false)}
                ` : ""}
              </div>
              <div class="cbt-question-pane">
                ${questionBlock}
              </div>
            </div>
          </article>
        `;
      }

      function renderSingleWriting(ex, idx) {
        const ws = ex.writing || [];
        const q = ws[idx];
        if (!q) return `<div class="surface-card">Không tìm thấy câu hỏi Viết.</div>`;
        const isFlag = Boolean(state.flagged["writing:" + idx]);
        return `<article class="q-card cbt-focus-card ${isFlag ? "is-flagged" : ""}" id="qCard_writing_${idx}">${renderWritingCardInner(q, idx)}</article>`;
      }

      function renderWritingCardInner(q, idx) {
        const isFlag = Boolean(state.flagged["writing:" + idx]);
        const headHtml = `
          <div class="q-head-row">
            <span class="q-part-badge">${esc(q.partLabel || ("Phần Viết • Câu " + (idx + 1)))}</span>
            <button class="flag-btn ${isFlag ? "on" : ""}" onclick="event.stopPropagation();toggleFlag('writing', ${idx})">${mockSvg("flag", 13)} ${isFlag ? "Đã cắm cờ" : "Cắm cờ"}</button>
          </div>
        `;

        if (q.type === "reorder") {
          const picked = Array.isArray(state.writingAnswers[idx]) ? state.writingAnswers[idx] : [];
          const words = q.words || [];
          return `
            ${headHtml}
            <div class="q-prompt">Câu ${idx + 1}: Bấm lần lượt các thẻ từ bên dưới để ghép thành câu hoàn chỉnh</div>
            <div class="reorder-tray">
              ${picked.length
                ? picked.map((wi, pos) => `<button class="word-chip picked" onclick="removeReorderWord(${idx}, ${pos})">${esc(words[wi])}</button>`).join("")
                : `<span style="font-size:13px;color:var(--muted);">Chạm vào các thẻ từ để ghép câu tại đây...</span>`
              }
            </div>
            <div class="reorder-bank">
              ${words.map((w, wi) => {
                const used = picked.includes(wi);
                return `<button class="word-chip ${used ? "used" : ""}" ${used ? "disabled" : `onclick="pickReorderWord(${idx}, ${wi})"`}>${esc(w)}</button>`;
              }).join("")}
            </div>
            <button class="tool-btn" onclick="resetReorderWord(${idx})">${mockSvg("refresh", 13)} Làm lại</button>
          `;
        }

        if (q.type === "pinyin_write") {
          const val = String(state.writingAnswers[idx] || "");
          return `
            ${headHtml}
            <div class="q-prompt">Câu ${idx + 1}: Nhìn Pinyin và gõ chữ Hán còn thiếu vào ô trống</div>
            <div class="passage-box" style="font-size:17px;">
              ${esc(q.sentenceBefore || "")}<span style="padding:2px 8px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-weight:800;">[ ${esc(q.targetPy || "")} ]</span>${esc(q.sentenceAfter || "")}
            </div>
            ${q.hint ? `<div style="font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px;">${mockSvg("lightbulb", 14)} <span>Gợi ý nghĩa: <b>${esc(q.hint)}</b></span></div>` : ""}
            <input type="text" id="writingPinyin_${idx}" name="writingPinyin_${idx}" class="hanzi-input" placeholder="Nhập chữ Hán tương ứng..." value="${esc(val)}" oninput="onWritingTextInput(${idx}, this)">
          `;
        }

        if (q.type === "make_sentence") {
          const val = String(state.writingAnswers[idx] || "");
          return `
            ${headHtml}
            <div class="q-prompt">Câu ${idx + 1}: Đặt một câu tiếng Trung hoàn chỉnh có sử dụng từ khóa dưới đây</div>
            ${q.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(q.img)}" alt="Hình minh họa đặt câu" loading="lazy"></div>` : ""}
            <div class="q-stmt">
              Từ khóa: <b style="font-size:18px;">${esc(q.keyword || "")}</b>
              ${q.keywordPy ? `<span style="color:var(--primary);margin-left:6px;">[${esc(q.keywordPy)}]</span>` : ""}
              ${q.sceneHint ? `<div style="font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:5px;">${mockSvg("pin", 13)} <span>Bối cảnh gợi ý: ${esc(q.sceneHint)}</span></div>` : ""}
            </div>
            <input type="text" id="writingSentence_${idx}" name="writingSentence_${idx}" class="hanzi-input" placeholder="Nhập câu tiếng Trung (tối thiểu 6 chữ Hán)..." value="${esc(val)}" oninput="onWritingTextInput(${idx}, this)">
            <div class="counter-line">
              <span id="hanziCnt_${idx}">${countHanzi(val)} chữ Hán</span>
              <span>Yêu cầu: chứa từ khóa + tối thiểu 6 chữ Hán</span>
            </div>
          `;
        }

        if (q.type === "essay_keywords") {
          const val = String(state.writingAnswers[idx] || "");
          const kws = Array.isArray(q.keywords) ? q.keywords : [];
          return `
            ${headHtml}
            <div class="q-prompt">Câu ${idx + 1}: ${esc(q.title || "Viết đoạn văn theo 5 từ khóa")}</div>
            ${q.promptVi ? `<p style="margin:0 0 8px;font-size:13.5px;color:var(--muted);line-height:1.5;">${esc(q.promptVi)}</p>` : ""}
            ${q.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(q.img)}" alt="Hình minh họa viết đoạn văn" loading="lazy"></div>` : ""}
            ${kws.length ? `
              <div class="kw-chips" id="kwPills_${idx}">
                ${kws.map((kw) => `<span class="kw-chip ${val.includes(kw) ? "hit" : ""}">${esc(kw)}</span>`).join("")}
              </div>
            ` : ""}
            <textarea id="writingEssay_${idx}" name="writingEssay_${idx}" class="essay-textarea" placeholder="${kws.length ? "Viết đoạn văn tiếng Trung sử dụng đủ 5 từ khóa trên..." : "Viết đoạn văn tiếng Trung bám sát nội dung bức ảnh (khoảng 80 chữ Hán)..."}" oninput="onWritingTextInput(${idx}, this)">${esc(val)}</textarea>
            <div class="counter-line">
              <span id="hanziCnt_${idx}">${countHanzi(val)} / ${q.targetChars || 80} chữ Hán (tối thiểu ${q.minChars || 60})</span>
              <span>${kws.length ? "Tự động tô xanh khi gõ trúng từ khóa" : "Chú ý cấu trúc mạch lạc, đúng ngữ pháp & sát tranh"}</span>
            </div>
          `;
        }

        if (q.type === "essay_summary") {
          const val = String(state.writingAnswers[idx] || "");
          const titleVal = String((state.writingTitles && state.writingTitles[idx]) || "");
          const st = state.summaryState[idx] || { phase: "read", readLeftSec: Number(q.readSeconds || 600), peekSource: false };
          if (st.phase === "read") {
            return `
              ${headHtml}
              <div class="q-prompt">Câu ${idx + 1}: ${esc(q.title || "Đọc & Tóm tắt văn bản (缩写)")} — Giai đoạn 1: Đọc bài gốc</div>
              <div class="summary-read-banner">
                <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg("clock", 14)} Thời gian đọc bài gốc còn: <b id="summaryReadClock_${idx}">${formatClock(st.readLeftSec)}</b></span>
                <button class="play-btn" onclick="enterSummaryWritePhase(${idx})">${mockSvg("edit", 14)} Sẵn sàng viết tóm tắt (Ẩn bài gốc)</button>
              </div>
              ${q.sourceTitle ? `<div style="font-weight:800;font-size:16px;margin-bottom:6px;">《${esc(q.sourceTitle)}》</div>` : ""}
              <div class="passage-box">${esc(q.sourceZh || "")}</div>
            `;
          }
          return `
            ${headHtml}
            <div class="q-prompt">Câu ${idx + 1}: ${esc(q.title || "Tóm tắt văn bản (缩写)")} — Giai đoạn 2: Viết tóm tắt</div>
            ${q.promptVi ? `<p style="margin:0 0 8px;font-size:13.5px;color:var(--muted);line-height:1.5;">${esc(q.promptVi)}</p>` : ""}
            ${state.mode === "practice" ? `
              <div style="margin-bottom:8px;">
                <button class="tool-btn ${st.peekSource ? "on" : ""}" onclick="togglePracticeSourcePeek(${idx})">
                  ${st.peekSource ? `${mockSvg("eyeOff", 14)} Ẩn bài gốc` : `${mockSvg("eye", 14)} Xem lại bài gốc (Chế độ Luyện đề)`}
                </button>
              </div>
              ${st.peekSource ? `<div class="passage-box">${esc(q.sourceZh || "")}</div>` : ""}
            ` : `<div style="margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px;">${mockSvg("lock", 12)} Chế độ Thi thật: Bài gốc đã ẩn vĩnh viễn theo quy chế CTI HSK 6.</div>`}
            <input type="text" id="summaryTitle_${idx}" class="cbt-title-input" placeholder="Nhập tiêu đề bài viết (标题 — khuyến nghị đặt tên phù hợp nội dung)..." value="${esc(titleVal)}" oninput="onSummaryTitleInput(${idx}, this)">
            <textarea id="summaryBody_${idx}" name="summaryBody_${idx}" class="essay-textarea" style="min-height:200px;" placeholder="Viết bài tóm tắt lại nội dung chính của văn bản vừa đọc (bằng tiếng Trung)..." oninput="onWritingTextInput(${idx}, this)">${esc(val)}</textarea>
            <div class="counter-line">
              <span id="hanziCnt_${idx}">${countHanzi(val)} / ${q.targetChars || 180} chữ Hán (tối thiểu ${q.minChars || 110})</span>
              <span>Từ khóa gợi ý sẽ hiển thị sau khi nộp bài</span>
            </div>
          `;
        }

        return headHtml;
      }

      function renderHskkExam() {
        const ex = state.exam;
        const items = ex.items || [];
        const qIdx = Math.max(0, Math.min(items.length - 1, state.focusedQIdx));
        state.focusedQIdx = qIdx;
        const item = items[qIdx];
        const ticket = getTicketNo(ex.id, ex.level);
        const doneCount = items.filter((it) => {
          const r = state.hskkResponses[it.id];
          return Boolean(r && (r.done || r.audioUrl || countHanzi(r.transcript || state.hskkNotes[it.id] || "") > 0));
        }).length;
        const curResp = state.hskkResponses[item.id] || {};
        const hideZh = Boolean(item.hideTextInRealMode && state.mode === "real");

        let mainBody = "";
        if (state.hskkPhase === "part_prep") {
          const prepItems = items.filter((it) => it.qNo >= Number(ex.prepStartQNo || 999));
          mainBody = `
            <div class="cbt-focus-card">
              <div class="hskk-phase-banner is-prep">
                <span style="display:inline-flex;align-items:center;gap:8px;font-weight:800;">
                  ${mockSvg("clock", 16)} ${esc(ex.prepPartLabel || "Giai đoạn Chuẩn bị & Lập đề cương")}
                </span>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span class="hskk-clock-pill" id="hskkPhaseClock">${formatClock(state.hskkPhaseLeft)}</span>
                  <button type="button" class="play-btn" onclick="skipHskkPrepEarly()">${mockSvg("skipForward", 14)} Sẵn sàng nói ngay</button>
                </div>
              </div>
              <p style="margin:0 0 8px;font-size:13.5px;color:var(--muted);">
                Xem trước các câu hỏi/hình ảnh thuộc phần sắp thi và ghi nhanh dàn ý (提纲) bên dưới trước khi bắt đầu thu âm.
              </p>
              <div class="hskk-prep-grid">
                ${prepItems.map((pi) => `
                  <div class="hskk-prep-card">
                    <div class="q-head-row"><span class="q-part-badge">Câu ${pi.qNo} • ${esc(pi.partLabel)}</span><span>${pi.speakSeconds}s nói</span></div>
                    ${pi.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(pi.img)}" alt="Ảnh đề Câu ${pi.qNo}"></div>` : ""}
                    ${pi.promptZh ? `<div class="q-stmt">${esc(pi.promptZh)}</div>` : ""}
                    <p style="margin:4px 0 8px;font-size:13px;color:var(--muted);">${esc(pi.promptVi || "")}</p>
                    <textarea id="hskkPrepNote_${escAttr(pi.id)}" name="hskkPrepNote_${escAttr(pi.id)}" class="essay-textarea" style="min-height:68px;" placeholder="Ghi nhanh đề cương / từ khóa cho Câu ${pi.qNo} (提纲)..." oninput="onHskkNoteInput('${escAttr(pi.id)}', this)">${esc(state.hskkNotes[pi.id] || "")}</textarea>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        } else {
          const ph = state.hskkPhase;
          const phaseClass = ph === "listening" ? "is-listening" : (ph === "recording" ? "is-recording" : "");
          const phaseText = ph === "listening"
            ? `<span class="cbt-wave-dot"></span> Đang phát đề nghe câu ${item.qNo}... Chú ý lắng nghe tiếng Bíp (嘀)`
            : (ph === "recording"
              ? `<span class="hskk-rec-dot"></span> ĐANG THU ÂM CÂU ${item.qNo} — Nói ngay!`
              : `Câu ${item.qNo}/${items.length}: Bấm nút bên dưới để chạy lượt Nghe/Thu âm đúng thời gian CTI`);

          mainBody = `
            <div class="cbt-focus-card">
              <div class="q-head-row">
                <span class="q-part-badge">${esc(item.partLabel)}</span>
                <span class="meta-tag">${mockSvg("clock", 13)} Thời gian nói: ${item.speakSeconds}s</span>
              </div>

              <div class="hskk-phase-banner ${phaseClass}">
                <span style="display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;">${phaseText}</span>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  ${ph === "recording" ? `<span class="hskk-clock-pill" id="hskkPhaseClock">${formatClock(state.hskkPhaseLeft)}</span>` : ""}
                  ${ph === "idle"
                    ? `<button type="button" class="play-btn" onclick="startHskkItemFlow(${qIdx})">${mockSvg("mic", 15)} ${curResp.done ? "Thi lại câu này" : "Bắt đầu câu " + item.qNo}</button>`
                    : (ph === "recording"
                      ? `<button type="button" class="submit-btn" style="padding:8px 13px;font-size:13px;" onclick="finishHskkItemNow(${state.mode === "real" ? "true" : "false"})">${mockSvg("square", 13)} Xong câu này</button>`
                      : "")}
                </div>
              </div>

              <div class="q-prompt">Câu ${item.qNo}: ${esc(item.promptVi || "")}</div>
              ${item.img ? `<div class="cbt-q-img-wrap"><img class="cbt-q-img" src="${escAttr(item.img)}" alt="Ảnh đề HSKK Câu ${item.qNo}"></div>` : ""}

              ${item.listenZh ? (
                hideZh
                  ? `<div class="cbt-scene-card"><div class="cbt-scene-icon">${mockSvg("lock", 18)}</div><div class="cbt-scene-meta"><span class="cbt-scene-tag">Quy chế CTI HSKK</span><span class="cbt-scene-title">Văn bản câu nghe đang ẩn ở Chế độ Thi thật — tập trung nghe và nói sau tiếng Bíp (嘀)</span></div></div>`
                  : `<div class="passage-box">${esc(item.listenZh)}</div>`
              ) : ""}

              ${item.promptZh && item.promptZh !== item.listenZh ? `
                <div class="passage-box">${esc(item.promptZh)}${item.promptPy ? `<div class="py-line" style="font-size:13.5px;">${esc(item.promptPy)}</div>` : ""}</div>

        return `

            <div class="cbt-header-top">
              <div class="cbt-exam-ident">
                <span class="lv-badge is-full">${esc(ex.tierLabel || "HSKK")}</span>
                <span class="cbt-exam-title">${esc(ex.title || "")}</span>
                <span class="ticket-badge" style="font-size:12px;padding:3px 8px;">SBD: ${esc(ticket)}</span>
                <span class="exam-prog-pill" id="examProgressBadge">${doneCount}/${items.length} câu</span>
              </div>
              <div class="exam-actions">
                <span class="exam-timer ${state.remainingSec > 0 && state.remainingSec < 180 ? "urgent" : ""}" title="Tổng thời gian còn lại">

                </span>
                <button type="button" class="submit-btn" onclick="requestSubmitExam()">${mockSvg("send", 13)} Nộp bài</button>
                <button type="button" class="tool-btn" onclick="goLobby()">${mockSvg("close", 13)} <span class="lp-hide-xs">Thoát</span></button>
              </div>
            </div>
          </header>

          <div class="cbt-workspace" id="cbtWorkspace" style="--cbt-font-scale:${Number(state.fontScale) || 1}">

                <span>Tiến độ: <b>${doneCount}/${items.length} câu</b></span>

                ${qIdx + 1 >= items.length
                  ? `<button type="button" class="submit-btn" style="padding:10px 18px;font-size:13.5px;" onclick="requestSubmitExam()">${mockSvg("send", 14)} Hoàn tất &amp; Xem kết quả</button>`

                  const isDone = Boolean(r && (r.done || r.audioUrl));
                  return `<button class="sheet-cell ${isDone ? "done" : ""} ${i === qIdx ? "is-current" : ""}" onclick="jumpHskkQuestion(${i})">${it.qNo}</button>`;
                }).join("")}
              </div>
            </aside>
          </div>
        `;
      }

      function renderExam() {
        const ex = state.exam;
        if (!ex) return renderLobby();
        if (ex.examKind === "hskk") return renderHskkExam();
        const sections = getAvailableSections(ex);
        if (!sections.length) return renderLobby();
        if (!sections.includes(state.activeSection)) state.activeSection = sections[0];
        const secIdx = sections.indexOf(state.activeSection);
        const curList = ex[state.activeSection] || [];
        const qIdx = Math.max(0, Math.min(Math.max(0, curList.length - 1), state.focusedQIdx));
        state.focusedQIdx = qIdx;

        const lockMode = isSectionLockedMode();
        const prevSecLocked = secIdx > 0 && lockMode && Boolean(state.lockedSections && state.lockedSections[sections[secIdx - 1]]);
        const isVeryFirst = qIdx === 0 && (secIdx === 0 || prevSecLocked);
        const isVeryLast = secIdx === sections.length - 1 && qIdx >= curList.length - 1;
        const isEndOfSection = qIdx >= curList.length - 1 && secIdx < sections.length - 1;
        const prog = getProgressCounts();
        const secDone = getSectionDoneCounts(ex);
        const ticket = getTicketNo(ex.id, ex.level);
        const fsOn = Boolean(document.fullscreenElement || state.isFullscreen);

        const secMeta = {
          listening: { icon: "volume", label: "1. 听力 Nghe" },
          reading: { icon: "book", label: "2. 阅读 Đọc" },
          writing: { icon: "edit", label: "3. 书写 Viết" }
        };

        let stageHtml = "";
        if (state.activeSection === "listening") stageHtml = renderSingleListening(ex, qIdx);
        else if (state.activeSection === "reading") stageHtml = renderSingleReading(ex, qIdx);
        else if (state.activeSection === "writing") stageHtml = renderSingleWriting(ex, qIdx);

        return `
          <header class="cbt-header">
            <div class="cbt-header-top">
              <div class="cbt-exam-ident">
                <span class="lv-badge">HSK ${ex.level}</span>
                <span class="cbt-exam-title">${esc(ex.title || "")}</span>
                <span class="ticket-badge" style="font-size:12px;padding:3px 8px;">SBD: ${esc(ticket)}</span>
                <span class="exam-prog-pill" id="examProgressBadge">${prog.done}/${prog.total} câu</span>
              </div>
              <div class="exam-actions">
                <span class="exam-timer ${state.remainingSec > 0 && state.remainingSec < 300 ? "urgent" : ""}" title="${lockMode ? "Thời gian còn lại của phần hiện tại" : "Tổng thời gian còn lại"}">
                  ${mockSvg("clock", 15)} <span id="examTimerDisplay">${formatClock(state.remainingSec)}</span>
                </span>
                <div class="cbt-font-grp" title="Cỡ chữ phòng thi">
                  <button type="button" class="cbt-font-btn" onclick="adjustFontScale(-1)" aria-label="Thu nhỏ chữ">A-</button>
                  <span class="cbt-font-lbl" id="fontScaleLabel">${Math.round((Number(state.fontScale) || 1) * 100)}%</span>
                  <button type="button" class="cbt-font-btn" onclick="adjustFontScale(1)" aria-label="Phóng to chữ">A+</button>
                </div>
                <button type="button" class="tool-btn ${fsOn ? "on" : ""}" id="cbtFullscreenBtn" onclick="toggleFullscreen()" title="Toàn màn hình">
                  ${mockSvg(fsOn ? "minimize" : "maximize", 14)} <span class="lp-hide-xs">${fsOn ? "Thu gọn" : "Toàn màn hình"}</span>
                </button>
                <button type="button" class="submit-btn" onclick="requestSubmitExam()">${mockSvg("send", 13)} Nộp bài</button>
                <button type="button" class="tool-btn" onclick="goLobby()" title="Lưu nháp và về sảnh">${mockSvg("close", 13)} <span class="lp-hide-xs">Thoát</span></button>
              </div>
            </div>
            <div class="cbt-stepper">
              ${sections.map((sec, sPos) => {
                const m = secMeta[sec] || { icon: "layers", label: sec };
                const isAct = state.activeSection === sec;
                const isLocked = lockMode && Boolean(state.lockedSections && state.lockedSections[sec]);
                return `
                  ${sPos > 0 ? `<span class="cbt-step-arrow">&rarr;</span>` : ""}
                  <button type="button" class="cbt-step ${isAct ? "active" : ""} ${isLocked ? "locked" : ""}" onclick="switchSection('${sec}')">
                    ${isLocked ? mockSvg("lock", 12) : mockSvg(m.icon, 13)} ${m.label} <span class="cbt-step-cnt" id="cbtStepCnt_${sec}">${secDone[sec]}/${(ex[sec] || []).length}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </header>

          <div class="cbt-workspace" id="cbtWorkspace" style="--cbt-font-scale:${Number(state.fontScale) || 1}">
            <div class="cbt-stage">
              <div class="cbt-mobile-rail-bar">
                <span>Tiến độ: <b id="cbtMobileCount">${prog.done}/${prog.total} câu</b></span>
                <button type="button" class="tool-btn ${state.showSheet ? "on" : ""}" id="mobileRailToggleBtn" onclick="toggleSheet()">
                  ${mockSvg("layers", 14)} ${state.showSheet ? "Ẩn bảng câu" : "Bảng số câu"}
                </button>
              </div>

              ${stageHtml}

              <div class="cbt-stage-nav">
                <button type="button" class="nav-btn" ${isVeryFirst ? "disabled" : 'onclick="stepExamFocus(-1)"'}>
                  ${mockSvg("arrowLeft", 14)} Câu trước
                </button>
                <span class="cbt-kb-hint" style="font-size:12px;color:var(--muted);font-weight:700;">
                  Câu ${qIdx + 1}/${curList.length} • Phím tắt: <b>A–D</b> chọn • <b>F</b> cắm cờ • <b>&larr;/&rarr;</b> đổi câu
                </span>
                ${isVeryLast
                  ? `<button type="button" class="submit-btn" style="padding:10px 18px;font-size:13.5px;" onclick="requestSubmitExam()">${mockSvg("send", 14)} Hoàn thành &amp; Nộp bài</button>`
                  : `<button type="button" class="nav-btn primary" onclick="stepExamFocus(1)">${isEndOfSection && lockMode ? "Chuyển phần tiếp theo" : "Câu tiếp theo"} ${mockSvg("arrowRight", 14)}</button>`
                }
              </div>
            </div>

            <aside class="cbt-nav-rail ${state.showSheet ? "mobile-open" : ""}" id="cbtNavRailAside">
              <div id="cbtNavRailBox">${renderCbtNavRailInner(ex)}</div>
            </aside>
          </div>
        `;
      }

      function renderHskkReport(rep) {
        const reviews = rep.reviews || [];
        return `
          <section class="cbt-cert-card ${rep.passed ? "passed" : "failed"}">
            <div class="cbt-cert-top">
              <div>
                <div class="cbt-cert-org">汉语水平口语考试（${esc(rep.tierLabel || "HSKK")}）成绩报告单 • PHIẾU ĐIỂM KHẨU NGỮ</div>
                <h2 style="margin:0 0 4px;font-size:19px;">${esc(rep.title || "")}</h2>
                <div class="cbt-cert-meta">
                  <span>Thí sinh: <b>${esc(rep.candidateName || getCandidateName())}</b></span>
                  <span>SBD: <b>${esc(rep.candidateTicket || "")}</b></span>
                  <span>Hoàn thành: <b>${rep.answeredCount}/${rep.totalItems} câu</b></span>
                  <span>Ngày thi: <b>${formatDateVi(rep.dateIso)}</b></span>
                </div>
              </div>
              <div class="cbt-seal-box">
                <div class="cbt-seal ${rep.passed ? "passed" : "failed"}">${mockSvg(rep.passed ? "award" : "alert", 16)} ${rep.passed ? "合格 • ĐẠT NGƯỠNG" : "未达标 • CHƯA ĐẠT"}</div>
                <div class="big-score" style="color:${rep.passed ? "var(--ok)" : "var(--warn)"}">${rep.totalScore} <span style="font-size:18px;font-weight:800;color:var(--muted);">/ ${rep.maxScore}</span></div>
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Ngưỡng chuẩn: ${rep.passScore}/${rep.maxScore}</div>
              </div>
            </div>
            <div class="nav-footer" style="margin-top:16px;">
              <button class="nav-btn" onclick="goLobby()">${mockSvg("arrowLeft", 14)} Về sảnh đề HSK / HSKK</button>
              <button class="start-btn" style="width:auto;padding:10px 18px;" onclick="openCheckin('${escAttr(rep.id)}')">${mockSvg("refresh", 14)} Thi lại đề này</button>
            </div>
          </section>

          <section class="surface-card">
            <h2 class="sec-title">${mockSvg("mic", 16)} Nghe lại Bài thu âm &amp; Đáp án Chuẩn (${reviews.length} câu)</h2>
            ${reviews.map((r) => {
              const it = r.item;
              const resp = r.resp || {};
              return `
                <div class="q-card" style="border-color:${r.ev.autoScore >= 60 ? "var(--ok)" : "var(--warn)"};">
                  <div class="q-head-row">
                    <span class="q-part-badge">Câu ${it.qNo} • ${esc(it.partLabel)}</span>
                    <span style="font-weight:800;font-size:13px;color:${r.ev.autoScore >= 60 ? "var(--ok)" : "var(--warn)"};">Ước lượng: ${r.ev.autoScore}/100</span>
                  </div>
                  ${it.img ? `<div class="cbt-q-img-wrap" style="margin:6px 0;"><img class="cbt-q-img" style="max-height:170px;" src="${escAttr(it.img)}" alt="Ảnh đề Câu ${it.qNo}"></div>` : ""}
                  <div class="review-box">
                    <div><b>Đề bài / Câu nghe gốc:</b> ${esc(it.listenZh || it.promptZh || "")}</div>
                    ${it.promptZh && it.listenZh && it.promptZh !== it.listenZh ? `<div style="margin-top:4px;">${esc(it.promptZh)}</div>` : ""}
                    <div style="margin-top:6px;"><b>Bài nói STT ghi nhận:</b> ${resp.transcript ? esc(resp.transcript) : "<span style='color:var(--muted)'>(Chưa có bản text STT)</span>"}</div>
                    <div style="margin-top:4px;font-size:12.5px;color:var(--muted);">${esc(r.ev.detail)}</div>
                    ${resp.audioUrl ? `<div><audio controls class="hskk-audio-play" src="${escAttr(resp.audioUrl)}"></audio></div>` : ""}
                    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                      <button type="button" class="tool-btn" onclick="playHskkPromptSample('${escAttr(it.id)}')">${mockSvg("volume", 13)} Nghe mẫu chuẩn</button>
                    </div>
                    ${it.sampleZh && it.sampleZh !== it.listenZh ? `<div style="margin-top:8px;color:var(--ok);font-weight:700;">Gợi ý tham khảo: ${esc(it.sampleZh)}</div>` : ""}
                    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:grid;gap:4px;">
                      ${HSKK_RUBRIC.map((c) => `
                        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;">
                          <input type="checkbox" ${r.qualityChecks[c.key] ? "checked" : ""} onchange="toggleHskkRubric(${r.idx}, '${c.key}')">
                          <span><b>${esc(c.label)}:</b> ${esc(c.hint)}</span>
                        </label>
                      `).join("")}
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </section>
        `;
      }

      function renderReport() {
        const rep = state.lastReport;
        if (!rep) return renderLobby();
        if (rep.examKind === "hskk") return renderHskkReport(rep);

        const skills = [];
        if (rep.lTotal > 0) {
          skills.push({ key: "listening", icon: "volume", label: "Nghe hiểu", score: rep.listeningScore, url: `../listening/index.html?level=${rep.level}`, desc: "Luyện nghe hội thoại & chép chính tả Dictation" });
        }
        if (rep.rTotal > 0) {
          skills.push({ key: "reading", icon: "book", label: "Đọc hiểu", score: rep.readingScore, url: `../reading/index.html?level=${rep.level}`, desc: "Luyện đọc phân tích ngữ cảnh & ghép câu" });
        }
        if (rep.hasWriting) {
          skills.push({ key: "writing", icon: "edit", label: "Viết", score: rep.writingScore, url: `../writing/index.html?level=${rep.level}`, desc: "Luyện sắp xếp câu & viết đoạn văn chuẩn HSK" });
        }
        skills.sort((a, b) => a.score - b.score);
        const weakest = skills[0] || { icon: "book", label: "Tổng hợp", score: rep.totalScore, url: `../reading/index.html?level=${rep.level}`, desc: "Ôn tập trọng tâm" };

        const onlyWrong = state.reviewFilter === "wrong";
        const lList = onlyWrong ? rep.lReview.filter((x) => !x.isOk) : rep.lReview;
        const rList = onlyWrong ? rep.rReview.filter((x) => !x.isOk) : rep.rReview;
        const wList = onlyWrong ? rep.wReview.filter((x) => !x.isOk) : rep.wReview;

        const fmtChoice = (q, optIdx, isTf) => {
          if (optIdx === undefined || optIdx === null) return "Chưa trả lời";
          const txt = q.opts && q.opts[optIdx] != null ? q.opts[optIdx] : "";
          return isTf ? txt : `${String.fromCharCode(65 + optIdx)}. ${txt}`;
        };

        const partsHtml = [...(rep.lParts || []), ...(rep.rParts || [])].map((p) => {
          const pct = p.total ? Math.round((p.right / p.total) * 100) : 0;
          return `
            <div class="part-stat-item">
              <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.label)}</span>
              <span style="white-space:nowrap;color:${pct >= 60 ? "var(--ok)" : "var(--warn)"};">${p.right}/${p.total} (${pct}%)</span>
            </div>
          `;
        }).join("");

        return `
          <section class="cbt-cert-card ${rep.passed ? "passed" : "failed"}">
            <div class="cbt-cert-top">
              <div>
                <div class="cbt-cert-org">汉语水平考试（HSK）成绩报告单 • PHIẾU BÁO ĐIỂM MÔ PHỎNG</div>
                <h2 style="margin:0 0 4px;font-size:19px;">${esc(rep.title || "")}</h2>
                <div class="cbt-cert-meta">
                  <span>Thí sinh: <b>${esc(rep.candidateName || getCandidateName())}</b></span>
                  <span>SBD: <b>${esc(rep.candidateTicket || getTicketNo(rep.id, rep.level))}</b></span>
                  <span>Cấp: <b>HSK ${rep.level}</b></span>
                  <span>Phạm vi: <b>${esc(rep.scopeLabel || "Thi đầy đủ")}</b></span>
                  <span>Hình thức: <b>${rep.mode === "real" ? "Thi thật (Bấm giờ)" : "Luyện đề tự do"}</b></span>
                  <span>Ngày thi: <b>${formatDateVi(rep.dateIso)}</b></span>
                </div>
              </div>
              <div class="cbt-seal-box">
                <div class="cbt-seal ${rep.passed ? "passed" : "failed"}">
                  ${mockSvg(rep.passed ? "award" : "alert", 16)}
                  ${rep.passed ? "合格 • ĐẠT NGƯỠNG" : "未达标 • CHƯA ĐẠT"}
                </div>
                <div class="big-score" style="color:${rep.passed ? "var(--ok)" : "var(--warn)"}">
                  ${rep.totalScore} <span style="font-size:18px;font-weight:800;color:var(--muted);">/ ${rep.maxScore}</span>
                </div>
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Ngưỡng chuẩn: ${rep.passScore}/${rep.maxScore}</div>
              </div>
            </div>

            <div style="font-size:12px;color:var(--muted);margin-top:10px;">
              ${rep.scope && rep.scope !== "all"
                ? `Kết quả luyện tập riêng (${esc(rep.scopeLabel || rep.scope)}, ${rep.lTotal + rep.rTotal + rep.wTotal} câu) — chỉ lưu vào Lịch sử, không ghi đè điểm tổng Lộ trình.`
                : (rep.isFullMock
                  ? `Kết quả phản ánh bài thi Chuẩn CTI Full HSK ${rep.level} (${rep.lTotal + rep.rTotal + rep.wTotal} câu).`
                  : `Kết quả phản ánh bài luyện rút gọn khung HSK 2.0 (${rep.lTotal + rep.rTotal + rep.wTotal} câu).`)}${rep.hasOpenWriting ? " Điểm phần Viết tự do là kết quả Kiểm tra yêu cầu hình thức (từ khóa & độ dài)." : ""}
            </div>

            <div class="score-bars">
              ${rep.lTotal > 0 ? `
                <div class="score-bar-box">
                  <div style="display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;">
                    <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg("volume", 14)} Nghe hiểu (${rep.lRight}/${rep.lTotal})</span>
                    <span>${rep.listeningScore}/100</span>
                  </div>
                  <div class="bar-track"><div class="bar-fill" style="width:${rep.listeningScore}%;background:#0284c7;"></div></div>
                </div>
              ` : ""}
              ${rep.rTotal > 0 ? `
                <div class="score-bar-box">
                  <div style="display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;">
                    <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg("book", 14)} Đọc hiểu (${rep.rRight}/${rep.rTotal})</span>
                    <span>${rep.readingScore}/100</span>
                  </div>
                  <div class="bar-track"><div class="bar-fill" style="width:${rep.readingScore}%;background:#7c3aed;"></div></div>
                </div>
              ` : ""}
              ${rep.hasWriting ? `
                <div class="score-bar-box">
                  <div style="display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;">
                    <span style="display:inline-flex;align-items:center;gap:5px;">${mockSvg("edit", 14)} Phần Viết${rep.hasOpenWriting ? " (Kiểm tra hình thức)" : ""} (${rep.wTotal} câu)</span>

      function renderModal() {

          root.innerHTML = "";
          return;

        if (state.pendingAdvanceSec) {
          const secNames = { listening: "1. Nghe hiểu", reading: "2. Đọc hiểu", writing: "3. Phần Viết" };
          const curName = secNames[state.activeSection] || state.activeSection;
          const nextName = secNames[state.pendingAdvanceSec] || state.pendingAdvanceSec;

              </div>
            </div>
          `;
          return;
        }
        if (!state.showSubmitModal) {
          root.innerHTML = "";
          return;
        }
        const prog = getProgressCounts();
        const unanswered = Math.max(0, prog.total - prog.done);
        const flagCount = Object.values(state.flagged).filter(Boolean).length;
        root.innerHTML = `
          <div class="modal-backdrop" onclick="if(event.target===this)closeSubmitModal()">
            <div class="modal-card" role="dialog" aria-modal="true">
              <h3>${mockSvg("send", 17)} Xác nhận nộp bài thi</h3>

                Bạn đã hoàn thành <b>${prog.done}/${prog.total} câu</b>.
                ${unanswered > 0 ? `<br><span style="color:var(--warn);font-weight:700;">Vẫn còn ${unanswered} câu chưa làm.</span>` : `<br><span style="color:var(--ok);font-weight:700;">Bạn đã làm hết tất cả các câu!</span>`}
                ${flagCount > 0 ? `<br>Có <b>${flagCount} câu</b> đang cắm cờ xem lại.` : ""}
              </p>
              <div class="modal-actions">
                <button class="nav-btn" onclick="closeSubmitModal()">${mockSvg("arrowLeft", 14)} Quay lại làm tiếp</button>

            </div>
          </div>
        `;

      window.stepExamFocus = function (delta) {
        const ex = state.exam;
        if (!ex) return;
        if (ex.examKind === "hskk") {
          window.stepHskkFocus(delta);
          return;
        }
        stopAutoPlayListening();
        stopAudio();
        const sections = getAvailableSections(ex);
        const curList = ex[state.activeSection] || [];
        let nextIdx = state.focusedQIdx + delta;
        if (nextIdx >= 0 && nextIdx < curList.length) {
          state.focusedQIdx = nextIdx;
          saveDraft();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        const sPos = sections.indexOf(state.activeSection);
        const nextSecPos = sPos + (delta > 0 ? 1 : -1);
        if (nextSecPos >= 0 && nextSecPos < sections.length) {
          const targetSec = sections[nextSecPos];
          if (isSectionLockedMode()) {
            if (delta < 0 && state.lockedSections && state.lockedSections[targetSec]) {
              notifyToast("warn", "Phần trước đã bị khóa theo quy chế CTI, không thể quay lại.");
              return;
            }
            if (delta > 0) {
              state.pendingAdvanceSec = targetSec;
              renderModal();
              return;
            }
          }
          const targetArr = ex[targetSec] || [];
          state.activeSection = targetSec;
          state.focusedQIdx = delta > 0 ? 0 : Math.max(0, targetArr.length - 1);
          state.showSheet = false;
          saveDraft();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (state.pendingAdvanceSec) {
          if (e.key === "Escape") {
            e.preventDefault();
            window.cancelAdvanceSection();
          }
          return;
        }
        if (state.showSubmitModal) {
          if (e.key === "Escape") {
            e.preventDefault();
            window.closeSubmitModal();
          }
          return;
        }
        if (state.screen !== "exam" || !state.exam) return;
        const ae = document.activeElement;
        const tag = ae && ae.tagName ? ae.tagName.toUpperCase() : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (ae && ae.isContentEditable)) return;

        const keyLower = (e.key || "").toLowerCase();
        if (keyLower === "f") {
          e.preventDefault();
          window.toggleFlag(state.activeSection, state.focusedQIdx);
          return;
        }
        if (keyLower === "r" && state.activeSection === "listening") {
          e.preventDefault();
          window.playListeningAudio(state.focusedQIdx);
          return;
        }
        const optMap = { "1": 0, "2": 1, "3": 2, "4": 3, "a": 0, "b": 1, "c": 2, "d": 3 };
        if (Object.prototype.hasOwnProperty.call(optMap, keyLower) && (state.activeSection === "listening" || state.activeSection === "reading")) {
          const arr = state.exam[state.activeSection] || [];
          const qIdx = Math.max(0, Math.min(arr.length - 1, state.focusedQIdx));
          const q = arr[qIdx];
          const oi = optMap[keyLower];
          if (q && Array.isArray(q.opts) && oi < q.opts.length) {
            e.preventDefault();
            window.selectChoice(state.activeSection, qIdx, oi);
          }
          return;
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          window.stepExamFocus(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          window.stepExamFocus(1);
        }
      });

        else if (state.screen === "checkin") root.innerHTML = renderCheckin();
        else if (state.screen === "exam") root.innerHTML = renderExam();
        else if (state.screen === "report") root.innerHTML = renderReport();
        renderModal();

        setTimeout(() => {
          const el = document.getElementById("mockCard_" + state.targetMockId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });

          if (state.screen === "lobby") render();

                const el = document.getElementById("mockCard_" + state.targetMockId);

              }, 60);

          }
        });

        }).then(() => {
          if (reqMockId) {
            const found = MOCK_TESTS.find((m) => m.id === reqMockId);
            if (found) {
              state.targetMockId = found.id;
              state.filterLevel = Number(found.level) || 0;
            }
          }
          if (state.screen === "lobby") {
            render();
            if (state.targetMockId) {
              setTimeout(() => {
                const el = document.getElementById("mockCard_" + state.targetMockId);
                if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
              }, 60);
            }
          }
        });
      }
    })();
  </script>

            roadmapUrl: "../roadmap/index.html",

          });
        }
      }
      var btnDonate = document.getElementById("btnDonate");
      if (btnDonate && !btnDonate.dataset.lpBound) {
        btnDonate.dataset.lpBound = "1";

          if (window.S4Auth && typeof window.S4Auth.openDonateModal === "function") {
            window.S4Auth.openDonateModal();

      var btnTheme = document.getElementById("btnTheme");
