  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      if (s === "ghibli") document.documentElement.classList.add("theme-ghibli");
      if (isDark) document.documentElement.classList.add("dark");
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        var topPx = (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px";
        document.documentElement.style.setProperty("--s4-safe-top", topPx);
        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>

  <title>Phòng Thi Thử HSK Chuẩn CTI IBT (Đề Thật Hanban) | LinguaPath</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: var(--lg-surface, rgba(255, 255, 255, 0.72));
      --text: var(--lg-ink, #0f172a);
      --muted: var(--lg-ink-sub, #475569);
      --border: var(--lg-divider, rgba(15, 23, 42, 0.1));
      --hairline: var(--lg-hairline, rgba(15, 23, 42, 0.1));
      --primary: var(--lg-accent, #e11d48);
      --primary-soft: var(--lg-accent-soft, rgba(225, 29, 72, 0.12));
      --ok: var(--lg-green, #16a34a);
      --ok-soft: var(--lg-green-soft, rgba(22, 163, 74, 0.14));
      --danger: var(--lg-rose, #dc2626);
      --danger-soft: var(--lg-rose-soft, rgba(220, 38, 38, 0.13));
      --warn: var(--lg-amber, #d97706);
      --warn-soft: var(--lg-amber-soft, rgba(217, 119, 6, 0.15));
      --box-sub: var(--lg-wash, rgba(15, 23, 42, 0.045));
      --topbar-h: 56px;
      color-scheme: light;
    }
    html.dark, body.dark {
      --bg: #0f172a;
      --card: var(--lg-surface, rgba(24, 34, 48, 0.72));
      --text: var(--lg-ink, #f8fafc);
      --muted: var(--lg-ink-sub, #94a3b8);
      --border: var(--lg-divider, rgba(255, 255, 255, 0.12));
      --hairline: var(--lg-hairline, rgba(255, 255, 255, 0.14));
      --primary: var(--lg-accent, #fb7185);
      --primary-soft: var(--lg-accent-soft, rgba(251, 113, 133, 0.16));
      --ok: var(--lg-green, #4ade80);
      --ok-soft: var(--lg-green-soft, rgba(74, 222, 128, 0.15));
      --danger: var(--lg-rose, #f87171);
      --danger-soft: var(--lg-rose-soft, rgba(248, 113, 113, 0.16));
      --warn: var(--lg-amber, #fbbf24);
      --warn-soft: var(--lg-amber-soft, rgba(251, 191, 36, 0.16));
      --box-sub: var(--lg-wash, rgba(255, 255, 255, 0.055));
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: var(--text);
      min-height: 100vh;
    }

    .lp-svg { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 0; }
    .app-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 14px 72px;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .surface-card, .exam-bar, .sheet-panel, .q-card, .mock-card, .report-hero, .modal-card {
      background: var(--lg-surface, var(--card));
      -webkit-backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      border: 1px solid var(--hairline);
      box-shadow: var(--lg-shadow, 0 12px 32px rgba(15, 23, 42, 0.08)),
        inset 0 1px 0 var(--lg-rim-top, rgba(255, 255, 255, 0.75)),
        inset 1px 0 0 var(--lg-rim-side, rgba(255, 255, 255, 0.22)),
        inset 0 -1px 0 var(--lg-rim-bot, rgba(15, 23, 42, 0.06));
    }

    .surface-card {
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 14px;
      min-width: 0;
    }

    /* Lobby Hero & Mode Switch */
    .lobby-hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lobby-hero h1 {
      margin: 0 0 4px; font-size: 20px; font-weight: 800; line-height: 1.3;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .lobby-hero p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .lobby-stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat-pill {
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 800;
      background: var(--box-sub);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .mode-card {
      text-align: left;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mode-card:hover { border-color: var(--primary); }
    .mode-card.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: 0 4px 14px var(--primary-soft);
    }
    .mode-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--lg-seg-track, rgba(15, 23, 42, 0.05));
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      width: fit-content;
      max-width: 100%;
    }
    .mode-card.active .mode-chip { color: var(--text); border-color: var(--primary); }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }
    .lv-pill {
      padding: 7px 13px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--lg-seg-track, var(--box-sub));
      color: var(--text);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }
    .lv-pill:hover { border-color: var(--primary); }
    .lv-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Exam Cards Grid */
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .mock-card {
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .mock-card.is-target {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft), var(--lg-shadow);
    }
    .mock-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lv-badge {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .lv-badge.is-full {
      background: rgba(13, 148, 136, 0.14);
      color: var(--teal);
      border: 1px solid rgba(13, 148, 136, 0.35);
    }
    .type-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }
    .status-badge {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-badge.passed {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
    }
    .status-badge.tried {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: var(--warn);
    }
    .mock-title { margin: 4px 0 4px; font-size: 16.5px; font-weight: 800; line-height: 1.35; }
    .mock-sub { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .mock-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
    }
    .meta-tag {
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .start-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #e11d48, #be185d);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: filter 0.15s ease;
    }
    .start-btn:hover { filter: brightness(1.08); }

    /* History List */
    .sec-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hist-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .hist-main { min-width: 0; flex: 1; }
    .hist-title { font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .hist-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .hist-score { font-weight: 800; font-size: 14px; white-space: nowrap; }

    /* Exam Room Sticky Bar */
    .exam-bar {
      position: sticky;
      top: calc(var(--topbar-h, 54px) + 6px);
      z-index: 45;
      border-radius: 15px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .exam-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .exam-timer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 10px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-weight: 900;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .exam-timer.urgent {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
      animation: timerPulse 1.1s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.82; }
    }
    .exam-prog-pill {
      font-size: 12.5px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--box-sub);
      border: 1px solid var(--border);
    }
    .exam-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tool-btn {
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tool-btn:hover { border-color: var(--primary); }
    .tool-btn.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .submit-btn {
      padding: 7px 13px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .exam-sec-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .sec-tab {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--lg-seg-track, var(--box-sub));
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .sec-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Answer Sheet Panel */
    .sheet-panel {
      border-color: var(--primary);
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .sheet-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      align-items: center;
    }
    .sheet-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 3px;
      vertical-align: middle; margin-right: 4px; border: 1px solid var(--border);
    }
    .sheet-dot.done { background: var(--ok); border-color: var(--ok); }
    .sheet-dot.todo { background: var(--box-sub); }
    .sheet-dot.flagged { background: var(--warn); border-color: var(--warn); border-radius: 99px; }
    .sheet-group { margin-top: 10px; }
    .sheet-group-label {
      font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px;
      display: flex; align-items: center; gap: 5px;
    }
    .sheet-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .sheet-cell {
      width: 38px;
      height: 36px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-cell.done {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
    }
    .sheet-cell.flagged {
      border-color: var(--warn);
      box-shadow: 0 0 0 2px var(--warn-soft);
    }
    .sheet-cell.flagged::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--warn);
    }

    /* Question Cards */
    .q-card {
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      scroll-margin-top: 165px;
      min-width: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .q-card.is-flagged { border-color: var(--warn); }
    .q-card.is-kb-focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft), var(--lg-shadow);
    }
    .q-head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .q-part-badge {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .flag-btn {
      padding: 5px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .flag-btn.on {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: var(--warn);
    }

    .audio-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--box-sub);
      border: 1px dashed var(--border);
      margin-bottom: 10px;
    }
    .play-btn {
      background: linear-gradient(135deg, #e11d48, #be185d);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .rate-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: var(--lg-seg-track, var(--box-sub));
    }
    .rate-opt {
      padding: 6px 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .rate-opt.on { background: var(--primary); color: #fff; }

    .passage-box {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-size: 16px;
      line-height: 1.75;
      margin-bottom: 12px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .order-item {
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-size: 15px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .q-prompt {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .q-stmt {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--box-sub);
      border-left: 4px solid var(--primary);
      font-size: 15.5px;
      font-weight: 700;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .opts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .opt-btn {
      text-align: left;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.45;
      overflow-wrap: anywhere;
      transition: background-color 0.13s ease, border-color 0.13s ease, color 0.13s ease, transform 0.13s ease, opacity 0.13s ease, box-shadow 0.13s ease;
    }
    .opt-btn:hover { border-color: var(--primary); }
    .opt-btn.selected {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    .opt-btn.correct {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
    }
    .opt-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Writing Inputs */
    .reorder-tray {
      min-height: 48px;
      padding: 10px;
      border-radius: 12px;
      border: 1.5px dashed var(--primary);
      background: var(--box-sub);
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-bottom: 10px;
    }
    .reorder-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .word-chip {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--lg-seg-active, var(--box-sub));
      color: var(--text);
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .word-chip:hover { border-color: var(--primary); }
    .word-chip.picked {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    .word-chip.used { opacity: 0.35; cursor: default; }

    .hanzi-input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-size: 17px;
      font-family: inherit;
      outline: none;
    }
    .hanzi-input:focus { border-color: var(--primary); }
    .essay-textarea {
      width: 100%;
      min-height: 155px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }
    .essay-textarea:focus { border-color: var(--primary); }
    .kw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
    .kw-chip {
      padding: 5px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      font-size: 13.5px;
      font-weight: 800;
    }
    .kw-chip.hit {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
    }
    .counter-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 6px;
      font-weight: 700;
    }
    .summary-read-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 11px;
      background: var(--warn-soft);
      border: 1px solid var(--warn);
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .nav-btn {
      padding: 10px 16px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--box-sub);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .nav-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Inline Confirm Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.56);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      color: var(--text);
      border-radius: 18px;
      padding: 20px;
    }
    .modal-card h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
    .modal-card p { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

    /* Report Screen */
    .report-hero {
      text-align: center;
      padding: 22px 16px;
      border-radius: 18px;
      margin-bottom: 16px;
    }
    .report-hero.passed { border-color: var(--ok); }
    .report-hero.failed { border-color: var(--warn); }
    .cert-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .cert-badge.passed { background: var(--ok-soft); color: var(--ok); }
    .cert-badge.failed { background: var(--warn-soft); color: var(--warn); }
    .big-score { font-size: 38px; font-weight: 900; line-height: 1.15; margin: 4px 0; }
    .score-bars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }
    .score-bar-box {
      padding: 12px;
      border-radius: 13px;
      background: var(--box-sub);
      border: 1px solid var(--border);
    }
    .bar-track {
      height: 8px;
      border-radius: 99px;
      background: var(--border);
      overflow: hidden;
      margin-top: 7px;
    }
    .bar-fill { height: 100%; border-radius: 99px; background: var(--primary); }
    .coach-box {
      padding: 14px;
      border-radius: 14px;
      background: var(--primary-soft);
      border: 1px dashed var(--primary);
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .coach-link {
      padding: 9px 14px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .review-box {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 11px;
      background: var(--box-sub);
      border: 1px solid var(--border);
      font-size: 13.5px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .py-line { color: var(--primary); font-weight: 700; margin-top: 3px; }
    .vi-line { color: var(--muted); margin-top: 3px; }

    /* ===== CTI HSK IBT Focus Exam Room (Step 1) ===== */
    body.cbt-exam-active .lp-topbar { display: none !important; }
    body.cbt-exam-active .app-shell {
      max-width: 1280px;
      padding: 10px 14px 32px;
    }

    /* Check-in Screen */
    .checkin-shell { max-width: 980px; margin: 0 auto; }
    .checkin-banner {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .checkin-banner h1 { margin: 0 0 3px; font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .checkin-banner p { margin: 0; font-size: 13px; color: var(--muted); }
    .checkin-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start;
    }
    .candidate-card, .audio-test-box {
      padding: 15px; border-radius: 15px; background: var(--box-sub); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 10px;
    }
    .candidate-title {
      font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px;
      padding-bottom: 8px; border-bottom: 1px dashed var(--border);
    }
    .checkin-field-row {
      display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13.5px;
    }
    .checkin-field-lbl { font-weight: 700; color: var(--muted); }
    .checkin-input {
      width: 100%; padding: 8px 11px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--card); color: var(--text); font-size: 14px; font-weight: 800; font-family: inherit; outline: none;
    }
    .checkin-input:focus { border-color: var(--primary); }
    .ticket-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9px;
      background: var(--primary-soft); color: var(--primary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 900; font-size: 13.5px; letter-spacing: 0.4px; width: fit-content;
    }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
    .spec-table th, .spec-table td {
      padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border);
    }
    .spec-table th { color: var(--muted); font-weight: 800; font-size: 11.5px; text-transform: uppercase; }
    .spec-table tr:last-child td { border-bottom: none; }
    .audio-test-status {
      padding: 9px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 700; line-height: 1.45;
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; gap: 7px;
    }
    .audio-test-status.ok {
      background: var(--ok-soft); border-color: var(--ok); color: var(--ok);
    }
    .shortcut-list {
      display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted);
    }
    .kbd-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 7px;
      background: var(--card); border: 1px solid var(--border); font-weight: 700; color: var(--text);
    }
    .kbd-pill kbd {
      font-family: ui-monospace, monospace; font-size: 11px; font-weight: 900;
      padding: 1px 5px; border-radius: 4px; background: var(--box-sub); border: 1px solid var(--border);
    }

    /* CBT Exam Header & Stepper */
    .cbt-header {
      position: sticky; top: 6px; z-index: 60; border-radius: 16px; padding: 10px 14px; margin-bottom: 14px;
      background: var(--lg-surface, var(--card));
      -webkit-backdrop-filter: var(--lg-blur, blur(14px) saturate(150%));
      backdrop-filter: var(--lg-blur, blur(14px) saturate(150%));
      border: 1px solid var(--hairline);
      box-shadow: var(--lg-shadow, 0 12px 32px rgba(15, 23, 42, 0.08)),
        inset 0 1px 0 var(--lg-rim-top, rgba(255, 255, 255, 0.75));
      display: flex; flex-direction: column; gap: 9px;
    }
    .cbt-header-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .cbt-exam-ident {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
    }
    .cbt-exam-title { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    .cbt-stepper {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .cbt-step {
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--lg-seg-track, var(--box-sub)); color: var(--text);
      font-size: 12.5px; font-weight: 800; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s ease;
    }
    .cbt-step:hover { border-color: var(--primary); }
    .cbt-step.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .cbt-step-cnt {
      padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 900;
      background: rgba(15, 23, 42, 0.08);
    }
    .cbt-step.active .cbt-step-cnt { background: rgba(255, 255, 255, 0.24); color: #fff; }
    .cbt-step-arrow { color: var(--muted); font-weight: 900; font-size: 12px; }
    .cbt-font-grp {
      display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px;
      background: var(--box-sub); overflow: hidden;
    }
    .cbt-font-btn {
      padding: 6px 9px; border: none; background: transparent; color: var(--text);
      font-size: 12px; font-weight: 900; cursor: pointer; font-family: inherit;
    }
    .cbt-font-btn:hover { background: var(--primary-soft); color: var(--primary); }
    .cbt-font-lbl { font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 0 5px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

    /* CBT Two-Column Workspace */
    .cbt-workspace {
      --cbt-font-scale: 1;
      display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 14px; align-items: start;
    }
    .cbt-stage { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .cbt-stage-banner {
      padding: 9px 13px; border-radius: 13px; background: var(--lg-surface, var(--card));
      border: 1px solid var(--hairline); display: flex; justify-content: space-between;
      align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; color: var(--muted);
    }
    .cbt-focus-card {
      margin-bottom: 0; padding: 18px;
    }
    .cbt-stage .passage-box { font-size: calc(16px * var(--cbt-font-scale)); }
    .cbt-stage .q-prompt { font-size: calc(15.5px * var(--cbt-font-scale)); }
    .cbt-stage .q-stmt { font-size: calc(16px * var(--cbt-font-scale)); }
    .cbt-stage .opt-btn { font-size: calc(14.5px * var(--cbt-font-scale)); }
    .cbt-stage .order-item { font-size: calc(15px * var(--cbt-font-scale)); }

    /* Reading Split-Screen & Highlighting */
    .cbt-split {
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 14px; align-items: start;
    }
    .cbt-passage-pane, .cbt-question-pane { min-width: 0; }
    .cbt-passage-pane {
      padding: 13px; border-radius: 14px; background: var(--box-sub); border: 1px solid var(--border);
      max-height: 62vh; overflow-y: auto;
    }
    .cbt-passage-pane .passage-box {
      background: transparent; border: none; padding: 4px 0 0; margin-bottom: 0;
    }
    .cbt-hl-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed var(--border);
    }
    .cbt-hl-hint { font-size: 11.5px; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    mark.cbt-hl {
      background: rgba(250, 204, 21, 0.44); color: inherit; padding: 1px 2px; border-radius: 4px;
    }
    html.dark mark.cbt-hl { background: rgba(250, 204, 21, 0.3); }

    /* Sticky Right Question Rail */
    .cbt-nav-rail {
      position: sticky; top: 108px; border-radius: 16px; padding: 14px;
      background: var(--lg-surface, var(--card));
      -webkit-backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      border: 1px solid var(--hairline);
      box-shadow: var(--lg-shadow, 0 12px 32px rgba(15, 23, 42, 0.08));
      max-height: calc(100vh - 124px); overflow-y: auto;
    }
    .cbt-rail-head {
      display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 8px;
      font-size: 13px; font-weight: 900;
    }
    .cbt-nav-rail .sheet-grid { gap: 5px; }
    .cbt-nav-rail .sheet-cell { width: 35px; height: 33px; font-size: 12.5px; }
    .sheet-cell.is-current {
      border-color: var(--primary); box-shadow: 0 0 0 2.5px var(--primary-soft);
      transform: translateY(-1px);
    }
    .sheet-cell.done.is-current {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .cbt-stage-nav {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 11px 14px; border-radius: 14px;
      background: var(--lg-surface, var(--card)); border: 1px solid var(--hairline);
      box-shadow: var(--lg-shadow, 0 8px 24px rgba(15, 23, 42, 0.06));
    }
    .cbt-mobile-rail-bar { display: none; }

    /* Official HSK Certificate Report Styling */
    .cbt-cert-card {
      text-align: left; padding: 20px; border-radius: 18px; margin-bottom: 16px;
      background: var(--lg-surface, var(--card));
      -webkit-backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      backdrop-filter: var(--lg-blur, blur(12px) saturate(145%));
      border: 1.5px solid var(--hairline);
      box-shadow: var(--lg-shadow, 0 14px 36px rgba(15, 23, 42, 0.09));
    }
    .cbt-cert-card.passed { border-color: var(--ok); }
    .cbt-cert-card.failed { border-color: var(--warn); }
    .cbt-cert-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap;
      padding-bottom: 14px; border-bottom: 1.5px dashed var(--border);
    }
    .cbt-cert-org { font-size: 11.5px; font-weight: 900; letter-spacing: 0.7px; text-transform: uppercase; color: var(--primary); margin-bottom: 4px; }
    .cbt-cert-meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 6px;
    }
    .cbt-seal-box {
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .cbt-seal {
      padding: 8px 14px; border-radius: 12px; border: 2px solid currentColor;
      font-size: 13px; font-weight: 900; letter-spacing: 0.5px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .cbt-seal.passed { color: var(--ok); background: var(--ok-soft); }
    .cbt-seal.failed { color: var(--warn); background: var(--warn-soft); }
    .part-breakdown-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 10px;
    }
    .part-stat-item {
      padding: 9px 11px; border-radius: 11px; background: var(--box-sub); border: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
    }

    /* Step 2: Scoped practice, Section lock, Auto-play audio, Visual scenes, Match bank & HSK 6 title */
    .scope-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; margin-top: 8px;
    }
    .scope-pill {
      padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--card); color: var(--text); font-family: inherit;
      font-size: 12.5px; font-weight: 800; cursor: pointer; text-align: left;
      display: flex; flex-direction: column; gap: 3px; transition: all .15s ease;
    }
    .scope-pill:hover { border-color: var(--teal); transform: translateY(-1px); }
    .scope-pill.active {
      border-color: var(--teal); background: rgba(13, 148, 136, .12); color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, .12);
    }
    .scope-pill .sp-sub { font-size: 11px; font-weight: 600; color: var(--muted); }
    .part-filter-row {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .part-pill {
      padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--box-sub); color: var(--text); font-family: inherit;
      font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all .15s ease;
    }
    .part-pill:hover { border-color: var(--teal); }
    .part-pill.active {
      background: var(--teal); color: #fff; border-color: var(--teal);
    }
    .cbt-step.locked {
      opacity: .68; background: var(--box-sub); border-color: var(--border);
      color: var(--muted); cursor: not-allowed; pointer-events: auto;
    }
    .sheet-cell.locked {
      opacity: .55; background: var(--box-sub); color: var(--muted);
      border-style: dashed; cursor: not-allowed;
    }
    .cbt-autoplay-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 10px 14px; border-radius: 13px; margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(14, 165, 233, .1), rgba(13, 148, 136, .08));
      border: 1px solid rgba(14, 165, 233, .28);
    }
    .cbt-autoplay-status {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; color: var(--text);
    }
    .cbt-wave-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0;
    }
    .cbt-wave-dot.playing {
      background: #0ea5e9; box-shadow: 0 0 0 4px rgba(14, 165, 233, .22);
      animation: cbtWave 1.1s infinite ease-in-out;
    }
    .cbt-wave-dot.waiting {
      background: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, .2);
    }
    @keyframes cbtWave {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: .6; }
    }
    .cbt-scene-card {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 13px;
      background: linear-gradient(135deg, rgba(13, 148, 136, .08), rgba(245, 158, 11, .06));
      border: 1px dashed rgba(13, 148, 136, .35); margin-bottom: 12px;
    }
    .cbt-scene-icon {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;

  <script src="../hsk-tts.js?v=2"></script>
  <script src="./mock_data.js?v=1"></script>
  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "lp_hsk_mock_results_v1";
      const HSKK_STORAGE_KEY = "lp_hskk_mock_results_v1";
      let MOCK_TESTS = [];
      let HSKK_TESTS = [];
      function syncMockTests() {
        const base = Array.isArray(window.LP_HSK_MOCK_TESTS) ? window.LP_HSK_MOCK_TESTS : [];
        const full13 = Array.isArray(window.LP_HSK_FULL_TESTS_13) ? window.LP_HSK_FULL_TESTS_13 : [];
        const full13p2 = Array.isArray(window.LP_HSK_FULL_TESTS_13_P2) ? window.LP_HSK_FULL_TESTS_13_P2 : [];
        const full46 = Array.isArray(window.LP_HSK_FULL_TESTS_46) ? window.LP_HSK_FULL_TESTS_46 : [];
        const full46p2 = Array.isArray(window.LP_HSK_FULL_TESTS_46_P2) ? window.LP_HSK_FULL_TESTS_46_P2 : [];
        const seen = new Set();
        const merged = [];
        full13.concat(full13p2, full46, full46p2, base).forEach((m) => {
          if (m && m.id && !seen.has(m.id)) {
            seen.add(m.id);
            merged.push(m);
          }
        });
        merged.sort((a, b) => {
          const lvDiff = (Number(a.level) || 0) - (Number(b.level) || 0);
          if (lvDiff !== 0) return lvDiff;
          const fullDiff = (b.isFullMock ? 1 : 0) - (a.isFullMock ? 1 : 0);
          if (fullDiff !== 0) return fullDiff;
          return (Number(a.testNo) || 0) - (Number(b.testNo) || 0);
        });
        MOCK_TESTS = merged;

        const hskkP1 = Array.isArray(window.LP_HSK_HSKK_MOCK_TESTS) ? window.LP_HSK_HSKK_MOCK_TESTS : [];
        const hskkP2 = Array.isArray(window.LP_HSK_HSKK_MOCK_TESTS_P2) ? window.LP_HSK_HSKK_MOCK_TESTS_P2 : [];
        if (hskkP1.length || hskkP2.length) {
          const seenH = new Set();
          const mergedH = [];
          hskkP1.concat(hskkP2).forEach((x) => {
            if (x && x.id && !seenH.has(x.id)) {
              seenH.add(x.id);
              mergedH.push(x);
            }
          });
          const tierOrd = { beginner: 1, intermediate: 2, advanced: 3 };
          mergedH.sort((a, b) => {
            const tDiff = (tierOrd[a.tier] || 9) - (tierOrd[b.tier] || 9);
            if (tDiff !== 0) return tDiff;
            const realDiff = (b.isOfficialReal ? 1 : 0) - (a.isOfficialReal ? 1 : 0);
            if (realDiff !== 0) return realDiff;
            return (Number(a.testNo) || 0) - (Number(b.testNo) || 0);
          });
          HSKK_TESTS = mergedH;
        }
      }
      syncMockTests();

      const urlParams = (() => {
        try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(""); }
      })();
      const reqMockId = (urlParams.get("id") || "").trim();
      const reqType = (urlParams.get("type") || "").trim().toLowerCase();
      const isReqFull = /^mock_(?:full|real)_/i.test(reqMockId);
      const isReqCompact = /^mock_hsk\d+_/i.test(reqMockId);
      const isReqHskk = /^mock_hskk_/i.test(reqMockId);
      const targetMock = reqMockId ? (MOCK_TESTS.find((m) => m.id === reqMockId) || HSKK_TESTS.find((m) => m.id === reqMockId)) : null;

      const state = {
        screen: "lobby", // 'lobby' | 'checkin' | 'exam' | 'report'
        filterType: (reqType === "hskk" || isReqHskk) ? "hskk" : ((reqType === "compact" || isReqCompact) ? "compact" : (reqType === "all" ? "all" : "full")),
        filterHskkTier: "all", // 'all' | 'beginner' | 'intermediate' | 'advanced'
        full13Loaded: Array.isArray(window.LP_HSK_FULL_TESTS_13),
        full13Loading: false,
        full13Error: "",
        full13P2Loaded: Array.isArray(window.LP_HSK_FULL_TESTS_13_P2),
        full13P2Loading: false,
        full13P2Error: "",
        full46Loaded: Array.isArray(window.LP_HSK_FULL_TESTS_46),
        full46Loading: false,
        full46Error: "",
        full46P2Loaded: Array.isArray(window.LP_HSK_FULL_TESTS_46_P2),
        full46P2Loading: false,
        full46P2Error: "",
        hskkLoaded: Array.isArray(window.LP_HSK_HSKK_MOCK_TESTS),
        hskkLoading: false,
        hskkError: "",
        hskkP2Loaded: Array.isArray(window.LP_HSK_HSKK_MOCK_TESTS_P2),
        hskkP2Loading: false,
        hskkP2Error: "",
        micTesting: false,
        micOk: false,
        micStatusMsg: "Chưa kiểm tra Micro.",
        micSampleUrl: "",
        hskkPhase: "idle", // 'idle' | 'listening' | 'part_prep' | 'recording'
        hskkPhaseLeft: 0,
        hskkPrepDone: false,
        hskkNotes: {},
        hskkResponses: {}, // { [qNo]: { transcript, audioUrl, durationSec, eval } }
        hskkLiveTranscript: "",
        filterLevel: (() => {
          if (targetMock) return Number(targetMock.level) || 0;
          const lv = Number(urlParams.get("level") || 0);
          return (lv >= 1 && lv <= 6) ? lv : 0;
        })(),
        targetMockId: targetMock ? targetMock.id : "",
        pendingMockId: "",
        mode: "real", // 'real' | 'practice'
        scope: "all", // 'all' | 'listening' | 'reading' | 'writing'
        partFilter: "all", // 'all' | partLabel
        exam: null,
        activeSection: "listening", // 'listening' | 'reading' | 'writing'
        focusedQIdx: 0,
        remainingSec: 0,
        lockedSections: {}, // { listening: true, ... }
        sectionTimers: {}, // { listening: sec, reading: sec, writing: sec }
        pendingAdvanceSec: "",
        audioRate: 1.0, // 0.85 | 1.0
        fontScale: 1,
        headphoneTested: false,
        headphoneConfirmed: false,
        isFullscreen: false,
        showSheet: false,
        showSubmitModal: false,
        reviewFilter: "all", // 'all' | 'wrong'
        listeningAnswers: {},
        readingAnswers: {},
        writingAnswers: {},
        writingTitles: {}, // { [idx]: string }
        listeningPlays: {},
        flagged: {}, // key: `${sec}:${idx}` -> true
        highlights: {}, // key: `reading:${idx}` -> highlighted innerHTML
        summaryState: {}, // { [idx]: { phase: 'read' | 'write', readLeftSec: number, peekSource: boolean } }
        autoPlayEnabled: true,
        autoPlayStatus: "idle", // 'idle' | 'playing' | 'pause' | 'next' | 'done'
        autoPlayCountdown: 0,
        autoPlayActive: false,
        lastReport: null
      };

      let timerId = null;
      let autoPlayToken = 0;
      let autoPlayTickId = null;
      const CANDIDATE_NAME_KEY = "lp_hsk_candidate_name";
      const FONT_SCALES = [0.9, 1, 1.15, 1.3];
      const DRAFT_PREFIX = "lp_hsk_mock_draft_v1:";
      const DRAFT_FIELDS = ["activeSection", "focusedQIdx", "remainingSec", "scope", "partFilter",
        "lockedSections", "sectionTimers", "audioRate", "fontScale", "listeningAnswers",
        "readingAnswers", "writingAnswers", "writingTitles", "listeningPlays",
        "flagged", "highlights", "summaryState"];

      function getCandidateName() {
        try {
          const saved = (localStorage.getItem(CANDIDATE_NAME_KEY) || "").trim();
          if (saved) return saved;
          if (window.S4Auth && typeof window.S4Auth.getUser === "function") {
            const u = window.S4Auth.getUser();
            if (u && (u.displayName || u.email)) return String(u.displayName || u.email).split("@")[0];
          }
        } catch (e) {}
        return "Thí sinh LinguaPath";
      }

      function getTicketNo(mockId, level) {
        const key = "lp_hsk_ticket_" + (mockId || "default");
        try {
          const existing = localStorage.getItem(key);
          if (existing) return existing;
        } catch (e) {}
        let hash = 0;
        const seed = String(mockId || "hsk") + "_" + getCandidateName();
        for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) % 900000;
        const ticket = "H" + (Number(level) || 1) + "26" + String(100000 + hash).slice(0, 6);
        try { localStorage.setItem(key, ticket); } catch (e) {}
        return ticket;
      }

      function draftKey(id, scopeOverride) {
        const sc = scopeOverride || state.scope || "all";
        return DRAFT_PREFIX + state.mode + ":" + sc + ":" + id;
      }

      function readDraft(id, scopeOverride) {
        try {
          const draft = JSON.parse(localStorage.getItem(draftKey(id, scopeOverride)));
          return draft && Number.isFinite(draft.remainingSec) && draft.remainingSec > 0 ? draft : null;
        } catch (e) { return null; }
      }

      function getMaxListeningPlays(level, modeOverride) {
        const md = modeOverride || state.mode;
        if (md !== "real") return 99;
        return Number(level) <= 3 ? 2 : 1;
      }

      function getAvailableSections(ex) {
        if (!ex) return [];
        const list = [];
        if ((ex.listening || []).length) list.push("listening");
        if ((ex.reading || []).length) list.push("reading");
        if ((ex.writing || []).length) list.push("writing");
        return list;
      }

      function isSectionLockedMode() {
        return Boolean(
          state.mode === "real" &&
          state.scope === "all" &&
          getAvailableSections(state.exam).length > 1
        );
      }

      function getScopeLabel(scope, partFilter) {
        const baseMap = {
          all: "Thi đầy đủ (Full bài)",
          listening: "Luyện phần Nghe",
          reading: "Luyện phần Đọc",
          writing: "Luyện phần Viết"
        };
        const base = baseMap[scope || "all"] || baseMap.all;
        if (partFilter && partFilter !== "all") return base + " · " + partFilter;
        return base;
      }

      function getExamPartList(baseEx, scope) {
        if (!baseEx || !scope || scope === "all") return [];
        const arr = baseEx[scope] || [];
        const seen = {};
        const out = [];
        arr.forEach((q) => {
          const p = (q && q.partLabel) || "";
          if (p && !seen[p]) {
            seen[p] = true;
            out.push(p);
          }
        });
        return out;
      }

      function computeSectionDurations(ex) {
        const secs = getAvailableSections(ex);
        const totalSec = Math.max(60, Math.round(Number(ex && ex.durationMin || 25) * 60));
        const out = { listening: 0, reading: 0, writing: 0 };
        if (!secs.length) return out;
        if (secs.length === 1) {
          out[secs[0]] = totalSec;
          return out;
        }
        const levelWeights = {
          1: { listening: 15, reading: 17, writing: 0 },
          2: { listening: 25, reading: 22, writing: 0 },
          3: { listening: 35, reading: 30, writing: 15 },
          4: { listening: 30, reading: 40, writing: 25 },
          5: { listening: 30, reading: 45, writing: 40 },
          6: { listening: 35, reading: 50, writing: 45 }
        };
        const wMap = levelWeights[Number(ex.level)] || { listening: 30, reading: 40, writing: 30 };
        let wSum = 0;
        secs.forEach((s) => {
          wSum += wMap[s] > 0 ? wMap[s] : ((ex[s] || []).length || 10);
        });
        let assigned = 0;
        secs.forEach((s, idx) => {
          if (idx === secs.length - 1) {
            out[s] = Math.max(60, totalSec - assigned);
          } else {
            const w = wMap[s] > 0 ? wMap[s] : ((ex[s] || []).length || 10);
            const share = Math.max(60, Math.round(totalSec * (w / (wSum || 1))));
            out[s] = share;
            assigned += share;
          }
        });
        return out;
      }

      function buildScopedExam(baseEx, scope, partFilter) {
        if (!baseEx) return null;
        const sc = scope || "all";
        const pf = partFilter || "all";
        const matchPart = (q) => pf === "all" || (q && q.partLabel === pf);
        const listening = (sc === "all" || sc === "listening") ? (baseEx.listening || []).filter(matchPart) : [];
        const reading = (sc === "all" || sc === "reading") ? (baseEx.reading || []).filter(matchPart) : [];
        const writing = (sc === "all" || sc === "writing") ? (baseEx.writing || []).filter(matchPart) : [];
        const origTotal = (baseEx.listening || []).length + (baseEx.reading || []).length + (baseEx.writing || []).length;
        const newTotal = listening.length + reading.length + writing.length;
        const baseDur = Number(baseEx.durationMin || 25);
        const scopedDur = sc === "all"
          ? baseDur
          : Math.max(5, Math.round(baseDur * (newTotal / Math.max(1, origTotal))));
        return Object.assign({}, baseEx, {
          listening,
          reading,
          writing,
          durationMin: scopedDur,
          scope: sc,
          partFilter: pf
        });
      }

      function inferSceneBadge(q, level) {
        if (!q || Number(level) > 3) return null;
        const blob = [q.partLabel, q.prompt, q.statement, q.audioZh, q.audioVi, q.q, q.passageZh, q.passageVi]
          .filter(Boolean).join(" ").toLowerCase();
        const scenes = [
          { re: /(nhà hàng|ăn|uống|trà|cà phê|cơm|món|bữa|菜|吃|喝|饭|茶|水果|咖啡)/, tag: "Ẩm thực & Nhà hàng", title: "Ngữ cảnh quán ăn / đặt món hằng ngày" },
          { re: /(mua|tiền|giá|chợ|cửa hàng|quần áo|đồng|tệ|买|卖|钱|块|商店|衣服|贵)/, tag: "Mua sắm & Giao dịch", title: "Ngữ cảnh mua đồ / hỏi giá cả" },
          { re: /(bệnh|thuốc|bác sĩ|ốm|mệt|sốt|đau|医院|医生|药|病|生病|休息)/, tag: "Sức khỏe & Y tế", title: "Ngữ cảnh hỏi thăm sức khỏe / bệnh viện" },
          { re: /(xe|tàu|máy bay|ga|đường|đi|du lịch|đến|火车|飞机|出租车|公共汽车|路|旅游|机场)/, tag: "Di chuyển & Giao thông", title: "Ngữ cảnh phương tiện / hỏi đường" },
          { re: /(trường|học|lớp|giáo viên|sách|thi|bài|学校|学习|老师|学生|书|汉语|写)/, tag: "Trường học & Học tập", title: "Ngữ cảnh lớp học / ôn tập tiếng Trung" },
          { re: /(công ty|họp|việc|văn phòng|đồng nghiệp|工作|公司|上班|忙|同事)/, tag: "Công việc & Văn phòng", title: "Ngữ cảnh trao đổi công việc" },
          { re: /(thời tiết|mưa|nắng|lạnh|nóng|gió|mùa|天气|下雨|下雪|冷|热|风)/, tag: "Thời tiết & Bốn mùa", title: "Ngữ cảnh dự báo / cảm nhận thời tiết" },
          { re: /(giờ|ngày|tháng|năm|sáng|tối|hôm|tuần|点|分钟|今天|明天|昨天|时候)/, tag: "Thời gian & Lịch hẹn", title: "Ngữ cảnh hẹn giờ / sắp xếp lịch" }
        ];
        for (let i = 0; i < scenes.length; i += 1) {
          if (scenes[i].re.test(blob)) return scenes[i];
        }
        return { tag: "Tình huống HSK " + level, title: (q.partLabel || "Giao tiếp thường ngày") };
      }

      function mockSvg(name, size) {
        const s = size || 15;
        if (MOCK_ICON_PATHS[name]) {
          return `<span class="lp-svg" aria-hidden="true"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${MOCK_ICON_PATHS[name]}</svg></span>`;
        }
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          const out = window.S4UI.icon(name, s);
          if (out && out.indexOf("<svg") !== -1) return out;
        }
        const p = MOCK_ICON_PATHS.award;
        return `<span class="lp-svg" aria-hidden="true"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>`;
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }
      function escAttr(s) {
        return esc(s).replace(/`/g, "&#96;");
      }

      function normalizeZh(str) {
        return String(str || "")
          .replace(/[\s，。？！、；：“”‘’（）()《》〈〉—…·,.?!;:'"-]/g, "")
          .trim();
      }

      function countHanzi(str) {
        const m = String(str || "").match(/[\u4e00-\u9fff\u3400-\u4dbf]/g);
        return m ? m.length : 0;
      }

      function formatClock(sec) {
        const s = Math.max(0, Math.floor(Number(sec) || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      }

      function formatDateVi(iso) {
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return "";
          return d.toLocaleString("vi-VN", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          });
        } catch (e) { return ""; }
      }

      function loadResults() {
        const fallback = { bestById: {}, history: [] };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return {
            bestById: (parsed && typeof parsed.bestById === "object" && parsed.bestById) ? parsed.bestById : {},
            history: (parsed && Array.isArray(parsed.history)) ? parsed.history : []
          };
        } catch (e) {
          return fallback;
        }
      }

          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return {
            bestById: (parsed && typeof parsed.bestById === "object" && parsed.bestById) ? parsed.bestById : {},
            history: (parsed && Array.isArray(parsed.history)) ? parsed.history : []

      function saveHskkResult(report) {
        const data = loadHskkResults();
        const prev = data.bestById[report.id];
        if (!prev || report.totalScore > Number(prev.score || 0)) {
          data.bestById[report.id] = {
            score: report.totalScore,
            maxScore: report.maxScore || 100,
            passed: report.passed,
            dateIso: report.dateIso
          };
        }
        data.history.unshift({
          id: report.id,
          tierLabel: report.tierLabel,
          title: report.title,
          mode: report.mode,
          score: report.totalScore,
          maxScore: report.maxScore || 100,
          passed: report.passed,
          answeredCount: report.answeredCount,
          totalItems: report.totalItems,
          dateIso: report.dateIso
        });
        data.history = data.history.slice(0, 40);
        try { localStorage.setItem(HSKK_STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }

        const id = report.id;
        const isFullScope = !report.scope || report.scope === "all";

          if (!prev || report.totalScore > Number(prev.score || 0)) {
            data.bestById[id] = {
              score: report.totalScore,
              maxScore: report.maxScore,
              passed: report.passed,
              listeningScore: report.listeningScore,
              readingScore: report.readingScore,
              writingScore: report.writingScore,
              writingFormalOnly: Boolean(report.hasOpenWriting),
              qualityChecked: report.qualitySummary ? report.qualitySummary.checked : 0,
              qualityTotal: report.qualitySummary ? report.qualitySummary.total : 0,
