        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        var topPx = (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px";

        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();

  <style>
    :root {
      --bg: var(--lg-wash, rgba(15, 23, 42, 0.06));
      --card: var(--lg-surface, rgba(255, 255, 255, 0.72));
      --card-strong: var(--lg-surface-strong, rgba(255, 255, 255, 0.86));
      --text: var(--lg-ink, #0f172a);
      --muted: var(--lg-ink-muted, #64748b);
      --border: var(--lg-hairline, rgba(148, 163, 184, 0.22));
      --primary: var(--lg-accent, #dc2626);
      --primary-solid: #dc2626;
      --accent: #b45309;
      --ok: #16a34a;
      --ink-auto: #1e293b;
      --grid-line: rgba(220, 38, 38, 0.28);
      --ghost-color: rgba(15, 23, 42, 0.14);
      color-scheme: light;
    }
    html.dark, body.dark {
      --bg: var(--lg-wash, rgba(255, 255, 255, 0.06));
      --card: var(--lg-surface, rgba(15, 23, 42, 0.68));
      --card-strong: var(--lg-surface-strong, rgba(15, 23, 42, 0.82));
      --text: var(--lg-ink, #f8fafc);
      --muted: var(--lg-ink-muted, #94a3b8);
      --border: var(--lg-hairline, rgba(148, 163, 184, 0.22));
      --primary: var(--lg-accent, #f87171);
      --primary-solid: #e11d48;
      --accent: #fbbf24;
      --ok: #4ade80;
      --ink-auto: #f8fafc;
      --grid-line: rgba(248, 113, 113, 0.28);
      --ghost-color: rgba(248, 250, 252, 0.15);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; max-width: 100%; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent !important; color: var(--lg-ink, var(--text)); min-height: 100vh;
    }
    .lp-chip-inline { display: inline-flex; align-items: center; gap: 5px; }
    .lp-hsk-topbar {
      width: calc(100% - 28px);
      max-width: 1200px;
      margin: calc(8px + var(--s4-safe-top, 0px)) auto 0;
    }

    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 14px 14px 72px; }

    /* Summary + Main Tabs */
    .hero-strip {
      background: var(--card-strong);
      backdrop-filter: var(--lg-blur, blur(10px));
      -webkit-backdrop-filter: var(--lg-blur, blur(10px));
      border: 1px solid var(--border); border-radius: 18px;
      padding: 12px 16px; margin-bottom: 14px; display: flex;
      justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .hero-title { margin: 0; font-size: 17px; font-weight: 800; }
    .stats-pills { display: flex; gap: 7px; flex-wrap: wrap; }
    .stat-pill {
      font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; gap: 5px;
    }

    .main-tabs {
      display: flex; flex-wrap: wrap; gap: 7px; padding-bottom: 4px; margin-bottom: 14px;
    }
    .main-tab-btn {
      padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card-strong); color: var(--text); font-weight: 800; font-size: 13.5px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s ease;
    }
    @media (max-width: 640px) {
      .main-tabs { gap: 6px; }
      .main-tab-btn { padding: 8px 10px; font-size: 12px; }
    }
    .main-tab-btn.active {
      background: var(--primary-solid); color: #fff; border-color: var(--primary-solid);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .panel-card {
      background: var(--card-strong);
      backdrop-filter: var(--lg-blur, blur(10px));
      -webkit-backdrop-filter: var(--lg-blur, blur(10px));
      border: 1px solid var(--border); border-radius: 18px;
      padding: 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); min-width: 0;
    }

    /* Tab 1: Canvas + Picker */
    .practice-grid {
      display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 18px; align-items: start;
    }
    .canvas-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .write-mode-bar {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%;
    }
    .wmode-btn {
      padding: 8px 6px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12px; font-weight: 800;
      cursor: pointer; font-family: inherit; text-align: center; transition: all 0.14s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .wmode-btn:hover { border-color: var(--primary); }
    .wmode-btn.active {
      background: var(--primary-solid); color: #fff; border-color: var(--primary-solid);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.22);
    }
    .word-strip {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 11px; display: none; flex-direction: column; gap: 7px;
    }
    .word-strip.show { display: flex; }
    .word-strip-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
    .word-chars-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .wc-pill {
      min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--card); color: var(--text);
      font-size: 20px; font-weight: 800; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 3px; font-family: inherit;
    }
    .wc-pill.active { border-color: var(--primary); background: rgba(220, 38, 38, 0.14); color: var(--primary); }
    .wc-pill.done { border-color: #16a34a; }
    .wc-pill .wc-ok { font-size: 11px; color: var(--ok); }
    .mi-box {
      position: relative; width: 100%; max-width: min(330px, calc(100vw - 56px)); aspect-ratio: 1 / 1;
      background: var(--bg); border: 2px solid var(--primary); border-radius: 14px;
      overflow: hidden; box-shadow: inset 0 0 0 1px var(--border);
      touch-action: none;
    }
    .mi-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
    }
    #hwContainer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 3; touch-action: none; display: flex; align-items: center; justify-content: center;
    }
    #hwContainer svg { display: block; width: 100%; height: 100%; touch-action: none; }
    .mi-ghost {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: "STKaiti", "KaiTi", "BiauKai", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
      font-size: 230px; line-height: 1; color: var(--ghost-color);
      pointer-events: none; user-select: none; transition: opacity 0.15s ease; z-index: 2;
    }
    .mi-ghost.hidden { opacity: 0; }
    #drawCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      touch-action: none; cursor: crosshair; display: block; z-index: 4;
    }
    .hw-status {
      width: 100%; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); padding: 9px 12px; font-size: 13px; font-weight: 700;
      line-height: 1.45; text-align: center; transition: all 0.15s ease;
    }
    .hw-status.ok { border-color: #16a34a; background: rgba(22, 163, 74, 0.12); color: var(--ok); }
    .hw-status.bad { border-color: #dc2626; background: rgba(220, 38, 38, 0.12); color: var(--primary); }
    .hw-status.win { border-color: #16a34a; background: rgba(22, 163, 74, 0.18); color: var(--ok); }
    .hw-win-actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .custom-bar {
      display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px;
      padding: 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border);
    }
    .custom-bar input {
      flex: 1; min-width: 170px; height: 36px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      padding: 0 11px; font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .custom-bar input:focus { outline: none; border-color: var(--primary); }
    .custom-bar button {
      height: 36px; padding: 0 13px; border-radius: 9px; border: none;
      background: var(--primary-solid); color: #fff; font-size: 13px; font-weight: 800;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }

    .tool-row {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%;
    }
    .tool-btn {
      padding: 7px 11px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
    }
    .tool-btn.on { background: rgba(37, 99, 235, 0.14); border-color: #2563eb; color: #2563eb; }
    html.dark .tool-btn.on { color: #60a5fa; }
    .tool-btn.done-on { background: rgba(22, 163, 74, 0.16); border-color: #16a34a; color: var(--ok); }
    .tool-btn.danger:hover { border-color: #dc2626; color: var(--primary); }

    .ink-opts {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); width: 100%;
    }
    .dot-btn {
      width: 24px; height: 24px; border-radius: 99px; border: 2px solid var(--border);
      cursor: pointer; padding: 0; transition: transform 0.12s ease;
    }
    .dot-btn.active { border-color: var(--primary); transform: scale(1.16); box-shadow: 0 0 0 2px rgba(220,38,38,0.22); }
    .size-btn {
      padding: 4px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .size-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .char-info {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 13px 14px;
    }
    .char-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .char-big {
      width: 56px; height: 56px; border-radius: 12px; background: var(--card);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; color: var(--primary); flex-shrink: 0;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Microsoft YaHei", serif;
    }
    .char-meta h3 { margin: 0 0 2px; font-size: 16px; }
    .char-meta .sub { font-size: 12.5px; color: var(--muted); }
    .char-tip { font-size: 13px; line-height: 1.5; color: var(--text); margin: 8px 0 0; }
    .ex-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ex-chip {
      padding: 4px 9px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .ex-chip:hover { border-color: var(--primary); }

    /* Picker Column */
    .picker-head { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .mode-pill {
      padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; font-weight: 800;
      cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .mode-pill.active { background: var(--primary-solid); color: #fff; border-color: var(--primary-solid); }
    .search-inp {
      flex: 1; min-width: 150px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      padding: 0 11px; font-size: 13px; font-family: inherit;
    }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .f-chip {
      padding: 5px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .f-chip.active { background: rgba(220,38,38,0.12); border-color: var(--primary); color: var(--primary); }

    .tile-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
      gap: 8px; max-height: 540px; overflow-y: auto; padding-right: 2px;
    }
    .c-tile {
      position: relative; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer;
      transition: all 0.14s ease; font-family: inherit; color: var(--text);
    }
    .c-tile:hover { border-color: var(--primary); transform: translateY(-1px); }
    .c-tile.active {
      border-color: var(--primary); background: rgba(220, 38, 38, 0.12);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .c-tile .hz { display: block; font-size: 25px; font-weight: 800; line-height: 1.2; }
    .c-tile .py { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-tile .done-dot {
      position: absolute; top: 4px; right: 5px; font-size: 10px; color: var(--ok); font-weight: 800;
    }
    .c-tile .rad-num {
      position: absolute; top: 4px; left: 5px; font-size: 9.5px; color: var(--muted); font-weight: 700;
    }
    .variant-pill {
      display: inline-block; padding: 2px 7px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--card); color: var(--primary); font-weight: 800; font-size: 13px; margin: 0 2px;
    }

    /* Tab 2: HSK 3-4 (3 Sub-modes) */
    .tab2-submodes {
      display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .submode-btn {
      padding: 8px 13px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: all 0.14s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .submode-btn:hover { border-color: var(--primary); }
    .submode-btn.active {
      background: var(--primary-solid); color: #fff; border-color: var(--primary-solid);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.22);
    }
    .pw-sentence-box, .ms-kw-card, .scene-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 12px; min-width: 0; overflow-wrap: anywhere;
    }
    .pw-zh-line { font-size: 20px; font-weight: 700; line-height: 1.75; margin-bottom: 6px; }
    .pw-blank {
      display: inline-block; padding: 2px 10px; border-radius: 9px;
      border: 1.5px dashed var(--primary); background: rgba(220, 38, 38, 0.08);
      color: var(--primary); font-size: 15px; font-weight: 800; margin: 0 4px; vertical-align: middle;
    }
    .pw-input-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px;
    }
    .pw-input {
      flex: 1; min-width: 180px; height: 42px; border-radius: 11px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); padding: 0 13px; font-size: 18px;
      font-weight: 700; font-family: inherit;
    }
    .pw-input:focus { outline: none; border-color: var(--primary); }
    .ms-kw-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .ms-kw-zh {
      font-size: 26px; font-weight: 800; color: var(--primary); padding: 4px 12px;
      border-radius: 11px; background: var(--card); border: 1px solid var(--border);
    }
    .ms-check-list { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
    .ms-sample-item {
      padding: 10px 12px; border-radius: 11px; background: var(--card);
      border: 1px solid var(--border); margin-top: 8px;
    }
    .feedback-box, .info-collapse, .kw-badge { overflow-wrap: anywhere; max-width: 100%; }

    /* Tab 2: Reorder Tasks */
    .num-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .num-btn {
      width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-weight: 700; font-size: 12.5px;
      cursor: pointer; font-family: inherit;
    }
    .num-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .num-btn.solved { border-color: #16a34a; color: var(--ok); background: rgba(22,163,74,0.12); }
    .num-btn.active.solved { background: #16a34a; color: #fff; }

    .answer-slot {
      min-height: 66px; border: 2px dashed var(--border); border-radius: 14px;
      background: var(--bg); padding: 12px; display: flex; flex-wrap: wrap;
      gap: 8px; align-items: center; margin-bottom: 14px;
    }
    .slot-placeholder { color: var(--muted); font-size: 13.5px; }
    .word-bank {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 14px;
      background: var(--bg); border: 1px solid var(--border); margin-bottom: 14px; min-height: 58px;
    }
    .w-chip {
      padding: 8px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.12s ease;
    }
    .w-chip:hover { border-color: var(--primary); transform: translateY(-1px); }
    .w-chip.placed { background: rgba(220,38,38,0.12); border-color: var(--primary); color: var(--primary); }
    .w-chip.used { opacity: 0.25; pointer-events: none; }

    .feedback-box {
      margin-top: 14px; padding: 14px; border-radius: 13px; border: 1px solid var(--border);
      background: var(--bg); line-height: 1.6; font-size: 14px;
    }
    .feedback-box.ok { border-color: #16a34a; background: rgba(22,163,74,0.1); }
    .feedback-box.bad { border-color: #dc2626; background: rgba(220,38,38,0.1); }

    /* Tab 3: Essay Writing HSK 5-6 */
    .prompt-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .p-pill {
      padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .p-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .p-pill.done { border-color: #16a34a; }

    .kw-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .kw-badge {
      padding: 7px 11px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--bg); font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .kw-badge.used { border-color: #16a34a; background: rgba(22,163,74,0.12); }
    .kw-zh { font-size: 16px; font-weight: 800; color: var(--primary); }
    .kw-badge.used .kw-zh { color: var(--ok); }

    .source-box {

        radicals: (Array.isArray(window.LP_HSK_RADICALS_214) && window.LP_HSK_RADICALS_214.length)
          ? window.LP_HSK_RADICALS_214
          : (Array.isArray(baseData.radicals) ? baseData.radicals : []),
        practiceChars: Array.isArray(baseData.practiceChars) ? baseData.practiceChars : [],
        reorderTasks: Array.isArray(baseData.reorderTasks) ? baseData.reorderTasks : [],
        pinyinWriteTasks: Array.isArray(baseData.pinyinWriteTasks) ? baseData.pinyinWriteTasks : [],
        makeSentenceTasks: Array.isArray(baseData.makeSentenceTasks) ? baseData.makeSentenceTasks : [],
        essayPrompts: (Array.isArray(window.LP_HSK_ESSAYS_DATA) && window.LP_HSK_ESSAYS_DATA.length)
          ? window.LP_HSK_ESSAYS_DATA
          : (Array.isArray(baseData.essayPrompts) ? baseData.essayPrompts : [])
      };

      function loadDone() {
        const base = { chars: {}, radicals: {}, reorder: {}, pinyinWrite: {}, makeSentence: {}, essays: {} };
        try {
          const raw = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
          if (raw && typeof raw === "object") {
            return {
              chars: raw.chars || {},
              radicals: raw.radicals || {},
              reorder: raw.reorder || {},
              pinyinWrite: raw.pinyinWrite || {},
              makeSentence: raw.makeSentence || {},
              essays: raw.essays || {}
            };
          }
        } catch (e) {}
        return base;
      }

      function saveDone() {
        try { localStorage.setItem(DONE_KEY, JSON.stringify(doneState)); } catch (e) {}
        renderProgressSummary();
      }

      function loadDrafts() {
        try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || "{}") || {}; } catch (e) { return {}; }
      }

      let draftSaveTimer = null;
      function flushDraftsNow() {
        if (draftSaveTimer) { clearTimeout(draftSaveTimer); draftSaveTimer = null; }
        try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); } catch (e) {}
      }
      function saveDraft(id, text, immediate) {
        drafts[id] = text;
        if (immediate) {
          flushDraftsNow();
          return;
        }
        if (draftSaveTimer) clearTimeout(draftSaveTimer);
        draftSaveTimer = setTimeout(flushDraftsNow, 400);
      }
      window.addEventListener("pagehide", flushDraftsNow);

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function escJsAttr(s) {
        return esc(
          String(s == null ? "" : s)
            .replace(/\\/g, "\\\\")
            .replace(/\r?\n/g, " ")
            .replace(/'/g, "\\'")
        );
      }

      function speak(text, rate, pyOpts) {
        if (window.HskTTS && (text || (pyOpts && (pyOpts.pinyin || pyOpts.pinyinNum)))) {
          const opts = { rate: rate || 0.95 };
          if (pyOpts && typeof pyOpts === "object") {
            if (pyOpts.pinyin) opts.pinyin = pyOpts.pinyin;
            if (pyOpts.pinyinNum) opts.pinyinNum = pyOpts.pinyinNum;
            if (pyOpts.preferPinyinAudio) opts.preferPinyinAudio = true;
          } else if (typeof pyOpts === "string" && pyOpts.trim()) {
            opts.pinyin = pyOpts.trim();
          }
          window.HskTTS.speak(text, opts);
        }
      }

      let doneState = loadDone();
      let drafts = loadDrafts();
      let activeMainTab = "canvas";

      window.toggleWritingDark = function () {
        if (typeof window.toggleDarkModeOnly === "function") {
          window.toggleDarkModeOnly();
        } else {
          const next = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", next);
          if (document.body) document.body.classList.toggle("dark", next);
          try { localStorage.setItem("s4_vocab_dark", next ? "1" : "0"); } catch (e) {}
        }
        const isDark = document.documentElement.classList.contains("dark");
        const darkBtn = document.getElementById("btnDarkWriting");
        if (darkBtn && window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(darkBtn, isDark);
        }
        const meta = document.getElementById("metaThemeColor");
        if (meta) meta.setAttribute("content", isDark ? "#0d1813" : "#f1f5f9");
      };

      // ---------- PROGRESS SUMMARY ----------
      function renderProgressSummary() {
        const el = document.getElementById("progressSummary");
        if (!el) return;
        const presetSet = new Set(DATA.practiceChars.map(function (x) { return x.char; }));
        const cPresetDone = DATA.practiceChars.filter(function (x) { return Boolean(doneState.chars[x.char]); }).length;
        const cExtraDone = Object.keys(doneState.chars).filter(function (k) { return doneState.chars[k] && !presetSet.has(k); }).length;
        const rDone = Object.keys(doneState.radicals).filter(k => doneState.radicals[k]).length;
        const sDone = Object.keys(doneState.reorder).filter(k => doneState.reorder[k]).length;
        const pwDone = Object.keys(doneState.pinyinWrite).filter(k => doneState.pinyinWrite[k]).length;
        const msDone = Object.keys(doneState.makeSentence).filter(k => doneState.makeSentence[k]).length;
        const hsk34Done = sDone + pwDone + msDone;
        const hsk34Total = DATA.reorderTasks.length + DATA.pinyinWriteTasks.length + DATA.makeSentenceTasks.length;
        const eDone = Object.keys(doneState.essays).filter(k => doneState.essays[k]).length;
        el.innerHTML =
          `<span class="stat-pill">${wIcon("book", 13)} Chữ: ${cPresetDone}/${DATA.practiceChars.length}${cExtraDone ? ` (+${cExtraDone})` : ""}</span>` +
          `<span class="stat-pill">${wIcon("layers", 13)} Bộ thủ: ${rDone}/${DATA.radicals.length}</span>` +
          `<span class="stat-pill">${wIcon("edit", 13)} HSK 3–4: ${hsk34Done}/${hsk34Total}</span>` +
          `<span class="stat-pill">${wIcon("file", 13)} HSK 5–6: ${eDone}/${DATA.essayPrompts.length}</span>`;
      }

      // ---------- MAIN TAB SWITCH ----------
      window.switchMainTab = function (tab) {
        activeMainTab = tab;
        document.querySelectorAll(".main-tab-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
        });

        document.getElementById("tab-reorder").style.display = tab === "reorder" ? "" : "none";
        document.getElementById("tab-essay").style.display = tab === "essay" ? "" : "none";
        if (tab === "canvas") {
          if (writeMode === "free") resizeCanvas();
          else mountHanziWriter();
        }
        if (tab === "reorder") renderReorderTab();
        if (tab === "essay") renderEssayTab();
      };

      // ==========================================================
      // TAB 1: HANZI WRITER QUIZ + ANIMATION + FREE CANVAS & RADICALS
      // ==========================================================
      let pickerMode = "chars"; // "chars" | "radicals"
      let pickerFilter = "all";
      let selectedItem = DATA.practiceChars[0] || DATA.radicals[0] || { char: "好", pinyin: "hǎo", hv: "Hảo", meaning: "Tốt", strokes: 6, tip: "" };
      let selectedType = "chars"; // "chars" | "radicals" | "custom"
      let writeMode = "quiz"; // "quiz" | "animate" | "free"
      let hwOutlineOn = true;
      let hwAnimSlow = false;
      let hwWriter = null;
      let hwCurrentStroke = 0;
      let hwTotalStrokes = 0;
      let hwAnimStepIdx = 0;
      let hwMountToken = 0;
      let hwLastDark = document.documentElement.classList.contains("dark");
      let hwLastBoxWidth = 0;
      let freeLastBoxWidth = 0;
      let freeLastBoxHeight = 0;
      let showTargetTip = false;
      const charDataCache = Object.create(null);

      // Multi-char custom word / deep-link state
      let wordCtx = null; // { word, chars: [...], activeIdx, py, vi, from }

      let showGhost = true;
      let brushSize = 8;
      let brushColor = "auto";
      let strokes = [];
      let currentStroke = null;
      let activePointerId = null;

      const canvas = document.getElementById("drawCanvas");
      const ctx = canvas.getContext("2d");

      function setHwStatus(html, toneClass) {
        const el = document.getElementById("hwStatus");
        if (!el) return;
        el.className = "hw-status" + (toneClass ? " " + toneClass : "");
        el.innerHTML = html;
      }

      function fetchCharStrokeData(ch) {
        if (charDataCache[ch]) return Promise.resolve(charDataCache[ch]);
        const urls = [
          "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/" + encodeURIComponent(ch) + ".json",
          "https://unpkg.com/hanzi-writer-data@2.0.1/" + encodeURIComponent(ch) + ".json"
        ];
        return fetch(urls[0]).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        }).catch(function () {
          return fetch(urls[1]).then(function (r2) {
            if (!r2.ok) throw new Error("HTTP " + r2.status);
            return r2.json();
          });
        }).then(function (data) {
          charDataCache[ch] = data;
          return data;
        });
      }

      function updateWriteModeUI() {
        document.querySelectorAll("#writeModeBar .wmode-btn").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-wmode") === writeMode);
        });
        const isFree = writeMode === "free";
        document.getElementById("hwContainer").style.display = isFree ? "none" : "flex";
        document.getElementById("ghostChar").style.display = isFree ? "flex" : "none";
        document.getElementById("drawCanvas").style.display = isFree ? "block" : "none";

        document.getElementById("quizToolRow").style.display = writeMode === "quiz" ? "flex" : "none";
        document.getElementById("animToolRow").style.display = writeMode === "animate" ? "flex" : "none";
        document.getElementById("freeToolRow").style.display = isFree ? "flex" : "none";
        document.getElementById("freeInkOpts").style.display = isFree ? "flex" : "none";

        const outlineBtn = document.getElementById("btnHwOutline");
        if (outlineBtn) {
          outlineBtn.classList.toggle("on", hwOutlineOn);
          outlineBtn.innerHTML = wIcon("eye", 13) + " Chữ mờ: " + (hwOutlineOn ? "Hiện" : "Ẩn");
        }
        const spdBtn = document.getElementById("btnAnimSpeed");
        if (spdBtn) {
          spdBtn.classList.toggle("on", hwAnimSlow);
          spdBtn.innerHTML = wIcon("gauge", 13) + " Chậm: " + (hwAnimSlow ? "Bật" : "Tắt");
        }
      }

      function mountHanziWriter() {
        hwMountToken++;
        const token = hwMountToken;
        updateWriteModeUI();

        if (writeMode === "free") {
          setHwStatus(`${wIcon("edit", 14)} Vẽ tự do trên Ô chữ Mễ (米字格).`, "");
          setTimeout(resizeCanvas, 20);
          return;
        }

        const container = document.getElementById("hwContainer");
        if (!container || !selectedItem) return;
        container.innerHTML = "";
        hwWriter = null;
        hwCurrentStroke = 0;
        hwAnimStepIdx = 0;

        const ch = selectedItem.char;
        if (!window.HanziWriter) {
          setHwStatus(`${wIcon("alert", 14)} Không nạp được bộ chấm nét — đã chuyển sang Vẽ tự do.`, "bad");
          writeMode = "free";
          updateWriteModeUI();
          setTimeout(resizeCanvas, 20);
          return;
        }

        const box = document.getElementById("miBox");
        const sz = Math.max(220, Math.round((box && box.clientWidth) ? box.clientWidth - 4 : 300));
        hwLastBoxWidth = sz;
        const isDark = document.documentElement.classList.contains("dark");
        hwLastDark = isDark;

        setHwStatus(`Đang nạp dữ liệu nét chuẩn cho chữ <b>${esc(ch)}</b>…`, "");

        fetchCharStrokeData(ch).then(function (strokeData) {
          if (token !== hwMountToken || writeMode === "free") return;
          hwTotalStrokes = Array.isArray(strokeData.strokes) ? strokeData.strokes.length : (selectedItem.strokes || 0);
          if (selectedItem && (!selectedItem.strokes || selectedType === "custom")) {
            selectedItem.strokes = hwTotalStrokes;
            renderTargetInfo();
          }

          container.innerHTML = "";
          hwWriter = window.HanziWriter.create(container, ch, {
            width: sz,
            height: sz,
            padding: 14,
            showCharacter: writeMode === "animate",
            showOutline: writeMode === "animate" ? true : hwOutlineOn,
            strokeColor: isDark ? "#f8fafc" : "#1e293b",
            radicalColor: isDark ? "#f87171" : "#dc2626",
            outlineColor: isDark ? "rgba(248, 250, 252, 0.22)" : "rgba(15, 23, 42, 0.18)",
            highlightColor: "#f59e0b",
            drawingColor: isDark ? "#38bdf8" : "#2563eb",
            drawingWidth: 20,
            strokeAnimationSpeed: hwAnimSlow ? 0.55 : 1.2,
            delayBetweenStrokes: hwAnimSlow ? 420 : 220,
            delayBetweenLoops: 1200,
            showHintAfterMisses: 2,
            highlightOnComplete: true,
            leniency: 1.15,
            charDataLoader: function (c, onComplete) { onComplete(strokeData); },
            onLoadCharDataError: function () {}
          });

          if (writeMode === "quiz") {
            startHwQuizSession(token, ch);
          } else {
            const stepBtn = document.getElementById("btnStepStroke");
            if (stepBtn) stepBtn.innerHTML = `${wIcon("step", 13)} Từng nét (0/${hwTotalStrokes})`;
            setHwStatus(`${wIcon("play", 14)} Chữ <b>${esc(ch)}</b> có <b>${hwTotalStrokes} nét</b> (bộ thủ tô đỏ). Đang chạy bút thuận…`, "ok");
            hwWriter.animateCharacter();
          }
        }).catch(function () {
          if (token !== hwMountToken) return;
          writeMode = "free";
          updateWriteModeUI();
          setTimeout(resizeCanvas, 20);
          setHwStatus(`${wIcon("alert", 14)} Chữ/bộ thủ <b>${esc(ch)}</b> chưa có dữ liệu nét tự động — hãy luyện ở chế độ <b>Vẽ tự do</b>.`, "bad");
        });
      }

      function startHwQuizSession(token, ch) {
        if (!hwWriter) return;
        hwCurrentStroke = 0;
        setHwStatus(`${wIcon("edit", 14)} Vẽ <b>nét 1/${hwTotalStrokes}</b> của chữ <b>${esc(ch)}</b> (sai 2 lần sẽ tự gợi ý).`, "");
        hwWriter.quiz({
          showHintAfterMisses: 2,
          highlightOnComplete: true,
          leniency: 1.15,
          onMistake: function (strokeData) {
            if (token !== hwMountToken) return;
            hwCurrentStroke = strokeData.strokeNum;
            const hintNote = strokeData.mistakesOnStroke >= 2 ? " Đã nháy gợi ý nét chuẩn!" : " Thử vẽ lại đúng chiều.";
            setHwStatus(`${wIcon("close", 14)} Nét <b>${strokeData.strokeNum + 1}/${hwTotalStrokes}</b> chưa chuẩn (sai ${strokeData.mistakesOnStroke} lần).${hintNote}`, "bad");
          },
          onCorrectStroke: function (strokeData) {
            if (token !== hwMountToken) return;
            hwCurrentStroke = strokeData.strokeNum + 1;
            if (strokeData.strokesRemaining > 0) {
              setHwStatus(`${wIcon("check", 14)} Đúng nét <b>${strokeData.strokeNum + 1}/${hwTotalStrokes}</b>! Còn ${strokeData.strokesRemaining} nét.`, "ok");
            }
          },
          onComplete: function (summary) {
            if (token !== hwMountToken) return;
            const misses = Number(summary && summary.totalMistakes ? summary.totalMistakes : 0);
            const bucket = selectedType === "radicals" ? doneState.radicals : doneState.chars;
            bucket[ch] = true;
            saveDone();
            renderTargetInfo();
            renderPicker();
            renderWordStrip();
            speak(ch, 0.88, selectedItem && selectedItem.char === ch ? { pinyin: selectedItem.pinyin, preferPinyinAudio: selectedType === "radicals" } : null);

            const rating = misses === 0
              ? `${wIcon("award", 14)} Hoàn hảo (100% chuẩn nét!)`
              : (misses <= 2 ? `${wIcon("check", 14)} Rất tốt! (sai ${misses} nét)` : `${wIcon("check", 14)} Đã hoàn thành! (sai ${misses} nét)`);
            const nextBtnHtml = hasNextWordChar()
              ? `<button class="tool-btn done-on" onclick="advanceNextWordChar()">Chữ tiếp (${esc(wordCtx.chars[wordCtx.activeIdx + 1])}) →</button>`
              : `<button class="tool-btn done-on" onclick="advanceNextPickerChar()">Chữ tiếp →</button>`;
            const blindBtnHtml = hwOutlineOn
              ? `<button class="tool-btn" onclick="retryBlindQuiz()">${wIcon("eye", 13)} Viết không chữ mờ</button>`
              : `<button class="tool-btn" onclick="restartHwQuiz()">${wIcon("refresh", 13)} Viết lại</button>`;

            setHwStatus(
              `<div class="lp-chip-inline" style="justify-content:center;flex-wrap:wrap;">${rating} — Đã lưu chữ <b>${esc(ch)}</b>.</div>` +
              `<div class="hw-win-actions">${blindBtnHtml}${nextBtnHtml}</div>`,
              "win"
            );
          }
        });
      }

      window.setWriteMode = function (mode) {
        if (writeMode === mode && (mode === "free" || hwWriter)) return;
        writeMode = mode;
        mountHanziWriter();
      };

      window.toggleHwOutline = function () {
        hwOutlineOn = !hwOutlineOn;
        updateWriteModeUI();
        if (hwWriter && writeMode === "quiz") {
          if (hwOutlineOn) hwWriter.showOutline();
          else hwWriter.hideOutline();
        }
      };

      window.hintNextStroke = function () {
        if (!hwWriter || writeMode !== "quiz") return;
        if (hwCurrentStroke < hwTotalStrokes) {
          hwWriter.highlightStroke(hwCurrentStroke);
          setHwStatus(`${wIcon("lightbulb", 14)} Gợi ý <b>nét ${hwCurrentStroke + 1}/${hwTotalStrokes}</b> — vẽ theo đường vừa nháy sáng.`, "");
        }
      };

      window.restartHwQuiz = function () {
        if (writeMode !== "quiz") {
          writeMode = "quiz";
        }
        mountHanziWriter();
      };

      window.retryBlindQuiz = function () {
        hwOutlineOn = false;
        writeMode = "quiz";
        mountHanziWriter();
      };

      window.playHwAnim = function () {
        if (!hwWriter || writeMode !== "animate") return;
        hwAnimStepIdx = 0;
        const stepBtn = document.getElementById("btnStepStroke");
        if (stepBtn) stepBtn.innerHTML = `${wIcon("step", 13)} Từng nét (0/${hwTotalStrokes})`;
        setHwStatus(`${wIcon("play", 14)} Đang chạy bút thuận chữ <b>${esc(selectedItem.char)}</b> (${hwTotalStrokes} nét)…`, "ok");
        hwWriter.animateCharacter();
      };

      window.loopHwAnim = function () {
        if (!hwWriter || writeMode !== "animate") return;
        setHwStatus(`${wIcon("repeat", 14)} Đang lặp bút thuận chữ <b>${esc(selectedItem.char)}</b>…`, "ok");
        hwWriter.loopCharacterAnimation();
      };

      window.stepHwStroke = function () {
        if (!hwWriter || writeMode !== "animate" || !hwTotalStrokes) return;
        if (hwAnimStepIdx >= hwTotalStrokes) hwAnimStepIdx = 0;
        const idx = hwAnimStepIdx;
        hwAnimStepIdx++;
        const stepBtn = document.getElementById("btnStepStroke");
        if (stepBtn) stepBtn.innerHTML = `${wIcon("step", 13)} Từng nét (${hwAnimStepIdx}/${hwTotalStrokes})`;
        setHwStatus(`${wIcon("step", 14)} Chiếu <b>nét ${idx + 1}/${hwTotalStrokes}</b> của chữ <b>${esc(selectedItem.char)}</b>.`, "ok");
        hwWriter.animateStroke(idx);
      };

      window.toggleAnimSpeed = function () {
        hwAnimSlow = !hwAnimSlow;
        mountHanziWriter();
      };

      function resolveColor(c) {
        if (c !== "auto") return c;
        return document.documentElement.classList.contains("dark") ? "#f8fafc" : "#1e293b";
      }

      function resizeCanvas() {
        const box = document.getElementById("miBox");
        if (!box) return;
        const rect = box.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        freeLastBoxWidth = Math.round(rect.width);
        freeLastBoxHeight = Math.round(rect.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        redrawStrokes();
      }

      function redrawStrokes() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        const scale = w / 330;
        for (let i = 0; i < strokes.length; i++) {
          const st = strokes[i];
          if (!st.pts.length) continue;
          ctx.save();
          ctx.strokeStyle = resolveColor(st.color);
          ctx.fillStyle = resolveColor(st.color);
          ctx.lineWidth = Math.max(1.5, st.size * scale);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          if (st.pts.length === 1) {
            ctx.beginPath();
            ctx.arc(st.pts[0].x * w, st.pts[0].y * h, ctx.lineWidth / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(st.pts[0].x * w, st.pts[0].y * h);
            for (let j = 1; j < st.pts.length - 1; j++) {
              const midX = ((st.pts[j].x + st.pts[j + 1].x) / 2) * w;
              const midY = ((st.pts[j].y + st.pts[j + 1].y) / 2) * h;
              ctx.quadraticCurveTo(st.pts[j].x * w, st.pts[j].y * h, midX, midY);
            }
            const last = st.pts[st.pts.length - 1];
            ctx.lineTo(last.x * w, last.y * h);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function getNormPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        return { x, y };
      }

      canvas.addEventListener("pointerdown", function (e) {
        if (activePointerId !== null) return;
        e.preventDefault();
        activePointerId = e.pointerId;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        currentStroke = { color: brushColor, size: brushSize, pts: [getNormPoint(e)] };
        strokes.push(currentStroke);
        redrawStrokes();
      });

      canvas.addEventListener("pointermove", function (e) {
        if (e.pointerId !== activePointerId || !currentStroke) return;
        e.preventDefault();
        const pt = getNormPoint(e);
        const last = currentStroke.pts[currentStroke.pts.length - 1];
        const dx = pt.x - last.x;
        const dy = pt.y - last.y;
        if (dx * dx + dy * dy > 0.000025) {
          currentStroke.pts.push(pt);
          redrawStrokes();
        }
      });

      function endPointer(e) {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        currentStroke = null;
        try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);

      window.toggleGhost = function () {
        showGhost = !showGhost;
        document.getElementById("ghostChar").classList.toggle("hidden", !showGhost);
        const btn = document.getElementById("btnGhost");
        btn.classList.toggle("on", showGhost);
        btn.innerHTML = wIcon("eye", 13) + " Bóng mẫu: " + (showGhost ? "Hiện" : "Ẩn");
      };

      window.undoStroke = function () {
        if (strokes.length > 0) {
          strokes.pop();
          redrawStrokes();
        }
      };

      window.clearCanvas = function () {
        strokes = [];
        redrawStrokes();
      };

      window.setBrushSize = function (sz) {
        brushSize = sz;
        document.querySelectorAll(".size-btn").forEach(function (b) {
          b.classList.toggle("active", Number(b.getAttribute("data-size")) === sz);
        });
      };

      window.setBrushColor = function (clr) {
        brushColor = clr;
        document.querySelectorAll(".dot-btn").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-color") === clr);
        });
      };

      window.speakCurrentTarget = function () {
        if (!selectedItem) return;
        speak(selectedItem.char, 0.85, { pinyin: selectedItem.pinyin, preferPinyinAudio: selectedType === "radicals" });
      };

      window.speakEx = function (txt, explicitPy) {
        const raw = String(txt || "");
        const clean = raw.split("(")[0].trim();
        let py = explicitPy || "";
        if (!py) {
          const m = raw.match(/\(([^):,]+)/);
          if (m && m[1]) py = m[1].trim();
        }
        speak(clean || raw, 0.9, py ? { pinyin: py } : null);
      };

      window.toggleMarkCurrentTarget = function () {
        if (!selectedItem) return;
        const bucket = selectedType === "radicals" ? doneState.radicals : doneState.chars;
        bucket[selectedItem.char] = !bucket[selectedItem.char];
        saveDone();
        renderTargetInfo();
        renderPicker();
        renderWordStrip();
      };

      function buildItemForChar(ch, fallbackPy, fallbackVi) {
        const preset = DATA.practiceChars.find(function (x) { return x.char === ch; });
        if (preset) return { type: "chars", item: preset };
        const rad = DATA.radicals.find(function (x) { return x.char === ch; });
        if (rad) return { type: "radicals", item: rad };
        return {
          type: "custom",
          item: {
            char: ch,
            pinyin: fallbackPy || "",
            hv: "",
            meaning: fallbackVi || "Chữ Hán tự chọn",
            radical: "",
            strokes: 0,
            tip: "Viết từ trái sang phải, trên xuống dưới. Bấm Gợi ý nét hoặc Bút thuận để xem thứ tự."
          }
        };
      }

      function renderWordStrip() {
        const strip = document.getElementById("wordStrip");
        if (!strip) return;
        if (!wordCtx || !wordCtx.chars.length) {
          strip.classList.remove("show");
          strip.innerHTML = "";
          return;
        }
        strip.classList.add("show");
        const backHref = wordCtx.from === "vocab" ? "../vocab/index.html" : (wordCtx.from === "lessons" ? "../lessons/index.html" : (wordCtx.from === "reading" ? "../reading/index.html" : ""));
        const backLabel = wordCtx.from === "vocab" ? "← Quay lại Từ vựng" : (wordCtx.from === "lessons" ? "← Quay lại Bài giảng" : (wordCtx.from === "reading" ? "← Quay lại Đọc hiểu" : ""));
        const backPwBtn = wordCtx.from === "pinyinWrite"
          ? `<button class="tool-btn" style="padding:4px 8px;font-size:11.5px;" onclick="returnToPinyinWrite()">← Quay lại Pinyin→Hán tự</button>`
          : "";
        const pills = wordCtx.chars.map(function (c, i) {
          const isAct = i === wordCtx.activeIdx;
          const isDone = Boolean(doneState.chars[c] || doneState.radicals[c]);
          return `<button class="wc-pill ${isAct ? "active" : ""} ${isDone ? "done" : ""}" onclick="selectWordChar(${i})">${esc(c)}${isDone ? `<span class="wc-ok">${wIcon("check", 11)}</span>` : ""}</button>`;
        }).join("");
        strip.innerHTML = `
          <div class="word-strip-top">
            <div>
              <b class="lp-chip-inline">${wIcon("target", 13)} Đang tập: ${esc(wordCtx.word)}</b>
              ${wordCtx.py ? `<span style="color:var(--primary);font-weight:700;margin-left:5px;">(${esc(wordCtx.py)})</span>` : ""}
              ${wordCtx.vi ? `<span style="color:var(--muted);margin-left:5px;">— ${esc(wordCtx.vi)}</span>` : ""}
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <button class="tool-btn" style="padding:4px 8px;font-size:11.5px;" onclick="speakEx('${escJsAttr(wordCtx.word)}','${escJsAttr(wordCtx.py || "")}')">${wIcon("volume", 12)} Nghe cả từ</button>
              ${backPwBtn}
              ${backHref ? `<a class="tool-btn" style="padding:4px 8px;font-size:11.5px;text-decoration:none;" href="${backHref}">${backLabel}</a>` : ""}
              <button class="tool-btn" style="padding:4px 8px;font-size:11.5px;" onclick="clearWordCtx()" title="Đóng" aria-label="Đóng">${wIcon("close", 12)}</button>
            </div>
          </div>
          <div class="word-chars-row">${pills}</div>
        `;
      }

      function hasNextWordChar() {
        return Boolean(wordCtx && wordCtx.activeIdx + 1 < wordCtx.chars.length);
      }

      window.selectWordChar = function (idx) {
        if (!wordCtx || !wordCtx.chars[idx]) return;
        wordCtx.activeIdx = idx;
        const ch = wordCtx.chars[idx];
        const built = buildItemForChar(ch, wordCtx.chars.length === 1 ? wordCtx.py : "", wordCtx.chars.length === 1 ? wordCtx.vi : ("Thuộc từ: " + wordCtx.word + (wordCtx.vi ? " — " + wordCtx.vi : "")));
        selectedType = built.type;
        selectedItem = built.item;
        strokes = [];
        redrawStrokes();
        renderWordStrip();
        renderTargetInfo();
        renderPicker();
        mountHanziWriter();
      };

      window.advanceNextWordChar = function () {
        if (hasNextWordChar()) selectWordChar(wordCtx.activeIdx + 1);
      };

      function getFilteredPickerItems() {
        const qRaw = (document.getElementById("pickerSearch")?.value || "").trim();
        const qNorm = (window.S4SearchEngine && typeof window.S4SearchEngine.normalize === "function")
          ? window.S4SearchEngine.normalize(qRaw)
          : qRaw.toLowerCase();
        const qPyNorm = (window.S4SearchEngine && typeof window.S4SearchEngine.normalizePinyin === "function")
          ? window.S4SearchEngine.normalizePinyin(qRaw)
          : qNorm;
        const list = pickerMode === "radicals" ? DATA.radicals : DATA.practiceChars;
        const bucket = pickerMode === "radicals" ? doneState.radicals : doneState.chars;

        return list.filter(function (item) {
          if (pickerMode === "chars") {
            if (pickerFilter === "todo" && bucket[item.char]) return false;
            if (pickerFilter === "num" && !"一二三四五六七八九十".includes(item.char)) return false;
            if (pickerFilter === "low" && item.strokes > 5) return false;
          } else {
            if (pickerFilter === "1-2" && (item.strokes < 1 || item.strokes > 2)) return false;
            if (pickerFilter === "3-4" && (item.strokes < 3 || item.strokes > 4)) return false;
            if (pickerFilter === "5-6" && (item.strokes < 5 || item.strokes > 6)) return false;
            if (pickerFilter === "7-9" && (item.strokes < 7 || item.strokes > 9)) return false;
            if (pickerFilter === "10-17" && (item.strokes < 10 || item.strokes > 17)) return false;
          }
          if (!qNorm && !qPyNorm) return true;
          const variantsStr = Array.isArray(item.variants) ? item.variants.join(" ") : "";
          const hayRaw = [item.num || "", item.char, variantsStr, item.pinyin, item.hv, item.meaning, item.nameVi || ""].join(" ");
          if (window.S4SearchEngine && typeof window.S4SearchEngine.normalize === "function") {
            const hayNorm = window.S4SearchEngine.normalize(hayRaw);
            const hayPy = window.S4SearchEngine.normalizePinyin(item.pinyin || "");
            return hayNorm.includes(qNorm) || (qPyNorm && hayPy.includes(qPyNorm));
          }
          return hayRaw.toLowerCase().includes(qNorm);
        });
      }

      window.stepPickerChar = function (delta) {
        const list = getFilteredPickerItems();
        if (!list.length) return;
        const curIdx = list.findIndex(function (x) { return selectedItem && x.char === selectedItem.char; });
        const nextIdx = curIdx < 0 ? 0 : (curIdx + delta + list.length) % list.length;
        const nextItem = list[nextIdx];
        if (nextItem) selectPracticeItem(pickerMode, nextItem.char);
      };

      window.advanceNextPickerChar = function () {
        window.stepPickerChar(1);
      };

      window.clearWordCtx = function () {
        wordCtx = null;
        renderWordStrip();
      };

      window.loadCustomWord = function (rawWord, py, vi, from) {
        const chars = String(rawWord || "").match(/[\u4e00-\u9fff\u3400-\u4dbf\u2e80-\u2eff]/g) || [];
        if (!chars.length) {
          setHwStatus(`${wIcon("alert", 14)} Vui lòng nhập ít nhất 1 chữ Hán (VD: 你好, 学习, 谢谢).`, "bad");
          return;
        }
        wordCtx = {
          word: chars.join(""),
          chars: chars,
          activeIdx: 0,
          py: py || "",
          vi: vi || "",
          from: from || ""
        };
        if (writeMode === "free") writeMode = "quiz";
        selectWordChar(0);
      };

      window.practiceCustomWord = function () {
        const inp = document.getElementById("customCharInput");
        if (!inp) return;
        loadCustomWord(inp.value, "", "", "");
      };

      window.toggleTargetTip = function () {
        showTargetTip = !showTargetTip;
        renderTargetInfo();
      };

      function renderTargetInfo() {
        if (!selectedItem) return;
        document.getElementById("ghostChar").textContent = selectedItem.char;
        const bucket = selectedType === "radicals" ? doneState.radicals : doneState.chars;
        const isDone = Boolean(bucket[selectedItem.char]);
        ["btnMarkTarget", "btnMarkTargetFree"].forEach(function (bid) {
          const markBtn = document.getElementById(bid);
          if (!markBtn) return;
          markBtn.classList.toggle("done-on", isDone);
          markBtn.innerHTML = (isDone ? wIcon("check", 13) : wIcon("circle", 13)) + " " + (isDone ? "Đã tập" : "Đánh dấu");
        });

        const box = document.getElementById("targetInfoBox");
        if (selectedType === "radicals") {
          const exHtml = (selectedItem.examples || []).map(function (ex) {
            return `<button class="ex-chip lp-chip-inline" onclick="speakEx('${escJsAttr(ex)}')">${wIcon("volume", 12)} ${esc(ex)}</button>`;
          }).join("");
          const numBadge = selectedItem.num ? `Bộ #${esc(selectedItem.num)} • ` : "";
          const variantsList = Array.isArray(selectedItem.variants) ? selectedItem.variants.filter(Boolean) : [];
          const variantsHtml = variantsList.length
            ? `<div class="char-tip" style="margin-top:6px;"><b>Dạng ghép:</b> ${variantsList.map(function (v) { return `<span class="variant-pill">${esc(v)}</span>`; }).join(" ")}</div>`
            : "";
          box.innerHTML = `
            <div class="char-head">
              <div class="char-big">${esc(selectedItem.char)}</div>
              <div class="char-meta">
                <h3>${numBadge}${esc(selectedItem.nameVi)}${selectedItem.hv ? ` • [${esc(selectedItem.hv)}]` : ""}</h3>
                <div class="sub">Pinyin: <b>${esc(selectedItem.pinyin)}</b> • ${selectedItem.strokes} nét</div>
              </div>
            </div>
            ${variantsHtml}
            <p class="char-tip"><b>Ý nghĩa:</b> ${esc(selectedItem.meaning)}</p>
            <div class="ex-chips">${exHtml}</div>
          `;
        } else {
          const titleLine = selectedItem.pinyin
            ? `${esc(selectedItem.pinyin)}${selectedItem.hv ? " • Hán-Việt: " + esc(selectedItem.hv) : ""}`
            : `Chữ Hán tự chọn: ${esc(selectedItem.char)}`;
          const metaParts = [];
          if (selectedItem.meaning) metaParts.push(`Nghĩa: <b>${esc(selectedItem.meaning)}</b>`);
          if (selectedItem.radical) metaParts.push(`Bộ: ${esc(selectedItem.radical)}`);
          if (selectedItem.strokes) metaParts.push(`${selectedItem.strokes} nét`);
          const tipText = selectedItem.tip || "Bấm Bút thuận hoặc Gợi ý nét để xem thứ tự viết chuẩn.";
          box.innerHTML = `
            <div class="char-head">
              <div class="char-big">${esc(selectedItem.char)}</div>
              <div class="char-meta">
                <h3>${titleLine}</h3>
                <div class="sub">${metaParts.join(" • ")}</div>
              </div>
            </div>
            <button type="button" class="tool-btn ${showTargetTip ? "on" : ""}" style="margin-top:4px;" onclick="toggleTargetTip()">${wIcon("lightbulb", 13)} ${showTargetTip ? "Ẩn mẹo nhớ nét" : "Mẹo nhớ nét"}</button>
            ${showTargetTip ? `<p class="char-tip">${esc(tipText)}</p>` : ""}
          `;
        }
      }

      window.setPickerMode = function (mode) {
        pickerMode = mode;
        pickerFilter = "all";
        document.getElementById("modeCharsBtn").classList.toggle("active", mode === "chars");
        document.getElementById("modeRadicalsBtn").classList.toggle("active", mode === "radicals");
        renderPickerFilters();
        renderPicker();
      };

      window.setPickerFilter = function (f) {
        pickerFilter = f;
        renderPickerFilters();
        renderPicker();
      };

      function renderPickerFilters() {
        const el = document.getElementById("pickerFilters");
        const opts = pickerMode === "chars"
          ? [["all", "Tất cả (" + DATA.practiceChars.length + ")"], ["todo", "Chưa tập"], ["num", "Số đếm (1–10)"], ["low", "Ít nét (≤5)"]]
          : [["all", "Tất cả (" + DATA.radicals.length + ")"], ["1-2", "1–2 nét"], ["3-4", "3–4 nét"], ["5-6", "5–6 nét"], ["7-9", "7–9 nét"], ["10-17", "10–17 nét"]];
        el.innerHTML = opts.map(function (pair) {
          return `<button class="f-chip ${pickerFilter === pair[0] ? "active" : ""}" onclick="setPickerFilter('${pair[0]}')">${pair[1]}</button>`;
        }).join("");
      }

      window.selectPracticeItem = function (type, ch) {
        const list = type === "radicals" ? DATA.radicals : DATA.practiceChars;
        const found = list.find(function (x) { return x.char === ch; });
        if (!found) return;
        wordCtx = null;
        selectedType = type;
        selectedItem = found;
        strokes = [];
        redrawStrokes();
        renderWordStrip();
        renderTargetInfo();
        renderPicker();
        mountHanziWriter();
      };

      window.renderPicker = function () {
        const grid = document.getElementById("pickerGrid");
        const bucket = pickerMode === "radicals" ? doneState.radicals : doneState.chars;
        const filtered = getFilteredPickerItems();

        if (!filtered.length) {
          grid.innerHTML = `<div style="grid-column:1/-1;color:var(--muted);font-size:13px;padding:16px;text-align:center;">Không tìm thấy chữ/bộ thủ phù hợp.</div>`;
          return;
        }

        grid.innerHTML = filtered.map(function (item) {
          const isAct = selectedType === pickerMode && selectedItem && selectedItem.char === item.char;
          const isDone = Boolean(bucket[item.char]);
          const radNumBadge = (pickerMode === "radicals" && item.num) ? `<span class="rad-num">#${esc(item.num)}</span>` : "";
          return `
            <button class="c-tile ${isAct ? "active" : ""}" onclick="selectPracticeItem('${escJsAttr(pickerMode)}', '${escJsAttr(item.char)}')" title="${esc(item.meaning)}">
              ${radNumBadge}
              ${isDone ? `<span class="done-dot">${wIcon("check", 10)}</span>` : ""}
              <span class="hz">${esc(item.char)}</span>
              <span class="py">${esc(item.pinyin)}</span>
            </button>
          `;
        }).join("");
      };

      // ==========================================================
      // TAB 2: LUYỆN VIẾT HSK 3-4 (3 CHẾ ĐỘ CON)
      // ==========================================================
      let tab2SubMode = "reorder"; // "reorder" | "pinyinWrite" | "makeSentence"
      let reorderFilter = "all"; // "all" | "3" | "4"
      let activeReorderIdx = 0;
      let reorderPickedIndices = []; // array of token indices in task.words
      let reorderCheckedResult = null; // null | { ok: bool, userStr: string }
      let reorderShowHint = false;

      let activePwIdx = 0;
      let pwCheckedResult = null; // null | { ok: bool, userAns: string }
      let pwShowHint = false;

      let activeMsIdx = 0;
      let msCheckedResult = null; // null | { ok: bool, hasKw: bool, hasLen: bool, hasPunct: bool, hanziLen: number }
      let msShowSamples = false;

      window.setTab2SubMode = function (mode) {
        tab2SubMode = mode;
        renderReorderTab();
      };

      window.returnToPinyinWrite = function () {
        tab2SubMode = "pinyinWrite";
        window.switchMainTab("reorder");
      };

      function getFilteredReorders() {
        return DATA.reorderTasks.filter(function (t) {
          if (reorderFilter === "3") return t.level === 3;
          if (reorderFilter === "4") return t.level === 4;
          return true;
        });
      }

      window.setReorderFilter = function (lv) {
        reorderFilter = lv;
        activeReorderIdx = 0;
        reorderPickedIndices = [];
        reorderCheckedResult = null;
        reorderShowHint = false;
        renderReorderTab();
      };

      window.selectReorderTask = function (idx) {
        activeReorderIdx = idx;
        reorderPickedIndices = [];
        reorderCheckedResult = null;
        reorderShowHint = false;
        renderReorderTab();
      };

      window.pickWordToken = function (tokIdx) {
        if (reorderPickedIndices.includes(tokIdx)) return;
        reorderPickedIndices.push(tokIdx);
        reorderCheckedResult = null;
        renderReorderTab();
      };

      window.unpickWordToken = function (slotPos) {
        reorderPickedIndices.splice(slotPos, 1);
        reorderCheckedResult = null;
        renderReorderTab();
      };

      window.resetReorderTask = function () {
        reorderPickedIndices = [];
        reorderCheckedResult = null;
        renderReorderTab();
      };

      window.toggleReorderHint = function () {
        reorderShowHint = !reorderShowHint;
        renderReorderTab();
      };

      window.checkReorderAnswer = function () {
        const list = getFilteredReorders();
        const task = list[activeReorderIdx];
        if (!task) return;
        const userStr = reorderPickedIndices.map(function (i) { return task.words[i]; }).join("");
        const norm = function (s) { return String(s || "").replace(/[。？！，、,.?!\s]/g, ""); };
        const ok = norm(userStr) === norm(task.answer);
        reorderCheckedResult = { ok: ok, userStr: userStr };
        if (ok) {
          doneState.reorder[task.id] = true;
          saveDone();
        }
        renderReorderTab();
      };

      window.speakReorderSample = function () {
        const list = getFilteredReorders();
        const task = list[activeReorderIdx];
        if (task) speak(task.answer, 0.92);
      };

      // --- Submode 2: HSK 3 Pinyin -> Hanzi ---
      window.selectPwTask = function (idx) {
        activePwIdx = idx;
        pwCheckedResult = null;
        pwShowHint = false;
        renderReorderTab();
      };

      window.onPwInput = function () {
        const list = DATA.pinyinWriteTasks;
        const task = list[activePwIdx];
        const inp = document.getElementById("pwAnswerInput");
        if (!task || !inp) return;
        saveDraft("pw_" + task.id, inp.value);
      };

      window.togglePwHint = function () {
        pwShowHint = !pwShowHint;
        renderReorderTab();
      };

      window.checkPwAnswer = function () {
        const list = DATA.pinyinWriteTasks;
        const task = list[activePwIdx];
        if (!task) return;
        const inp = document.getElementById("pwAnswerInput");
        const rawVal = inp ? inp.value : (drafts["pw_" + task.id] || "");
        saveDraft("pw_" + task.id, rawVal, true);
        const clean = function (s) { return String(s || "").replace(/[\s，。？！,.?!]/g, "").trim(); };
        const ok = clean(rawVal) !== "" && clean(rawVal) === clean(task.answer);
        pwCheckedResult = { ok: ok, userAns: rawVal.trim() };
        if (ok) {
          doneState.pinyinWrite[task.id] = true;
          saveDone();
          speak(task.fullZh || task.answer, 0.92, task.fullPy ? { pinyin: task.fullPy } : null);
        }
        renderReorderTab();
      };

      window.speakPwFull = function () {
        const task = DATA.pinyinWriteTasks[activePwIdx];
        if (task) speak(task.fullZh || task.answer, 0.9, task.fullPy ? { pinyin: task.fullPy } : null);
      };

      window.practicePwOnCanvas = function () {
        const task = DATA.pinyinWriteTasks[activePwIdx];
        if (!task) return;
        window.switchMainTab("canvas");
        window.loadCustomWord(task.answer, task.answerPy || task.targetPy, task.vi, "pinyinWrite");
      };

      // --- Submode 3: HSK 4 Make Sentence ---
      window.selectMsTask = function (idx) {
        activeMsIdx = idx;
        msCheckedResult = null;
        msShowSamples = false;
        renderReorderTab();
      };

      window.onMsInput = function () {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        const area = document.getElementById("msAnswerInput");
        if (!task || !area) return;
        saveDraft("ms_" + task.id, area.value);
      };

      window.toggleMsSamples = function () {
        msShowSamples = !msShowSamples;
        renderReorderTab();
      };

      window.checkMsSentence = function () {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        if (!task) return;
        const area = document.getElementById("msAnswerInput");
        const val = area ? area.value : (drafts["ms_" + task.id] || "");
        saveDraft("ms_" + task.id, val, true);
        const trimmed = val.trim();
        const noSpace = trimmed.replace(/\s+/g, "");
        const hasKw = Boolean(task.keyword) && noSpace.includes(String(task.keyword).replace(/\s+/g, ""));
        const hanziLen = countHanzi(trimmed);
        const hasLen = hanziLen >= 5;
        const hasPunct = /[。？！.?!]$/.test(trimmed);
        const ok = hasKw && hasLen && hasPunct;
        msCheckedResult = { ok: ok, hasKw: hasKw, hasLen: hasLen, hasPunct: hasPunct, hanziLen: hanziLen };
        if (ok) {
          doneState.makeSentence[task.id] = true;
          saveDone();
        }
        renderReorderTab();
      };

      window.clearMsDraft = function () {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        if (!task) return;
        saveDraft("ms_" + task.id, "", true);
        msCheckedResult = null;
        renderReorderTab();
      };

      window.speakMsDraft = function () {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        if (!task) return;
        const area = document.getElementById("msAnswerInput");
        const txt = (area ? area.value : (drafts["ms_" + task.id] || "")).trim();
        if (txt) speak(txt, 0.92);
      };

      window.speakMsSample = function (idx) {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        const samp = task && Array.isArray(task.samples) ? task.samples[idx] : null;
        if (samp) speak(samp.zh, 0.92, samp.py ? { pinyin: samp.py } : null);
      };

      window.speakMsKeyword = function () {
        const task = DATA.makeSentenceTasks[activeMsIdx];
        if (task) speak(task.keyword, 0.88, task.keywordPy ? { pinyin: task.keywordPy } : null);
      };

      function renderReorderTab() {
        const container = document.getElementById("tab-reorder");
        const subModesHtml = `
          <div class="tab2-submodes">
            <button class="submode-btn ${tab2SubMode === "reorder" ? "active" : ""}" onclick="setTab2SubMode('reorder')">1. Sắp xếp câu (${DATA.reorderTasks.length})</button>
            <button class="submode-btn ${tab2SubMode === "pinyinWrite" ? "active" : ""}" onclick="setTab2SubMode('pinyinWrite')">2. HSK 3 • Nhìn Pinyin viết chữ (${DATA.pinyinWriteTasks.length})</button>
            <button class="submode-btn ${tab2SubMode === "makeSentence" ? "active" : ""}" onclick="setTab2SubMode('makeSentence')">3. HSK 4 • Đặt câu với từ gợi ý (${DATA.makeSentenceTasks.length})</button>
          </div>
        `;

        if (tab2SubMode === "pinyinWrite") {
          const list = DATA.pinyinWriteTasks;
          if (!list.length) {
            container.innerHTML = subModesHtml + "<p style='color:var(--muted);'>Đang nạp dữ liệu HSK 3 Nhìn Pinyin viết chữ…</p>";

      let timerTotalSec = 15 * 60;

      let timerInterval = null;

      function stopTimer() {
        timerRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function formatClock(sec) {
        const s = Math.max(0, Math.floor(sec));
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return mm + ":" + ss;
      }

      window.setTimerPreset = function (mins) {
        stopTimer();
        timerTotalSec = mins * 60;
        timerLeftSec = mins * 60;
        updateTimerDom();
      };

      window.toggleTimerRun = function () {
        if (timerRunning) {
          stopTimer();
        } else {
          if (timerLeftSec <= 0) timerLeftSec = timerTotalSec;
          timerRunning = true;
          timerInterval = setInterval(function () {
            if (timerLeftSec > 0) {
              timerLeftSec--;
              updateTimerDom();
            } else {
              stopTimer();
              updateTimerDom();
            }
          }, 1000);
        }
        updateTimerDom();
      };

      window.resetTimer = function () {
        stopTimer();
        timerLeftSec = timerTotalSec;
        updateTimerDom();
      };

      function updateTimerDom() {
        const clk = document.getElementById("timerClock");
        const btn = document.getElementById("timerStartBtn");
        if (clk) clk.textContent = formatClock(timerLeftSec);
        if (btn) btn.textContent = timerRunning ? "⏸️ Tạm dừng" : (timerLeftSec === 0 ? "⏰ Hết giờ!" : "▶️ Bắt đầu");

          renderEssayTab();
        }

      function countHanzi(text) {
        const m = String(text || "").match(/[\u4e00-\u9fff\u3400-\u4dbf\u2e80-\u2eff]/g);
        return m ? m.length : 0;
      }

      window.clearEssayDraft = async function () {
        let ok = false;

            title: "Xóa bản nháp bài viết",
            tone: "danger",
            confirmText: "Xóa nháp",
            cancelText: "Giữ lại"
          });
        } else {
          ok = window.confirm("Xóa nội dung đang gõ của đề này?");
        }
        if (!ok) return;
        const area = document.getElementById("essayInput");
        if (area) area.value = "";
        saveDraft(activeEssayId, "", true);
        updateEssayStats("");
      };

      function updateEssayStats(val) {
        const p = DATA.essayPrompts.find(function (x) { return x.id === activeEssayId; });
        if (!p) return;
        const hanziCount = countHanzi(val);
        const noSpaceCount = String(val || "").replace(/\s+/g, "").length;
        const target = p.targetChars || 80;
        const pct = Math.min(100, Math.round((hanziCount / target) * 100));
        const isSweet = hanziCount >= Math.round(target * 0.8) && hanziCount <= Math.round(target * 1.35);

        const lbl = document.getElementById("hanziCountLabel");
        const fill = document.getElementById("hanziProgFill");
        if (lbl) {
          lbl.innerHTML = `Số chữ Hán: <b>${hanziCount}</b> / ~${target} chữ <span style="color:var(--muted);">(Tổng ký tự kể cả dấu câu: ${noSpaceCount})</span>`;
        }
        if (fill) {
          fill.style.width = pct + "%";
          fill.classList.toggle("sweet", isSweet);
        }

        const badgeWords = (Array.isArray(p.keywords) && p.keywords.length)
          ? p.keywords
          : (Array.isArray(p.suggestedWords) ? p.suggestedWords : []);
        if (badgeWords.length) {
          document.querySelectorAll(".kw-badge[data-kw]").forEach(function (el) {
            const kw = el.getAttribute("data-kw");
            el.classList.toggle("used", val.includes(kw));
          });
        }
      }
