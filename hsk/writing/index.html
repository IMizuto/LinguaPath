        const container = document.getElementById("tab-essay");
        const list = getFilteredEssays();
        const p = DATA.essayPrompts.find(function (x) { return x.id === activeEssayId; }) || list[0];
        if (!p) {
          container.innerHTML = "<p>Chưa có đề viết.</p>";
          return;
        }
        activeEssayId = p.id;
        const currentDraft = drafts[p.id] || "";
        const isDone = Boolean(doneState.essays[p.id]);
        const n5 = DATA.essayPrompts.filter(function (x) { return x.level === 5; }).length;
        const n6 = DATA.essayPrompts.filter(function (x) { return x.level === 6; }).length;

        const filterHtml = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="mode-pill ${essayFilter === "all" ? "active" : ""}" onclick="setEssayFilter('all')">Tất cả (${DATA.essayPrompts.length})</button>
              <button class="mode-pill ${essayFilter === "5" ? "active" : ""}" onclick="setEssayFilter('5')">HSK 5 • ~80 chữ (${n5})</button>
              <button class="mode-pill ${essayFilter === "6" ? "active" : ""}" onclick="setEssayFilter('6')">HSK 6 • ~400 chữ (${n6})</button>
            </div>
            <button class="tool-btn ${isDone ? "done-on" : ""}" onclick="toggleEssayDone('${escJsAttr(p.id)}')">
              ${isDone ? wIcon("check", 13) : wIcon("circle", 13)} ${isDone ? "Đã hoàn thành đề này" : "Đánh dấu hoàn thành"}
            </button>
          </div>
        `;

        const pillsHtml = `
          <div class="prompt-pills">
            ${list.map(function (item, idx) {
              const d = Boolean(doneState.essays[item.id]);
              return `<button class="p-pill ${item.id === p.id ? "active" : ""} ${d ? "done" : ""}" onclick="selectEssayPrompt('${escJsAttr(item.id)}')">${d ? wIcon("check", 11) + " " : ""}HSK ${item.level} • #${idx + 1}</button>`;
            }).join("")}
          </div>
        `;

        let kwOrSourceHtml = "";
        const wordBadges = (Array.isArray(p.keywords) && p.keywords.length)
          ? p.keywords
          : (Array.isArray(p.suggestedWords) ? p.suggestedWords : []);
        if (p.type === "picture_scene" || p.sceneDesc || wordBadges.length) {
          const sceneHtml = p.sceneDesc
            ? `<div class="scene-box"><b class="lp-chip-inline">${wIcon("image", 14)} Bối cảnh / Tranh minh họa:</b><div style="margin-top:5px;line-height:1.65;">${esc(p.sceneDesc)}</div></div>`
            : "";
          const badgesHtml = wordBadges.length ? `
            <div class="kw-list">
              ${wordBadges.map(function (k) {
                const used = currentDraft.includes(k.zh);
                return `
                  <span class="kw-badge ${used ? "used" : ""}" data-kw="${esc(k.zh)}" onclick="speakEssayText('${escJsAttr(k.zh)}')" title="Bấm để nghe phát âm">
                    <span class="kw-zh">${esc(k.zh)}</span>
                    <span>(${esc(k.py)} — ${esc(k.vi)})</span>
                  </span>
                `;
              }).join("")}
            </div>
          ` : "";
          kwOrSourceHtml = sceneHtml + badgesHtml;
        } else if (p.sourceText) {
          kwOrSourceHtml = `
            <div style="margin:10px 0;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
                <button class="tool-btn ${showSourceText ? "on" : ""}" onclick="toggleSourceText()">${wIcon("book", 13)} Bài văn gốc (~${countHanzi(p.sourceText)} chữ): ${showSourceText ? "Hiện" : "Ẩn"}</button>
                <button class="tool-btn" id="btnSpeakSource">${wIcon("volume", 13)} Nghe bài gốc</button>
              </div>
              ${showSourceText ? `<div class="source-box">${esc(p.sourceText)}</div>` : ""}
            </div>
          `;
        }

        const timerHtml = `
          <div class="timer-bar">
            <span class="lp-chip-inline" style="font-size:13px;font-weight:700;">${wIcon("clock", 14)} Đồng hồ:</span>
            <span class="timer-clock" id="timerClock">${formatClock(timerLeftSec)}</span>
            <button class="tool-btn on" id="timerStartBtn" onclick="toggleTimerRun()">${timerRunning ? `${wIcon("pause", 13)} Tạm dừng` : `${wIcon("play", 13)} Bắt đầu`}</button>
            <button class="tool-btn" onclick="resetTimer()">${wIcon("refresh", 13)} Đặt lại</button>
            <button class="size-btn" onclick="setTimerPreset(15)">15p</button>
            <button class="size-btn" onclick="setTimerPreset(10)">10p</button>
            <button class="size-btn" onclick="setTimerPreset(35)">35p</button>
            <button class="size-btn" onclick="setTimerPreset(45)">45p</button>
          </div>
        `;

        const outlineHtml = showOutline ? `
          <div class="info-collapse">
            <b>Gợi ý dàn ý:</b>
            <ul style="margin:6px 0 0;padding-left:20px;">
              ${(p.outline || []).map(function (line) { return `<li>${esc(line)}</li>`; }).join("")}
            </ul>
          </div>
        ` : "";

        const sampleHtml = showSample ? `
          <div class="info-collapse">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
              <b>Bài mẫu tham khảo (~${countHanzi(p.sampleZh)} chữ Hán):</b>
              <button class="tool-btn" id="btnSpeakSample">${wIcon("volume", 13)} Nghe bài mẫu</button>
            </div>
            <div style="font-size:15.5px;line-height:1.75;white-space:pre-line;">${esc(p.sampleZh)}</div>
            <div style="margin-top:8px;color:var(--muted);font-size:13.5px;white-space:pre-line;"><b>Dịch nghĩa:</b> ${esc(p.sampleVi)}</div>
          </div>
        ` : "";

        container.innerHTML = filterHtml + pillsHtml + `
          <h2 style="margin:4px 0 6px;font-size:18px;">${esc(p.title)}</h2>
          <p style="margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.55;">${esc(p.instruction)}</p>
          ${kwOrSourceHtml}
          ${timerHtml}
          <textarea id="essayInput" class="essay-area" placeholder="Nhập bài viết tiếng Trung của bạn tại đây (tự động lưu bản nháp)..." oninput="onEssayInput()">${esc(currentDraft)}</textarea>
          <div class="counter-row">
            <span id="hanziCountLabel"></span>
            <div class="prog-track"><div class="prog-fill" id="hanziProgFill" style="width:0%"></div></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="tool-btn ${showOutline ? "on" : ""}" onclick="toggleEssayOutline()">${wIcon("lightbulb", 13)} Gợi ý dàn ý</button>
            <button class="tool-btn ${showSample ? "on" : ""}" onclick="toggleEssaySample()">${wIcon("file", 13)} Bài mẫu tham khảo</button>
            <button class="tool-btn danger" onclick="clearEssayDraft()">${wIcon("trash", 13)} Xóa nháp</button>
          </div>
          ${outlineHtml}
          ${sampleHtml}
        `;

        const btnSrc = document.getElementById("btnSpeakSource");
        if (btnSrc && p.sourceText) btnSrc.onclick = function () { speak(p.sourceText, 0.92); };
        const btnSamp = document.getElementById("btnSpeakSample");
        if (btnSamp && p.sampleZh) btnSamp.onclick = function () { speak(p.sampleZh, 0.92); };

        updateEssayStats(currentDraft);
      }

      // ---------- INIT ----------
      let resizeTimer = null;
      window.addEventListener("resize", function () {
        const box = document.getElementById("miBox");
        if (!box) return;
        if (writeMode === "free") {
          const rect = box.getBoundingClientRect();
          const rw = Math.round(rect.width);
          const rh = Math.round(rect.height);
          if (rw > 0 && rh > 0 && (Math.abs(rw - freeLastBoxWidth) >= 4 || Math.abs(rh - freeLastBoxHeight) >= 4)) {
            resizeCanvas();
          }
        } else {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            if (activeMainTab !== "canvas") return;
            const curBox = document.getElementById("miBox");
            const nextSz = Math.max(220, Math.round((curBox && curBox.clientWidth) ? curBox.clientWidth - 4 : 300));
            if (Math.abs(nextSz - hwLastBoxWidth) >= 8) {
              mountHanziWriter();
            }
          }, 220);
        }
      });
      // Redraw auto ink or remount HanziWriter when dark/light mode changes
      new MutationObserver(function () {
        redrawStrokes();
        const nowDark = document.documentElement.classList.contains("dark");
        if (nowDark !== hwLastDark) {
          hwLastDark = nowDark;
          if (activeMainTab === "canvas" && writeMode !== "free") mountHanziWriter();
        }
      }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

      renderProgressSummary();
      renderPickerFilters();
      renderPicker();

      // Wire Smart Back, Theme Toggle & Keyboard shortcuts (ArrowLeft / ArrowRight)
      (function initWritingChromeAndKeys() {
        const darkBtn = document.getElementById("btnDarkWriting");
        if (darkBtn) {
          darkBtn.addEventListener("click", window.toggleWritingDark);
          const isDarkNow = document.documentElement.classList.contains("dark");
          if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
            window.S4UI.renderThemeButton(darkBtn, isDarkNow);
          }
        }
        if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
          window.S4UI.initSmartBackButton({
            element: "#lpBackBtn",
            defaultUrl: "../index.html",
            defaultLabel: "HSK",
            roadmapUrl: "../roadmap/index.html",
            roadmapLabel: "Lộ trình HSK"
          });
        }
        document.addEventListener("keydown", function (e) {
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
          if (tag === "input" || tag === "textarea" || tag === "select" || (e.target && e.target.isContentEditable)) return;
          const delta = e.key === "ArrowLeft" ? -1 : (e.key === "ArrowRight" ? 1 : 0);
          if (!delta) return;
          e.preventDefault();
          if (activeMainTab === "canvas") {
            if (wordCtx && wordCtx.chars.length > 1) {
              const nextWordIdx = Math.max(0, Math.min(wordCtx.chars.length - 1, wordCtx.activeIdx + delta));
              if (nextWordIdx !== wordCtx.activeIdx) window.selectWordChar(nextWordIdx);
            } else {
              window.stepPickerChar(delta);
            }
          } else if (activeMainTab === "reorder") {
            if (tab2SubMode === "pinyinWrite") {
              const list = DATA.pinyinWriteTasks || [];
              const nextIdx = Math.max(0, Math.min(list.length - 1, activePwIdx + delta));
              if (nextIdx !== activePwIdx) window.selectPwTask(nextIdx);
            } else if (tab2SubMode === "makeSentence") {
              const list = DATA.makeSentenceTasks || [];
              const nextIdx = Math.max(0, Math.min(list.length - 1, activeMsIdx + delta));
              if (nextIdx !== activeMsIdx) window.selectMsTask(nextIdx);
            } else {
              const list = getFilteredReorders();
              const nextIdx = Math.max(0, Math.min(list.length - 1, activeReorderIdx + delta));
              if (nextIdx !== activeReorderIdx) window.selectReorderTask(nextIdx);
            }
          } else if (activeMainTab === "essay") {
            const list = getFilteredEssays();
            if (!list.length) return;
            const curIdx = list.findIndex(function (x) { return x.id === activeEssayId; });
            const nextIdx = Math.max(0, Math.min(list.length - 1, (curIdx < 0 ? 0 : curIdx) + delta));
            if (list[nextIdx] && list[nextIdx].id !== activeEssayId) window.selectEssayPrompt(list[nextIdx].id);
          }
        });
      })();

      // Support ?char=, ?py=, ?vi=, ?tab=canvas|radicals|reorder|pinyin|sentence|essay, ?level=1..6
      (function bootFromUrl() {
        try {
          const sp = new URLSearchParams(window.location.search);
          const qChar = (sp.get("char") || "").trim();
          const qPy = (sp.get("py") || "").trim();
          const qVi = (sp.get("vi") || "").trim();
          const qFrom = (sp.get("from") || "").trim();
          const qMode = (sp.get("mode") || "").trim();
          const qTab = (sp.get("tab") || "").trim().toLowerCase();
          const qLevel = Number(sp.get("level") || 0);
          if (qMode === "animate" || qMode === "free" || qMode === "quiz") writeMode = qMode;
          if (qChar && /[\u4e00-\u9fff\u3400-\u4dbf\u2e80-\u2eff]/.test(qChar)) {
            const inp = document.getElementById("customCharInput");
            if (inp) inp.value = qChar;
            loadCustomWord(qChar, qPy, qVi, qFrom);
            return;
          }
          if (qTab === "radicals") {
            window.setPickerMode("radicals");
            window.switchMainTab("canvas");
            return;
          }
          if (qTab === "canvas") {
            window.setPickerMode("chars");
            window.switchMainTab("canvas");
            return;
          }
          if (qTab === "pinyin" || qTab === "pinyinwrite") {
            tab2SubMode = "pinyinWrite";
            window.switchMainTab("reorder");
            return;
          }
          if (qTab === "sentence" || qTab === "makesentence") {
            tab2SubMode = "makeSentence";
            window.switchMainTab("reorder");
            return;
          }
          if (qTab === "reorder") {
            if (qLevel === 3 || qLevel === 4) reorderFilter = String(qLevel);
            tab2SubMode = "reorder";
            window.switchMainTab("reorder");
            return;
          }
          if (qTab === "essay") {
            if (qLevel === 5 || qLevel === 6) essayFilter = String(qLevel);
            window.switchMainTab("essay");
            return;
          }
          if (qLevel === 1 || qLevel === 2) {
            window.setPickerMode("chars");
            window.switchMainTab("canvas");
            return;
          }
          if (qLevel === 3 || qLevel === 4) {
            reorderFilter = String(qLevel);
            tab2SubMode = "reorder";
            window.switchMainTab("reorder");
            return;
          }
          if (qLevel === 5 || qLevel === 6) {
            essayFilter = String(qLevel);
            window.switchMainTab("essay");
            return;
          }
        } catch (e) {}
        renderTargetInfo();
        setTimeout(mountHanziWriter, 30);
      })();
    })();
  </script>
  <script src="../../auth.js?v=33"></script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
