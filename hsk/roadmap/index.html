<!DOCTYPE html>
<html lang="vi" data-glass-tier="portal" data-course="hsk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaThemeColor" content="#0d1813">
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinguaPath">

  <title>Lộ Trình Học HSK 1–6 &amp; HSKK — LinguaPath</title>

  <link rel="stylesheet" href="../../assets/s4-ui.css?v=71">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../assets/ghibli/ghibli-theme.css?v=32">

  <!-- Sử dụng trực tiếp bộ token --lg-* tầng portal & tông nhấn HSK từ s4-ui.css (Clear Liquid Glass) -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      @view-transition { navigation: auto; }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      min-height: 100vh;
      background: transparent !important;
      color: var(--lg-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html.theme-ghibli, html.theme-ghibli body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    .rm-glass {
      background: var(--lg-surface);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-hairline);
      text-shadow: var(--lg-text-halo);
      box-shadow:
        inset 0 1.5px 0 var(--lg-rim-top),
        inset 1px 0 0 var(--lg-rim-side),
        inset 0 -1px 0 var(--lg-rim-bot),
        var(--lg-shadow);
    }
    .rm-cta-btn, .rm-pill.active, .rm-badge.status-done {
      text-shadow: none;
    }

    .rm-shell {
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      padding:
        calc(10px + var(--s4-safe-top, 0px))
        calc(14px + env(safe-area-inset-right, 0px))
        calc(88px + env(safe-area-inset-bottom, 0px))
        calc(14px + env(safe-area-inset-left, 0px));
    }

    /* 1. Floating Liquid Glass Topbar 1 hàng duy nhất */
    .rm-topbar {
      position: sticky;
      top: calc(8px + var(--s4-safe-top, 0px));
      z-index: 40;
      border-radius: 22px;
      padding: 8px 10px;
      margin-bottom: 14px;
      background: var(--lg-surface-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rm-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .rm-back-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-hairline);
      color: var(--lg-ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.16s ease, transform 0.15s ease;
    }
    .rm-back-pill:hover { background: var(--lg-wash-hover); }
    .rm-back-pill:active { transform: scale(0.97); }

    .rm-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .rm-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      flex-shrink: 0;
    }
    .rm-brand-text { min-width: 0; }
    .rm-brand-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--lg-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-brand-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--lg-ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rm-top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .rm-icon-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      text-shadow: none;
      transition: background 0.16s ease, transform 0.15s ease;
    }
    .rm-icon-btn:hover { background: var(--lg-wash-hover); }
    .rm-icon-btn:active { transform: scale(0.96); }
    .rm-icon-btn.donate {
      background: var(--lg-rose-soft);
      color: var(--lg-rose);
      border-color: rgba(225, 29, 72, 0.24);
    }

    /* 2. Dải tổng quan 3 cột liền khối */
    .rm-summary-strip {
      border-radius: 22px;
      padding: 12px 8px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
    }
    .rm-sum-cell {
      padding: 4px 10px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      position: relative;
      border-radius: 14px;
      transition: background 0.16s ease;
    }
    .rm-sum-cell + .rm-sum-cell::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16%;
      bottom: 16%;
      width: 1px;
      background: var(--lg-divider);
    }
    .rm-sum-cell.clickable:hover { background: var(--lg-wash); }
    .rm-sum-num {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--lg-accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-sum-num.is-stage { color: var(--lg-green); }
    .rm-sum-num.is-due { color: var(--lg-rose); }
    .rm-sum-lbl {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--lg-ink-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3. Panel kính chính & Segmented Pill Control */
    .rm-panel {
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .rm-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .rm-panel-title {
      margin: 0;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--lg-ink);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .rm-panel-title svg { color: var(--lg-accent); flex-shrink: 0; }
    .rm-ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-hairline);
      color: var(--lg-ink-sub);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .rm-ghost-btn:hover { background: var(--lg-wash-hover); color: var(--lg-ink); }

    .rm-seg-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
    }
    .rm-seg-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--lg-ink-muted);
      margin-bottom: 6px;
    }
    .rm-seg-track {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 15px;
      background: var(--lg-seg-track);
    }
    .rm-seg-btn {
      flex: 1 1 0;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--lg-ink-sub);
      border-radius: 11px;
      padding: 7px 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-shadow: none;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .rm-seg-btn small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--lg-ink-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rm-seg-btn:hover { color: var(--lg-ink); }
    .rm-seg-btn.active {
      background: var(--lg-seg-active);
      color: var(--lg-accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .rm-seg-btn.active small { color: var(--lg-ink-sub); }
    .rm-inline-note {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--lg-ink-sub);
    }
    .rm-inline-note svg { color: var(--lg-accent); flex-shrink: 0; }

    /* Lưới "Hôm nay học gì?" — nền wash đồng tâm bo 16px */
    .rm-focus-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .rm-focus-item {
      border-radius: 16px;
      padding: 13px;
      background: var(--lg-wash);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      transition: background 0.16s ease, transform 0.16s ease;
    }
    .rm-focus-item:hover { background: var(--lg-wash-hover); transform: translateY(-1px); }
    .rm-focus-item.is-due { background: var(--lg-rose-soft); }

    .rm-item-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }
    .rm-mod-ico {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
    }
    .rm-mod-ico.mod-lessons { background: #fee2e2; color: #dc2626; }
    .rm-mod-ico.mod-vocab { background: #dbeafe; color: #1d4ed8; }
    .rm-mod-ico.mod-grammar { background: #ccfbf1; color: #0f766e; }
    .rm-mod-ico.mod-writing { background: #ffedd5; color: #c2410c; }
    .rm-mod-ico.mod-listening { background: #fef3c7; color: #b45309; }
    .rm-mod-ico.mod-reading { background: #dcfce7; color: #15803d; }
    .rm-mod-ico.mod-speaking { background: #ffe4e6; color: #be123c; }
    .rm-mod-ico.mod-mock { background: #f3e8ff; color: #7e22ce; }
    html.dark .rm-mod-ico.mod-lessons { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
    html.dark .rm-mod-ico.mod-vocab { background: rgba(59, 130, 246, 0.22); color: #93c5fd; }
    html.dark .rm-mod-ico.mod-grammar { background: rgba(20, 184, 166, 0.22); color: #5eead4; }
    html.dark .rm-mod-ico.mod-writing { background: rgba(249, 115, 22, 0.22); color: #fdba74; }
    html.dark .rm-mod-ico.mod-listening { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
    html.dark .rm-mod-ico.mod-reading { background: rgba(34, 197, 94, 0.22); color: #86efac; }
    html.dark .rm-mod-ico.mod-speaking { background: rgba(244, 63, 94, 0.22); color: #fda4af; }
    html.dark .rm-mod-ico.mod-mock { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; }
    .rm-focus-item.is-due .rm-mod-ico {
      background: rgba(225, 29, 72, 0.16);
      color: var(--lg-rose);
    }

    .rm-item-kicker {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--lg-accent);
      margin-bottom: 2px;
    }
    .rm-focus-item.is-due .rm-item-kicker { color: var(--lg-rose); }
    .rm-item-title {
      margin: 0;
      font-size: 13.8px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--lg-ink);
    }
    .rm-item-hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--lg-ink-muted);
      margin-top: 3px;
      line-height: 1.35;
    }
    .rm-focus-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--lg-divider);
    }
    .rm-prog-txt {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--lg-ink-muted);
    }
    .rm-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--lg-accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: filter 0.15s ease, transform 0.14s ease;
    }
    .rm-cta-btn:hover { filter: brightness(1.08); }
    .rm-cta-btn:active { transform: scale(0.97); }
    .rm-focus-item.is-due .rm-cta-btn { background: #e11d48; }

    /* 4. Thanh Stepper 6 Chặng + Bộ lọc 9 kỹ năng */
    .rm-nav-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 16px 0 12px;
    }
    .rm-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .rm-pills-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
    }
    .rm-pills-scroll::-webkit-scrollbar { display: none; }
    .rm-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      color: var(--lg-ink-sub);
      border-radius: 999px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .rm-pill:hover { color: var(--lg-ink); border-color: var(--lg-accent); }
    .rm-pill.active {
      background: var(--lg-accent);
      border-color: transparent;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.14);
    }
    .rm-pill.done-pill:not(.active) {
      color: var(--lg-green);
      border-color: rgba(16, 185, 129, 0.36);
    }

    /* 5. Thẻ 6 Chặng Accordion Glass */
    .rm-stage {
      border-radius: 24px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .rm-stage.is-current {
      border-color: rgba(220, 38, 38, 0.42);
    }
    html.dark .rm-stage.is-current {
      border-color: rgba(248, 113, 113, 0.45);
    }
    .rm-stage-head {
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
      transition: background 0.16s ease;
    }
    .rm-stage-head:hover { background: var(--lg-wash); }
    .rm-stage-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .rm-stage-ico {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lg-wash-hover);
      color: var(--lg-accent);
    }
    .rm-stage-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .rm-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--lg-wash-hover);
      color: var(--lg-ink-sub);
    }
    .rm-badge.band { background: var(--lg-accent-soft); color: var(--lg-accent); }
    .rm-badge.status-done { background: var(--lg-green-soft); color: var(--lg-green); }
    .rm-badge.status-cur { background: var(--lg-accent-soft); color: var(--lg-accent); }
    .rm-stage-title {
      margin: 0 0 3px;
      font-size: 16px;
      font-weight: 800;
      color: var(--lg-ink);
      line-height: 1.35;
    }
    .rm-stage-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--lg-ink-muted);
    }
    .rm-stage-right {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }
    .rm-stage-pct {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--lg-accent);
      white-space: nowrap;
    }
    .rm-chevron {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--lg-wash);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--lg-ink-sub);
      transition: transform 0.2s ease;
    }
    .rm-stage.open .rm-chevron { transform: rotate(180deg); }

    .rm-stage-bar-wrap { padding: 0 18px 14px; }
    .rm-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--lg-bar-track, var(--lg-divider));
      overflow: hidden;
    }
    .rm-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .rm-stage-body {
      display: none;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--lg-divider);
    }
    .rm-stage.open .rm-stage-body { display: block; }
    .rm-stage-goal {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--lg-ink-sub);
      line-height: 1.45;
    }
    .rm-stage-tip {
      margin: 0 0 12px;
      padding: 5px 0 5px 10px;
      border-left: 3px solid var(--lg-amber);
      font-size: 12px;
      color: var(--lg-ink-sub);
      line-height: 1.4;
    }

    .rm-tasks-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .rm-task {
      border-radius: 16px;
      padding: 13px;
      background: var(--lg-wash);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      transition: background 0.16s ease;
    }
    .rm-task:hover { background: var(--lg-wash-hover); }
    .rm-task.is-done { background: var(--lg-green-soft); }
    .rm-task.is-skipped { opacity: 0.78; }
    .rm-task-desc {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--lg-ink-muted);
      line-height: 1.4;
    }
    .rm-task-hint {
      margin-top: 5px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--lg-accent);
    }
    .rm-task.is-done .rm-task-hint { color: var(--lg-green); }

    .rm-task-foot { display: flex; flex-direction: column; gap: 7px; }
    .rm-task-prog-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--lg-ink-muted);
      gap: 8px;
    }
    .rm-task-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }
    .rm-skip-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: var(--lg-seg-track);
      color: var(--lg-ink-sub);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .rm-skip-btn:hover { background: var(--lg-wash-hover); color: var(--lg-ink); }
    .rm-skip-btn.active {
      background: var(--lg-green-soft);
      color: var(--lg-green);
    }

    /* 2b. Dải tiến độ 4 kỹ năng HSK (Nghe · Đọc · Nói · Viết) */
    .rm-skill-strip {
      border-radius: 20px;
      padding: 11px 14px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .rm-skill-cell {
      border: 1px solid transparent;
      background: var(--lg-wash);
      border-radius: 14px;
      padding: 9px 10px;
      text-align: left;
      font-family: inherit;
      color: var(--lg-ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.14s ease;
    }
    .rm-skill-cell:hover { background: var(--lg-wash-hover); border-color: var(--lg-hairline); transform: translateY(-1px); }
    .rm-skill-cell.is-lagging { border-color: rgba(217, 119, 6, 0.45); background: rgba(245, 158, 11, 0.10); }
    .rm-skill-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rm-skill-name { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--lg-ink); }
    .rm-skill-pct { font-size: 12.5px; font-weight: 800; color: var(--lg-ink); }
    .rm-skill-sub { font-size: 10.5px; font-weight: 700; color: var(--lg-ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rm-skill-cell.is-lagging .rm-skill-sub { color: var(--lg-amber); }

    /* Modal Placement Test 5 phút */
    .rm-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: var(--lg-modal-backdrop, rgba(15, 23, 42, 0.36));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }
    .rm-modal-card {
      width: 100%;
      max-width: 600px;
      border-radius: 22px;
      padding: 18px;
      margin: auto;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    .rm-pt-q {
      padding: 11px 12px;
      border-radius: 14px;
      background: var(--lg-wash);
    }
    .rm-pt-opt {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--lg-hairline);
      background: transparent;
      color: var(--lg-ink);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .rm-pt-opt:hover { background: var(--lg-wash-hover); }
    .rm-pt-opt.selected { border-color: var(--lg-accent); background: var(--lg-accent-soft); }

    @media (max-width: 760px) {
      .rm-seg-grid, .rm-focus-grid, .rm-tasks-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 580px) {
      .rm-brand-sub, .rm-hide-xs { display: none; }
      .rm-skill-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; border-radius: 18px; gap: 8px; }
      .rm-topbar { padding: 7px 9px; border-radius: 18px; }
      .rm-summary-strip { padding: 10px 4px; border-radius: 18px; }
      .rm-sum-num { font-size: 17.5px; }
      .rm-sum-lbl { font-size: 11px; }
      .rm-panel { padding: 14px; border-radius: 20px; }
      .rm-stage { border-radius: 20px; }
      .rm-stage-head { padding: 14px; }
      .rm-stage-bar-wrap { padding: 0 14px 12px; }
      .rm-stage-body { padding: 12px 14px 14px; }
    }
  </style>
</head>

  <script>
    (function () {

        mock: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',

        play: '<polygon points="6 4 20 12 6 20 6 4"/>',
        arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        chevronDown: '<path d="m6 9 6 6 6-6"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        sparkle: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
      };

      var MODULE_ICON_MAP = {
        lessons: "graduation",
        vocab: "vocab",
        grammar: "grammar",
        writing: "writing",
        listening: "listening",
        reading: "reading",
        speaking: "speaking",
        mock: "award"
      };

      function svgIcon(name, size) {
        var sz = size || 16;
        var mapped = MODULE_ICON_MAP[name] || name;
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          return window.S4UI.icon(mapped, sz);
        }
        var body = FALLBACK_SVG[name] || FALLBACK_SVG[mapped] || FALLBACK_SVG.sparkle;
        return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
      }

      var MODULE_FILTERS = [
        { id: "all", icon: "sparkle", label: "Tất cả" },
        { id: "lessons", icon: "lessons", label: "Bài giảng" },
        { id: "vocab", icon: "vocab", label: "Từ vựng" },
        { id: "grammar", icon: "grammar", label: "Ngữ pháp & Lượng từ" },
        { id: "writing", icon: "writing", label: "Luyện viết" },
        { id: "listening", icon: "listening", label: "Nghe" },
        { id: "reading", icon: "reading", label: "Đọc" },
        { id: "speaking", icon: "speaking", label: "Khẩu ngữ HSKK" },
        { id: "mock", icon: "mock", label: "Thi thử CTI" }
      ];

      var openStages = {};
      var userToggledStage = false;
      var activeModuleFilter = "all";

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function syncDarkIcon() {
        var btn = document.getElementById("rmDarkBtn");
        if (!btn) return;
        var isDark = document.documentElement.classList.contains("dark");
        if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn, isDark);
          return;
        }
        btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
        btn.title = isDark ? "Đang ở chế độ Tối — Bấm để chuyển sang Sáng" : "Đang ở chế độ Sáng — Bấm để chuyển sang Tối";
      }

      function toggleDarkMode() {
        if (window.toggleDarkModeOnly) {
          window.toggleDarkModeOnly();
        } else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          if (document.body) document.body.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
        }
        syncDarkIcon();
      }

      function renderAll() {
        var data = window.LP_HSK_ROADMAP_DATA;
        var api = window.LPHskRoadmap;
        if (!data || !api) return;

        var ev = api.evaluateRoadmap({ urlPrefix: "../../" });
        if (!ev) return;

        if (!userToggledStage && ev.activeStage) {
          openStages = {};
          openStages[ev.activeStage.id] = true;
        }

        // 1. Dải tổng quan 3 cột
        document.getElementById("sumOverallPct").textContent = ev.overallPct + "%";
        document.getElementById("sumTasksDone").textContent = ev.completedTasks + " / " + ev.totalTasks + " học phần";
        document.getElementById("sumCurrentStage").textContent = ev.activeStage ? ("Chặng " + ev.activeStage.order) : "Hoàn tất";
        document.getElementById("sumStageLevel").textContent = ev.activeStage ? (ev.activeStage.levelRange + " • " + ev.activeStage.estWeeks) : "HSK 6";
        document.getElementById("sumDueWords").textContent = ev.dueWordsTotal.toLocaleString("en-US");
        var dueLinkEl = document.getElementById("sumDueLink");
        if (dueLinkEl && ev.dueTargetUrl) dueLinkEl.setAttribute("href", ev.dueTargetUrl);

        // 1b. Thanh tiến độ 4 kỹ năng HSK (Nghe · Đọc · Nói · Viết)
        var skillStrip = document.getElementById("skillBreakdownStrip");
        if (skillStrip && ev.skillBreakdown && Array.isArray(ev.skillBreakdown.items)) {
          skillStrip.innerHTML = ev.skillBreakdown.items.map(function (it) {
            var lagCls = it.isLagging ? " is-lagging" : "";
            var sub = it.isLagging

      function handleActionClick(e) {
        var btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
        if (!btn) return;
        var action = btn.getAttribute("data-action");
        var id = btn.getAttribute("data-id") || "";
        var api = window.LPHskRoadmap;
        var data = window.LP_HSK_ROADMAP_DATA;

        if (action === "start" && api) {
          api.setStartLevel(id);
          userToggledStage = false;
          renderAll();
        } else if (action === "pace" && api) {
          api.setPace(id);
          renderAll();
        } else if (action === "skip-task" && api) {
          api.toggleSkipTask(id);
          renderAll();
        } else if (action === "jump-stage") {
          userToggledStage = true;
          openStages[id] = true;
          renderAll();
          var el = document.getElementById("stageCard_" + id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (action === "filter-mod") {
          activeModuleFilter = id || "all";
          if (activeModuleFilter !== "all" && data) {
            userToggledStage = true;
            data.STAGES.forEach(function (s) { openStages[s.id] = true; });
          }
          renderAll();
        } else if (action === "toggle-stage") {
          userToggledStage = true;
          openStages[id] = !openStages[id];
          var card = document.getElementById("stageCard_" + id);
          if (card) card.classList.toggle("open", Boolean(openStages[id]));
          var toggleBtn = document.getElementById("btnToggleAllStages");
          if (toggleBtn && data) {
            var allOpen = data.STAGES.every(function (s) { return Boolean(openStages[s.id]); });
            toggleBtn.textContent = allOpen ? "Thu gọn" : "Mở tất cả";
          }
        }
      }

      document.addEventListener("click", handleActionClick);

      function renderPinyinCheckModal() {

          var right = 0;

          });

          + '</div>';

        body.querySelectorAll("[data-py-play]").forEach(function (b) {
          b.addEventListener("click", function () {
            var q = PINYIN_CHECK_QS[Number(b.getAttribute("data-py-play"))];
            if (!q || !window.HskTTS) return;
            Promise.resolve(window.HskTTS.speak(q.audioZh, { pinyin: q.audioPy, rate: 0.92 })).then(function (ok) {
              if (q.audioOnly && ok) {
                pyListened[q.id] = true;
                body.querySelectorAll('[data-py-q="' + q.id + '"]').forEach(function (option) { option.disabled = false; });
              }
              if (!ok && window.S4UI) window.S4UI.toast("warn", "Chưa phát được mẫu. Hãy kiểm tra giọng đọc hoặc kết nối.");
            }).catch(function () {
              if (window.S4UI) window.S4UI.toast("warn", "Chưa phát được mẫu.");
            });
          });
        });
        body.querySelectorAll("[data-py-q]").forEach(function (b) {
          b.addEventListener("click", function () {
            pyAnswers[b.getAttribute("data-py-q")] = Number(b.getAttribute("data-py-opt"));
            renderPinyinCheckModal();
          });
        });
        var subBtn = document.getElementById("btnSubmitPinyinCheck");
        if (subBtn) {
          subBtn.addEventListener("click", function () {
            pySubmitted = true;
            renderPinyinCheckModal();
          });
        }
      }

      function openPinyinCheckModal() {
        pyAnswers = {};
        pyListened = {};
        pySubmitted = false;
        var m = document.getElementById("pinyinCheckModal");
        if (m) m.style.display = "flex";
        renderPinyinCheckModal();
        if (m) releasePinyinFocus = window.S4UI?.keepDialogFocus(m);
      }
      function closePinyinCheckModal() {
        var m = document.getElementById("pinyinCheckModal");
        if (m) m.style.display = "none";
        if (releasePinyinFocus) releasePinyinFocus();
        releasePinyinFocus = null;
      }

      var openPyBtn = document.getElementById("btnPinyinQuickCheck");
      if (openPyBtn) openPyBtn.addEventListener("click", openPinyinCheckModal);
      var closePyBtn = document.getElementById("btnClosePinyinCheck");
      if (closePyBtn) closePyBtn.addEventListener("click", closePinyinCheckModal);

      // Đánh giá đầu vào HSK nhanh (10 câu • ~5 phút • tùy chọn, không khóa thư viện)
      var HSK_PLACEMENT_QS = [
        { id: "hp1", tier: "Pinyin", group: "Pinyin & HSK 1", audioZh: "买东西", audioPy: "mǎi dōngxi", prompt: "Nghe mẫu “mǎi dōngxi (买东西)” — cụm này nghĩa là gì?", opts: ["Mua đồ (mǎi)", "Bán đồ (mài)", "Đi học"], ans: 0 },
        { id: "hp2", tier: "HSK 1", group: "Pinyin & HSK 1", prompt: "Câu “我很高兴认识你。” có nghĩa là gì?", opts: ["Tôi không quen bạn.", "Tôi rất vui được quen bạn.", "Tôi đang tìm bạn."], ans: 1 },
        { id: "hp3", tier: "HSK 1", group: "Pinyin & HSK 1", prompt: "Chọn lượng từ đúng: “我有一____书。” (Tôi có một quyển sách.)", opts: ["杯 (bēi)", "本 (běn)", "只 (zhī)"], ans: 1 },
        { id: "hp4", tier: "HSK 2", group: "HSK 2–3", audioZh: "明天上午九点我们去医院吧。", audioPy: "Míngtiān shàngwǔ jiǔ diǎn wǒmen qù yīyuàn ba.", prompt: "Nghe câu hội thoại — Sáng mai 9 giờ họ định đi đâu?", opts: ["Trường học (学校)", "Siêu thị (超市)", "Bệnh viện (医院)"], ans: 2 },
        { id: "hp5", tier: "HSK 2", group: "HSK 2–3", prompt: "Chọn từ so sánh đúng: “今天的天气____昨天暖和得多。”", opts: ["比 (bǐ)", "被 (bèi)", "把 (bǎ)"], ans: 0 },
        { id: "hp6", tier: "HSK 3", group: "HSK 2–3", prompt: "Điền cặp liên từ: “____下雨了，____我们决定改天再去爬山。”", opts: ["虽然……但是……", "因为……所以……", "不但……而且……"], ans: 1 },
        { id: "hp7", tier: "HSK 3", group: "HSK 2–3", prompt: "Hoàn thiện câu chữ 把: “请把桌子上的那杯茶____。”", opts: ["拿过来", "去过", "喝着了"], ans: 0 },
        { id: "hp8", tier: "HSK 4", group: "HSK 4–6", audioZh: "无论遇到什么困难，他都从来没有放弃过自己的理想。", audioPy: "Wúlùn yùdào shénme kùnnan, tā dōu cónglái méiyǒu fàngqì guo zìjǐ de lǐxiǎng.", prompt: "Nghe câu HSK 4 — Ý chính của câu là gì?", opts: ["Anh ấy đã đổi lý tưởng vì quá khó khăn.", "Anh ấy chưa từng gặp khó khăn nào.", "Dù gặp khó khăn gì anh ấy cũng chưa từng từ bỏ lý tưởng."], ans: 2 },
        { id: "hp9", tier: "HSK 4–5", group: "HSK 4–6", prompt: "“这项环保政策不仅减少了污染，而且大大____了居民的生活质量。”", opts: ["下降", "提高", "取消"], ans: 1 },
        { id: "hp10", tier: "HSK 5–6", group: "HSK 4–6", prompt: "“____近年来远程办公日益普及，传统写字楼的需求仍未完全消失。”", opts: ["尽管", "既然", "除非"], ans: 0 }
      ];
      var hskPtAns = {};
      var hskPtSubmitted = false;

      function getHskRecommendation(score) {
        if (score <= 4) return { levelId: "foundation", label: "Chặng 1 • Mới bắt đầu (Pinyin → HSK 1)", note: "Nên bắt đầu từ Chương 0 Pinyin, 20 cặp thanh điệu và Bài 1 (你好!) để chắc nền phát âm & chữ Hán." };
        if (score <= 7) return { levelId: "intermediate", label: "Chặng 3 • Đã có HSK 2 (HSK 3–4)", note: "Bạn đã nắm nền HSK 1–2, phù hợp tăng tốc từ Chặng 3 (liên từ HSK 3, viết câu & HSKK Trung cấp)." };
        return { levelId: "advanced", label: "Chặng 5 • Tăng tốc HSK 4+ (HSK 5–6)", note: "Nền HSK 3–4 rất tốt! Bạn có thể đi thẳng vào Chặng 5 để luyện đọc báo chí, viết đoạn văn và HSKK Cao cấp." };
      }

      function renderHskPlacementModal() {
        var body = document.getElementById("placementBody");
        if (!body) return;
        if (hskPtSubmitted) {
          var score = 0;
          var byGroup = {};
          HSK_PLACEMENT_QS.forEach(function (q) {
            if (!byGroup[q.group]) byGroup[q.group] = { ok: 0, total: 0 };
            byGroup[q.group].total++;
            if (hskPtAns[q.id] === q.ans) { score++; byGroup[q.group].ok++; }
          });
          var rec = getHskRecommendation(score);
          try {
            localStorage.setItem("lp_hsk_placement_v1", JSON.stringify({
              score: score, total: HSK_PLACEMENT_QS.length, recLevel: rec.levelId, recLabel: rec.label, at: new Date().toISOString()
            }));
          } catch (e) {}
          var grpHtml = Object.keys(byGroup).map(function (g) {
            return '<span class="rm-badge" style="padding:4px 9px;">' + esc(g) + ': ' + byGroup[g].ok + '/' + byGroup[g].total + '</span>';
          }).join("");
          body.innerHTML = '<div class="rm-pt-q" style="margin-bottom:12px;">'
            + '<div style="font-size:18px;font-weight:800;color:var(--lg-accent);">Kết quả: ' + score + '/' + HSK_PLACEMENT_QS.length + ' câu đúng</div>'
            + '<div style="font-size:14px;font-weight:800;color:var(--lg-ink);margin-top:4px;">Gợi ý xuất phát điểm: ' + esc(rec.label) + '</div>'
            + '<p style="margin:6px 0 8px;font-size:12.5px;color:var(--lg-ink-sub);line-height:1.45;">' + esc(rec.note) + '</p>'
            + '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + grpHtml + '</div>'
            + '</div>'
            + '<p style="margin:0 0 12px;font-size:12px;color:var(--lg-ink-muted);">Thư viện HSK 1–6 luôn mở 100% — gợi ý này chỉ giúp chọn chặng bắt đầu hợp lý và bạn có thể đổi bất cứ lúc nào.</p>'
            + '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">'
            + '  <button type="button" class="rm-ghost-btn" id="btnRetryPlacement">Làm lại</button>'
            + '  <button type="button" class="rm-cta-btn" id="btnApplyPlacement" style="border:none;cursor:pointer;" data-rec-level="' + esc(rec.levelId) + '">Áp dụng gợi ý ngay</button>'
            + '</div>';
          var retryB = document.getElementById("btnRetryPlacement");
          if (retryB) retryB.addEventListener("click", function () { hskPtAns = {}; hskPtSubmitted = false; renderHskPlacementModal(); });
          var applyB = document.getElementById("btnApplyPlacement");
          if (applyB) applyB.addEventListener("click", function () { window.__hskPtApply(rec.levelId); });
          return;
        }
        var answered = Object.keys(hskPtAns).length;
        body.innerHTML = '<p style="margin:0 0 10px;font-size:12.5px;color:var(--lg-ink-muted);">Bài test tùy chọn giúp gợi ý chặng xuất phát phù hợp (Chặng 1 / Chặng 3 / Chặng 5). <b>Không khóa bất kỳ bài học nào</b>. Đã chọn: <b>' + answered + '/' + HSK_PLACEMENT_QS.length + '</b>.</p>'
          + '<div style="display:grid;gap:10px;">' + HSK_PLACEMENT_QS.map(function (q, i) {
            var playBtn = q.audioZh ? '<button type="button" class="rm-ghost-btn" data-hpt-play="' + i + '" style="flex-shrink:0;">Nghe mẫu</button>' : '';
            return '<div class="rm-pt-q">'
              + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">'
              + '  <div><span class="rm-badge" style="margin-bottom:4px;">Câu ' + (i + 1) + ' • ' + esc(q.tier) + '</span>'
              + '  <div style="font-size:13px;font-weight:800;color:var(--lg-ink);line-height:1.4;">' + esc(q.prompt) + '</div></div>'
              +    playBtn
              + '</div>'
              + '<div style="display:grid;gap:6px;">' + q.opts.map(function (op, oi) {
                var sel = hskPtAns[q.id] === oi ? " selected" : "";
                return '<button type="button" class="rm-pt-opt' + sel + '" data-hpt-q="' + esc(q.id) + '" data-hpt-opt="' + oi + '">' + esc(op) + '</button>';
              }).join("") + '</div></div>';
          }).join("") + '</div>'
          + '<div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;">'
          + '  <button type="button" class="rm-cta-btn" id="btnSubmitPlacement" style="border:none;cursor:pointer;">Chấm điểm &amp; xem gợi ý</button>'
          + '</div>';
        body.querySelectorAll("[data-hpt-play]").forEach(function (b) {
          b.addEventListener("click", function () {
            var q = HSK_PLACEMENT_QS[Number(b.getAttribute("data-hpt-play"))];
            if (q && window.HskTTS) window.HskTTS.speak(q.audioZh, { pinyin: q.audioPy, rate: 0.9 });
          });
        });
        body.querySelectorAll("[data-hpt-q]").forEach(function (b) {
          b.addEventListener("click", function () {
            window.__hskPtPick(b.getAttribute("data-hpt-q"), Number(b.getAttribute("data-hpt-opt")));
          });
        });
        var subB = document.getElementById("btnSubmitPlacement");
        if (subB) subB.addEventListener("click", function () { window.__hskPtSubmit(); });
      }

      var releasePlacementFocus;
      window.__hskOpenPlacement = function () {
        hskPtAns = {};
        hskPtSubmitted = false;
        var m = document.getElementById("placementModal");
        if (m) m.style.display = "flex";
        renderHskPlacementModal();
        if (!releasePlacementFocus && m) releasePlacementFocus = window.S4UI?.keepDialogFocus(m);
      };
      window.__hskClosePlacement = function () {
        var m = document.getElementById("placementModal");
        if (m) m.style.display = "none";
        if (releasePlacementFocus) releasePlacementFocus();
        releasePlacementFocus = null;
      };
      window.__hskPtPick = function (qid, oi) {
        hskPtAns[qid] = Number(oi);
        renderHskPlacementModal();
      };
      window.__hskPtSubmit = function () {
        hskPtSubmitted = true;
        renderHskPlacementModal();
      };
      window.__hskPtApply = function (levelId) {
        if (window.LPHskRoadmap) window.LPHskRoadmap.setStartLevel(levelId);
        userToggledStage = false;
        window.__hskClosePlacement();
        renderAll();
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast("success", "Đã áp dụng chặng xuất phát HSK theo kết quả đánh giá đầu vào.");
        }
      };

      var openPtBtn = document.getElementById("btnOpenPlacement");
      if (openPtBtn) openPtBtn.addEventListener("click", window.__hskOpenPlacement);
      var closePtBtn = document.getElementById("btnClosePlacement");
      if (closePtBtn) closePtBtn.addEventListener("click", window.__hskClosePlacement);
      var ptModalEl = document.getElementById("placementModal");
      if (ptModalEl) {
        ptModalEl.addEventListener("click", function (ev) {
          if (ev.target === ptModalEl) window.__hskClosePlacement();
        });
      }
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") { window.__hskClosePlacement(); closePinyinCheckModal(); }
      });

      syncDarkIcon();
      renderAll();
      if (typeof MutationObserver !== "undefined") {
        new MutationObserver(syncDarkIcon).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      }
      window.addEventListener("pageshow", function () { syncDarkIcon(); renderAll(); });
      window.addEventListener("focus", renderAll);
      window.addEventListener("storage", renderAll);
    })();
  </script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
