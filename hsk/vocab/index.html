      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");

      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);

        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();

    }

    .tone-3 { color: var(--t3); } .tone-4 { color: var(--t4); } .tone-5 { color: var(--t5); }
    .hide-py .py-el { visibility: hidden; }
    .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 80; }
    body.drawer-open { overflow: hidden !important; }
    @media (max-width: 1024px) {
      .menu-btn { display: inline-flex; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 60px; }
      .sidebar {
        display: none; position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, var(--lp-sidebar-w, 336px));

        padding-top: calc(12px + var(--s4-top-inset, env(safe-area-inset-top, 0px)));

      }
      body.drawer-open .sidebar { display: flex; }
      body.drawer-open .drawer-backdrop { display: block; }
      .stage-card { padding: 14px 12px; }
      .fc-hanzi { font-size: 40px; }
      .opt-grid { grid-template-columns: minmax(0, 1fr); }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .srs-buttons { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .srs-btn { padding: 10px 6px; font-size: 12.5px; }
    }
    @media (max-width: 560px) {
      .lp-hsk-topbar-wrap { padding: calc(6px + var(--s4-top-inset, env(safe-area-inset-top, 0px))) 8px 2px; }
    }
  </style>

  <script src="../../assets/s4-ui.js?v=69"></script>
  <script src="../hsk-tts.js?v=2"></script>
  <script src="../hanzi-writer.min.js"></script>
  <script src="../../assets/s4-search-engine.js?v=1"></script>
  <script src="./vocab_data.js?v=2"></script>
  <script src="./vocab_examples_vi.js?v=1"></script>
  <script src="./hsk-shooter.js?v=3"></script>
  <script>
    const SRS_KEY = "lp_hsk_vocab_srs_v1";
    const DAYS_KEY = "lp_hsk_vocab_days_v1";
    const SET_KEY = "lp_hsk_vocab_settings_v1";
    const SES_KEY = "lp_hsk_vocab_session_v1";

    const DEFAULT_SETTINGS = {
      dailyNewLimit: 8,
      reviewCap: 100,
      autoAudio: true,
      queueOrder: "mix",
      bonusTodayDate: "",
      bonusTodayCount: 0,
      showPinyin: true,
      toneColor: true,
      slow: false,
      paceChosen: false
    };

    const STEP_NAMES = ["Làm quen", "Nhận diện", "Nghe & Nhớ", "Ghi nhớ sâu"];
    const ALL_WORDS = window.LP_HSK_VOCAB_DATA || [];
    const WORDS_BY_ID = new Map();
    const WORDS_BY_WORD = new Map();
    const WORDS_BY_LEVEL = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
    const PACKS_BY_LEVEL = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
    let lessonShooterPool = null;
    let lessonSrsPool = null;

    const EX_EXTRA_MAP = window.LP_HSK_VOCAB_EX_EXTRA || {};
    const EX_VI_MAP = window.LP_HSK_VOCAB_EX_VI || {};
    ALL_WORDS.forEach((w) => {
      if ((!w.ex || !w.ex.z) && EX_EXTRA_MAP[w.id]) {
        w.ex = EX_EXTRA_MAP[w.id];
      }
      if (EX_VI_MAP[w.id]) {
        w.exVi = EX_VI_MAP[w.id];
      }
      WORDS_BY_ID.set(w.id, w);
      if (!WORDS_BY_WORD.has(w.word)) WORDS_BY_WORD.set(w.word, w);
      if (WORDS_BY_LEVEL[w.level]) WORDS_BY_LEVEL[w.level].push(w);
    });
    for (let lv = 1; lv <= 6; lv++) {
      const map = new Map();
      WORDS_BY_LEVEL[lv].forEach((w) => {
        if (!map.has(w.topic)) map.set(w.topic, []);
        map.get(w.topic).push(w);
      });
      PACKS_BY_LEVEL[lv] = [...map.entries()].map(([topic, items]) => ({ topic, items }));
    }
    if (window.S4SearchEngine) window.S4SearchEngine.initWasm("../../assets/s4-core.wasm?v=1");
    const hskSearchIndex = (window.S4SearchEngine && typeof window.S4SearchEngine.createIndex === "function")
      ? window.S4SearchEngine.createIndex(ALL_WORDS, {
          lazy: true,
          fields: [
            { name: "word", get: w => [w.word, w.trad || ""], weight: 2.5 },
            { name: "pinyin", get: w => [w.pinyin, w.pinyinNum || ""], weight: 2.0, pinyin: true },
            { name: "hanViet", get: w => w.hanViet, weight: 1.5 },
            { name: "defVi", get: w => w.defVi, weight: 1.35 },
            { name: "defEn", get: w => w.defEn, weight: 1.0 },
            { name: "radical", get: w => w.radical, weight: 0.8 },
            { name: "ex", get: w => {
              const ex = (w.ex && w.ex.z) ? w.ex : (w.examples && w.examples[0] ? { z: w.examples[0] } : null);
              return ex ? [ex.z || "", ex.p || "", ex.v || ex.e || ""] : "";
            }, weight: 0.7 }
          ]
        })
      : null;

    function safeJson(k, fb) {
      try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === "object" ? v : fb; } catch (e) { return fb; }
    }
    function localDateStr(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function getTodayStr() { return localDateStr(new Date()); }
    function rint(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let srsMap = safeJson(SRS_KEY, {});
    let dayLog = (() => {
      const raw = safeJson(DAYS_KEY, {});
      const out = {};
      Object.keys(raw).forEach((k) => {
        if (Array.isArray(raw[k])) out[k] = raw[k];
        else if (raw[k] && typeof raw[k] === "object") {
          const n = Number(raw[k].newCount || 0) + Number(raw[k].reviewCount || 0);
          out[k] = Array.from({ length: n }, (_, i) => "legacy_" + i);
        }
      });
      return out;
    })();
    let userSettings = Object.assign({}, DEFAULT_SETTINGS, safeJson(SET_KEY, {}));

    const HSK1_LESSON_GROUPS = [
      { id: "hsk1_01", label: "Bài 1: 你好！", words: ["你","好","老师","对不起","没关系","再见"] },
      { id: "hsk1_02", label: "Bài 2: 谢谢你！", words: ["谢谢","不","不客气","我","我们","很","吗"] },
      { id: "hsk1_03", label: "Bài 3: 你叫什么名字？", words: ["叫","什么","名字","是","哪","人","中国"] },
      { id: "hsk1_04", label: "Bài 4: 她是我的汉语老师", words: ["她","他","谁","的","汉语","同学","朋友","学生","呢","这","那","都"] },
      { id: "hsk1_05", label: "Bài 5: 她女儿今年二十岁", words: ["家","有","爸爸","妈妈","女儿","儿子","几","多少","岁"] },
      { id: "hsk1_06", label: "Bài 6: 我会说汉语", words: ["会","写","读","做","菜","怎么","太"] },
      { id: "hsk1_07", label: "Bài 7: 今天几号？", words: ["今天","昨天","明天","年","月","日","星期","去","学校"] },
      { id: "hsk1_08", label: "Bài 8: 我想喝茶", words: ["想","喝","茶","水","吃","米饭","杯子","钱","块"] },
      { id: "hsk1_09", label: "Bài 9: 你儿子在哪儿工作？", words: ["在","工作","医院","医生","猫","狗"] },
      { id: "hsk1_10", label: "Bài 10: 桌子上有什么？", words: ["桌子","椅子","电脑","书","本","里","前面","后面","和","能","坐","先生"] },
      { id: "hsk1_11", label: "Bài 11: 现在几点？", words: ["现在","点","上午","中午","下午","时候","回","零"] },
      { id: "hsk1_12", label: "Bài 12: 明天天气怎么样？", words: ["天气","怎么样","热","冷","下雨","爱","水果","些","多","小姐"] },
      { id: "hsk1_13", label: "Bài 13: 他在学做中国菜呢", words: ["喂","打电话","睡觉","听","学习","喜欢"] },
      { id: "hsk1_14", label: "Bài 14: 她买了不少衣服", words: ["买","东西","衣服","漂亮","商店","苹果","看见","少"] },
      { id: "hsk1_15", label: "Bài 15: 我是坐飞机来的", words: ["认识","高兴","飞机","出租车","火车站","住","电影","来"] },
      { id: "hsk1_extra", label: "Bổ sung HSK 1 (số đếm & mở rộng)", words: ["了","个","一","上","看","没","大","下","小","开","请","三","分钟","四","五","二","电视","六","十","说话","字","八","七","九","北京","饭馆"] }
    ];
    const HSK1_LESSON_PACKS = (() => {
      const byWord = new Map((WORDS_BY_LEVEL[1] || []).map((w) => [w.word, w]));
      return HSK1_LESSON_GROUPS.map((g) => ({
        topic: "HSK 1 — " + g.label,
        shortName: g.label,
        lessonId: g.id,
        items: g.words.map((zh) => byWord.get(zh)).filter(Boolean)
      })).filter((p) => p.items.length > 0);
    })();
    const LESSON_PACKS_BY_LEVEL = (() => {
      const out = { 1: HSK1_LESSON_PACKS };
      const sidecarGroups = window.LP_HSK_LESSON_GROUPS || {};
      for (let lv = 2; lv <= 6; lv++) {
        const groups = Array.isArray(sidecarGroups[lv]) ? sidecarGroups[lv] : [];
        const byWord = new Map((WORDS_BY_LEVEL[lv] || []).map((w) => [w.word, w]));
        const packs = groups.map((g) => ({
          topic: "HSK " + lv + " — " + g.label,
          shortName: g.label,
          lessonId: g.id,
          items: (g.words || []).map((zh) => byWord.get(zh)).filter(Boolean)
        })).filter((p) => p.items.length > 0);
        out[lv] = packs.length ? packs : (PACKS_BY_LEVEL[lv] || []);
      }
      return out;
    })();
    function getLevelPacks(lv) {
      if (hsk1OrderMode === "lesson" && LESSON_PACKS_BY_LEVEL[lv] && LESSON_PACKS_BY_LEVEL[lv].length) {
        return LESSON_PACKS_BY_LEVEL[lv];
      }
      return PACKS_BY_LEVEL[lv] || [];
    }

    const qs = new URLSearchParams(location.search);
    let currentLevel = Math.min(6, Math.max(1, Number(qs.get("level") || qs.get("lv") || 1) || 1));
    let hasDueLevelFilter = Boolean(Number(qs.get("level") || qs.get("lv") || 0));
    const reqOrder = (qs.get("order") || "").toLowerCase();
    const savedOrder = (() => { try { return localStorage.getItem("lp_hsk1_vocab_order") || ""; } catch (e) { return ""; } })();
    let hsk1OrderMode = (reqOrder === "freq" || reqOrder === "lesson")
      ? reqOrder
      : ((savedOrder === "freq" || savedOrder === "lesson") ? savedOrder : "lesson");
    const initPacks = getLevelPacks(currentLevel);
    let currentTopic = initPacks[0] ? initPacks[0].topic : "__ALL__";
    let currentMode = "smart"; // smart | flashcard | quiz | listen | match | cloze | list
    let quizDir = "mix";       // mix | zh2vi | vi2zh | zh2py
    let listenSub = "choice";  // choice | dictation
    let listSearch = "";
    let listFilter = "all";    // all | unseen | learned | ignored
    let listHsk3Filter = "all"; // all | 1 | 2 | 3 | 4 | 5 | 6 | 7
    let listPage = 1;
    let panel = "";            // '' | stats | calendar | settings
    let calMonthOffset = 0;

    // Session & card state (IELTS s4-vocab-engine.js parity)
    let studyQueue = [];
    let sessionTotal = 0;
    let sessionDone = 0;
    let extraPracticeMode = false;
    let isFlipped = false;
    let cardSerial = 0;
    let cardCache = {};
    let lastPlayedSerial = -1;
    let lastSmartWordId = "";
    let smartTick = 0;
    let quizPickedId = null;
    let textChecked = null; // null | { ok, rightAns }
    let matchState = null;

    function saveSrs() { try { localStorage.setItem(SRS_KEY, JSON.stringify(srsMap)); } catch (e) {} }
    function saveDays() { try { localStorage.setItem(DAYS_KEY, JSON.stringify(dayLog)); } catch (e) {} }
    function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(userSettings)); } catch (e) {} }
    function bumpCard() { cardSerial++; cardCache = {}; quizPickedId = null; textChecked = null; }
    function cacheGet(key, fn) { return cardCache[key] || (cardCache[key] = fn()); }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function highlightHskText(s, q) {
      if (q && window.S4SearchEngine && typeof window.S4SearchEngine.highlightHtml === "function") {
        return window.S4SearchEngine.highlightHtml(s, q);
      }
      return esc(s);
    }
    function escJsAttr(s) {

          insertPos = rint(minGap, qLen);
        } else {
          const minGap = Math.min(qLen, Math.max(3, Math.floor(qLen * 0.20)));
          const maxGap = Math.min(qLen, Math.max(6, Math.floor(qLen * 0.60)));
          insertPos = rint(minGap, maxGap);
        }
      }
      studyQueue.splice(insertPos, 0, v);
      isFlipped = false;
      pickNextSmartItem(false);
      saveSessionState();
      renderAll();
    }

    function graduateSmartWord(v) {
      studyQueue.shift();
      const m = v._mistakes || 0;
      if (!extraPracticeMode) {
        if (v._new) rateWordSRS(v.id, m >= 2 ? 1 : 2);
        else if (m === 0) rateWordSRS(v.id, 3);
        else if (m === 1) rateWordSRS(v.id, 1);
        else rateWordSRS(v.id, 0, true);
      } else {
        logActivity(v.id);
      }
      sessionDone++;
      isFlipped = false;
      if (studyQueue.length) pickNextSmartItem(false); else bumpCard();
      saveSessionState([v.id]);
      renderAll();
    }

    function advanceNonSmart(q) {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      const qLen = studyQueue.length;
      let dropped = null;
      if (q === 0) {
        if (!v._lapsed && !extraPracticeMode) { v._lapsed = true; v._rated = true; rateWordSRS(v.id, 0); }
        else { v._lapsed = true; logActivity(v.id); }
        const minGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(3, Math.floor(qLen * 0.25)));
        const maxGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(6, Math.floor(qLen * 0.75)));
        studyQueue.splice(rint(minGap, maxGap), 0, v);
      } else if (q === 1 && !v._hardRepeated && !v._lapsed && qLen >= 3) {
        if (!extraPracticeMode && !v._rated) { v._rated = true; rateWordSRS(v.id, 1); }
        v._hardRepeated = true;
        studyQueue.splice(rint(Math.ceil(qLen * 0.45), qLen), 0, v);
      } else {
        if (!extraPracticeMode) {
          if (v._lapsed && !v._relearned) { v._relearned = true; rateWordSRS(v.id, q >= 2 ? 2 : 1); }
          else if (!v._rated) { v._rated = true; rateWordSRS(v.id, q); }
          else logActivity(v.id);
        } else {
          logActivity(v.id);
        }
        sessionDone++;
        dropped = v.id;
      }
      isFlipped = false;
      bumpCard();
      saveSessionState(dropped ? [dropped] : undefined);
      renderAll();
    }

    function ignoreCurrentWord() {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      srsMap[v.id] = { reps: 0, interval: 0, ease: 2.5, due: 0, ignored: true, lastReview: Date.now(), updatedAt: Date.now() };
      saveSrs();
      sessionDone++;
      isFlipped = false;
      if (studyQueue.length && currentMode === "smart") pickNextSmartItem(false); else bumpCard();
      saveSessionState([v.id]);
      if (window.S4UI && window.S4UI.toast) window.S4UI.toast("success", `⏭️ Đã đánh dấu "${v.word}" là Đã biết.`);
      renderAll();
    }

    function markKnownById(id, flag) {
      if (flag) {
        srsMap[id] = { reps: 0, interval: 0, ease: 2.5, due: 0, ignored: true, lastReview: Date.now(), updatedAt: Date.now() };
      } else {
        delete srsMap[id];
      }
      saveSrs();
      renderAll();
    }

    function pickDistractors(target, count) {
      const pool = WORDS_BY_LEVEL[currentLevel].length >= 12 ? WORDS_BY_LEVEL[currentLevel] : ALL_WORDS;
      const out = [];
      const seen = new Set([target.id]);
      let guard = 0;
      while (out.length < count && guard++ < 300) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        if (c && !seen.has(c.id) && c.word !== target.word) {
          seen.add(c.id);
          out.push(c);
        }
      }
      return out;
    }

    /* ---------- UI Rendering ---------- */
    function computeScopeStats() {
      const pool = getActiveWords();
      const now = Date.now();
      const s = { total: pool.length, learning: 0, ignored: 0, due: 0, mastered: 0 };
      for (const w of pool) {
        const st = srsMap[w.id];
        if (!st) continue;
        if (st.ignored) { s.ignored++; continue; }
        if (!st.reps || st.reps <= 0) continue;
        s.learning++;
        if (!st.due || now >= st.due) s.due++;
        else if (st.interval >= 7) s.mastered++;
      }
      return s;
    }

    function renderCalendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDow = (new Date(year, month, 1).getDay() + 6) % 7;
      const todayStr = getTodayStr();
      const keyOf = (d) => year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");

      let total = 0, active = 0;
      let cells = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map((n) => `<div class="cal-dow">${n}</div>`).join("") + "<div></div>".repeat(startDow);
      for (let d = 1; d <= daysInMonth; d++) {
        const k = keyOf(d);
        const cnt = (dayLog[k] || []).length;
        total += cnt; if (cnt) active++;
        const lv = !cnt ? 0 : cnt < 10 ? 1 : cnt < 20 ? 2 : cnt < 40 ? 3 : 4;
        cells += `<div class="cal-day lv${lv}${k === todayStr ? " today" : ""}" title="${d}/${month + 1}: ${cnt} từ">${d}${cnt ? `<span>${cnt}</span>` : ""}</div>`;
      }
      let streak = 0;
      const cur = new Date();
      if (!(dayLog[localDateStr(cur)] || []).length) cur.setDate(cur.getDate() - 1);
      while ((dayLog[localDateStr(cur)] || []).length) { streak++; cur.setDate(cur.getDate() - 1); }

      return `<div class="cal-wrap">
        <div class="cal-head">
          <button class="pill-toggle" onclick="calMonthOffset--;renderStatsCard();">‹</button>
          <b>Tháng ${month + 1}/${year}</b>
          <button class="pill-toggle" onclick="calMonthOffset++;renderStatsCard();" ${calMonthOffset >= 0 ? 'disabled style="opacity:.4"' : ""}>›</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot"><span style="display:inline-flex;align-items:center;gap:4px;">${vIcon("flame", 12)} Chuỗi <b>${streak}</b> ngày</span><span style="display:inline-flex;align-items:center;gap:4px;">${vIcon("calendar", 12)} <b>${active}</b> ngày</span><span style="display:inline-flex;align-items:center;gap:4px;">${vIcon("file", 12)} <b>${total}</b> lượt</span></div>
      </div>`;
    }

      const isSmart = currentMode === "smart" && typeof w._stage === "number";

        ? `<span class="tag-pill relearn">Xem lại do vừa nhầm</span>`

      const steps = isSmart
        ? `<span class="steps-bar" title="Bước ${stepNum}/4: ${STEP_NAMES[stepNum - 1]}">
            ${[0, 1, 2, 3].map((i) => `<i class="${i < w._stage ? "done" : i === w._stage ? "cur" : ""}"></i>`).join("")}
            <span class="step-lbl">Bước ${stepNum}/4 • ${STEP_NAMES[stepNum - 1]}</span>
          </span>`
        : "";
      return `<div class="card-hdr">
        <div>${tag}${steps}</div>

      </div>`;

    function renderExamplesBlock(w) {
      const rows = [];
      if (w.exVi && w.exVi.z) rows.push(w.exVi);
      if (w.ex && w.ex.z && !rows.some((r) => r.z === w.ex.z)) rows.push(w.ex);
      if (w.examples && w.examples.length) {
        w.examples.forEach((z) => {
          if (!rows.some((r) => r.z === z)) rows.push({ z, p: "", v: "", e: "" });

      }
      if (!rows.length) return "";
      const cleanWord = String(w.word || "").replace(/\s+[a-z]+$/i, "").trim();

            let cls = "opt-btn";
            if (quizPickedId !== null) {
              if (c.id === w.id) cls += " ok";
              else if (c.id === quizPickedId) cls += " bad";
            }
            const lbl = dir === "zh2vi"
              ? esc(c.defVi)
              : (dir === "vi2zh"
                ? `<span style="font-size:22px;">${esc(c.word)}</span> ${quizPickedId !== null ? `<span style="font-size:12.5px;color:var(--muted);">(${esc(c.pinyin)})</span>` : ""}`
                : esc(c.pinyin));
            return `<button class="${cls}" onclick="pickChoice('${c.id}')"><span class="opt-key">${String.fromCharCode(65 + idx)}</span><span style="flex:1;">${lbl}</span></button>`;
          }).join("")}
        </div>
        ${quizPickedId !== null ? `
          <div style="margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <span style="font-weight:700;display:inline-flex;align-items:center;gap:5px;">${pickedOk ? `${vIcon("check", 14)} Chính xác! ${esc(w.word)} (${esc(w.pinyin)})` : `${vIcon("x", 14)} Đáp án: ${esc(w.word)} (${esc(w.pinyin)})${w.hanViet ? " · " + esc(w.hanViet) : ""} — ${esc(w.defVi)}`}</span>
            <button class="mode-btn active" onclick="finishCurrentStep(${pickedOk})">Câu tiếp theo →</button>
          </div>
        ` : ""}
      `;
    }

    function renderListenCard(w, forceSub) {
      const sub = forceSub || listenSub;
      const choices = cacheGet("lchoices", () => shuffle([w, ...pickDistractors(w, 3)]));
      const subBtns = !forceSub
        ? `<div class="ctrl-group">
            <button class="pill-toggle ${listenSub==="choice"?"on":""}" onclick="listenSub='choice';bumpCard();renderStage();">Chọn từ</button>
            <button class="pill-toggle ${listenSub==="dictation"?"on":""}" onclick="listenSub='dictation';bumpCard();renderStage();">Gõ chính tả</button>
          </div>`
        : "";

      const pickedOk = quizPickedId === w.id;
      return `
        ${renderCardHeader(w, subBtns)}
        <div class="prompt-banner">${sub === "choice" ? "Nghe phát âm và chọn Chữ Hán" : "Nghe phát âm và gõ Chữ Hán / Pinyin"}</div>
        <div class="fc-box">
          <div class="ctrl-group" style="justify-content:center;">
            <button class="mode-btn active" style="padding:10px 18px;font-size:15px;" onclick="speakWordById('${escJsAttr(w.id)}',false)">${vIcon("volume", 16)}<span>Nghe chuẩn</span></button>
            <button class="mode-btn" style="padding:10px 14px;" onclick="speakWordById('${escJsAttr(w.id)}',true)">${vIcon("clock", 15)}<span>Nghe chậm</span></button>
          </div>
          ${sub === "dictation" ? `<div style="margin-top:10px;font-size:14px;color:var(--muted);">Nghĩa: <b>${esc(w.defVi)}</b>${w.hanViet ? ` · <span style="color:#d97706;">${esc(w.hanViet)}</span>` : ""}</div>` : ""}
        </div>
        ${sub === "choice" ? `
          <div class="opt-grid">
            ${choices.map((c, idx) => {
              let cls = "opt-btn";
              if (quizPickedId !== null) {
                if (c.id === w.id) cls += " ok";
                else if (c.id === quizPickedId) cls += " bad";
              }
              return `<button class="${cls}" onclick="pickChoice('${c.id}')"><span class="opt-key">${String.fromCharCode(65 + idx)}</span><span style="flex:1;"><b style="font-size:21px;">${esc(c.word)}</b>${quizPickedId !== null ? ` <span style="font-size:12.5px;color:var(--muted);">(${esc(c.pinyin)} — ${esc(c.defVi).slice(0, 35)})</span>` : ""}</span></button>`;
            }).join("")}
          </div>
          ${quizPickedId !== null ? `
            <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
              <span style="font-weight:700;display:inline-flex;align-items:center;gap:5px;">${pickedOk ? `${vIcon("check", 14)} Chính xác! ${esc(w.word)} (${esc(w.pinyin)})` : `${vIcon("x", 14)} Đáp án: ${esc(w.word)} (${esc(w.pinyin)}) — ${esc(w.defVi)}`}</span>
              <button class="mode-btn active" onclick="finishCurrentStep(${pickedOk})">Câu tiếp theo →</button>
            </div>` : ""}
        ` : renderTextInputBlock(w, "Gõ Chữ Hán hoặc Pinyin (VD: nihao)...")}
      `;
    }

    function renderClozeCard(w) {
      const c = makeClozeData(w);
      return `
        ${renderCardHeader(w, `<span style="font-size:12px;color:var(--muted);">Gợi ý: <b>${w.word.length} chữ Hán</b></span>`)}
        <div class="prompt-banner">Điền từ còn thiếu (Chữ Hán hoặc Pinyin)</div>
        <div class="fc-box" style="text-align:left;">
          ${c ? `
            <div style="font-size:20px;font-weight:700;line-height:1.6;">${c.html}</div>
            ${c.vi ? `<div style="margin-top:6px;font-size:14px;color:var(--text);font-weight:500;">${esc(c.vi)}</div>` : (c.en ? `<div style="margin-top:6px;font-size:13.5px;color:var(--muted);">${esc(c.en)}</div>` : "")}
          ` : `<div style="font-size:16px;font-weight:700;">${esc(w.defVi)}</div>`}
          <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13.5px;">
            Nghĩa từ cần điền: <b>${esc(w.defVi)}</b>${w.hanViet ? ` · <span style="color:#d97706;font-weight:700;">${esc(w.hanViet)}</span>` : ""}
          </div>
        </div>
        ${renderTextInputBlock(w, "Nhập Chữ Hán hoặc Pinyin...")}
      `;
    }

    function renderTextInputBlock(w, placeholder) {
      const cls = textChecked ? (textChecked.ok ? "spell-input is-ok" : "spell-input is-bad") : "spell-input";
      const val = textChecked && textChecked.userVal ? esc(textChecked.userVal) : "";
      return `<div style="text-align:center;margin-top:14px;">
        <input type="text" id="ansTextInput" class="${cls}" value="${val}" placeholder="${esc(placeholder)}" autocomplete="off" ${textChecked ? "readonly" : ""} onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();if(textChecked)finishCurrentStep(textChecked.ok);else checkTextAnswer();}">
        <div style="margin-top:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">
          ${!textChecked ? `
            <button class="mode-btn active" onclick="checkTextAnswer()">${vIcon("check", 13)}<span>Kiểm tra</span></button>
            <button class="mode-btn" onclick="giveUpTextAnswer()">${vIcon("lightbulb", 13)}<span>Hiện đáp án</span></button>
          ` : `
            <button class="mode-btn active" onclick="finishCurrentStep(${textChecked.ok})">Câu tiếp theo →</button>
          `}
        </div>
        ${textChecked ? `<div style="margin-top:10px;font-weight:700;font-size:14.5px;color:${textChecked.ok ? "var(--ok)" : "var(--danger)"};display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;">
          ${textChecked.ok ? vIcon("check", 14) + "<span>Chính xác!</span>" : vIcon("x", 14) + "<span>Chưa đúng — Đáp án:</span>"}
          <span>${esc(w.word)} (${esc(w.pinyin)})${w.hanViet ? " · " + esc(w.hanViet) : ""}</span>
          <button class="pill-toggle" style="margin-left:6px;" onclick="speakWordById('${escJsAttr(w.id)}',false)" aria-label="Nghe">${vIcon("volume", 13)}</button>
        </div>` : ""}
      </div>`;
    }

    function pickChoice(id) {
      if (quizPickedId !== null) return;
      const w = studyQueue[0];
      quizPickedId = id;
      const ok = id === w.id;
      if (ok && userSettings.autoAudio) speakWord(w, false);
      renderStage();
      if (ok) {
        setTimeout(() => {
          if (quizPickedId === id && studyQueue[0] && studyQueue[0].id === w.id) {
            finishCurrentStep(true);
          }
        }, 650);
      }
    }

    function checkTextAnswer() {
      const w = studyQueue[0];
      const inp = document.getElementById("ansTextInput");
      if (!w || !inp) return;
      const raw = inp.value.trim();
      if (!raw) return;
      const norm = stripDiacritics(raw);
      const pyNorm = stripDiacritics(w.pinyin);
      const pyNormU = pyNorm.replace(/v/g, "u");
      const pyNumNoTone = stripDiacritics((w.pinyinNum || "").replace(/[1-5]/g, ""));
      const pyNumNoToneU = pyNumNoTone.replace(/v/g, "u");
      const pyNumFull = stripDiacritics(w.pinyinNum || "");
      const pyNumFullU = pyNumFull.replace(/v/g, "u");
      const ok =
        raw === w.word ||
        (w.trad && raw === w.trad) ||
        (norm.length > 0 && (
          norm === pyNorm || norm === pyNormU ||
          norm === pyNumNoTone || norm === pyNumNoToneU ||
          norm === pyNumFull || norm === pyNumFullU
        ));
      textChecked = { ok, userVal: raw };
      if (userSettings.autoAudio) speakWord(w, false);
      renderStage();
    }

    function giveUpTextAnswer() {
      const w = studyQueue[0];
      const inp = document.getElementById("ansTextInput");
      textChecked = { ok: false, userVal: inp ? inp.value.trim() : "" };
      if (w && userSettings.autoAudio) speakWord(w, false);
      renderStage();
    }

    function finishCurrentStep(ok) {
      if (currentMode === "smart") completeSmartStep(ok);
      else advanceNonSmart(ok ? 2 : 0);
    }

    function renderMatchCard() {
      if (!matchState) {
        const src = (studyQueue.length >= 4 ? studyQueue : getActiveWords()).slice(0, 6);
        matchState = {
          left: shuffle(src.map((w) => ({ id: w.id, word: w.word, py: w.pinyin }))),
          right: shuffle(src.map((w) => ({ id: w.id, def: w.defVi }))),
          selLeft: null,
          matched: new Set(),
          errId: ""
        };
      }
      const allDone = matchState.matched.size >= matchState.left.length;
      return `
        <div class="card-hdr">
          <b style="display:inline-flex;align-items:center;gap:6px;">${vIcon("grid", 14)}<span>Ghép Chữ Hán với Nghĩa Việt (${matchState.matched.size}/${matchState.left.length})</span></b>
          <button class="pill-toggle" onclick="matchState=null;renderStage();">${vIcon("refresh", 12)}<span>Vòng mới</span></button>
        </div>
        ${allDone ? `<div class="finish-box">
          <div style="color:var(--ok);margin-bottom:4px;">${vIcon("award", 36)}</div>
          <h3 style="margin:8px 0;">Hoàn thành vòng ghép cặp!</h3>
          <button class="mode-btn active" onclick="matchState=null;renderStage();">Chơi vòng tiếp theo →</button>
        </div>` : `<div class="match-grid">
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${matchState.left.map((it) => `<div class="m-card ${matchState.selLeft===it.id?"sel":""} ${matchState.matched.has(it.id)?"matched":""}" onclick="pickMatchLeft('${escJsAttr(it.id)}','${escJsAttr(it.word)}')">
              <div><div style="font-size:22px;">${esc(it.word)}</div><div class="py-el" style="font-size:12px;color:var(--muted);">${esc(it.py)}</div></div>
            </div>`).join("")}
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${matchState.right.map((it) => `<div class="m-card ${matchState.matched.has(it.id)?"matched":""} ${matchState.errId===it.id?"err":""}" style="font-size:13px;line-height:1.35;" onclick="pickMatchRight('${it.id}')">${esc(it.def)}</div>`).join("")}
          </div>
        </div>`}
      `;
    }
    function pickMatchLeft(id, word) {
      matchState.selLeft = id;
      matchState.errId = "";
      const w = resolveWordById(id);
      if (w) speakWord(w, false);
      else speakZh(word, false);
      renderStage();
    }
    function pickMatchRight(id) {
      if (!matchState.selLeft) return;
      if (matchState.selLeft === id) {
        matchState.matched.add(id);
        matchState.selLeft = null;
        if (!extraPracticeMode) rateWordSRS(id, 2);
      } else {
        matchState.errId = id;
      }
      renderStage();
    }

    function renderFinishBox() {
      const pool = getActiveWords();
      const now = Date.now();
      const dueCnt = pool.filter((w) => isDueWord(w, now)).length;
      const unseenCnt = pool.filter((w) => !isTouchedWord(w)).length;
      const hasLearned = pool.some((w) => srsMap[w.id] && !srsMap[w.id].ignored && srsMap[w.id].reps > 0);
      return `<div class="finish-box">
        <div style="color:var(--ok);margin-bottom:4px;">${vIcon("award", 40)}</div>
        <h2 style="margin:8px 0 4px;color:var(--ok);">${extraPracticeMode ? "Xong lượt ôn luyện thêm!" : "Hoàn thành phiên học hôm nay!"}</h2>
        <p style="margin:0;color:var(--muted);font-size:14px;">${sessionDone ? `Bạn đã xử lý ${sessionDone} từ vựng trong phiên này.` : (currentTopic === "__DUE__" ? "Bạn đã ôn xong toàn bộ từ đến hạn!" : "Bạn đã đạt hạn mức từ mới hoặc ôn xong toàn bộ từ đến hạn trong gói này.")}</p>
        <div class="finish-actions">
          ${!extraPracticeMode && dueCnt > 0 ? `<button class="mode-btn active" style="background:#dc2626;border-color:#dc2626;" onclick="startDueNow()">${vIcon("bell", 13)}<span>Ôn ngay ${dueCnt} từ đến hạn</span></button>` : ""}
          ${extraPracticeMode ? `<button class="mode-btn active" onclick="exitPractice()">Quay lại học chính</button>` : ""}
          ${!extraPracticeMode && currentTopic !== "__DUE__" && unseenCnt > 0 ? `<button class="mode-btn active" onclick="addBonusWords(10)">${vIcon("plus", 13)}<span>Học thêm 10 từ mới</span></button>` : ""}
          ${hasLearned ? `<button class="mode-btn" style="background:#16a34a;color:#fff;border-color:#16a34a;" onclick="startExtraPractice()">${vIcon("refresh", 13)}<span>Ôn luyện thêm</span></button>` : ""}
          <button class="mode-btn" onclick="switchMode('list')">${vIcon("book", 13)}<span>Xem danh sách từ</span></button>
        </div>
      </div>`;
    }

    function filterListWords() {
      const qRaw = listSearch.trim();
      const statusPred = (w) => {
        const st = srsMap[w.id];
        const ignored = Boolean(st && st.ignored);
        const learned = Boolean(st && !st.ignored && st.reps > 0);
        if (listFilter === "unseen" && (learned || ignored)) return false;
        if (listFilter === "learned" && !learned) return false;
        if (listFilter === "ignored" && !ignored) return false;
        if (listHsk3Filter !== "all") {
          const targetHsk3 = Number(listHsk3Filter);
          if (Number(w.hsk3 || 0) !== targetHsk3) return false;
        }
        return true;
      };
      if (!qRaw) {
        return getActiveWords().filter(statusPred);
      }
      if (hskSearchIndex && typeof hskSearchIndex.filter === "function") {
        return hskSearchIndex.filter(qRaw, { filterFn: statusPred });
      }
      const qNorm = stripDiacritics(qRaw);
      const qLow = qRaw.toLowerCase();
      return ALL_WORDS.filter((w) => {
        if (!statusPred(w)) return false;
        return (
          w.word.includes(qLow) ||
          (w.trad && w.trad.includes(qLow)) ||
          (qNorm.length > 0 && stripDiacritics(w.pinyin).includes(qNorm)) ||
          (w.hanViet && w.hanViet.toLowerCase().includes(qLow)) ||
          (w.defVi && w.defVi.toLowerCase().includes(qLow))
        );
      });
    }

    function renderListRowsHtml(filtered) {
      const pageSize = 50;
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (listPage > totalPages) listPage = totalPages;
      const slice = filtered.slice((listPage - 1) * pageSize, listPage * pageSize);
      const qList = listSearch.trim();
      const scopeHint = qList
        ? `${vIcon("search", 13)} Đang tra cứu toàn bộ 5,112 từ HSK 1–6 — Khớp <b>${filtered.length.toLocaleString("en-US")}</b> từ (Trang ${listPage}/${totalPages})`
        : `Hiển thị ${slice.length} / ${filtered.length.toLocaleString("en-US")} từ (Trang ${listPage}/${totalPages})`;
      if (!filtered.length) {
        return `
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">${scopeHint}</div>
          <div class="finish-box" style="border-color:var(--border);padding:22px 16px;">
            <div style="color:var(--muted);">${vIcon("search", 28)}</div>
            <div style="font-weight:800;margin-top:6px;">Không tìm thấy từ HSK phù hợp</div>
            ${qList ? `<div style="font-size:13px;color:var(--muted);margin-top:4px;">Từ khóa "<strong>${esc(qList)}</strong>" không khớp từ nào.</div>
            <button type="button" class="mode-btn" style="margin-top:10px;display:inline-flex;align-items:center;gap:6px;" onclick="clearHskListSearch()">${vIcon("x", 13)}<span>Xóa từ khóa</span></button>` : ""}
          </div>
        `;
      }
      return `
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${scopeHint}</div>
        <div>${slice.map((w) => {
          const st = srsMap[w.id];
          const ex = getPrimaryExample(w);
          const statusHtml = st && st.ignored
            ? `<span class="badge-st ign">Đã biết</span> <button class="skip-btn" onclick="markKnownById('${w.id}',false)">${vIcon("refresh", 12)}<span>Học lại</span></button>`
            : (st && st.reps > 0)
              ? `<span class="badge-st">Chu kỳ ${Math.max(1, Math.round(st.interval || 1))} ngày</span>`
              : `<button class="skip-btn" onclick="markKnownById('${w.id}',true)">${vIcon("skip", 12)}<span>Đã biết</span></button>`;
          return `<div class="list-row">
            <div style="min-width:0;flex:1;">
              <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                <span style="font-size:21px;font-weight:800;">${highlightHskText(w.word, qList)}</span>
                <span style="font-size:14.5px;font-weight:700;">${renderPinyinHtml(w)}</span>
                ${w.hanViet ? `<span class="meta-tag hv">${highlightHskText(w.hanViet, qList)}</span>` : ""}
                <span class="meta-tag">HSK ${w.level}</span>
                ${w.hsk3 ? `<span class="meta-tag">HSK 3.0: C${Number(w.hsk3) >= 7 ? "7–9" : w.hsk3}</span>` : ""}
                ${w.radical ? `<span class="meta-tag">Bộ ${esc(w.radical)}</span>` : ""}
                ${statusHtml}
              </div>
              <div style="font-size:14px;margin-top:5px;line-height:1.45;">${highlightHskText(w.defVi || "", qList)}</div>
              ${ex ? `<div style="margin-top:6px;font-size:13.5px;color:var(--ok);line-height:1.5;">• ${highlightWordInSentence(ex.z, w.word)}${ex.p ? ` <span class="py-el" style="color:var(--muted);font-size:12px;">(${esc(ex.p)})</span>` : ""}${ex.v ? `<div style="color:var(--muted);font-size:12.5px;margin-top:2px;">${esc(ex.v)}</div>` : ""}</div>` : ""}
            </div>
            <div class="ctrl-group" style="flex-shrink:0;">
              <a class="pill-toggle" style="text-decoration:none;" href="${writingHref(w)}" title="Tập viết chữ Hán" aria-label="Tập viết chữ Hán">${vIcon("edit", 14)}</a>
              <button class="pill-toggle" onclick="speakWordById('${escJsAttr(w.id)}',false)" title="Nghe phát âm" aria-label="Nghe phát âm">${vIcon("volume", 14)}</button>
            </div>
          </div>`;
        }).join("")}</div>
        ${totalPages > 1 ? `<div style="display:flex;justify-content:center;gap:8px;margin-top:14px;">
          <button class="mode-btn" ${listPage <= 1 ? "disabled" : ""} onclick="listPage--;document.getElementById('listBody').innerHTML=renderListRowsHtml(filterListWords());">← Trước</button>
          <span style="padding:7px 10px;font-size:13px;font-weight:700;">${listPage} / ${totalPages}</span>
          <button class="mode-btn" ${listPage >= totalPages ? "disabled" : ""} onclick="listPage++;document.getElementById('listBody').innerHTML=renderListRowsHtml(filterListWords());">Sau →</button>
        </div>` : ""}
      `;
    }

    function onHskListSearch(val) {
      listSearch = String(val == null ? "" : val);
      listPage = 1;
      const clr = document.getElementById("listSearchClear");
      if (clr) clr.style.display = listSearch.trim() ? "inline-flex" : "none";
      const body = document.getElementById("listBody");
      if (body) body.innerHTML = renderListRowsHtml(filterListWords());
    }
    function clearHskListSearch() {
      listSearch = "";
      listPage = 1;
      const inp = document.getElementById("listSearchInput");
      if (inp) {
        inp.value = "";
        try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
      }
      const clr = document.getElementById("listSearchClear");
      if (clr) clr.style.display = "none";
      const body = document.getElementById("listBody");
      if (body) body.innerHTML = renderListRowsHtml(filterListWords());
    }
    function openQuickHskSearch() {
      if (currentMode !== "list") switchMode("list");
      setTimeout(() => {
        const inp = document.getElementById("listSearchInput");
        if (inp) {
          try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
        }
      }, 30);
    }

    function renderListView() {
      const pool = getActiveWords();
      const cnt = (fn) => pool.filter(fn).length;
      const hasQ = !!listSearch.trim();
      return `
        <div class="search-row">
          <div class="hsk-search-field">
            <input class="search-input" id="listSearchInput" value="${esc(listSearch)}" placeholder="Tìm tức thì trong 5,112 từ (Hán tự, Pinyin ü/v/số thanh, Hán-Việt, nghĩa Việt/Anh không dấu)..." autocomplete="off" oninput="onHskListSearch(this.value)">
            <button type="button" class="hsk-search-clear" id="listSearchClear" style="display:${hasQ ? "inline-flex" : "none"};" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm" onclick="clearHskListSearch()">${vIcon("x", 13)}</button>
          </div>
          <div class="ctrl-group">
            <button class="pill-toggle ${listFilter==="all"?"on":""}" onclick="listFilter='all';listPage=1;renderStage();">Tất cả (${pool.length})</button>
            <button class="pill-toggle ${listFilter==="unseen"?"on":""}" onclick="listFilter='unseen';listPage=1;renderStage();">Chưa học (${cnt(w=>!isTouchedWord(w))})</button>
            <button class="pill-toggle ${listFilter==="learned"?"on":""}" onclick="listFilter='learned';listPage=1;renderStage();">Đang học (${cnt(w=>srsMap[w.id]&&!srsMap[w.id].ignored&&srsMap[w.id].reps>0)})</button>
            <button class="pill-toggle ${listFilter==="ignored"?"on":""}" onclick="listFilter='ignored';listPage=1;renderStage();">Đã biết (${cnt(w=>srsMap[w.id]&&srsMap[w.id].ignored)})</button>
            <select class="limit-select" aria-label="Lọc theo cấp HSK 3.0" onchange="listHsk3Filter=this.value;listPage=1;renderStage();" style="height:31px;font-size:12px;font-weight:700;">
              <option value="all" ${listHsk3Filter==="all"?"selected":""}>HSK 3.0: Tất cả</option>
              <option value="1" ${listHsk3Filter==="1"?"selected":""}>HSK 3.0: Cấp 1</option>
              <option value="2" ${listHsk3Filter==="2"?"selected":""}>HSK 3.0: Cấp 2</option>
              <option value="3" ${listHsk3Filter==="3"?"selected":""}>HSK 3.0: Cấp 3</option>
              <option value="4" ${listHsk3Filter==="4"?"selected":""}>HSK 3.0: Cấp 4</option>
              <option value="5" ${listHsk3Filter==="5"?"selected":""}>HSK 3.0: Cấp 5</option>
              <option value="6" ${listHsk3Filter==="6"?"selected":""}>HSK 3.0: Cấp 6</option>
              <option value="7" ${listHsk3Filter==="7"?"selected":""}>HSK 3.0: Cấp 7–9</option>
            </select>
          </div>
        </div>
        <div id="listBody">${renderListRowsHtml(filterListWords())}</div>
      `;
    }

    function autoPlayIfNeeded() {
      if (lastPlayedSerial === cardSerial || !studyQueue.length || currentMode === "list" || currentMode === "match" || currentMode === "shooter") return;
      lastPlayedSerial = cardSerial;
      const v = studyQueue[0];
      let should = false;
      if (currentMode === "listen") should = true;
      else if (currentMode === "smart") should = ["listen_choice", "dictation"].includes(v._task) || (userSettings.autoAudio && ["intro", "mcq_zh2vi"].includes(v._task));
      else if (currentMode === "flashcard") should = userSettings.autoAudio;
      if (should) setTimeout(() => speakWord(v, false), 150);
    }

    function renderStage() {
      const stage = document.getElementById("stage");
      stage.classList.toggle("hide-py", !userSettings.showPinyin);
      const qBtn = document.getElementById("btnQuickSearchHsk");
      if (qBtn) qBtn.classList.toggle("on", currentMode === "list");

      if (currentMode !== "shooter" && window.HskWordShooter) {
        window.HskWordShooter.unmount();
      }
      if (currentMode === "shooter") {
        if (window.HskWordShooter) {
          window.HskWordShooter.mount(stage, {
            scopeTitle: currentTopic === "__ALL__" ? ("Toàn bộ HSK " + currentLevel) : currentTopic,
            lessonPool: lessonShooterPool,
            getPackWords: () => getActiveWords(),
            getLevelWords: () => WORDS_BY_LEVEL[currentLevel] || ALL_WORDS,
            getSrsReviewWords: () => {
              const lvPool = WORDS_BY_LEVEL[currentLevel] || [];
              const learned = lvPool.filter((w) => {
                const st = srsMap[w.id];
                return st && !st.ignored && (st.reps > 0 || st.lastReview);
              });
              return learned.length >= 4 ? learned : getActiveWords();
            },
            renderPinyin: (w) => renderPinyinHtml(w, true),
            writingHref: (w) => writingHref(w),
            onWordResult: (w, ok) => {
              if (!w || !w.id || !WORDS_BY_ID.has(w.id)) return;
              logActivity(w.id);
              const st = srsMap[w.id];
              const now = Date.now();
              if (st && !st.ignored && (!st.due || now >= st.due)) {
                rateWordSRS(w.id, ok ? 2 : 0);
                renderStatsCard();
                renderSidebar();
              } else if (!ok && st && !st.ignored) {
                st.due = now;
                st.updatedAt = now;
                saveSrs();
                renderStatsCard();
              }
            }
          });
        } else {
          stage.innerHTML = `<div class="finish-box"><h3>${vIcon("alert", 18)} Không nạp được mô-đun Game Bắn từ</h3></div>`;
        }
        return;
      }
      if (currentMode === "list") {
        stage.innerHTML = renderListView();
        return;
      }
      if (currentMode === "match") {
        stage.innerHTML = renderMatchCard();
        return;
      }
      if (!studyQueue.length) {
        stage.innerHTML = renderFinishBox();
        return;
      }

      const w = studyQueue[0];
      if (currentMode === "smart") {
        if (!w._task) pickNextSmartItem(true);
        if (w._task === "intro") stage.innerHTML = renderIntroOrFlashcard(w, true);
        else if (w._task === "mcq_zh2vi") stage.innerHTML = renderQuizCard(w, "zh2vi");
        else if (w._task === "mcq_vi2zh") stage.innerHTML = renderQuizCard(w, "vi2zh");
        else if (w._task === "mcq_zh2py") stage.innerHTML = renderQuizCard(w, "zh2py");
        else if (w._task === "listen_choice") stage.innerHTML = renderListenCard(w, "choice");
        else if (w._task === "dictation") stage.innerHTML = renderListenCard(w, "dictation");
        else stage.innerHTML = renderClozeCard(w);
      } else if (currentMode === "flashcard") {
        stage.innerHTML = renderIntroOrFlashcard(w, false);
      } else if (currentMode === "quiz") {
        stage.innerHTML = renderQuizCard(w, null);
      } else if (currentMode === "listen") {
        stage.innerHTML = renderListenCard(w, null);
      } else {
        stage.innerHTML = renderClozeCard(w);
      }
      autoPlayIfNeeded();
      if (!textChecked) {
        const inp = document.getElementById("ansTextInput");
        if (inp && !inp.readOnly && window.innerWidth > 768) {
          requestAnimationFrame(() => { try { inp.focus(); } catch (e) {} });
        }
      }
    }

    function renderSidebar() {
      document.getElementById("lvTabs").innerHTML = [1, 2, 3, 4, 5, 6].map((lv) => `
        <button class="lv-tab ${lv === currentLevel ? "active" : ""}" onclick="selectLevel(${lv})">HSK ${lv}</button>
      `).join("");

      const lvWords = WORDS_BY_LEVEL[currentLevel] || [];
      const lvDone = lvWords.filter((w) => isTouchedWord(w)).length;
      document.getElementById("lvSubtitle").textContent = `HSK ${currentLevel}: ${lvWords.length.toLocaleString("en-US")} từ (đã học/biết ${lvDone})`;

      const now = Date.now();
      const allDueCount = ALL_WORDS.filter((w) => isDueWord(w, now)).length;
      let html = "";
      if (lessonSrsPool && Array.isArray(lessonSrsPool.words) && lessonSrsPool.words.length) {
        const lesDone = lessonSrsPool.words.filter((w) => isTouchedWord(w)).length;
        html += `<button class="pack-btn ${currentTopic === "__LESSON__" ? "active" : ""}" onclick="selectTopic('__LESSON__')">
          <span style="display:inline-flex;align-items:center;gap:6px;">${vIcon("book", 13)}<span>${esc(lessonSrsPool.title)}</span></span><span class="pack-cnt">${lesDone}/${lessonSrsPool.words.length}</span>
        </button>`;
      }
      if (allDueCount > 0 || currentTopic === "__DUE__") {
        html += `<button class="pack-btn ${currentTopic === "__DUE__" ? "active" : ""}" onclick="selectDueReview()">
          <span style="display:inline-flex;align-items:center;gap:6px;">${vIcon("bell", 13)}<span>Cần ôn hôm nay</span></span><span class="pack-cnt">${allDueCount}</span>
        </button>`;
      }
      html += `<div style="display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--lg-seg-track,rgba(148,163,184,0.16));margin:2px 0 6px;">
        <button type="button" onclick="setHsk1OrderMode('lesson')" style="flex:1;border:none;border-radius:9px;padding:6px 8px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;background:${hsk1OrderMode === "lesson" ? "var(--lg-seg-active,#fff)" : "transparent"};color:${hsk1OrderMode === "lesson" ? "var(--accent)" : "var(--muted)"};">Theo bài giảng</button>
        <button type="button" onclick="setHsk1OrderMode('freq')" style="flex:1;border:none;border-radius:9px;padding:6px 8px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;background:${hsk1OrderMode === "freq" ? "var(--lg-seg-active,#fff)" : "transparent"};color:${hsk1OrderMode === "freq" ? "var(--accent)" : "var(--muted)"};">Theo tần suất</button>
      </div>`;
      const packs = getLevelPacks(currentLevel);
      html += `<button class="pack-btn ${currentTopic === "__ALL__" ? "active" : ""}" onclick="selectTopic('__ALL__')">
        <span style="display:inline-flex;align-items:center;gap:6px;">${vIcon("book", 13)}<span>Toàn bộ HSK ${currentLevel}</span></span><span class="pack-cnt">${lvDone}/${lvWords.length}</span>
      </button>`;
      packs.forEach((p) => {
        const done = p.items.filter((w) => isTouchedWord(w)).length;
        const shortName = p.shortName || p.topic.replace(`HSK ${currentLevel} — `, "");
        html += `<button class="pack-btn ${currentTopic === p.topic ? "active" : ""}" onclick="selectTopic('${escJsAttr(p.topic)}')">
          <span>${esc(shortName)}</span><span class="pack-cnt">${done}/${p.items.length}</span>
        </button>`;
      });
      document.getElementById("packList").innerHTML = html;

      const st = computeScopeStats();
      document.getElementById("packStatsInline").textContent = `Gói: ${st.learning + st.ignored}/${st.total} học • ${st.due} ôn`;
      const titleText = currentTopic === "__LESSON__" && lessonSrsPool
        ? ("Ôn SRS: " + lessonSrsPool.title)
        : (currentTopic === "__DUE__"
          ? (hasDueLevelFilter ? ("Ôn từ đến hạn HSK " + currentLevel) : "Ôn từ HSK đến hạn")
          : (currentTopic === "__ALL__" ? ("Toàn bộ HSK " + currentLevel) : currentTopic));
      document.getElementById("topTitle").textContent = titleText;
    }

    function syncCtrlButtons() {
      document.querySelectorAll("#modeBar .mode-btn").forEach((b) => b.classList.toggle("active", b.dataset.mode === currentMode));
      const bPy = document.getElementById("btnPinyin");
      bPy.classList.toggle("on", userSettings.showPinyin);
      bPy.innerHTML = `${vIcon("eye", 13)}<span>Pinyin: ${userSettings.showPinyin ? "Hiện" : "Ẩn"}</span>`;
      const bT = document.getElementById("btnTone");
      bT.classList.toggle("on", userSettings.toneColor);
      bT.innerHTML = `${vIcon("sparkles", 13)}<span>Màu thanh điệu: ${userSettings.toneColor ? "Bật" : "Tắt"}</span>`;
      const bS = document.getElementById("btnSlow");
      bS.classList.toggle("on", userSettings.slow);
      bS.innerHTML = `${vIcon("clock", 13)}<span>Tốc độ: ${userSettings.slow ? "Chậm 0.7x" : "Chuẩn"}</span>`;
    }

    function renderAll() {
      syncCtrlButtons();
      renderSidebar();
      renderStatsCard();
      renderSessionBar();
      renderStage();
    }

    /* ---------- User Actions ---------- */
    function setHsk1OrderMode(mode) {
      hsk1OrderMode = mode === "freq" ? "freq" : "lesson";
      try { localStorage.setItem("lp_hsk1_vocab_order", hsk1OrderMode); } catch (e) {}
      if (currentTopic !== "__DUE__" && currentTopic !== "__LESSON__") {
        const packs = getLevelPacks(currentLevel);
        selectTopic(packs[0] ? packs[0].topic : "__ALL__");
        return;
      }
      renderAll();
    }
    window.setHsk1OrderMode = setHsk1OrderMode;

    function toggleDrawer(open) { document.body.classList.toggle("drawer-open", Boolean(open) && window.innerWidth <= 1024); }
    window.addEventListener("resize", () => { if (window.innerWidth > 1024 && document.body.classList.contains("drawer-open")) toggleDrawer(false); });
    function togglePanel(p) { panel = panel === p ? "" : p; renderStatsCard(); }
    function togglePinyin() {
      userSettings.showPinyin = !userSettings.showPinyin;
      saveSettings();
      syncCtrlButtons();
      if (currentMode !== "shooter") renderStage();
    }
    function toggleToneColor() {
      userSettings.toneColor = !userSettings.toneColor;
      saveSettings();
      syncCtrlButtons();
      if (currentMode !== "shooter") renderStage();
    }
    function syncDarkBtn() {
      const btn = document.getElementById("btnDarkToggle");
      if (!btn) return;
      const isDark = document.documentElement.classList.contains("dark");
      if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
        window.S4UI.renderThemeButton(btn);
      } else {
        btn.innerHTML = isDark
          ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'
          : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      }
      btn.title = isDark ? "Chuyển sang giao diện Sáng" : "Chuyển sang giao diện Tối";
      const meta = document.getElementById("metaThemeColor");
      if (meta) meta.setAttribute("content", isDark ? "#0d1813" : "#f1f5f9");
    }
    function toggleDarkMode() {
      if (typeof window.toggleDarkModeOnly === "function") {
        window.toggleDarkModeOnly();
        syncDarkBtn();
        return;
      }
      const isDark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", isDark);
      try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
      syncDarkBtn();
    }
    function toggleSlow() { userSettings.slow = !userSettings.slow; saveSettings(); syncCtrlButtons(); }
    function setOpt(key, val) {
      userSettings[key] = val;
      if (key === "dailyNewLimit") userSettings.paceChosen = true;
      saveSettings();
      if (["dailyNewLimit", "reviewCap", "queueOrder"].includes(key)) buildStudyQueue(true);
      renderAll();
    }
    function pickBeginnerPace(limitNum) {
      userSettings.dailyNewLimit = Number(limitNum) || 8;
      userSettings.paceChosen = true;
      saveSettings();
      extraPracticeMode = false;
      buildStudyQueue(true);
      if (window.S4UI && window.S4UI.toast) {
        window.S4UI.toast("success", `Đã đặt nhịp độ học: ${userSettings.dailyNewLimit} từ mới/ngày!`);
      }
      renderAll();
    }
    function dismissBeginnerPace() {
      userSettings.paceChosen = true;
      saveSettings();
      renderStatsCard();
    }
    function selectLevel(lv) {
      hasDueLevelFilter = false;
      currentLevel = lv;
      const packs = getLevelPacks(lv);
      currentTopic = packs[0] ? packs[0].topic : "__ALL__";
      extraPracticeMode = false;
      listPage = 1;
      if (!tryRestoreSession(false)) buildStudyQueue(false);
      renderAll();
    }
    function selectTopic(topic) {
      hasDueLevelFilter = false;
      currentTopic = topic;
      extraPracticeMode = false;
      listPage = 1;
      toggleDrawer(false);
      if (!tryRestoreSession(false)) buildStudyQueue(false);
      renderAll();
    }
    function selectDueReview() {
      hasDueLevelFilter = false;
      currentTopic = "__DUE__";
      extraPracticeMode = false;
      listPage = 1;
      toggleDrawer(false);
      if (!tryRestoreSession(false)) buildStudyQueue(false);
      renderAll();
    }
    function switchMode(mode) {
      currentMode = mode;
      isFlipped = false;
      matchState = null;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length && !studyQueue[0]._task) pickNextSmartItem(true);
      saveSessionState();
      renderAll();
    }
    function restartSession() {
      extraPracticeMode = false;
      buildStudyQueue(true);
      renderAll();
    }
    function addBonusWords(n) {
      const today = getTodayStr();
      if (userSettings.bonusTodayDate !== today) {
        userSettings.bonusTodayDate = today;
        userSettings.bonusTodayCount = 0;
      }
      userSettings.bonusTodayCount = Number(userSettings.bonusTodayCount || 0) + n;
      saveSettings();
      extraPracticeMode = false;
      buildStudyQueue(true);
      renderAll();
    }
    function startDueNow() { extraPracticeMode = false; buildStudyQueue(true); renderAll(); }
    function startExtraPractice() { extraPracticeMode = true; buildStudyQueue(true); renderAll(); }
    function exitPractice() { extraPracticeMode = false; buildStudyQueue(false); renderAll(); }

    document.getElementById("modeBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-btn");
      if (btn) switchMode(btn.dataset.mode);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("drawer-open")) {
        toggleDrawer(false);
        return;
      }
      if (e.isComposing || e.keyCode === 229) return;
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (currentMode === "flashcard" && e.code === "Space") {
        e.preventDefault();
        isFlipped = !isFlipped;
        renderStage();
      } else if (currentMode === "flashcard" && isFlipped && studyQueue.length && ["1", "2", "3", "4"].includes(e.key)) {
        e.preventDefault();
        advanceNonSmart(Number(e.key) - 1);
      } else if (e.code === "Enter" && textChecked) {
        e.preventDefault();
        finishCurrentStep(textChecked.ok);
      } else if (currentMode === "smart" && studyQueue[0] && studyQueue[0]._task === "intro" && e.code === "Enter") {
        e.preventDefault();
        completeSmartStep(true);
      }
    });

    syncDarkBtn();
    const darkToggleBtn = document.getElementById("btnDarkToggle");
    if (darkToggleBtn) darkToggleBtn.addEventListener("click", toggleDarkMode);
    const donateBtn = document.getElementById("btnVocabDonate");
    if (donateBtn) {
      donateBtn.addEventListener("click", () => {
        if (window.S4UI && typeof window.S4UI.openDonateModal === "function") window.S4UI.openDonateModal();
        else window.location.href = "../../index.html?donate=1";
      });
    }
    if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
      window.S4UI.initSmartBackButton({
        element: "#lpBackBtn",
        defaultUrl: "../index.html",
        defaultLabel: "HSK",
        roadmapUrl: "../roadmap/index.html",
        roadmapLabel: "Lộ trình HSK"
      });
    }
    (function bootFromUrl() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const lvParam = Number(sp.get("lv") || sp.get("level") || 0);
        if (lvParam >= 1 && lvParam <= 6) {
          currentLevel = lvParam;
          const bootPacks = getLevelPacks(lvParam);
          currentTopic = bootPacks[0] ? bootPacks[0].topic : "__ALL__";
        }
        const fromLesson = sp.get("fromLesson");
        if (fromLesson) {
          const raw = sessionStorage.getItem("lp_hsk_lesson_srs_pool") || sessionStorage.getItem("lp_hsk_lesson_shooter_pool");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.words) && parsed.words.length) {
              const mapped = parsed.words.map((it) => {
                const hit = WORDS_BY_WORD.get(it.word);
                if (hit) return hit;
                const exObj = (it.ex && it.ex.zh) ? { z: it.ex.zh, p: it.ex.py || "", v: it.ex.vi || "", e: "" } : null;
                const tempCard = {
                  id: "les_" + it.word,
                  level: Number(parsed.level || lvParam || 1),
                  word: it.word,
                  pinyin: it.pinyin || "",
                  hanViet: it.hv || "",
                  pos: it.pos || "",
                  defVi: it.vi || "",
                  ex: exObj
                };
                WORDS_BY_ID.set(tempCard.id, tempCard);
                WORD_BY_ID.set(tempCard.id, tempCard);
                return tempCard;
              });
              lessonShooterPool = { title: parsed.title || "Từ mới bài giảng", words: mapped };
              lessonSrsPool = { id: parsed.id || fromLesson, level: Number(parsed.level || lvParam || 1), title: parsed.title || "Từ mới bài giảng", words: mapped };
            }
          }
        }
        const reqMode = (sp.get("mode") || "").trim();
        if (fromLesson && lessonSrsPool && reqMode !== "shooter") {
          currentTopic = "__LESSON__";
          if (["smart", "flashcard", "quiz", "listen", "match", "cloze", "list"].includes(reqMode)) {
            currentMode = reqMode;
          } else {
            currentMode = "smart";
          }
          if (!tryRestoreSession(false)) buildStudyQueue(true);
          renderAll();
          return;
        }
        if (sp.get("filter") === "due") {
          hasDueLevelFilter = Boolean(lvParam >= 1 && lvParam <= 6);
          currentTopic = "__DUE__";
          const reqMode = (sp.get("mode") || "").trim();
          if (["smart", "flashcard", "quiz", "listen", "match", "cloze", "shooter", "list"].includes(reqMode)) {
            currentMode = reqMode;
          }
          buildStudyQueue(true);
          renderAll();
          return;
        }
        const qParam = sp.get("q");
        if (qParam) {
          listSearch = qParam;
          listFilter = "all";
          listPage = 1;
          currentMode = "list";
          if (!tryRestoreSession(false)) buildStudyQueue(false);
          renderAll();
          return;
        }
        if (sp.get("mode") === "list") {
          currentMode = "list";
          if (!tryRestoreSession(false)) buildStudyQueue(false);
          renderAll();
          return;
        }
        if (sp.get("mode") === "shooter") {
          currentMode = "shooter";
          if (!tryRestoreSession(false)) buildStudyQueue(false);
          renderAll();
          return;
        }
      } catch (e) {}
      if (!tryRestoreSession(true)) buildStudyQueue(false);
      renderAll();
    })();
  </script>
  <script src="../../auth.js?v=37"></script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
