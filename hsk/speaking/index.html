  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      if (s === "ghibli") document.documentElement.classList.add("theme-ghibli");
      if (isDark) document.documentElement.classList.add("dark");
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        var topPx = (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px";
        document.documentElement.style.setProperty("--s4-safe-top", topPx);
        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>

  <script>
    const DONE_KEY = "lp_hsk_speaking_done_v1";
    const RAW_DATA = window.LP_HSK_SPEAKING_DATA || {};
    const DATA = {
      tonePairs: Array.isArray(RAW_DATA.tonePairs) ? RAW_DATA.tonePairs : [],
      shadowingLessons: Array.isArray(RAW_DATA.shadowingLessons) ? RAW_DATA.shadowingLessons : [],
      hskkRepeatSets: Array.isArray(RAW_DATA.hskkRepeatSets) ? RAW_DATA.hskkRepeatSets : [],
      hskkPrompts: Array.isArray(RAW_DATA.hskkPrompts) ? RAW_DATA.hskkPrompts : []
    };
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

    let doneMap = {};
    try { doneMap = JSON.parse(localStorage.getItem(DONE_KEY) || "{}") || {}; } catch (e) {}

    const qsSpk = new URLSearchParams(location.search);
    const reqSpkLv = Number(qsSpk.get("level") || 0);
    const reqSpkId = (qsSpk.get("id") || "").trim();
    const hitTone = reqSpkId ? DATA.tonePairs.find((x) => x.id === reqSpkId) : null;
    const hitShadow = reqSpkId ? DATA.shadowingLessons.find((x) => x.id === reqSpkId) : null;
    const hitRepeat = reqSpkId ? DATA.hskkRepeatSets.find((x) => x.id === reqSpkId) : null;
    const hitHskk = reqSpkId ? DATA.hskkPrompts.find((x) => x.id === reqSpkId) : null;

    let activeTab = hitTone
      ? "tones"
      : (hitShadow
        ? "shadowing"
        : (hitRepeat
          ? "repeat"
          : (hitHskk
            ? "hskk"
            : (reqSpkLv >= 4 ? "hskk" : ((reqSpkLv === 2 || reqSpkLv === 3) ? "shadowing" : "tones")))));
    let deviceCheckMsg = "";
    window.testSpeakerAndMic = async function () {
      deviceCheckMsg = "Đang phát thử âm mẫu '你好 (nǐ hǎo)' và kiểm tra quyền micro...";
      render();
      let audioOk = false;
      try {
        if (window.HskTTS && typeof window.HskTTS.testAudio === "function") {
          audioOk = await window.HskTTS.testAudio();
        }
      } catch (e) {}

      const t = Array.from(normalizeZh(targetZh));

      if (!t.length || !s.length) return 0;
      // Longest Common Subsequence length for fair Mandarin char matching
      const dp = Array.from({ length: t.length + 1 }, () => new Array(s.length + 1).fill(0));
      for (let i = 1; i <= t.length; i++) {
        for (let j = 1; j <= s.length; j++) {
          if (t[i - 1] === s[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
          else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      return Math.min(100, Math.round((dp[t.length][s.length] / t.length) * 100));

      const clean = normalizeZh(transcript);

      const kwList = Array.isArray(meta && meta.keyVocab) ? meta.keyVocab : [];

        const zhOnly = String(rawKw || "").replace(/[^\u4e00-\u9fff\u3400-\u4dbf\u2e80-\u2eff]/g, "");
        if (zhOnly && clean.includes(zhOnly) && !matchedKeywords.includes(zhOnly)) {
          matchedKeywords.push(zhOnly);
        }
      });
      const lenRatio = Math.min(1, spokenChars / Math.max(10, minChars));
      const kwDenom = Math.max(1, Math.min(4, kwList.length));
      const kwRatio = kwList.length ? Math.min(1, matchedKeywords.length / kwDenom) : 1;
      const pct = spokenChars === 0 ? 0 : Math.min(100, Math.round(lenRatio * 65 + kwRatio * 35));
      const sec = Math.max(1, Math.round(durationSec || 1));
      const cpm = Math.round((spokenChars / sec) * 60);
      return {
        mode: "hskk",
        transcript,
        pct,
        spokenChars,
        minChars,
        durationSec: sec,
        cpm,
        matchedKeywords,
        totalKeywords: kwList.length,
        error: ""

    }

    function extractPinyinToneList(pyStr) {
      const parts = String(pyStr || "").toLowerCase().trim().split(/[\s,，。？！·'‘’\-_]+/).filter(Boolean);
      const tones = [];
      parts.forEach((chunk) => {
        const numMatch = /^([a-züv]+)([1-5])$/i.exec(chunk);
        if (numMatch) {
          const t = Number(numMatch[2]);
          tones.push(t === 5 ? 0 : t);
          return;
        }
        const syls = chunk.match(PINYIN_SYL_RE);
        if (!syls || !syls.length) {
          let fallbackTone = 0;
          for (let i = 0; i < chunk.length; i++) {
            if (PINYIN_TONE_CHARS[chunk[i]]) {
              fallbackTone = PINYIN_TONE_CHARS[chunk[i]];
              break;
            }
          }
          if (/[a-z]/i.test(chunk)) tones.push(fallbackTone);
          return;
        }
        syls.forEach((syl) => {
          let t = 0;
          for (let i = 0; i < syl.length; i++) {
            if (PINYIN_TONE_CHARS[syl[i]]) {
              t = PINYIN_TONE_CHARS[syl[i]];
              break;
            }
          }
          tones.push(t);
        });
      });
      return tones;
    }

    function applyMandarinToneSandhi(rawTones) {
      const out = Array.isArray(rawTones) ? rawTones.slice() : [];
      for (let i = 0; i + 1 < out.length; i++) {
        if (out[i] === 3 && out[i + 1] === 3) {
          out[i] = 2;
        }
      }
      return out;
    }

    function extractPinyinTargetTone(pyStr) {
      const eff = applyMandarinToneSandhi(extractPinyinToneList(pyStr));
      for (let i = 0; i < eff.length; i++) {
        if (eff[i] >= 1 && eff[i] <= 4) return eff[i];
      }
      return 0;
    }

    function resolveTargetTonesForKey(key, opts) {
      let rawTones = [];
      if (opts && Array.isArray(opts.targetTones) && opts.targetTones.length) {
        rawTones = opts.targetTones.map((n) => Number(n) || 0);
      } else if (opts && opts.targetPinyin) {
        rawTones = extractPinyinToneList(opts.targetPinyin);
      } else if (opts && Number(opts.targetTone) >= 1 && Number(opts.targetTone) <= 4) {
        rawTones = [Number(opts.targetTone)];
      } else {
        const tpMatch = /^tp_(\d+)_([ab])$/.exec(String(key || ""));
        if (tpMatch) {
          const pair = (DATA.tonePairs || [])[Number(tpMatch[1])];
          const side = pair && pair[tpMatch[2]];
          if (side && side.py) rawTones = extractPinyinToneList(side.py);
        } else {
          const shMatch = /^sh_(.+)_(\d+)$/.exec(String(key || ""));
          if (shMatch) {
            const lesson = (DATA.shadowingLessons || []).find((x) => x.id === shMatch[1]);
            const ln = lesson && lesson.lines && lesson.lines[Number(shMatch[2])];
            if (ln && ln.py) rawTones = extractPinyinToneList(ln.py);
          } else {
            const repMatch = /^rep_(.+)_(\d+)$/.exec(String(key || ""));
            if (repMatch) {
              const rSet = (DATA.hskkRepeatSets || []).find((x) => x.id === repMatch[1]);
              const it = rSet && rSet.items && rSet.items[Number(repMatch[2])];
              if (it && it.py) rawTones = extractPinyinToneList(it.py);
            }
          }
        }
      }
      const effectiveTones = applyMandarinToneSandhi(rawTones);
      const sandhiApplied = rawTones.some((t, idx) => t !== effectiveTones[idx]);
      let primaryTone = 0;
      for (let i = 0; i < effectiveTones.length; i++) {
        if (effectiveTones[i] >= 1 && effectiveTones[i] <= 4) {
          primaryTone = effectiveTones[i];
          break;
        }
      }
      return { rawTones, effectiveTones, sandhiApplied, primaryTone };
    }

    function resolveTargetToneForKey(key, opts) {
      return resolveTargetTonesForKey(key, opts).primaryTone;
    }

    function segmentVoicedContour(contour, kCount) {
      const pts = Array.isArray(contour) ? contour : [];
      const clusters = [];
      let cur = [];
      for (let i = 0; i < pts.length; i++) {
        if (pts[i] > 0) {
          cur.push(pts[i]);
        } else if (cur.length) {
          if (cur.length >= 2) clusters.push(cur);
          cur = [];
        }
      }
      if (cur.length >= 2) clusters.push(cur);

      if (clusters.length === kCount) {
        return clusters;
      }

      const voiced = pts.filter((v) => v > 0);
      if (voiced.length < kCount * 2) return null;
      const segs = [];
      for (let s = 0; s < kCount; s++) {
        const a = Math.floor((s * voiced.length) / kCount);
        const b = Math.floor(((s + 1) * voiced.length) / kCount);
        segs.push(voiced.slice(a, Math.max(a + 2, b)));
      }
      return segs;
    }

    function analyzePitchSegmentStats(vals, globalMeanHz) {
      const n = vals.length;
      if (n < 2 || !(globalMeanHz > 0)) {
        return { detected: 0, slopeSemi: 0, dipSemi: 0, stdSemi: 0, relSemi: 0, minRelSemi: 0, rangeSemi: 0, turnPos: 0.5 };
      }
      let sum = 0;
      let minHz = vals[0];
      let maxHz = vals[0];
      let minIdx = 0;
      for (let i = 0; i < n; i++) {
        const v = vals[i];
        sum += v;
        if (v < minHz) { minHz = v; minIdx = i; }
        if (v > maxHz) maxHz = v;
      }
      const meanHz = sum / n;
      const tSpan = Math.max(1, n - 1);
      let varSemi = 0;
      let sumU = 0, sumS = 0, sumUU = 0, sumUS = 0;
      for (let i = 0; i < n; i++) {
        const semi = 12 * Math.log(vals[i] / meanHz) / Math.LN2;
        const u = i / tSpan;
        varSemi += semi * semi;
        sumU += u;
        sumS += semi;
        sumUU += u * u;
        sumUS += u * semi;
      }
      const stdSemi = Math.sqrt(varSemi / n);
      const denom = n * sumUU - sumU * sumU;
      const slopeSemi = denom > 1e-6 ? ((n * sumUS - sumU * sumS) / denom) : 0;
      const turnPos = minIdx / tSpan;
      const edge = Math.max(1, Math.floor(n / 4));
      let sAvg = 0, eAvg = 0;
      for (let i = 0; i < edge; i++) {
        sAvg += vals[i];
        eAvg += vals[n - 1 - i];
      }
      sAvg /= edge;
      eAvg /= edge;
      const lowEdge = Math.min(sAvg, eAvg);
      const dipSemi = (minHz > 0 && lowEdge > minHz) ? (12 * Math.log(lowEdge / minHz) / Math.LN2) : 0;
      const relSemi = 12 * Math.log(meanHz / globalMeanHz) / Math.LN2;
      const minRelSemi = 12 * Math.log(minHz / globalMeanHz) / Math.LN2;
      const rangeSemi = (minHz > 0 && maxHz > minHz) ? (12 * Math.log(maxHz / minHz) / Math.LN2) : 0;

      let detected = 1;
      if (dipSemi >= 1.3 && turnPos >= 0.16 && turnPos <= 0.88) detected = 3;
      else if (slopeSemi >= 1.8) detected = 2;
      else if (slopeSemi <= -1.8) detected = 4;
      else if (Math.abs(slopeSemi) < 1.8 && stdSemi < 1.7) detected = 1;
      else detected = slopeSemi > 0 ? 2 : 4;

      return { detected, slopeSemi, dipSemi, stdSemi, relSemi, minRelSemi, rangeSemi, turnPos };
    }

    function scoreSingleToneSegment(stats, targetTone, isFinalSyllable) {
      const clampPct = (v, lo, hi) => Math.round(Math.max(lo, Math.min(hi, v)));
      if (targetTone === 0) {
        if (stats.slopeSemi >= 2.2) {
          return { detected: 2, pct: clampPct(48 - stats.slopeSemi * 4, 15, 45) };
        }
        if (stats.slopeSemi <= -2.2 && stats.rangeSemi >= 3.8 && stats.relSemi > 0.5) {
          return { detected: 4, pct: clampPct(58 - (-stats.slopeSemi) * 4, 18, 52) };
        }
        if (stats.relSemi <= 1.2 && stats.rangeSemi < 3.8) {
          return { detected: 0, pct: clampPct(92 - Math.max(0, stats.relSemi) * 10 - stats.rangeSemi * 3, 72, 97) };
        }
        return { detected: stats.detected, pct: clampPct(72 - Math.abs(stats.relSemi) * 6, 35, 76) };
      }
      if (targetTone === 1) {
        if (stats.detected === 1) return { detected: 1, pct: clampPct(96 - Math.abs(stats.slopeSemi) * 10 - stats.stdSemi * 8, 76, 98) };
        return { detected: stats.detected, pct: clampPct(78 - Math.abs(stats.slopeSemi) * 10 - stats.stdSemi * 8, 12, 75) };
      }
      if (targetTone === 2) {
        if (stats.detected === 2) return { detected: 2, pct: clampPct(74 + Math.min(24, stats.slopeSemi * 4.5), 76, 99) };
        return { detected: stats.detected, pct: stats.slopeSemi > 0 ? clampPct(48 + stats.slopeSemi * 10, 32, 74) : clampPct(34 + stats.slopeSemi * 4, 10, 34) };
      }
      if (targetTone === 3) {
        if (stats.detected === 3) return { detected: 3, pct: clampPct(76 + stats.dipSemi * 4.5, 78, 99) };
        // Nửa Thanh 3 (Half-3rd [21]): khi đứng trước âm tiết khác (1/2/4/0), giọng trầm thấp xuống đáy là đạt chuẩn bản ngữ
        const isHalfThird = !isFinalSyllable && stats.minRelSemi <= -0.9 && stats.relSemi <= 1.0 && stats.slopeSemi <= 1.5;
        if (isHalfThird) {
          return { detected: 3, pct: clampPct(82 - Math.max(0, stats.relSemi) * 8 + Math.min(12, Math.abs(stats.minRelSemi) * 4), 74, 95) };
        }
        if (stats.relSemi <= -1.2 && stats.slopeSemi < 1.2) {
          return { detected: stats.detected, pct: clampPct(66 + Math.min(12, Math.abs(stats.minRelSemi) * 3), 45, 78) };
        }
        return { detected: stats.detected, pct: clampPct(38 + stats.dipSemi * 8, 12, 62) };
      }
      if (targetTone === 4) {
        if (stats.detected === 4) return { detected: 4, pct: clampPct(74 + Math.min(24, (-stats.slopeSemi) * 4.5), 76, 99) };
        return { detected: stats.detected, pct: stats.slopeSemi < 0 ? clampPct(48 + (-stats.slopeSemi) * 10, 32, 74) : clampPct(34 - stats.slopeSemi * 4, 10, 34) };
      }
      return { detected: stats.detected, pct: 0 };
    }

    function evaluateMultiSyllableTones(acoustic, rawTonesInput) {
      const rawTones = Array.isArray(rawTonesInput) ? rawTonesInput : [];
      if (rawTones.length < 2 || rawTones.length > 6 || !acoustic || !Array.isArray(acoustic.pitchContour)) {
        return null;
      }
      const effectiveTones = applyMandarinToneSandhi(rawTones);
      const segments = segmentVoicedContour(acoustic.pitchContour, effectiveTones.length);
      if (!segments) return null;

      const voicedAll = acoustic.pitchContour.filter((v) => v > 0);
      const globalMean = acoustic.pitchMeanHz > 0
        ? acoustic.pitchMeanHz
        : (voicedAll.reduce((a, b) => a + b, 0) / Math.max(1, voicedAll.length));

      let sumPct = 0;
      const perSyllable = effectiveTones.map((tgt, idx) => {
        const stats = analyzePitchSegmentStats(segments[idx], globalMean);
        const scored = scoreSingleToneSegment(stats, tgt, idx === effectiveTones.length - 1);
        sumPct += scored.pct;
        return {
          target: tgt,
          rawTarget: rawTones[idx],
          detected: scored.detected,
          pct: scored.pct,
          slopeSemi: Math.round(stats.slopeSemi * 10) / 10
        };
      });

      return {
        rawTones,
        effectiveTones,
        sandhiApplied: rawTones.some((t, i) => t !== effectiveTones[i]),
        perSyllable,
        detectedTones: perSyllable.map((x) => x.detected),
        overallMatchPct: Math.round(sumPct / effectiveTones.length)
      };
    }

    function renderPitchContourSvg(acoustic, targetTone, targetTonesOpt) {
      if (!acoustic || !(acoustic.voicedFrames > 0)) return "";
      const pts = Array.isArray(acoustic.pitchContour) ? acoustic.pitchContour : [];
      const voiced = pts.filter((v) => v > 0);
      if (voiced.length < 2) return "";

      const rawList = Array.isArray(targetTonesOpt) && targetTonesOpt.length
        ? targetTonesOpt
        : (Array.isArray(acoustic.targetTones) && acoustic.targetTones.length
          ? acoustic.targetTones
          : ((targetTone >= 1 && targetTone <= 4) ? [targetTone] : []));
      const multiEval = (rawList.length >= 2 && rawList.length <= 6)
        ? (acoustic.multiToneEval || evaluateMultiSyllableTones(acoustic, rawList))
        : null;

      const W = 260;
      const H = 64;
      const padX = 8;
      const padY = 8;
      const minHz = Math.max(55, (acoustic.pitchMinHz || Math.min(...voiced)) - 15);
      const maxHz = Math.min(520, Math.max(minHz + 30, (acoustic.pitchMaxHz || Math.max(...voiced)) + 15));
      const spanHz = maxHz - minHz;
      const stepX = pts.length > 1 ? (W - padX * 2) / (pts.length - 1) : 0;

      const segments = [];
      let curSeg = [];
      let dotsHtml = "";
      pts.forEach((f0, idx) => {
        if (f0 > 0) {
          const x = (padX + idx * stepX).toFixed(1);
          const y = (H - padY - ((f0 - minHz) / spanHz) * (H - padY * 2)).toFixed(1);
          curSeg.push(`${x},${y}`);
          if (idx % Math.max(1, Math.floor(pts.length / 16)) === 0) {
            dotsHtml += `<circle cx="${x}" cy="${y}" r="2.1" fill="#ec4899"></circle>`;
          }
        } else if (curSeg.length) {
          segments.push(curSeg);
          curSeg = [];
        }
      });
      if (curSeg.length) segments.push(curSeg);

      const polylines = segments
        .filter((seg) => seg.length >= 2)
        .map((seg) => `<polyline fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${seg.join(" ")}"></polyline>`)
        .join("");

      const detectedTone = Number(acoustic.detectedTone) || 0;
      let detectedLabel = TONE_LABELS[detectedTone] || "Đo đường nét F0";
      let tgtLabel = (targetTone >= 1 && targetTone <= 4) ? TONE_LABELS[targetTone] : "";
      let matchPctVal = (typeof acoustic.toneMatchPct === "number" && targetTone >= 1 && targetTone <= 4) ? acoustic.toneMatchPct : null;

      if (multiEval) {
        detectedLabel = multiEval.detectedTones.map((t) => TONE_SHORT[t] || "T?").join(" → ");
        const tgtStr = multiEval.effectiveTones.map((t) => TONE_SHORT[t] || "T?").join(" + ");
        tgtLabel = multiEval.sandhiApplied ? `${tgtStr} (biến điệu ${multiEval.rawTones.join("+")})` : tgtStr;
        matchPctVal = multiEval.overallMatchPct;
      }

      const matchBadge = typeof matchPctVal === "number"
        ? `<span class="${matchPctVal >= 75 ? "score-ok" : (matchPctVal >= 50 ? "score-mid" : "score-low")}">Khớp thanh điệu: ${matchPctVal}%</span>`
        : "";

      return `
        <div class="sr-f0-box">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:5px;">
            <span style="display:inline-flex;align-items:center;gap:5px;">${spkSvg("music", 13)} <b>Đường nét F0 (Wasm):</b> ${esc(detectedLabel)}${(!multiEval && acoustic.toneConfidence) ? ` (${acoustic.toneConfidence}%)` : ""}${tgtLabel ? ` • Mục tiêu: <b>${esc(tgtLabel)}</b>` : ""}</span>
            ${matchBadge}
          </div>
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:360px;height:64px;display:block;background:var(--wash);border-radius:8px;border:1px solid var(--divider);" aria-label="Biểu đồ cao độ F0">
            <line x1="0" y1="16" x2="${W}" y2="16" stroke="currentColor" stroke-opacity="0.08" stroke-dasharray="3 3"></line>
            <line x1="0" y1="32" x2="${W}" y2="32" stroke="currentColor" stroke-opacity="0.1" stroke-dasharray="3 3"></line>
            <line x1="0" y1="48" x2="${W}" y2="48" stroke="currentColor" stroke-opacity="0.08" stroke-dasharray="3 3"></line>
            ${polylines}
            ${dotsHtml}
          </svg>
          <div style="margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;">
            <span>Cao độ TB: <b>${acoustic.pitchMeanHz || 0} Hz</b> (±${acoustic.pitchStdSemitones || 0} ST)</span>
            <span>Độ dốc: <b>${acoustic.pitchSlopeSemitones > 0 ? "+" : ""}${acoustic.pitchSlopeSemitones || 0} ST</b></span>
            <span>Trôi chảy: <b>${acoustic.fluencySignalScore || 0}%</b></span>
            <span>Độ rõ: <b>${acoustic.snrDb || 0} dB</b></span>
          </div>
        </div>
      `;
    }

    function stopMediaRecorderOnly(releaseHardware) {
      if (activeMediaRec) {
        try {
          if (activeMediaRec.state === "recording" && typeof activeMediaRec.requestData === "function") {
            activeMediaRec.requestData();
          }
          if (activeMediaRec.state !== "inactive") activeMediaRec.stop();
        } catch (e) {}
      }
      if (releaseHardware) {
        releaseWarmMicStream();
      } else if (warmMediaStream) {
        scheduleWarmMicIdleRelease();
      }
    }

    function startAudioCapture(key, doneIdToMark, targetTone, targetTonesList) {
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" || typeof window.MediaRecorder === "undefined") {
        return;
      }
      const rawTonesSnap = Array.isArray(targetTonesList) ? targetTonesList.slice() : [];
      activeMediaChunks = [];
      acquireHskVoiceStream().then((stream) => {
        if (!stream || recordingKey !== key) {
          if (warmMediaStream) scheduleWarmMicIdleRelease();
          return;
        }
        activeMediaStream = stream;
        try {
          const mr = createHskVoiceRecorder(stream);
          activeMediaRec = mr;
          mr.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) activeMediaChunks.push(ev.data);
          };
          mr.onstop = () => {
            const chunks = activeMediaChunks.slice();
            activeMediaChunks = [];
            activeMediaRec = null;
            const recMime = mr.mimeType || mr._lpPreferredMime || "audio/webm";
            const durSec = Math.max(1, Math.round((Date.now() - recStartTs) / 1000));
            if (chunks.length) {
              const blob = new Blob(chunks, { type: recMime });
              const url = URL.createObjectURL(blob);
              revokeKeyAudioUrl(key);
              if (!recResults[key] || recResults[key].mode === "audio_only") {
                const prevAc = recResults[key] && recResults[key].acoustic ? recResults[key].acoustic : null;
                recResults[key] = { mode: "audio_only", transcript: "", pct: 0, error: "", audioUrl: url, durationSec: durSec, targetTone: targetTone || 0, targetTones: rawTonesSnap, acoustic: prevAc };
              } else {
                recResults[key].audioUrl = url;
                if (!recResults[key].durationSec) recResults[key].durationSec = durSec;
                if (targetTone && !recResults[key].targetTone) recResults[key].targetTone = targetTone;
                if (rawTonesSnap.length && (!recResults[key].targetTones || !recResults[key].targetTones.length)) recResults[key].targetTones = rawTonesSnap;
              }
              render();

              if (window.S4Whisper && typeof window.S4Whisper.analyzeBlobAcoustics === "function") {
                window.S4Whisper.analyzeBlobAcoustics(blob, {
                  targetTone: targetTone || 0,
                  maxContourPoints: 84
                }).then((acRes) => {
                  if (!acRes || !acRes.acoustic || !recResults[key] || recResults[key].audioUrl !== url) return;
                  const ac = acRes.acoustic;
                  if (rawTonesSnap.length >= 2 && rawTonesSnap.length <= 6) {
                    const multi = evaluateMultiSyllableTones(ac, rawTonesSnap);
                    if (multi) ac.multiToneEval = multi;
                  }
                  recResults[key].acoustic = ac;
                  recResults[key].targetTone = targetTone || 0;
                  recResults[key].targetTones = rawTonesSnap;
                  if (recResults[key].mode === "audio_only" && !acRes.silent && ac.voicedFrames >= 3) {
                    const effectiveMatchPct = ac.multiToneEval
                      ? ac.multiToneEval.overallMatchPct
                      : (typeof ac.toneMatchPct === "number" ? ac.toneMatchPct : null);
                    const acPct = (effectiveMatchPct !== null)
                      ? Math.round(effectiveMatchPct * 0.72 + (ac.clarityScore || 0) * 0.28)
                      : Math.round((ac.fluencySignalScore || 0) * 0.55 + (ac.clarityScore || 0) * 0.45);
                    recResults[key].pct = Math.max(1, Math.min(100, acPct));
                    if (doneIdToMark && recResults[key].pct >= 65) {
                      doneMap[doneIdToMark] = true;
                      try { localStorage.setItem(DONE_KEY, JSON.stringify(doneMap)); } catch (e) {}
                    }
                  }
                  render();
                }).catch(() => {});
              }
            }
          };
          mr.start(250);
        } catch (e) {
          releaseWarmMicStream();
        }
      }).catch(() => {});
    }

    function finalizeContinuousHskk(key, curMeta, doneIdToMark) {
      if (!curMeta) return;
      const finalTxt = ((curMeta.committedBuf || "") + (curMeta.sessionFinalBuf || "") + (curMeta.interimBuf || "")).trim();
      const elapsed = Math.max(1, (Date.now() - recStartTs) / 1000);
      if (finalTxt) {
        const prevUrl = recResults[key] && recResults[key].audioUrl ? recResults[key].audioUrl : "";
        const prevAc = recResults[key] && recResults[key].acoustic ? recResults[key].acoustic : null;
        if (curMeta.mode === "match") {
          const pct = calcMatchPct(curMeta.targetZh || "", finalTxt);
          recResults[key] = {
            mode: "match",
            transcript: finalTxt,
            pct,
            error: "",
            audioUrl: prevUrl,
            durationSec: Math.max(1, Math.round(elapsed)),
            targetTone: curMeta.targetTone || 0,
            targetTones: Array.isArray(curMeta.targetTones) ? curMeta.targetTones.slice() : [],
            acoustic: prevAc
          };
          if (doneIdToMark && pct >= 60) {
            doneMap[doneIdToMark] = true;
            try { localStorage.setItem(DONE_KEY, JSON.stringify(doneMap)); } catch (e) {}
          }
          return;
        }
        const evalRes = evaluateHskkSpeech(finalTxt, curMeta, elapsed);
        evalRes.audioUrl = prevUrl;
        evalRes.acoustic = prevAc;
        evalRes.targetTone = curMeta.targetTone || 0;
        evalRes.targetTones = Array.isArray(curMeta.targetTones) ? curMeta.targetTones.slice() : [];
        recResults[key] = evalRes;
        if (doneIdToMark && (evalRes.spokenChars >= Math.min(15, evalRes.minChars) || evalRes.pct >= 55)) {
          doneMap[doneIdToMark] = true;
          try { localStorage.setItem(DONE_KEY, JSON.stringify(doneMap)); } catch (e) {}
        }
      }
    }

    function stopRecording(graceful) {
      if (tailFlushTimer) {
        clearTimeout(tailFlushTimer);
        tailFlushTimer = null;
      }
      isStoppingRec = false;
      if (recSessionMeta && recSessionMeta.restartTimer) {
        clearTimeout(recSessionMeta.restartTimer);
        recSessionMeta.restartTimer = null;
      }
      if (recSessionMeta) {
        recSessionMeta.userStopped = true;
      }
      if (activeRec) {
        try {
          if (graceful && typeof activeRec.stop === "function") activeRec.stop();
          else activeRec.abort();
        } catch (e) {}
        if (!graceful) activeRec = null;
      }
      stopMediaRecorderOnly(false);
      if (!graceful) {
        recordingKey = null;
        recSessionMeta = null;
      }
    }

    function startSpeechCheck(key, targetZh, doneIdToMark, opts) {
      if (recordingKey === key) {
        if (isStoppingRec) return;
        const doGracefulStop = () => {
          tailFlushTimer = null;
          isStoppingRec = false;
          if (recordingKey !== key) return;
          const wasContinuous = Boolean(recSessionMeta && recSessionMeta.continuous);
          const curMeta = recSessionMeta;
          if (wasContinuous && curMeta) {
            finalizeContinuousHskk(key, curMeta, doneIdToMark);
          }
          recordingKey = null;
          stopRecording(true);
          activeRec = null;
          recSessionMeta = null;
          render();
        };
        if ((Date.now() - recStartTs) >= 400) {
          isStoppingRec = true;
          const activeBtn = document.querySelector(".mic-btn.recording");
          if (activeBtn) activeBtn.innerHTML = `${spkSvg("clock", 14)} Đang chốt âm...`;
          tailFlushTimer = setTimeout(doGracefulStop, TAIL_FLUSH_MS);
        } else {
          doGracefulStop();
        }
        return;
      }
      stopZh();
      stopRecording(false);

      const isHskk = Boolean(opts && opts.mode === "hskk");
      const isContinuousMatch = Boolean(opts && opts.mode === "continuous_match");
      const isContinuous = isHskk || isContinuousMatch;
      const toneMeta = resolveTargetTonesForKey(key, opts);
      const targetTone = toneMeta.primaryTone;
      const targetTonesList = toneMeta.rawTones;
      recStartTs = Date.now();
      recSessionMeta = {
        key,
        doneIdToMark,
        targetZh: targetZh || "",
        targetTone,
        targetTones: targetTonesList,
        mode: isHskk ? "hskk" : "match",
        continuous: isContinuous,
        keyVocab: (opts && opts.keyVocab) || [],
        minChars: (opts && opts.minChars) || 25,
        committedBuf: "",
        sessionFinalBuf: "",
        interimBuf: "",
        userStopped: false,
        sttFatal: false,
        emptyRestarts: 0,
        restartTimer: null
      };

      if (!SpeechRec) {
        if (navigator.mediaDevices && typeof window.MediaRecorder !== "undefined") {
          recordingKey = key;
          recResults[key] = {
            mode: "audio_only",
            transcript: "",
            pct: 0,
            audioUrl: "",
            targetTone,
            targetTones: targetTonesList,
            acoustic: null,
            error: ""
          };
          startAudioCapture(key, doneIdToMark, targetTone, targetTonesList);
          render();
          return;
        }
        recResults[key] = {
          transcript: "",
          pct: 0,
          error: "Trình duyệt hiện tại chưa hỗ trợ Web Speech API (nhận diện giọng nói). Hãy dùng Chrome / Edge / Android Chrome hoặc bấm nút Đánh dấu hoàn thành bên cạnh."
        };
        recSessionMeta = null;
        render();
        return;
      }

      try {
        const rec = new SpeechRec();
        rec.lang = "zh-CN";
        rec.continuous = isContinuous;
        rec.interimResults = isContinuous;
        rec.maxAlternatives = 1;
        recordingKey = key;
        activeRec = rec;
        startAudioCapture(key, doneIdToMark, targetTone, targetTonesList);
        render();

        rec.onresult = (ev) => {
          if (isContinuous) {
            let fin = "";
            let inter = "";
            for (let i = 0; i < ev.results.length; i++) {
              const seg = (ev.results[i][0] && ev.results[i][0].transcript) || "";
              if (ev.results[i].isFinal) fin += seg;
              else inter += seg;
            }
            if (recSessionMeta && recSessionMeta.key === key) {
              recSessionMeta.sessionFinalBuf = fin;
              recSessionMeta.interimBuf = inter;
              if (fin || inter) recSessionMeta.emptyRestarts = 0;
            }
            const combined = ((recSessionMeta ? recSessionMeta.committedBuf : "") + fin + inter).trim();
            const liveEl = document.getElementById("srLive_" + key);
            if (liveEl) {
              liveEl.textContent = combined || "Đang lắng nghe tiếng Trung (zh-CN)...";
            }
            return;
          }
          const transcript = (ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || "";
          const pct = calcMatchPct(targetZh, transcript);
          const prevUrl = recResults[key] && recResults[key].audioUrl ? recResults[key].audioUrl : "";
          const prevAc = recResults[key] && recResults[key].acoustic ? recResults[key].acoustic : null;
          recResults[key] = { mode: "match", transcript, pct, error: "", audioUrl: prevUrl, targetTone, targetTones: targetTonesList, acoustic: prevAc };
          if (doneIdToMark && pct >= 60) {
            doneMap[doneIdToMark] = true;
            try { localStorage.setItem(DONE_KEY, JSON.stringify(doneMap)); } catch (e) {}
          }
          recordingKey = null;
          activeRec = null;
          recSessionMeta = null;
          stopMediaRecorderOnly(false);
          render();
        };

        rec.onerror = (ev) => {
          if (isContinuous && recordingKey === key && recSessionMeta && !recSessionMeta.userStopped) {
            if (ev.error === "no-speech" || ev.error === "aborted") {
              return;
            }
            if (activeMediaRec && activeMediaRec.state === "recording" && (ev.error === "audio-capture" || ev.error === "service-not-allowed" || (isAndroidMobile() && ev.error === "network"))) {
              recSessionMeta.sttFatal = true;
              activeRec = null;
              return;
            }
            const existingSpoken = ((recSessionMeta.committedBuf || "") + (recSessionMeta.sessionFinalBuf || "")).trim();
            if (existingSpoken.length > 0) {
              finalizeContinuousHskk(key, recSessionMeta, doneIdToMark);
              recordingKey = null;
              activeRec = null;
              recSessionMeta = null;
              stopMediaRecorderOnly(false);
              render();
              return;
            }
          }
          if (!isContinuous && activeMediaRec && activeMediaRec.state === "recording" && (ev.error === "audio-capture" || ev.error === "service-not-allowed")) {
            activeRec = null;
            return;
          }
          let msg = "Không thu được giọng nói. Vui lòng kiểm tra micro và thử lại.";
          if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
            msg = "Trình duyệt chưa được cấp quyền Micro. Hãy bấm biểu tượng ổ khóa trên thanh địa chỉ để cho phép Micro (hoặc mở qua localhost/HTTPS).";
          } else if (ev.error === "no-speech") {
            msg = "Không phát hiện thấy tiếng nói. Hãy đưa micro lại gần và nói rõ thanh điệu tiếng Trung.";
          } else if (ev.error === "network") {
            msg = "Web Speech Recognition cần kết nối mạng để nhận diện giọng nói zh-CN.";
          }
          const prevUrl = recResults[key] && recResults[key].audioUrl ? recResults[key].audioUrl : "";
          const prevAc = recResults[key] && recResults[key].acoustic ? recResults[key].acoustic : null;
          recResults[key] = { transcript: "", pct: 0, error: msg, audioUrl: prevUrl, targetTone, targetTones: targetTonesList, acoustic: prevAc };
          recordingKey = null;
          activeRec = null;
          recSessionMeta = null;
          stopMediaRecorderOnly(false);
          render();
        };

        rec.onend = () => {
          if (recordingKey === key) {
            if (isContinuous && recSessionMeta && recSessionMeta.key === key) {
              if (recSessionMeta.sessionFinalBuf) {
                recSessionMeta.committedBuf += recSessionMeta.sessionFinalBuf;
                recSessionMeta.sessionFinalBuf = "";
              } else {
                recSessionMeta.emptyRestarts = (recSessionMeta.emptyRestarts || 0) + 1;
              }
              recSessionMeta.interimBuf = "";
              const hasActiveMr = Boolean(activeMediaRec && activeMediaRec.state === "recording");
              if (!recSessionMeta.userStopped && !recSessionMeta.sttFatal && !isIosSafariLike() && recSessionMeta.emptyRestarts <= 8) {
                const snapMeta = recSessionMeta;
                snapMeta.restartTimer = setTimeout(() => {
                  if (recordingKey !== key || recSessionMeta !== snapMeta || snapMeta.userStopped || snapMeta.sttFatal) return;
                  try {
                    rec.start();
                  } catch (e) {
                    snapMeta.sttFatal = true;
                  }
                }, 160);
                return;
              }
              if (isIosSafariLike() && !recSessionMeta.userStopped && hasActiveMr) {
                recSessionMeta.sttFatal = true;
                activeRec = null;
                return;
              }
              finalizeContinuousHskk(key, recSessionMeta, doneIdToMark);
            }
            recordingKey = null;
            activeRec = null;
            recSessionMeta = null;
            stopMediaRecorderOnly(false);
            render();
          }
        };

        rec.start();
      } catch (err) {
        recResults[key] = {
          transcript: "",
          pct: 0,
          error: "Không thể khởi động nhận diện giọng nói trên trình duyệt này. Bạn vẫn có thể nghe mẫu và tự luyện đọc."
        };
        recordingKey = null;
        activeRec = null;
        recSessionMeta = null;
        stopMediaRecorderOnly(false);
        render();
      }
    }

    function stripSearchAccents(s) {
      return String(s || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .trim();
    }

    function matchSearchText(fields, rawQuery) {
      const qRaw = String(rawQuery || "").trim().toLowerCase();
      if (!qRaw) return true;
      const qNorm = stripSearchAccents(qRaw);
      const joinedRaw = fields.map((f) => String(f || "")).join(" ").toLowerCase();
      if (joinedRaw.includes(qRaw)) return true;
      if (qNorm && stripSearchAccents(joinedRaw).includes(qNorm)) return true;
      return false;
    }

    function updateTimerDom() {
      const lbl = document.getElementById("hskkTimerLabel");
      const num = document.getElementById("hskkTimerNum");
      const stopBtn = document.getElementById("hskkTimerStopBtn");
      let curTimerItem = null;
      if (activeTab === "repeat") {
        curTimerItem = DATA.hskkRepeatSets.find((r) => r.id === activeRepeatId) || DATA.hskkRepeatSets[0];
      } else {
        curTimerItem = DATA.hskkPrompts.find((p) => p.id === activeHskkId) || DATA.hskkPrompts[0];
      }
      if (lbl) {
        lbl.innerHTML = timerPhase === "prep"
          ? `${spkSvg("clock", 14)} Đang chuẩn bị:`
          : (timerPhase === "speak" ? `${spkSvg("mic", 14)} Đang trả lời:` : `${spkSvg("clock", 14)} Đồng hồ thi HSKK:`);
      }
      if (num) {
        const pSec = curTimerItem && curTimerItem.prepSeconds ? curTimerItem.prepSeconds : 60;
        const sSec = curTimerItem && curTimerItem.speakSeconds ? curTimerItem.speakSeconds : 120;
        num.textContent = timerPhase === "idle"
          ? (curTimerItem ? `${pSec}s / ${sSec}s` : "0s")
          : `${timerLeft}s`;
      }
      if (stopBtn) {
        stopBtn.style.display = timerPhase !== "idle" ? "" : "none";
      }
    }

    function stopTimer() {
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      timerPhase = "idle";
      timerLeft = 0;
      updateTimerDom();
    }

    function startTimer(phase, seconds) {
      stopTimer();
      timerPhase = phase;
      timerLeft = seconds;
      updateTimerDom();
      timerHandle = setInterval(() => {
        timerLeft--;
        if (timerLeft <= 0) {
          stopTimer();
          if (window.S4UI && window.S4UI.toast) {
            window.S4UI.toast("info", phase === "prep" ? "Hết giờ chuẩn bị! Bắt đầu nói." : "Hết giờ trả lời!");
          }
          return;
        }
        updateTimerDom();
      }, 1000);
    }

    function renderSrBox(key) {
      if (recordingKey === key && recSessionMeta && recSessionMeta.continuous) {
        const recTitle = recSessionMeta.mode === "match"
          ? "Đang thu âm đoạn văn..."
          : "Đang thu âm liên tục (HSKK)...";
        return `<div class="sr-result" style="border-color:rgba(220,38,38,0.45);">
          <div><span class="sr-rec-dot" aria-hidden="true"></span><b>${recTitle}</b> Bấm <b>Dừng thu âm</b> khi nói xong để chấm điểm &amp; nghe lại giọng.</div>
          <div id="srLive_${esc(key)}" style="margin-top:6px;font-size:15px;color:var(--muted);">${esc(((recSessionMeta.committedBuf || "") + (recSessionMeta.sessionFinalBuf || "") + (recSessionMeta.interimBuf || "")) || "Đang lắng nghe tiếng Trung (zh-CN)...")}</div>
        </div>`;
      }
      const r = recResults[key];
      if (!r) return "";
      const audioHtml = r.audioUrl
        ? `<div style="margin-top:8px;"><audio controls src="${esc(r.audioUrl)}" style="width:100%;max-width:380px;height:34px;"></audio></div>`
        : "";
      const contourHtml = renderPitchContourSvg(r.acoustic, r.targetTone || 0, r.targetTones);
      if (r.error) {
        return `<div class="sr-result" style="border-color:rgba(245,158,11,0.5);"><div style="display:flex;align-items:flex-start;gap:6px;">${spkSvg("alert", 15)}<span>${esc(r.error)}</span></div>${contourHtml}${audioHtml}</div>`;
      }
      if (r.mode === "hskk") {
        const cls = r.pct >= 75 ? "score-ok" : (r.pct >= 45 ? "score-mid" : "score-low");
        const fluencyHint = r.cpm >= 90 ? "Tốc độ nói tự nhiên" : (r.cpm >= 55 ? "Nhịp nói ổn định" : "Nên nói liền mạch hơn");
        const kwHtml = r.totalKeywords > 0
          ? ` • Từ khóa gợi ý: <b>${r.matchedKeywords.length}/${r.totalKeywords}</b>${r.matchedKeywords.length ? ` (${esc(r.matchedKeywords.join("、"))})` : ""}`
          : "";
        return `
          <div class="sr-result">
            <div style="display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;">${spkSvg("mic", 14)}<span><b>Nội dung bạn vừa nói:</b> <span style="font-size:15.5px;">${esc(r.transcript || "(trống)")}</span></span></div>
            <div style="margin-top:5px;">
              Đánh giá khẩu ngữ mở: <span class="${cls}">${r.pct}%</span> —
              Độ dài: <b>${r.spokenChars}</b>/${r.minChars}+ chữ Hán •
              Tốc độ: <b>~${r.cpm} chữ/phút</b> (${fluencyHint})${kwHtml}
            </div>
            ${contourHtml}
            ${audioHtml}
          </div>
        `;
      }
      if (r.mode === "audio_only") {
        const cls = r.pct >= 75 ? "score-ok" : (r.pct >= 50 ? "score-mid" : "score-low");
        const scoreLine = r.pct > 0
          ? `<div style="margin-top:4px;">Chấm thanh điệu &amp; độ rõ sóng âm (Wasm): <span class="${cls}">${r.pct}%</span></div>`
          : `<div style="margin-top:4px;font-size:12.5px;color:var(--muted);">Đang thu nhận hoặc chưa có thanh điệu rõ — hãy bấm nghe lại bản thu bên dưới.</div>`;
        return `<div class="sr-result"><div style="display:flex;align-items:center;gap:6px;">${spkSvg("mic", 14)}<span>Bản ghi âm của bạn (${r.durationSec || 1}s):</span></div>${scoreLine}${contourHtml}${audioHtml}</div>`;
      }
      const cls = r.pct >= 80 ? "score-ok" : (r.pct >= 50 ? "score-mid" : "score-low");
      const badge = r.pct >= 80 ? "Tuyệt vời!" : (r.pct >= 50 ? "Khá tốt, thử rõ thanh điệu hơn!" : "Thử nghe chậm 0.72x rồi đọc lại nhé!");
      return `
        <div class="sr-result">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${spkSvg("mic", 14)}<span>Nhận diện được: <b style="font-size:16px;">${esc(r.transcript || "(trống)")}</b></span></div>
          <div style="margin-top:4px;">Độ khớp với câu mẫu: <span class="${cls}">${r.pct}%</span> — ${badge}</div>
          ${contourHtml}
          ${audioHtml}
        </div>
      `;
    }

        ], toneSearch));

                  <button class="mic-btn ${recordingKey === kB ? "recording" : ""}" onclick="startSpeechCheck('${kB}', DATA.tonePairs[${idx}].b.zh, '${escJsAttr(p.id)}')">

      const list = shadowLevelFilter === "all"
        ? all

      const cur = list[curIdx] || all[0];

      activeShadowId = cur.id;

            <button class="spk-btn" onclick="speakZh(DATA.shadowingLessons.find(x=>x.id==='${escJsAttr(cur.id)}').lines.map(l=>l.zh).join(' '))">${spkSvg("play", 14)} Nghe cả bài (${playRate}x)</button>

    function getFilteredHskkPrompts() {
      return (DATA.hskkPrompts || []).filter((p) => {
        if (hskkLevelFilter !== "all" && p.level !== hskkLevelFilter) return false;
        const pPart = p.part || "p3_talk";
        if (hskkPartFilter !== "all" && pPart !== hskkPartFilter) return false;
        if (hskkSearch && !matchSearchText([
          p.title, p.badge, p.promptZh, p.promptPy, p.promptVi,
          p.listenPassageZh, p.listenPassageVi,
          p.sceneCard && p.sceneCard.sceneTitle,
          Array.isArray(p.keyVocab) ? p.keyVocab.join(" ") : ""
        ], hskkSearch)) return false;
        return true;
      });
    }

          <div class="timer-box">
            <span id="hskkTimerLabel" style="font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;">${timerLabel}</span>
            <span id="hskkTimerNum" class="timer-num">${timerPhase === "idle" ? `${cur.prepSeconds}s / ${cur.speakSeconds}s` : `${timerLeft}s`}</span>
            <button class="spk-btn" onclick="startTimer('prep', ${cur.prepSeconds})">${spkSvg("clock", 14)} Bắt đầu chuẩn bị (${cur.prepSeconds}s)</button>
            <button class="spk-btn" onclick="startTimer('speak', ${cur.speakSeconds})">${spkSvg("mic", 14)} Bấm giờ nói (${cur.speakSeconds}s)</button>
            <button id="hskkTimerStopBtn" class="spk-btn" style="${timerPhase !== "idle" ? "" : "display:none;"}" onclick="stopTimer()">${spkSvg("stop", 14)} Dừng đồng hồ</button>
          </div>

          <div class="line-card">
            <div style="font-weight:800;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px;">${spkSvg("compass", 14)} Dàn ý gợi ý &amp; Từ khóa nên dùng:</div>
            <ul style="margin:0 0 8px;padding-left:18px;font-size:13.5px;line-height:1.6;">
              ${(cur.outline || []).map((o) => `<li>${esc(o)}</li>`).join("")}
            </ul>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${(cur.keyVocab || []).map((w) => `<button class="spk-btn" onclick="speakZh('${escJsAttr(w)}')">${spkSvg("volume", 13)} ${esc(w)}</button>`).join("")}
            </div>
          </div>

          <div class="btn-row" style="margin-top:12px;">
            <button class="mic-btn ${recordingKey === key ? "recording" : ""}" onclick="startHskkSpeechCheck('${escJsAttr(key)}', '${escJsAttr(cur.id)}')">
              ${recordingKey === key ? `${spkSvg("stop", 14)} Dừng thu âm &amp; Chấm điểm` : `${spkSvg("mic", 14)} Thu âm bài nói mở (zh-CN)`}
            </button>
            <button class="spk-btn" onclick="showHskkSample['${escJsAttr(cur.id)}']=!showHskkSample['${escJsAttr(cur.id)}'];render();">
              ${sampleOpen ? `${spkSvg("eyeOff", 14)} Ẩn bài mẫu` : `${spkSvg("fileText", 14)} Xem &amp; Nghe bài mẫu`}
            </button>
          </div>
          ${renderSrBox(key)}

          ${sampleOpen ? `
            <div class="line-card" style="margin-top:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-size:12px;font-weight:800;color:var(--primary);">BÀI NÓI MẪU THAM KHẢO</span>
                <button class="spk-btn" onclick="speakZh(DATA.hskkPrompts.find(x=>x.id==='${escJsAttr(cur.id)}').sampleZh)">${spkSvg("volume", 14)} Nghe bài mẫu</button>
              </div>
              <div style="font-size:17px;font-weight:700;line-height:1.6;">${esc(cur.sampleZh)}</div>
              <div class="py-line py-text" style="margin-top:5px;">${esc(cur.samplePy)}</div>
              <div class="vi-line vi-text" style="margin-top:5px;">${esc(cur.sampleVi)}</div>
            </div>
          ` : ""}
        </div>
      `;
      return html;
    }

    function updateHskkBodyOnly() {
      const wrap = document.getElementById("hskkBodyWrap");
      if (wrap) wrap.innerHTML = buildHskkBodyHtml();
    }

    function renderHskkTab() {
      const all = DATA.hskkPrompts || [];
      const lvCounts = { "Sơ cấp": 0, "Trung cấp": 0, "Cao cấp": 0 };
      const partCounts = { p2_qa: 0, p2_picture: 0, p1_retell: 0, p3_talk: 0 };
      all.forEach((p) => {
        if (lvCounts[p.level] !== undefined) lvCounts[p.level]++;
        const pt = p.part || "p3_talk";
        if (partCounts[pt] !== undefined) partCounts[pt]++;
      });

      const partOptions = [
        { k: "all", label: `Tất cả phần (${all.length})` },
        { k: "p2_qa", label: `Nghe trả lời (${partCounts.p2_qa})` },
        { k: "p2_picture", label: `Miêu tả tranh (${partCounts.p2_picture})` },
        { k: "p1_retell", label: `Nghe thuật lại (${partCounts.p1_retell})` },
        { k: "p3_talk", label: `Trả lời/Hùng biện (${partCounts.p3_talk})` }
      ];

      let html = `<div class="spk-filter-glass">`;
      html += `<p class="tab-intro">Bấm giờ chuẩn bị/trả lời và chấm độ trôi chảy theo chuẩn thi máy HSKK.</p>`;
      html += `<div class="pill-row" style="margin-bottom:8px;">`;
      html += `<button class="sel-pill ${hskkLevelFilter === "all" ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();hskkLevelFilter='all';render();">Tất cả cấp (${all.length})</button>`;
      ["Sơ cấp", "Trung cấp", "Cao cấp"].forEach((lv) => {
        html += `<button class="sel-pill ${hskkLevelFilter === lv ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();hskkLevelFilter='${lv}';render();">${lv} (${lvCounts[lv]})</button>`;
      });
      html += `</div>`;

      html += `<div class="pill-row" style="margin-bottom:10px;">`;
      partOptions.forEach((opt) => {
        html += `<button class="sel-pill ${hskkPartFilter === opt.k ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();hskkPartFilter='${opt.k}';render();">${opt.label}</button>`;
      });
      html += `</div>`;

      html += `
        <div class="filter-bar">
          <div class="search-wrap">
            <span class="search-icon">${spkSvg("search", 15)}</span>
            <input id="hskkSearchInp" class="search-inp" type="search" value="${esc(hskkSearch)}"
              placeholder="Tìm đề HSKK theo chủ đề, câu hỏi, từ khóa..."
              oninput="hskkSearch=this.value;updateHskkBodyOnly();">
          </div>
          ${hskkSearch ? `<button class="ctrl-btn" onclick="hskkSearch='';render();">${spkSvg("close", 14)} Xóa tìm</button>` : ""}
        </div>
      </div>
        <div id="hskkBodyWrap">${buildHskkBodyHtml()}</div>
      `;
      return html;
    }

    function render() {
      const totalItems = DATA.tonePairs.length + DATA.shadowingLessons.length + DATA.hskkRepeatSets.length + DATA.hskkPrompts.length;
      const doneCount = [
        ...DATA.tonePairs.map((x) => x.id),
        ...DATA.shadowingLessons.map((x) => x.id),
        ...DATA.hskkRepeatSets.map((x) => x.id),
        ...DATA.hskkPrompts.map((x) => x.id)
      ].filter((id) => doneMap[id]).length;

      let tabBody = "";
      if (activeTab === "tones") tabBody = renderTonesTab();
      else if (activeTab === "shadowing") tabBody = renderShadowingTab();
      else if (activeTab === "repeat") tabBody = renderRepeatTab();
      else tabBody = renderHskkTab();

      const srSupportBanner = SpeechRec ? "" : `
        <div class="notice-box">
          ${spkSvg("info", 16)}
          <span><b>Lưu ý nhận diện giọng nói:</b> Trình duyệt hiện chưa bật API <code>SpeechRecognition</code> (nên dùng Chrome / Edge để chấm <code>zh-CN</code> tự động). Bạn vẫn nghe mẫu và tự đánh dấu hoàn thành bình thường.</span>
        </div>
      `;

      const stage = document.getElementById("appStage");
      stage.className = "container" + (showPinyin ? "" : " hide-py") + (showVi ? "" : " hide-vi");
      stage.innerHTML = `
        <div class="hero-card">
          <div>
            <h1>${spkSvg("mic", 19)} Luyện Phát âm, Shadowing &amp; Khẩu ngữ HSKK</h1>
            <p>4 phần luyện tập chuẩn HSKK từ thanh điệu đến phòng thi thực chiến (${totalItems} mục).</p>
          </div>
          <div class="prog-pill">${spkSvg("award", 15)} Tiến độ: ${doneCount}/${totalItems} mục</div>
        </div>

        ${srSupportBanner}

        <div class="tabs">
          <button class="tab-btn ${activeTab === "tones" ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();activeTab='tones';render();">${spkSvg("target", 14)} Thanh điệu (${DATA.tonePairs.length})</button>
          <button class="tab-btn ${activeTab === "shadowing" ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();activeTab='shadowing';render();">${spkSvg("mic", 14)} Shadowing (${DATA.shadowingLessons.length})</button>
          <button class="tab-btn ${activeTab === "repeat" ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();activeTab='repeat';render();">${spkSvg("refresh", 14)} Nhắc lại &amp; Đọc (${DATA.hskkRepeatSets.length})</button>
          <button class="tab-btn ${activeTab === "hskk" ? "active" : ""}" onclick="stopZh();stopRecording();stopTimer();activeTab='hskk';render();">${spkSvg("award", 14)} Phòng Thi HSKK (${DATA.hskkPrompts.length})</button>
        </div>

        <div class="ctrl-bar">
          <div class="rate-group">
            <button class="rate-btn ${playRate === 0.72 ? "on" : ""}" onclick="playRate=0.72;render();">${spkSvg("clock", 13)} 0.72x</button>
            <button class="rate-btn ${playRate === 1.0 ? "on" : ""}" onclick="playRate=1.0;render();">${spkSvg("zap", 13)} 1.0x</button>
          </div>
          <button class="ctrl-btn ${showPinyin ? "on" : ""}" onclick="showPinyin=!showPinyin;render();">${spkSvg("eye", 14)} Pinyin: ${showPinyin ? "Hiện" : "Ẩn"}</button>
          <button class="ctrl-btn ${showVi ? "on" : ""}" onclick="showVi=!showVi;render();">${spkSvg("book", 14)} Dịch Việt: ${showVi ? "Hiện" : "Ẩn"}</button>
          <button class="ctrl-btn" onclick="stopZh()">${spkSvg("stop", 14)} Dừng phát</button>
          <button class="ctrl-btn" onclick="testSpeakerAndMic()">${spkSvg("volume", 14)} Kiểm tra loa &amp; mic</button>
        </div>
        ${deviceCheckMsg ? `<div class="notice-box" id="spkDeviceCheckStatus" style="margin-bottom:12px;">${spkSvg("info", 15)}<span>${esc(deviceCheckMsg)}</span></div>` : ""}

        ${tabBody}
      `;
    }

    function stepSpkItem(delta) {
      if (activeTab === "shadowing") {
        const all = DATA.shadowingLessons || [];
        const list = shadowLevelFilter === "all" ? all : all.filter((s) => String(s.level) === String(shadowLevelFilter));
        if (!list.length) return;
        let idx = list.findIndex((s) => s.id === activeShadowId);
        if (idx < 0) idx = 0;
        const next = idx + delta;
        if (next < 0 || next >= list.length) return;
        stopZh(); stopRecording();
        activeShadowId = list[next].id;
        render();
        return;
      }
      if (activeTab === "repeat") {
        const all = DATA.hskkRepeatSets || [];
        const list = repeatLevelFilter === "all" ? all : all.filter((r) => r.level === repeatLevelFilter);
        if (!list.length) return;
        let idx = list.findIndex((r) => r.id === activeRepeatId);
        if (idx < 0) idx = 0;
        const next = idx + delta;
        if (next < 0 || next >= list.length) return;
        stopZh(); stopRecording(); stopTimer();
        activeRepeatId = list[next].id;
        render();
        return;
      }
      if (activeTab === "hskk") {
        const list = getFilteredHskkPrompts();
        if (!list.length) return;
        let idx = list.findIndex((p) => p.id === activeHskkId);
        if (idx < 0) idx = 0;
        const next = idx + delta;
        if (next < 0 || next >= list.length) return;
        stopZh(); stopRecording(); stopTimer();
        activeHskkId = list[next].id;
        render();
        return;
      }
      if (activeTab === "tones") {
        const cards = Array.from(document.querySelectorAll(".tone-card"));
        if (!cards.length) return;
        let idx = cards.findIndex((c) => c.getAttribute("data-tone-id") === activeToneId);
        if (idx < 0) idx = 0;
        const next = Math.max(0, Math.min(cards.length - 1, idx + delta));
        const targetCard = cards[next];
        if (!targetCard) return;
        activeToneId = targetCard.getAttribute("data-tone-id") || "";
        cards.forEach((c) => c.classList.toggle("is-target-item", c === targetCard));
        targetCard.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (document.querySelector(".modal-backdrop, .s4-modal-backdrop")) return;
      const ae = document.activeElement;
      const tag = ae && ae.tagName ? ae.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (ae && ae.isContentEditable)) return;
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        stepSpkItem(-1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        stepSpkItem(1);
      }
    });

    function startHskkSpeechCheck(key, promptId) {
      const cur = (DATA.hskkPrompts || []).find((x) => x.id === promptId);
      if (!cur) return;
      const lv = String(cur.level || "");
      const minChars = /cao/i.test(lv) ? 55 : (/trung/i.test(lv) ? 35 : (cur.part === "p2_qa" ? 15 : 20));
      startSpeechCheck(key, cur.sampleZh || "", cur.id, {
        mode: "hskk",
        keyVocab: cur.keyVocab || [],
        minChars
      });
    }

    syncThemeBtn();
    render();
    if (activeTab === "tones" && activeToneId) {
      setTimeout(() => {
        const el = document.getElementById("toneCard_" + activeToneId);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 60);
    }
    window.addEventListener("pagehide", () => {
      warmAcquireGen++;
      stopZh();
      stopRecording(false);
      releaseWarmMicStream();
      stopTimer();
      revokeAllAudioUrls();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        warmAcquireGen++;
        if (recordingKey && recSessionMeta && recSessionMeta.continuous) {
          finalizeContinuousHskk(recordingKey, recSessionMeta, recSessionMeta.doneIdToMark);
        }
        stopRecording(false);
        releaseWarmMicStream();
        render();
      }
    });
  </script>
  <script src="../../assets/s4-ui.js?v=67"></script>
  <script src="../../auth.js?v=33"></script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
  <script>
    (function initHskSpkChrome() {
      var bIcon = document.getElementById("spkBrandIcon");
      var lIcon = document.getElementById("spkLessonsIcon");
      var dIcon = document.getElementById("spkDonateIcon");
      if (window.S4UI && typeof window.S4UI.icon === "function") {
        if (bIcon) bIcon.innerHTML = window.S4UI.icon("mic", 16);
        if (lIcon) lIcon.innerHTML = window.S4UI.icon("graduation", 15);
        if (dIcon) dIcon.innerHTML = window.S4UI.icon("heart", 15);
        if (typeof window.S4UI.initSmartBackButton === "function") {
          window.S4UI.initSmartBackButton({
            element: "#lpBackBtn",
            defaultUrl: "../index.html",
            defaultLabel: "HSK",
            roadmapUrl: "../roadmap/index.html",
            roadmapLabel: "Lộ trình HSK"
          });
        }
      }
      var btnDonate = document.getElementById("btnDonate");
      if (btnDonate && !btnDonate.dataset.lpBound) {
        btnDonate.dataset.lpBound = "1";
        btnDonate.addEventListener("click", function () {
          if (window.S4Auth && typeof window.S4Auth.openDonateModal === "function") {
            window.S4Auth.openDonateModal();
          }
        });
      }
      var btnTheme = document.getElementById("btnTheme");
      if (btnTheme && !btnTheme.dataset.lpBound) {
        btnTheme.dataset.lpBound = "1";
        btnTheme.addEventListener("click", function () {
          if (typeof window.toggleDarkMode === "function") window.toggleDarkMode();
        });
      }
      if (typeof window.syncThemeBtn === "function") window.syncThemeBtn();
    })();
  </script>
</body>
