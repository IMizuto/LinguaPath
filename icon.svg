<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Soft Light Pearl & Sakura Pink Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>

    <!-- Wing Left: Sakura Pink to Rose (Hồng phấn hoa anh đào dịu ngọt) -->
    <linearGradient id="wingPinkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="wingPinkMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="wingPinkInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Wing Right: Peach Coral to Warm Rose (Hồng đào ánh san hô rạng rỡ) -->
    <linearGradient id="wingPeachMain" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="wingPeachMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="wingPeachInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Foundation Book Pearl White -->
    <linearGradient id="bookPearl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Polaris Star Gold -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Ambient Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="starBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Base (Tone Sáng Hồng Phấn) -->
  <rect width="512" height="512" rx="116" fill="url(#bgLight)"/>
  <rect x="7" y="7" width="498" height="498" rx="109" fill="none" stroke="rgba(244,63,94,0.18)" stroke-width="2.5"/>

  <!-- Halo Atmosphere Behind Wings (Ánh hồng phấn ấm áp) -->
  <circle cx="256" cy="195" r="170" fill="rgba(251,113,133,0.1)"/>
  <circle cx="256" cy="175" r="120" fill="rgba(244,114,182,0.12)"/>

  <!-- ================= THE EMBLEM: CLEAR SPREAD WINGS IN PASTEL PINK ================= -->
  <g transform="translate(0, 0)">
    <!-- ================= CÁNH TRÁI (HỒNG PHẤN HOA ANH ĐÀO - SẢI RỘNG KHÍ ĐỘNG HỌC) ================= -->
    <!-- Tầng 1: Lông vũ chính trên cùng (Dài nhất, sải rộng nhất) -->
    <path d="M 256 290 
             C 210 250, 132 185, 42 122 
             C 34 116, 40 105, 50 108 
             C 126 128, 196 178, 256 244 Z" 
          fill="url(#wingPinkMain)" filter="url(#softGlow)"/>

    <!-- Tầng 2: Lông vũ giữa (Sải rộng theo luồng gió) -->
    <path d="M 256 305 
             C 205 270, 135 218, 62 168 
             C 54 162, 59 150, 69 154 
             C 136 178, 200 225, 256 268 Z" 
          fill="url(#wingPinkMid)" opacity="0.95" filter="url(#softGlow)"/>

    <!-- Tầng 3: Lông vũ dưới (Sải cánh ôm gió) -->
    <path d="M 256 320 
             C 210 292, 148 252, 90 210 
             C 82 204, 87 192, 97 196 
             C 154 220, 210 260, 256 292 Z" 
          fill="url(#wingPinkInner)" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Tầng 4: Lông vũ gốc cánh (Gốc cánh vững chãi) -->
    <path d="M 256 335 
             C 218 312, 168 282, 122 250 
             C 114 244, 118 232, 128 236 
             C 174 258, 220 292, 256 316 Z" 
          fill="#be185d" opacity="0.85"/>

    <!-- ================= CÁNH PHẢI (HỒNG CAM ĐÀO / SAN HÔ - SẢI RỘNG KHÍ ĐỘNG HỌC) ================= -->
    <!-- Tầng 1: Lông vũ chính trên cùng (Dài nhất, sải rộng nhất) -->
    <path d="M 256 290 
             C 302 250, 380 185, 470 122 
             C 478 116, 472 105, 462 108 
             C 386 128, 316 178, 256 244 Z" 
          fill="url(#wingPeachMain)" filter="url(#softGlow)"/>

    <!-- Tầng 2: Lông vũ giữa (Sải rộng theo luồng gió) -->
    <path d="M 256 305 
             C 307 270, 377 218, 450 168 
             C 458 162, 453 150, 443 154 
             C 376 178, 312 225, 256 268 Z" 
          fill="url(#wingPeachMid)" opacity="0.95" filter="url(#softGlow)"/>

    <!-- Tầng 3: Lông vũ dưới (Sải cánh ôm gió) -->
    <path d="M 256 320 
             C 302 292, 364 252, 422 210 
             C 430 204, 425 192, 415 196 
             C 358 220, 302 260, 256 292 Z" 
          fill="url(#wingPeachInner)" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Tầng 4: Lông vũ gốc cánh (Gốc cánh vững chãi) -->
    <path d="M 256 335 
             C 294 312, 344 282, 390 250 
             C 398 244, 394 232, 384 236 
             C 338 258, 292 292, 256 316 Z" 
          fill="#be123c" opacity="0.85"/>

    <!-- ================= CUỐN SÁCH MỞ TINH TẾ GỌN GÀNG Ở CHÂN ĐẾ ================= -->
    <path d="M 256 348 
             L 190 326 C 182 323, 178 316, 182 310 C 186 304, 195 302, 202 304 L 256 322 L 310 304 C 317 302, 326 304, 330 310 C 334 316, 330 323, 322 326 Z" 
          fill="url(#bookPearl)" stroke="rgba(244,63,94,0.25)" stroke-width="1.5"/>
    <circle cx="256" cy="340" r="4.5" fill="#f43f5e"/>

    <!-- ================= NGÔI SAO POLARIS BẮC ĐẨU (ÁNH SÁNG DẪN ĐƯỜNG) ================= -->
    <g transform="translate(256, 62)">
      <!-- Aura Bloom -->
      <circle cx="0" cy="0" r="38" fill="#fbbf24" opacity="0.4" filter="url(#starBloom)"/>
      <circle cx="0" cy="0" r="20" fill="#fef08a" opacity="0.7" filter="url(#softGlow)"/>
      <!-- Compass Star 4 cánh sắc nhọn -->
      <path d="M 0 -42 C 0 -13 10 -4 42 0 C 10 4 0 13 0 42 C 0 13 -10 4 -42 0 C -10 -4 0 -13 0 -42 Z" 
            fill="url(#starGold)" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY (TƯƠNG PHẢN SANG TRỌNG TRÊN NỀN SÁNG) ================= -->
  <!-- Thương hiệu LINGUAPATH (Màu Đỏ Rượu Vang Sang Trọng - Deep Rose Wine) -->
  <text x="256" y="434" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#881337" 
        text-anchor="middle" 
        letter-spacing="7">
    LINGUAPATH
  </text>

  <!-- Tagline: FREE FOR COMMUNITY (Hồng san hô tươi tắn) -->
  <text x="256" y="466" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="12" 
        font-weight="800" 
        fill="#e11d48" 
        text-anchor="middle" 
        letter-spacing="3.5">
    FREE FOR COMMUNITY
  </text>
</svg>
