<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaThemeColor" content="#0d1813">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = (d === "1");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>
  <title>Study4 Vocab Master</title>
  
  <style>
    @view-transition { navigation: auto; }
    :root {
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --primary: #2563eb; --primary-soft: #dbeafe; --success: #16a34a; --success-soft: #dcfce7;
      --warn: #d97706; --warn-soft: #fef3c7; --danger: #dc2626; --danger-soft: #fee2e2;
      color-scheme: light;
    }
    html.dark, body.dark {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155;
      --primary: #3b82f6; --primary-soft: #1e3a8a; --success-soft: #064e3b; --warn-soft: #78350f; --danger-soft: #7f1d1d;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); color: var(--text); width: 100%; max-width: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; width: 100%; max-width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: pan-y; }
    body.sidebar-open .main-wrap { pointer-events: none; user-select: none; overflow: hidden !important; }
    button { font-family: inherit; }

    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.48); z-index: 190; backdrop-filter: blur(2px); touch-action: none; overscroll-behavior: none; }
    .sidebar-backdrop.open { display: block; }
    .sidebar { width: 330px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; height: 100dvh; z-index: 200; overscroll-behavior: contain; touch-action: pan-y; }
    .sidebar-header { padding: 12px 14px; background: var(--card); color: var(--text); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .sidebar-header h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .close-sidebar { display: none; background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 20px; line-height: 1; cursor: pointer; }
    .search-wrap { padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
    .search-wrap input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; font-size: 13.5px; }
    .cat-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 7px 8px; border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
    .cat-tab { padding: 6px 2px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; text-align: center; }
    .cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .topic-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    .cat-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; background: var(--card); }
    .cat-group.open { border-color: var(--primary); }
    .cat-header { padding: 9px 11px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; background: var(--card); color: var(--text); user-select: none; }
    .cat-header:hover { background: rgba(37,99,235,0.05); }
    .cat-group.open .cat-header { background: var(--primary-soft); color: var(--primary); }
    .cat-meta { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .cat-items { display: none; padding: 6px; border-top: 1px solid var(--border); background: var(--bg); }
    .cat-group.open .cat-items { display: block; }
    .topic-item { padding: 9px 11px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; border: 1px solid transparent; background: var(--card); }
    .topic-item:last-child { margin-bottom: 0; }
    .topic-item:hover { border-color: var(--primary); }
    .topic-item.active { background: var(--primary-soft); border-color: var(--primary); font-weight: 600; }
    .topic-name { font-size: 13px; line-height: 1.35; margin-bottom: 4px; }
    .topic-meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .progress-mini { height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .progress-mini-bar { height: 100%; background: var(--success); }
    .sidebar-foot { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; background: var(--card); }

    .main-wrap { flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; min-width: 0; max-width: 100%; background: var(--bg); overscroll-behavior: none; }
    .topbar { position: sticky; top: 0; z-index: 90; background: var(--card); color: var(--text); border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; width: 100%; max-width: 100%; touch-action: manipulation; }
    .home-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 11px; border-radius: 8px; font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .menu-btn { display: none; background: var(--primary); color: #fff; border: none; padding: 7px 11px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; align-items: center; gap: 4px; flex-shrink: 0; }
    .mode-nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; }
    .mode-btn { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; font-size: 12.5px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .mode-btn.danger { color: var(--danger); }
    .mode-dd-wrap { display: none; position: relative; flex: 1; min-width: 0; }
    .mode-dd-btn { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 700; font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mode-dd-menu { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.22); z-index: 150; overscroll-behavior: contain; touch-action: manipulation; }
    .mode-dd-menu.open { display: block; }
    .mode-dd-item { width: 100%; text-align: left; padding: 9px 11px; border: none; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .mode-dd-item:hover { background: var(--bg); }
    .mode-dd-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 8px)) 14px; overscroll-behavior: contain; }
    body.scroll-mode .main { overflow-y: auto; overflow-x: hidden; display: block; -webkit-overflow-scrolling: touch; }
    .container { max-width: 820px; width: 100%; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    body.scroll-mode .container { display: block; }
    #statsHost { flex-shrink: 0; }
    #cardHost { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    body.scroll-mode #cardHost { display: block; overflow: visible; }

    .stats-card { background: var(--card); border-radius: 12px; padding: 8px 12px; border: 1px solid var(--border); margin-bottom: 8px; }
    .stats-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .quota-pill { background: var(--primary-soft); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 12.5px; }
    .stats-mini-inline { display: inline-flex; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); align-items: center; flex-wrap: wrap; }
    .stats-btns { display: flex; gap: 5px; }
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .stat-num { font-size: 18px; font-weight: 800; }

    .limit-select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; font-size: 13px; }

    .cal-wrap { width: 100%; max-width: 340px; }
    .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

    .cal-dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; }
    .cal-day { aspect-ratio: 1; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: var(--border); color: var(--text); line-height: 1.1; }
    .cal-day span { font-size: 9px; font-weight: 700; }
    .cal-day.lv1 { background: rgba(22,163,74,.30); }
    .cal-day.lv2 { background: rgba(22,163,74,.55); }

    .cal-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); align-items: center; }
    .cal-legend { display: inline-flex; align-items: center; gap: 3px; }
    .cal-legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; }

    .sess-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; flex-shrink: 0; }

    .fc-top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
    .tag { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
    .tag.new { background: rgba(37,99,235,.14); color: var(--primary); }
    .tag.rev { background: rgba(217,119,6,.15); color: var(--warn); }

    .fc-pos { font-size: 16px; color: var(--muted); font-weight: 500; }
    .fc-ipa { font-size: 16.5px; color: var(--danger); font-family: monospace; margin: 4px 0 8px 0; }

    .audio-pill { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 13px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }

    .srs-btn { padding: 11px 6px; border: none; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: #fff; }
    .fc-scroll-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 4px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .fc-action-dock { flex-shrink: 0; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border); background: var(--card); z-index: 10; width: 100%; box-sizing: border-box; }
    .btn-flip { width: 100%; padding: 13px; border-radius: 12px; background: var(--primary); color: #fff; border: none; font-size: 15.5px; font-weight: 700; cursor: pointer; margin: 0; display: block; touch-action: manipulation; box-shadow: 0 2px 8px rgba(37,99,235,0.25); }

    .btn-action { padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; }

    .match-tile { padding: 12px 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 76px; display: flex; align-items: center; justify-content: center; user-select: none; }

    .text-input { width: 100%; padding: 13px 16px; font-size: 18px; font-weight: 600; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); outline: none; margin-top: 12px; text-align: center; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease; }

    .text-input.wrong { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.15) !important; color: var(--danger) !important; }
    .s4-ans-toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 9999; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.18); pointer-events: none; opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease; }

      .mode-nav { display: none; }
      .mode-dd-wrap { display: block; }

      .quota-pill { padding: 3px 8px; font-size: 11.5px; }

      .stats-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .stat-num { font-size: 15px; }
      .stat-label { font-size: 10px; }
      .sess-row { font-size: 11px; margin-bottom: 2px; }
      .sess-bar { margin-bottom: 5px; height: 4px; }
      .flashcard-wrap { padding: 10px 12px; border-radius: 14px; }
      .fc-top-bar { margin-bottom: 4px; font-size: 11px; }
      .fc-front-img { max-height: 100px; margin-bottom: 4px; }
      .fc-word { font-size: 22px; }
      .fc-pos { font-size: 13.5px; }
      .fc-ipa { font-size: 14px; margin: 2px 0 4px 0; }
      .audio-row { margin-bottom: 3px; }
      .audio-pill { padding: 3px 10px; font-size: 11.5px; }
      .fc-back { margin-top: 6px; padding-top: 6px; }
      .def-box { font-size: 13.5px; line-height: 1.4; margin-bottom: 6px; }

  <audio id="audioPlayer"></audio>
  <script src="../auth.js?v=19"></script>
  <script src="vocab_data.js"></script>
  <script>
    const VOCAB = window.STUDY4_VOCAB_DATA || [];
    const VOCAB_BY_ID = new Map(VOCAB.map(v => [v.id, v]));
    const KEYS = { srs: "s4_vocab_srs_v1", days: "s4_vocab_days_v2", settings: "s4_vocab_settings_v2", session: "s4_vocab_active_session_v2" };
    const DEFAULT_SETTINGS = { dailyNewLimit: 20, reviewCap: 100, autoAudio: true, queueOrder: "mix", bonusTodayDate: "", bonusTodayCount: 0, lastTopic: "" };
    const POOL_SIZE = 10;

    function loadJSON(key, fallback) {
      try { const o = JSON.parse(localStorage.getItem(key)); return o && typeof o === "object" ? o : fallback; }
      catch (e) { return fallback; }
    }

    let srsData = loadJSON(KEYS.srs, {});
    let dayLog = loadJSON(KEYS.days, {});          // { "YYYY-MM-DD": [wordId, ...] } các từ đã học trong ngày
    let userSettings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(KEYS.settings, {}));
    if (!["mix", "due_first", "new_first"].includes(userSettings.queueOrder)) userSettings.queueOrder = "mix";

    // Dọn dữ liệu rác từ bản thử nghiệm cũ và đồng bộ lịch học theo ngày địa phương
    (function sanitizeStorageOnBoot() {
      const nowD = new Date();
      const todayKey = nowD.getFullYear() + "-" + String(nowD.getMonth() + 1).padStart(2, "0") + "-" + String(nowD.getDate()).padStart(2, "0");
      Object.keys(srsData).forEach(k => {
        const st = srsData[k];
        if (!VOCAB_BY_ID.has(k) || !st || typeof st !== "object") {
          delete srsData[k];
          return;
        }
        if (st.firstLearnedDate && st.firstLearnedDate > todayKey) {
          st.firstLearnedDate = todayKey;
        }
        if (!st.ignored && st.firstLearnedDate) {
          const arr = dayLog[st.firstLearnedDate] || (dayLog[st.firstLearnedDate] = []);
          if (!arr.includes(k)) arr.push(k);
        }
      });
      Object.keys(dayLog).forEach(d => {
        if (!Array.isArray(dayLog[d])) delete dayLog[d];
        else dayLog[d] = Array.from(new Set(dayLog[d].filter(id => VOCAB_BY_ID.has(id) || String(id).startsWith("g_"))));
      });
      localStorage.setItem(KEYS.srs, JSON.stringify(srsData));
      localStorage.setItem(KEYS.days, JSON.stringify(dayLog));
    })();

    const TOPICS = Array.from(new Set(VOCAB.map(v => v.topic)));
    let currentTopic = TOPICS.includes(userSettings.lastTopic) || ["ALL", "ALL_DUE"].includes(userSettings.lastTopic)
      ? userSettings.lastTopic
      : (TOPICS.find(t => VOCAB.some(v => v.topic === t && !srsData[v.id])) || TOPICS[0] || "ALL");
    if (window.S4Auth && !window.S4Auth.canAccessVocabTopic(currentTopic, TOPICS)) {
      currentTopic = TOPICS[0] || "ALL";
    }
    let currentMode = "smart";
    let panel = "";               // "" | "settings" | "calendar"
    let calMonthOffset = 0;
    let listFilter = "all";
    let listLimit = 100;
    let quizDirection = "mix";
    let listenSubMode = "choice";

    let studyQueue = [];
    let sessionTopic = "";        // chủ đề mà studyQueue hiện tại được dựng cho ("" = phiên tạm: tìm kiếm / ôn luyện)
    let tapLockAt = 0;            // mốc thời gian giao diện vừa đổi, dùng chống bấm đúp nhầm sang thẻ kế tiếp
    let sessionTotal = 0, sessionDone = 0;
    let isFlipped = false;
    let extraPracticeMode = false;
    let smartTick = 0, lastSmartWordId = "";
    let cardSerial = 0, cardCache = {}, lastPlayedSerial = -1;
    let lastStats = null;

    /* ---------- Tiện ích ---------- */
    const $ = id => document.getElementById(id);
    const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function localDateStr(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function getTodayStr() { return localDateStr(new Date()); }
    function shortTopic(t) { return t.split(" (")[0]; }
    function bumpCard() {
      cardSerial++;
      cardCache = {};
      tapLockAt = Date.now();
      const m = document.querySelector(".main");
      if (m) m.scrollTop = 0;
      const sb = document.querySelector(".fc-scroll-body");
      if (sb) sb.scrollTop = 0;
    }
    // Chống bấm đúp / chạm lặp: trong 350ms sau khi thẻ mới hiện ra, mọi lần chạm lên nút đáp án/nút "Đã hiểu" bị bỏ qua
    function tapTooSoon() { return Date.now() - tapLockAt < 350; }
    function cacheGet(key, factory) { if (!(key in cardCache)) cardCache[key] = factory(); return cardCache[key]; }
    /* ---------- Lưu / khôi phục phiên học dở dang (theo từng chủ đề) ---------- */
    function readSessionMap() {
      const m = loadJSON(KEYS.session, {});
      return m && typeof m === "object" && !Array.isArray(m) ? m : {};
    }
    function writeSessionMap(map) {
      try {
        if (Object.keys(map).length) localStorage.setItem(KEYS.session, JSON.stringify(map));
        else localStorage.removeItem(KEYS.session);
      } catch (e) {}
    }
    function saveActiveSession() {
      if (extraPracticeMode || !sessionTopic || searchQuery()) return;
      const map = readSessionMap();
      if (!studyQueue || !studyQueue.length) {
        delete map[sessionTopic];
      } else {
        map[sessionTopic] = {
          mode: currentMode,
          savedAt: Date.now(),
          sessionTotal: sessionTotal,
          sessionDone: sessionDone,
          queue: studyQueue.map(w => ({
            id: w.id,
            _new: !!w._new,
            _stage: typeof w._stage === "number" ? w._stage : (w._new ? 0 : 1),
            _mistakes: w._mistakes || 0,
            _resume: w._resume || null,
            _relearn: !!w._relearn,
            _lapsed: !!w._lapsed,
            _relearned: !!w._relearned,
            _rated: !!w._rated,
            _hardRepeated: !!w._hardRepeated,
            _lastTask: w._lastTask || null
          }))
        };
      }
      writeSessionMap(map);
    }

    // topic: xoá phiên của 1 chủ đề; bỏ trống: xoá toàn bộ phiên dở dang
    function clearActiveSession(topic) {
      if (!topic) { localStorage.removeItem(KEYS.session); return; }
      const map = readSessionMap();
      delete map[topic];
      writeSessionMap(map);
    }

    function tryRestoreActiveSession() {
      if (extraPracticeMode || searchQuery()) return false;
      const raw = readSessionMap()[currentTopic];
      if (!raw || !Array.isArray(raw.queue) || !raw.queue.length) return false;

      // Chỉ giữ phiên trong cùng ngày, hoặc lưu cách đây dưới 6 tiếng (học qua nửa đêm)
      const savedAt = raw.savedAt || 0;
      const sameDay = localDateStr(new Date(savedAt)) === getTodayStr();
      if (!sameDay && Date.now() - savedAt > 6 * 3600 * 1000) {
        clearActiveSession(currentTopic);
        return false;
      }

      const list = [];
      for (const item of raw.queue) {
        const full = VOCAB_BY_ID.get(item.id);
        if (!full) continue;
        const st = srsData[item.id];
        if (st && st.ignored) continue;       // đã đánh dấu "đã biết" ở nơi khác
        if (item._new && st) continue;        // từ mới đã được học xong/chấm điểm ở nơi khác (đồng bộ thiết bị)
        list.push(Object.assign({}, full, item));
      }
      if (!list.length) { clearActiveSession(currentTopic); return false; }

      studyQueue = list;
      sessionTopic = currentTopic;
      sessionTotal = Math.max(raw.sessionTotal || 0, list.length + (raw.sessionDone || 0));
      sessionDone = raw.sessionDone || 0;
      smartTick = 0;
      lastSmartWordId = "";
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length) pickNextSmartItem();
      return true;
    }

    function saveState() {
      localStorage.setItem(KEYS.srs, JSON.stringify(srsData));
      localStorage.setItem(KEYS.days, JSON.stringify(dayLog));
      localStorage.setItem(KEYS.settings, JSON.stringify(userSettings));
      saveActiveSession();
    }
    function logActivity(id) {
      const today = getTodayStr();
      const arr = dayLog[today] || (dayLog[today] = []);
      if (!arr.includes(id)) arr.push(id);
      saveState();
    }

    /* ---------- Hạn mức từ mới trong ngày ---------- */
    function getNewWordsLearnedTodayCount() {
      const today = getTodayStr();
      return Object.values(srsData).filter(st => st && !st.ignored && st.firstLearnedDate === today).length;
    }
    function getDailyTarget() {
      const bonus = userSettings.bonusTodayDate === getTodayStr() ? (userSettings.bonusTodayCount || 0) : 0;
      return Number(userSettings.dailyNewLimit) + bonus;
    }
    function getRemainingDailyNewQuota() { return Math.max(0, getDailyTarget() - getNewWordsLearnedTodayCount()); }

    function setOpt(key, val) {
      if (key === "autoAudio") { userSettings.autoAudio = !!val; saveState(); return; }
      if (key === "queueOrder") userSettings.queueOrder = val;
      else userSettings[key] = Number(val);
      saveState();
      buildStudyQueue(true);   // đổi giới hạn/thứ tự -> dựng lại hàng đợi theo cài đặt mới
      renderAll();
    }
    function addBonusNewWords(n) {
      const today = getTodayStr();
      if (userSettings.bonusTodayDate !== today) { userSettings.bonusTodayDate = today; userSettings.bonusTodayCount = 0; }
      userSettings.bonusTodayCount += n;
      extraPracticeMode = false;
      saveState();
      buildStudyQueue();
      renderAll();
    }
    function startFreePractice() { extraPracticeMode = true; buildStudyQueue(); renderAll(); }
    function exitPractice() { extraPracticeMode = false; buildStudyQueue(); renderAll(); }

    /* ---------- Thuật toán lặp lại ngắt quãng (SM-2 cải tiến) ---------- */
    function dueAt(days) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + Math.max(1, Math.round(days)));
      return d.getTime();
    }
    function fuzz(i) { return i >= 7 ? Math.round(i * (0.92 + Math.random() * 0.16)) : i; }

    // quality: 0 Quên | 1 Khó | 2 Nhớ | 3 Rất dễ. relearned: từ đã quên nhưng đã học lại xong trong phiên
    function rateWordSRS(id, quality, relearned) {
      const now = Date.now();
      let st = srsData[id];
      if (!st || st.ignored) st = { reps: 0, interval: 0, ease: 2.5, due: 0, lapses: 0, firstLearnedDate: getTodayStr() };
      if (!st.firstLearnedDate) st.firstLearnedDate = getTodayStr();
      st.ignored = false;

      if (quality === 0) {
        st.reps = 0;
        st.lapses = (st.lapses || 0) + 1;
        st.ease = Math.max(1.3, st.ease - 0.2);
        if (relearned) { st.interval = 1; st.due = dueAt(1); }
        else { st.interval = 0; st.due = now + 10 * 60 * 1000; }
      } else {
        st.reps += 1;
        if (quality === 1) {
          st.interval = st.interval < 1 ? 1 : Math.max(1, Math.round(st.interval * 0.6));
          st.ease = Math.max(1.3, st.ease - 0.15);
        } else if (quality === 2) {
          st.interval = st.reps === 1 ? 1 : st.reps === 2 ? 3 : Math.max(st.interval + 1, Math.round(st.interval * st.ease));
        } else {
          st.interval = st.reps === 1 ? 4 : st.reps === 2 ? 7 : Math.max(st.interval + 2, Math.round(st.interval * st.ease * 1.3));
          st.ease = Math.min(3, st.ease + 0.15);
        }
        st.interval = Math.min(365, fuzz(st.interval));
        st.due = dueAt(st.interval);
      }
      st.lastReview = now;
      srsData[id] = st;
      saveState();
    }

    // Chấm điểm từ trong phiên: chỉ ghi nhận lần chấm đầu tiên, trừ khi từ đã quên rồi học lại xong
    function rateOnce(v, q) {
      if (extraPracticeMode) { logActivity(v.id); return; }
      if (v._lapsed) {
        if (!v._relearned && q >= 1) { v._relearned = true; rateWordSRS(v.id, q >= 2 ? 2 : 1); }
        else logActivity(v.id);
        return;
      }
      if (v._rated) { logActivity(v.id); return; }
      v._rated = true;
      rateWordSRS(v.id, q);
      logActivity(v.id);
    }

    function ignoreCurrentWord() {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      const wasNew = !srsData[v.id];
      srsData[v.id] = { ignored: true, updatedAt: Date.now() };
      sessionDone++;
      saveState();
      if (wasNew && !extraPracticeMode && currentTopic !== "ALL_DUE") {
        const queued = new Set(studyQueue.map(x => x.id));
        const rep = getScopeWords().find(w => !srsData[w.id] && !queued.has(w.id));
        if (rep) { studyQueue.push(Object.assign({ _new: true }, rep)); sessionTotal++; }
      }
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length) pickNextSmartItem();
      renderAll();
    }
    function unignoreWord(id) {
      delete srsData[id];
      saveState();
      afterListChange();
    }
    function markKnown(id) {
      srsData[id] = { ignored: true, updatedAt: Date.now() };
      saveState();
      afterListChange();
    }
    function afterListChange() {
      if (!studyQueue.length) buildStudyQueue();
      renderAll();
    }

    /* ---------- Phạm vi từ & hàng đợi phiên học ---------- */
    function searchQuery() { return ($("searchWordInput").value || "").toLowerCase().trim(); }
    function isDueWord(v, now) { const st = srsData[v.id]; return !!st && !st.ignored && now >= st.due; }

    function getScopeWords() {
      const q = searchQuery();
      if (q) return VOCAB.filter(v => v.word.toLowerCase().includes(q) || (v.defRaw || "").toLowerCase().includes(q));
      if (currentTopic === "ALL") return VOCAB;
      if (currentTopic === "ALL_DUE") {
        const now = Date.now();
        return VOCAB.filter(v => isDueWord(v, now)).sort((a, b) => srsData[a.id].due - srsData[b.id].due);
      }
      return VOCAB.filter(v => v.topic === currentTopic);
    }

    function randomMerge(a, b) {
      const out = []; let i = 0, j = 0;
      while (i < a.length || j < b.length) {
        const la = a.length - i, lb = b.length - j;
        if (Math.random() < la / (la + lb)) out.push(a[i++]); else out.push(b[j++]);
      }
      return out;
    }

    function buildStudyQueue(forceReset) {
      const sessionScoped = !extraPracticeMode && !searchQuery();
      if (!forceReset && tryRestoreActiveSession()) {
        return;
      }
      if (forceReset && sessionScoped) clearActiveSession(currentTopic);
      const now = Date.now();
      const scope = getScopeWords();
      let list = [];

      if (extraPracticeMode) {
        list = shuffle(scope.filter(v => srsData[v.id] && !srsData[v.id].ignored)).slice(0, 25);
      } else {
        const cap = Number(userSettings.reviewCap) >= 9999 ? Infinity : Number(userSettings.reviewCap);
        const dueSource = searchQuery() ? scope : VOCAB;
        const due = dueSource.filter(v => isDueWord(v, now))
          .sort((a, b) => srsData[a.id].due - srsData[b.id].due)
          .slice(0, cap);
        const fresh = currentTopic === "ALL_DUE" ? [] : scope.filter(v => !srsData[v.id]).slice(0, getRemainingDailyNewQuota());
        if (userSettings.queueOrder === "due_first") list = [...due, ...fresh];
        else if (userSettings.queueOrder === "new_first") list = [...fresh, ...due];
        else list = randomMerge(due, fresh);
      }

      studyQueue = list.map(w => Object.assign({ _new: !srsData[w.id] }, w));
      sessionTopic = sessionScoped ? currentTopic : "";
      sessionTotal = studyQueue.length;
      sessionDone = 0;
      smartTick = 0;
      lastSmartWordId = "";
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length) pickNextSmartItem();
      saveActiveSession();
    }

    function advanceQueueWithQuality(q) {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      const qLen = studyQueue.length;
      if (q === 0) {
        if (!v._lapsed && !extraPracticeMode) { v._lapsed = true; v._rated = true; rateWordSRS(v.id, 0); }
        else v._lapsed = true;
        logActivity(v.id);
        const minGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(3, Math.floor(qLen * 0.25)));
        const maxGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(6, Math.floor(qLen * 0.75)));
        studyQueue.splice(rint(minGap, maxGap), 0, v);
      } else if (q === 1 && !v._hardRepeated && !v._lapsed && qLen >= 3) {
        rateOnce(v, 1);
        v._hardRepeated = true;
        studyQueue.splice(rint(Math.ceil(qLen * 0.45), qLen), 0, v);
      } else {
        rateOnce(v, q);
        sessionDone++;
      }
      isFlipped = false;
      bumpCard();
      saveActiveSession();
      renderAll();
    }

    function handleResult(ok) {
      if (currentMode === "smart") completeSmartStep(ok);
      else advanceQueueWithQuality(ok ? 2 : 0);
    }

    /* ---------- Chế độ Học: thẻ mới + bài tập trộn ngẫu nhiên theo giới hạn từ hàng ngày ---------- */
    function pickNextSmartItem() {
      if (!studyQueue.length) return;
      smartTick++;

      // Khởi tạo trạng thái cho toàn bộ hàng đợi của phiên học (theo giới hạn từ hàng ngày)
      for (let i = 0; i < studyQueue.length; i++) {
        const w = studyQueue[i];
        if (typeof w._stage !== "number") {
          w._stage = w._new ? 0 : 1;
          w._mistakes = 0;
        }
      }

      // Chọn ngẫu nhiên 1 từ trong nhóm 4 từ đầu hàng đợi (khác với từ vừa hỏi ở lượt ngay trước đó)
      const frontCount = Math.min(4, studyQueue.length);
      const candidates = [];
      for (let i = 0; i < frontCount; i++) {
        if (studyQueue[i].id !== lastSmartWordId) candidates.push(i);
      }
      const pickIdx = candidates.length ? candidates[rint(0, candidates.length - 1)] : 0;
      if (pickIdx > 0) {
        const picked = studyQueue.splice(pickIdx, 1)[0];
        studyQueue.unshift(picked);
      }

      const pick = studyQueue[0];
      lastSmartWordId = pick.id;

      const exclude = pick._lastTask;
      const choose = list => { const l = list.filter(t => t !== exclude); const src = l.length ? l : list; return src[rint(0, src.length - 1)]; };
      if (pick._stage === 0) pick._task = "intro";
      else if (pick._stage === 1) pick._task = choose(["mcq_en2vi", "mcq_vi2en", "listen_choice"]);
      else if (pick._stage === 2) pick._task = choose(["mcq_vi2en", "listen_choice", "mcq_en2vi"]);
      else pick._task = choose(makeCloze(pick) ? ["cloze", "dictation"] : ["dictation"]);
      pick._lastTask = pick._task;
      bumpCard();
    }

    function completeSmartStep(ok) {
      if (!studyQueue.length) return;
      const v = studyQueue[0];
      const s = v._stage;

      if (s === 0) {
        v._stage = v._resume || 1;
        v._resume = null;
        v._relearn = false;
      } else if (ok) {
        if (s >= 3) {
          graduateSmartWord(v);
          return;
        }
        v._stage = s + 1;
      } else {
        v._mistakes = (v._mistakes || 0) + 1;
        v._resume = Math.max(1, s - 1);
        v._stage = 0;
        v._relearn = true;
      }

      // Khoảng lặp ngẫu nhiên trải rộng theo toàn bộ giới hạn từ học hàng ngày (studyQueue.length)
      // thay vì chỉ lặp quanh quẩn 6 từ đầu!
      studyQueue.shift();
      const qLen = studyQueue.length;
      let insertPos = qLen;
      if (qLen > 3) {
        if (ok || s === 0) {
          const minGap = Math.min(qLen, Math.max(4, Math.floor(qLen * 0.35)));
          const maxGap = qLen;
          insertPos = rint(minGap, maxGap);
        } else {
          const minGap = Math.min(qLen, Math.max(3, Math.floor(qLen * 0.20)));
          const maxGap = Math.min(qLen, Math.max(6, Math.floor(qLen * 0.60)));
          insertPos = rint(minGap, maxGap);
        }
      }
      studyQueue.splice(insertPos, 0, v);

      isFlipped = false;
      pickNextSmartItem();
      saveActiveSession();
      renderAll();
    }

    function graduateSmartWord(v) {
      studyQueue.shift();
      const m = v._mistakes || 0;
      if (!extraPracticeMode) {
        if (v._new) rateWordSRS(v.id, m >= 2 ? 1 : 2);
        else if (m === 0) rateWordSRS(v.id, 3);
        else if (m === 1) rateWordSRS(v.id, 1);
        else rateWordSRS(v.id, 0, true);
      }
      logActivity(v.id);
      sessionDone++;
      isFlipped = false;
      saveActiveSession();
      if (studyQueue.length) pickNextSmartItem(); else { clearActiveSession(); bumpCard(); }
      renderAll();
    }

    /* ---------- Âm thanh ---------- */
    function playAudio(src, word, lang) {
      if (src) {
        const p = $("audioPlayer");
        p.src = src;
        p.play().catch(() => speak(word, lang));
      } else speak(word, lang);
    }
    function speak(text, lang) {
      if ("speechSynthesis" in window && text) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        speechSynthesis.speak(u);
      }
    }
    function playVocab(id, accent) {
      const v = VOCAB_BY_ID.get(id);
      if (!v) return;
      if (accent === "uk") playAudio(v.localUkAudio, v.word, "en-GB");
      else playAudio(v.localUsAudio || v.localUkAudio, v.word, "en-US");
    }
    function autoPlayIfNeeded() {
      if (lastPlayedSerial === cardSerial || !studyQueue.length || currentMode === "list" || currentMode === "match") return;
      lastPlayedSerial = cardSerial;
      const v = studyQueue[0];
      let should = false;
      if (currentMode === "listen") should = true;
      else if (currentMode === "smart") should = ["listen_choice", "dictation"].includes(v._task) || (userSettings.autoAudio && ["intro", "mcq_en2vi"].includes(v._task));
      else if (currentMode === "flashcard") should = userSettings.autoAudio;
      else if (currentMode === "quiz") should = userSettings.autoAudio && !!(cardCache.quiz && cardCache.quiz.enToVi);
      if (should) setTimeout(() => playVocab(v.id, "us"), 120);
    }

    /* ---------- Thống kê ---------- */
    function computeStats() {
      const now = Date.now();
      const s = { total: VOCAB.length, learning: 0, ignored: 0, due: 0, mastered: 0, topics: {} };
      for (const v of VOCAB) {
        const t = s.topics[v.topic] || (s.topics[v.topic] = { total: 0, touched: 0, due: 0 });
        t.total++;
        const st = srsData[v.id];
        if (!st) continue;
        t.touched++;
        if (st.ignored) { s.ignored++; continue; }
        s.learning++;
        if (now >= st.due) { s.due++; t.due++; }
        else if (st.interval >= 7) s.mastered++;
      }
      return s;
    }

    function shiftCalMonth(d) { calMonthOffset = Math.min(0, calMonthOffset + d); renderStats(); }

    function calendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDow = (new Date(year, month, 1).getDay() + 6) % 7;
      const todayStr = getTodayStr();
      const keyOf = d => year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");

      let total = 0, active = 0;
      let cells = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(n => `<div class="cal-dow">${n}</div>`).join("") + "<div></div>".repeat(startDow);
      for (let d = 1; d <= daysInMonth; d++) {
        const key = keyOf(d);
        const cnt = (dayLog[key] || []).length;
        total += cnt; if (cnt) active++;
        const lv = !cnt ? 0 : cnt < 10 ? 1 : cnt < 20 ? 2 : cnt < 40 ? 3 : 4;
        cells += `<div class="cal-day lv${lv}${key === todayStr ? " today" : ""}" title="${d}/${month + 1}: ${cnt} từ">${d}${cnt ? `<span>${cnt}</span>` : ""}</div>`;
      }

      let streak = 0;
      const cur = new Date();
      if (!(dayLog[localDateStr(cur)] || []).length) cur.setDate(cur.getDate() - 1);
      while ((dayLog[localDateStr(cur)] || []).length) { streak++; cur.setDate(cur.getDate() - 1); }

      return `<div class="cal-wrap">
        <div class="cal-head">
          <button class="mode-btn" onclick="shiftCalMonth(-1)">‹</button><b>Tháng ${month + 1}/${year}</b>
          <button class="mode-btn" onclick="shiftCalMonth(1)" ${calMonthOffset >= 0 ? 'disabled style="opacity:.4"' : ""}>›</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot">
          <span>🔥 Chuỗi <b>${streak}</b> ngày</span><span>📅 <b>${active}</b> ngày học</span><span>📝 <b>${total}</b> từ</span>
          <span class="cal-legend">Ít <i class="cal-day lv1"></i><i class="cal-day lv2"></i><i class="cal-day lv3"></i><i class="cal-day lv4"></i> Nhiều</span>
        </div>
      </div>`;
    }

    function pickDistractors(v) {
      const out = [], used = new Set([v.id]);
      const samePos = Math.random() < 0.7;
      let guard = 0;
      while (out.length < 3 && guard++ < 500) {
        const c = VOCAB[Math.floor(Math.random() * VOCAB.length)];
        if (used.has(c.id) || c.word.toLowerCase() === v.word.toLowerCase()) continue;
        if (samePos && guard < 250 && c.pos !== v.pos) continue;
        used.add(c.id); out.push(c);
      }
      return out;
    }

    function quizHtml(v, dir) {

        enToVi: dir === "en2vi" || (dir === "mix" && Math.random() < 0.5),

      }));
      const img = v.localImg ? `<img class="fc-front-img" style="max-height:165px;" src="${v.localImg}" alt="">` : "";
      const prompt = q.enToVi
        ? `<div class="center">${img}<div class="fc-word">${v.word} <span class="fc-pos">${v.pos}</span></div>
             <div class="fc-ipa">${v.ipa} <button class="audio-pill" onclick="playVocab('${v.id}','us')">🔊</button></div></div>`
        : `<div class="prompt-box"><b>Định nghĩa:</b><br>${(v.defRaw || "").replace(/\n/g, "<br>")}</div>`;
      const opts = q.choices.map(c => {
        const label = q.enToVi ? (c.defVi || c.defRaw) : `<b>${c.word}</b> ${c.pos}`;
        return `<button class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)">${label}</button>`;
      }).join("");
      const dirBtns = currentMode === "quiz"
        ? ["en2vi:Anh ➔ Việt", "vi2en:Việt ➔ Anh", "mix:Trộn"].map(s => { const [k, l] = s.split(":"); return `<button class="mode-btn ${quizDirection === k ? "active" : ""}" onclick="setQuizDir('${k}')">${l}</button>`; }).join("")
        : "";
      return `<div class="quiz-box">${headerHtml(v, dirBtns)}${prompt}<div class="options-grid">${opts}</div></div>`;
    }
    function setQuizDir(d) { quizDirection = d; cardCache = {}; renderMain(); }
    function setListenSub(d) { listenSubMode = d; cardCache = {}; renderMain(); }

    function answerChoice(btn) {
      if (tapTooSoon()) return;
      const grid = btn.parentElement;
      if (grid.dataset.locked === "1") return;
      grid.dataset.locked = "1";
      const ok = btn.dataset.correct === "true";
      btn.classList.add(ok ? "correct" : "wrong");
      if (!ok) { const r = grid.querySelector('[data-correct="true"]'); if (r) r.classList.add("correct"); }
      const serial = cardSerial;
      setTimeout(() => { if (serial === cardSerial) handleResult(ok); }, ok ? 1100 : 2200);
    }

    function normalizeAns(s) { return s.toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, " ").trim(); }
    let ansToastTimer = null;
    function showAnsToast(ok, rightAns) {
      let t = document.getElementById("s4AnsToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4AnsToast";
        document.body.appendChild(t);
      }
      if (ansToastTimer) clearTimeout(ansToastTimer);
      t.className = "s4-ans-toast " + (ok ? "correct" : "wrong");
      t.textContent = ok ? "✓ Chính xác" : "✗ Đáp án: " + rightAns;
      requestAnimationFrame(() => t.classList.add("show"));
      ansToastTimer = setTimeout(() => t.classList.remove("show"), ok ? 1300 : 2400);
    }

    function scrollInputIntoOptimalView(el) {
      if (!el) return;
      setTimeout(() => {
        try { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); } catch (e) {}
      }, 150);
    }
    function onAnsInputEdit(inp) {
      if (!inp) return;
      inp.dataset.wrongWaiting = "0";
      inp.classList.remove("correct", "wrong");
    }
    function handleAnsKeydown(ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const inp = $("ansInput");
        if (inp && inp.dataset.wrongWaiting === "1") {
          handleResult(false);
          return;
        }
        checkText();
      }
    }
    function checkText() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      const answers = cardCache.answers || [];
      const ok = answers.includes(normalizeAns(inp.value));
      finishText(inp, ok, false);
    }
    function giveUp() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      finishText(inp, false, true);
    }
    function finishText(inp, ok, isGiveUp) {
      const rightAns = (studyQueue[0] && studyQueue[0].word) || (cardCache.answers || [""])[0];
      if (isGiveUp) inp.value = rightAns;

      inp.classList.remove("correct", "wrong");
      inp.classList.add(ok ? "correct" : "wrong");

      document.querySelectorAll("#cardHost .blank").forEach(b => {
        b.classList.remove("correct", "wrong");
        b.classList.add(ok ? "correct" : "wrong");
        b.textContent = rightAns;
      });

      const fb = $("ansFeedback");
      const nextBtn = $("nextAfterWrongBtn");

      if (ok) {
        inp.dataset.locked = "1";
        inp.dataset.wrongWaiting = "0";
        if (fb) {
          fb.style.color = "var(--success)";
          fb.innerHTML = `✓ Chính xác: <b>${rightAns}</b>`;
        }
        if (nextBtn) nextBtn.style.display = "none";
        showAnsToast(true, rightAns);
        const w = studyQueue[0];
        if (w) playVocab(w.id, "uk");
        const passSrs = inp.dataset.hadWrong !== "1";
        const serial = cardSerial;
        setTimeout(() => { if (serial === cardSerial) handleResult(passSrs); }, 1100);
      } else {
        // Không tự động chuyển câu khi sai: tô đỏ nhẹ + hiện đáp án đúng để người học quan sát
        inp.dataset.hadWrong = "1";
        inp.dataset.wrongWaiting = "1";
        if (fb) {
          fb.style.color = "var(--danger)";
          fb.innerHTML = `✗ Chưa đúng — Đáp án đúng: <span class="dic-ans-hint">✓ ${rightAns}</span>`;
        }
        if (nextBtn) nextBtn.style.display = "inline-flex";
        showAnsToast(false, rightAns);
        const w = studyQueue[0];
        if (w) playVocab(w.id, "uk");
      }
    }
    function textInputHtml(placeholder) {
      return `<input type="text" id="ansInput" class="text-input" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" oninput="onAnsInputEdit(this)" onkeydown="handleAnsKeydown(event)">
        <div id="ansFeedback" style="margin-top:8px;font-weight:700;font-size:14px;min-height:24px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
          <button class="mode-btn active" onclick="checkText()">✔️ Kiểm tra</button>
          <button class="mode-btn" onclick="giveUp()">💡 Hiện đáp án</button>
          <button class="mode-btn" id="nextAfterWrongBtn" style="display:none;background:var(--primary);color:#fff;border-color:var(--primary);" onclick="handleResult(false)">Câu tiếp theo ➔</button>
        </div>`;
    }

    function listenHtml(v, sub) {
      cardCache.answers = [normalizeAns(v.word)];
      let body;
      if (sub === "choice") {
        const choices = cacheGet("listen", () => shuffle([v, ...pickDistractors(v)]));
        body = `<div class="options-grid">${choices.map(c => `<button class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)"><b>${c.word}</b> ${c.pos}</button>`).join("")}</div>`;
      } else {
        body = `<div class="center" style="margin-top:14px;color:var(--muted);">Nghĩa: <b>${v.defVi || v.defRaw}</b> ${v.pos}</div>${textInputHtml("Gõ từ bạn nghe được...")}`;
      }
      const subBtns = currentMode === "listen"
        ? `<button class="mode-btn ${sub === "choice" ? "active" : ""}" onclick="setListenSub('choice')">Chọn từ</button><button class="mode-btn ${sub === "dictation" ? "active" : ""}" onclick="setListenSub('dictation')">Chính tả</button>`
        : "";
      return `<div class="quiz-box">${headerHtml(v, subBtns)}
        <div class="audio-row" style="margin:14px 0;"><button class="audio-pill" style="font-size:15.5px;padding:10px 18px;" onclick="playVocab('${v.id}','uk')">🔊 UK</button><button class="audio-pill" style="font-size:15.5px;padding:10px 18px;" onclick="playVocab('${v.id}','us')">🔊 US</button></div>
        ${body}</div>`;
    }

    function makeCloze(v) {
      const ex = (v.examples || []).find(e => /<b[^>]*>[^<]+<\/b>/i.test(e));
      if (!ex) return null;
      const answers = [normalizeAns(v.word)];
      const html = ex.replace(/<b[^>]*>([^<]+)<\/b>/gi, (m, t) => { answers.push(normalizeAns(t)); return '<span class="blank">_____</span>'; });
      return { html, answers };
    }
    function clozeHtml(v) {
      const c = makeCloze(v);
      cardCache.answers = c ? c.answers : [normalizeAns(v.word)];
      const img = v.localImg ? `<img class="fc-front-img" style="max-height:140px;" src="${v.localImg}" alt="">` : "";
      const hint = `Gợi ý: <b>${v.word[0]}… (${v.word.length} ký tự)</b>`;
      return `<div class="quiz-box center">${headerHtml(v, `<span style="font-size:12.5px;color:var(--muted);">${hint}</span>`)}
        ${img}
        <div class="prompt-box" style="font-size:18px;margin:12px 0;text-align:left;">${c ? c.html : (v.defRaw || "").replace(/\n/g, "<br>")}</div>
        <div style="color:var(--muted);">Nghĩa: <b>${v.defVi || v.defRaw}</b> ${v.pos}</div>
        ${textInputHtml("Nhập từ vựng...")}</div>`;
    }

    function smartHtml() {
      if (!studyQueue[0]._task) pickNextSmartItem();
      const v = studyQueue[0];
      switch (v._task) {
        case "intro": {
          const label = v._relearn ? "Đã xem lại ➔ Tiếp tục" : "Đã hiểu ➔ Tiếp tục";
          return flashcardHtml(v, backHtml(v), `<button class="btn-flip green" onclick="introDone()">${label}</button>`);
        }
        case "mcq_en2vi": return quizHtml(v, "en2vi");
        case "mcq_vi2en": return quizHtml(v, "vi2en");
        case "listen_choice": return listenHtml(v, "choice");
        case "dictation": return listenHtml(v, "dictation");
        default: return clozeHtml(v);
      }
    }

    function matchHtml() {
      const tiles = cacheGet("tiles", () => {
        const t = [];
        studyQueue.slice(0, 6).forEach(w => {
          t.push({ id: w.id, html: `<b>${w.word}</b><br><span style="font-size:12px;color:var(--muted)">${w.ipa}</span>` });
          t.push({ id: w.id, html: (w.defVi || w.defRaw || "").slice(0, 75) });
        });
        return shuffle(t);
      });
      return `<div class="quiz-box"><b style="color:var(--primary);">🧩 Ghép từ với nghĩa</b>
        <div class="match-grid" id="matchGrid">${tiles.map(t => `<div class="match-tile" data-pair="${t.id}" onclick="clickMatchTile(this)"><div>${t.html}</div></div>`).join("")}</div></div>`;
    }
    let matchSelected = null;
    function clickMatchTile(el) {
      if (el.classList.contains("matched")) return;
      if (!matchSelected) { matchSelected = el; el.classList.add("selected"); return; }
      if (matchSelected === el) { el.classList.remove("selected"); matchSelected = null; return; }
      const prev = matchSelected;
      matchSelected = null;
      if (prev.dataset.pair === el.dataset.pair) {
        prev.classList.remove("selected");
        prev.classList.add("matched"); el.classList.add("matched");
        const idx = studyQueue.findIndex(x => x.id === el.dataset.pair);
        if (idx !== -1) { rateOnce(studyQueue[idx], 2); studyQueue.splice(idx, 1); sessionDone++; }
        if (!document.querySelector("#matchGrid .match-tile:not(.matched)")) {
          const serial = cardSerial;
          setTimeout(() => { if (serial === cardSerial) { bumpCard(); renderAll(); } }, 450);
        }
      } else {
        el.classList.add("error");
        setTimeout(() => { prev.classList.remove("selected"); el.classList.remove("error"); }, 450);
      }
    }

    function listHtml(words) {
      let f = words;
      if (listFilter === "learned") f = words.filter(v => srsData[v.id] && !srsData[v.id].ignored);
      else if (listFilter === "ignored") f = words.filter(v => srsData[v.id] && srsData[v.id].ignored);
      else if (listFilter === "unseen") f = words.filter(v => !srsData[v.id]);
      const cnt = fn => words.filter(fn).length;
      const btn = (k, label) => `<button class="mode-btn ${listFilter === k ? "active" : ""}" onclick="listFilter='${k}';listLimit=100;renderMain()">${label}</button>`;
      const bar = `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        ${btn("all", `Tất cả (${words.length})`)}${btn("unseen", `Chưa học (${cnt(v => !srsData[v.id])})`)}
        ${btn("learned", `Đang học (${cnt(v => srsData[v.id] && !srsData[v.id].ignored)})`)}${btn("ignored", `Đã biết (${cnt(v => srsData[v.id] && srsData[v.id].ignored)})`)}
      </div>`;
      const rows = f.slice(0, listLimit).map(v => {
        const st = srsData[v.id];
        const status = st && st.ignored
          ? `<span class="badge-status ign">Đã biết</span> <button class="mode-btn" style="padding:3px 8px;font-size:11.5px;" onclick="unignoreWord('${v.id}')">↩️ Học lại</button>`
          : st ? `<span class="badge-status">Chu kỳ ${Math.round(st.interval)} ngày</span>`
          : `<button class="skip-known-btn" style="padding:3px 8px;font-size:11.5px;" onclick="markKnown('${v.id}')">⏭️ Đã biết</button>`;
        return `<div class="word-card"><div style="flex:1;min-width:230px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:20px;font-weight:800;color:var(--primary);">${v.word}</span><span style="color:var(--muted);">${v.pos}</span>
            <span style="color:var(--danger);font-family:monospace;">${v.ipa}</span>
            <button class="audio-pill" style="padding:3px 9px;font-size:12px;" onclick="playVocab('${v.id}','uk')">UK</button>
            <button class="audio-pill" style="padding:3px 9px;font-size:12px;" onclick="playVocab('${v.id}','us')">US</button>${status}
          </div>
          <div style="margin-top:8px;line-height:1.5;">${(v.defRaw || "").replace(/\n/g, "<br>")}</div>
          ${v.examples && v.examples.length ? `<div style="margin-top:8px;font-size:14.5px;color:var(--success);line-height:1.55;">${exampleHtml(v.examples)}</div>` : ""}
        </div>${v.localImg ? `<img class="word-card-img" loading="lazy" src="${v.localImg}" alt="">` : ""}</div>`;
      }).join("");
      const more = f.length > listLimit ? `<button class="btn-action" style="background:var(--primary);color:#fff;width:100%;" onclick="listLimit+=100;renderMain()">Hiện thêm (${f.length - listLimit})</button>` : "";
      return bar + (rows || '<div class="quiz-box center">Không có từ nào.</div>') + more;
    }

    function finishHtml(words) {
      const unseen = currentTopic === "ALL_DUE" ? 0 : words.filter(v => !srsData[v.id]).length;
      const hasLearned = words.some(v => srsData[v.id] && !srsData[v.id].ignored);
      return `<div class="finish-box"><div style="font-size:46px;">🎉</div>
        <h2 style="margin:8px 0 0 0;color:var(--success);">${extraPracticeMode ? "Xong lượt ôn luyện!" : "Hoàn thành phiên học!"}</h2>
        ${sessionDone ? `<p style="color:var(--muted);margin:8px 0 0 0;">Đã xử lý ${sessionDone} từ</p>` : ""}
        <div class="finish-actions">
          ${extraPracticeMode ? `<button class="btn-action" style="background:var(--primary);color:#fff;" onclick="exitPractice()">Quay lại học chính</button>` : ""}
          ${!extraPracticeMode && unseen > 0 ? `<button class="btn-action" style="background:var(--primary);color:#fff;" onclick="addBonusNewWords(10)">➕ Học thêm 10 từ mới</button>` : ""}
          ${hasLearned ? `<button class="btn-action" style="background:var(--success);color:#fff;" onclick="startFreePractice()">🔄 Ôn luyện thêm</button>` : ""}
          <button class="btn-action" style="background:var(--bg);color:var(--text);border:1px solid var(--border);" onclick="setMode('list')">📖 Danh sách</button>
        </div></div>`;
    }

    function sessionBarHtml() {
      const pct = sessionTotal ? Math.round(sessionDone / sessionTotal * 100) : 0;
      // Chỉ hiện nút làm mới khi phiên đã có tiến trình dở dang (đã làm xong từ nào đó hoặc có từ đã qua bước 0)
      const inProgress = !!sessionTopic && !extraPracticeMode && !searchQuery() &&
        (sessionDone > 0 || studyQueue.some(w => (w._mistakes || 0) > 0 || w._stage > (w._new ? 0 : 1)));
      return `<div class="sess-row">
        <span>
          ${extraPracticeMode ? "Ôn luyện (không ảnh hưởng lịch ôn)" : "Phiên học"}
          ${extraPracticeMode ? ` <button class="skip-known-btn" onclick="exitPractice()">Thoát</button>` : ""}
          ${inProgress ? ` <button class="skip-known-btn" style="color:var(--danger);margin-left:4px;" onclick="restartSession()" title="Bỏ tiến trình dở dang của phiên này và tạo phiên mới">🔄 Phiên mới</button>` : ""}
        </span>
        <span>${sessionDone}/${sessionTotal}</span>
      </div>
      <div class="sess-bar"><i style="width:${pct}%"></i></div>`;
    }
    function restartSession() {
      if (!confirm("Bỏ tiến trình dở dang của phiên học này và tạo phiên mới?\n(Các từ đã học xong vẫn được giữ nguyên.)")) return;
      buildStudyQueue(true);
      renderAll();
    }

    function renderMain() {
      document.body.classList.toggle("scroll-mode", currentMode === "list" || !!panel);
      renderStats();
      const host = $("cardHost");
      if (currentMode === "list") { host.innerHTML = listHtml(getScopeWords()); return; }
      if (!studyQueue.length) { host.innerHTML = finishHtml(getScopeWords()); return; }
      const v = studyQueue[0];
      let html;
      switch (currentMode) {
        case "flashcard":
          html = isFlipped
            ? flashcardHtml(v, backHtml(v), `<div class="srs-buttons">
                <button class="srs-btn" style="background:#dc2626;" onclick="rateBtn(0)">🔴 Quên</button>
                <button class="srs-btn" style="background:#d97706;" onclick="rateBtn(1)">🟠 Khó</button>
                <button class="srs-btn" style="background:#16a34a;" onclick="rateBtn(2)">🟢 Nhớ</button>
                <button class="srs-btn" style="background:#2563eb;" onclick="rateBtn(3)">🔵 Rất dễ</button></div>`)
            : flashcardHtml(v, "", `<button class="btn-flip" onclick="flipCard()">Hiện nghĩa</button>`);
          break;
        case "smart": html = smartHtml(); break;
        case "quiz": html = quizHtml(v, quizDirection); break;
        case "listen": html = listenHtml(v, listenSubMode); break;
        case "match": html = matchHtml(); break;
        default: html = clozeHtml(v);
      }
      host.innerHTML = sessionBarHtml() + html;
      const inp = host.querySelector(".text-input");
      if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }
      autoPlayIfNeeded();
    }

    function renderAll() {
      lastStats = computeStats();
      renderSidebar();
      renderMain();
    }

    /* ---------- Phím tắt ---------- */
    window.addEventListener("keydown", e => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (currentMode === "list" || !studyQueue.length) return;
      const key = e.key.toLowerCase();
      if (key === "x") { e.preventDefault(); ignoreCurrentWord(); return; }
      if (["1", "2", "3", "4"].includes(key)) {
        const opts = document.querySelectorAll("#cardHost .opt-btn");
        if (opts.length) { const b = opts[Number(key) - 1]; if (b) b.click(); return; }
      }
      if (currentMode === "smart" && e.code === "Space" && studyQueue[0]._task === "intro") { e.preventDefault(); introDone(); return; }
      if (currentMode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); if (!isFlipped) flipCard(); }
        else if (isFlipped && ["1", "2", "3", "4"].includes(key)) advanceQueueWithQuality(Number(key) - 1);
      }
    });

    /* ---------- Sao lưu / Khôi phục / Đặt lại ---------- */
    function exportProgress() {
      const data = { app: "study4-vocab", version: 2, exportedAt: new Date().toISOString(), srsData, dayLog, userSettings };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      a.download = "Study4_Vocab_Backup_" + getTodayStr() + ".json";
      a.click();
    }
    function importProgress(ev) {
      const f = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const obj = JSON.parse(r.result);
          if (!obj.srsData || typeof obj.srsData !== "object") throw new Error("invalid");
          if (!confirm("Tiến độ hiện tại sẽ bị thay bằng bản sao lưu. Tiếp tục?")) return;
          srsData = {};
          Object.keys(obj.srsData).forEach(k => { if (VOCAB_BY_ID.has(k)) srsData[k] = obj.srsData[k]; });
          dayLog = obj.dayLog && typeof obj.dayLog === "object" ? obj.dayLog : {};
          userSettings = Object.assign({}, DEFAULT_SETTINGS, obj.userSettings || {});
          studyQueue = []; sessionTopic = ""; clearActiveSession();   // dữ liệu mới -> bỏ phiên dở cũ
          saveState();
          buildStudyQueue(true);
          renderAll();
          alert("✅ Đã khôi phục tiến độ.");
        } catch (e) { alert("❌ File sao lưu không hợp lệ."); }
      };
      r.readAsText(f);
    }
    function resetProgress() {
      if (!confirm("Xóa TOÀN BỘ tiến độ từ vựng (từ đã học, lịch ôn, lịch sử, cài đặt)?\nNên bấm 💾 Sao lưu trước. Hành động này không thể hoàn tác.")) return;
      [KEYS.srs, KEYS.days, KEYS.settings].forEach(k => localStorage.removeItem(k));
      studyQueue = []; sessionTopic = ""; clearActiveSession();
      srsData = {}; dayLog = {};
      userSettings = Object.assign({}, DEFAULT_SETTINGS);
      currentTopic = TOPICS[0] || "ALL";
      extraPracticeMode = false;
      buildStudyQueue(true);
      renderAll();
    }

    let searchTimer = null;
    $("searchWordInput").oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { buildStudyQueue(); renderAll(); }, 250);
    };

    buildStudyQueue();
    renderAll();
  </script>
  <script src="../assets/ghibli/ghibli-theme.js?v=24"></script>
</body>
</html>
