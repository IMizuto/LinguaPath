  <meta name="theme-color" id="metaThemeColor" content="#0d1813">
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
    } catch (e) {}
  })();
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      min-height: 100vh;
      background: transparent !important;
      color: var(--lg-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html.theme-ghibli, html.theme-ghibli body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    .fnd-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 14px 80px;
    }
    .fnd-layout {
      display: grid;
      grid-template-columns: var(--lp-sidebar-w, 336px) minmax(0, 1fr);

      top: 72px;
      border-radius: 22px;
      padding: 14px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
    }
    .fnd-sb-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid transparent;

      color: var(--lg-ink);
      cursor: pointer;

    .fnd-sb-item:hover { background: var(--lg-wash); }

      background: var(--lg-accent-soft);

    }
    .fnd-sb-code {
      display: block;

      color: var(--lg-accent);
    }
    .fnd-sb-title {
      display: block;

      font-weight: 800;
      line-height: 1.35;
      color: var(--lg-ink);

    .fnd-card {

    }
    .fnd-tabs {

      flex-wrap: wrap;
      margin-top: 12px;
    }
    .fnd-tab {
      display: inline-flex;

      gap: 6px;

      border-radius: 999px;

      background: var(--lg-wash);
      color: var(--lg-ink-sub);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .fnd-tab.active {
      background: var(--lg-accent);
      border-color: transparent;
      color: #fff;
    }
    .fnd-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);

      font-size: 12.5px;
      font-weight: 700;

    .fnd-btn:hover { background: var(--lg-wash-hover); }
    .fnd-btn.primary {
      background: var(--lg-accent);

    .fnd-btn.done {

    .fnd-line {

    .fnd-vi { font-size: 13px; color: var(--lg-ink-muted); margin-top: 3px; line-height: 1.4; }
    .fnd-vocab-grid {
      display: grid;

    .fnd-vcard {
      padding: 13px;

    .fnd-srs-btn {
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink);
      border-radius: 999px;
      padding: 6px 6px;
      font-size: 11.5px;
      font-weight: 800;

      gap: 4px;
    }
    .fnd-srs-btn:hover { background: var(--lg-wash-hover); }
    .fnd-dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .fnd-textarea {
      width: 100%;
      min-height: 110px;
      border-radius: 14px;
      border: 1px solid var(--lg-hairline);

    .fnd-drawer-backdrop {
      display: none;

        border-radius: 0 22px 22px 0;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
      }
      body.drawer-open .fnd-sidebar { transform: translateX(0); }
      body.drawer-open .fnd-drawer-backdrop { display: block; }

    @media (max-width: 680px) {
      .fnd-vocab-grid { grid-template-columns: minmax(0, 1fr); }

      .fnd-hide-xs { display: none; }
    }

  <script>
  (function () {
    "use strict";
    var DATA = window.LP_IELTS_FOUNDATION_DATA;
    if (!DATA) return;

    var DONE_KEY = DATA.DONE_KEY || "lp_ielts_foundation_done_v1";
    var SRS_KEY = DATA.SRS_KEY || "lp_ielts_foundation_srs_v1";
    var CLUSTERS = DATA.CLUSTERS || [];
    var CHECK = DATA.READINESS_CHECK;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function readJson(k, fb) {
      try { var v = JSON.parse(localStorage.getItem(k)); return v && typeof v === "object" ? v : fb; } catch (e) { return fb; }
    }
    function writeJson(k, obj) {
      try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e) {}
    }

    var ICONS = {
      volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      circle: '<circle cx="12" cy="12" r="8"/>',
      book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
      award: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
      arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/>'
    };
    function svg(name, sz) {
      var s = sz || 14;
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.book) + '</svg>';
    }

    var doneMap = readJson(DONE_KEY, {});
    var srsMap = readJson(SRS_KEY, {});
    var qs = new URLSearchParams(location.search);
    var reqId = (qs.get("id") || "").trim();
    var reqTab = (qs.get("tab") || "").trim();

    var allNavIds = CLUSTERS.map(function (c) { return c.id; }).concat([CHECK.id]);
    var activeId = allNavIds.indexOf(reqId) >= 0 ? reqId : CLUSTERS[0].id;
    var activeTab = ["dialogue", "vocab", "grammar", "practice", "production"].indexOf(reqTab) >= 0 ? reqTab : "dialogue";
    var reviewMode = qs.get("review");
    if (reviewMode !== "due" && reviewMode !== "new") reviewMode = "";
    var playSlow = true;
    var showVi = true;
    var pracPicked = {};
    var DRAFT_KEY = "lp_ielts_foundation_drafts_v1";
    var drafts = readJson(DRAFT_KEY, {});
    var prodDrafts = drafts.production || {};
    var prodFeedback = {};
    var checkAnswers = drafts.answers || {};
    var checkWriting = typeof drafts.writing === "string" ? drafts.writing : "";
    var checkSpeaking = Boolean(drafts.speaking);
    var checkResult = null;

    function speakEn(text, forceSlow) {
      var rate = (forceSlow !== undefined ? forceSlow : playSlow) ? 0.78 : 1.0;
      if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
        window.S4UI.speakEnglish(text, { lang: "en-US", rate: rate });
      } else if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = rate;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    }
    window.__fndSpeak = speakEn;

    function saveDrafts() {
      writeJson(DRAFT_KEY, { production: prodDrafts, answers: checkAnswers, writing: checkWriting, speaking: checkSpeaking });
    }

    function replaceLessonUrl() {
      var url = new URL(location.href);
      url.searchParams.set("id", activeId);
      if (activeId !== CHECK.id && activeTab !== "dialogue") url.searchParams.set("tab", activeTab);
      else url.searchParams.delete("tab");
      if (!reviewMode) url.searchParams.delete("review");
      history.replaceState(history.state, "", url);
    }

    var stageEl = document.getElementById("mainStage");
    stageEl.addEventListener("click", function (event) {
      var button = event.target.closest("[data-fnd-speak]");
      if (!button) return;
      var speed = button.getAttribute("data-fnd-slow");
      speakEn(button.dataset.fndSpeak, speed === null ? undefined : speed === "true");
    });
    stageEl.addEventListener("input", function (event) {
      if (event.target.id === "fndProdInput") prodDrafts[activeId] = event.target.value;
      else if (event.target.id === "fndCheckWriting") {
        checkWriting = event.target.value;
      } else if (event.target.id === "fndCheckSpeaking") {
        checkSpeaking = Boolean(event.target.checked);
      } else return;
      saveDrafts();
    });
    stageEl.addEventListener("change", function (event) {
      if (event.target && event.target.id === "fndCheckSpeaking") {
        checkSpeaking = Boolean(event.target.checked);
        saveDrafts();
      }
    });

    function refreshStorageState() {
      doneMap = readJson(DONE_KEY, {});
      srsMap = readJson(SRS_KEY, {});
    }

    function rateVocab(wordId, quality) {
      var freshSrs = readJson(SRS_KEY, {});
      srsMap = Object.assign({}, freshSrs, srsMap);
      var cur = srsMap[wordId] || { reps: 0, interval: 0, ease: 2.5, due: 0 };
      var now = Date.now();
      var DAY = 86400000;
      if (quality === 0) {
        cur.reps = 1;
        cur.interval = 0.01;
        cur.due = now + 600000;
      } else if (quality === 1) {
        cur.reps = Math.max(1, (cur.reps || 0) + 1);
        cur.interval = 1;
        cur.due = now + DAY;
      } else if (quality === 2) {
        cur.reps = Math.max(1, (cur.reps || 0) + 1);
        cur.interval = cur.reps <= 1 ? 3 : Math.round((cur.interval || 2) * 2.2);
        cur.due = now + cur.interval * DAY;
      } else {
        cur.reps = Math.max(2, (cur.reps || 0) + 1);
        cur.interval = Math.max(7, Math.round((cur.interval || 3) * 2.8));
        cur.due = now + cur.interval * DAY;
      }
      cur.lastReview = now;
      srsMap[wordId] = cur;
      writeJson(SRS_KEY, srsMap);
      render();
    }
    window.__fndRate = rateVocab;

    function toggleDone(id) {
      var freshDone = readJson(DONE_KEY, {});
      var nextVal = !freshDone[id];
      if (nextVal) freshDone[id] = true;
      else delete freshDone[id];
      doneMap = freshDone;
      writeJson(DONE_KEY, doneMap);
      render();
    }
    window.__fndToggleDone = toggleDone;

    window.addEventListener("storage", function (ev) {
      if (!ev || !ev.key || ev.key === DONE_KEY || ev.key === SRS_KEY) {
        refreshStorageState();
        render();
      }
    });
    window.addEventListener("focus", function () {
      refreshStorageState();
      render();
    });

    window.__fndSelect = function (id) {
      if (allNavIds.indexOf(id) < 0) return;
      activeId = id;
      reviewMode = "";
      replaceLessonUrl();
      document.body.classList.remove("drawer-open");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    window.__fndTab = function (t) { activeTab = t; reviewMode = ""; replaceLessonUrl(); render(); };
    window.__fndToggleSlow = function () { playSlow = !playSlow; render(); };
    window.__fndToggleVi = function () { showVi = !showVi; render(); };
    window.__fndPickPrac = function (cid, qIdx, optIdx) {
      pracPicked[cid + "_" + qIdx] = optIdx;
      render();
    };
    window.__fndCheckProd = function (cid) {
      var c = CLUSTERS.find(function (x) { return x.id === cid; });
      var ta = document.getElementById("fndProdInput");
      if (!c || !ta) return;
      var txt = ta.value.trim();
      prodDrafts[cid] = txt;
      var words = txt.split(/\s+/).filter(Boolean).length;
      var sents = txt.split(/[.!?]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length >= 4; }).length;
      var ok = words >= (c.production.minWords || 12) && sents >= (c.production.minSentences || 3);
      prodFeedback[cid] = {
        ok: ok,
        msg: ok
          ? ("Tốt lắm! Bạn đã viết " + sents + " câu (" + words + " từ). Hãy bấm Nghe thử và đọc to theo mẫu, sau đó đánh dấu hoàn thành cụm này.")
          : ("Hiện có " + sents + "/" + c.production.minSentences + " câu và " + words + "/" + c.production.minWords + " từ. Hãy thêm đủ số câu theo khung gợi ý nhé.")
      };
      render();
    };
    window.__fndPickCheck = function (qid, oi) {
      checkAnswers[qid] = oi;
      saveDrafts();
      checkResult = null;
      render();
    };
    window.__fndSubmitCheck = function () {
      var ta = document.getElementById("fndCheckWriting");
      if (ta) checkWriting = ta.value.trim();
      var spChk = document.getElementById("fndCheckSpeaking");
      if (spChk) checkSpeaking = Boolean(spChk.checked);
      var right = 0;
      var weakClusters = {};
      var bySkill = { listening: [0, 0], reading: [0, 0], grammar: [0, 0] };
      CHECK.questions.forEach(function (q) {
        if (bySkill[q.skill]) bySkill[q.skill][1]++;
        if (checkAnswers[q.id] === q.ans) {
          right++;
          if (bySkill[q.skill]) bySkill[q.skill][0]++;
        } else {
          weakClusters[q.clusterId] = true;
        }
      });
      var words = checkWriting.toLowerCase().match(/[a-z]+(?:['’][a-z]+)*/g) || [];
      var wWords = words.length;
      var wSents = checkWriting.split(/[.!?]+/).filter(function (sentence) {
        return (sentence.match(/[a-z]+/gi) || []).length >= 3;
      }).length;
      var writingFormOk = wWords >= 25 && wSents >= 4;
      var content = checkWriting.toLowerCase().replace(/’/g, "'");
      var missing = [
        { pattern: /\b(?:my name is|i am|i'm)\s+[a-z]+/, label: "tên" },
        { pattern: /\b(?:i live in|i am from|i'm from|i come from)\s+[a-z]+/, label: "nơi ở hoặc quê quán" },
        { pattern: /\b(?:family|mother|father|sister|brother|parents)\b/, label: "gia đình" },
        { pattern: /\b(?:usually|every day|every morning|in the morning|in the evening|wake up|go to bed)\b/, label: "thói quen" },
        { pattern: /\b(?:learn|study|practise|practice)\b[^.!?]*\benglish\b[^.!?]*\b(?:because|so i can|to)\b/, label: "lý do học tiếng Anh" }
      ].filter(function (item) { return !item.pattern.test(content); }).map(function (item) { return item.label; });
      var writingOk = writingFormOk && new Set(words).size >= 12 && missing.length === 0;
      var passed = right >= CHECK.passCorrectMin && writingOk && checkSpeaking;
      checkResult = { right: right, total: CHECK.questions.length, bySkill: bySkill, wWords: wWords, wSents: wSents,
        writingFormOk: writingFormOk, writingOk: writingOk, missing: missing, speakingOk: checkSpeaking, passed: passed, weakIds: Object.keys(weakClusters) };
      if (passed) {
        var freshDone = readJson(DONE_KEY, {});
        freshDone[CHECK.completionId] = true;
        doneMap = freshDone;
        writeJson(DONE_KEY, doneMap);
      }
      render();
    };

    function countAllVocabLearned() {
      var n = 0;
      CLUSTERS.forEach(function (c) {
        c.vocab.forEach(function (v) { if (srsMap[v.id] && srsMap[v.id].reps > 0) n++; });
      });
      return n;
    }

    function renderSidebar() {
      var doneCount = allNavIds.filter(function (id) { return Boolean(doneMap[id === CHECK.id ? CHECK.completionId : id]); }).length;
      var vocabDone = countAllVocabLearned();
      var html = '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--lg-divider);">'
        + '<div style="font-size:11.5px;font-weight:800;text-transform:uppercase;color:var(--lg-accent);">Mốc 0 • Pre-IELTS A0 → A2</div>'

        + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">'

        + '</div>'
        + '<button type="button" class="fnd-btn' + (isDone ? ' done' : '') + '" onclick="window.__fndToggleDone(\'' + c.id + '\')">'
        + svg(isDone ? "check" : "circle", 14) + '<span>' + (isDone ? 'Đã hoàn thành' : 'Đánh dấu hoàn thành') + '</span></button>'
        + '</div>'
        + '<div style="margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--lg-wash);font-size:13px;"><b>Mục tiêu hành động:</b> ' + esc(c.goal) + '</div>'

            ["vocab", "2. Từ vựng SRS (" + c.vocab.length + ")"],
            ["grammar", "3. Mẫu câu"],
            ["practice", "4. Luyện có mẫu"],
            ["production", "5. Tự nói & Viết"]

            return '<button type="button" class="fnd-tab' + (activeTab === t[0] ? ' active' : '') + '" onclick="window.__fndTab(\'' + t[0] + '\')">' + t[1] + '</button>';
          }).join("")
        + '</div>'
        + '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">'
        + '<button type="button" class="fnd-btn" onclick="window.__fndToggleSlow()">' + svg("clock", 13) + ' Tốc độ nghe: ' + (playSlow ? 'Chậm 0.78x' : 'Chuẩn 1.0x') + '</button>'

        + '</section>';

              + '  <div class="fnd-en">' + esc(line.en) + '</div>'

              + '</div>';

          + '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">'
          + c.bridgeLinks.map(function (bl) {
            return '<a class="fnd-btn" href="' + esc(bl.url) + '">' + svg("arrowRight", 13) + '<span>' + esc(bl.label) + '</span></a>';

      } else if (activeTab === "vocab") {
        var visibleVocab = reviewMode ? CLUSTERS.flatMap(function (cluster) { return cluster.vocab; }).filter(function (word) {
          var progress = srsMap[word.id];
          if (reviewMode === "new") return !progress || !progress.reps;
          return progress && progress.reps > 0 && Number(progress.due) <= Date.now();
        }) : c.vocab;
        var vocabHeading = reviewMode === "due" ? "Từ đến hạn của Mốc 0" : reviewMode === "new" ? "Từ mới còn lại của Mốc 0" : "Từ vựng sinh tồn A0–A1";

          }).join("")
          + '</div></section>';
      } else if (activeTab === "grammar") {
        bodyHtml = '<section class="fnd-card lp-glass">'

              + '<div style="font-size:13px;font-weight:700;margin-top:3px;">' + esc(gp.vi) + '</div>'

                return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;background:var(--lg-surface);">'
                  + '<div><div style="font-size:13.5px;font-weight:700;">' + esc(ex.en) + '</div><div style="font-size:12px;color:var(--lg-ink-muted);">' + esc(ex.vi) + '</div></div>'
                  + '<button type="button" class="fnd-btn" style="padding:4px 8px;" data-fnd-speak="' + esc(ex.en) + '">' + svg("volume", 13) + '</button>'

              }).join("") + '</div></div>';
          }).join("")
          + '</section>';
      } else if (activeTab === "practice") {
        bodyHtml = '<section class="fnd-card lp-glass">'
          + '<h2 style="margin:0 0 12px;font-size:16px;font-weight:800;">Luyện tập có mẫu (4 câu)</h2>'
          + c.practice.map(function (q, qi) {
            var pk = pracPicked[c.id + "_" + qi];
            var answered = pk !== undefined;
            var ok = pk === q.ans;
            return '<div style="padding:13px;border-radius:16px;background:var(--lg-wash);margin-bottom:10px;">'

    function render() {
      renderSidebar();
      if (activeId === CHECK.id) renderReadinessCheck();
      else {
        var c = CLUSTERS.find(function (x) { return x.id === activeId; }) || CLUSTERS[0];
        renderCluster(c);
      }
    }

    function syncThemeBtn() {
      var btn = document.getElementById("btnTheme");
      if (!btn) return;
      var isDark = document.documentElement.classList.contains("dark");
      if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
        window.S4UI.renderThemeButton(btn, isDark);
      }
    }

    var themeBtn = document.getElementById("btnTheme");
    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        if (window.toggleDarkModeOnly) window.toggleDarkModeOnly();
        else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
        }
        syncThemeBtn();
      });
    }
    var donateBtn = document.getElementById("btnDonate");
    if (donateBtn) donateBtn.addEventListener("click", function () { if (window.S4Auth && window.S4Auth.openDonateModal) window.S4Auth.openDonateModal(); });
    var menuBtn = document.getElementById("btnMobileMenu");
    if (menuBtn) menuBtn.addEventListener("click", function () { document.body.classList.toggle("drawer-open"); });
    var backdrop = document.getElementById("drawerBackdrop");
    if (backdrop) backdrop.addEventListener("click", function () { document.body.classList.remove("drawer-open"); });

    if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
      window.S4UI.initSmartBackButton({
        element: "#lpBackBtn",
        defaultUrl: "../../index.html#ielts",
        defaultLabel: "IELTS",
        roadmapUrl: "../roadmap/index.html",
        roadmapLabel: "Lộ trình IELTS"
      });
    }
    syncThemeBtn();
    if (typeof MutationObserver !== "undefined") {
      new MutationObserver(syncThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    }
    render();
  })();
  </script>
