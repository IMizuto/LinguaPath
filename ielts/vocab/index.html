        if (found) openVocabCats.add(found.id);
      }
    })();

    function setCatFilter(catId) {
      currentCatFilter = catId;
      if (catId !== "ALL") openVocabCats.add(catId);
      renderSidebar();
    }
    function toggleVocabCat(catId) {
      if (openVocabCats.has(catId)) openVocabCats.delete(catId);
      else openVocabCats.add(catId);
      renderSidebar();
    }

    function selectTopic(t) {
      /* Mở khóa 100% */
      currentTopic = t;
      userSettings.lastTopic = t;
      const idx = TOPICS.indexOf(t);
      if (idx >= 0) {
        const found = TOPIC_CATEGORIES.find(c => idx >= c.range[0] && idx < c.range[1]);
        if (found) openVocabCats.add(found.id);
      }
      extraPracticeMode = false;
      modeBeforeSearch = "";
      $("searchWordInput").value = "";
      if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear($("searchWordInput"));
      saveState();
      buildStudyQueue();
      renderAll();
      toggleSidebar(false);
    }

    function renderSidebar() {
      const st = lastStats;
      const canAccess = () => true;
      const lockBadge = () => "";

      const tabsEl = $("catTabs");
      if (tabsEl) {
        let tabsHtml = `<button class="cat-tab ${currentCatFilter === "ALL" ? "active" : ""}" onclick="setCatFilter('ALL')">Tất cả</button>`;
        TOPIC_CATEGORIES.forEach(c => {
          tabsHtml += `<button class="cat-tab ${currentCatFilter === c.id ? "active" : ""}" onclick="setCatFilter('${c.id}')">${c.short}</button>`;
        });
        tabsEl.innerHTML = tabsHtml;
      }

      const item = (key, name, meta, pct) =>
        `<div class="topic-item ${currentTopic === key ? "active" : ""}" style="${canAccess(key) ? "" : "opacity:0.75;"}" onclick="selectTopic(${JSON.stringify(key).replace(/"/g, "&quot;")})">
          <div class="topic-name">${name} ${lockBadge(key)}</div>${meta}
          ${pct === null ? "" : `<div class="progress-mini"><div class="progress-mini-bar" style="width:${pct}%"></div></div>`}
        </div>`;

      let html = "";
      if (currentCatFilter === "ALL") {
        const spOpen = openVocabCats.has("cat_special");
        html += `<div class="cat-group ${spOpen ? "open" : ""}">
          <div class="cat-header" onclick="toggleVocabCat('cat_special')">
            <span>Ôn tập &amp; Tổng hợp</span>
            <span class="cat-meta"><span style="color:var(--danger);font-weight:800;">Ôn ${st.due}</span>${vIcon(spOpen ? "chevronDown" : "chevronRight", 13)}</span>
          </div>
          <div class="cat-items">
            ${item("ALL_DUE", `${vIcon("bell", 14)} <span>Cần ôn tập hôm nay</span>`, `<div class="topic-meta"><span>Đến hạn ôn SRS</span><b style="color:var(--danger)">${st.due} từ</b></div>`, null)}
            ${item("ALL", `${vIcon("layers", 14)} <span>Tất cả 20 chủ đề</span>`, `<div class="topic-meta"><span>Toàn bộ kho từ</span><b>${st.total} từ</b></div>`, null)}
          </div>
        </div>`;
      }

      TOPIC_CATEGORIES.forEach(cat => {
        if (currentCatFilter !== "ALL" && currentCatFilter !== cat.id) return;
        const slice = TOPICS.slice(cat.range[0], cat.range[1]);
        let catTouched = 0, catTotal = 0;
        let itemsHtml = "";
        slice.forEach((t, idxInSlice) => {
          const globalIdx = cat.range[0] + idxInSlice;
          const ts = st.topics[t] || { touched: 0, total: 1, due: 0 };
          catTouched += ts.touched;
          catTotal += ts.total;
          const pct = Math.round((ts.touched / ts.total) * 100);
          itemsHtml += item(t, `${globalIdx + 1}. ${t}`,
            `<div class="topic-meta"><span>${ts.touched}/${ts.total}${ts.due ? ` • <b style="color:var(--danger)">ôn ${ts.due}</b>` : ""}</span><b>${pct}%</b></div>`, pct);
        });
        const isOpen = currentCatFilter === cat.id || openVocabCats.has(cat.id);
        const catPct = catTotal ? Math.round((catTouched / catTotal) * 100) : 0;
        html += `<div class="cat-group ${isOpen ? "open" : ""}">
          <div class="cat-header" onclick="toggleVocabCat('${cat.id}')">
            <span style="line-height:1.35;">${cat.title}</span>
            <span class="cat-meta">
              <span style="${catPct === 100 ? "color:var(--success);font-weight:800;" : ""}">${catTouched}/${catTotal} (${catPct}%)</span>
              ${vIcon(isOpen ? "chevronDown" : "chevronRight", 13)}
            </span>
          </div>
          <div class="cat-items">${itemsHtml}</div>
        </div>`;
      });

      $("topicList").innerHTML = html;
    }

    const MODE_META = {
      smart: { icon: "graduation", label: "Thông minh" },
      flashcard: { icon: "layers", label: "Flashcard" },
      quiz: { icon: "help", label: "Trắc nghiệm" },
      listen: { icon: "listening", label: "Luyện nghe" },
      match: { icon: "grid", label: "Ghép cặp" },
      cloze: { icon: "edit", label: "Điền từ" },
      list: { icon: "reading", label: "Danh sách từ" }
    };
    const MODE_LABELS = {
      smart: "Thông minh",
      flashcard: "Flashcard",
      quiz: "Trắc nghiệm",
      listen: "Luyện nghe",
      match: "Ghép cặp",
      cloze: "Điền từ",
      list: "Danh sách từ"
    };

    function setMode(m) {
      if (m !== "list") modeBeforeSearch = "";
      currentMode = m;
      syncModeUi(m);
      isFlipped = false;
      if (m === "smart" && studyQueue.length && !studyQueue[0]._task) { pickNextSmartItem(true); }
      else bumpCard();
      if (m !== "list") saveActiveSession();
      renderMain();
    }
    document.addEventListener("click", () => {
      const menu = $("modeDdMenu");
      if (menu) menu.classList.remove("open");
    });
    function togglePanel(p) {
      panel = panel === p ? "" : p;
      document.body.classList.toggle("scroll-mode", currentMode === "list" || !!panel);
      renderStats();
    }
    function shiftCalMonth(d) { calMonthOffset = Math.min(0, calMonthOffset + d); renderStats(); }

    function calendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDow = (new Date(year, month, 1).getDay() + 6) % 7;
      const todayStr = getTodayStr();
      const keyOf = d => year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");

      let total = 0, active = 0;
      let cells = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(n => `<div class="cal-dow">${n}</div>`).join("") + "<div></div>".repeat(startDow);
      for (let d = 1; d <= daysInMonth; d++) {
        const key = keyOf(d);
        const cnt = (dayLog[key] || []).length;
        total += cnt; if (cnt) active++;
        const lv = !cnt ? 0 : cnt < 10 ? 1 : cnt < 20 ? 2 : cnt < 40 ? 3 : 4;
        cells += `<div class="cal-day lv${lv}${key === todayStr ? " today" : ""}" title="${d}/${month + 1}: ${cnt} từ">${d}${cnt ? `<span>${cnt}</span>` : ""}</div>`;
      }

      let streak = 0;
      const cur = new Date();
      if (!(dayLog[localDateStr(cur)] || []).length) cur.setDate(cur.getDate() - 1);
      while ((dayLog[localDateStr(cur)] || []).length) { streak++; cur.setDate(cur.getDate() - 1); }

      return `<div class="cal-wrap">
        <div class="cal-head">
          <button class="mode-btn" onclick="shiftCalMonth(-1)">‹</button><b>Tháng ${month + 1}/${year}</b>
          <button class="mode-btn" onclick="shiftCalMonth(1)" ${calMonthOffset >= 0 ? 'disabled style="opacity:.4"' : ""}>›</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot">
          <span class="v-chip">${vIcon("flame", 13)} Chuỗi <b>${streak}</b> ngày</span><span class="v-chip">${vIcon("calendar", 13)} <b>${active}</b> ngày học</span><span class="v-chip">${vIcon("edit", 13)} <b>${total}</b> từ</span>
          <span class="cal-legend">Ít <i class="cal-day lv1"></i><i class="cal-day lv2"></i><i class="cal-day lv3"></i><i class="cal-day lv4"></i> Nhiều</span>
        </div>
      </div>`;
    }

    function settingsHtml() {
      const opt = (val, label, cur) => `<option value="${val}" ${String(cur) === String(val) ? "selected" : ""}>${label}</option>`;
      const limits = [10, 15, 20, 30, 50, 100, 9999].map(l => opt(l, l === 9999 ? "Không giới hạn" : l + " từ", userSettings.dailyNewLimit)).join("");
      const caps = [30, 50, 100, 200, 9999].map(l => opt(l, l === 9999 ? "Không giới hạn" : l + " từ", userSettings.reviewCap)).join("");
      const orders = [["mix", "Trộn ngẫu nhiên"], ["due_first", "Ôn trước, mới sau"], ["new_first", "Mới trước, ôn sau"]].map(o => opt(o[0], o[1], userSettings.queueOrder)).join("");
      return `<div class="panel v-settings-panel">
        <label class="v-set-item"><span>Từ mới/ngày</span><select class="limit-select" onchange="setOpt('dailyNewLimit',this.value)">${limits}</select></label>
        <label class="v-set-item"><span>Ôn tối đa</span><select class="limit-select" onchange="setOpt('reviewCap',this.value)">${caps}</select></label>
        <label class="v-set-item"><span>Thứ tự</span><select class="limit-select" onchange="setOpt('queueOrder',this.value)">${orders}</select></label>
        <label class="v-set-chk"><input type="checkbox" ${userSettings.autoAudio ? "checked" : ""} onchange="setOpt('autoAudio',this.checked)"> ${vIcon("volume", 14)} Tự phát âm</label>
      </div>`;
    }

    function renderStats() {
      const st = lastStats;
      const target = getDailyTarget();
      const unseen = Math.max(0, st.total - st.learning - st.ignored);
      $("statsHost").innerHTML = `<div class="stats-card">
        <div class="stats-top">
          <div class="stats-mini-inline">
            <span class="quota-pill">${vIcon("sparkle", 13)} <span class="v-stat-lbl">Hôm nay </span>${getNewWordsLearnedTodayCount()}/${target >= 9000 ? "∞" : target}</span>
            <span class="v-chip">${vIcon("reading", 13)} <span class="v-stat-lbl">Đã học: </span><b style="color:var(--primary)">${st.learning}</b></span>
            <span class="v-chip">${vIcon("bell", 13)} <span class="v-stat-lbl">Ôn: </span><b style="color:var(--danger)">${st.due}</b></span>
          </div>
          <div class="stats-btns">
            <button class="mode-btn ${panel === "stats" ? "active" : ""}" onclick="togglePanel('stats')">${vIcon("chart", 14)} <span class="v-btn-lbl">Chi tiết</span></button>
            <button class="mode-btn ${panel === "calendar" ? "active" : ""}" onclick="togglePanel('calendar')" title="Lịch sử học theo ngày">${vIcon("calendar", 14)}<span class="v-cal-lbl"> Lịch</span></button>
            <button class="mode-btn v-set-btn ${panel === "settings" ? "active" : ""}" onclick="togglePanel('settings')" title="Cài đặt học từ" aria-label="Cài đặt học từ">${vIcon("settings", 14)}</button>
          </div>
        </div>
        ${panel === "stats" ? `<div class="stats-grid">
          <div><div class="stat-num" style="color:var(--primary)">${st.learning}</div><div class="stat-label">Đã học</div></div>
          <div><div class="stat-num" style="color:var(--danger)">${st.due}</div><div class="stat-label">Cần ôn</div></div>
          <div><div class="stat-num" style="color:var(--success)">${st.mastered}</div><div class="stat-label">Nhớ kỹ</div></div>
          <div><div class="stat-num" style="color:var(--warn)">${st.ignored}</div><div class="stat-label">Đã biết</div></div>
          <div><div class="stat-num">${unseen}</div><div class="stat-label">Chưa học</div></div>
        </div>` : ""}
        ${panel === "settings" ? settingsHtml() : ""}
        ${panel === "calendar" ? `<div class="panel">${calendarHtml()}</div>` : ""}
      </div>`;
    }

    /* ---------- Giao diện thẻ ---------- */
    function exampleHtml(list) { return (list || []).map(e => "• " + e).join("<br>"); }
    function tagHtml(v) {
      return (v._new ? `<span class="tag new">${vIcon("sparkle", 12)} Từ mới</span>` : `<span class="tag rev">${vIcon("refresh", 12)} Ôn lại</span>`) +
        `<span style="margin-left:8px;">${shortTopic(v.topic)}</span>`;
    }
    const STEP_NAMES = ["Làm quen", "Nhận diện", "Nghe & Nhớ", "Ghi nhớ sâu"];
    function stepsHtml(v) {
      if (currentMode !== "smart" || typeof v._stage !== "number") return "";
      const stepNum = Math.min(4, Math.max(1, v._stage + 1));
      return `<span class="steps" title="Bước ${stepNum}/4: ${STEP_NAMES[stepNum - 1] || ""}">${[0, 1, 2, 3].map(i => `<i class="${i < v._stage ? "done" : i === v._stage ? "cur" : ""}"></i>`).join("")}<b class="step-lbl">Bước ${stepNum}/4</b></span>`;
    }
    function headerHtml(v, extra) {
      return `<div class="fc-top-bar"><div>${tagHtml(v)}${stepsHtml(v)}</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;">${extra || ""}<button class="skip-known-btn" onclick="ignoreCurrentWord()">${vIcon("check", 12)} Đã biết</button></div></div>`;
    }
    function escHtml(str) {
      if (window.S4UI && typeof window.S4UI.escapeHtml === "function") return window.S4UI.escapeHtml(str);
      return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function highlightVocabText(str, q) {
      if (q && window.S4SearchEngine && typeof window.S4SearchEngine.highlightHtml === "function") {
        return window.S4SearchEngine.highlightHtml(str, q);
      }
      return escHtml(str);
    }
    function highlightVocabMultiline(str, q) {
      return String(str == null ? "" : str)
        .split(/\r?\n/)
        .map(line => highlightVocabText(line, q))
        .join("<br>");
    }
    function escJsAttr(str) {
      return String(str == null ? "" : str)
        .replace(/\\/g, "\\\\")
        .replace(/\r?\n/g, " ")
        .replace(/'/g, "\\'")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
    function audioRowHtml(v) {
      const safeId = escJsAttr(v.id);
      return `<div class="audio-row"><button class="audio-pill" onclick="playVocab('${safeId}','uk')">${vIcon("volume", 14)} UK</button><button class="audio-pill" onclick="playVocab('${safeId}','us')">${vIcon("volume", 14)} US</button></div>`;
    }
    function backHtml(v) {
      return `<div class="fc-back"><div class="def-box"><b>Định nghĩa:</b><br>${(v.defRaw || "").replace(/\n/g, "<br>")}</div>
        ${v.examples && v.examples.length ? `<div class="ex-box"><b>Ví dụ:</b><br>${exampleHtml(v.examples)}</div>` : ""}</div>`;
    }
    function flashcardHtml(v, extraBody, actionFooter) {
      return `<div class="flashcard-wrap">
        ${headerHtml(v)}
        <div class="fc-scroll-body">
          <div class="fc-front">${v.localImg ? `<img class="fc-front-img" src="${v.localImg}" alt="" onerror="this.style.display='none'">` : ""}
            <div><span class="fc-word">${v.word}</span> <span class="fc-pos">${v.pos}</span></div>
            <div class="fc-ipa">${v.ipa}</div>${audioRowHtml(v)}
          </div>
          ${extraBody || ""}
        </div>
        <div class="fc-action-dock">${actionFooter || ""}</div>
      </div>`;
    }
    function flipCard() { if (tapTooSoon()) return; isFlipped = true; tapLockAt = Date.now(); renderMain(); }
    // Nút chấm SRS & nút "Đã hiểu": bỏ qua lần chạm lặp ngay sau khi thẻ vừa đổi (tránh bấm nhầm sang nút cùng vị trí của thẻ kế tiếp)
    function rateBtn(q) { if (tapTooSoon()) return; advanceQueueWithQuality(q); }
    function introDone() { if (tapTooSoon()) return; completeSmartStep(true); }

    function pickDistractors(v) {
      const out = [], used = new Set([v.id]);
      const samePos = Math.random() < 0.7;
      let guard = 0;
      while (out.length < 3 && guard++ < 500) {
        const c = VOCAB[Math.floor(Math.random() * VOCAB.length)];
        if (used.has(c.id) || c.word.toLowerCase() === v.word.toLowerCase()) continue;
        if (samePos && guard < 250 && c.pos !== v.pos) continue;
        used.add(c.id); out.push(c);
      }
      return out;
    }

    function quizHtml(v, dir) {
      const q = cacheGet("quiz", () => ({
        enToVi: dir === "en2vi" || (dir === "mix" && Math.random() < 0.5),
        choices: shuffle([v, ...pickDistractors(v)])
      }));
      const img = v.localImg ? `<img class="fc-front-img" style="max-height:165px;" src="${v.localImg}" alt="" onerror="this.style.display='none'">` : "";
      const prompt = q.enToVi
        ? `<div class="center">${img}<div class="fc-word">${v.word} <span class="fc-pos">${v.pos}</span></div>
             <div class="fc-ipa">${v.ipa} <button class="audio-pill" onclick="playVocab('${escJsAttr(v.id)}','us')" aria-label="Phát âm">${vIcon("volume", 14)}</button></div></div>`
        : `<div class="prompt-box"><b>Định nghĩa:</b><br>${(v.defRaw || "").replace(/\n/g, "<br>")}</div>`;
      const opts = q.choices.map(c => {
        const label = q.enToVi ? (c.defVi || c.defRaw) : `<b>${c.word}</b> ${c.pos}`;
        return `<button class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)">${label}</button>`;
      }).join("");
      const dirBtns = currentMode === "quiz"
        ? ["en2vi:Anh → Việt", "vi2en:Việt → Anh", "mix:Trộn"].map(s => { const [k, l] = s.split(":"); return `<button class="mode-btn ${quizDirection === k ? "active" : ""}" onclick="setQuizDir('${k}')">${l}</button>`; }).join("")
        : "";
      return `<div class="quiz-box">${headerHtml(v, dirBtns)}${prompt}<div class="options-grid">${opts}</div></div>`;
    }
    function setQuizDir(d) { quizDirection = d; cardCache = {}; renderMain(); }
    function setListenSub(d) { listenSubMode = d; cardCache = {}; renderMain(); }

    function answerChoice(btn) {
      if (tapTooSoon()) return;
      const grid = btn.parentElement;
      if (grid.dataset.locked === "1") return;
      grid.dataset.locked = "1";
      const ok = btn.dataset.correct === "true";
      btn.classList.add(ok ? "correct" : "wrong");
      if (!ok) { const r = grid.querySelector('[data-correct="true"]'); if (r) r.classList.add("correct"); }
      const serial = cardSerial;
      setTimeout(() => { if (serial === cardSerial) handleResult(ok); }, ok ? 1100 : 2200);
    }

    function normalizeAns(s) { return s.toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, " ").trim(); }
    let ansToastTimer = null;
    function showAnsToast(ok, rightAns) {
      if (window.S4UI && typeof window.S4UI.toast === "function") {
        window.S4UI.toast(
          ok ? "success" : "error",
          ok ? "Chính xác" : "Đáp án: " + rightAns,
          { duration: ok ? 1300 : 2400 }
        );
        return;
      }
      let t = document.getElementById("s4AnsToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4AnsToast";
        document.body.appendChild(t);
      }
      if (ansToastTimer) clearTimeout(ansToastTimer);
      t.className = "s4-ans-toast " + (ok ? "correct" : "wrong");
      t.textContent = ok ? "Chính xác" : "Đáp án: " + rightAns;
      requestAnimationFrame(() => t.classList.add("show"));
      ansToastTimer = setTimeout(() => t.classList.remove("show"), ok ? 1300 : 2400);
    }

    function scrollInputIntoOptimalView(el) {
      if (!el) return;
      setTimeout(() => {
        try { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); } catch (e) {}
      }, 150);
    }
    function onAnsInputEdit(inp) {
      if (!inp) return;
      inp.dataset.wrongWaiting = "0";
      inp.classList.remove("correct", "wrong");
    }
    function handleAnsKeydown(ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const inp = $("ansInput");
        if (inp && inp.dataset.wrongWaiting === "1") {
          handleResult(false);
          return;
        }
        checkText();
      }
    }
    function checkText() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      const answers = cardCache.answers || [];
      const ok = answers.includes(normalizeAns(inp.value));
      finishText(inp, ok, false);
    }
    function giveUp() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      finishText(inp, false, true);
    }
    function finishText(inp, ok, isGiveUp) {
      const rightAns = (studyQueue[0] && studyQueue[0].word) || (cardCache.answers || [""])[0];
      if (isGiveUp) inp.value = rightAns;

      inp.classList.remove("correct", "wrong");
      inp.classList.add(ok ? "correct" : "wrong");

      document.querySelectorAll("#cardHost .blank").forEach(b => {
        b.classList.remove("correct", "wrong");
        b.classList.add(ok ? "correct" : "wrong");
        b.textContent = rightAns;
      });

      const fb = $("ansFeedback");
      const nextBtn = $("nextAfterWrongBtn");

      if (ok) {
        inp.dataset.locked = "1";
        inp.dataset.wrongWaiting = "0";
        if (fb) {
          fb.style.color = "var(--success)";
          fb.innerHTML = `<span class="v-chip">${vIcon("check", 14)} Chính xác: <b>${rightAns}</b></span>`;
        }
        if (nextBtn) nextBtn.style.display = "none";
        showAnsToast(true, rightAns);
        const w = studyQueue[0];
        if (w) playVocab(w.id, "uk");
        const passSrs = inp.dataset.hadWrong !== "1";
        const serial = cardSerial;
        setTimeout(() => { if (serial === cardSerial) handleResult(passSrs); }, 1100);
      } else {
        // Không tự động chuyển câu khi sai: tô đỏ nhẹ + hiện đáp án đúng để người học quan sát
        inp.dataset.hadWrong = "1";
        inp.dataset.wrongWaiting = "1";
        if (fb) {
          fb.style.color = "var(--danger)";
          fb.innerHTML = `<span class="v-chip">${vIcon("close", 14)} Chưa đúng — Đáp án đúng: <span class="dic-ans-hint">${rightAns}</span></span>`;
        }
        if (nextBtn) nextBtn.style.display = "inline-flex";
        const w = studyQueue[0];
        if (w) playVocab(w.id, "uk");
      }
    }
    function textInputHtml(placeholder) {
      return `<input type="text" id="ansInput" class="text-input" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" oninput="onAnsInputEdit(this)" onkeydown="handleAnsKeydown(event)">
        <div id="ansFeedback" style="margin-top:8px;font-weight:700;font-size:14px;min-height:24px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
          <button class="mode-btn active" onclick="checkText()">${vIcon("check", 14)} Kiểm tra</button>
          <button class="mode-btn" onclick="giveUp()">${vIcon("lightbulb", 14)} Hiện đáp án</button>
          <button class="mode-btn" id="nextAfterWrongBtn" style="display:none;background:var(--primary);color:#fff;border-color:var(--primary);" onclick="handleResult(false)">Câu tiếp theo ${vIcon("arrowRight", 14)}</button>
        </div>`;
    }

    function listenHtml(v, sub) {
      cardCache.answers = [normalizeAns(v.word)];
      let body;
      if (sub === "choice") {
        const choices = cacheGet("listen", () => shuffle([v, ...pickDistractors(v)]));
        body = `<div class="options-grid">${choices.map(c => `<button class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)"><b>${c.word}</b> ${c.pos}</button>`).join("")}</div>`;
      } else {
        body = `<div class="center" style="margin-top:14px;color:var(--muted);">Nghĩa: <b>${v.defVi || v.defRaw}</b> ${v.pos}</div>${textInputHtml("Gõ từ bạn nghe được...")}`;
      }
      const subBtns = currentMode === "listen"
        ? `<button class="mode-btn ${sub === "choice" ? "active" : ""}" onclick="setListenSub('choice')">Chọn từ</button><button class="mode-btn ${sub === "dictation" ? "active" : ""}" onclick="setListenSub('dictation')">Chính tả</button>`
        : "";
      const safeId = escJsAttr(v.id);
      return `<div class="quiz-box">${headerHtml(v, subBtns)}
        <div class="audio-row" style="margin:14px 0;"><button class="audio-pill" style="font-size:15.5px;padding:10px 18px;" onclick="playVocab('${safeId}','uk')">${vIcon("volume", 15)} UK</button><button class="audio-pill" style="font-size:15.5px;padding:10px 18px;" onclick="playVocab('${safeId}','us')">${vIcon("volume", 15)} US</button></div>
        ${body}</div>`;
    }

    function makeCloze(v) {
      const ex = (v.examples || []).find(e => /<b[^>]*>[^<]+<\/b>/i.test(e));
      if (!ex) return null;
      const answers = [normalizeAns(v.word)];
      const html = ex.replace(/<b[^>]*>([^<]+)<\/b>/gi, (m, t) => { answers.push(normalizeAns(t)); return '<span class="blank">_____</span>'; });
      return { html, answers };
    }
    function clozeHtml(v) {
      const c = makeCloze(v);
      cardCache.answers = c ? c.answers : [normalizeAns(v.word)];
      const img = v.localImg ? `<img class="fc-front-img" style="max-height:140px;" src="${v.localImg}" alt="" onerror="this.style.display='none'">` : "";
      const hint = `Gợi ý: <b>${v.word[0]}… (${v.word.length} ký tự)</b>`;
      return `<div class="quiz-box center">${headerHtml(v, `<span style="font-size:12.5px;color:var(--muted);">${hint}</span>`)}
        ${img}
        <div class="prompt-box" style="font-size:18px;margin:12px 0;text-align:left;">${c ? c.html : (v.defRaw || "").replace(/\n/g, "<br>")}</div>
        <div style="color:var(--muted);">Nghĩa: <b>${v.defVi || v.defRaw}</b> ${v.pos}</div>
        ${textInputHtml("Nhập từ vựng...")}</div>`;
    }

    function smartHtml() {
      if (!studyQueue[0]._task) pickNextSmartItem();
      const v = studyQueue[0];
      switch (v._task) {
        case "intro": {
          const label = v._relearn ? `Đã xem lại ${vIcon("arrowRight", 15)}` : `Đã hiểu ${vIcon("arrowRight", 15)}`;
          return flashcardHtml(v, backHtml(v), `<button class="btn-flip green" onclick="introDone()">${label}</button>`);
        }
        case "mcq_en2vi": return quizHtml(v, "en2vi");
        case "mcq_vi2en": return quizHtml(v, "vi2en");
        case "listen_choice": return listenHtml(v, "choice");
        case "dictation": return listenHtml(v, "dictation");
        default: return clozeHtml(v);
      }
    }

    function matchHtml() {
      const tiles = cacheGet("tiles", () => {
        const t = [];
        studyQueue.slice(0, 6).forEach(w => {
          t.push({ id: w.id, html: `<b>${w.word}</b><br><span style="font-size:12px;color:var(--muted)">${w.ipa}</span>` });
          t.push({ id: w.id, html: (w.defVi || w.defRaw || "").slice(0, 75) });
        });
        return shuffle(t);
      });
      return `<div class="quiz-box"><b class="v-chip" style="color:var(--primary);">${vIcon("grid", 15)} Ghép từ với nghĩa</b>
        <div class="match-grid" id="matchGrid">${tiles.map(t => `<div class="match-tile" data-pair="${t.id}" onclick="clickMatchTile(this)"><div>${t.html}</div></div>`).join("")}</div></div>`;
    }
    let matchSelected = null;
    function clickMatchTile(el) {
      if (el.classList.contains("matched")) return;
      if (!matchSelected) { matchSelected = el; el.classList.add("selected"); return; }
      if (matchSelected === el) { el.classList.remove("selected"); matchSelected = null; return; }
      const prev = matchSelected;
      matchSelected = null;
      if (prev.dataset.pair === el.dataset.pair) {
        prev.classList.remove("selected");
        prev.classList.add("matched"); el.classList.add("matched");
        const idx = studyQueue.findIndex(x => x.id === el.dataset.pair);
        if (idx !== -1) {
          const matchedId = studyQueue[idx].id;
          rateOnce(studyQueue[idx], 2);
          studyQueue.splice(idx, 1);
          sessionDone++;
          saveActiveSession([matchedId]);
        }
        if (!document.querySelector("#matchGrid .match-tile:not(.matched)")) {
          const serial = cardSerial;
          setTimeout(() => { if (serial === cardSerial) { bumpCard(); renderAll(); } }, 450);
        }
      } else {
        el.classList.add("error");
        setTimeout(() => { prev.classList.remove("selected"); el.classList.remove("error"); }, 450);
      }
    }

    function renderVocabListBodyHtml(words) {
      const q = searchQuery();
      let f = words;
      if (listFilter === "learned") f = words.filter(v => srsData[v.id] && !srsData[v.id].ignored);
      else if (listFilter === "ignored") f = words.filter(v => srsData[v.id] && srsData[v.id].ignored);
      else if (listFilter === "unseen") f = words.filter(v => !srsData[v.id]);
      const cnt = fn => words.filter(fn).length;
      const btn = (k, label) => `<button class="mode-btn ${listFilter === k ? "active" : ""}" onclick="setVocabListFilter('${k}')">${label}</button>`;
      const bar = `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">
        ${btn("all", `Tất cả (${words.length})`)}${btn("unseen", `Chưa học (${cnt(v => !srsData[v.id])})`)}
        ${btn("learned", `Đang học (${cnt(v => srsData[v.id] && !srsData[v.id].ignored)})`)}${btn("ignored", `Đã biết (${cnt(v => srsData[v.id] && srsData[v.id].ignored)})`)}
        ${q ? `<span class="v-chip" style="font-size:12px;color:var(--muted);font-weight:700;margin-left:auto;">${vIcon("search", 13)} Khớp ${f.length} từ trong ${VOCAB.length.toLocaleString("en-US")} từ</span>` : ""}
      </div>`;
      const rows = f.slice(0, listLimit).map(v => {
        const st = srsData[v.id];
        const safeId = escJsAttr(v.id);
        const status = st && st.ignored
          ? `<span class="badge-status ign">Đã biết</span> <button class="mode-btn" style="padding:3px 8px;font-size:11.5px;" onclick="unignoreWord('${safeId}')">${vIcon("refresh", 12)} Học lại</button>`
          : st ? `<span class="badge-status">Chu kỳ ${Math.round(st.interval)} ngày</span>`
          : `<button class="skip-known-btn" style="padding:3px 8px;font-size:11.5px;" onclick="markKnown('${safeId}')">${vIcon("check", 12)} Đã biết</button>`;
        return `<div class="word-card"><div style="flex:1;min-width:230px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:20px;font-weight:800;color:var(--primary);">${highlightVocabText(v.word, q)}</span><span style="color:var(--muted);">${escHtml(v.pos)}</span>
            <span style="color:var(--danger);font-family:monospace;">${escHtml(v.ipa)}</span>
            <button class="audio-pill" style="padding:3px 9px;font-size:12px;" onclick="playVocab('${safeId}','uk')">${vIcon("volume", 12)} UK</button>
            <button class="audio-pill" style="padding:3px 9px;font-size:12px;" onclick="playVocab('${safeId}','us')">${vIcon("volume", 12)} US</button>${status}
          </div>
          <div style="margin-top:8px;line-height:1.5;">${highlightVocabMultiline(v.defRaw || "", q)}</div>
          ${v.examples && v.examples.length ? `<div style="margin-top:8px;font-size:14.5px;color:var(--success);line-height:1.55;">${exampleHtml(v.examples)}</div>` : ""}
        </div>${v.localImg ? `<img class="word-card-img" loading="lazy" src="${v.localImg}" alt="" onerror="this.style.display='none'">` : ""}</div>`;
      }).join("");
      const more = f.length > listLimit ? `<button class="btn-action" style="background:var(--primary);color:#fff;width:100%;" onclick="loadMoreVocabList()">Hiện thêm (${f.length - listLimit})</button>` : "";
      const emptyHtml = q
        ? `<div class="s4-empty-state" style="margin-top:10px;">
            <div style="color:var(--muted);display:inline-flex;">${vIcon("search", 30)}</div>
            <div style="font-size:15px;font-weight:800;color:var(--text);">Không tìm thấy từ vựng phù hợp</div>
            <div style="font-size:13px;">Từ khóa "<strong>${escHtml(q)}</strong>" không khớp với từ nào.</div>
            <button type="button" class="btn-action" style="background:var(--primary);color:#fff;" onclick="clearVocabSearch()">${vIcon("close", 14)} Xóa tìm kiếm</button>
          </div>`
        : '<div class="quiz-box center">Không có từ nào.</div>';
      return bar + (rows || emptyHtml) + more;
    }

    function listHtml(words) {
      const q = searchQuery();
      return `<div class="list-search-row">
        <div class="list-search-field">
          <input id="inlineListSearchInput" type="text" class="list-search-input" value="${escHtml(q)}" placeholder="Tìm tức thì trong ${VOCAB.length.toLocaleString("en-US")} từ IELTS (từ, nghĩa Việt/Anh, ví dụ)..." autocomplete="off" oninput="onInlineListSearch(this.value)">
          <button id="inlineListSearchClear" type="button" class="list-search-clear" style="display:${q ? "inline-flex" : "none"};" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm" onclick="clearVocabSearch(true)">${vIcon("close", 13)}</button>
        </div>
      </div>
      <div id="vocabListBody">${renderVocabListBodyHtml(words)}</div>`;
    }

    window.setVocabListFilter = function (f) {
      listFilter = f;
      listLimit = 100;
      const body = $("vocabListBody");
      if (currentMode === "list" && body) body.innerHTML = renderVocabListBodyHtml(getScopeWords());
      else renderMain();
    };
    window.loadMoreVocabList = function () {
      listLimit += 100;
      const body = $("vocabListBody");
      if (currentMode === "list" && body) body.innerHTML = renderVocabListBodyHtml(getScopeWords());
      else renderMain();
    };

    function finishHtml(words) {
      const q = searchQuery();
      if (q && words.length === 0) {
        const safeQ = window.S4UI ? window.S4UI.escapeHtml(q) : q;
        return `<div class="s4-empty-state" style="margin-top:14px;">
          <div style="color:var(--muted);display:inline-flex;">${vIcon("search", 32)}</div>
          <div style="font-size:16px;font-weight:800;color:var(--text);">Không tìm thấy từ vựng phù hợp</div>
          <div style="font-size:13.5px;">Từ khóa "<strong>${safeQ}</strong>" không khớp với từ nào.</div>
          <button type="button" class="btn-action" style="background:var(--primary);color:#fff;" onclick="clearVocabSearch()">${vIcon("close", 14)} Xóa tìm kiếm</button>
        </div>`;
      }
      const now = Date.now();
      const dueInScope = words.filter(v => isDueWord(v, now)).length;
      const totalDue = lastStats ? lastStats.due : dueInScope;
      const unseen = currentTopic === "ALL_DUE" ? 0 : words.filter(v => !srsData[v.id]).length;
      const hasLearned = words.some(v => srsData[v.id] && !srsData[v.id].ignored);
      return `<div class="finish-box"><div style="color:var(--success);display:inline-flex;">${vIcon("award", 44)}</div>
        <h2 style="margin:8px 0 0 0;color:var(--success);">${extraPracticeMode ? "Xong lượt ôn luyện!" : "Hoàn thành phiên học!"}</h2>
        ${sessionDone ? `<p style="color:var(--muted);margin:8px 0 0 0;">Đã xử lý ${sessionDone} từ</p>` : ""}
        <div class="finish-actions">
          ${!extraPracticeMode && (dueInScope > 0 || totalDue > 0) ? `<button class="btn-action" style="background:var(--danger);color:#fff;" onclick="startDueReview()">${vIcon("bell", 15)} Ôn ngay ${dueInScope || totalDue} từ đến hạn</button>` : ""}
          ${extraPracticeMode ? `<button class="btn-action" style="background:var(--primary);color:#fff;" onclick="exitPractice()">Quay lại học chính</button>` : ""}
          ${!extraPracticeMode && unseen > 0 ? `<button class="btn-action" style="background:var(--primary);color:#fff;" onclick="addBonusNewWords(10)">${vIcon("plus", 15)} Học thêm 10 từ mới</button>` : ""}
          ${hasLearned ? `<button class="btn-action" style="background:var(--success);color:#fff;" onclick="startFreePractice()">${vIcon("refresh", 15)} Ôn luyện thêm</button>` : ""}
          <button class="btn-action" style="background:var(--lg-wash, var(--bg));color:var(--lg-ink, var(--text));border:1px solid var(--lg-hairline, var(--border));" onclick="setMode('list')">${vIcon("reading", 15)} Danh sách</button>
        </div></div>`;
    }

    function sessionBarHtml() {
      const pct = sessionTotal ? Math.round(sessionDone / sessionTotal * 100) : 0;
      // Chỉ hiện nút làm mới khi phiên đã có tiến trình dở dang (đã làm xong từ nào đó hoặc có từ đã qua bước 0)
      const inProgress = !!sessionTopic && !extraPracticeMode && !searchQuery() &&
        (sessionDone > 0 || studyQueue.some(w => (w._mistakes || 0) > 0 || w._stage > (w._new ? 0 : 1)));
      return `<div class="sess-row">
        <span>
          ${extraPracticeMode ? "Ôn luyện (không ảnh hưởng lịch ôn)" : "Phiên học"}
          ${extraPracticeMode ? ` <button class="skip-known-btn" onclick="exitPractice()">Thoát</button>` : ""}
          ${inProgress ? ` <button class="skip-known-btn" style="color:var(--danger);margin-left:4px;" onclick="restartSession()" title="Bỏ tiến trình dở dang của phiên này và tạo phiên mới">${vIcon("refresh", 12)} Phiên mới</button>` : ""}
        </span>
        <span>${sessionDone}/${sessionTotal}</span>
      </div>
      <div class="sess-bar"><i style="width:${pct}%"></i></div>`;
    }
    async function restartSession() {
      const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
        ? await window.S4UI.confirm("Bỏ tiến trình dở dang của phiên học này và tạo phiên mới?\n(Các từ đã học xong vẫn được giữ nguyên.)", {
            title: "Tạo phiên học mới",
            tone: "warn",
            confirmText: "Tạo phiên mới"
          })
        : confirm("Bỏ tiến trình dở dang của phiên học này và tạo phiên mới?\n(Các từ đã học xong vẫn được giữ nguyên.)");
      if (!ok) return;
      clearActiveSession(sessionTopic || currentTopic, studyQueue.map(w => w.id));
      buildStudyQueue(true, true);
      renderAll();
    }

    function renderMain() {
      document.body.classList.toggle("scroll-mode", currentMode === "list" || !!panel);
      renderStats();
      const host = $("cardHost");
      if (currentMode === "list") { host.innerHTML = listHtml(getScopeWords()); return; }
      if (!studyQueue.length) { host.innerHTML = finishHtml(getScopeWords()); return; }
      const v = studyQueue[0];
      let html;
      switch (currentMode) {
        case "flashcard":
          html = isFlipped
            ? flashcardHtml(v, backHtml(v), `<div class="srs-buttons">
                <button class="srs-btn is-forget" onclick="rateBtn(0)"><span class="lp-srs-dot"></span><span>Quên</span><kbd class="lp-srs-kbd">1</kbd></button>
                <button class="srs-btn is-hard" onclick="rateBtn(1)"><span class="lp-srs-dot"></span><span>Khó</span><kbd class="lp-srs-kbd">2</kbd></button>
                <button class="srs-btn is-good" onclick="rateBtn(2)"><span class="lp-srs-dot"></span><span>Nhớ</span><kbd class="lp-srs-kbd">3</kbd></button>
                <button class="srs-btn is-easy" onclick="rateBtn(3)"><span class="lp-srs-dot"></span><span>Rất dễ</span><kbd class="lp-srs-kbd">4</kbd></button></div>`)
            : flashcardHtml(v, "", `<button class="btn-flip" onclick="flipCard()">Hiện nghĩa</button>`);
          break;
        case "smart": html = smartHtml(); break;
        case "quiz": html = quizHtml(v, quizDirection); break;
        case "listen": html = listenHtml(v, listenSubMode); break;
        case "match": html = matchHtml(); break;
        default: html = clozeHtml(v);
      }
      host.innerHTML = sessionBarHtml() + html;
      const inp = host.querySelector(".text-input");
      if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }
      autoPlayIfNeeded();
    }

    function renderAll() {
      lastStats = computeStats();
      renderSidebar();
      renderMain();
    }

    /* ---------- Phím tắt ---------- */
    window.addEventListener("keydown", e => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (currentMode === "list" || !studyQueue.length) return;
      const key = e.key.toLowerCase();
      if (key === "x") { e.preventDefault(); ignoreCurrentWord(); return; }
      if (["1", "2", "3", "4"].includes(key)) {
        const opts = document.querySelectorAll("#cardHost .opt-btn");
        if (opts.length) { const b = opts[Number(key) - 1]; if (b) b.click(); return; }
      }
      if (currentMode === "smart" && (e.code === "Space" || e.key === "Enter") && studyQueue[0]._task === "intro") { e.preventDefault(); introDone(); return; }
      if (currentMode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); if (!isFlipped) flipCard(); }
        else if (isFlipped && ["1", "2", "3", "4"].includes(key)) advanceQueueWithQuality(Number(key) - 1);
      }
    });

    /* ---------- Sao lưu / Khôi phục / Đặt lại ---------- */
    function exportProgress() {
      const data = { app: "study4-vocab", version: 2, exportedAt: new Date().toISOString(), srsData, dayLog, userSettings, activeSessions: readSessionMap() };
      const a = document.createElement("a");
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      a.href = url;
      a.download = "LinguaPath_Vocab_Backup_" + getTodayStr() + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    function importProgress(ev) {
      const f = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const obj = JSON.parse(r.result);
          if (!obj.srsData || typeof obj.srsData !== "object") throw new Error("invalid");
          const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
            ? await window.S4UI.confirm("Tiến độ hiện tại sẽ bị thay bằng bản sao lưu. Tiếp tục?", {
                title: "Khôi phục bản sao lưu",
                tone: "warn",
                confirmText: "Khôi phục"
              })
            : confirm("Tiến độ hiện tại sẽ bị thay bằng bản sao lưu. Tiếp tục?");
          if (!ok) return;
          srsData = {};
          Object.keys(obj.srsData).forEach(k => { if (VOCAB_BY_ID.has(k)) srsData[k] = obj.srsData[k]; });
          dayLog = obj.dayLog && typeof obj.dayLog === "object" ? obj.dayLog : {};
          userSettings = Object.assign({}, DEFAULT_SETTINGS, obj.userSettings || {});
          studyQueue = []; sessionTopic = ""; clearActiveSession();
          if (obj.activeSessions && typeof obj.activeSessions === "object" && !Array.isArray(obj.activeSessions)) {
            writeSessionMap(obj.activeSessions);
          }
          saveState();
          buildStudyQueue();
          renderAll();
          if (window.S4Auth && typeof window.S4Auth.allowOverwriteOnce === "function") window.S4Auth.allowOverwriteOnce("vocab");
          if (window.S4UI && typeof window.S4UI.toast === "function") {
            window.S4UI.toast("success", "Đã khôi phục tiến độ từ vựng.");
          } else {
            alert("Đã khôi phục tiến độ.");
          }
        } catch (e) {
          if (window.S4UI && typeof window.S4UI.alert === "function") {
            window.S4UI.alert("File sao lưu không hợp lệ hoặc bị hỏng.", { title: "Lỗi đọc file", tone: "error" });
          } else {
            alert("File sao lưu không hợp lệ.");
          }
        }
      };
      r.readAsText(f);
    }
    async function resetProgress() {
      const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
        ? await window.S4UI.confirm("Xóa TOÀN BỘ tiến độ từ vựng (từ đã học, lịch ôn, lịch sử, cài đặt)?\nNên bấm Sao lưu trước. Hành động này không thể hoàn tác.", {
            title: "Xóa toàn bộ tiến độ",
            tone: "danger",
            confirmText: "Xóa tất cả"
          })
        : confirm("Xóa TOÀN BỘ tiến độ từ vựng (từ đã học, lịch ôn, lịch sử, cài đặt)?\nNên bấm Sao lưu trước. Hành động này không thể hoàn tác.");
      if (!ok) return;
      [KEYS.srs, KEYS.days, KEYS.settings].forEach(k => localStorage.removeItem(k));
      studyQueue = []; sessionTopic = ""; clearActiveSession();
      srsData = {}; dayLog = {};
      userSettings = Object.assign({}, DEFAULT_SETTINGS);
      currentTopic = TOPICS[0] || "ALL";
      extraPracticeMode = false;
      buildStudyQueue(true);
      renderAll();
      if (window.S4Auth && typeof window.S4Auth.allowOverwriteOnce === "function") window.S4Auth.allowOverwriteOnce("vocab");
      if (window.S4UI && typeof window.S4UI.toast === "function") {
        window.S4UI.toast("info", "Đã xóa toàn bộ tiến độ từ vựng.");
      }
    }

    let searchTimer = null;
    function applyVocabSearchChange(fromInline) {
      const q = searchQuery();
      const inlineInp = $("inlineListSearchInput");
      const inlineClr = $("inlineListSearchClear");
      if (inlineInp && !fromInline && inlineInp.value !== $("searchWordInput").value) {
        inlineInp.value = $("searchWordInput").value;
      }
      if (inlineClr) inlineClr.style.display = q ? "inline-flex" : "none";

      if (q && currentMode !== "list") {
        if (!modeBeforeSearch) modeBeforeSearch = currentMode;
        currentMode = "list";
        listFilter = "all";
        listLimit = 100;
        syncModeUi("list");
        buildStudyQueue();
        renderAll();
        return;
      }
      if (!q && !fromInline && modeBeforeSearch) {
        currentMode = modeBeforeSearch;
        modeBeforeSearch = "";
        syncModeUi(currentMode);
        buildStudyQueue();
        renderAll();
        return;
      }

      const body = $("vocabListBody");
      if (currentMode === "list" && body) {
        listLimit = 100;
        buildStudyQueue();
        body.innerHTML = renderVocabListBodyHtml(getScopeWords());
      } else {
        buildStudyQueue();
        renderAll();
      }
    }
    window.onInlineListSearch = function (val) {
      const sideInp = $("searchWordInput");
      if (sideInp) {
        sideInp.value = String(val == null ? "" : val);
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(sideInp);
      }
      applyVocabSearchChange(true);
    };
    window.clearVocabSearch = function (keepInline) {
      const inp = $("searchWordInput");
      if (inp) {
        inp.value = "";
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
        if (!keepInline) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
      }
      const inlineInp = $("inlineListSearchInput");
      if (inlineInp) {
        inlineInp.value = "";
        if (keepInline) { try { inlineInp.focus({ preventScroll: true }); } catch (e) {} }
      }
      clearTimeout(searchTimer);
      if (keepInline) modeBeforeSearch = "";
      applyVocabSearchChange(!!keepInline);
    };
    if (window.S4UI && typeof window.S4UI.bindSearchBar === "function") {
      window.S4UI.bindSearchBar({
        input: "searchWordInput",
        clearBtn: "searchWordInput_clear",
        searchBtn: "searchWordInput_btn",
        delay: 180,
        onSearch: () => { clearTimeout(searchTimer); applyVocabSearchChange(false); }
      });
    } else {
      $("searchWordInput").oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => applyVocabSearchChange(false), 180);
      };
    }

    (function bootVocabDeepLink() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const topicParam = sp.get("topic");
        if (topicParam && (topicParam === "ALL" || topicParam === "ALL_DUE" || TOPICS.includes(topicParam))) {
          currentTopic = topicParam;
        }
        const qParam = sp.get("q");
        if (qParam) {
          const inp = $("searchWordInput");
          if (inp) {
            inp.value = qParam;
            if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
          }
          currentMode = "list";
          listFilter = "all";
          syncModeUi("list");
        } else {
          const modeParam = sp.get("mode");
          if (modeParam && MODE_LABELS[modeParam]) {
            currentMode = modeParam;
            syncModeUi(modeParam);
          }
        }
      } catch (e) {}
      buildStudyQueue();
      renderAll();
    })();
  </script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
