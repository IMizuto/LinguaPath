<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bgIntense" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#bgIntense)"/>
  <circle cx="200" cy="145" r="92" fill="#fecdd3" opacity="0.55"/>
  <circle cx="200" cy="145" r="68" fill="#fda4af" opacity="0.45"/>
  <!-- Outer high-intensity flame -->
  <path d="M200 34 C222 72 258 92 258 144 C258 186 232 214 200 214 C168 214 142 186 142 144 C142 114 156 90 172 74 C170 92 180 102 188 94 C184 72 190 50 200 34 Z" fill="url(#flameOuter)"/>
  <!-- Inner bright core -->
  <path d="M200 94 C216 120 232 136 232 162 C232 186 218 202 200 202 C182 202 168 186 168 162 C168 142 178 126 190 116 C190 128 196 132 200 126 C198 112 199 102 200 94 Z" fill="url(#flameInner)"/>
  <!-- Intensity rays -->
  <g stroke="#e11d48" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="108" y1="90" x2="128" y2="104"/>
    <line x1="292" y1="90" x2="272" y2="104"/>
    <line x1="92" y1="145" x2="118" y2="145"/>
    <line x1="308" y1="145" x2="282" y2="145"/>
    <line x1="144" y1="50" x2="156" y2="68"/>
    <line x1="256" y1="50" x2="244" y2="68"/>
  </g>
  <!-- Level meter bar -->
  <rect x="115" y="230" width="170" height="14" rx="7" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
  <rect x="118" y="233" width="154" height="8" rx="4" fill="#dc2626"/>
</svg>
