<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31102f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curtainRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="url(#stageBg)"/>
  <!-- Stage spotlight -->
  <polygon points="200,18 96,246 304,246" fill="#fef08a" opacity="0.14"/>
  <!-- Wooden stage floor -->
  <rect x="20" y="226" width="360" height="36" rx="8" fill="#78350f"/>
  <rect x="20" y="226" width="360" height="8" fill="#b45309"/>
  <!-- Stage curtains left & right -->
  <path d="M16 18 L92 18 C82 95 76 160 54 226 L16 226 Z" fill="url(#curtainRed)"/>
  <path d="M384 18 L308 18 C318 95 324 160 346 226 L384 226 Z" fill="url(#curtainRed)"/>
  <path d="M16 18 Q110 56 200 32 Q290 56 384 18 Z" fill="#b91c1c"/>
  <!-- Comedy & Tragedy Theater Masks -->
  <!-- Tragedy mask (right/back) -->
  <g transform="translate(232,126) rotate(10)">
    <path d="M-38,-44 L38,-44 L34,12 C32,38 0,52 0,52 C0,52 -32,38 -34,12 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <path d="M-22,-18 Q-14,-24 -6,-16" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M6,-16 Q14,-24 22,-18" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M-16,22 Q0,8 16,22" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Comedy mask (left/front) -->
  <g transform="translate(164,132) rotate(-10)">
    <path d="M-40,-46 L40,-46 L36,14 C34,42 0,56 0,56 C0,56 -34,42 -36,14 Z" fill="#fde047" stroke="#a16207" stroke-width="3"/>
    <path d="M-22,-16 Q-14,-26 -6,-16" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
    <path d="M6,-16 Q14,-26 22,-16" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20,12 Q0,34 20,12 Z" fill="#713f12"/>
  </g>
</svg>
