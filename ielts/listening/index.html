  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
      window.toggleDark = function() {
        if (window.toggleDarkModeOnly) {
          window.toggleDarkModeOnly();
        } else {
          var curD = localStorage.getItem("s4_vocab_dark");
          var curDark = !(curD === "0" || curD === "false");
          var nextDark = !curDark;
          localStorage.setItem("s4_vocab_dark", nextDark ? "1" : "0");
          document.documentElement.classList.toggle("dark", nextDark);
          if (document.body) document.body.classList.toggle("dark", nextDark);
        }
        var btn = document.getElementById("topDarkBtn_listen");
        if (btn && window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn);
        }
      };
    } catch (e) {}
  })();
  </script>

<style>
  :root {
    --lp-sidebar-w: 336px;
    --bg: transparent;
    --panel: #1e293b;
    --card: #334155;
    --border: rgba(148, 163, 184, 0.18);
    --text: #f8fafc;
    --sub-text: #cbd5e1;
    --muted: #94a3b8;
    --primary: #f59e0b;
    --primary-hover: #d97706;
    --accent: #38bdf8;
    --success: #10b981;
    --danger: #ef4444;
    --hl-gold: #fde68a;
    --hl-green: #34d399;
    --hl-cyan: #38bdf8;
    --box-sub: rgba(15, 23, 42, 0.6);
    --vi-bg: rgba(56, 189, 248, 0.1);
    --vi-text: #bae6fd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; color: var(--lg-ink, var(--text)); width: 100%; max-width: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* Topbar 1 hàng & Top-switch pill ngang */
  .lp-study-topbar {
    margin: calc(8px + var(--s4-safe-top, 0px)) 14px 6px;
    width: auto;
    max-width: calc(100% - 28px);
    flex-shrink: 0;
  }
  .lp-study-topbar .lp-top-left { gap: 7px; min-width: 0; flex: 1 1 auto; }
  .lp-study-topbar .lp-top-actions { gap: 6px; flex-shrink: 0; }
  .menu-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 36px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--lg-hairline, var(--border));
    background: var(--lg-wash, rgba(255,255,255,0.06));
    color: var(--lg-ink, var(--text));
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .menu-toggle-btn:hover { background: var(--lg-wash-hover, rgba(255,255,255,0.12)); }
  .s4-mob-sb-lbl { display: none; }
  .lp-study-pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 36px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--lg-hairline, var(--border));
    background: var(--lg-wash, rgba(255,255,255,0.06));
    color: var(--lg-ink, var(--text));
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lp-study-pill-btn.hist { border-color: rgba(37,99,235,0.34); color: var(--lg-accent, #38bdf8); }
  .lp-study-pill-btn.donate { background: var(--lg-rose-soft, rgba(225,29,72,0.14)); border-color: rgba(225,29,72,0.26); color: var(--lg-rose, #e11d48); }
  .brand-title { font-size: 14.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--lg-ink, var(--text)); }
  .top-switch {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0 14px 8px;
    padding: 5px 8px;
    border-radius: 16px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    width: auto;
    max-width: calc(100% - 28px);
    -webkit-overflow-scrolling: touch;
  }
  .top-switch::-webkit-scrollbar { display: none; }
  .top-switch-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid transparent;
    background: var(--lg-wash, rgba(148,163,184,0.1));
    color: var(--lg-ink-sub, var(--muted));
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
  }
  .top-switch-btn:hover { border-color: var(--lg-accent, var(--primary)); color: var(--lg-ink, var(--text)); }
  .top-switch-btn.active {
    background: var(--primary);
    color: #0f172a;
    border-color: var(--primary);
  }
  .prog-pill {
    background: var(--lg-wash, rgba(255,255,255,0.06));
    border: 1px solid var(--lg-hairline, var(--border));
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: var(--lg-ink, var(--text));
    white-space: nowrap;
  }
  body.s4-cbt-mode .lp-study-topbar,
  body.s4-cbt-mode .top-switch { display: none !important; }

  /* Workspace */
  .workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; position: relative; z-index: 1; }
  .sidebar {
    width: var(--lp-sidebar-w, 336px);
    background: var(--lg-surface-strong, var(--panel)) !important;
    backdrop-filter: var(--lg-blur, blur(12px)) !important;
    -webkit-backdrop-filter: var(--lg-blur, blur(12px)) !important;
    border-right: 1px solid var(--lg-hairline, var(--border)) !important;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-height: 0;
    height: 100%;
  }
  .sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-row { display: flex; gap: 6px; }
  .search-input {
    flex: 1;
    padding: 8px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background:var(--box-sub);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
  }
  .search-input:focus { border-color: var(--primary); }
  .mini-btn {
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

  /* 3-Level Collapsible Tree Sidebar - Block flow so items never squish or overlap */
  .lesson-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    display: block;
  }
  .folder-box {
    border: 1px solid var(--border);
    border-radius: 11px;
    background:var(--box-sub);
    margin-bottom: 9px;
  }
  .folder-header {
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  .folder-header:hover { background: rgba(255,255,255,0.07); }
  .folder-title {
    font-size: 12.5px;
    font-weight: 800;
    color:var(--hl-gold);
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.35;
  }
  .folder-meta {
    font-size: 11px;
    font-weight: 700;
    color:var(--hl-cyan);
    background: rgba(56, 189, 248, 0.12);
    padding: 2px 7px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .folder-body {
    padding: 6px 8px 8px;
    border-top: 1px solid var(--border);
    display: block;
  }
  .folder-box.collapsed > .folder-body { display: none; }
  .folder-arrow {
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.18s;
    display: inline-block;
  }
  .folder-box:not(.collapsed) > .folder-header .folder-arrow { transform: rotate(90deg); }

  .subfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 9px;
    background: rgba(30, 41, 59, 0.5);
    margin-bottom: 6px;
  }
  .subfolder-header {
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color:var(--sub-text);
    user-select: none;
  }
  .subfolder-header:hover { background: rgba(255,255,255,0.05); }
  .subfolder-body {
    padding: 5px 6px 6px;
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    display: block;
    background:var(--box-sub);
  }
  .subfolder-box.collapsed > .subfolder-body { display: none; }
  .subfolder-box:not(.collapsed) > .subfolder-header .folder-arrow { transform: rotate(90deg); }

  .testfolder-box {
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 7px;
    background: rgba(30, 41, 59, 0.35);
    margin-bottom: 5px;
  }
  .testfolder-header {
    padding: 6px 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    color:var(--muted);
    user-select: none;
  }
  .testfolder-header:hover { color:var(--text); background: rgba(255,255,255,0.04); }
  .testfolder-body {
    padding: 4px 5px 5px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
    display: block;
  }
  .testfolder-box.collapsed > .testfolder-body { display: none; }
  .testfolder-box:not(.collapsed) > .testfolder-header .folder-arrow { transform: rotate(90deg); }

  .lesson-item {
    padding: 8px 10px;
    border-radius: 7px;
    background: rgba(255,255,255,0.02);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  .lesson-item:hover { background: rgba(255,255,255,0.07); }
  .lesson-item.active {
    background: rgba(245, 158, 11, 0.18);
    border-color: rgba(245, 158, 11, 0.45);
  }
  .lesson-item-title { font-size: 12px; font-weight: 600; color:var(--text); line-height: 1.35; }
  .lesson-item-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .done-badge {
    width: 17px; height: 17px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    flex-shrink: 0;
  }
  .lesson-item.done .done-badge {
    background: rgba(16, 185, 129, 0.22);
    color:var(--hl-green);
  }

  /* Main Area */
  .main-area { flex: 1; overflow-y: auto; padding: 20px 26px 60px; }
  .lesson-container { max-width: 1040px; margin: 0 auto;  }
  .lesson-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-unit-tag { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .lesson-title { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .btn {
    padding: 7px 13px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    cursor: pointer;
    transition: background-color 0.18s, border-color 0.18s, color 0.18s, transform 0.18s, opacity 0.18s, box-shadow 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #0f172a; }
  .btn-primary:hover { background: var(--primary-hover); color: #fff; }
  .btn-done.completed { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color:var(--hl-green); }

  /* Mode Bar */
  .mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 18px;
    background: rgba(30, 41, 59, 0.85);
    padding: 8px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .mode-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
  .mode-tab {
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.16s, border-color 0.16s, color 0.16s, transform 0.16s, opacity 0.16s, box-shadow 0.16s;
  }
  .mode-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .mode-tab.active {
    background: rgba(245, 158, 11, 0.2);
    color:var(--hl-gold);
    border-color: rgba(245, 158, 11, 0.45);
  }

  /* Audio Player Card */
  .audio-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .audio-bar audio { width: 100%; height: 38px; border-radius: 8px; }
  .bg-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 800;
    color: #4ade80;
    background: rgba(34,197,94,0.16);
    padding: 3px 9px;
    border-radius: 999px;
  }

  /* Dictation Box */
  .dic-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .dic-sentence {
    font-size: 17px;
    line-height: 2.1;
    padding: 16px;
    background:var(--box-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 12px 0;
  }
  .dic-input {
    padding: 4px 8px;
    font-size: 16px;
    font-weight: 700;
    border: 2px solid var(--border);
    border-radius: 7px;
    background: var(--box-sub);
    color: var(--text);
    text-align: center;
    outline: none;
    margin: 0 2px;
  }
  .dic-input:focus { border-color: var(--primary); }
  .dic-input.correct, .spell-input.correct { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.18) !important; color: #6ee7b7 !important; animation: popCorrect 0.28s ease; }
  .dic-input.wrong, .spell-input.wrong { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.18) !important; color: #fca5a5 !important; animation: shakeWrong 0.28s ease; }

  .subs-list { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .sub-item {
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background:var(--box-sub);
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .sub-item.active { border-color: var(--primary); background: rgba(245, 158, 11, 0.14); }
  .sub-time { font-size: 11.5px; font-weight: 800; color: var(--primary); background: rgba(255,255,255,0.06); padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }

  /* Smart Learn & SRS */
  .srs-stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 720px) { .srs-stats-bar { grid-template-columns: repeat(2, 1fr); } }
  .srs-stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .srs-stat-num { font-size: 20px; font-weight: 800; }
  .srs-stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .smart-box, .drill-box { max-width: 680px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .step-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .step-pill { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); }
  .step-pill.done { background: #10b981; }
  .step-pill.active { background: var(--primary); }
  .example-list { margin-top: 12px; padding: 12px 14px; background:var(--box-sub); border-radius: 10px; border-left: 3px solid var(--primary); display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.55; color:var(--text); }

  .fc-stage { max-width: 600px; margin: 0 auto 26px; text-align: center; }
  .fc-card {
    background: linear-gradient(145deg, var(--panel), var(--box-sub));
    color: var(--text);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 18px;
    padding: 32px 26px;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,0.16);
  }
  .srs-rate-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .srs-btn { padding: 11px 10px; border-radius: 11px; font-size: 13px; font-weight: 800; cursor: pointer; border: 1px solid transparent; }
  .srs-btn.Hard { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .srs-btn.Good { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.45); color:var(--hl-gold); }

function readListeningPosMap() {
  try {
    const m = JSON.parse(localStorage.getItem(LESSON_POS_KEY) || '{}');
    return m && typeof m === 'object' && !Array.isArray(m) ? m : {};
  } catch (e) { return {}; }
}
function getListeningLessonPos(lessonId) {
  const rec = lessonId ? readListeningPosMap()[lessonId] : null;
  return {
    wordIdx: Math.max(0, Number(rec && rec.wordIdx) || 0),
    subIdx: Math.max(0, Number(rec && rec.subIdx) || 0)
  };
}
function saveListeningLessonPos(lessonId, patch) {
  if (!lessonId) return;
  try {
    const map = readListeningPosMap();
    const cur = map[lessonId] && typeof map[lessonId] === 'object' ? map[lessonId] : {};
    const next = Object.assign({ wordIdx: 0, subIdx: 0 }, cur, patch || {}, { updatedAt: Date.now() });
    if (!next.wordIdx && !next.subIdx && !map[lessonId]) return;
    map[lessonId] = next;
    const keys = Object.keys(map);
    if (keys.length > 200) {
      keys.sort((a, b) => (map[b] && map[b].updatedAt || 0) - (map[a] && map[a].updatedAt || 0))
        .slice(200).forEach(k => { delete map[k]; });
    }
    localStorage.setItem(LESSON_POS_KEY, JSON.stringify(map));
  } catch (e) {}
}
function applyListeningLessonPos(lesson) {
  const pos = getListeningLessonPos(lesson && lesson.id);
  const words = (lesson && lesson.problem && lesson.problem.poolKey && POOLS[lesson.problem.poolKey]) || [];
  const subs = ((lesson && lesson.problem && lesson.problem.subs) || []).filter(s => s.en);
  currentWordIdx = words.length ? Math.min(pos.wordIdx, words.length - 1) : pos.wordIdx;
  currentSubIdx = subs.length ? Math.min(pos.subIdx, subs.length - 1) : pos.subIdx;
}

const loadedChunks = {};
const chunkLoadWaiters = {};
function finishChunkLoad(unitId, loaded) {
  const waiters = chunkLoadWaiters[unitId] || [];
  delete chunkLoadWaiters[unitId];
  waiters.forEach(cb => { try { cb(loaded); } catch (e) { console.error(e); } });
}
function ensureChunkLoaded(unitId, cb) {
  if (window.__STUDY4_LISTEN_CHUNK && window.__STUDY4_LISTEN_CHUNK[unitId]) {
    const chunk = window.__STUDY4_LISTEN_CHUNK[unitId];
    if (chunk.sharedWordPools) {
      Object.assign(DATA.sharedWordPools, chunk.sharedWordPools);
      POOLS = DATA.sharedWordPools;
    }
    const targetUnit = DATA.units.find(u => u.unitId === unitId);
    if (targetUnit && chunk.items) {
      targetUnit.items = chunk.items;
    }
    (chunk.items || []).forEach(it => {
      const found = ALL_LESSONS.find(x => x.id === it.id);
      if (found) {
        Object.assign(found, it, { unitId, unitName: targetUnit ? targetUnit.unitName : '' });
      }
    });
    cb && cb(true);
    return;
  }

  if (cb) (chunkLoadWaiters[unitId] || (chunkLoadWaiters[unitId] = [])).push(cb);
  if (loadedChunks[unitId] === 'loading') {
    return;
  }

  loadedChunks[unitId] = 'loading';
  const s = document.createElement('script');
  s.src = `data/listening_${unitId}.js`;
  s.onload = function() {
    if (window.__STUDY4_LISTEN_CHUNK && window.__STUDY4_LISTEN_CHUNK[unitId]) {
      loadedChunks[unitId] = 'done';
      ensureChunkLoaded(unitId);
      finishChunkLoad(unitId, true);
    } else {
      loadedChunks[unitId] = 'error';
      console.error('Chunk loaded without data for ' + unitId);
      finishChunkLoad(unitId, false);
    }
  };
  s.onerror = function() {
    console.error('Failed to load chunk for ' + unitId);
    loadedChunks[unitId] = 'error';
    finishChunkLoad(unitId, false);
  };
  document.head.appendChild(s);
}

}

function getBookName(str) {
  const s = str || '';
  let m = s.match(/(IELTS Collection \d+|Collection \d+)/i);
  if (m) return m[1].replace(/^Collection/i, 'IELTS Collection');
  if (/(?:(?:BC|British\s*Council)\s*Asia|Official\s*Guide|Asia\s*Guide)/i.test(s)) return 'British Council Asia Guide';
  if (/(?:\bBC\b|British\s*Council)\b.*Test/i.test(s)) return 'British Council (BC) Tests';
  if (/Sample\s*Listening|Sample\s*Test/i.test(s)) return 'IELTS Sample Tests';
  if (/Simulation/i.test(s)) return 'IELTS Simulation Tests';
  m = s.match(/(Practice Set \d+)/i);
  if (m) return m[1];
  return 'Chủ đề / Bộ đề khác';
}

function getTestName(str) {
  const s = str || '';
  let m = s.match(/(?:(?:BC|British\s*Council)\s*Asia(?:\s*Guide)?|Official\s*Guide|Asia\s*Guide).*?Test\s*(\d+)/i);
  if (m) return `Asia Guide Test ${m[1]}`;
  m = s.match(/(?:\bBC\b|British\s*Council)\b.*?Test\s*(\d+)/i);
  if (m) return `BC Test ${m[1]}`;
  m = s.match(/Sample\s*(?:Listening\s*)?Test\s*(\d+)/i);
  if (m) return `Sample Test ${m[1]}`;
  m = s.match(/(Test\s*\d+)/i);
  return m ? m[1].replace(/test/i, 'Test') : s.split('|')[0].trim();
}

const S4_BOOK_SERIES_ORDER = [
  { re: /^IELTS Collection\s*(\d+)/i, rank: 1 },
  { re: /Simulation/i, rank: 2 },
  { re: /British Council \(BC\)/i, rank: 3 },
  { re: /Asia Guide/i, rank: 4 },
  { re: /Sample Tests/i, rank: 5 },
  { re: /^Practice Set\s*(\d+)/i, rank: 6 }
];
function getBookSortKey(name) {
  for (const row of S4_BOOK_SERIES_ORDER) {
    const m = name.match(row.re);
    if (m) return [row.rank, m[1] ? parseInt(m[1], 10) : 0];
  }
  return [99, 0];
}
function sortBookKeys(keys) {
  return [...keys].sort((a, b) => {
    const ra = getBookSortKey(a), rb = getBookSortKey(b);
    return ra[0] !== rb[0] ? ra[0] - rb[0] : ra[1] - rb[1];
  });
}
function sortTestKeys(keys) {
  return [...keys].sort((a, b) => {
    const ma = a.match(/\bTest\s*(\d+)/i), mb = b.match(/\bTest\s*(\d+)/i);
    return (ma && mb) ? parseInt(ma[1], 10) - parseInt(mb[1], 10) : 0;
  });
}

let wordAudioToken = 0;
function playWordAudio(v, lang = 'en-GB') {
  if (!v) return;
  const token = ++wordAudioToken;
  const wordText = v.origin || v.word || v.term || '';
  const url = lang === 'en-US' ? (v.usAudio || v.ukAudio || v.audio) : (v.ukAudio || v.audio || v.usAudio);
  const isPrivateTts = url && (url.includes('/ai_services/tts') || url.includes('study4.com/login'));
  const player = document.getElementById('ttsAudioPlayer');
  if (player) {
    try { player.pause(); } catch (e) {}
  }
  const directUrl = (url && !isPrivateTts) ? (url.startsWith('http') ? url : 'https://study4.com' + url) : '';
  if (window.S4UI && typeof window.S4UI.speakEnglish === 'function') {
    window.S4UI.speakEnglish(wordText, { lang, rate: 0.95, audioUrl: directUrl });
    return;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  if (directUrl && player) {
    player.src = directUrl;
    player.play().catch(() => {
      if (token !== wordAudioToken) return;
      speakWordFallback(wordText, lang, token);
    });
  } else {
    speakWordFallback(wordText, lang, token);
  }
}

function speakWordFallback(text, lang = 'en-GB', token = wordAudioToken) {
  if (token !== wordAudioToken || !text) return;
  if (window.S4UI && typeof window.S4UI.speakEnglish === 'function') {
    window.S4UI.speakEnglish(text, { lang, rate: 0.95 });
    return;
  }
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function fmtTime(ms) {
  const totalSec = Math.max(0, Math.floor((ms || 0) / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}

function normWord(s) {
  return (s || '').toLowerCase().replace(/[’‘']/g, '').replace(/[^a-z0-9]/g, '').trim();
}

function revealWordDictation() {
  const item = currentLesson && POOLS[currentLesson.problem.poolKey]?.[currentWordIdx];
  const feedback = document.getElementById('wordDicFeedback');
  if (item && feedback) feedback.textContent = 'Đáp án: ' + item.term;
}

function normalizeDictationHint(text) {
  return String(text || '').normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}

function canShowDictationHint(sub, idx, level) {
  const hint = normalizeDictationHint(sub.vi);
  if (!hint || hint === normalizeDictationHint(sub.en)) return false;
  return !buildDictationTokens(sub.en, idx, level).some((token) => {
    if (!token.isBlank || !/\d/.test(token.answer)) return false;
    const answer = normalizeDictationHint(token.answer);
    return answer && (' ' + hint + ' ').includes(' ' + answer + ' ');
  });
}

function buildDictationTokens(sentence, idx, level) {
  const words = (sentence || '').trim().split(/\s+/);
  let lastBlank = false, blankCount = 0;
  const tokens = words.map((rawW, wIdx) => {
    const m = rawW.match(/^([^A-Za-z0-9'’‘]*)([A-Za-z0-9'’‘-]+)([^A-Za-z0-9'’‘]*)$/);
    if (!m) { lastBlank = false; return { isBlank: false, raw: rawW }; }
    const prefix = m[1], clean = m[2], suffix = m[3];
    if (clean.length <= 2 && words.length > 3) { lastBlank = false; return { isBlank: false, raw: rawW }; }
    const hash = (idx * 31 + wIdx * 17 + clean.charCodeAt(0)) % 10;
    const hide = (level === 'word_hard') ? (hash < 6) : (!lastBlank && hash < 3);
    if (hide) blankCount++;
    lastBlank = hide;
    return { isBlank: hide, prefix, answer: clean, suffix, raw: rawW };
  });
  if (blankCount === 0 && tokens.length > 0) {
    const pick = tokens.findIndex(t => t.answer && t.answer.length > 2);
    if (pick >= 0) tokens[pick].isBlank = true;
  }
  return tokens;
}

function getSubEndMs(subs, idx) {
  const cur = subs[idx];
  if (!cur) return 0;
  const startMs = cur.time || 0;
  if (cur.end && cur.end > startMs) return cur.end;
  const next = subs[idx + 1];
  if (next && (next.time || 0) > startMs) {
    return Math.max(startMs + 800, next.time - 120);
  }
  return startMs + Math.max(4500, (cur.en || '').length * 95);
}

// Native audio play hook + 45ms high-precision sentence boundary watcher
(function initSentenceAutoPause() {
  const passAudioEl = document.getElementById('globalPassAudio');
  if (passAudioEl) {
    passAudioEl.addEventListener('loadeddata', () => {
      const slot = document.getElementById('audioSlot');
      const errMsg = slot && slot.querySelector('.s4-audio-err-msg');
      if (errMsg) errMsg.remove();
    });
    passAudioEl.addEventListener('play', () => {
      if (isListeningPzMode) return;
      if (!currentLesson || currentLesson.problem?.pType !== 'listen_passage') return;
      const subs = (currentLesson.problem.subs || []).filter(s => s.en);
      if (!subs.length || passageMode !== 'dictation' || !autoPauseSub) return;
      const cur = subs[currentSubIdx];
      if (!cur) return;
      const startMs = cur.time || 0;
      const endMs = getSubEndMs(subs, currentSubIdx);
      const curMs = passAudioEl.currentTime * 1000;
      if (curMs < startMs - 250 || curMs >= endMs - 100) {
        subPauseLock = false;
        passAudioEl.currentTime = Math.max(0, startMs / 1000);
      }
    });
  }

  let passAudioSyncTimer = null;
  function stopPassAudioSync() {
    if (passAudioSyncTimer) {
      clearInterval(passAudioSyncTimer);
      passAudioSyncTimer = null;
    }
  }
  function tickPassAudioSync() {
    if (isListeningPzMode) { stopPassAudioSync(); return; }
    const a = document.getElementById('globalPassAudio');
    if (!a || a.paused || a.ended) { stopPassAudioSync(); return; }
    if (!currentLesson || currentLesson.problem?.pType !== 'listen_passage') { stopPassAudioSync(); return; }
    const subs = (currentLesson.problem.subs || []).filter(s => s.en);
    if (!subs.length) { stopPassAudioSync(); return; }
    const curMs = a.currentTime * 1000;

    if (passageMode === 'dictation' && autoPauseSub) {
      const cur = subs[currentSubIdx];
      if (!cur) return;
      const startMs = cur.time || 0;
      const endMs = getSubEndMs(subs, currentSubIdx);
      if (curMs >= endMs && !subPauseLock) {
        subPauseLock = true;
        if (autoLoopSub) {
          a.pause();
          setTimeout(() => {
            if (!isListeningPzMode && passageMode === 'dictation' && autoLoopSub) {
              subPauseLock = false;
              a.currentTime = Math.max(0, startMs / 1000);
              a.play().catch(() => {});
            }
          }, 450);
        } else {
          a.pause();
          a.currentTime = Math.max(0, startMs / 1000);
          setTimeout(() => { subPauseLock = false; }, 150);
        }
      }
    } else if (passageMode === 'transcript') {
      let activeIdx = 0;
      for (let i = 0; i < subs.length; i++) {
        if (curMs >= (subs[i].time || 0) - 150) activeIdx = i;
        else break;
      }
      if (activeIdx !== transcriptActiveIdx) {
        transcriptActiveIdx = activeIdx;
        document.querySelectorAll('.sub-item').forEach((el, idx) => {
          const isAct = idx === activeIdx;
          el.classList.toggle('active', isAct);
          if (isAct) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });
      }
    }
  }
  function startPassAudioSync() {
    if (passAudioSyncTimer) return;
    passAudioSyncTimer = setInterval(tickPassAudioSync, 45);
  }
  document.addEventListener('play', (e) => {
    if (e && e.target && e.target.id === 'globalPassAudio') startPassAudioSync();
  }, true);
  document.addEventListener('pause', (e) => {
    if (e && e.target && e.target.id === 'globalPassAudio') stopPassAudioSync();
  }, true);
  document.addEventListener('ended', (e) => {
    if (e && e.target && e.target.id === 'globalPassAudio') stopPassAudioSync();
  }, true);
  window.addEventListener('pagehide', stopPassAudioSync);
})();

window.checkDictation = function() {
  const subs = (currentLesson?.problem?.subs || []).filter(s => s.en);
  const sub = subs[currentSubIdx];
  if (!sub) return;
  const inputs = [...document.querySelectorAll('.dic-input')];
  let allOk = true;
  inputs.forEach(inp => {
    const ans = inp.getAttribute('data-ans') || '';
    const ok = normWord(inp.value) === normWord(ans);
    inp.classList.remove('correct', 'wrong');
    const oldHint = inp.nextElementSibling;
    if (oldHint && oldHint.classList.contains('dic-ans-hint')) oldHint.remove();
    inp.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) {
      allOk = false;
      const hint = document.createElement('span');
      hint.className = 'dic-ans-hint';
      hint.textContent = ans;
      inp.insertAdjacentElement('afterend', hint);
    }
  });
  const rev = document.getElementById('dicAnsReveal');
  if (rev) {
    rev.style.color = allOk ? 'var(--hl-green)' : '#f87171';
    rev.innerHTML = allOk
      ? `<span class="lp-chip-inline">${lIcon('check', 14)} Chính xác: ${sub.en}</span>`
      : `<span class="lp-chip-inline">${lIcon('close', 14)} Chưa đúng — Đáp án đầy đủ: ${sub.en}</span>`;
  }
  if (allOk && currentSubIdx < subs.length - 1) {
    setTimeout(() => {
      currentSubIdx++;
      if (currentLesson) saveListeningLessonPos(currentLesson.id, { subIdx: currentSubIdx });
      renderMain();
      playCurrentSub();
      setTimeout(focusCurrentDicInput, 100);
    }, 950);
  }
};

window.S4FormatTheoryHtml = function(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return '';
  let html = rawHtml;

  // 1. Remove empty spacer paragraphs (<p>&nbsp;</p>, <p><span>&nbsp;</span></p>, etc.)
  html = html.replace(/<p\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>|<(?:span|strong|em|u)\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>)*<\/(?:span|strong|em|u)>)*<\/p>/gi, '');

  // 2. Convert Google Docs single-item <ol><li style="list-style-type:upper-roman|decimal"><h1|h2>...</h1|h2></li></ol> into structured section headers
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  html = html.replace(/<ol(?:\s+start="(\d+)")?\s*>\s*<li\b([^>]*)>\s*<(h[1-3])\b[^>]*>([\s\S]*?)<\/\3>\s*<\/li>\s*<\/ol>/gi, function(m, startNum, liAttr, hTag, inner) {
    const idx = startNum ? Math.max(1, parseInt(startNum, 10)) : 1;
    const isRoman = /upper-roman/i.test(liAttr);
    const isAlpha = /upper-alpha/i.test(liAttr);
    const badge = isRoman ? (ROMAN[idx - 1] || idx) : (isAlpha ? String.fromCharCode(64 + idx) : String(idx));
    const isSub = hTag.toLowerCase() !== 'h1' && !isRoman;
    const cleanInner = inner.replace(/&nbsp;/gi, ' ').trim();
    if (isSub) {
      return '<div class="s4-subsec-heading"><span class="s4-subsec-badge">' + badge + '</span><span class="s4-subsec-title">' + cleanInner + '</span></div>';
    }
    return '<div class="s4-sec-heading"><span class="s4-sec-badge">' + badge + '</span><span class="s4-sec-title">' + cleanInner + '</span></div>';
  });

  // 3. Convert Google Docs fake bullet paragraphs <p style="...list-style-type:disc...">...</p>
  html = html.replace(/<p\b([^>]*style\s*=\s*"[^"]*list-style-type\s*:\s*disc[^"]*"[^>]*)>([\s\S]*?)<\/p>/gi, '<p class="s4-pseudo-li">$2</p>');

  // 4. Process all tags with a style="..." attribute
  html = html.replace(/<([a-zA-Z0-9]+)\b([^>]*?)\sstyle\s*=\s*"([^"]*)"([^>]*)>/gi, function(full, tag, before, styleStr, after) {
    const t = tag.toLowerCase();
    const classes = [];
    let s = styleStr;

    // Highlight background colors -> soft pastel badge classes
    if (/background(?:-color)?\s*:\s*#ffff00\b/i.test(s)) {
      classes.push('s4-hl-amber');
      s = s.replace(/background(?:-color)?\s*:\s*#ffff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ffff\b/i.test(s)) {
      classes.push('s4-hl-sky');
      s = s.replace(/background(?:-color)?\s*:\s*#00ffff\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ff00\b/i.test(s)) {
      classes.push('s4-hl-emerald');
      s = s.replace(/background(?:-color)?\s*:\s*#00ff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#ff9900\b/i.test(s)) {
      classes.push('s4-hl-rose');
      s = s.replace(/background(?:-color)?\s*:\s*#ff9900\s*;?/gi, '');
    }

    // Table header / accent cell backgrounds (#9fc5e8, #a4c2f4)
    if (/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\b/i.test(s)) {
      classes.push('s4-td-accent');
      s = s.replace(/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\s*;?/gi, '');
    }

    // Strip white / light gray / transparent backgrounds that break Dark Mode
    s = s.replace(/background(?:-color)?\s*:\s*(?:#ffffff|#fff|#f1f3f5|white|transparent)\s*;?/gi, '');

    // Foreground text colors
    if (/(?:^|[;\s])color\s*:\s*#ff0000\b/i.test(s)) {
      classes.push('s4-txt-red');
      s = s.replace(/(?:^|[;\s])color\s*:\s*#ff0000\s*;?/gi, '');
    }
    if (/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))/i.test(s)) {
      classes.push('s4-txt-blue');
      s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))\s*;?/gi, '');
    }
    // Strip hardcoded dark/black text colors
    s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#000000|#000|black|#1a1a1a|#242938)\s*;?/gi, '');

    // Clean up table, td, th, img, span fixed pixel dimensions & borders
    if (t === 'table' || t === 'td' || t === 'th' || t === 'img' || t === 'span') {
      s = s.replace(/\b(?:width|height)\s*:\s*[\d.]+px\s*;?/gi, '');
      s = s.replace(/\btable-layout\s*:\s*fixed\s*;?/gi, '');
      s = s.replace(/\bborder(?:-(?:top|bottom|left|right))?\s*:\s*[\d.]+px\s+solid\s+#[0-9a-fA-F]+\s*;?/gi, '');
      s = s.replace(/\boverflow\s*:\s*hidden\s*;?/gi, '');
    }

    // Soften excessive Google Docs left margins and remove justify alignment
    s = s.replace(/\btext-align\s*:\s*justify\s*;?/gi, '');
    s = s.replace(/\bmargin-left\s*:\s*(\d+)px\s*;?/gi, function(_, px) {
      const n = parseInt(px, 10);
      if (n >= 120) return 'margin-left:28px;';
      if (n >= 70) return 'margin-left:20px;';
      if (n >= 36) return 'margin-left:12px;';
      return '';
    });

    s = s.replace(/;\s*;/g, ';').trim().replace(/^;+|;+$/g, '').trim();

    let combinedBeforeAfter = before + after;
    if (classes.length > 0) {
      if (/\bclass\s*=\s*"([^"]*)"/i.test(combinedBeforeAfter)) {
        combinedBeforeAfter = combinedBeforeAfter.replace(/\bclass\s*=\s*"([^"]*)"/i, function(_, existing) {
          return 'class="' + (existing + ' ' + classes.join(' ')).trim() + '"';
        });
      } else {
        combinedBeforeAfter = ' class="' + classes.join(' ') + '"' + combinedBeforeAfter;
      }
    }

    const styleAttr = s ? ' style="' + s + '"' : '';
    return '<' + tag + combinedBeforeAfter + styleAttr + '>';
  });

  // 5. Move leading/trailing spaces outside highlight pills so borders hug the words cleanly
  html = html.replace(/<span\s+class="(s4-hl-[a-z0-9\s-]+)">(\s*)([\s\S]*?)(\s*)<\/span>/gi, function(m, cls, lead, inner, trail) {
    if (!inner.trim()) return lead + trail;
    return (lead || '') + '<span class="' + cls + '">' + inner + '</span>' + (trail || '');
  });

  // 6. Merge accidentally split paragraph lines right before "⇒ Paragraph X" (e.g. Question 18 in L15)
  html = html.replace(/<p>([\s\S]*?,)<\/p>\s*<p>(\s*(?:<span[^>]*>)*\s*[a-z][\s\S]*?)<\/p>(?=\s*<p[^>]*>\s*(?:<[^>]+>)*\s*(?:⇒|→|=>)\s*Paragraph)/gi, '<p>$1 $2</p>');

  // 7. Classify <p> blocks into Step Callouts, Question Cards, Passage Excerpts, Answer Pills, and Note Callouts
  html = html.replace(/<p(\b[^>]*)>([\s\S]*?)<\/p>/gi, function(full, pAttr, inner) {
    if (/s4-pseudo-li/i.test(pAttr)) return full;
    const plain = inner.replace(/<[^>]+>/g, '').replace(/&nbsp;|\u00a0/g, ' ').replace(/&rarr;/g, '→').replace(/\s+/g, ' ').trim();
    if (!plain) return full;

    // 7a. Step Callout: "Bước 1: ...", "Bước 3 + Bước 4 + Bước 5"
    if (/^Bước\s*\d+/i.test(plain) && plain.length < 160) {
      return '<div class="s4-step-callout"><span class="s4-step-icon">' + lIcon('target', 15) + '</span><div class="s4-step-body">' + inner + '</div></div>';
    }

    // 7b. Question Card: "Question 14: ...", "Practice 1: ..."
    if (/^(?:Question\s*\d+|Practice\s*\d+)\s*[:.]/i.test(plain)) {
      const decorated = inner.replace(/(?:<u>\s*)?(Question\s*\d+|Practice\s*\d+)\s*:?\s*(?:<\/u>)?(?:\s*<\/span>\s*<span[^>]*>)?\s*[:.]?\s*/i, '<span class="s4-q-badge">$1</span> ');
      return '<div class="s4-question-card">' + decorated + '</div>';
    }

    // 7c. Passage Excerpt: starts with "A. ", "B. ", ..., "I. " and is a passage paragraph (> 60 chars)
    if (/^[A-I]\.\s+/.test(plain) && plain.length > 60) {
      const decorated = inner.replace(/^(\s*(?:<[^>]+>\s*)*)([A-I])\.?(\s*(?:<\/[^>]+>\s*)*)/, '$1<span class="s4-para-badge">Đoạn $2</span>$3 ');
      return '<div class="s4-passage-excerpt">' + decorated + '</div>';
    }

    // 7d. Answer Pill or Conclusion Box: starts with "→", "⇒", "=>", or "Đáp án:"
    if (/^(?:→|⇒|=>)\s*/i.test(plain) || /^Đáp án\s*:/i.test(plain)) {
      const isShortAnswer = /^(?:→|⇒|=>)\s*(?:Paragraph\s+[A-Z]|Đáp án|Key|Answer|Main topic)/i.test(plain) || /^Đáp án\s*:/i.test(plain) || plain.length < 75;
      if (isShortAnswer) {
        return '<div class="s4-answer-wrap"><div class="s4-answer-pill">' + lIcon('check', 13) + ' ' + inner.replace(/^(\s*(?:<[^>]+>\s*)*)(?:→|⇒|=>)\s*/, '$1') + '</div></div>';
      }
      return '<div class="s4-conclusion-box">' + inner + '</div>';
    }

    // 7e. Note Callout: starts with "Lưu ý:", "Chú ý:"
    if (/^(?:Lưu ý|Chú ý|Mẹo)\s*:/i.test(plain)) {
      return '<div class="s4-note-callout">' + lIcon('lightbulb', 14) + ' ' + inner + '</div>';
    }

    return full;
  });

  return html;
};

function getListeningUnitPool() {
  if (!currentLesson) return ALL_LESSONS;
  const unitList = ALL_LESSONS.filter(x => x.unitId === currentLesson.unitId);
  return unitList.length ? unitList : ALL_LESSONS;
}

window.stepListeningLesson = function(delta) {
  if (!currentLesson) return;
  const pool = getListeningUnitPool();
  const idx = pool.findIndex(x => x.id === currentLesson.id);
  const nextIdx = idx + Number(delta || 0);
  if (idx >= 0 && nextIdx >= 0 && nextIdx < pool.length) {
    selectLesson(pool[nextIdx].id);
  }
};

      <div class="audio-bar" id="audioSlot">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span class="bg-badge lp-chip-inline">${lIcon('volume', 13)} AUDIO MP3 CHUẨN GỐC • HỖ TRỢ NGHE NỀN</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <button class="btn lp-chip-inline" onclick="seekPassAudio(-5)" title="Tua lùi 5 giây">${lIcon('rewind', 13)} -5s</button>
            <button class="btn lp-chip-inline" onclick="seekPassAudio(5)" title="Tua tới 5 giây">${lIcon('forward', 13)} +5s</button>
            <button class="btn speed-btn" data-rate="0.75" onclick="setPassSpeed(0.75)">0.75x</button>
            <button class="btn speed-btn btn-primary" data-rate="1" onclick="setPassSpeed(1)">1.0x</button>
            <button class="btn speed-btn" data-rate="1.25" onclick="setPassSpeed(1.25)">1.25x</button>
            ${hasSubs ? `
              <button class="btn lp-chip-inline ${passageMode === 'dictation' ? 'btn-primary' : ''}" onclick="passageMode='dictation';renderMain();">${lIcon('edit', 13)} Chép chính tả</button>
              <button class="btn lp-chip-inline ${passageMode === 'transcript' ? 'btn-primary' : ''}" onclick="passageMode='transcript';renderMain();">${lIcon('reading', 13)} Transcript (${subs.length} câu)</button>
            ` : ''}
            ${hasPzTest ? `
              <button class="btn lp-chip-inline" style="background:rgba(16,185,129,0.16);border-color:rgba(16,185,129,0.45);color:var(--hl-green);" onclick="openListeningPzFromLesson()">${lIcon('target', 13)} Làm đề &amp; Chấm điểm</button>
            ` : ''}
          </div>
        </div>
      </div>
      ${hasSubs ? (passageMode === 'dictation' ? `
        <div class="dic-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:13px;font-weight:800;color:var(--hl-gold);">Câu ${currentSubIdx + 1} / ${subs.length} <small style="color:var(--hl-cyan);font-weight:600;">(${fmtTime(sub.time)} -> ${fmtTime(getSubEndMs(subs, currentSubIdx))})</small></span>
              <button class="mini-btn lp-chip-inline" style="${autoPauseSub ? 'border-color:#10b981;color:var(--hl-green);background:rgba(16,185,129,0.14);' : ''}" onclick="autoPauseSub=!autoPauseSub;renderMain();">${lIcon('pause', 12)} Tự dừng hết câu: ${autoPauseSub ? 'BẬT' : 'TẮT'}</button>
              <button class="mini-btn lp-chip-inline" style="${autoLoopSub ? 'border-color:#f59e0b;color:var(--hl-gold);background:rgba(245,158,11,0.14);' : ''}" onclick="autoLoopSub=!autoLoopSub;if(autoLoopSub)autoPauseSub=true;renderMain();">${lIcon('refresh', 12)} Lặp lại câu: ${autoLoopSub ? 'BẬT' : 'TẮT'}</button>
              <button class="mini-btn" style="${showViSub ? 'border-color:var(--hl-cyan);color:var(--vi-text);' : ''}" onclick="showViSub=!showViSub;renderMain();">Nghĩa Việt: ${showViSub ? 'BẬT' : 'TẮT'}</button>
              <button class="mini-btn lp-chip-inline" onclick="dicLevel=(dicLevel==='word'?'word_hard':'word');renderMain();">${lIcon('target', 12)} Độ khó: ${dicLevel === 'word' ? 'Vừa' : 'Khó'}</button>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn" onclick="currentSubIdx=Math.max(0,currentSubIdx-1);if(currentLesson)saveListeningLessonPos(currentLesson.id,{subIdx:currentSubIdx});renderMain();playCurrentSub();">← Câu trước</button>
              <button class="btn btn-primary lp-chip-inline" onclick="playCurrentSub()">${lIcon('volume', 14)} Nghe câu này (\\)</button>
              <button class="btn" onclick="currentSubIdx=Math.min(${subs.length - 1},currentSubIdx+1);if(currentLesson)saveListeningLessonPos(currentLesson.id,{subIdx:currentSubIdx});renderMain();playCurrentSub();">Câu sau →</button>
            </div>
          </div>
          ${(showViSub && canShowDictationHint(sub, currentSubIdx, dicLevel)) ? `<div style="padding:9px 13px;background:var(--vi-bg);border-left:3px solid #38bdf8;border-radius:6px;font-size:13.5px;color:var(--vi-text);margin-bottom:10px;"><strong>Nghĩa Việt:</strong> ${sub.vi}</div>` : ''}
          <div class="dic-sentence">
            ${buildDictationTokens(sub.en, currentSubIdx, dicLevel).map(tk => {
              if (!tk.isBlank) return `<span>${tk.raw} </span>`;
              const w = Math.max(66, tk.answer.length * 10 + 18);
              return `${tk.prefix}<input type="text" class="dic-input" data-ans="${tk.answer.replace(/"/g, '&quot;')}" style="width:${w}px;" autocomplete="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" oninput="handleDicInput(this)" onkeydown="handleDicKeydown(event, this)">${tk.suffix} `;
            }).join('')}
          </div>
          <div id="dicAnsReveal" style="min-height:20px;font-size:13.5px;font-weight:700;color:var(--hl-green);margin:8px 0;"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary lp-chip-inline" onclick="checkDictation()">${lIcon('check', 14)} Kiểm tra (Enter)</button>
              <button class="btn lp-chip-inline" onclick="revealDictation()">${lIcon('lightbulb', 14)} Hiện đáp án</button>
            </div>
            <span style="font-size:11.5px;color:var(--muted);">Mẹo: Nhấn <strong>Space / Tab</strong> qua ô kế • <strong>\\</strong> nghe lại câu • <strong>Enter</strong> chấm & tự qua câu</span>
          </div>
        </div>
      ` : `
        <div class="subs-list">
          ${subs.map((s, idx) => `
            <div class="sub-item ${idx === transcriptActiveIdx ? 'active' : ''}" onclick="window.seekToTranscriptSub(${idx});">
              <span class="sub-time">${fmtTime(s.time)}</span>
              <div>
                <div style="font-weight:600;color:var(--text);">${s.en}</div>
                ${s.vi ? `<div style="font-size:13px;color:var(--muted);margin-top:3px;">${s.vi}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `) : `
        <div class="dic-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <div>
              <div class="lp-chip-inline" style="font-size:15px;font-weight:800;color:var(--hl-gold);">${lIcon('edit', 15)} Bàn Luyện Nghe Chép Chính Tả &amp; Note-Taking</div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">Bấm Play trên thanh Audio phía trên (hoặc nút -5s / +5s) để nghe và gõ lại nội dung / từ khóa nghe được. Nội dung tự động lưu.</div>
            </div>
            <button class="btn btn-primary lp-chip-inline" onclick="const a=document.getElementById('globalPassAudio'); if(a){if(a.paused)a.play();else a.pause();}">${lIcon('play', 14)} Phát / Tạm dừng Audio</button>
          </div>
          <textarea class="spell-input" style="min-height:170px;font-size:15px;font-weight:500;line-height:1.65;resize:vertical;letter-spacing:normal;" placeholder="Gõ nội dung nghe chép chính tả hoặc ghi chú từ khóa (Note-taking) của bạn tại đây..." oninput="saveListeningNote(this.value)">${savedNote.replace(/</g, '&lt;')}</textarea>
        </div>
      `}
      ${relatedExplainsHtml}
    `;
  } else {
    const u6Sources = (currentLesson.unitId === 'u_6' && window.S4PracticeZone && window.S4PracticeZone.findListeningSourcesForExplain)
      ? window.S4PracticeZone.findListeningSourcesForExplain(currentLesson, ALL_LESSONS)
      : { ident: null, u4Lessons: [], hasPz: false };
    const u6BackLinksHtml = (u6Sources.ident && (u6Sources.u4Lessons.length > 0 || u6Sources.hasPz)) ? `
      <div class="dic-card" id="u6ReverseLinksBox" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <div class="lp-chip-inline" style="font-size:13.5px;font-weight:800;color:var(--hl-cyan);">${lIcon('external', 14)} Luyện đề gốc: ${u6Sources.ident.label}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">Chuyển nhanh sang luyện Nghe &amp; Chép chính tả từng Section hoặc làm Full Test chuẩn phòng thi máy.</div>
          </div>
          ${u6Sources.hasPz ? `
            <button class="btn lp-chip-inline" style="background:rgba(16,185,129,0.16);border-color:rgba(16,185,129,0.45);color:var(--hl-green);font-weight:800;" onclick="openListeningPzByKey('${u6Sources.ident.key}')">
              ${lIcon('zap', 14)} Làm đề Full Test (CBT)
            </button>
          ` : ''}
        </div>
        ${u6Sources.u4Lessons.length ? `
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
            ${u6Sources.u4Lessons.map((u4, idx) => {
              const sm = String(u4.title || '').match(/Section\s*(\d+)/i);
              const secLabel = sm ? `Section ${sm[1]}` : `Phần ${idx + 1}`;
              return `
                <button class="btn lp-chip-inline" style="background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.35);color:var(--vi-text);" onclick="selectLesson('${u4.id}')">
                  ${lIcon('listening', 14)} Chép chính tả ${secLabel}
                </button>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    ` : '';
    bodyHtml = `
      ${currentLesson.youtubeId ? `
        <div class="video-box">
          <iframe src="https://www.youtube.com/embed/${currentLesson.youtubeId}?rel=0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:-12px;margin-bottom:16px;">
          <a href="https://www.youtube.com/watch?v=${currentLesson.youtubeId}" target="_blank" rel="noopener noreferrer" class="btn mini-btn lp-chip-inline" style="text-decoration:none;font-size:12px;font-weight:700;">
            ${lIcon('tedtalks', 13)} Mở xem trên YouTube ${lIcon('external', 12)}
          </a>
        </div>
      ` : ''}
      ${u6BackLinksHtml}
      ${currentLesson.htmlContent ? `<div class="theory-card">${window.S4FormatTheoryHtml(currentLesson.htmlContent)}</div>` : ''}
    `;
  }

  const navPool = getListeningUnitPool();
  const navIdx = navPool.findIndex(x => x.id === currentLesson.id);
  const prevLessonObj = navIdx > 0 ? navPool[navIdx - 1] : null;
  const nextLessonObj = (navIdx >= 0 && navIdx + 1 < navPool.length) ? navPool[navIdx + 1] : null;
  const escNavTitle = (t) => cleanListenTitle(t).replace(/"/g, '&quot;');
  const prevBtnAttrs = prevLessonObj
    ? `title="Bài trước: ${escNavTitle(prevLessonObj.title)}" onclick="stepListeningLesson(-1)"`
    : 'disabled title="Đã ở bài đầu tiên"';
  const nextBtnAttrs = nextLessonObj
    ? `title="Bài tiếp theo: ${escNavTitle(nextLessonObj.title)}" onclick="stepListeningLesson(1)"`
    : 'disabled title="Đã ở bài cuối cùng"';

  container.innerHTML = `
    <div class="lesson-header">
      <div>
        <div class="lesson-unit-tag">${currentLesson.group || currentLesson.unitName}</div>
        <h1 class="lesson-title">${formatListenTitleHtml(currentLesson.title, 18)}</h1>
      </div>
      <div class="lesson-actions" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span class="s4-lesson-nav-group">
          <button type="button" class="btn mini-btn" id="btnPrevListenLesson" ${prevBtnAttrs}>← Bài trước</button>
          <button type="button" class="btn mini-btn" id="btnNextListenLesson" ${nextBtnAttrs}>Bài tiếp →</button>
        </span>
        <button class="btn btn-done lp-chip-inline ${isDone ? 'completed' : ''}" onclick="toggleDoneCurrent()">
          ${isDone ? `${lIcon('check', 14)} Đã hoàn thành` : 'Đánh dấu hoàn thành'}
        </button>
      </div>
    </div>
    ${bodyHtml}
    <div class="s4-lesson-footer-nav">
      <button type="button" class="btn mini-btn" ${prevBtnAttrs}>← Bài trước</button>
      <span class="s4-lesson-footer-pos">${navIdx >= 0 ? `Bài ${navIdx + 1}/${navPool.length}` : ''}</span>
      <button type="button" class="btn btn-primary" ${nextBtnAttrs}>Bài tiếp theo →</button>
    </div>
  `;

  if (pType === 'topic_flashcards' && window.S4VocabEngine) {
    const modeMap = { smart_learn: 'smart', srs_review: 'flashcard', flashcards: 'list', matching: 'match', spelling: 'cloze' };
    const mappedMode = modeMap[currentMode] || currentMode;
    const forceVocabMode = (currentMode === 'smart_learn' || mappedMode === 'smart') ? null : mappedMode;
    window.S4VocabEngine.mount('s4VocabMount', currentLesson.id, getActiveVocabList(), cleanListenTitle(currentLesson.title), forceVocabMode);
  }
  saveCacheSafe('s4_listen_last_rendered_html', container.innerHTML, 120000);

  if (pType === 'listen_passage') {
    const slot = document.getElementById('audioSlot');
    const passAudio = document.getElementById('globalPassAudio');
    if (slot && passAudio) {
      if (currentLesson.problem?.audioUrl && passAudio.getAttribute('src') !== currentLesson.problem.audioUrl) {
        passAudio.src = currentLesson.problem.audioUrl;
      }
      passAudio.style.display = 'block';
      passAudio.controls = true;
      slot.appendChild(passAudio);
    }
  }
  const focusEl = document.getElementById('wordDicInput') || document.querySelector('.dic-input');
  if (focusEl) focusEl.focus();
  if (window.applyThemeState) window.applyThemeState();
}

updateTopProgress();
const urlParams = new URLSearchParams(window.location.search);
const reqId = (urlParams.get('id') || '').trim();
const reqUnit = (urlParams.get('unit') || '').trim();
const reqPz = urlParams.get('pz') === '1' || urlParams.get('mode') === 'pz';
const lastId = localStorage.getItem(LAST_KEY);
const defaultLesson = ALL_LESSONS.find(x => x.unitId === 'u_5') || ALL_LESSONS[0];
const initialLesson = (reqId && ALL_LESSONS.find(x => x.id === reqId))
  || (reqUnit && ALL_LESSONS.find(x => x.unitId === reqUnit))
  || ALL_LESSONS.find(x => x.id === lastId)
  || defaultLesson;

// Instant restore from cache if matches
let cachedLesson = null;
try {
  cachedLesson = JSON.parse(localStorage.getItem('s4_listen_last_lesson_cache') || 'null');
} catch(e) {}

if (cachedLesson && initialLesson && cachedLesson.id === initialLesson.id) {
  currentLesson = cachedLesson;
  applyListeningLessonPos(currentLesson);
  syncActiveUnitUI(currentLesson);
  const pType = currentLesson.problem ? currentLesson.problem.pType : 'video';
  if (pType === 'listen_passage') {
    const validSubs = (currentLesson.problem.subs || []).filter(s => s.en);
    passageMode = validSubs.length > 0 ? 'dictation' : 'transcript';
    if (currentLesson.problem.audioUrl) {
      const passAudio = document.getElementById('globalPassAudio');
      if (passAudio) passAudio.src = currentLesson.problem.audioUrl;
    }
  }
  renderSidebar();
  renderMain();
  scrollActiveLessonIntoView(false);
  ensureChunkLoaded(currentLesson.unitId, function() {
    const fresh = ALL_LESSONS.find(x => x.id === currentLesson.id);
    if (fresh) {
      const needReRender = (currentLesson.problem?.pType === 'dictation_words') || (!currentLesson.problem);
      currentLesson = fresh;
      applyListeningLessonPos(currentLesson);
      if (needReRender) renderMain();
    }
    renderSidebar();
    scrollActiveLessonIntoView(false);
  });
} else if (initialLesson) {
  selectLesson(initialLesson.id);
}

if (reqPz) {
  const openPzOnReady = () => {
    if (typeof activateListeningPzTab === 'function') activateListeningPzTab();
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', openPzOnReady);
  } else {
    setTimeout(openPzOnReady, 0);
  }
}

</script>
  <script src="../../assets/s4-practice-zone.js?v=67"></script>
  <script src="../../auth.js?v=33"></script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>

  <!-- MODAL LỊCH SỬ BÀI THI LISTENING TRÊN TOPBAR -->
  <div class="w-modal-backdrop" id="listeningHistoryModal" style="display:none;" onclick="if(event.target===this)window.S4PracticeZone.closeListeningHistoryModal()">
    <div class="w-history-modal-box">
      <div class="w-history-modal-head">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="lp-chip-inline" style="color:var(--primary);">${lIcon('history', 20)}</span>
          <div>
            <h3 style="margin:0;font-size:16px;font-weight:800;color:var(--text);">Lịch Sử Làm Bài IELTS Listening</h3>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted);">Danh sách các đề thi thử Listening bạn đã nộp và chấm điểm</p>
          </div>
        </div>
        <button type="button" class="lp-chip-inline" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;" aria-label="Đóng" onclick="window.S4PracticeZone.closeListeningHistoryModal()">${lIcon('close', 18)}</button>
      </div>

      <div class="w-history-filter-bar">
        <button type="button" class="w-filter-pill l-filter-pill active" id="lFilter_all" onclick="window.S4PracticeZone.filterListeningHistoryModal('all')">Tất cả đề</button>
        <button type="button" class="w-filter-pill l-filter-pill lp-chip-inline" id="lFilter_high" onclick="window.S4PracticeZone.filterListeningHistoryModal('high')">${lIcon('award', 13)} Band 7.0+ (Mục tiêu cao)</button>
        <button type="button" class="w-filter-pill l-filter-pill lp-chip-inline" id="lFilter_low" onclick="window.S4PracticeZone.filterListeningHistoryModal('low')">${lIcon('zap', 13)} Dưới Band 7.0 (Cần ôn lại)</button>
      </div>

      <div class="w-history-list modal-scroll" id="listeningModalHistoryList">
        <!-- Render động từ s4-practice-zone.js -->
      </div>
    </div>
  </div>

</body>
</html>
