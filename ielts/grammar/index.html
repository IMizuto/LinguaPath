  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);

        document.documentElement.style.setProperty("--s4-top-inset", "max(env(safe-area-inset-top, 0px), " + topPx + ")");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function() { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span class="lp-hide-xs">Ủng hộ</span>
          </button>
          <button type="button" class="lp-icon-btn" id="btnGrammarDark" data-lp-theme-toggle="1" title="Đổi giao diện Sáng/Tối" aria-label="Đổi giao diện Sáng/Tối"></button>
        </div>
      </header>
    </div>

      <div class="container lp-glass" id="lessonContent"></div>
    </div>
  </div>

  <script src="../../assets/s4-ui.js?v=67"></script>
  <script src="../../auth.js?v=33"></script>
  <script src="grammar_data.js"></script>
  <script>
    window.LINGUAPATH_GRAMMAR_DATA = window.STUDY4_GRAMMAR_DATA;
    (function () {
      var d = localStorage.getItem("s4_vocab_dark");
      var isDark = !(d === "0" || d === "false");
      document.documentElement.classList.toggle("dark", isDark);
      document.body.classList.toggle("dark", isDark);
    })();
    function svgIcon(name, size) {
      if (window.S4UI && typeof window.S4UI.icon === "function") return window.S4UI.icon(name, size || 15);
      return "";
    }
    function syncDarkBtn() {
      var btn = document.getElementById("btnGrammarDark");
      if (!btn) return;
      var isDark = document.documentElement.classList.contains("dark");
      if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
        window.S4UI.renderThemeButton(btn, isDark);
      } else {
        btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
      }
    }
    window.toggleDark = function() {
      if (window.toggleDarkModeOnly) {
        window.toggleDarkModeOnly();
      } else {
        const isDark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", isDark);
        document.body.classList.toggle("dark", isDark);
        localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0");
        const mt = document.getElementById("metaThemeColor");
        if (mt) mt.setAttribute("content", isDark ? "#0b1120" : "#eaf1fb");
      }
      syncDarkBtn();
    };
    const ITEMS = window.LINGUAPATH_GRAMMAR_DATA || window.STUDY4_GRAMMAR_DATA || [];
    const listEl = document.getElementById("lessonList");
    const contentEl = document.getElementById("lessonContent");
    const searchInput = document.getElementById("searchInput");
    const sidebarEl = document.getElementById("sidebar");
    let completedMap = JSON.parse(localStorage.getItem("s4_grammar_done") || "{}");
    let activeId = localStorage.getItem("s4_grammar_last") || ITEMS[0]?.id;
    if (!ITEMS.some(x => x.id === activeId)) activeId = ITEMS[0]?.id;
    let activeProbIdx = 0;
    let currentUnitFilter = "ALL";
    let openSections = new Set();

    // Mở sẵn mục chủ đề chứa bài học hiện tại
    const initLesson = ITEMS.find(x => x.id === activeId);
    if (initLesson) openSections.add(initLesson.unitTitle + "||" + initLesson.sectionName);

    window.toggleMenu = function(open) {
      if (window.S4UI && typeof window.S4UI.toggleSidebar === "function") {
        const opened = window.S4UI.toggleSidebar(typeof open === "boolean" ? open : undefined);
        const isMobile = window.innerWidth <= 1024;
        document.body.classList.toggle("sidebar-open", isMobile && opened);
        const mw = document.querySelector(".main-wrap");
        if (mw && "inert" in mw) mw.inert = isMobile && opened;
        return opened;
      }
      const isOpen = !!open && window.innerWidth <= 1024;
      sidebarEl.classList.toggle("open", isOpen);
      document.body.classList.toggle("sidebar-open", isOpen);
      const bd = document.getElementById("sidebarBackdrop");
      if (bd) bd.classList.toggle("open", isOpen);
      const mw = document.querySelector(".main-wrap");
      if (mw && "inert" in mw) mw.inert = isOpen;
      return isOpen;
    };
    if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
      window.S4UI.initSmartBackButton({
        element: "#lpBackBtn",
        defaultUrl: "../../index.html#ielts",
        defaultLabel: "IELTS",
        roadmapUrl: "../roadmap/index.html",
        roadmapLabel: "Lộ trình"
      });
    }
    const sbToggleBtn = document.getElementById("btnToggleSidebar");
    if (sbToggleBtn) sbToggleBtn.addEventListener("click", () => window.toggleMenu());
    const sbCloseBtn = document.getElementById("btnCloseSidebar");
    if (sbCloseBtn) sbCloseBtn.addEventListener("click", () => window.toggleMenu(false));
    const sbBackdrop = document.getElementById("sidebarBackdrop");
    if (sbBackdrop) sbBackdrop.addEventListener("click", () => window.toggleMenu(false));
    const donateBtn = document.getElementById("btnGrammarDonate");
    if (donateBtn) donateBtn.addEventListener("click", () => window.S4Auth && window.S4Auth.openDonateModal());
    const darkBtn = document.getElementById("btnGrammarDark");
    if (darkBtn) darkBtn.addEventListener("click", () => window.toggleDark());
    syncDarkBtn();
    if (typeof MutationObserver !== "undefined") {
      new MutationObserver(syncDarkBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) {
        window.toggleMenu(false);
      }
    });
    function syncGrammarDrawerViewport() {
      if (window.innerWidth > 1024 && (
        document.body.classList.contains("sidebar-open") ||
        sidebarEl.classList.contains("open") ||
        document.getElementById("sidebarBackdrop")?.classList.contains("open")
      )) {
        window.toggleMenu(false);
      }
    }
    window.addEventListener("resize", syncGrammarDrawerViewport);
    if (window.matchMedia) {
      const gMq = window.matchMedia("(min-width: 1025px)");
      if (gMq.addEventListener) gMq.addEventListener("change", (e) => { if (e.matches) window.toggleMenu(false); });
      else if (gMq.addListener) gMq.addListener((e) => { if (e.matches) window.toggleMenu(false); });
    }

    const UNIT_SHORT = {
      "[Grammar] Parts of speech - Từ loại": "1. Từ loại",
      "[Grammar] Tenses - Thì": "2. Các thì",
      "[Grammar] Clauses - Mệnh đề": "3. Mệnh đề",
      "[Grammar] in Writing - Văn viết": "4. Văn viết"
    };

    window.setUnitFilter = function(u) {
      currentUnitFilter = u;
      renderSidebar(searchInput.value);
    };

    window.toggleSection = function(secKey) {
      if (openSections.has(secKey)) openSections.delete(secKey);
      else openSections.add(secKey);
      renderSidebar(searchInput.value);
    };

    function renderUnitTabs() {
      const units = Array.from(new Set(ITEMS.map(x => x.unitTitle)));
      const tabsEl = document.getElementById("unitTabs");
      let html = `<button class="unit-tab ${currentUnitFilter === 'ALL' ? 'active' : ''}" onclick="setUnitFilter('ALL')">Tất cả</button>`;
      units.forEach(u => {
        const label = UNIT_SHORT[u] || u.replace("[Grammar] ", "");
        html += `<button class="unit-tab ${currentUnitFilter === u ? 'active' : ''}" onclick="setUnitFilter('${u.replace(/'/g, "\\'")}')">${label}</button>`;
      });
      tabsEl.innerHTML = html;
    }

    function renderSidebar(filterText = "") {
      renderUnitTabs();
      const q = filterText.toLowerCase().trim();
      listEl.innerHTML = "";

      // Gom bài học theo: Chương (unitTitle) -> Mục chủ đề (sectionName)
      const unitMap = new Map();
      ITEMS.forEach(l => {
        if (currentUnitFilter !== "ALL" && l.unitTitle !== currentUnitFilter) return;
        const noteTxt = q && l.notesHtml ? l.notesHtml.replace(/<[^>]+>/g, " ") : "";
        const match = !q || ((window.S4UI && typeof window.S4UI.matchesSearch === "function")
          ? window.S4UI.matchesSearch(l.title + " " + l.sectionName + " " + noteTxt, q)
          : (l.title.toLowerCase().includes(q) || l.sectionName.toLowerCase().includes(q) || noteTxt.toLowerCase().includes(q)));
        if (!match) return;
        if (!unitMap.has(l.unitTitle)) unitMap.set(l.unitTitle, new Map());
        const secMap = unitMap.get(l.unitTitle);
        if (!secMap.has(l.sectionName)) secMap.set(l.sectionName, []);
        secMap.get(l.sectionName).push(l);
      });

      unitMap.forEach((secMap, uTitle) => {
        const gDiv = document.createElement("div");
        gDiv.className = "unit-group";
        let unitTotal = 0, unitDone = 0;
        secMap.forEach(arr => {
          unitTotal += arr.length;
          unitDone += arr.filter(x => completedMap[x.id]).length;
        });

        gDiv.innerHTML = `<div class="unit-title"><span>${uTitle.replace("[Grammar] ", "")}</span><span>${unitDone}/${unitTotal}</span></div>`;

        let secIndex = 0;
        secMap.forEach((lessons, secName) => {
          secIndex++;
          const secKey = uTitle + "||" + secName;
          const isOpen = !!q || openSections.has(secKey);
          const doneCount = lessons.filter(x => completedMap[x.id]).length;

          const secDiv = document.createElement("div");
          secDiv.className = "sec-group" + (isOpen ? " open" : "");

          const header = document.createElement("div");
          header.className = "sec-header";
          header.onclick = () => toggleSection(secKey);
          header.innerHTML = `
            <span style="line-height:1.35;">${secIndex}. ${secName}</span>
            <span class="sec-meta">
              <span style="${doneCount === lessons.length ? 'color:var(--lg-green);font-weight:800;' : ''}">${doneCount}/${lessons.length}</span>
              ${svgIcon(isOpen ? "chevronDown" : "chevronRight", 13)}
            </span>
          `;
          secDiv.appendChild(header);

          const itemsWrap = document.createElement("div");
          itemsWrap.className = "sec-items";
          lessons.forEach(l => {
            const item = document.createElement("div");
            item.className = "lesson-item" + (l.id === activeId ? " active" : "");
            const iconSvg = svgIcon(l.isPractice ? "edit" : "play", 13);
            const doneMark = completedMap[l.id] ? '<span class="done-dot">' + svgIcon("check", 14) + '</span>' : '';
            item.innerHTML = `<span class="lesson-item-title">${iconSvg}<span>Bài ${l.index}: ${l.title}</span></span>${doneMark}`;
            item.onclick = () => { selectItem(l.id); toggleMenu(false); };
            itemsWrap.appendChild(item);
          });
          secDiv.appendChild(itemsWrap);
          gDiv.appendChild(secDiv);
        });

        listEl.appendChild(gDiv);
      });

      if (unitMap.size === 0) {
        const safeQ = window.S4UI ? window.S4UI.escapeHtml(q) : q;
        listEl.innerHTML = `<div class="s4-empty-state" style="margin-top:8px;padding:24px 12px;">
          <div style="color:var(--lg-ink-muted);">${svgIcon("search", 26)}</div>
          <div style="font-size:13.5px;font-weight:800;color:var(--text);">Không tìm thấy chủ điểm phù hợp</div>
          ${q ? `<div style="font-size:12px;">Từ khóa "<strong>${safeQ}</strong>" không khớp bài nào.</div>` : ""}
          <button type="button" class="s4-pz-clear-chip" onclick="window.clearGrammarSearch()">${svgIcon("close", 12)} <span>Xóa tìm kiếm</span></button>
        </div>`;
      }
    }

    function renderDoneBtnHtml(isDone) {
      return isDone
        ? (svgIcon("check", 14) + '<span>Đã hoàn thành</span>')
        : (svgIcon("target", 14) + '<span>Đánh dấu Đã học</span>');
    }

    window.toggleDone = function(id) {
      completedMap[id] = !completedMap[id];
      if (!completedMap[id]) delete completedMap[id];
      localStorage.setItem("s4_grammar_done", JSON.stringify(completedMap));
      const gKey = "g_" + id;
      if (completedMap[id]) {
        try {
          const now = new Date();
          const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
          const days = JSON.parse(localStorage.getItem("s4_vocab_days_v2") || "{}");
          const arr = Array.isArray(days[today]) ? days[today] : [];
          if (!arr.includes(gKey)) arr.push(gKey);
          days[today] = arr;
          localStorage.setItem("s4_vocab_days_v2", JSON.stringify(days));
        } catch (e) {}
      } else {
        try {
          const days = JSON.parse(localStorage.getItem("s4_vocab_days_v2") || "{}");
          let changed = false;
          Object.keys(days).forEach((dateKey) => {
            if (Array.isArray(days[dateKey]) && days[dateKey].includes(gKey)) {
              days[dateKey] = days[dateKey].filter((x) => x !== gKey);
              if (days[dateKey].length === 0) delete days[dateKey];
              changed = true;
            }
          });
          if (changed) localStorage.setItem("s4_vocab_days_v2", JSON.stringify(days));
        } catch (e) {}
      }
      renderSidebar(searchInput.value);
      if (id === activeId) {
        const isDone = !!completedMap[id];
        ["btnToggleDone", "btnFooterDone"].forEach(btnId => {
          const b = document.getElementById(btnId);
          if (b) {
            b.classList.toggle("completed", isDone);
            b.innerHTML = renderDoneBtnHtml(isDone);
          }
        });
      }
    };

    
window.S4FormatTheoryHtml = function(rawHtml) {
  if (!rawHtml || typeof rawHtml !== 'string') return '';
  let html = rawHtml;

  // 1. Remove empty spacer paragraphs (<p>&nbsp;</p>, <p><span>&nbsp;</span></p>, etc.)
  html = html.replace(/<p\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>|<(?:span|strong|em|u)\b[^>]*>(?:\s|&nbsp;|\u00a0|<br\s*\/?>)*<\/(?:span|strong|em|u)>)*<\/p>/gi, '');

  // 2. Convert Google Docs single-item <ol><li style="list-style-type:upper-roman|decimal"><h1|h2>...</h1|h2></li></ol> into structured section headers
  const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  html = html.replace(/<ol(?:\s+start="(\d+)")?\s*>\s*<li\b([^>]*)>\s*<(h[1-3])\b[^>]*>([\s\S]*?)<\/\3>\s*<\/li>\s*<\/ol>/gi, function(m, startNum, liAttr, hTag, inner) {
    const idx = startNum ? Math.max(1, parseInt(startNum, 10)) : 1;
    const isRoman = /upper-roman/i.test(liAttr);
    const isAlpha = /upper-alpha/i.test(liAttr);
    const badge = isRoman ? (ROMAN[idx - 1] || idx) : (isAlpha ? String.fromCharCode(64 + idx) : String(idx));
    const isSub = hTag.toLowerCase() !== 'h1' && !isRoman;
    const cleanInner = inner.replace(/&nbsp;/gi, ' ').trim();
    if (isSub) {
      return '<div class="s4-subsec-heading"><span class="s4-subsec-badge">' + badge + '</span><span class="s4-subsec-title">' + cleanInner + '</span></div>';
    }
    return '<div class="s4-sec-heading"><span class="s4-sec-badge">' + badge + '</span><span class="s4-sec-title">' + cleanInner + '</span></div>';
  });

  // 3. Convert Google Docs fake bullet paragraphs <p style="...list-style-type:disc...">...</p>
  html = html.replace(/<p\b([^>]*style\s*=\s*"[^"]*list-style-type\s*:\s*disc[^"]*"[^>]*)>([\s\S]*?)<\/p>/gi, '<p class="s4-pseudo-li">$2</p>');

  // 4. Process all tags with a style="..." attribute
  html = html.replace(/<([a-zA-Z0-9]+)\b([^>]*?)\sstyle\s*=\s*"([^"]*)"([^>]*)>/gi, function(full, tag, before, styleStr, after) {
    const t = tag.toLowerCase();
    const classes = [];
    let s = styleStr;

    // Highlight background colors -> soft pastel badge classes
    if (/background(?:-color)?\s*:\s*#ffff00\b/i.test(s)) {
      classes.push('s4-hl-amber');
      s = s.replace(/background(?:-color)?\s*:\s*#ffff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ffff\b/i.test(s)) {
      classes.push('s4-hl-sky');
      s = s.replace(/background(?:-color)?\s*:\s*#00ffff\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#00ff00\b/i.test(s)) {
      classes.push('s4-hl-emerald');
      s = s.replace(/background(?:-color)?\s*:\s*#00ff00\s*;?/gi, '');
    }
    if (/background(?:-color)?\s*:\s*#ff9900\b/i.test(s)) {
      classes.push('s4-hl-rose');
      s = s.replace(/background(?:-color)?\s*:\s*#ff9900\s*;?/gi, '');
    }

    // Table header / accent cell backgrounds (#9fc5e8, #a4c2f4)
    if (/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\b/i.test(s)) {
      classes.push('s4-td-accent');
      s = s.replace(/background(?:-color)?\s*:\s*#(?:9fc5e8|a4c2f4)\s*;?/gi, '');
    }

    // Strip white / light gray / transparent backgrounds that break Dark Mode
    s = s.replace(/background(?:-color)?\s*:\s*(?:#ffffff|#fff|#f1f3f5|white|transparent)\s*;?/gi, '');

    // Foreground text colors
    if (/(?:^|[;\s])color\s*:\s*#ff0000\b/i.test(s)) {
      classes.push('s4-txt-red');
      s = s.replace(/(?:^|[;\s])color\s*:\s*#ff0000\s*;?/gi, '');
    }
    if (/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))/i.test(s)) {
      classes.push('s4-txt-blue');
      s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#1155cc|#0000ff|#6d9eeb|rgb\(\s*53\s*,\s*80\s*,\s*154\s*\))\s*;?/gi, '');
    }
    // Strip hardcoded dark/black text colors
    s = s.replace(/(?:^|[;\s])color\s*:\s*(?:#000000|#000|black|#1a1a1a|#242938)\s*;?/gi, '');

    // Clean up table, td, th, img, span fixed pixel dimensions & borders
    if (t === 'table' || t === 'td' || t === 'th' || t === 'img' || t === 'span') {
      s = s.replace(/\b(?:width|height)\s*:\s*[\d.]+px\s*;?/gi, '');
      s = s.replace(/\btable-layout\s*:\s*fixed\s*;?/gi, '');
      s = s.replace(/\bborder(?:-(?:top|bottom|left|right))?\s*:\s*[\d.]+px\s+solid\s+#[0-9a-fA-F]+\s*;?/gi, '');
      s = s.replace(/\boverflow\s*:\s*hidden\s*;?/gi, '');
    }

    // Soften excessive Google Docs left margins and remove justify alignment
    s = s.replace(/\btext-align\s*:\s*justify\s*;?/gi, '');
    s = s.replace(/\bmargin-left\s*:\s*(\d+)px\s*;?/gi, function(_, px) {
      const n = parseInt(px, 10);
      if (n >= 120) return 'margin-left:28px;';
      if (n >= 70) return 'margin-left:20px;';
      if (n >= 36) return 'margin-left:12px;';
      return '';
    });

    s = s.replace(/;\s*;/g, ';').trim().replace(/^;+|;+$/g, '').trim();

    let combinedBeforeAfter = before + after;
    if (classes.length > 0) {
      if (/\bclass\s*=\s*"([^"]*)"/i.test(combinedBeforeAfter)) {
        combinedBeforeAfter = combinedBeforeAfter.replace(/\bclass\s*=\s*"([^"]*)"/i, function(_, existing) {
          return 'class="' + (existing + ' ' + classes.join(' ')).trim() + '"';
        });
      } else {
        combinedBeforeAfter = ' class="' + classes.join(' ') + '"' + combinedBeforeAfter;
      }
    }

    const styleAttr = s ? ' style="' + s + '"' : '';
    return '<' + tag + combinedBeforeAfter + styleAttr + '>';
  });

  // 5. Move leading/trailing spaces outside highlight pills so borders hug the words cleanly
  html = html.replace(/<span\s+class="(s4-hl-[a-z0-9\s-]+)">(\s*)([\s\S]*?)(\s*)<\/span>/gi, function(m, cls, lead, inner, trail) {
    if (!inner.trim()) return lead + trail;
    return (lead || '') + '<span class="' + cls + '">' + inner + '</span>' + (trail || '');
  });

  // 6. Merge accidentally split paragraph lines right before "⇒ Paragraph X" (e.g. Question 18 in L15)
  html = html.replace(/<p>([\s\S]*?,)<\/p>\s*<p>(\s*(?:<span[^>]*>)*\s*[a-z][\s\S]*?)<\/p>(?=\s*<p[^>]*>\s*(?:<[^>]+>)*\s*(?:⇒|→|=>)\s*Paragraph)/gi, '<p>$1 $2</p>');

  // 7. Classify <p> blocks into Step Callouts, Question Cards, Passage Excerpts, Answer Pills, and Note Callouts
  html = html.replace(/<p(\b[^>]*)>([\s\S]*?)<\/p>/gi, function(full, pAttr, inner) {
    if (/s4-pseudo-li/i.test(pAttr)) return full;
    const plain = inner.replace(/<[^>]+>/g, '').replace(/&nbsp;|\u00a0/g, ' ').replace(/&rarr;/g, '→').replace(/\s+/g, ' ').trim();
    if (!plain) return full;

    // 7a. Step Callout: "Bước 1: ...", "Bước 3 + Bước 4 + Bước 5"
    if (/^Bước\s*\d+/i.test(plain) && plain.length < 160) {
      return '<div class="s4-step-callout"><span class="s4-step-icon">' + svgIcon("sparkle", 15) + '</span><div class="s4-step-body">' + inner + '</div></div>';
    }

    // 7b. Question Card: "Question 14: ...", "Practice 1: ..."
    if (/^(?:Question\s*\d+|Practice\s*\d+)\s*[:.]/i.test(plain)) {
      const decorated = inner.replace(/(?:<u>\s*)?(Question\s*\d+|Practice\s*\d+)\s*:?\s*(?:<\/u>)?(?:\s*<\/span>\s*<span[^>]*>)?\s*[:.]?\s*/i, '<span class="s4-q-badge">$1</span> ');
      return '<div class="s4-question-card">' + decorated + '</div>';
    }

    // 7c. Passage Excerpt: starts with "A. ", "B. ", ..., "I. " and is a passage paragraph (> 60 chars)
    if (/^[A-I]\.\s+/.test(plain) && plain.length > 60) {
      const decorated = inner.replace(/^(\s*(?:<[^>]+>\s*)*)([A-I])\.?(\s*(?:<\/[^>]+>\s*)*)/, '$1<span class="s4-para-badge">Đoạn $2</span>$3 ');
      return '<div class="s4-passage-excerpt">' + decorated + '</div>';
    }

    // 7d. Answer Pill or Conclusion Box: starts with "→", "⇒", "=>", or "Đáp án:"
    if (/^(?:→|⇒|=>)\s*/i.test(plain) || /^Đáp án\s*:/i.test(plain)) {
      const isShortAnswer = /^(?:→|⇒|=>)\s*(?:Paragraph\s+[A-Z]|Đáp án|Key|Answer|Main topic)/i.test(plain) || /^Đáp án\s*:/i.test(plain) || plain.length < 75;
      if (isShortAnswer) {
        return '<div class="s4-answer-wrap"><div class="s4-answer-pill">' + svgIcon("target", 14) + ' ' + inner.replace(/^(\s*(?:<[^>]+>\s*)*)(?:→|⇒|=>)\s*/, '$1') + '</div></div>';
      }
      return '<div class="s4-conclusion-box">' + inner + '</div>';
    }

    // 7e. Note Callout: starts with "Lưu ý:", "Chú ý:"
    if (/^(?:Lưu ý|Chú ý|Mẹo)\s*:/i.test(plain)) {
      return '<div class="s4-note-callout">' + svgIcon("lightbulb", 15) + ' ' + inner + '</div>';
    }

    return full;
  });

  return html;
};

function selectItem(id, resetScroll = true) {
      const curLesson = ITEMS.find(x => x.id === id) || ITEMS[0];
      if (curLesson) id = curLesson.id;
      activeId = id;
      activeProbIdx = 0;
      localStorage.setItem("s4_grammar_last", id);
      if (curLesson) {
        openSections.clear();
        openSections.add(curLesson.unitTitle + "||" + curLesson.sectionName);
      }
      renderSidebar(searchInput.value);
      setTimeout(() => {
        const act = listEl.querySelector(".lesson-item.active");
        if (act) { try { act.scrollIntoView({ block: "center", behavior: "auto" }); } catch (e) {} }
      }, 50);
      const idx = ITEMS.findIndex(x => x.id === id);
      const l = ITEMS[idx];
      if (!l) return;

      document.getElementById("mobileTitle").textContent = "Bài " + l.index + ": " + l.title;

      let videoHtml = "";
      if (l.youtubeEmbedId) {
        videoHtml = '<div class="video-box"><iframe src="https://www.youtube-nocookie.com/embed/' + l.youtubeEmbedId + '?rel=0" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen></iframe></div>';
      }

      const isDone = !!completedMap[l.id];
      let btnsHtml = '<button id="btnToggleDone" class="btn btn-done ' + (isDone ? 'completed' : '') + '" onclick="toggleDone(\'' + l.id + '\')">' + renderDoneBtnHtml(isDone) + '</button>';
      if (l.localPdfPath) {
        btnsHtml += '<button class="btn btn-pdf" id="btnTogglePdf" onclick="togglePdf()">' + svgIcon("layers", 14) + '<span>Xem Slide PDF</span></button>';
        btnsHtml += '<a class="btn btn-pdf" style="background:#0284c7;" href="' + l.localPdfPath + '" target="_blank" title="Mở slide trong tab mới toàn màn hình">' + svgIcon("external", 14) + '<span>Mở tab mới</span></a>';
        btnsHtml += '<a class="btn btn-pdf" style="background:#475569;" href="' + l.localPdfPath + '" download title="Lưu slide về máy">' + svgIcon("download", 14) + '<span>Tải PDF</span></a>';
      }
      if (l.videoUrl) {
        btnsHtml += '<a class="btn btn-yt" href="' + l.videoUrl + '" target="_blank">' + svgIcon("play", 14) + '<span>Mở YouTube</span></a>';
      }

      let practiceHtml = "";
      if (l.questions && l.questions.length > 0) {
        practiceHtml = '<div id="practiceContainer"></div>';
      }

      const prevItem = idx > 0 ? ITEMS[idx - 1] : null;
      const nextItem = idx < ITEMS.length - 1 ? ITEMS[idx + 1] : null;

      contentEl.innerHTML = `
        <div class="badge">${l.unitTitle} &rsaquo; ${l.sectionName}</div>
        <h1 style="margin:4px 0 12px 0;font-size:22px;line-height:1.35;">Bài ${l.index}: ${l.title}</h1>
        ${videoHtml}
        <div class="resources-bar">${btnsHtml}</div>
        ${l.localPdfPath ? `
        <div id="pdfWrapper" class="pdf-wrapper" style="display:none;margin-top:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--lg-wash);padding:8px 12px;border:1px solid var(--lg-hairline);border-bottom:none;border-radius:14px 14px 0 0;font-size:12.5px;font-weight:700;">
            <span style="display:inline-flex;align-items:center;gap:6px;">${svgIcon("layers", 14)}<span>Slide bài giảng PDF</span></span>
            <a href="${l.localPdfPath}" target="_blank" class="btn btn-pdf pdf-hdr-ext" style="padding:4px 10px;font-size:11.5px;text-decoration:none;" title="Mở slide trong tab mới để phóng to">${svgIcon("external", 12)}<span>Mở tab mới</span></a>
          </div>
          <iframe id="pdfFrame" class="pdf-preview" data-src="${l.localPdfPath}" title="Slide bài giảng PDF"></iframe>
          <div id="pdfMobileFallback" class="pdf-mobile-fallback">
            <div style="color:var(--lg-ink-muted);display:flex;align-items:flex-start;gap:7px;">${svgIcon("smartphone", 16)}<span>Trình duyệt di động không hỗ trợ xem PDF nhúng trực tiếp. Vui lòng mở tab mới hoặc tải về máy:</span></div>
            <div class="pdf-mobile-actions">
              <a href="${l.localPdfPath}" target="_blank" rel="noopener" class="btn btn-pdf">${svgIcon("external", 14)}<span>Mở Slide PDF</span></a>
              <a href="${l.localPdfPath}" download class="btn btn-done">${svgIcon("download", 14)}<span>Tải Slide PDF</span></a>
            </div>
          </div>
        </div>
        ` : ''}
        ${practiceHtml}
        ${l.notesHtml ? '<div class="notes-area">' + window.S4FormatTheoryHtml(l.notesHtml) + '</div>' : ''}
        <div class="nav-footer lp-lesson-nav">
          ${prevItem ? '<button type="button" class="btn btn-done" onclick="selectItem(\'' + prevItem.id + '\')">' + svgIcon("arrowLeft", 14) + '<span>Bài trước</span></button>' : '<div></div>'}
          <button type="button" id="btnFooterDone" class="btn btn-done ${isDone ? 'completed' : ''}" onclick="toggleDone('${l.id}')">${renderDoneBtnHtml(isDone)}</button>
          ${nextItem ? '<button type="button" class="btn btn-pdf" onclick="selectItem(\'' + nextItem.id + '\')"><span>Bài tiếp</span>' + svgIcon("arrowRight", 14) + '</button>' : '<div></div>'}
        </div>
      `;

      if (l.questions && l.questions.length > 0) {
        renderPracticeQuestion(l);
      }
      if (resetScroll) document.getElementById("mainScroll").scrollTop = 0;
    }

    window.switchProb = function(idx) {
      activeProbIdx = idx;
      const l = ITEMS.find(x => x.id === activeId);
      if (l) renderPracticeQuestion(l);
    };

    function renderPracticeQuestion(lesson) {
      const box = document.getElementById("practiceContainer");
      if (!box) return;
      const q = lesson.questions[activeProbIdx];
      if (!q) return;

      let tabsHtml = "";
      if (lesson.questions.length > 1) {
        tabsHtml = '<div class="prob-tabs">' + lesson.questions.map((p, i) =>
          '<button class="prob-tab ' + (i === activeProbIdx ? 'active' : '') + '" onclick="switchProb(' + i + ')">Phần ' + (i + 1) + '</button>'
        ).join("") + '</div>';
      }

      const hasExplanation = /g-problem-explanation-wrapper|gproblemexplanation/i.test(q.bodyHtml || "");

      box.innerHTML = `
        <div class="practice-card">
          <div class="practice-header">
            <div style="font-weight:800;font-size:15.5px;color:var(--primary);display:inline-flex;align-items:center;gap:7px;">${svgIcon("edit", 16)}<span>Bài tập thực hành (${activeProbIdx + 1}/${lesson.questions.length})</span></div>
            ${tabsHtml}
          </div>
          <div class="prob-controls">
            <button class="btn btn-check" onclick="checkPracticeAnswers()">${svgIcon("check", 14)}<span>Kiểm tra đáp án</span></button>
            <button class="btn btn-show" onclick="showPracticeAnswers()">${svgIcon("lightbulb", 14)}<span>${hasExplanation ? "Hiện đáp án & Giải thích" : "Hiện đáp án chuẩn"}</span></button>
            <button class="btn btn-clear" onclick="clearPracticeAnswers()">${svgIcon("refresh", 14)}<span>Làm lại</span></button>
          </div>
          <div id="scoreBanner" class="score-banner"></div>
          <div class="practice-body" id="practiceBody">${window.S4FormatTheoryHtml(q.bodyHtml)}</div>
        </div>
      `;

      const body = document.getElementById("practiceBody");
      // 1. Chuyển đổi các thẻ <span class="vocab-error" data-error="sai">đúng</span> của dạng bài Sửa lỗi sai thành ô nhập tương tác!
      body.querySelectorAll("span.vocab-error").forEach(span => {
        const wrongText = span.getAttribute("data-error") || "";
        const correctText = span.textContent.trim();
        const wrapper = document.createElement("span");
        wrapper.innerHTML = `<del style="color:#dc2626;font-weight:600;margin-right:4px;">${wrongText}</del><input type="text" class="vocab-input" data-answer="${correctText.replace(/"/g, '&quot;')}" placeholder="Sửa lại..." style="width:${Math.max(110, correctText.length * 10)}px;">`;
        span.replaceWith(wrapper);
      });

      // 2. Kích hoạt nút bấm "Giải thích chi tiết đáp án" (vốn dùng Bootstrap collapse trên web gốc)
      body.querySelectorAll('.g-problem-explanation-wrapper a[data-toggle="collapse"]').forEach(a => {
        a.onclick = (ev) => {
          ev.preventDefault();
          const target = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
          if (target) {
            const opened = target.classList.toggle("show");
            if (opened) {
              try { target.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
            }
          }
        };
      });
      // 3. Nhấn Enter trong ô điền từ bất kỳ để kiểm tra tức thì ô đó và hiện thông báo Đúng/Sai
      body.querySelectorAll("input[data-answer], select[data-answer]").forEach(el => {
        if (el.tagName === "SELECT") {
          const emptyOpt = Array.from(el.options || []).find(opt => opt.value === "" && !String(opt.textContent || "").trim());
          if (emptyOpt) {
            emptyOpt.value = "";
            emptyOpt.textContent = "-- Chọn --";
          }
        }
        el.addEventListener("focus", () => {
          setTimeout(() => {
            try { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); } catch (e) {}
          }, 150);
        });
        el.addEventListener("input", () => {
          el.classList.remove("ans-correct", "ans-wrong");
          const next = el.nextElementSibling;
          if (next && next.classList.contains("ans-hint")) next.remove();
        });
        el.addEventListener("keydown", ev => {
          if (ev.key === "Enter") {
            ev.preventDefault();
            checkSingleField(el, true);
          }
        });
        el.addEventListener("change", () => {
          if (el.tagName === "SELECT" && el.value) checkSingleField(el, true);
        });
      });
    }

    let gToastTimer = null;
    function showGrammarToast(isGood, textMsg, durationMs) {
      const safeText = String(textMsg == null ? "" : textMsg);
      if (window.S4UI && typeof window.S4UI.toast === "function") {
        window.S4UI.toast({
          type: isGood ? "success" : "warn",
          message: safeText,
          duration: durationMs || 2200
        });
        return;
      }
      let t = document.getElementById("s4GrammarToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4GrammarToast";
        document.body.appendChild(t);
      }
      if (gToastTimer) clearTimeout(gToastTimer);
      t.className = "s4-g-toast " + (isGood ? "good" : "warn");
      t.textContent = safeText;
      requestAnimationFrame(() => t.classList.add("show"));
      gToastTimer = setTimeout(() => {
        t.classList.remove("show");
      }, durationMs || 2200);
    }

    function normalizeAns(str) {
      return (str || "").trim().replace(/\s+/g, " ").replace(/[.?!]+$/, "").toLowerCase();
    }

    function checkSingleField(el, notifyToast) {
      const next = el.nextElementSibling;
      if (next && next.classList.contains("ans-hint")) next.remove();
      const rawAns = (el.getAttribute("data-answer") || "").trim();
      const userVal = (el.value || "").trim();
      el.classList.remove("ans-correct", "ans-wrong");

      const validAnswers = rawAns.split(/\s*[/|]\s*/).map(normalizeAns);
      const normUser = normalizeAns(userVal);
      const isRight = normUser !== "" && (normUser === normalizeAns(rawAns) || validAnswers.includes(normUser));

      if (isRight) {
        el.classList.add("ans-correct");
        if (notifyToast) showGrammarToast(true, "✓ Chính xác", 1000);
      } else {
        el.classList.add("ans-wrong");
        const hint = document.createElement("span");
        hint.className = "ans-hint";
        hint.textContent = "✓ " + rawAns;
        el.insertAdjacentElement("afterend", hint);
        if (notifyToast) showGrammarToast(false, "✗ Đáp án: " + rawAns, 1600);
      }
      return isRight;
    }

    window.checkPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());

      let total = 0, correct = 0;
      const fields = body.querySelectorAll("[data-answer]");

      fields.forEach(el => {
        total++;
        if (checkSingleField(el, false)) correct++;
      });

      // Tự động mở khung Giải thích chi tiết (nếu có) sau khi bấm Kiểm tra
      const expCollapse = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
      if (expCollapse) expCollapse.classList.add("show");

      const banner = document.getElementById("scoreBanner");
      if (banner && total > 0) {
        banner.style.display = "block";
        const pct = Math.round((correct / total) * 100);
        const isGood = pct >= 80;
        banner.style.background = isGood ? "#dcfce7" : "#fee2e2";
        banner.style.color = isGood ? "#15803d" : "#b91c1c";
        const curLesson = ITEMS.find(x => x.id === activeId);
        if (isGood && curLesson && !completedMap[curLesson.id]) {
          toggleDone(curLesson.id);
          banner.textContent = `Xuất sắc! Đúng ${correct}/${total} câu (${pct}%) — Đã tự động hoàn thành bài học!`;
          showGrammarToast(true, `Đạt ${pct}% — Đã tự động hoàn thành bài học!`, 2200);
        } else {
          banner.textContent = `Đúng ${correct}/${total} câu (${pct}%)`;
          showGrammarToast(isGood, `Đúng ${correct}/${total} câu (${pct}%)`, 1800);
        }
      }
    };

    window.showPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());

      const fields = body.querySelectorAll("[data-answer]");
      fields.forEach(el => {
        const rawAns = el.getAttribute("data-answer") || "";
        if (el.tagName === "SELECT") {
          const opts = Array.from(el.options);
          const matchOpt = opts.find(o => o.value.trim().toLowerCase() === rawAns.trim().toLowerCase() || o.textContent.trim().toLowerCase() === rawAns.trim().toLowerCase());
          if (matchOpt) el.value = matchOpt.value;
        } else {
          el.value = rawAns.trim();
        }
        el.classList.remove("ans-wrong");
        el.classList.add("ans-correct");
      });

      const expCollapse = body.querySelector("#gproblemexplanation, .g-problem-explanation-wrapper .collapse");
      if (expCollapse) expCollapse.classList.add("show");

      const banner = document.getElementById("scoreBanner");
      const msg = expCollapse
        ? `Đã điền đáp án chuẩn (${fields.length} câu) và mở Giải thích chi tiết bên dưới!`
        : `Đã điền đáp án chuẩn cho toàn bộ ${fields.length} câu.`;
      if (banner) {
        banner.style.display = "block";
        banner.style.background = "#e0f2fe";
        banner.style.color = "#0369a1";
        banner.textContent = msg;
      }
      if (typeof showGrammarToast === "function") {
        showGrammarToast(true, expCollapse ? "Đã hiện đáp án & giải thích" : "Đã điền đáp án chuẩn", 1800);
      }
    };

    window.clearPracticeAnswers = function() {
      const body = document.getElementById("practiceBody");
      if (!body) return;
      body.querySelectorAll(".ans-hint").forEach(e => e.remove());
      body.querySelectorAll("[data-answer]").forEach(el => {
        el.value = "";
        el.classList.remove("ans-correct", "ans-wrong");
      });
      const banner = document.getElementById("scoreBanner");
      if (banner) banner.style.display = "none";
    };

    window.togglePdf = function() {
      const wrap = document.getElementById("pdfWrapper");
      const frame = document.getElementById("pdfFrame");
      const btn = document.getElementById("btnTogglePdf");
      if (!wrap || !frame) return;
      const isHidden = (wrap.style.display === "none" || !wrap.style.display);
      if (isHidden) {
        wrap.style.display = "block";
        const isMobileFrameHidden = window.innerWidth <= 1024 || window.getComputedStyle(frame).display === "none" || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
        if (!isMobileFrameHidden && (!frame.src || frame.src === "about:blank" || frame.src === window.location.href)) {
          const ds = frame.getAttribute("data-src");
          if (ds) frame.src = ds;
        }
        if (btn) btn.innerHTML = svgIcon("layers", 14) + "<span>Ẩn Slide PDF</span>";
        try { wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e) {}
      } else {
        wrap.style.display = "none";
        if (btn) btn.innerHTML = svgIcon("layers", 14) + "<span>Xem Slide PDF</span>";
      }
    };

    let grammarSearchTimer = null;
    window.clearGrammarSearch = function () {
      searchInput.value = "";
      if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(searchInput);
      try { searchInput.focus({ preventScroll: true }); } catch (e) {}
      renderSidebar("");
    };
    if (window.S4UI && typeof window.S4UI.bindSearchBar === "function") {
      window.S4UI.bindSearchBar({
        input: searchInput,
        clearBtn: "searchInput_clear",
        searchBtn: "searchInput_btn",
        delay: 180,
        onSearch: (val) => { clearTimeout(grammarSearchTimer); renderSidebar(val); }
      });
    } else {
      searchInput.oninput = () => {
        clearTimeout(grammarSearchTimer);
        grammarSearchTimer = setTimeout(() => renderSidebar(searchInput.value), 180);
      };
    }
    let initialGrammarQ = "";
    try {
      const sp = new URLSearchParams(window.location.search);
      const reqId = (sp.get("id") || "").trim();
      if (reqId) {
        const found = ITEMS.find(x => x.id === reqId);
        if (found) {
          activeId = found.id;
          try { localStorage.setItem("s4_grammar_last", found.id); } catch (e) {}
          openSections.add(found.unitTitle + "||" + found.sectionName);
        }
      }
      const reqQ = (sp.get("q") || "").trim();
      if (reqQ) {
        initialGrammarQ = reqQ;
        searchInput.value = reqQ;
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(searchInput);
      }
    } catch (e) {}
    renderSidebar(initialGrammarQ);
    if (activeId) selectItem(activeId);
  </script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
