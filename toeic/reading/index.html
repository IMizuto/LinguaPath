        var isPortrait = window.innerHeight >= window.innerWidth;

      animation: timerPulse 1.1s ease-in-out infinite;
    }
    .cbt-timer-pill.is-danger svg { color: var(--err); }
    .cbt-timer-pill.is-free {
      background: var(--teal-soft);
      border-color: rgba(13, 148, 136, 0.36);
      color: var(--teal);
    }
    .cbt-timer-pill.is-free svg { color: var(--teal); }
    @keyframes timerPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.16); }
      50% { box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.18); }
    }

    .hl-clear-btn {
      display: none;
      background: var(--hl-bg);
      color: var(--lg-ink);
      border-color: var(--hl-border);
    }
    .hl-clear-btn.has-hl { display: inline-flex; }

    /* Mobile 3-mode Switcher */
    .cbt-mob-switcher {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border-radius: 12px;
      background: var(--lg-seg-track);
      border: 1px solid var(--lg-divider);
    }
    .cbt-mob-tab {
      border: none;
      background: transparent;
      color: var(--lg-ink-sub);
      font-size: 11.8px;
      font-weight: 800;
      padding: 6px 4px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .cbt-mob-tab.active {
      background: var(--lg-accent);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
    }

    /* ---------------- CBT SPLIT-SCREEN BODY ---------------- */
    .cbt-split {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }
    .cbt-left {
      flex: 0 0 var(--cbt-left-pct, 52%);
      width: var(--cbt-left-pct, 52%);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
    }
    .cbt-right {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
    }

    /* Resizer Handle */
    .split-resizer {
      width: 11px;
      flex: 0 0 11px;
      cursor: col-resize;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lg-wash);
      border-left: 1px solid var(--lg-divider);
      border-right: 1px solid var(--lg-divider);
      user-select: none;
      touch-action: none;
      z-index: 5;
      transition: background 0.15s ease;
    }
    .split-resizer::before {
      content: "";
      width: 3px;
      height: 44px;
      border-radius: 999px;
      background: var(--lg-ink-muted);
      opacity: 0.45;
      transition: opacity 0.15s ease, background 0.15s ease, height 0.15s ease;
    }
    .split-resizer:hover, .split-resizer.dragging {
      background: var(--lg-accent-soft);
    }
    .split-resizer:hover::before, .split-resizer.dragging::before {
      background: var(--lg-accent);
      opacity: 1;
      height: 60px;
    }

    /* Left Pane Passage Tabs & Scroll Area */
    .cbt-left-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--lg-divider);
      background: var(--lg-wash);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .cbt-left-tabs::-webkit-scrollbar { display: none; }
    .p-tab-btn {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink-sub);
      font-size: 11.8px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .p-tab-btn:hover { color: var(--lg-ink); border-color: var(--lg-accent); }
    .p-tab-btn.active {
      background: var(--lg-accent);
      color: #fff;
      border-color: transparent;
    }

    .cbt-left-scroll, .cbt-right-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 13px 15px 22px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* ---------------- PASSAGE RENDERERS BY GENRE ---------------- */
    .passage-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .rd-shell .passage-card {
      border-radius: 16px !important;
      padding: 0 !important;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }
    .rd-shell .passage-card.is-hidden { display: none; }
    .passage-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 13px;
      background: var(--lg-wash);
      border-bottom: 1px solid var(--lg-divider);
      font-size: 12px;
      font-weight: 800;
      color: var(--lg-ink);
    }
    .passage-bar-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .passage-bar-left svg { color: var(--lg-accent); flex-shrink: 0; }
    .genre-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      flex-shrink: 0;
    }
    .genre-badge.is-chat { background: var(--teal-soft); color: var(--teal); }
    .genre-badge.is-table { background: var(--info-soft); color: var(--info); }
    .genre-badge.is-ad { background: var(--violet-soft); color: var(--violet); }
    .genre-badge.is-review { background: var(--ok-soft); color: var(--ok); }

    .passage-body {
      padding: 13px 15px 15px;
      font-size: calc(14.6px * var(--cbt-fs-scale));
      line-height: 1.7;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }

    /* Email / Memo Header Block */
    .doc-email-meta {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 4px 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: var(--lg-wash);
      border-left: 3px solid var(--lg-accent);
      font-size: calc(13px * var(--cbt-fs-scale));
      line-height: 1.48;
    }
    .doc-meta-k {
      font-weight: 800;
      color: var(--lg-ink-muted);
      white-space: nowrap;
    }
    .doc-meta-v {
      font-weight: 600;
      color: var(--lg-ink);
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .doc-meta-v.is-subj { font-weight: 800; color: var(--lg-ink); }

    /* Document / Article / Notice / Ad / Review Header */
    .doc-head-block {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .passage-card.genre-ad .doc-head-block {
      padding: 10px 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--lg-accent-soft), var(--violet-soft));
      border-bottom: none;
    }
    .passage-card.genre-notice .doc-head-block {
      border-left: 3.5px solid var(--teal);
      padding-left: 11px;
      border-bottom: none;
      padding-bottom: 2px;
    }
    .doc-title {
      margin: 0;
      font-size: calc(16px * var(--cbt-fs-scale));
      font-weight: 800;
      line-height: 1.36;
      color: var(--lg-ink);
    }
    .doc-sub {
      margin: 4px 0 0;
      font-size: calc(12.8px * var(--cbt-fs-scale));
      color: var(--lg-ink-sub);
      font-weight: 600;
      line-height: 1.45;
    }
    .doc-stars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: #d97706;
      margin-top: 4px;
    }
    html.dark .doc-stars { color: #fbbf24; }

    .doc-p {
      margin: 0 0 11px;
      font-size: calc(14.5px * var(--cbt-fs-scale));
      line-height: 1.72;
      color: var(--lg-ink);
      white-space: pre-line;
    }
    .doc-p:last-child { margin-bottom: 0; }

    /* Chat Bubbles */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .chat-bubble {
      padding: 9px 12px;
      border-radius: 14px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      max-width: 94%;
    }
    .chat-bubble.is-alt {
      align-self: flex-end;
      background: var(--lg-accent-soft);
      border-color: rgba(180, 83, 9, 0.25);
    }
    html.dark .chat-bubble.is-alt {
      border-color: rgba(245, 158, 11, 0.28);
    }
    .chat-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 3px;
    }
    .chat-sender {
      font-size: calc(12.4px * var(--cbt-fs-scale));
      font-weight: 800;
      color: var(--lg-accent);
    }
    .chat-bubble.is-alt .chat-sender { color: var(--teal); }
    .chat-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--lg-ink-muted);
      white-space: nowrap;
    }
    .chat-text {
      font-size: calc(14px * var(--cbt-fs-scale));
      line-height: 1.58;
      color: var(--lg-ink);
    }

    /* Document HTML Table (Mobile safe horizontal scroll) */
    .doc-table-wrap {
      margin-top: 11px;
      min-width: 0;
      max-width: 100%;
    }
    .doc-table-wrap:first-child { margin-top: 0; }
    .doc-table-caption {
      font-size: calc(12.6px * var(--cbt-fs-scale));
      font-weight: 800;
      color: var(--lg-accent);
      margin-bottom: 6px;
    }
    .doc-table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 11px;
      border: 1px solid var(--lg-divider);
    }
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(13px * var(--cbt-fs-scale));
    }
    .doc-table th, .doc-table td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--lg-divider);
      line-height: 1.45;
      vertical-align: top;
      overflow-wrap: normal;
      word-break: normal;
    }
    .doc-table th {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-weight: 800;
      white-space: nowrap;
    }
    .doc-table tbody tr:nth-child(even) td { background: var(--lg-wash); }
    .doc-table tbody tr:last-child td { border-bottom: none; }
    .doc-table-note {
      margin-top: 6px;
      font-size: 11.8px;
      color: var(--lg-ink-muted);
      font-style: italic;
    }

    /* Part 6 Interactive Blank Chips */
    .p6-blank-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      margin: 0 2px;
      border-radius: 8px;
      border: 1.5px solid var(--lg-accent);
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 0.9em;
      font-weight: 800;
      line-height: 1.45;
      cursor: pointer;
      vertical-align: baseline;
      transition: transform 0.12s ease, background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .p6-blank-chip:hover {
      background: var(--lg-accent);
      color: #fff;
      transform: translateY(-1px);
    }
    .p6-blank-chip.is-answered {
      background: var(--info-soft);
      border-color: var(--info);
      color: var(--info);
    }
    .p6-blank-chip.is-correct {
      background: var(--ok-soft);
      border-color: #16a34a;
      color: var(--ok);
    }
    .p6-blank-chip.is-wrong {
      background: var(--err-soft);
      border-color: #dc2626;
      color: var(--err);
    }
    .p6-blank-chip.is-focused {
      box-shadow: 0 0 0 3px var(--lg-accent-soft);
    }
    .p6-chip-ans {
      font-weight: 800;
      opacity: 0.92;
    }

    /* Highlight Mark & Floating Popover */
    mark.cbt-hl {
      background: var(--hl-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .cbt-hl-popover {
      position: fixed;
      z-index: 10200;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 4px 5px;
      border-radius: 999px;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-hairline);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.24), inset 0 1px 0 var(--lg-rim-top);
    }
    .cbt-hl-popover button {
      border: none;
      background: transparent;
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .cbt-hl-popover button.hl-do:hover {
      background: var(--hl-bg);
    }
    .cbt-hl-popover button.hl-del {
      color: var(--err);
    }
    .cbt-hl-popover button.hl-del:hover {
      background: var(--err-soft);
    }

    /* ---------------- RIGHT PANE: PALETTE, QUESTIONS & RESULTS ---------------- */
    .cbt-palette-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 13px;
      border-bottom: 1px solid var(--lg-divider);
      background: var(--lg-wash);
      flex-shrink: 0;
    }
    .rd-shell.is-single .cbt-palette-bar {
      border-radius: 14px;
      border: 1px solid var(--lg-divider);
      margin-bottom: 14px;
    }
    .pal-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pal-label {
      font-size: 11.8px;
      font-weight: 800;
      color: var(--lg-ink-muted);
      margin-right: 2px;
    }
    .q-pal-btn {
      position: relative;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border-radius: 8px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .q-pal-btn:hover { border-color: var(--lg-accent); }
    .q-pal-btn.is-answered {
      background: var(--lg-accent-soft);
      border-color: var(--lg-accent);
      color: var(--lg-accent);
    }
    .q-pal-btn.is-correct {
      background: var(--ok-soft);
      border-color: #16a34a;
      color: var(--ok);
    }
    .q-pal-btn.is-wrong {
      background: var(--err-soft);
      border-color: #dc2626;
      color: var(--err);
    }
    .q-pal-btn.is-flagged::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f59e0b;
      border: 1.5px solid var(--lg-surface);
    }
    .pal-stat {
      font-size: 11.8px;
      font-weight: 800;
      color: var(--lg-ink-sub);
      white-space: nowrap;
    }

    /* Strategy Tip Box */
    .read-tip-box {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--lg-wash);
      border-left: 3.5px solid var(--lg-accent);
      margin-bottom: 13px;
    }
    .read-tip-ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .read-tip-lbl {
      font-size: 10.6px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--lg-accent);
      margin-bottom: 2px;
    }
    .read-tip-text {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }

    /* Score Banner */
    .score-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 13px;
      font-size: 13.4px;
      font-weight: 700;
      line-height: 1.48;
    }
    .score-banner.is-pass {
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid rgba(22, 163, 74, 0.36);
    }
    .score-banner.is-retry {
      background: var(--err-soft);
      color: var(--err);
      border: 1px solid rgba(220, 38, 38, 0.34);
    }
    .score-banner-sub {
      font-size: 12.2px;
      font-weight: 600;
      color: var(--lg-ink-sub);
      margin-top: 3px;
    }

    /* Paraphrase Comparison Table Card */
    .para-card {
      border-radius: 15px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      padding: 12px 13px;
      margin-bottom: 14px;
      min-width: 0;
      max-width: 100%;
    }
    .para-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }
    .para-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.2px;
      font-weight: 800;
      color: var(--teal);
    }
    .para-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(12.8px * var(--cbt-fs-scale));
    }
    .para-table th, .para-table td {
      padding: 7px 9px;
      text-align: left;
      border-bottom: 1px solid var(--lg-divider);
      line-height: 1.45;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .para-table th {
      background: var(--teal-soft);
      color: var(--teal);
      font-weight: 800;
      font-size: 11.6px;
    }
    .para-table tbody tr:nth-child(even) td { background: var(--lg-wash); }
    .para-table tbody tr:last-child td { border-bottom: none; }
    .para-en-src { font-weight: 700; color: var(--lg-ink); }
    .para-en-ans { font-weight: 800; color: var(--lg-accent); }
    .rd-para-vi { color: var(--lg-ink-sub); font-weight: 600; }

    /* Question Cards */
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .q-card {
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      border-radius: 16px;
      padding: 13px 14px;
      min-width: 0;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .q-card.is-flagged { border-color: rgba(217, 119, 6, 0.55); }
    .q-card.is-graded-right { border-color: rgba(22, 163, 74, 0.50); }
    .q-card.is-graded-wrong { border-color: rgba(220, 38, 38, 0.48); }
    .q-card.is-focused {
      border-color: var(--lg-accent);
      box-shadow: 0 0 0 3px var(--lg-accent-soft);
    }

    .q-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .q-head-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .q-num-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 7px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 11.8px;
      font-weight: 800;
    }
    .q-tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 7px;
      background: var(--violet-soft);
      color: var(--violet);
      font-size: 11px;
      font-weight: 800;
    }
    .q-tag-pill.is-cross { background: var(--teal-soft); color: var(--teal); }
    .q-passage-ref {
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink-muted);
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 10.8px;
      font-weight: 800;
      cursor: pointer;
    }
    .q-passage-ref:hover { border-color: var(--lg-accent); color: var(--lg-accent); }

    .q-flag-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink-muted);
      font-size: 11.2px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .q-flag-btn:hover { border-color: var(--warn); color: var(--warn); }
    .q-flag-btn.is-flagged {
      background: var(--warn-soft);
      border-color: rgba(217, 119, 6, 0.50);
      color: var(--warn);
    }

    .q-prompt {
      font-size: calc(14.4px * var(--cbt-fs-scale));
      font-weight: 700;
      line-height: 1.58;
      color: var(--lg-ink);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .q-blank-slot {
      display: inline-block;
      padding: 0 7px;
      margin: 0 2px;
      border-radius: 6px;
      border-bottom: 2px solid var(--lg-accent);
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-weight: 800;
    }

    .quiz-opts {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
    }
    .rd-shell.is-single .quiz-opts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .q-opt {
      width: 100%;
      text-align: left;
      padding: 8px 11px;
      border-radius: 11px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: calc(13.6px * var(--cbt-fs-scale));
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.44;
      overflow-wrap: anywhere;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .q-opt:hover:not(:disabled) { border-color: var(--lg-accent); background: var(--lg-wash-hover); }
    .q-opt:disabled { cursor: default; }
    .q-opt-letter {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--lg-seg-track);
      color: var(--lg-ink-sub);
      font-size: 11.4px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q-opt.selected {
      border-color: var(--lg-accent);
      background: var(--lg-accent-soft);
      font-weight: 700;
    }
    .q-opt.selected .q-opt-letter { background: var(--lg-accent); color: #fff; }
    .q-opt.correct {
      border-color: #16a34a !important;
      background: var(--ok-soft) !important;
      color: var(--ok) !important;
      font-weight: 800;
    }
    .q-opt.correct .q-opt-letter { background: #16a34a; color: #fff; }
    .q-opt.wrong {
      border-color: #dc2626 !important;
      background: var(--err-soft) !important;
      color: var(--err) !important;
      font-weight: 700;
    }
    .q-opt.wrong .q-opt-letter { background: #dc2626; color: #fff; }

    .q-exp-box {
      margin-top: 9px;
      padding: 9px 11px;
      border-radius: 11px;
      background: var(--lg-wash);
      border-left: 3.5px solid var(--lg-accent);
      font-size: calc(13px * var(--cbt-fs-scale));
      line-height: 1.56;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .q-exp-box.is-ok { border-left-color: #16a34a; }
    .q-exp-box.is-err { border-left-color: #dc2626; }
    .q-exp-head {
      font-size: 11.8px;
      font-weight: 800;
      margin-bottom: 3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .q-exp-box.is-ok .q-exp-head { color: var(--ok); }
    .q-exp-box.is-err .q-exp-head { color: var(--err); }

    /* Submit Bar & Lesson Nav */
    .submit-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 15px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-hairline);
    }
    .submit-bar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .submit-hint {
      font-size: 11.8px;
      font-weight: 700;
      color: var(--lg-ink-muted);
    }
    .nav-footer.lp-lesson-nav {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 15px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ---------------- TAP-TO-LOOKUP WORDS & POPUP ---------------- */
    .rd-w { display: inline; }
    .tap-word {
      display: inline;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 1px;
      border-bottom: 1px dotted rgba(180, 83, 9, 0.42);
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    html.dark .tap-word { border-bottom-color: rgba(245, 158, 11, 0.48); }
    .tap-word:hover, .tap-word:focus-visible, .tap-word.is-active {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      border-bottom-color: var(--lg-accent);
      outline: none;
    }

    .dict-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10300;
      background: var(--lg-modal-backdrop, rgba(15, 23, 42, 0.38));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .dict-backdrop.open { display: flex; }
    .dict-sheet {
      width: 100%;
      max-width: 470px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 18px 18px 20px;
      border-radius: 22px;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      border: 1px solid var(--lg-hairline);
      box-shadow: 0 22px 52px rgba(15, 23, 42, 0.32), inset 0 1px 0 var(--lg-rim-top, rgba(255, 255, 255, 0.45));
      color: var(--lg-ink);
      overscroll-behavior: contain;
    }
    .dict-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .dict-word-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 7px;
    }
    .dict-word {
      font-size: 20px;
      font-weight: 800;
      color: var(--lg-accent);
      margin: 0;
    }
    .dict-pos {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--teal);
    }
    .dict-ipa {
      font-size: 13px;
      color: var(--lg-ink-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 3px;
    }
    .dict-audio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }
    .dict-accent-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .dict-accent-btn:hover {
      background: var(--lg-accent);
      color: #fff;
      border-color: transparent;
    }
    .dict-def-vi {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--lg-ink);
      margin-bottom: 5px;
    }
    .dict-def-en {
      font-size: 13px;
      color: var(--lg-ink-sub);
      line-height: 1.5;
      margin-bottom: 11px;
    }
    .dict-sec {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--lg-divider);
    }
    .dict-sec-lbl {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--lg-ink-muted);
      margin-bottom: 6px;
    }
    .dict-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .dict-chip {
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      font-size: 12.2px;
      font-weight: 700;
      color: var(--lg-ink);
    }
    .dict-trap-box {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 11px;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.25);
      font-size: 12.8px;
      line-height: 1.5;
      color: var(--lg-ink);
    }
    html.dark .dict-trap-box {
      background: rgba(239, 68, 68, 0.13);
      border-color: rgba(248, 113, 113, 0.30);
    }
    .dict-trap-lbl {
      font-size: 11px;
      font-weight: 800;
      color: var(--err);
      margin-bottom: 3px;
      text-transform: uppercase;
    }
    .dict-fallback-note {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--lg-wash);
      font-size: 13px;
      color: var(--lg-ink-sub);
      line-height: 1.55;
    }

    .loading-state {
      padding: 44px 18px;
      text-align: center;
      color: var(--lg-ink-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    /* ---------------- RESPONSIVE (1024px, 820px, 600px, 580px / 360px) ---------------- */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 10050;
        transform: translateX(-100%);
        width: min(88vw, 336px);
        max-width: 336px;
        border-right: none;
        box-shadow: none;
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.22s ease, visibility 0.22s;
      }
      .sidebar.open {
        transform: translateX(0);
        visibility: visible;
        pointer-events: auto;
        border-right: 1px solid var(--lg-hairline);
        box-shadow: 8px 0 32px rgba(0, 0, 0, 0.35);
      }
      .close-menu-btn { display: inline-flex; }
    }

    @media (max-width: 820px) {
      .cbt-mob-switcher { display: grid; }
      .cbt-split { flex-direction: column; }
      .split-resizer { display: none !important; }
      .cbt-left {
        width: 100% !important;
        flex: 0 0 46%;
        border-bottom: 2px solid var(--lg-hairline);
      }
      .cbt-right {
        width: 100% !important;
        flex: 1 1 54%;
      }
      .cbt-split.mob-view-left .cbt-left {
        flex: 1 1 100%;
        border-bottom: none;
      }
      .cbt-split.mob-view-left .cbt-right { display: none; }
      .cbt-split.mob-view-right .cbt-left { display: none; }
      .cbt-split.mob-view-right .cbt-right { flex: 1 1 100%; }
    }

    @media (max-width: 640px) {
      .rd-shell.is-single .quiz-opts { grid-template-columns: minmax(0, 1fr); }
      .dict-backdrop { align-items: flex-end; padding: 0; }
      .dict-sheet {
        max-width: 100%;
        border-radius: 22px 22px 0 0;
        padding: 16px 15px calc(18px + env(safe-area-inset-bottom, 0px));
      }
      /* Stack Paraphrase Table into readable full-width cards on narrow phones */
      .para-table thead { display: none; }
      .para-table, .para-table tbody, .para-table tr, .para-table td {
        display: block;
        width: 100%;
      }
      .para-table tr {
        padding: 8px 9px;
        margin-bottom: 7px;
        border-radius: 11px;
        border: 1px solid var(--lg-divider);
        background: var(--lg-wash);
      }
      .para-table tr:last-child { margin-bottom: 0; }
      .para-table td {
        padding: 2px 0;
        border-bottom: none;
        background: transparent !important;
      }
      .para-table td::before {
        content: attr(data-label) ": ";
        font-size: 10.8px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--lg-ink-muted);
      }
    }

    @media (max-width: 580px) {
      .rd-topbar-wrap { padding: calc(5px + var(--s4-safe-top, 0px)) 7px 0; }
      .rd-topbar-wrap .lp-topbar {
        padding: 4px 8px;
        gap: 5px;
        min-height: 44px;
        height: 44px;
        border-radius: 16px;
      }
      .rd-topbar-wrap .lp-top-left { gap: 5px; flex: 0 1 auto; }
      .rd-topbar-wrap .lp-top-actions { gap: 5px; }
      .rd-topbar-wrap .lp-brand { display: none; }
      .rd-topbar-wrap .lp-back-pill { height: 32px; padding: 0 9px; font-size: 12px; gap: 3px; }
      .rd-topbar-wrap .lp-icon-btn { height: 32px; min-width: 32px; padding: 0 7px; font-size: 11.8px; }

      .rd-main { padding: 7px 7px calc(12px + env(safe-area-inset-bottom, 6px)); }
      .rd-main.is-split-mode { padding: 6px 7px calc(7px + env(safe-area-inset-bottom, 4px)); }
      .rd-shell { border-radius: 17px; }
      .rd-shell.is-single { padding: 13px 11px; }

      .cbt-head { padding: 8px 10px 7px; gap: 6px; }
      .cbt-meta-row .meta-pill.is-order { display: none; }
      .lesson-title { font-size: 15.2px; }
      .lesson-subtitle { display: none; }
      .rd-shell.is-single .lesson-subtitle { display: block; font-size: 12.2px; }
      .cbt-head-right .btn-done span { display: none; }
      .cbt-head-right .btn-done { padding: 5px 8px; }

      .cbt-toolbar { padding: 5px 7px; gap: 5px; border-radius: 11px; }
      .cbt-timer-pill { padding: 3px 8px; font-size: 12px; gap: 4px; }
      .cbt-toolbar .btn { padding: 4px 7px; font-size: 11.2px; gap: 3px; }
      .cbt-toolbar .seg-pill { padding: 3px 7px; font-size: 11px; }
      .cbt-tb-hide-xs { display: none; }

      .cbt-left-tabs { padding: 6px 9px; gap: 4px; }
      .p-tab-btn { padding: 4px 9px; font-size: 11.2px; }
      .cbt-left-scroll, .cbt-right-scroll { padding: 10px 10px 16px; }
      .passage-body { padding: 11px 11px 12px; }
      .doc-email-meta { padding: 8px 9px; gap: 3px 7px; }
      .doc-table th, .doc-table td { padding: 6px 8px; font-size: 12px; overflow-wrap: normal; word-break: normal; }
      .doc-table th { white-space: nowrap; }

      .cbt-palette-bar { padding: 6px 9px; gap: 5px; }
      .q-pal-btn { min-width: 25px; height: 25px; font-size: 11.2px; }
      .q-card { padding: 11px 11px; border-radius: 14px; }
      .submit-bar { padding: 10px 11px; }
      .nav-footer.lp-lesson-nav { padding: 9px 10px; gap: 6px; }
      .nav-footer.lp-lesson-nav .btn { padding: 6px 9px; font-size: 11.6px; }
    }
  </style>
</head>
<body>
  <div id="ghibliBackdropLayer" class="ghibli-backdrop-layer"></div>
  <div class="lp-aurora-layer" aria-hidden="true"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="Danh sách 42 bộ Luyện Đọc TOEIC">

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Luyện Đọc TOEIC</span>
        </h2>
        <span class="sb-count-pill" id="sidebarProgBadge">0/42</span>
        <button type="button" class="close-menu-btn" id="btnCloseSidebar" title="Đóng mục lục" aria-label="Đóng mục lục">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="lp-prog-bar"><div class="lp-prog-fill" id="sidebarProgBar" style="width:0%;background:var(--lg-accent);"></div></div>
    </div>

    <div class="search-box">
      <div class="s4-search-group is-compact">
        <div class="s4-search-field">
          <input type="text" id="searchInput" class="s4-search-input" placeholder="Tìm bộ đọc, Part 5-7, thể loại..." autocomplete="off">
          <button type="button" id="searchInput_clear" class="s4-search-clear" title="Xóa từ khóa" aria-label="Xóa từ khóa">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>

        <button type="button" id="searchInput_btn" class="s4-search-btn is-icon" title="Tìm kiếm" aria-label="Tìm kiếm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </div>

    <div class="level-tabs" id="levelTabs" role="tablist" aria-label="Lọc 4 Chặng điểm TOEIC"></div>
    <div class="part-tabs" id="partTabs" role="tablist" aria-label="Lọc theo 5 dạng Đọc TOEIC"></div>

  <div class="main-wrap">
    <div class="rd-topbar-wrap">
      <header class="lp-topbar lp-glass">
        <div class="lp-top-left">
          <button type="button" class="lp-icon-btn menu-toggle-btn" id="btnToggleSidebar" aria-label="Mục lục bộ đọc" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            <span class="s4-desk-sb-lbl lp-hide-xs">Ẩn mục lục</span>
          </button>
          <a href="../index.html" class="lp-back-pill" id="lpBackBtn" title="Về Khóa học TOEIC">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span>TOEIC</span>
          </a>
          <div class="lp-brand">
            <div class="lp-brand-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
            <div class="lp-brand-text">
              <h1 class="lp-brand-title" id="topbarTitle">Luyện Đọc TOEIC</h1>
            </div>
          </div>
        </div>

          <button type="button" class="lp-icon-btn donate" id="btnReadingDonate" title="Ủng hộ dự án" aria-label="Ủng hộ dự án">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span class="lp-hide-xs">Ủng hộ</span>
          </button>
          <button type="button" class="lp-icon-btn" id="btnReadingDark" data-lp-theme-toggle="1" title="Đổi giao diện Sáng/Tối" aria-label="Đổi giao diện Sáng/Tối"></button>
        </div>
      </header>
    </div>

    <main class="rd-main" id="mainScroll">
      <div class="rd-shell lp-glass" id="lessonContent"></div>
    </main>
  </div>

  <div class="cbt-hl-popover" id="cbtHlPopover" role="toolbar" aria-label="Công cụ Highlight văn bản">
    <button type="button" class="hl-do" id="btnApplyHl">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
      <span>Highlight</span>
