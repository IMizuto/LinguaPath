      function safeReadJson(key, fb) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fb;
          var parsed = JSON.parse(raw);
          return parsed !== null && typeof parsed === "object" ? parsed : fb;
        } catch (e) { return fb; }
      }

      function esc(str) {
        if (window.S4UI && typeof window.S4UI.escapeHtml === "function") {
          return window.S4UI.escapeHtml(str);
        }
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function svgIcon(name, size) {
        var sz = Number(size) > 0 ? Number(size) : 15;
        if (CUSTOM_SVG[name]) {
          return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + CUSTOM_SVG[name] + '</svg>';
        }
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          return window.S4UI.icon(name, sz);
        }
        return "";
      }

      function pad2(n) {
        var v = Number(n) || 0;
        return v < 10 ? "0" + v : String(v);
      }

      function formatClock(sec) {
        var s = Math.max(0, Math.floor(Number(sec) || 0));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return pad2(m) + ":" + pad2(r);
      }

      function showToast(type, msg, duration) {
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast({ type: type || "info", message: String(msg || ""), duration: duration || 2200 });
        }
      }

      function cleanOptionText(raw) {
        return String(raw == null ? "" : raw).replace(/^\s*\(?[A-D]\)?[.):]\s+/i, "").trim();
      }

      function normalizeDictWord(raw) {
        return String(raw == null ? "" : raw)
          .toLowerCase()
          .replace(/[’‘`]/g, "'")
          .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
          .trim();
      }

      function wrapWordsMarkup(rawText) {
        var str = String(rawText == null ? "" : rawText);
        if (!str) return "";
        var re = /[\u00C0-\u1EF9A-Za-z]+(?:['’-][\u00C0-\u1EF9A-Za-z]+)*/g;
        var asciiWordRe = /^[A-Za-z]{2,}(?:['’-][A-Za-z]+)*$/;
        var out = "";
        var lastIdx = 0;
        var m;
        var cls = dictModeEnabled ? "rd-w tap-word" : "rd-w";
        var extraAttr = dictModeEnabled ? ' role="button" tabindex="0"' : "";
        while ((m = re.exec(str)) !== null) {
          if (m.index > lastIdx) {
            out += esc(str.slice(lastIdx, m.index));
          }
          var token = m[0];
          if (asciiWordRe.test(token)) {
            var norm = token.toLowerCase().replace(/’/g, "'");
            out += '<span class="' + cls + '" data-word="' + esc(norm) + '"' + extraAttr + '>' + esc(token) + '</span>';
          } else {
            out += esc(token);
          }
          lastIdx = m.index + token.length;
        }
        if (lastIdx < str.length) {
          out += esc(str.slice(lastIdx));
        }
        return out;
      }

      function renderPassageText(rawText, isPart6) {
        var str = String(rawText == null ? "" : rawText);
        if (!str) return "";
        if (!isPart6) return wrapWordsMarkup(str);
        var parts = str.split(/(\[\d+\])/g);
        var out = "";
        for (var i = 0; i < parts.length; i++) {
          var seg = parts[i];
          var bm = /^\[(\d+)\]$/.exec(seg);
          if (bm) {
            var num = Number(bm[1]);
            out += buildP6ChipHtml(num);
          } else if (seg) {
            out += wrapWordsMarkup(seg);
          }
        }
        return out;
      }

      function findQIdxByNum(num) {
        if (!activeDrill || !Array.isArray(activeDrill.questions)) return -1;
        var qs = activeDrill.questions;
        for (var i = 0; i < qs.length; i++) {
          if (Number(qs[i].num) === Number(num)) return i;
        }
        if (num >= 1 && num <= qs.length) return num - 1;
        return -1;
      }

      function buildP6ChipHtml(num) {
        var qIdx = findQIdxByNum(num);
        var q = (qIdx >= 0 && activeDrill && activeDrill.questions) ? activeDrill.questions[qIdx] : null;
        var chosen = qIdx >= 0 ? answers[qIdx] : undefined;
        var cls = "p6-blank-chip";
        var ansLabel = "";
        if (typeof chosen === "number") {
          ansLabel = ' <span class="p6-chip-ans">' + (LETTERS[chosen] || "") + '</span>';
          if (graded && q) {
            cls += (chosen === Number(q.ans)) ? " is-correct" : " is-wrong";
          } else {
            cls += " is-answered";
          }
        } else if (graded && q) {
          cls += " is-wrong";
          ansLabel = ' <span class="p6-chip-ans">' + (LETTERS[Number(q.ans)] || "") + '</span>';
        }
        return '<button type="button" class="' + cls + '" data-jump-q="' + num + '" data-p6-blank="' + num + '" title="Nhảy tới Câu ' + num + '">[' + num + ']' + ansLabel + '</button>';
      }

      function syncP6BlankChips() {
        if (!activeDrill || activeDrill.part !== "part6" || !contentEl) return;
        var chips = contentEl.querySelectorAll(".p6-blank-chip[data-p6-blank]");
        for (var i = 0; i < chips.length; i++) {
          var chip = chips[i];
          var num = Number(chip.getAttribute("data-p6-blank"));
          var qIdx = findQIdxByNum(num);
          var q = qIdx >= 0 ? activeDrill.questions[qIdx] : null;
          var chosen = qIdx >= 0 ? answers[qIdx] : undefined;
          chip.classList.remove("is-answered", "is-correct", "is-wrong");
          var ansText = "";
          if (typeof chosen === "number") {
            ansText = ' <span class="p6-chip-ans">' + (LETTERS[chosen] || "") + '</span>';
            if (graded && q) {
              chip.classList.add(chosen === Number(q.ans) ? "is-correct" : "is-wrong");
            } else {
              chip.classList.add("is-answered");
            }
          } else if (graded && q) {
            chip.classList.add("is-wrong");
            ansText = ' <span class="p6-chip-ans">' + (LETTERS[Number(q.ans)] || "") + '</span>';
          }
          chip.innerHTML = "[" + num + "]" + ansText;
        }
      }

      /* ---------------- THEME & SIDEBAR CONTROLS ---------------- */
      function syncDarkBtn() {
        var btn = document.getElementById("btnReadingDark");
        if (!btn) return;
        var isDark = document.documentElement.classList.contains("dark");
        if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn, isDark);
        } else {
          btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
        }
      }

      window.toggleDark = function () {
        if (typeof window.toggleDarkModeOnly === "function") {
          window.toggleDarkModeOnly();
        } else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          if (document.body) document.body.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
          var s = localStorage.getItem("s4_theme_style") || "ghibli";
          var mt = document.getElementById("metaThemeColor");
          if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
        }
        syncDarkBtn();
      };

      window.toggleMenu = function (open) {
        if (window.S4UI && typeof window.S4UI.toggleSidebar === "function") {
          var opened = window.S4UI.toggleSidebar(typeof open === "boolean" ? open : undefined);
          var isMobile = window.innerWidth <= 1024;
          document.body.classList.toggle("sidebar-open", isMobile && opened);
          var mw = document.querySelector(".main-wrap");
          if (mw && "inert" in mw) mw.inert = isMobile && opened;
          return opened;
        }
        var isOpen = Boolean(open) && window.innerWidth <= 1024;
        if (sidebarEl) sidebarEl.classList.toggle("open", isOpen);
        document.body.classList.toggle("sidebar-open", isOpen);
        var bd = document.getElementById("sidebarBackdrop");
        if (bd) bd.classList.toggle("open", isOpen);
        var mw2 = document.querySelector(".main-wrap");
        if (mw2 && "inert" in mw2) mw2.inert = isOpen;
        return isOpen;
      };

      /* ---------------- PROGRESS & STREAK ---------------- */
      function recordReadingStreak(id, isDone) {
        var rKey = "r_" + id;
        try {
          var days = safeReadJson(DAYS_KEY, {});
          if (isDone) {
            var now = new Date();
            var today = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
            var arr = Array.isArray(days[today]) ? days[today] : [];
            if (arr.indexOf(rKey) === -1) arr.push(rKey);
            days[today] = arr;
            localStorage.setItem(DAYS_KEY, JSON.stringify(days));
          } else {
            var changed = false;
            Object.keys(days).forEach(function (dateKey) {
              if (Array.isArray(days[dateKey]) && days[dateKey].indexOf(rKey) !== -1) {
                days[dateKey] = days[dateKey].filter(function (x) { return x !== rKey; });
                if (days[dateKey].length === 0) delete days[dateKey];
                changed = true;
              }
            });
            if (changed) localStorage.setItem(DAYS_KEY, JSON.stringify(days));
          }
        } catch (e) {}
      }

      function setLessonDone(id, forceState, silentToast) {
        if (!id) return;
        var next = typeof forceState === "boolean" ? forceState : !completedMap[id];
        if (next) completedMap[id] = true;
        else delete completedMap[id];
        try { localStorage.setItem(DONE_KEY, JSON.stringify(completedMap)); } catch (e) {}
        recordReadingStreak(id, next);
        if (window.S4Auth && typeof window.S4Auth.scheduleCloudSync === "function") {
          try { window.S4Auth.scheduleCloudSync(); } catch (e) {}
        }
        updateProgressUI();
        renderSidebar();
        syncDoneButtons(id);
        if (!silentToast) {
          showToast(next ? "success" : "info", next ? "Đã đánh dấu hoàn thành bộ đọc!" : "Đã bỏ đánh dấu hoàn thành.");
        }
      }

      function syncDoneButtons(id) {
        if (id !== activeId) return;
        var isDone = Boolean(completedMap[id]);
        var html = isDone
          ? (svgIcon("check", 14) + "<span>Đã hoàn thành</span>")
          : (svgIcon("target", 14) + "<span>Đánh dấu hoàn thành</span>");
        ["btnToggleDone", "btnFooterDone"].forEach(function (btnId) {
          var el = document.getElementById(btnId);
          if (el) {
            el.classList.toggle("completed", isDone);
            el.innerHTML = html;
          }
        });
      }

      function updateProgressUI() {
        var total = ALL_LESSONS.length || 42;
        var done = ALL_LESSONS.filter(function (x) { return Boolean(completedMap[x.id]); }).length;
        var pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
        var badge = document.getElementById("sidebarProgBadge");
        var bar = document.getElementById("sidebarProgBar");
        if (badge) badge.textContent = done + "/" + total;
        if (bar) bar.style.width = pct + "%";
      }

      /* ---------------- COUNTDOWN TIMER ENGINE ---------------- */
      function stopTimerLoop() {
        timerRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function getDefaultMinutes(drill) {
        if (drill && Number(drill.timeLimitMin) > 0) return Number(drill.timeLimitMin);
        var p = drill ? drill.part : "";
        if (p === "part5") return 4;
        if (p === "part6") return 8;
        if (p === "part7t") return 12;
        return 10;
      }

      function initTimerForDrill(drill, autoStart) {
        stopTimerLoop();
        var mins = getDefaultMinutes(drill);
        timerLimitSec = mins * 60;
        timerRemainSec = timerLimitSec;
        timerElapsedSec = 0;
        timerFree = false;
        timerWarnNotified = false;
        if (autoStart) startTimer();
        else updateTimerUI();
      }

      function startTimer() {
        if (timerRunning) return;
        if (!timerFree && timerRemainSec <= 0) {
          timerRemainSec = timerLimitSec;
        }
        timerRunning = true;
        timerInterval = setInterval(function () {
          if (!timerRunning) return;
          timerElapsedSec++;
          if (!timerFree && timerLimitSec > 0) {
            timerRemainSec = Math.max(0, timerRemainSec - 1);
            if (timerRemainSec === 0) {
              stopTimerLoop();
              if (!timerWarnNotified) {
                timerWarnNotified = true;
                showToast("warn", "Đã hết thời gian gợi ý! Bạn có thể nộp bài để xem điểm và giải thích.", 3400);
              }
            }
          }
          updateTimerUI();
        }, 1000);
        updateTimerUI();
      }

      function pauseTimer() {
        stopTimerLoop();
        updateTimerUI();
      }

      function toggleTimerRunning() {
        if (timerRunning) pauseTimer();
        else startTimer();
      }

      function resetTimer() {
        stopTimerLoop();
        timerRemainSec = timerLimitSec;
        timerElapsedSec = 0;
        timerWarnNotified = false;
        startTimer();
      }

      function toggleTimerFreeMode() {
        timerFree = !timerFree;
        if (timerFree) {
          if (!timerRunning && !graded) startTimer();
        } else {
          if (timerRemainSec <= 0) timerRemainSec = timerLimitSec;
        }
        updateTimerUI();
      }

      function updateTimerUI() {
        var box = document.getElementById("cbtTimerBox");
        var txt = document.getElementById("cbtTimerText");
        var btnToggle = document.getElementById("btnTimerToggle");
        var btnFree = document.getElementById("btnTimerFree");
        if (txt) {
          txt.textContent = timerFree ? ("Tự do " + formatClock(timerElapsedSec)) : formatClock(timerRemainSec);
        }
        if (box) {
          var isDanger = !timerFree && timerLimitSec > 0 && timerRemainSec <= 60;
          var isWarn = !timerFree && timerLimitSec > 0 && !isDanger && timerRemainSec <= Math.ceil(timerLimitSec * 0.25);
          box.classList.toggle("is-free", timerFree);
          box.classList.toggle("is-warn", isWarn);
          box.classList.toggle("is-danger", isDanger);
        }
        if (btnToggle) {
          btnToggle.innerHTML = timerRunning
            ? (svgIcon("pause", 12) + '<span class="cbt-tb-hide-xs">Tạm dừng</span>')
            : (svgIcon("play", 12) + '<span class="cbt-tb-hide-xs">Bắt đầu</span>');
          btnToggle.title = timerRunning ? "Tạm dừng đồng hồ" : "Bắt đầu đếm giờ";
        }
        if (btnFree) {
          btnFree.classList.toggle("active", timerFree);
          btnFree.setAttribute("aria-pressed", timerFree ? "true" : "false");
        }
      }

      /* ---------------- SIDEBAR FILTERING & RENDERING ---------------- */
      function matchesLesson(l, q) {
        if (!q) return true;
        var genreStr = Array.isArray(l.genres)
          ? l.genres.map(function (g) { return g + " " + (GENRE_LABELS[g] || ""); }).join(" ")
          : "";
        var hay = [
          l.id, "bo " + l.order, "bai " + l.order, l.title, l.subtitle, l.part, l.partLabel, genreStr
        ].join(" ");
        if (window.S4UI && typeof window.S4UI.matchesSearch === "function") {
          return window.S4UI.matchesSearch(hay, q);
        }
        return hay.toLowerCase().indexOf(q.toLowerCase()) !== -1;
      }

      function getFilteredLessons() {
        var q = currentSearchQuery.trim();
        return ALL_LESSONS.filter(function (l) {
          if (currentLevelFilter > 0 && Number(l.level) !== currentLevelFilter) return false;
          if (currentPartFilter !== "all" && String(l.part || "").toLowerCase() !== currentPartFilter) return false;
          return matchesLesson(l, q);
        });
      }

      function renderFilterTabs() {
        if (levelTabsEl) {
          var lvTabs = [
            { lv: 0, label: "Tất cả" },
            { lv: 1, label: "0–350" },
            { lv: 2, label: "350–550" },
            { lv: 3, label: "550–750" },
            { lv: 4, label: "750–990" }
          ];
          levelTabsEl.innerHTML = lvTabs.map(function (t) {
            var active = currentLevelFilter === t.lv ? " active" : "";
            return '<button type="button" class="level-tab' + active + '" data-lv="' + t.lv + '" role="tab" aria-selected="' + (currentLevelFilter === t.lv ? "true" : "false") + '">' + t.label + '</button>';
          }).join("");
        }
        if (partTabsEl) {
          partTabsEl.innerHTML = PART_FILTERS.map(function (p) {
            var active = currentPartFilter === p.id ? " active" : "";
            return '<button type="button" class="part-tab' + active + '" data-part="' + p.id + '" role="tab" aria-selected="' + (currentPartFilter === p.id ? "true" : "false") + '">' + p.label + '</button>';
          }).join("");
        }
      }

      function clearFilters() {
        currentLevelFilter = 0;
        currentPartFilter = "all";
        currentSearchQuery = "";
        if (searchInput) {
          searchInput.value = "";
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") {
            window.S4UI.syncSearchClear(searchInput);
          }
        }
        renderSidebar();
      }

      function renderSidebar() {
        renderFilterTabs();
        updateProgressUI();
        if (!listEl) return;

        var filtered = getFilteredLessons();
        var q = currentSearchQuery.trim();

        if (!filtered.length) {
          listEl.innerHTML = '<div class="s4-empty-state" style="margin-top:8px;padding:24px 12px;">'
            + '<div style="color:var(--lg-ink-muted);">' + svgIcon("search", 26) + '</div>'
            + '<div style="font-size:13.5px;font-weight:800;color:var(--lg-ink);">Không tìm thấy bộ đọc phù hợp</div>'
            + (q ? '<div style="font-size:12px;">Từ khóa "<strong>' + esc(q) + '</strong>" không khớp bộ nào.</div>' : "")
            + '<button type="button" class="s4-pz-clear-chip" id="btnClearSearchEmpty">' + svgIcon("close", 12) + '<span>Xóa bộ lọc</span></button>'
            + '</div>';
          var clrBtn = document.getElementById("btnClearSearchEmpty");
          if (clrBtn) clrBtn.addEventListener("click", clearFilters);
          return;
        }

        var byLevel = new Map();
        filtered.forEach(function (l) {
          var lv = Number(l.level) || 1;
          if (!byLevel.has(lv)) byLevel.set(lv, []);
          byLevel.get(lv).push(l);
        });

        var html = "";
        [1, 2, 3, 4].forEach(function (lv) {
          var items = byLevel.get(lv);
          if (!items || !items.length) return;
          var meta = LEVEL_META[lv] || LEVEL_META[1];
          var doneCount = items.filter(function (x) { return Boolean(completedMap[x.id]); }).length;
          var isOpen = Boolean(q) || currentLevelFilter === lv || currentPartFilter !== "all" || openLevels.has(lv);
          var isFull = doneCount === items.length && items.length > 0;

          html += '<div class="unit-group' + (isOpen ? " open" : "") + '" data-unit-lv="' + lv + '">'
            + '<div class="unit-header" data-toggle-unit="' + lv + '">'
            +   '<div class="unit-header-top">'
            +     '<span class="unit-name">' + esc(meta.title) + '</span>'
            +     '<span class="unit-meta' + (isFull ? " is-full" : "") + '">' + svgIcon(isOpen ? "chevronDown" : "chevronRight", 13) + '</span>'
            +   '</div>'
            +   '<span class="unit-meta' + (isFull ? " is-full" : "") + '">' + doneCount + '/' + items.length + ' bộ</span>'
            + '</div>'
            + '<div class="unit-items">'
            + items.map(function (l) {
                var isAct = l.id === activeId;
                var isDone = Boolean(completedMap[l.id]);
                var qCnt = Number(l.questionCount) || 0;
                var pCnt = Number(l.passageCount) || 0;
                var mins = Number(l.timeLimitMin) || 0;
                return '<button type="button" class="lesson-item' + (isAct ? " active" : "") + '" data-lesson-id="' + esc(l.id) + '">'
                  + '<span class="lesson-item-left">'
                  +   '<span class="lesson-num">' + pad2(l.order) + '</span>'
                  +   '<span class="lesson-item-body">'
                  +     '<span class="lesson-item-title">' + esc(l.title) + '</span>'
                  +     '<span class="lesson-item-sub">'
                  +       '<span>' + esc(l.partLabel || l.part) + '</span>'
                  +       (qCnt > 0 ? '<span class="sb-mini-badge">' + qCnt + ' câu</span>' : '')
                  +       (pCnt > 0 ? '<span class="sb-mini-badge">' + pCnt + ' đoạn</span>' : '')
                  +       (mins > 0 ? '<span>' + mins + 'p</span>' : '')
                  +     '</span>'
                  +   '</span>'
                  + '</span>'
                  + (isDone ? '<span class="done-dot" aria-label="Đã hoàn thành">' + svgIcon("check", 14) + '</span>' : '')
                  + '</button>';
              }).join("")
            + '</div>'
            + '</div>';
        });

        listEl.innerHTML = html;
      }

      /* ---------------- LAZY DRILL LOADER ---------------- */
      function resolveDrillUrl(meta) {
        var f = String((meta && meta.file) || "").trim();
        if (!f) return "data/drills/" + encodeURIComponent(meta.id) + ".json";
        if (/^(https?:|\/|data\/|\.\.?\/)/i.test(f)) return f;
        return "data/" + f.replace(/^\/+/, "");
      }

      function fetchDrill(meta) {
        if (!meta || !meta.id) return Promise.reject(new Error("Thiếu mã bộ đọc"));
        if (drillCache.has(meta.id)) {
          return Promise.resolve(drillCache.get(meta.id));
        }
        var url = resolveDrillUrl(meta);
        return fetch(url, { cache: "default" }).then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        }).then(function (json) {
          drillCache.set(meta.id, json);
          return json;
        });
      }

      function selectLesson(id, resetScroll) {
        var meta = ALL_LESSONS.find(function (x) { return x.id === id; });
        if (!meta) return;
        stopTimerLoop();
        hideHlPopover();
        closeDictPopup();
        activeId = meta.id;
        activeDrill = null;
        answers = {};
        flagged = {};
        graded = false;
        dictModeEnabled = false;
        activePassageTab = "all";
        openLevels.add(Number(meta.level) || 1);
        try { localStorage.setItem(LAST_KEY, meta.id); } catch (e) {}
        renderSidebar();

        if (mainScrollEl) mainScrollEl.classList.remove("is-split-mode");
        if (contentEl) {
          contentEl.className = "rd-shell lp-glass is-single cbt-font-" + cbtFontSize;
          contentEl.innerHTML = '<div class="loading-state">'
            + svgIcon("reading", 28)
            + '<div>Đang nạp bộ đọc ' + esc(meta.title) + '...</div>'
            + '</div>';
        }
        if (resetScroll !== false && mainScrollEl) mainScrollEl.scrollTop = 0;

        var seq = ++fetchSeq;
        fetchDrill(meta).then(function (drill) {
          if (seq !== fetchSeq) return;
          activeDrill = drill;
          initTimerForDrill(drill, true);
          renderLesson(resetScroll !== false);
        }).catch(function (err) {
          if (seq !== fetchSeq) return;
          if (contentEl) {
            contentEl.innerHTML = '<div class="loading-state">'
              + svgIcon("alert", 28)
              + '<div>Không tải được dữ liệu bộ đọc (' + esc(err && err.message ? err.message : "lỗi mạng") + ').</div>'
              + '<button type="button" class="btn btn-primary" id="btnRetryDrill">' + svgIcon("refresh", 14) + '<span>Thử tải lại</span></button>'
              + '</div>';
            var retry = document.getElementById("btnRetryDrill");
            if (retry) retry.addEventListener("click", function () { selectLesson(meta.id, false); });
          }
        });
      }

      /* ---------------- SCORE COMPUTATION ---------------- */
      function computeScore(drill) {
        var qs = Array.isArray(drill && drill.questions) ? drill.questions : [];
        var total = qs.length, correct = 0, answered = 0, flagCount = 0;
        for (var i = 0; i < qs.length; i++) {
          var chosen = answers[i];
          if (typeof chosen === "number") {
            answered++;
            if (chosen === Number(qs[i].ans)) correct++;
          }
          if (flagged[i]) flagCount++;
        }
        var pct = total > 0 ? Math.round((correct / total) * 100) : 0;
        return { correct: correct, total: total, answered: answered, pct: pct, flagCount: flagCount };
      }

      /* ---------------- PASSAGE RENDERER ---------------- */
      function genreIconName(genre) {
        if (genre === "email") return "mail";
        if (genre === "chat") return "chat";
        if (genre === "table") return "table";
        if (genre === "review") return "star";
        return "fileText";
      }

      function renderDocTable(tbl, isPart6) {
        if (!tbl || (!Array.isArray(tbl.headers) && !Array.isArray(tbl.rows))) return "";
        var headers = Array.isArray(tbl.headers) ? tbl.headers : [];
        var rows = Array.isArray(tbl.rows) ? tbl.rows : [];
        var capHtml = tbl.caption ? '<div class="doc-table-caption">' + renderPassageText(tbl.caption, isPart6) + '</div>' : "";
        var headHtml = headers.length
          ? '<thead><tr>' + headers.map(function (h) { return '<th>' + renderPassageText(h, isPart6) + '</th>'; }).join("") + '</tr></thead>'
          : "";
        var bodyHtml = rows.length
          ? '<tbody>' + rows.map(function (r) {
              var cells = Array.isArray(r) ? r : [r];
              return '<tr>' + cells.map(function (c) { return '<td>' + renderPassageText(c, isPart6) + '</td>'; }).join("") + '</tr>';
            }).join("") + '</tbody>'
          : "";
        var noteHtml = tbl.note ? '<div class="doc-table-note">' + renderPassageText(tbl.note, isPart6) + '</div>' : "";
        return '<div class="doc-table-wrap">'
          + capHtml
          + '<div class="doc-table-scroll"><table class="doc-table">' + headHtml + bodyHtml + '</table></div>'
          + noteHtml
          + '</div>';
      }

      function renderPassageCard(p, pIdx, isPart6) {
        var genre = String((p && p.genre) || "notice").toLowerCase();
        var genreLbl = GENRE_LABELS[genre] || genre.toUpperCase();
        var genreCls = genre === "chat" ? " is-chat" : (genre === "table" ? " is-table" : (genre === "ad" ? " is-ad" : (genre === "review" ? " is-review" : "")));
        var meta = (p && p.meta && typeof p.meta === "object") ? p.meta : {};
        var isHidden = activePassageTab !== "all" && String(activePassageTab) !== String(pIdx);

        var headerBlock = "";
        if (genre === "email" || (genre === "memo" && (meta.to || meta.from || meta.subject))) {
          var rows = [];
          if (meta.from) rows.push({ k: "From:", v: meta.from });
          if (meta.to) rows.push({ k: "To:", v: meta.to });
          if (meta.cc) rows.push({ k: "Cc:", v: meta.cc });
          if (meta.date) rows.push({ k: "Date:", v: meta.date });
          if (meta.subject) rows.push({ k: genre === "memo" ? "Re:" : "Subject:", v: meta.subject, subj: true });
          if (meta.title && !meta.subject) rows.push({ k: "Title:", v: meta.title, subj: true });
          if (rows.length) {
            headerBlock = '<div class="doc-email-meta">'
              + rows.map(function (r) {
                  return '<span class="doc-meta-k">' + esc(r.k) + '</span>'
                    + '<span class="doc-meta-v' + (r.subj ? " is-subj" : "") + '">' + renderPassageText(r.v, isPart6) + '</span>';
                }).join("")
              + '</div>';
          }
        } else {
          var titleStr = meta.title || meta.subject || meta.product || meta.channel || "";
          var subBits = [];
          if (meta.subtitle) subBits.push(meta.subtitle);
          if (meta.author) subBits.push("By " + meta.author);
          if (meta.reviewer) subBits.push("Reviewer: " + meta.reviewer);
          if (meta.from && !meta.to) subBits.push(meta.from);
          if (meta.source) subBits.push(meta.source);
          if (meta.date) subBits.push(meta.date);
          var ratingNum = Number(meta.rating || 0);
          var starsHtml = "";
          if (ratingNum > 0 && ratingNum <= 5) {
            starsHtml = '<div class="doc-stars" aria-label="' + ratingNum + '/5 sao">';
            for (var s = 0; s < 5; s++) {
              starsHtml += '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + (s < ratingNum ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
            }
            starsHtml += '</div>';
          }
          if (titleStr || subBits.length || starsHtml) {
            headerBlock = '<div class="doc-head-block">'
              + (titleStr ? '<h3 class="doc-title">' + renderPassageText(titleStr, isPart6) + '</h3>' : '')
              + (subBits.length ? '<div class="doc-sub">' + renderPassageText(subBits.join(" • "), isPart6) + '</div>' : '')
              + starsHtml
              + '</div>';
          }
          if (genre === "letter" && (meta.to || meta.from || meta.address)) {
            var lRows = [];
            if (meta.from) lRows.push({ k: "From:", v: meta.from });
            if (meta.to) lRows.push({ k: "To:", v: meta.to });
            if (meta.address) lRows.push({ k: "Address:", v: meta.address });
            if (lRows.length) {
              headerBlock += '<div class="doc-email-meta">'
                + lRows.map(function (r) {
                    return '<span class="doc-meta-k">' + esc(r.k) + '</span><span class="doc-meta-v">' + renderPassageText(r.v, isPart6) + '</span>';
                  }).join("")
                + '</div>';
            }
          }
        }

        // Chat Messages
        var chatHtml = "";
        if (Array.isArray(p.messages) && p.messages.length) {
          var senders = [];
          chatHtml = '<div class="chat-list">' + p.messages.map(function (msg) {
            var snd = String(msg.sender || "Staff");
            if (senders.indexOf(snd) === -1) senders.push(snd);
            var altCls = (senders.indexOf(snd) % 2 === 1) ? " is-alt" : "";
            return '<div class="chat-bubble' + altCls + '">'
              + '<div class="chat-meta">'
              +   '<span class="chat-sender">' + esc(snd) + '</span>'
              +   (msg.time ? '<span class="chat-time">' + esc(msg.time) + '</span>' : '')
              + '</div>'
              + '<div class="chat-text">' + renderPassageText(msg.text || "", isPart6) + '</div>'
              + '</div>';
          }).join("") + '</div>';
        }

        // Paragraphs
        var parasHtml = "";
        if (Array.isArray(p.paragraphs) && p.paragraphs.length) {
          parasHtml = p.paragraphs.map(function (para) {
            return '<p class="doc-p">' + renderPassageText(para, isPart6) + '</p>';
          }).join("");
        }

        // Embedded or Standalone Table
        var tableHtml = p.table ? renderDocTable(p.table, isPart6) : "";

        return '<article class="passage-card genre-' + esc(genre) + (isHidden ? " is-hidden" : "") + '" id="passage_' + esc(p.pid || ("p" + (pIdx + 1))) + '" data-p-idx="' + pIdx + '">'
          + '<div class="passage-card-bar">'
          +   '<span class="passage-bar-left">' + svgIcon(genreIconName(genre), 14) + '<span>' + esc(p.label || ("Văn bản " + (pIdx + 1))) + '</span></span>'
          +   '<span class="genre-badge' + genreCls + '">' + esc(genreLbl) + '</span>'
          + '</div>'
          + '<div class="passage-body">'
          +   headerBlock
          +   chatHtml
          +   parasHtml
          +   tableHtml
          + '</div>'
          + '</article>';
      }

      /* ---------------- SCORE BANNER & PARAPHRASE TABLE ---------------- */
      function renderScoreAndParaphraseHtml(drill, scoreInfo) {
        if (!graded || !drill) return "";
        var passed = scoreInfo.pct >= 70;
        var bannerHtml = '<div class="score-banner ' + (passed ? "is-pass" : "is-retry") + '" id="drillScoreBanner">'
          + '<span style="flex-shrink:0;margin-top:1px;">' + svgIcon(passed ? "award" : "alert", 19) + '</span>'
          + '<div style="flex:1;min-width:0;">'
          +   '<div>Kết quả: ' + scoreInfo.correct + '/' + scoreInfo.total + ' câu đúng (' + scoreInfo.pct + '%) • Thời gian: ' + formatClock(timerElapsedSec)
          +     (passed ? ' — Đạt chuẩn hoàn thành!' : ' — Cần >= 70% để hoàn thành')
          +   '</div>'
          +   '<div class="score-banner-sub">Đã mở 100% giải thích tiếng Việt'
          +     (Array.isArray(drill.paraphrases) && drill.paraphrases.length ? ', Bảng Paraphrase' : '')
          +     ' &amp; bật chế độ Tra từ (chạm vào từ tiếng Anh trong văn bản để xem nghĩa).</div>'
          + '</div>'
          + '</div>';

        var paraHtml = "";
        var paras = Array.isArray(drill.paraphrases) ? drill.paraphrases : [];
        if (paras.length) {
          paraHtml = '<section class="para-card" id="paraphraseCard" aria-label="Bảng đối chiếu từ khóa Paraphrase">'
            + '<div class="para-head">'
            +   '<span class="para-title">' + svgIcon("layers", 15) + '<span>Bảng Đối chiếu Từ khóa Paraphrase</span></span>'
            +   '<span class="meta-pill is-part">' + paras.length + ' cặp</span>'
            + '</div>'
            + '<table class="para-table">'
            +   '<thead><tr><th>Trong Văn bản</th><th>Trong Đáp án</th><th>Nghĩa tiếng Việt</th></tr></thead>'
            +   '<tbody>'
            +   paras.map(function (pr) {
                  return '<tr>'
                    + '<td data-label="Văn bản" class="para-en-src">' + wrapWordsMarkup(pr.text || "") + '</td>'
                    + '<td data-label="Đáp án" class="para-en-ans">' + wrapWordsMarkup(pr.answer || "") + '</td>'
                    + '<td data-label="Nghĩa Việt" class="rd-para-vi">' + esc(pr.vi || "") + '</td>'
                    + '</tr>';
                }).join("")
            +   '</tbody>'
            + '</table>'
            + '</section>';
        }

        return bannerHtml + paraHtml;
      }

      /* ---------------- QUESTION CARDS & MINI PALETTE ---------------- */
      function renderPaletteHtml(drill, scoreInfo) {
        var qs = Array.isArray(drill.questions) ? drill.questions : [];
        var pills = qs.map(function (q, qIdx) {
          var num = Number(q.num) || (qIdx + 1);
          var cls = "q-pal-btn";
          var chosen = answers[qIdx];
          if (graded) {
            cls += (chosen === Number(q.ans)) ? " is-correct" : " is-wrong";
          } else if (typeof chosen === "number") {
            cls += " is-answered";
          }
          if (flagged[qIdx]) cls += " is-flagged";
          return '<button type="button" class="' + cls + '" data-jump-q="' + num + '" data-pal-idx="' + qIdx + '" title="Câu ' + num + (flagged[qIdx] ? ' (Đang cắm cờ)' : '') + '">' + num + '</button>';
        }).join("");

        return '<div class="cbt-palette-bar" id="cbtPaletteBar">'
          + '<div class="pal-left"><span class="pal-label">Câu:</span>' + pills + '</div>'
          + '<span class="pal-stat" id="palStatText">Đã chọn ' + scoreInfo.answered + '/' + scoreInfo.total
          +   (scoreInfo.flagCount > 0 ? (' • ' + scoreInfo.flagCount + ' cờ') : '')
          + '</span>'
          + '</div>';
      }

      function renderQuestionPrompt(rawPrompt, qIdx, q) {
        var str = String(rawPrompt || "");
        if (activeDrill && activeDrill.part === "part6") {
          return esc(str);
        }
        if (str.indexOf("_____") === -1) {
          return wrapWordsMarkup(str);
        }
        var chosen = answers[qIdx];
        var opts = Array.isArray(q.opts) ? q.opts : [];
        var fillText = (typeof chosen === "number" && opts[chosen]) ? cleanOptionText(opts[chosen]) : "_____";
        var chunks = str.split("_____");
        return chunks.map(function (ch) { return wrapWordsMarkup(ch); })
          .join('<span class="q-blank-slot" data-blank-slot="' + qIdx + '">' + esc(fillText) + '</span>');
      }

      function renderQuestionCardsHtml(drill) {
        var qs = Array.isArray(drill.questions) ? drill.questions : [];
        var passages = Array.isArray(drill.passages) ? drill.passages : [];
        return '<div class="q-list" id="questionList">' + qs.map(function (q, qIdx) {
          var num = Number(q.num) || (qIdx + 1);
          var chosen = answers[qIdx];
          var isFlagged = Boolean(flagged[qIdx]);
          var isRight = graded && chosen === Number(q.ans);
          var cardCls = "q-card"
            + (isFlagged ? " is-flagged" : "")
            + (graded ? (isRight ? " is-graded-right" : " is-graded-wrong") : "");

          var tagTxt = String(q.tag || "").trim();
          var isCrossTag = /nối chéo|điền câu|suy luận/i.test(tagTxt);

          var passageRefHtml = "";
          if (q.passageId && passages.length > 1) {
            var pMatchIdx = passages.findIndex(function (p) { return p.pid === q.passageId; });
            if (pMatchIdx >= 0) {
              passageRefHtml = '<button type="button" class="q-passage-ref" data-jump-passage="' + pMatchIdx + '" title="Mở Văn bản ' + (pMatchIdx + 1) + '">VB ' + (pMatchIdx + 1) + '</button>';
            }
          }

          var opts = Array.isArray(q.opts) ? q.opts.slice(0, 4) : [];
          var optsHtml = opts.map(function (opt, oIdx) {
            var oCls = "q-opt";
            if (!graded && chosen === oIdx) oCls += " selected";
            if (graded) {
              if (oIdx === Number(q.ans)) oCls += " correct";
              else if (chosen === oIdx && oIdx !== Number(q.ans)) oCls += " wrong";
            }
            return '<button type="button" class="' + oCls + '" data-pick-q="' + qIdx + '" data-pick-opt="' + oIdx + '"' + (graded ? " disabled" : "") + '>'
              + '<span class="q-opt-letter">' + LETTERS[oIdx] + '</span>'
              + '<span>' + wrapWordsMarkup(cleanOptionText(opt)) + '</span>'
              + '</button>';
          }).join("");

          var expHtml = "";
          if (graded) {
            var ansLetter = LETTERS[Number(q.ans)] || "A";
            expHtml = '<div class="q-exp-box ' + (isRight ? "is-ok" : "is-err") + '">'
              + '<div class="q-exp-head">' + svgIcon(isRight ? "check" : "info", 13)
              +   '<span>' + (isRight ? ("Chính xác • Đáp án (" + ansLetter + ")") : ("Đáp án đúng: (" + ansLetter + ")")) + '</span>'
              + '</div>'
              + '<div>' + esc(q.exp || "") + '</div>'
              + '</div>';
          }

          return '<article class="' + cardCls + '" id="qCard_' + num + '" data-q-idx="' + qIdx + '">'
            + '<div class="q-card-head">'
            +   '<div class="q-head-left">'
            +     '<span class="q-num-pill">Câu ' + num + '</span>'
            +     (tagTxt ? '<span class="q-tag-pill' + (isCrossTag ? " is-cross" : "") + '">' + esc(tagTxt) + '</span>' : '')
            +     passageRefHtml
            +   '</div>'
            +   '<button type="button" class="q-flag-btn' + (isFlagged ? " is-flagged" : "") + '" data-flag-q="' + qIdx + '" aria-pressed="' + (isFlagged ? "true" : "false") + '" title="Cắm cờ xem lại câu ' + num + '">'
            +     svgIcon("flag", 12)
            +     '<span>' + (isFlagged ? "Đã cắm cờ" : "Xem lại") + '</span>'
            +   '</button>'
            + '</div>'
            + '<div class="q-prompt">' + renderQuestionPrompt(q.q, qIdx, q) + '</div>'
            + '<div class="quiz-opts">' + optsHtml + '</div>'
            + expHtml
            + '</article>';
        }).join("") + '</div>';
      }

      /* ---------------- MAIN LESSON RENDER ---------------- */
      function renderLesson(resetScroll) {
        if (!contentEl) return;
        if (!activeDrill) {
          if (!ALL_LESSONS.length) {

      /* ---------------- IN-PLACE QUESTION / PALETTE / DICT UPDATES ---------------- */
      function syncPaletteAndStats() {
        if (!activeDrill) return;
        var sc = computeScore(activeDrill);
        var qs = activeDrill.questions || [];
        for (var i = 0; i < qs.length; i++) {
          var btn = contentEl ? contentEl.querySelector('.q-pal-btn[data-pal-idx="' + i + '"]') : null;
          if (!btn) continue;
          var chosen = answers[i];
          btn.classList.toggle("is-flagged", Boolean(flagged[i]));
          btn.classList.remove("is-answered", "is-correct", "is-wrong");
          if (graded) {
            btn.classList.add(chosen === Number(qs[i].ans) ? "is-correct" : "is-wrong");
          } else if (typeof chosen === "number") {
            btn.classList.add("is-answered");
          }
        }
        var stat = document.getElementById("palStatText");
        if (stat) {
          stat.textContent = "Đã chọn " + sc.answered + "/" + sc.total + (sc.flagCount > 0 ? (" • " + sc.flagCount + " cờ") : "");
        }
      }

      function setDictMode(enable, silent) {
        dictModeEnabled = Boolean(enable);
        if (contentEl) {
          var words = contentEl.querySelectorAll(".rd-w[data-word]");
          for (var i = 0; i < words.length; i++) {
            var w = words[i];
            if (dictModeEnabled) {
              w.classList.add("tap-word");
              w.setAttribute("role", "button");
              w.setAttribute("tabindex", "0");
            } else {
              w.classList.remove("tap-word", "is-active");
              w.removeAttribute("role");
              w.removeAttribute("tabindex");
            }
          }
        }
        var btn = document.getElementById("btnToggleDictMode");
        if (btn) {
          btn.classList.toggle("active", dictModeEnabled);
          btn.setAttribute("aria-pressed", dictModeEnabled ? "true" : "false");
        }
        if (!silent) {
          showToast("info", dictModeEnabled ? "Đã bật Tra từ: chạm vào từ tiếng Anh bất kỳ để tra nghĩa & nghe UK/US/AU." : "Đã tắt chế độ Tra từ.", 2100);
        }
      }

      function jumpToQuestion(num) {
        if (!contentEl) return;
        if (window.innerWidth <= 820 && cbtMobileView === "left") {
          setMobileView("split");
        }
        var card = document.getElementById("qCard_" + num);
        if (!card) return;
        try { card.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
        card.classList.add("is-focused");
        setTimeout(function () { card.classList.remove("is-focused"); }, 1400);
      }

      function setPassageTab(tabVal) {
        activePassageTab = String(tabVal || "all");
        if (!contentEl) return;
        var tabs = contentEl.querySelectorAll(".p-tab-btn[data-passage-tab]");
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle("active", tabs[i].getAttribute("data-passage-tab") === activePassageTab);
        }
        var cards = contentEl.querySelectorAll(".passage-card[data-p-idx]");
        for (var j = 0; j < cards.length; j++) {
          var idxStr = cards[j].getAttribute("data-p-idx");
          cards[j].classList.toggle("is-hidden", activePassageTab !== "all" && idxStr !== activePassageTab);
        }
        var ls = document.getElementById("cbtLeftScroll");
        if (ls) ls.scrollTop = 0;
        hideHlPopover();
      }

      function setMobileView(mode) {
        cbtMobileView = (mode === "left" || mode === "right") ? mode : "split";
        var sp = document.getElementById("cbtSplitArea");
        if (sp) {
          sp.classList.remove("mob-view-split", "mob-view-left", "mob-view-right");
          sp.classList.add("mob-view-" + cbtMobileView);
        }
        if (contentEl) {
          var tabs = contentEl.querySelectorAll(".cbt-mob-tab[data-mob-view]");
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mob-view") === cbtMobileView);
          }
        }
        hideHlPopover();
      }

      function setFontSize(sz) {
        cbtFontSize = (sz === "sm" || sz === "lg") ? sz : "md";
        if (contentEl) {
          contentEl.classList.remove("cbt-font-sm", "cbt-font-md", "cbt-font-lg");
          contentEl.classList.add("cbt-font-" + cbtFontSize);
          var btns = contentEl.querySelectorAll("[data-set-font]");
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle("active", btns[i].getAttribute("data-set-font") === cbtFontSize);

      function gradeActiveDrill() {
        if (!activeDrill) return;
        graded = true;
        pauseTimer();
        setDictMode(true, true);

        var sc = computeScore(activeDrill);
        var resSlot = document.getElementById("cbtResultsSlot");
        if (resSlot) {
          resSlot.innerHTML = renderScoreAndParaphraseHtml(activeDrill, sc);
        }

        // Re-render only question cards in place so user highlights in .cbt-left stay intact!
        var qListOld = document.getElementById("questionList");
        if (qListOld) {
          var tmp = document.createElement("div");
          tmp.innerHTML = renderQuestionCardsHtml(activeDrill);
          if (tmp.firstElementChild) qListOld.replaceWith(tmp.firstElementChild);
        }

        syncPaletteAndStats();
        syncP6BlankChips();

        if (sc.pct >= 70) {
          if (!completedMap[activeDrill.id]) {
            setLessonDone(activeDrill.id, true, true);
            showToast("success", "Chúc mừng! Đạt " + sc.correct + "/" + sc.total + " (" + sc.pct + "%) — Đã hoàn thành bộ đọc!", 2800);
          } else {
            showToast("success", "Xuất sắc! Bạn đạt " + sc.correct + "/" + sc.total + " (" + sc.pct + "%).", 2200);
          }
        } else {
          showToast("warn", "Đúng " + sc.correct + "/" + sc.total + " (" + sc.pct + "%). Xem giải thích & Bảng Paraphrase bên dưới nhé!", 2600);
        }

        if (window.innerWidth <= 820 && cbtMobileView === "left") {
          setMobileView("right");
        }
        var rs = document.getElementById("cbtRightScroll");
        if (rs) rs.scrollTop = 0;
        else if (mainScrollEl) mainScrollEl.scrollTop = 0;
      }

      function resetActiveDrill() {
        if (!activeDrill) return;
        answers = {};
        flagged = {};
        graded = false;
        dictModeEnabled = false;
        activePassageTab = "all";
        hideHlPopover();
        closeDictPopup();
        initTimerForDrill(activeDrill, true);
        renderLesson(true);
      }

      /* ---------------- DRAGGABLE SPLIT-SCREEN RESIZER (22% - 78%) ---------------- */
      var resizerGlobalsBound = false;
      var isDraggingResizer = false;

      function bindSplitResizer() {
        var resizer = document.getElementById("cbtResizer");
        if (!resizer) return;

        function startDrag(e) {
          if (window.innerWidth <= 820) return;
          isDraggingResizer = true;
          resizer.classList.add("dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          hideHlPopover();
          if (e && e.cancelable) e.preventDefault();
        }

        resizer.onmousedown = startDrag;
        resizer.addEventListener("touchstart", function (e) {
          if (e.touches && e.touches.length === 1) startDrag(e);
        }, { passive: false });
        resizer.ondblclick = function () {
          cbtLeftPct = 52;
          var lp = document.getElementById("cbtLeftPane");
          if (lp) lp.style.setProperty("--cbt-left-pct", "52%");
        };
        resizer.onkeydown = function (e) {
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            e.preventDefault();
            cbtLeftPct = Math.max(22, Math.min(78, cbtLeftPct + (e.key === "ArrowLeft" ? -3 : 3)));
            var lp = document.getElementById("cbtLeftPane");
            if (lp) lp.style.setProperty("--cbt-left-pct", cbtLeftPct + "%");
          }
        };

        if (resizerGlobalsBound) return;
        resizerGlobalsBound = true;

        function doDrag(clientX) {
          if (!isDraggingResizer) return;
          var sp = document.getElementById("cbtSplitArea");
          var lp = document.getElementById("cbtLeftPane");
          if (!sp || !lp) return;
          var rect = sp.getBoundingClientRect();
          if (!rect.width) return;
          var pct = Math.max(22, Math.min(78, Math.round(((clientX - rect.left) / rect.width) * 100)));
          cbtLeftPct = pct;
          lp.style.setProperty("--cbt-left-pct", pct + "%");
        }

        function endDrag() {
          if (!isDraggingResizer) return;
          isDraggingResizer = false;
          var r = document.getElementById("cbtResizer");
          if (r) r.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        }

        window.addEventListener("mousemove", function (e) {
          if (isDraggingResizer) doDrag(e.clientX);
        });
        window.addEventListener("mouseup", endDrag);
        window.addEventListener("touchmove", function (e) {
          if (isDraggingResizer && e.touches && e.touches.length === 1) {
            doDrag(e.touches[0].clientX);
            if (e.cancelable) e.preventDefault();
          }
        }, { passive: false });
        window.addEventListener("touchend", endDrag);
        window.addEventListener("touchcancel", endDrag);
      }

      /* ---------------- PASSAGE HIGHLIGHT TOOL (IN-RAM <mark class="cbt-hl">) ---------------- */
      var lastHlRange = null;

      function isRangeInLeftPane(range) {
        var leftScroll = document.getElementById("cbtLeftScroll");
        if (!range || !leftScroll || range.collapsed) return false;
        if (!range.startContainer || !range.startContainer.isConnected) return false;
        if (!leftScroll.contains(range.commonAncestorContainer)) return false;
        return Boolean(range.toString().trim());
      }

      function hideHlPopover() {
        if (hlPopoverEl) hlPopoverEl.style.display = "none";
      }

      function positionHlPopover(range) {
        if (!hlPopoverEl || !range) return;
        var rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) {
          hideHlPopover();
          return;
        }
        hlPopoverEl.style.display = "inline-flex";
        var pw = hlPopoverEl.offsetWidth || 168;
        var ph = hlPopoverEl.offsetHeight || 38;
        var top = rect.top - ph - 8;
        if (top < 54) top = rect.bottom + 8;
        if (top + ph > window.innerHeight - 8) top = Math.max(54, window.innerHeight - ph - 8);
        var left = Math.max(8, Math.min(window.innerWidth - pw - 8, rect.left + rect.width / 2 - pw / 2));
        hlPopoverEl.style.top = Math.round(top) + "px";
        hlPopoverEl.style.left = Math.round(left) + "px";
      }

      function updateHlCountUI() {
        var leftScroll = document.getElementById("cbtLeftScroll");
        var btn = document.getElementById("btnClearAllHl");
        var lbl = document.getElementById("hlCountLbl");
        if (!btn) return;
        var cnt = leftScroll ? leftScroll.querySelectorAll("mark.cbt-hl").length : 0;
        btn.classList.toggle("has-hl", cnt > 0);
        if (lbl) lbl.textContent = "Xóa HL (" + cnt + ")";
      }

      function unwrapMark(m) {
        if (!m || !m.parentNode) return;
        var p = m.parentNode;
        while (m.firstChild) p.insertBefore(m.firstChild, m);
        p.removeChild(m);
        p.normalize();
      }

      function applyHighlightToRange(range) {
        if (!isRangeInLeftPane(range)) return;
        var leftScroll = document.getElementById("cbtLeftScroll");
        var root = range.commonAncestorContainer;
        if (root.nodeType === 3) root = root.parentNode;

        var textNodes = [];
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while ((node = walker.nextNode())) {
          if (!node.nodeValue || !node.nodeValue.trim()) continue;
          if (!leftScroll.contains(node)) continue;
          var parentEl = node.parentElement;
          if (!parentEl) continue;
          if (parentEl.closest("button, .p6-blank-chip, mark.cbt-hl")) continue;
          try {
            if (range.intersectsNode(node)) textNodes.push(node);
          } catch (e) {}
        }

        for (var i = 0; i < textNodes.length; i++) {
          var tn = textNodes[i];
          var start = (tn === range.startContainer) ? range.startOffset : 0;
          var end = (tn === range.endContainer) ? range.endOffset : tn.nodeValue.length;
          if (end <= start) continue;
          var targetNode = tn;
          if (end < targetNode.nodeValue.length) targetNode.splitText(end);
          if (start > 0) targetNode = targetNode.splitText(start);
          var mark = document.createElement("mark");
          mark.className = "cbt-hl";
          targetNode.parentNode.insertBefore(mark, targetNode);
          mark.appendChild(targetNode);
        }

        lastHlRange = null;
        var sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        updateHlCountUI();
      }

      function removeHighlightFromRange(range) {
        var leftScroll = document.getElementById("cbtLeftScroll");
        if (!leftScroll) return;
        var marks = leftScroll.querySelectorAll("mark.cbt-hl");
        var removed = 0;
        if (range && isRangeInLeftPane(range)) {
          for (var i = 0; i < marks.length; i++) {
            try {
              if (range.intersectsNode(marks[i])) {
                unwrapMark(marks[i]);
                removed++;
              }
            } catch (e) {}
          }
        }
        if (removed === 0 && marks.length > 0) {
          for (var j = 0; j < marks.length; j++) unwrapMark(marks[j]);
          removed = marks.length;
        }
        lastHlRange = null;
        var sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        updateHlCountUI();
        if (removed > 0) showToast("info", "Đã xóa Highlight.", 1500);
      }

        held: "hold", sent: "send", paid: "pay", made: "make", wrote: "write", written: "write",
        took: "take", taken: "take", gave: "give", given: "give", spoke: "speak", spoken: "speak",

      function loadScriptOnce(src) {
        return new Promise(function (resolve) {
          var existing = document.querySelector('script[data-lazy-vocab="' + src + '"]');
          if (existing) {
            if (existing.dataset.loaded === "1") return resolve(true);
            existing.addEventListener("load", function () { resolve(true); }, { once: true });
            existing.addEventListener("error", function () { resolve(false); }, { once: true });
            return;
          }
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.dataset.lazyVocab = src;
          s.onload = function () { s.dataset.loaded = "1"; resolve(true); };
          s.onerror = function () { resolve(false); };
          document.head.appendChild(s);
        });
      }

      function buildVocabLookupMaps() {
        vocabMap = new Map();
        vocabWfMap = new Map();
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        [1, 2, 3, 4].forEach(function (lv) {
          var list = chunks[lv];
          if (!Array.isArray(list)) return;
          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            if (!item || !item.word) continue;
            var key = normalizeDictWord(item.word);
            if (key && !vocabMap.has(key)) vocabMap.set(key, item);
            if (Array.isArray(item.wf)) {
              for (var j = 0; j < item.wf.length; j++) {
                var wfHead = normalizeDictWord(String(item.wf[j] || "").replace(/\([^)]*\)/g, ""));
                if (wfHead && !vocabWfMap.has(wfHead)) vocabWfMap.set(wfHead, item);
              }
            }
          }
        });
      }

      function ensureToeicVocabLoaded() {
        if (vocabMap) return Promise.resolve(vocabMap);
        if (vocabLoadPromise) return vocabLoadPromise;
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        var jobs = [1, 2, 3, 4].map(function (lv) {
          if (Array.isArray(chunks[lv]) && chunks[lv].length) return Promise.resolve(true);
          return loadScriptOnce("../vocab/data/vocab_u_" + lv + ".js?v=1");
        });
        vocabLoadPromise = Promise.all(jobs).then(function () {
          buildVocabLookupMaps();
          return vocabMap;
        });
        return vocabLoadPromise;
      }

      function lookupToeicWord(rawWord) {
        if (!vocabMap) return null;
        var w = normalizeDictWord(rawWord);
        if (!w) return null;
        if (vocabMap.has(w)) return { entry: vocabMap.get(w), via: "" };

        var candidates = [];
        if (w.endsWith("'s")) candidates.push(w.slice(0, -2));
        if (IRREGULAR_LEMMAS[w]) candidates.push(IRREGULAR_LEMMAS[w]);
        if (w.endsWith("ies") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("es") && w.length > 3) candidates.push(w.slice(0, -2));
        if (w.endsWith("s") && w.length > 2) candidates.push(w.slice(0, -1));
        if (w.endsWith("ied") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("ed") && w.length > 3) {
          var stemEd = w.slice(0, -2);
          candidates.push(stemEd, stemEd + "e");
          if (stemEd.length >= 3 && stemEd.charAt(stemEd.length - 1) === stemEd.charAt(stemEd.length - 2)) {
            candidates.push(stemEd.slice(0, -1));
          }
        }
        if (w.endsWith("ing") && w.length > 4) {
          var stemIng = w.slice(0, -3);
          candidates.push(stemIng, stemIng + "e");
          if (stemIng.length >= 3 && stemIng.charAt(stemIng.length - 1) === stemIng.charAt(stemIng.length - 2)) {
            candidates.push(stemIng.slice(0, -1));
          }
        }
        if (w.endsWith("ly") && w.length > 4) {
          candidates.push(w.slice(0, -2));
          if (w.endsWith("ily")) candidates.push(w.slice(0, -3) + "y");
        }
        if (w.endsWith("er") && w.length > 4) candidates.push(w.slice(0, -2), w.slice(0, -1));
        if (w.endsWith("est") && w.length > 5) candidates.push(w.slice(0, -3), w.slice(0, -2));

        for (var i = 0; i < candidates.length; i++) {
          var c = candidates[i];
          if (c && vocabMap.has(c)) return { entry: vocabMap.get(c), via: c };
        }
        if (vocabWfMap && vocabWfMap.has(w)) {
          var wfEntry = vocabWfMap.get(w);
          return { entry: wfEntry, via: wfEntry.word };
        }
        return null;
      }

      function speakDictWord(word, accent) {
        var clean = String(word || "").trim();
        if (!clean) return;
        var lang = accent === "en-GB" ? "en-GB" : (accent === "en-AU" ? "en-AU" : "en-US");
        var audioUrl = "";
        if (currentDictEntry && normalizeDictWord(currentDictEntry.word) === normalizeDictWord(clean)) {
          if (lang === "en-GB" && currentDictEntry.localUkAudio) audioUrl = currentDictEntry.localUkAudio;
          else if (lang === "en-US" && currentDictEntry.localUsAudio) audioUrl = currentDictEntry.localUsAudio;
          if (audioUrl && audioUrl.indexOf("media/") === 0) audioUrl = "../vocab/" + audioUrl;
        }
        if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
          window.S4UI.speakEnglish(clean, { lang: lang, rate: 0.95, audioUrl: audioUrl });
          return;
        }
        if ("speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function") {
          try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(clean);
            u.lang = lang;
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
          } catch (e) {}
        }
      }

      function openDictPopup(rawWord, anchorEl) {
        var clean = String(rawWord || "").trim();
        if (!clean) return;
        hideHlPopover();
        var prevAct = contentEl ? contentEl.querySelectorAll(".tap-word.is-active") : [];
        for (var i = 0; i < prevAct.length; i++) prevAct[i].classList.remove("is-active");
        if (anchorEl) anchorEl.classList.add("is-active");

        var modal = document.getElementById("toeicDictPopup");
        if (!modal) return;
        modal.classList.add("open");

        var seq = ++dictOpenSeq;
        if (vocabMap) {
          var hitNow = lookupToeicWord(clean);
          renderDictPopupContent(clean, hitNow, false);
          return;
        }
        renderDictPopupContent(clean, null, true);
        ensureToeicVocabLoaded().then(function () {
          if (seq !== dictOpenSeq) return;
          var hit = lookupToeicWord(clean);
          renderDictPopupContent(clean, hit, false);
        });
      }

          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            currentSearchQuery = searchInput.value || "";
            renderSidebar();
          }, 160);
        });
      }

      /* ---------------- INIT FROM URL QUERY ---------------- */
      (function init() {
        var sp = null;
        try { sp = new URLSearchParams(window.location.search); } catch (e) {}

        var reqLv = sp ? Number(sp.get("level") || 0) : 0;
        if (reqLv >= 1 && reqLv <= 4) {
          currentLevelFilter = reqLv;
          openLevels = new Set([reqLv]);
        }

        var rawPart = sp ? String(sp.get("part") || "").trim().toLowerCase() : "";
        var mappedPart = PART_ALIASES[rawPart] || rawPart;
        if (mappedPart && PART_FILTERS.some(function (p) { return p.id === mappedPart; })) {
          currentPartFilter = mappedPart;
        }

        var reqQ = sp ? String(sp.get("q") || "").trim() : "";
        if (reqQ && searchInput) {
          currentSearchQuery = reqQ;
          searchInput.value = reqQ;
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") {
            window.S4UI.syncSearchClear(searchInput);
          }
        }

        var reqId = sp ? String(sp.get("id") || "").trim() : "";
        var picked = null;
        if (reqId) {
          picked = ALL_LESSONS.find(function (x) { return x.id === reqId; }) || null;
        }
        if (!picked && (currentLevelFilter > 0 || currentPartFilter !== "all")) {
          var filteredInit = getFilteredLessons();
          if (filteredInit.length) picked = filteredInit[0];
        }
        if (!picked) {
          var saved = "";
          try { saved = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
          if (saved) picked = ALL_LESSONS.find(function (x) { return x.id === saved; }) || null;
        }
        if (!picked && ALL_LESSONS.length) {
          picked = ALL_LESSONS[0];
        }

        if (picked) {
          openLevels = new Set([Number(picked.level) || 1]);
          selectLesson(picked.id, true);
          if (listEl) {
            var actItem = listEl.querySelector(".lesson-item.active");
            if (actItem && typeof actItem.scrollIntoView === "function") {
              try { actItem.scrollIntoView({ block: "nearest" }); } catch (e) {}
            }
          }
        } else {
          renderSidebar();
          renderLesson(true);
        }
      })();
    })();
  </script>
</body>
</html>
