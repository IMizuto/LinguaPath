        var html = isDone
          ? (svgIcon("check", 14) + "<span>Đã hoàn thành</span>")
          : (svgIcon("target", 14) + "<span>Đánh dấu hoàn thành</span>");
        ["btnToggleDone", "btnFooterDone"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            el.classList.toggle("completed", isDone);
            el.innerHTML = html;
          }
        });
      }

      /* ---------------- SKILL SWITCHER & SIDEBAR RENDER ---------------- */
      function syncSkillTabUI() {
        var spBtn = document.getElementById("tabSkillSpeaking");
        var wrBtn = document.getElementById("tabSkillWriting");
        if (spBtn) {
          spBtn.classList.toggle("active", activeSkill === "speaking");
          spBtn.setAttribute("aria-selected", activeSkill === "speaking" ? "true" : "false");
        }
        if (wrBtn) {
          wrBtn.classList.toggle("active", activeSkill === "writing");
          wrBtn.setAttribute("aria-selected", activeSkill === "writing" ? "true" : "false");
        }
        if (sbSkillTabsEl) {
          var btns = sbSkillTabsEl.querySelectorAll("[data-sb-skill]");
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle("active", btns[i].getAttribute("data-sb-skill") === activeSkill);
          }
        }
      }

      function getFilteredSets(ignoreSkillWhenSearch) {
        var q = String(searchQuery || "").trim().toLowerCase();
        return ALL_SETS.filter(function (s) {
          if (!(ignoreSkillWhenSearch && q) && s.skill !== activeSkill) return false;
          if (filterLevel > 0 && Number(s.level) !== filterLevel) return false;
          if (filterTaskType !== "all" && s.taskType !== filterTaskType) return false;
          if (q) {
            var hay = [s.id, s.code, s.title, s.topic, s.targetBand, s.taskType].join(" ").toLowerCase();
            if (window.S4UI && typeof window.S4UI.matchesSearch === "function") {
              return window.S4UI.matchesSearch(hay, q);
            }
            return hay.indexOf(q) !== -1;
          }
          return true;
        });
      }

      function renderSidebarFilters() {
        if (levelTabsEl) {
          var lvHtml = '<button type="button" class="level-tab' + (filterLevel === 0 ? " active" : "") + '" data-lv="0">Tất cả</button>';
          [1, 2, 3, 4].forEach(function (lv) {
            lvHtml += '<button type="button" class="level-tab' + (filterLevel === lv ? " active" : "") + '" data-lv="' + lv + '">Chặng ' + lv + '</button>';
          });
          levelTabsEl.innerHTML = lvHtml;
        }
        if (taskTypeTabsEl) {
          var types = TASK_TYPES_LIST.filter(function (t) { return t.skill === activeSkill; });
          var ttHtml = '<button type="button" class="part-tab' + (filterTaskType === "all" ? " active" : "") + '" data-tt="all">Tất cả</button>';
          types.forEach(function (t) {
            ttHtml += '<button type="button" class="part-tab' + (filterTaskType === t.id ? " active" : "") + '" data-tt="' + esc(t.id) + '">' + esc(t.code || t.shortLabel) + '</button>';
          });
          taskTypeTabsEl.innerHTML = ttHtml;
        }
      }

      function renderSidebar() {
        syncSkillTabUI();
        renderSidebarFilters();
        if (!listEl) return;

        var items = getFilteredSets(true);
        if (!items.length) {
          listEl.innerHTML = '<div class="loading-state" style="padding:24px 10px;font-size:12.6px;">Không tìm thấy bài luyện phù hợp bộ lọc.</div>';
          return;
        }

        var html = "";
        var skillSets = items.filter(function (s) { return s.skill === activeSkill; });
        var otherSets = items.filter(function (s) { return s.skill !== activeSkill; });

        function renderSetButton(s) {
          var isAct = activeSetMeta && activeSetMeta.id === s.id;
          var isDone = Boolean(completedMap[s.id]);
          var lastSub = getLatestScoreBySetId(s.id);
          return '<button type="button" class="lesson-item' + (isAct ? " active" : "") + '" data-set-id="' + esc(s.id) + '">'
            + '<div class="lesson-item-left">'
            +   '<span class="lesson-code-badge">' + esc(s.code || (s.skill === "speaking" ? "SP" : "WR")) + '</span>'
            +   '<div class="lesson-item-body">'
            +     '<span class="lesson-item-title">' + esc(s.title) + '</span>'
            +     '<div class="lesson-item-sub">'
            +       '<span>L' + esc(s.level) + '</span>'
            +       '<span>&bull; ' + esc(s.itemCount || 1) + ' mục</span>'
            +       '<span>&bull; ' + esc(s.estMinutes || 10) + 'p</span>'
            +       (lastSub ? '<span class="sb-score-pill">' + esc(lastSub.score200) + '/200</span>' : '')
            +     '</div>'
            +   '</div>'
            + '</div>'
            + (isDone ? '<span class="done-dot" title="Đã hoàn thành">' + svgIcon("check", 14) + '</span>' : '')
            + '</button>';
        }

        if (skillSets.length) {
          html += '<div class="sb-group-hdr"><span>' + (activeSkill === "speaking" ? "Speaking • Q1–11" : "Writing • Q1–8") + '</span><span>' + skillSets.length + ' bài</span></div>';
          html += skillSets.map(renderSetButton).join("");
        }
        if (otherSets.length) {
          html += '<div class="sb-group-hdr" style="margin-top:8px;"><span>Kỹ năng còn lại</span><span>' + otherSets.length + ' bài</span></div>';
          html += otherSets.map(renderSetButton).join("");
        }
        listEl.innerHTML = html;
      }

      /* ---------------- TIMER ENGINE ---------------- */
      function stopAllTimers() {
        timerRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function getCurrentItem() {
        if (!activeSetData || !Array.isArray(activeSetData.items)) return null;
        return activeSetData.items[activeItemIdx] || activeSetData.items[0] || null;
      }

      function getCurrentSubQuestion(item) {
        if (!item || !Array.isArray(item.subQuestions) || !item.subQuestions.length) return null;
        return item.subQuestions[activeSubIdx] || item.subQuestions[0] || null;
      }

      function getSpeakingDurations(item, subQ) {
        var prep = Number(subQ && subQ.prepSec != null ? subQ.prepSec : (item && item.prepSec != null ? item.prepSec : 30));
        var resp = Number(subQ && subQ.respSec != null ? subQ.respSec : (item && item.respSec != null ? item.respSec : 45));
        return { prepSec: Math.max(0, prep), respSec: Math.max(5, resp) };
      }

      function initSpeakingTimer(item, subQ) {
        stopAllTimers();
        var d = getSpeakingDurations(item, subQ);
        timerMode = "idle";
        timerTotalSec = d.prepSec > 0 ? d.prepSec : d.respSec;
        timerRemainSec = timerTotalSec;
        timerFree = false;
        updateTimerDom();
      }

      function initWritingTimer(setData, item) {
        stopAllTimers();
        var mins = (setData && setData.taskType === "wr_sim")
          ? (Number(setData.estMinutes) || 35)
          : (Number(item && item.durationMin) || Number(setData && setData.estMinutes) || 10);
        timerMode = "writing";
        timerTotalSec = Math.max(60, Math.round(mins * 60));
        timerRemainSec = timerTotalSec;
        timerFree = false;
        updateTimerDom();
      }

      function startSpeakingPrepOrToggle() {
        var item = getCurrentItem();
        if (!item) return;
        var subQ = getCurrentSubQuestion(item);
        var d = getSpeakingDurations(item, subQ);
        if (timerRunning) {
          stopAllTimers();
          updateTimerDom();
          return;
        }
        if (timerMode === "idle" || timerMode === "done") {
          if (d.prepSec > 0) {
            timerMode = "prep";
            timerTotalSec = d.prepSec;
            timerRemainSec = d.prepSec;
          } else {
            timerMode = "resp";
            timerTotalSec = d.respSec;
            timerRemainSec = d.respSec;
            playCueBeep(880, 180);
          }
        }
        runSpeakingTick(d);
      }

      function skipSpeakingPrep() {
        var item = getCurrentItem();
        if (!item) return;
        var subQ = getCurrentSubQuestion(item);
        var d = getSpeakingDurations(item, subQ);
        stopAllTimers();
        timerMode = "resp";
        timerTotalSec = d.respSec;
        timerRemainSec = d.respSec;
        playCueBeep(880, 180);
        runSpeakingTick(d);
      }

      function runSpeakingTick(d) {
        stopAllTimers();
        timerRunning = true;
        updateTimerDom();
        timerInterval = setInterval(function () {
          if (!timerRunning) return;
          if (timerRemainSec > 0) {
            timerRemainSec--;
          }
          if (timerRemainSec <= 0) {
            if (timerMode === "prep") {
              playCueBeep(880, 180);
              timerMode = "resp";
              timerTotalSec = d.respSec;
              timerRemainSec = d.respSec;
              showToast("info", "Hết thời gian chuẩn bị — Bắt đầu trả lời!", 2200);
            } else {
              stopAllTimers();
              timerMode = "done";
              timerRemainSec = 0;
              playCueBeep(520, 260);
              if (isRecording) stopVoiceRecording();
              showToast("success", "Đã hết thời gian trả lời! Bạn có thể nghe lại hoặc bấm Chấm điểm.", 2800);
            }
          }
          updateTimerDom();
        }, 1000);
      }

      function toggleWritingTimer() {
        if (timerFree) {
          timerFree = false;
        }
        if (timerRunning) {
          stopAllTimers();
          updateTimerDom();
          return;
        }
        if (timerRemainSec <= 0) timerRemainSec = timerTotalSec;
        timerRunning = true;
        updateTimerDom();
        timerInterval = setInterval(function () {
          if (!timerRunning) return;
          if (timerRemainSec > 0) timerRemainSec--;
          if (timerRemainSec <= 0) {
            stopAllTimers();
            playCueBeep(520, 240);
            showToast("warn", "Đã hết thời gian quy chuẩn! Hãy kiểm tra lại và bấm Chấm điểm.", 3000);
          }
          updateTimerDom();
        }, 1000);
      }

      function updateTimerDom() {
        var clockEl = document.getElementById("swTimerClock");
        var phaseEl = document.getElementById("swPhaseBadge");
        var fillEl = document.getElementById("swTimerFill");
        var startBtn = document.getElementById("btnTimerStart");
        var skipBtn = document.getElementById("btnTimerSkip");
        var freeBtn = document.getElementById("btnTimerFree");

        if (clockEl) {
          clockEl.textContent = timerFree ? "--:--" : formatClock(timerRemainSec);
          clockEl.classList.toggle("is-urgent", !timerFree && timerRunning && timerRemainSec <= 10 && (timerMode === "resp" || timerMode === "writing"));
        }
        if (phaseEl) {
          phaseEl.classList.remove("is-prep", "is-resp", "is-done", "is-writing");
          if (timerMode === "prep") {
            phaseEl.classList.add("is-prep");
            phaseEl.textContent = "Chuẩn bị";
          } else if (timerMode === "resp") {
            phaseEl.classList.add("is-resp");
            phaseEl.textContent = "Đang trả lời";
          } else if (timerMode === "done") {
            phaseEl.classList.add("is-done");
            phaseEl.textContent = "Hoàn tất";
          } else if (timerMode === "writing") {
            phaseEl.classList.add("is-writing");
            phaseEl.textContent = timerFree ? "Chế độ tự do" : (timerRunning ? "Đang tính giờ" : "Đồng hồ viết");
          } else {
            phaseEl.textContent = "Sẵn sàng";
          }
        }
        if (fillEl) {
          var pct = (!timerFree && timerTotalSec > 0)
            ? Math.min(100, Math.max(0, Math.round(((timerTotalSec - timerRemainSec) / timerTotalSec) * 100)))
            : 0;
          fillEl.style.width = pct + "%";
          fillEl.classList.toggle("is-resp", timerMode === "resp");
          fillEl.classList.toggle("is-done", timerMode === "done");
        }
        if (startBtn) {
          startBtn.innerHTML = timerRunning
            ? (svgIcon("pause", 13) + "<span>Tạm dừng</span>")
            : (svgIcon("play", 13) + "<span>" + (timerMode === "prep" || timerMode === "resp" ? "Tiếp tục" : "Bắt đầu") + "</span>");
        }
        if (skipBtn) {
          skipBtn.disabled = timerMode === "resp";
        }
        if (freeBtn) {
          freeBtn.classList.toggle("active", timerFree);
        }
      }

      /* ---------------- RECORDING, WAVEFORM, ACOUSTICS & STT ---------------- */
      function stopWaveformDraw() {
        if (waveRafId) {
          cancelAnimationFrame(waveRafId);
          waveRafId = 0;
        }
        if (waveSourceNode) {
          try { waveSourceNode.disconnect(); } catch (e) {}
          waveSourceNode = null;
        }
        waveAnalyser = null;
        drawIdleWave();
      }

      function drawIdleWave() {
        var cv = document.getElementById("spWaveCanvas");
        if (!cv || !cv.getContext) return;
        var ctx = cv.getContext("2d");
        var w = cv.width, h = cv.height;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
      }

      function startWaveformDraw(stream) {
        stopWaveformDraw();
        try {
          var audioCtx = (window.S4Whisper && typeof window.S4Whisper.getSharedAudioContext === "function")
            ? window.S4Whisper.getSharedAudioContext()
            : null;
          if (!audioCtx) return;
          waveAnalyser = audioCtx.createAnalyser();
          waveAnalyser.fftSize = 256;
          waveSourceNode = audioCtx.createMediaStreamSource(stream);
          waveSourceNode.connect(waveAnalyser);
          var dataArr = new Uint8Array(waveAnalyser.frequencyBinCount);

          function renderFrame() {
            if (!isRecording || !waveAnalyser) return;
            var cv = document.getElementById("spWaveCanvas");
            if (cv && cv.getContext) {
              var ctx = cv.getContext("2d");
              var w = cv.width, h = cv.height;
              waveAnalyser.getByteTimeDomainData(dataArr);
              ctx.clearRect(0, 0, w, h);
              ctx.lineWidth = 2.2;
              ctx.strokeStyle = "#e11d48";
              ctx.beginPath();
              var sliceW = w / dataArr.length;
              var x = 0;
              for (var i = 0; i < dataArr.length; i++) {
                var v = dataArr[i] / 128.0;
                var y = (v * h) / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceW;
              }
              ctx.lineTo(w, h / 2);
              ctx.stroke();
            }
            waveRafId = requestAnimationFrame(renderFrame);
          }
          renderFrame();
        } catch (e) {}
      }

      function releaseMediaStream() {
        stopWaveformDraw();
        if (mediaStream) {
          try {
            mediaStream.getTracks().forEach(function (t) { t.stop(); });
          } catch (e) {}
          mediaStream = null;
        }
      }

      function stopSttRecognition() {
        isSttRunning = false;
        if (sttRecognition) {
          try { sttRecognition.onend = null; sttRecognition.stop(); } catch (e) {}
          sttRecognition = null;
        }
        syncRecorderButtonsUI();
      }

      function startSttRecognition() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (typeof SR !== "function") {
          showToast("info", "Trình duyệt chưa hỗ trợ nhận diện giọng nói trực tiếp. Bạn có thể ghi âm dùng Whisper hoặc gõ trực tiếp vào ô văn bản.", 3200);
          return;
        }
        if (isSttRunning) {
          stopSttRecognition();
          return;
        }
        var ta = document.getElementById("spTranscriptInput");
        sttBaseText = ta ? String(ta.value || "").trim() : "";
        try {
          sttRecognition = new SR();
          sttRecognition.lang = accentToLang(currentAccent);
          sttRecognition.continuous = true;
          sttRecognition.interimResults = true;
          sttRecognition.onresult = function (ev) {
            var finalChunk = "";
            var interimChunk = "";
            for (var i = 0; i < ev.results.length; i++) {
              var tr = ev.results[i][0] ? ev.results[i][0].transcript : "";
              if (ev.results[i].isFinal) finalChunk += tr + " ";
              else interimChunk += tr;
            }
            var combined = (sttBaseText ? (sttBaseText + " ") : "") + (finalChunk + interimChunk).trim();
            var inp = document.getElementById("spTranscriptInput");
            if (inp) {
              inp.value = combined.trim();
              handleSpeakingTranscriptChange(inp.value, false);
            }
          };
          sttRecognition.onerror = function () {
            stopSttRecognition();
          };
          sttRecognition.onend = function () {
            isSttRunning = false;
            sttRecognition = null;
            syncRecorderButtonsUI();
          };
          isSttRunning = true;
          sttRecognition.start();
          syncRecorderButtonsUI();
          showToast("info", "Đang nghe và chuyển giọng nói thành văn bản...", 1800);
        } catch (e) {
          stopSttRecognition();
        }
      }

      function startVoiceRecording() {
        if (isRecording) {
          stopVoiceRecording();
          return;
        }
        if (!window.S4Whisper || typeof window.S4Whisper.acquireVoiceStream !== "function") {
          showToast("warn", "Không tìm thấy mô-đun ghi âm S4Whisper. Bạn vẫn có thể gõ bài nói trực tiếp vào ô văn bản.", 3000);
          return;
        }
        var item = getCurrentItem();
        var draftKey = getDraftKey(item, activeSubIdx);
        var setId = activeSetMeta ? activeSetMeta.id : "";

        window.S4Whisper.acquireVoiceStream().then(function (stream) {
          mediaStream = stream;
          mediaChunks = [];
          try {
            mediaRecorder = window.S4Whisper.createVoiceRecorder(stream);
          } catch (err) {
            releaseMediaStream();
            showToast("warn", "Thiết bị không hỗ trợ MediaRecorder. Bạn có thể gõ trực tiếp bài nói.", 2800);
            return;
          }
          mediaRecorder.ondataavailable = function (ev) {
            if (ev && ev.data && ev.data.size > 0) mediaChunks.push(ev.data);
          };
          mediaRecorder.onstop = function () {
            var elapsedSec = Math.max(0.5, (Date.now() - recStartTs) / 1000);
            var mime = (mediaRecorder && mediaRecorder._lpPreferredMime) || "audio/webm";
            var blob = new Blob(mediaChunks, { type: mime });
            releaseMediaStream();
            isRecording = false;
            syncRecorderButtonsUI();

            if (!blob || blob.size === 0) return;
            var prev = recordedClips[setId + "::" + draftKey];
            if (prev && prev.url) {
              try { URL.revokeObjectURL(prev.url); } catch (e) {}
            }
            var url = URL.createObjectURL(blob);
            var clip = { url: url, blob: blob, durationFallback: elapsedSec, acoustics: null };
            recordedClips[setId + "::" + draftKey] = clip;
            renderAudioClipBox(clip);

            if (window.S4Whisper && typeof window.S4Whisper.analyzeBlobAcoustics === "function") {
              window.S4Whisper.analyzeBlobAcoustics(blob).then(function (ac) {
                clip.acoustics = ac;
                renderAudioClipBox(clip);
              }).catch(function () {});
            }
          };
          isRecording = true;
          recStartTs = Date.now();
          mediaRecorder.start(250);
          startWaveformDraw(stream);
          syncRecorderButtonsUI();
          showToast("info", "Đang ghi âm bài nói...", 1600);
        }).catch(function () {
          releaseMediaStream();
          isRecording = false;
          syncRecorderButtonsUI();
          showToast("warn", "Không thể truy cập micro. Hãy cấp quyền micro hoặc gõ trực tiếp bài nói ở ô bên dưới.", 3200);
        });
      }

      function stopVoiceRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          try { mediaRecorder.stop(); } catch (e) {}
        } else {
          releaseMediaStream();
          isRecording = false;
          syncRecorderButtonsUI();
        }
      }

      function runWhisperOnCurrentClip() {
        var item = getCurrentItem();
        if (!item || !activeSetMeta) return;
        var key = activeSetMeta.id + "::" + getDraftKey(item, activeSubIdx);
        var clip = recordedClips[key];
        if (!clip || !clip.blob) {
          showToast("info", "Hãy ghi âm trước khi nhận diện bằng Whisper.");
          return;
        }
        if (!window.S4Whisper || typeof window.S4Whisper.transcribeBlob !== "function") {
          showToast("warn", "Trình duyệt chưa hỗ trợ Whisper cục bộ.");
          return;
        }
        var btn = document.getElementById("btnSpWhisper");
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = svgIcon("waveform", 13) + "<span>Đang phân tích...</span>";
        }
        window.S4Whisper.transcribeBlob(clip.blob, { lang: "en" }).then(function (res) {
          if (res && res.ok && res.transcript) {
            var inp = document.getElementById("spTranscriptInput");
            if (inp) {
              inp.value = res.transcript.trim();
              handleSpeakingTranscriptChange(inp.value, true);
            }
            showToast("success", "Đã chuyển giọng nói thành văn bản!");
          } else {
            showToast("info", "Không nhận diện được lời nói rõ ràng từ bản ghi. Bạn có thể chỉnh sửa trực tiếp ô văn bản.", 3000);
          }
        }).catch(function () {
          showToast("warn", "Chưa thể chuyển âm tự động lúc này. Bạn hãy gõ trực tiếp vào ô văn bản.");
        }).finally(function () {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = svgIcon("waveform", 13) + "<span>Nhận diện từ bản ghi</span>";
          }
        });
      }

      function syncRecorderButtonsUI() {
        var recBtn = document.getElementById("btnSpRecord");
        if (recBtn) {
          recBtn.classList.toggle("is-recording", isRecording);
          recBtn.innerHTML = isRecording
            ? ('<span class="sw-rec-dot"></span><span>Dừng ghi âm</span>')
            : (svgIcon("mic", 14) + '<span>Ghi âm</span>');
        }
        var sttBtn = document.getElementById("btnSpStt");
        if (sttBtn) {
          sttBtn.classList.toggle("active", isSttRunning);
          sttBtn.innerHTML = isSttRunning
            ? (svgIcon("stop", 13) + '<span>Dừng nhận diện</span>')
            : (svgIcon("waveform", 13) + '<span>Nhận diện giọng nói</span>');
        }
      }

      function renderAudioClipBox(clip) {
        var wrap = document.getElementById("spAudioBoxWrap");
        var whBtn = document.getElementById("btnSpWhisper");
        if (whBtn) whBtn.style.display = (clip && clip.blob) ? "inline-flex" : "none";
        if (!wrap) return;
        if (!clip || !clip.url) {
          wrap.innerHTML = "";
          return;
        }
        var ac = clip.acoustics;
        var dur = (ac && Number(ac.durationSec) > 0) ? Number(ac.durationSec) : (Number(clip.durationFallback) || 0);
        var ta = document.getElementById("spTranscriptInput");
        var wc = countWords(ta ? ta.value : "");
        var wpm = (dur >= 1 && wc > 0) ? Math.round((wc / dur) * 60) : 0;
        var clarity = !ac ? "Đang đo..." : (ac.silent ? "Tín hiệu nhỏ / im lặng" : (ac.rms >= 0.03 ? "Rõ nét" : "Ổn định"));

        wrap.innerHTML =
          '<div class="sw-audio-box">'
          + '<audio controls preload="metadata" src="' + esc(clip.url) + '"></audio>'
          + '<div class="sw-acoustic-row">'
          +   '<span class="meta-pill is-info">Thời lượng: ' + dur.toFixed(1) + 's</span>'
          +   (wpm > 0 ? '<span class="meta-pill is-teal">Tốc độ nói: ' + wpm + ' WPM</span>' : '')
          +   '<span class="meta-pill ' + (ac && ac.silent ? 'is-rose' : 'is-ok') + '">Âm thanh: ' + esc(clarity) + '</span>'
          + '</div>'
          + '</div>';
      }

      function cleanupSessionMedia() {
        stopAllTimers();
        stopSpeech();
        stopSttRecognition();
        if (isRecording) stopVoiceRecording();
        releaseMediaStream();
      }

      /* ---------------- WRITING & SPEAKING ANALYSIS / GRADING ---------------- */
      function matchKeywordObj(text, kwObj) {
        var src = String(text || "");
        if (!src || !kwObj) return { matched: false, matchedForm: "" };
        var forms = [];
        if (kwObj.word) forms.push(String(kwObj.word));
        if (Array.isArray(kwObj.forms)) {
          for (var i = 0; i < kwObj.forms.length; i++) {
            if (kwObj.forms[i]) forms.push(String(kwObj.forms[i]));
          }
        }
        for (var j = 0; j < forms.length; j++) {
          var f = forms[j].trim();
          if (!f) continue;
          var re = new RegExp("(?:^|[^a-z0-9'])(" + escapeRegExp(f) + ")(?=$|[^a-z0-9'])", "i");
          var m = re.exec(src);
          if (m) return { matched: true, matchedForm: m[1] };
        }
        return { matched: false, matchedForm: "" };
      }

      function matchKeywordString(text, kw) {
        var src = String(text || "");
        var cleanKw = String(kw || "").trim();
        if (!src || !cleanKw) return false;
        var re = new RegExp("(?:^|[^a-z0-9'])" + escapeRegExp(cleanKw) + "(?:s|es|ed|ing)?(?=$|[^a-z0-9'])", "i");
        return re.test(src);
      }

      function computeReadAloudMatch(spoken, reference) {
        var refTokens = normalizeWordTokens(reference);
        var spkTokens = normalizeWordTokens(spoken);
        if (!refTokens.length) return { pct: 0, matched: 0, total: 0, missed: [] };
        var spkFreq = {};
        spkTokens.forEach(function (w) { spkFreq[w] = (spkFreq[w] || 0) + 1; });
        var matched = 0;
        var missed = [];
        refTokens.forEach(function (w) {
          if (spkFreq[w] > 0) {
            spkFreq[w]--;
            matched++;
          } else if (missed.indexOf(w) === -1 && w.length > 2) {
            missed.push(w);
          }
        });
        return {
          pct: Math.round((matched / refTokens.length) * 100),
          matched: matched,
          total: refTokens.length,
          missed: missed.slice(0, 12)
        };
      }

      function evaluateWrQ15Sentence(text, item) {
        var clean = String(text || "").trim();
        var wc = countWords(clean);
        var kws = Array.isArray(item.keywords) ? item.keywords : [];
        var kwResults = kws.map(function (k) { return matchKeywordObj(clean, k); });
        var kwHitCount = kwResults.filter(function (r) { return r.matched; }).length;
        var hasCap = /^[A-Z]/.test(clean);
        var hasEnd = /[.!?]$/.test(clean);
        var hasMinWords = wc >= 6;

        var raw3 = 0;
        if (wc >= 3 && kwHitCount >= 1) {
          if (kwHitCount === kws.length && hasMinWords && hasCap && hasEnd) {
            raw3 = 3;
          } else if (kwHitCount === kws.length && wc >= 5) {
            raw3 = 2;
          } else {
            raw3 = 1;
          }
        }
        return {
          wc: wc,
          kwResults: kwResults,
          kwHitCount: kwHitCount,
          kwTotal: kws.length,
          hasCap: hasCap,
          hasEnd: hasEnd,
          hasMinWords: hasMinWords,
          raw3: raw3
        };
      }

      function evaluateEmailTasks(text, item) {
        var clean = String(text || "");
        var low = clean.toLowerCase();
        var tasks = Array.isArray(item.tasks) ? item.tasks : [];
        return tasks.map(function (t) {
          var autoOk = false;
          if (t.checkType === "question" && clean.indexOf("?") !== -1) autoOk = true;
          if (!autoOk && Array.isArray(t.signals)) {
            for (var i = 0; i < t.signals.length; i++) {
              var sig = String(t.signals[i] || "").trim().toLowerCase();
              if (sig && low.indexOf(sig) !== -1) {
                autoOk = true;
                break;
              }
            }
          }
          var mKey = (activeSetMeta ? activeSetMeta.id : "") + "::" + (item.itemId || "") + "::" + (t.id || "");
          var manualOk = Boolean(manualEmailTasks[mKey]);
          return {
            task: t,
            manualKey: mKey,
            autoOk: autoOk,
            manualOk: manualOk,
            done: autoOk || manualOk
          };
        });
      }

      function evaluateWrQ67Email(text, item) {
        var clean = String(text || "").trim();
        var wc = countWords(clean);
        var minW = Number(item.minWords) || 80;
        var maxW = Number(item.maxWords) || 170;
        var hasGreeting = /\b(dear|hi|hello|good morning|good afternoon|to whom)\b/i.test(clean);
        var hasClosing = /\b(best regards|kind regards|warm regards|sincerely|regards|best wishes|thank you|thanks|yours truly)\b/i.test(clean);
        var taskChecks = evaluateEmailTasks(clean, item);
        var doneTasks = taskChecks.filter(function (x) { return x.done; }).length;
        var totalTasks = taskChecks.length || 1;
        var inWordRange = wc >= minW && wc <= maxW;

        var pct = 0;
        if (wc > 0) {
          var lenScore = wc >= minW ? (wc <= maxW + 40 ? 25 : 20) : Math.round((wc / minW) * 22);
          var greetScore = hasGreeting ? 15 : 0;
          var closeScore = hasClosing ? 15 : 0;
          var taskScore = Math.round((doneTasks / totalTasks) * 45);
          pct = Math.min(100, lenScore + greetScore + closeScore + taskScore);
        }
        var raw4 = pct >= 85 ? 4 : (pct >= 65 ? 3 : (pct >= 40 ? 2 : (pct >= 15 ? 1 : 0)));
        return {
          wc: wc,
          minW: minW,
          maxW: maxW,
          inWordRange: inWordRange,
          hasGreeting: hasGreeting,
          hasClosing: hasClosing,
          taskChecks: taskChecks,
          doneTasks: doneTasks,
          totalTasks: totalTasks,
          pct: pct,
          raw4: raw4
        };
      }

      function evaluateWrQ8Essay(text, item) {
        var clean = String(text || "").trim();
        var wc = countWords(clean);
        var sentences = countSentences(clean);
        var paragraphs = countParagraphs(clean);
        var minW = Number(item.minWords) || 300;
        var low = clean.toLowerCase();

        var foundConnectors = ACADEMIC_CONNECTORS.filter(function (c) {
          return new RegExp("(?:^|[^a-z])" + escapeRegExp(c) + "(?=$|[^a-z])", "i").test(low);
        });
        var tKws = Array.isArray(item.targetKeywords) ? item.targetKeywords : [];
        var hitKws = tKws.filter(function (k) { return matchKeywordString(clean, k); });

        var lenScore = wc >= minW ? 30 : Math.round((wc / minW) * 28);
        var paraScore = paragraphs >= 4 ? 20 : (paragraphs === 3 ? 14 : (paragraphs === 2 ? 8 : (wc > 0 ? 4 : 0)));
        var connScore = Math.min(25, foundConnectors.length * 5);
        var kwScore = tKws.length ? Math.min(25, Math.round((hitKws.length / Math.min(tKws.length, 6)) * 25)) : 20;
        var pct = wc === 0 ? 0 : Math.min(100, lenScore + paraScore + connScore + kwScore);
        var raw5 = pct >= 88 ? 5 : (pct >= 72 ? 4 : (pct >= 54 ? 3 : (pct >= 34 ? 2 : (pct >= 12 ? 1 : 0))));

        return {
          wc: wc,
          minW: minW,
          sentences: sentences,
          paragraphs: paragraphs,
          foundConnectors: foundConnectors,
          tKws: tKws,
          hitKws: hitKws,
          pct: pct,
          raw5: raw5
        };
      }

      function roundEts200(pct0to100) {
        var raw = Math.round((Math.max(0, Math.min(100, Number(pct0to100) || 0)) * 2) / 10) * 10;
        return Math.max(0, Math.min(200, raw));
      }

      function speakingProficiencyLabel(score200) {
        if (score200 >= 190) return "Proficiency Level 8/8 (Xuất sắc)";
        if (score200 >= 160) return "Proficiency Level 7/8 (Tốt)";
        if (score200 >= 130) return "Proficiency Level 6/8 (Khá tốt)";
        if (score200 >= 110) return "Proficiency Level 5/8 (Trung cấp)";
        if (score200 >= 80) return "Proficiency Level 4/8 (Cơ bản)";
        if (score200 >= 60) return "Proficiency Level 3/8 (Sơ cấp)";
        if (score200 >= 40) return "Proficiency Level 2/8 (Cần luyện thêm)";
        return "Proficiency Level 1/8 (Mới bắt đầu)";
      }

      function writingProficiencyLabel(score200) {
        if (score200 >= 200) return "Proficiency Level 9/9 (Xuất sắc)";
        if (score200 >= 190) return "Proficiency Level 8/9 (Rất tốt)";
        if (score200 >= 170) return "Proficiency Level 7/9 (Tốt)";
        if (score200 >= 140) return "Proficiency Level 6/9 (Khá tốt)";
        if (score200 >= 110) return "Proficiency Level 5/9 (Trung cấp)";
        if (score200 >= 80) return "Proficiency Level 4/9 (Cơ bản)";
        if (score200 >= 60) return "Proficiency Level 3/9 (Sơ cấp)";
        if (score200 >= 40) return "Proficiency Level 2/9 (Cần luyện thêm)";
        return "Proficiency Level 1/9 (Mới bắt đầu)";
      }

      function evaluateSpeakingItem(setId, item) {
        if (item.itemType === "sp_q12") {
          var tx = getDraftText(setId, getDraftKey(item, 0));
          var m = computeReadAloudMatch(tx, item.text || item.sample || "");
          var wc = countWords(tx);
          var scorePct = wc === 0 ? 0 : Math.min(100, Math.round(m.pct * 0.8 + Math.min(20, (wc / Math.max(1, m.total)) * 20)));
          return {
            hasWork: wc > 0,
            pct: scorePct,
            wc: wc,
            detail: m,
            summary: wc > 0
              ? ("Đọc to khớp " + m.pct + "% từ đoạn gốc (" + m.matched + "/" + m.total + " từ).")
              : "Chưa có bài nói/transcript cho đoạn đọc này."
          };
        }

        if (item.itemType === "sp_q57" || item.itemType === "sp_q810") {
          var sqs = Array.isArray(item.subQuestions) ? item.subQuestions : [];
          var subScores = [];
          var anyWork = false;
          var totalWc = 0;
          var totalKwHits = 0;
          var totalKwCount = 0;
          sqs.forEach(function (sq, idx) {
            var dk = String(item.itemId || "") + "__q" + (sq.qNum != null ? sq.qNum : (idx + 1));
            var tx = getDraftText(setId, dk);
            var wc = countWords(tx);
            totalWc += wc;
            if (wc > 0) anyWork = true;
            var targetW = Number(sq.respSec) >= 25 ? 25 : 12;
            var kws = Array.isArray(sq.keywords) ? sq.keywords : [];
            var hits = kws.filter(function (k) { return matchKeywordString(tx, k); }).length;
            totalKwHits += hits;
            totalKwCount += kws.length;
            var lenPart = wc === 0 ? 0 : Math.min(60, Math.round((wc / targetW) * 60));
            var kwPart = kws.length ? Math.round((hits / Math.min(kws.length, 3)) * 40) : (wc >= targetW ? 40 : 20);
            subScores.push(wc === 0 ? 0 : Math.min(100, lenPart + Math.min(40, kwPart)));
          });
          var answeredSub = subScores.filter(function (x) { return x > 0; });
          var avgPct = answeredSub.length
            ? Math.round((answeredSub.reduce(function (a, b) { return a + b; }, 0) / answeredSub.length) * (0.7 + 0.3 * (answeredSub.length / Math.max(1, sqs.length))))
            : 0;
          return {
            hasWork: anyWork,
            pct: avgPct,
            wc: totalWc,
            kwHits: totalKwHits,
            kwTotal: totalKwCount,
            summary: anyWork
              ? ("Đã trả lời " + answeredSub.length + "/" + sqs.length + " câu hỏi phụ (" + totalWc + " từ, khớp " + totalKwHits + "/" + totalKwCount + " từ khóa gợi ý).")
              : "Chưa có câu trả lời nào cho các câu hỏi phụ."
          };
        }

        // sp_q34 or sp_q11
        var txt = getDraftText(setId, getDraftKey(item, 0));
        var wc2 = countWords(txt);
        var targetWords = item.itemType === "sp_q11" ? 60 : 40;
        var tKws = Array.isArray(item.targetKeywords) ? item.targetKeywords : [];
        var hitKws = tKws.filter(function (k) { return matchKeywordString(txt, k); });
        var lenScore = wc2 === 0 ? 0 : Math.min(55, Math.round((wc2 / targetWords) * 55));
        var kwScore = tKws.length ? Math.min(35, Math.round((hitKws.length / Math.min(tKws.length, 5)) * 35)) : (wc2 >= 25 ? 30 : 15);
        var sentScore = countSentences(txt) >= 3 ? 10 : (countSentences(txt) >= 2 ? 6 : 0);
        var pct2 = wc2 === 0 ? 0 : Math.min(100, lenScore + kwScore + sentScore);
        return {
          hasWork: wc2 > 0,
          pct: pct2,
          wc: wc2,
          hitKws: hitKws,
          tKws: tKws,
          summary: wc2 > 0
            ? ("Độ dài bài nói: " + wc2 + " từ (mục tiêu >=" + targetWords + " từ), khớp " + hitKws.length + "/" + tKws.length + " từ khóa trọng tâm.")
            : "Chưa có bài nói/transcript cho mục này."
        };
      }

      function gradeActiveSet() {
        if (!activeSetData || !activeSetMeta) return;
        persistDraftsNow();
        var setId = activeSetMeta.id;
        var items = Array.isArray(activeSetData.items) ? activeSetData.items : [];
        var feedbacks = [];
        var finalScore200 = 0;
        var levelLabel = "";
        var scaleNote = "";

        if (activeSetData.skill === "speaking") {
          var evals = items.map(function (it) { return evaluateSpeakingItem(setId, it); });
          var worked = evals.filter(function (e) { return e.hasWork; });
          if (!worked.length) {
            showToast("warn", "Hãy ghi âm/nhận diện giọng nói hoặc gõ bài nói tiếng Anh vào ô văn bản trước khi chấm điểm!", 2800);
            return;
          }
          var avgAuto = Math.round(worked.reduce(function (a, b) { return a + b.pct; }, 0) / worked.length);
          var completeFactor = items.length > 1 ? (0.85 + 0.15 * (worked.length / items.length)) : 1;
          var adjustedAuto = Math.min(100, Math.round(avgAuto * completeFactor));

          var rubric = Array.isArray(activeSetData.rubric) ? activeSetData.rubric : [];
          var rubricScore = 0;
          if (rubricTouched && rubric.length) {
            rubric.forEach(function (r) {
              if (rubricChecked[r.id]) rubricScore += Number(r.weight) || 0;
            });
            adjustedAuto = Math.round(adjustedAuto * 0.65 + rubricScore * 0.35);
          } else if (rubric.length) {
            rubric.forEach(function (r, idx) {
              rubricChecked[r.id] = adjustedAuto >= (idx === 0 ? 50 : (idx === 1 ? 65 : 78));
            });
          }

          finalScore200 = Math.max(20, roundEts200(adjustedAuto));
          levelLabel = speakingProficiencyLabel(finalScore200);
          scaleNote = "Thang ETS Speaking 0–200 (bội số 10)";

          evals.forEach(function (ev, idx) {
            var it = items[idx];
            if (ev.hasWork) {
              feedbacks.push((items.length > 1 ? ("[" + (it.label || ("Mục " + (idx + 1))) + "] ") : "") + ev.summary);
              if (it.itemType === "sp_q12" && ev.detail && ev.detail.missed && ev.detail.missed.length) {
                feedbacks.push("Từ cần đọc rõ hơn: " + ev.detail.missed.slice(0, 6).join(", ") + ".");
              }
              if ((it.itemType === "sp_q34" || it.itemType === "sp_q11") && ev.tKws && ev.tKws.length) {
                var missing = ev.tKws.filter(function (k) { return ev.hitKws.indexOf(k) === -1; });
                if (missing.length) {
                  feedbacks.push("Gợi ý bổ sung từ khóa tăng điểm: " + missing.slice(0, 5).join(", ") + ".");
                }
              }
            }
          });
          if (worked.length < items.length) {
            feedbacks.push("Bạn đã hoàn thành " + worked.length + "/" + items.length + " mục trong bộ này. Luyện thêm các mục còn lại để sát điểm thi thật hơn.");
          }
          feedbacks.push("Đối chiếu với Bài mẫu Band 180–200 bên dưới và bấm chạm bất kỳ từ nào để tra nghĩa + nghe phát âm UK/US/AU.");
        } else {
          // WRITING GRADING
          var wScores = [];
          var workedCount = 0;
          var currentIt = getCurrentItem();

          items.forEach(function (it, idx) {
            var tx = getDraftText(setId, getDraftKey(it, 0));
            var wc = countWords(tx);
            if (wc === 0) return;
            workedCount++;
            if (it.itemType === "wr_q15") {
              var r15 = evaluateWrQ15Sentence(tx, it);
              var pct15 = Math.round((r15.raw3 / 3) * 100);
              wScores.push(pct15);
              var labelPrefix = items.length > 1 ? ("Câu " + (idx + 1) + ": ") : "";
              feedbacks.push(labelPrefix + "Đạt " + r15.raw3 + "/3 điểm ETS (khớp " + r15.kwHitCount + "/" + r15.kwTotal + " từ khóa, " + r15.wc + " từ"
                + (!r15.hasCap ? ", thiếu viết hoa đầu câu" : "")
                + (!r15.hasEnd ? ", thiếu dấu câu cuối" : "")
                + (!r15.hasMinWords ? ", nên viết tối thiểu 6 từ" : "") + ").");
            } else if (it.itemType === "wr_q67") {
              var r67 = evaluateWrQ67Email(tx, it);
              wScores.push(r67.pct);
              var lp67 = items.length > 1 ? ("Email " + (idx + 1) + ": ") : "";
              feedbacks.push(lp67 + "Đạt " + r67.raw4 + "/4 điểm ETS (" + r67.wc + " từ, nhiệm vụ " + r67.doneTasks + "/" + r67.totalTasks
                + (r67.hasGreeting ? ", có lời chào" : ", thiếu lời chào Dear/Hi")
                + (r67.hasClosing ? ", có lời kết" : ", thiếu lời kết Best regards/Sincerely") + ").");
            } else if (it.itemType === "wr_q8") {
              var r8 = evaluateWrQ8Essay(tx, it);
              wScores.push(r8.pct);
              feedbacks.push("Bài luận đạt " + r8.raw5 + "/5 điểm ETS: " + r8.wc + "/" + r8.minW + " từ, " + r8.paragraphs + " đoạn văn, " + r8.foundConnectors.length + " từ nối học thuật, khớp " + r8.hitKws.length + "/" + r8.tKws.length + " từ khóa chủ đề.");
              if (r8.wc < r8.minW) feedbacks.push("Cần mở rộng thêm khoảng " + (r8.minW - r8.wc) + " từ để đạt chuẩn tối thiểu " + r8.minW + " từ của ETS.");
              if (r8.paragraphs < 4) feedbacks.push("Nên chia rõ tối thiểu 4 đoạn (Mở bài — Thân bài 1 — Thân bài 2 — Kết bài) cách nhau bằng dòng trống.");
            }
          });

          if (!workedCount) {
            showToast("warn", "Hãy viết bài vào ô soạn thảo trước khi bấm Chấm điểm!", 2600);
            return;
          }

          var avgWr = Math.round(wScores.reduce(function (a, b) { return a + b; }, 0) / wScores.length);
          var cFactor = items.length > 1 ? (0.88 + 0.12 * (workedCount / items.length)) : 1;
          finalScore200 = Math.max(20, roundEts200(Math.min(100, Math.round(avgWr * cFactor))));
          levelLabel = writingProficiencyLabel(finalScore200);
          scaleNote = currentIt && currentIt.itemType === "wr_q15"
            ? "Thang ETS Q1–5 (0–3/câu) → Quy đổi 0–200"
            : (currentIt && currentIt.itemType === "wr_q67"
              ? "Thang ETS Q6–7 (0–4/email) → Quy đổi 0–200"
              : "Thang ETS Q8 (0–5/bài luận) → Quy đổi 0–200");

          if (workedCount < items.length) {
            feedbacks.push("Đã chấm " + workedCount + "/" + items.length + " mục. Bạn có thể chuyển sang các mục tiếp theo để hoàn tất trọn bộ.");
          }
        }

        lastGradeResult = {
          score200: finalScore200,
          levelLabel: levelLabel,
          scaleNote: scaleNote,
          feedbacks: feedbacks
        };
        showSample = true;

        saveSubmission({
          id: setId,
          skill: activeSetData.skill,
          taskType: activeSetData.taskType,
          score200: finalScore200,
          levelLabel: levelLabel,
          ts: Date.now()
        });
        setLessonDone(setId, true, true);
        renderActiveWorkspace();
        showToast("success", "Đã chấm " + finalScore200 + "/200 và lưu tiến độ!", 2600);

        var resEl = document.getElementById("swResultPanel");
        if (resEl && typeof resEl.scrollIntoView === "function") {
          try { resEl.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
        }
      }

      /* ---------------- LIVE INPUT UPDATERS (NO FULL RE-RENDER!) ---------------- */
      function handleSpeakingTranscriptChange(val, immediate) {
        var item = getCurrentItem();
        if (!item || !activeSetMeta) return;
        var dk = getDraftKey(item, activeSubIdx);
        setDraftText(activeSetMeta.id, dk, val, immediate);
        updateSpeakingLiveMetrics(item, val);
      }

      function updateSpeakingLiveMetrics(item, val) {
        var box = document.getElementById("spLiveStats");
        if (!box) return;
        var wc = countWords(val);
        var html = '<span class="sw-check-pill ' + (wc >= 10 ? "is-ok" : "") + '">Số từ: ' + wc + '</span>';
        if (item.itemType === "sp_q12") {
          var m = computeReadAloudMatch(val, item.text || item.sample || "");
          html += '<span class="sw-check-pill ' + (m.pct >= 75 ? "is-ok" : (m.pct >= 40 ? "is-warn" : "")) + '">Khớp đoạn gốc: ' + m.pct + '% (' + m.matched + '/' + m.total + ')</span>';
        } else if (item.itemType === "sp_q34" || item.itemType === "sp_q11") {
          var tKws = Array.isArray(item.targetKeywords) ? item.targetKeywords : [];
          var hits = tKws.filter(function (k) { return matchKeywordString(val, k); }).length;
          html += '<span class="sw-check-pill ' + (hits >= 3 ? "is-ok" : "") + '">Từ khóa: ' + hits + '/' + tKws.length + '</span>';
        } else if (item.itemType === "sp_q57" || item.itemType === "sp_q810") {
          var sq = getCurrentSubQuestion(item);
          var sqKws = (sq && Array.isArray(sq.keywords)) ? sq.keywords : [];
          var sqHits = sqKws.filter(function (k) { return matchKeywordString(val, k); }).length;
          if (sqKws.length) {
            html += '<span class="sw-check-pill ' + (sqHits >= 2 ? "is-ok" : "") + '">Ý chính gợi ý: ' + sqHits + '/' + sqKws.length + '</span>';
          }
        }
        box.innerHTML = html;
      }

      function handleWritingInputChange(val, immediate) {
        var item = getCurrentItem();
        if (!item || !activeSetMeta) return;
        var dk = getDraftKey(item, 0);
        setDraftText(activeSetMeta.id, dk, val, immediate);
        updateWritingLiveMetrics(item, val);
      }

      function updateWritingLiveMetrics(item, val) {
        if (!item) return;
        if (item.itemType === "wr_q15") {
          var r15 = evaluateWrQ15Sentence(val, item);
          var kwBar = document.getElementById("wrKwBar");
          if (kwBar && Array.isArray(item.keywords)) {
            kwBar.innerHTML = item.keywords.map(function (kw, idx) {
              var res = r15.kwResults[idx] || { matched: false, matchedForm: "" };
              return '<span class="sw-kw-chip' + (res.matched ? " is-matched" : "") + '" data-kw-idx="' + idx + '">'
                + (res.matched ? svgIcon("check", 14) : svgIcon("target", 13))
                + '<span>' + esc(kw.word) + '</span>'
                + (kw.pos ? '<span class="sw-kw-pos">(' + esc(kw.pos) + ')</span>' : '')
                + (res.matched && res.matchedForm && res.matchedForm.toLowerCase() !== String(kw.word || "").toLowerCase()
                  ? '<span class="sw-kw-pos">&rarr; ' + esc(res.matchedForm) + '</span>'
                  : '')
                + '</span>';
            }).join("");
          }
          var chk = document.getElementById("wrQ15Checks");
          if (chk) {
            chk.innerHTML =
              '<span class="sw-check-pill ' + (r15.kwHitCount === r15.kwTotal ? "is-ok" : "") + '">Từ khóa: ' + r15.kwHitCount + '/' + r15.kwTotal + '</span>'
              + '<span class="sw-check-pill ' + (r15.hasMinWords ? "is-ok" : "") + '">Số từ: ' + r15.wc + ' (tối thiểu 6)</span>'
              + '<span class="sw-check-pill ' + (r15.hasCap ? "is-ok" : "") + '">Viết hoa đầu câu</span>'
              + '<span class="sw-check-pill ' + (r15.hasEnd ? "is-ok" : "") + '">Dấu kết câu (. ? !)</span>';
          }
          return;
        }

        if (item.itemType === "wr_q67") {
          var r67 = evaluateWrQ67Email(val, item);
          var chk67 = document.getElementById("wrQ67Checks");
          if (chk67) {
            chk67.innerHTML =
              '<span class="sw-check-pill ' + (r67.inWordRange ? "is-ok" : (r67.wc > 0 ? "is-warn" : "")) + '">Số từ: ' + r67.wc + ' (chuẩn ' + r67.minW + '–' + r67.maxW + ')</span>'
              + '<span class="sw-check-pill ' + (r67.hasGreeting ? "is-ok" : "") + '">Lời chào (Dear/Hi)</span>'
              + '<span class="sw-check-pill ' + (r67.hasClosing ? "is-ok" : "") + '">Lời kết (Regards/Sincerely)</span>'
              + '<span class="sw-check-pill ' + (r67.doneTasks === r67.totalTasks ? "is-ok" : "") + '">Nhiệm vụ: ' + r67.doneTasks + '/' + r67.totalTasks + '</span>';
          }
          var taskBox = document.getElementById("wrEmailTasks");
          if (taskBox) {
            taskBox.innerHTML = renderEmailTaskRowsHtml(r67.taskChecks);
          }
          return;
        }

        if (item.itemType === "wr_q8") {
          var r8 = evaluateWrQ8Essay(val, item);
          var fill = document.getElementById("wrEssayFill");
          var lbl = document.getElementById("wrEssayWordLbl");
          var stats = document.getElementById("wrEssayStats");
          var kwChips = document.getElementById("wrEssayKws");
          var pct = Math.min(100, Math.round((r8.wc / r8.minW) * 100));
          if (fill) {
            fill.style.width = pct + "%";
            fill.classList.toggle("is-target", r8.wc >= r8.minW);
          }
          if (lbl) lbl.textContent = r8.wc + " / " + r8.minW + " từ (" + pct + "%)";
          if (stats) {
            stats.innerHTML =
              '<span class="sw-check-pill ' + (r8.wc >= r8.minW ? "is-ok" : "") + '">Số từ: ' + r8.wc + '</span>'
              + '<span class="sw-check-pill ' + (r8.sentences >= 10 ? "is-ok" : "") + '">Số câu: ' + r8.sentences + '</span>'
              + '<span class="sw-check-pill ' + (r8.paragraphs >= 4 ? "is-ok" : "") + '">Số đoạn: ' + r8.paragraphs + '/4</span>'
              + '<span class="sw-check-pill ' + (r8.foundConnectors.length >= 4 ? "is-ok" : "") + '">Từ nối học thuật: ' + r8.foundConnectors.length + '</span>'
              + '<span class="sw-check-pill ' + (r8.hitKws.length >= 4 ? "is-ok" : "") + '">Từ khóa chủ đề: ' + r8.hitKws.length + '/' + r8.tKws.length + '</span>';
          }
          if (kwChips && r8.tKws.length) {
            kwChips.innerHTML = r8.tKws.map(function (k) {
              var ok = r8.hitKws.indexOf(k) !== -1;
              return '<span class="sw-check-pill ' + (ok ? "is-ok" : "") + '">' + (ok ? svgIcon("check", 12) : "") + esc(k) + '</span>';
            }).join("");
          }
        }
      }

        return taskChecks.map(function (tc, i) {

          return '<div class="sw-task-row' + (tc.done ? " is-done" : "") + '">'
            + '<div class="sw-task-info">'
            +   '<div class="sw-task-lbl">' + (i + 1) + '. ' + esc(t.labelVi || t.id) + '</div>'
            +   (t.hintEn ? '<div class="sw-task-hint">Gợi ý: ' + esc(t.hintEn) + '</div>' : '')
            + '</div>'
            + '<button type="button" class="btn btn-xs' + (tc.done ? " btn-done completed" : "") + '" data-toggle-email-task="' + esc(tc.manualKey) + '">'
            +   (tc.done ? svgIcon("check", 12) : svgIcon("target", 12))
            +   '<span>' + (tc.autoOk ? "Tự nhận diện" : (tc.manualOk ? "Đã xác nhận" : "Đánh dấu đạt")) + '</span>'
            + '</button>'
            + '</div>';
        }).join("");

          rubricHtml = '<div class="sw-card">'

      function renderSamplePanelHtml(item) {

        var skillSets = ALL_SETS.filter(function (s) { return s.skill === setData.skill; });

      function selectSet(setId, resetScroll) {
        var meta = ALL_SETS.find(function (s) { return s.id === setId; });
        if (!meta) return;

        cleanupSessionMedia();
        activeSetMeta = meta;
        if (activeSkill !== meta.skill) {
          activeSkill = meta.skill;
          filterTaskType = "all";
        }
        activeItemIdx = 0;
        activeSubIdx = 0;
        showIntonation = false;
        showOutline = false;
        showSubVi = false;
        showSample = false;
        showKwHints = false;
        rubricChecked = {};
        rubricTouched = false;
        lastGradeResult = null;

        try { localStorage.setItem(LAST_KEY, meta.id); } catch (e) {}
        renderSidebar();

        if (setCache.has(meta.id)) {
          activeSetData = setCache.get(meta.id);
          var firstItem = getCurrentItem();

        held: "hold", sent: "send", paid: "pay", made: "make", wrote: "write", written: "write",
        took: "take", taken: "take", gave: "give", given: "give", spoke: "speak", spoken: "speak",

        chose: "choose", chosen: "choose", drove: "drive", driven: "drive", flew: "fly",

      function loadScriptOnce(src) {
        return new Promise(function (resolve) {
          var existing = document.querySelector('script[data-lazy-vocab="' + src + '"]');
          if (existing) {
            if (existing.dataset.loaded === "1") return resolve(true);
            existing.addEventListener("load", function () { resolve(true); }, { once: true });
            existing.addEventListener("error", function () { resolve(false); }, { once: true });
            return;
          }
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.dataset.lazyVocab = src;
          s.onload = function () { s.dataset.loaded = "1"; resolve(true); };
          s.onerror = function () { resolve(false); };
          document.head.appendChild(s);
        });
      }

      function buildVocabLookupMaps() {
        vocabMap = new Map();
        vocabWfMap = new Map();
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        [1, 2, 3, 4].forEach(function (lv) {
          var list = chunks[lv];
          if (!Array.isArray(list)) return;
          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            if (!item || !item.word) continue;
            var key = normalizeDictWord(item.word);
            if (key && !vocabMap.has(key)) vocabMap.set(key, item);
            if (Array.isArray(item.wf)) {
              for (var j = 0; j < item.wf.length; j++) {
                var wfHead = normalizeDictWord(String(item.wf[j] || "").replace(/\([^)]*\)/g, ""));
                if (wfHead && !vocabWfMap.has(wfHead)) vocabWfMap.set(wfHead, item);
              }
            }
          }
        });
      }

      function ensureToeicVocabLoaded() {
        if (vocabMap) return Promise.resolve(vocabMap);
        if (vocabLoadPromise) return vocabLoadPromise;
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        var jobs = [1, 2, 3, 4].map(function (lv) {
          if (Array.isArray(chunks[lv]) && chunks[lv].length) return Promise.resolve(true);
          return loadScriptOnce("../vocab/data/vocab_u_" + lv + ".js?v=1");
        });
        vocabLoadPromise = Promise.all(jobs).then(function () {
          buildVocabLookupMaps();
          return vocabMap;
        });
        return vocabLoadPromise;
      }

      function lookupToeicWord(rawWord) {
        if (!vocabMap) return null;
        var w = normalizeDictWord(rawWord);
        if (!w) return null;
        if (vocabMap.has(w)) return { entry: vocabMap.get(w), via: "" };
        var candidates = [];
        if (w.endsWith("'s")) candidates.push(w.slice(0, -2));
        if (IRREGULAR_LEMMAS[w]) candidates.push(IRREGULAR_LEMMAS[w]);
        if (w.endsWith("ies") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("es") && w.length > 3) candidates.push(w.slice(0, -2));
        if (w.endsWith("s") && w.length > 2) candidates.push(w.slice(0, -1));
        if (w.endsWith("ied") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("ed") && w.length > 3) {
          var stemEd = w.slice(0, -2);
          candidates.push(stemEd, stemEd + "e");
          if (stemEd.length >= 3 && stemEd.charAt(stemEd.length - 1) === stemEd.charAt(stemEd.length - 2)) {
            candidates.push(stemEd.slice(0, -1));
          }
        }
        if (w.endsWith("ing") && w.length > 4) {
          var stemIng = w.slice(0, -3);
          candidates.push(stemIng, stemIng + "e");
          if (stemIng.length >= 3 && stemIng.charAt(stemIng.length - 1) === stemIng.charAt(stemIng.length - 2)) {
            candidates.push(stemIng.slice(0, -1));
          }
        }
        if (w.endsWith("ly") && w.length > 4) {
          candidates.push(w.slice(0, -2));
          if (w.endsWith("ily")) candidates.push(w.slice(0, -3) + "y");
        }
        if (w.endsWith("er") && w.length > 4) candidates.push(w.slice(0, -2), w.slice(0, -1));
        if (w.endsWith("est") && w.length > 5) candidates.push(w.slice(0, -3), w.slice(0, -2));
        for (var i = 0; i < candidates.length; i++) {
          var c = candidates[i];
          if (c && vocabMap.has(c)) return { entry: vocabMap.get(c), via: c };
        }
        if (vocabWfMap && vocabWfMap.has(w)) {
          var wfEntry = vocabWfMap.get(w);
          return { entry: wfEntry, via: wfEntry.word };
        }
        return null;
      }

      function speakDictWord(word, accent) {
        var clean = String(word || "").trim();
        if (!clean) return;
        var lang = accent === "en-GB" ? "en-GB" : (accent === "en-AU" ? "en-AU" : "en-US");
        var audioUrl = "";
        if (currentDictEntry && normalizeDictWord(currentDictEntry.word) === normalizeDictWord(clean)) {
          if (lang === "en-GB" && currentDictEntry.localUkAudio) audioUrl = currentDictEntry.localUkAudio;
          else if (lang === "en-US" && currentDictEntry.localUsAudio) audioUrl = currentDictEntry.localUsAudio;
          if (audioUrl && audioUrl.indexOf("media/") === 0) audioUrl = "../vocab/" + audioUrl;
        }
        if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
          window.S4UI.speakEnglish(clean, { lang: lang, rate: 0.95, audioUrl: audioUrl });
          return;
        }
        speakText(clean, lang);
      }

          +   '</div>'

          + '<button type="button" class="btn btn-sm" id="btnCloseDictPopup" aria-label="Đóng tra từ">' + svgIcon("close", 13) + '<span>Đóng</span></button>'

      function openDictPopup(rawWord, anchorEl) {
        var clean = String(rawWord || "").trim();
        if (!clean) return;
        var prevAct = contentEl ? contentEl.querySelectorAll(".tap-word.is-active") : [];
        for (var i = 0; i < prevAct.length; i++) prevAct[i].classList.remove("is-active");
        if (anchorEl) anchorEl.classList.add("is-active");

        var modal = document.getElementById("toeicDictPopup");
        if (!modal) return;
        modal.classList.add("open");

        var seq = ++dictOpenSeq;
        if (vocabMap) {
          renderDictPopupContent(clean, lookupToeicWord(clean), false);
          return;
        }
        renderDictPopupContent(clean, null, true);
        ensureToeicVocabLoaded().then(function () {
          if (seq !== dictOpenSeq) return;
          renderDictPopupContent(clean, lookupToeicWord(clean), false);
        });
      }

          }
          var spkBtn = e.target.closest("[data-dict-spk]");
          if (spkBtn) {
            speakDictWord(currentDictWord, spkBtn.getAttribute("data-dict-spk"));
          }
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (dictModal && dictModal.classList.contains("open")) closeDictPopup();
          else if (document.body.classList.contains("sidebar-open")) window.toggleMenu(false);
        }
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 1024 && (document.body.classList.contains("sidebar-open") || (sidebarEl && sidebarEl.classList.contains("open")))) {
          window.toggleMenu(false);
        }
      });

      window.addEventListener("pagehide", function () { persistDraftsNow(); cleanupSessionMedia(); });
      window.addEventListener("beforeunload", function () { persistDraftsNow(); cleanupSessionMedia(); });

      // Search Bar Binding
      var searchTimer = null;
      if (window.S4UI && typeof window.S4UI.bindSearchBar === "function" && searchInput) {
        window.S4UI.bindSearchBar({
          input: searchInput,
          clearBtn: "searchInput_clear",
          searchBtn: "searchInput_btn",
          delay: 160,
          onSearch: function (val) {
            clearTimeout(searchTimer);
            searchQuery = val || "";
            renderSidebar();
          }
        });
      } else if (searchInput) {
        searchInput.addEventListener("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            searchQuery = searchInput.value || "";
            renderSidebar();
          }, 160);
        });
      }

      /* ---------------- INIT FROM URL QUERY ---------------- */
      (function init() {
        updateSummaryStats();
        var sp = null;
        try { sp = new URLSearchParams(window.location.search); } catch (e) {}

        var reqSkill = sp ? String(sp.get("skill") || "").trim().toLowerCase() : "";
        if (reqSkill === "speaking" || reqSkill === "writing") {
          activeSkill = reqSkill;
        }

        var reqLv = sp ? Number(sp.get("level") || 0) : 0;
        if (reqLv >= 1 && reqLv <= 4) {
          filterLevel = reqLv;
        }

        var reqTask = sp ? String(sp.get("task") || sp.get("taskType") || "").trim().toLowerCase() : "";
        if (reqTask && TASK_TYPES_LIST.some(function (t) { return t.id === reqTask; })) {
          filterTaskType = reqTask;
          var tObj = TASK_TYPES_LIST.find(function (t) { return t.id === reqTask; });
          if (tObj && tObj.skill) activeSkill = tObj.skill;
        }

        var reqId = sp ? String(sp.get("id") || "").trim() : "";
        var picked = null;
        if (reqId) {
          picked = ALL_SETS.find(function (s) { return s.id === reqId; }) || null;
          if (picked) activeSkill = picked.skill;
        }
        if (!picked && (reqSkill || filterLevel > 0 || filterTaskType !== "all")) {
          var filtered = getFilteredSets(false);
          if (filtered.length) picked = filtered[0];
        }
        if (!picked) {
          var saved = "";
          try { saved = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
          if (saved) picked = ALL_SETS.find(function (s) { return s.id === saved; }) || null;
          if (picked && !reqSkill) activeSkill = picked.skill;
        }
        if (!picked) {
          picked = ALL_SETS.find(function (s) { return s.skill === activeSkill; }) || ALL_SETS[0] || null;
        }

        renderSidebar();
        if (picked) {
          selectSet(picked.id, true);
        } else if (contentEl) {
          contentEl.innerHTML = '<div class="loading-state">Danh mục bài luyện (data/sw_manifest.js) đang được nạp. Hãy tải lại trang sau khi dữ liệu sẵn sàng.</div>';
        }
      })();
    })();
  </script>
</body>
</html>
