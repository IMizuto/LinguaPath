          + (filtered.length
            ? '<div class="mock-grid" id="mockGrid">' + cardsHtml + '</div>'
            : '<div class="lobby-hero-card lp-glass loading-state">'
              + svgIcon("search", 26)
              + '<div>Không có đề thi nào khớp bộ lọc hiện tại.</div>'
              + '<button type="button" class="btn btn-primary btn-sm" id="btnResetLobbyFilters">Hiện tất cả đề</button>'
              + '</div>');
      }

      /* ---------------- LAZY LOAD TEST & START EXAM ---------------- */
      function resolveTestUrl(meta) {
        var f = String((meta && meta.file) || "").trim();
        if (!f) return "data/tests/" + encodeURIComponent(meta.id) + ".json";
        if (/^(https?:|\/|data\/|\.\.?\/)/i.test(f)) return f;
        return "data/" + f.replace(/^\/+/, "");
      }

      function fetchTestJson(meta) {
        if (!meta || !meta.id) return Promise.reject(new Error("Thiếu mã đề thi"));
        if (testCache.has(meta.id)) return Promise.resolve(testCache.get(meta.id));
        return fetch(resolveTestUrl(meta), { cache: "default" }).then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        }).then(function (json) {
          testCache.set(meta.id, json);
          return json;
        });
      }

      function startExam(testId, opts) {
        var options = opts || {};
        var meta = ALL_TESTS.find(function (t) { return t.id === testId; });
        if (!meta) {
          showToast("error", "Không tìm thấy đề thi " + testId);
          return;
        }
        stopAudio(false);
        stopExamTimers();
        closeDictPopup();
        closeHistoryModal();
        switchScreen("exam");
        examShellEl.innerHTML = '<div class="exam-stage lp-glass loading-state">'
          + svgIcon("clock", 28)
          + '<div>Đang nạp đề thi ' + esc(meta.title) + '...</div>'
          + '</div>';

        var seq = ++fetchSeq;
        fetchTestJson(meta).then(function (testData) {
          if (seq !== fetchSeq) return;
          activeTestMeta = meta;
          activeTest = testData;
          examIndex = indexTestData(testData);
          groupHlHtmlMap = new Map();
          warn10Shown = false;
          warn5Shown = false;

          var draft = options.resumeDraft ? readDraft(testData.id) : null;
          if (!options.resumeDraft) clearDraft(testData.id);

          if (draft) {
            examMode = draft.mode === "practice" ? "practice" : "ets";
            examSection = draft.section === "reading" ? "reading" : "listening";
            examPart = Number(draft.part) || (examSection === "reading" ? 5 : 1);
            currentNum = Number(draft.currentNum) || 1;
            activeP6GroupIdx = Math.max(0, Math.min(Math.max(0, examIndex.p6.length - 1), Number(draft.activeP6GroupIdx) || 0));
            activeP7GroupIdx = Math.max(0, Math.min(Math.max(0, examIndex.p7.length - 1), Number(draft.activeP7GroupIdx) || 0));
            listeningLocked = Boolean(draft.listeningLocked);
            listeningRemainSec = Number.isFinite(Number(draft.listeningRemainSec)) ? Number(draft.listeningRemainSec) : (Number(testData.listeningMinutes || meta.listeningMinutes || 45) * 60);
            readingRemainSec = Number.isFinite(Number(draft.readingRemainSec)) ? Number(draft.readingRemainSec) : (Number(testData.readingMinutes || meta.readingMinutes || 75) * 60);
            elapsedSec = Number(draft.elapsedSec) || 0;
            answers = (draft.answers && typeof draft.answers === "object") ? Object.assign({}, draft.answers) : {};
            flagged = (draft.flagged && typeof draft.flagged === "object") ? Object.assign({}, draft.flagged) : {};
            playedAudio = (draft.playedAudio && typeof draft.playedAudio === "object") ? Object.assign({}, draft.playedAudio) : {};
            showToast("info", "Đã khôi phục bản nháp bài thi!", 2000);
          } else {
            examMode = options.mode || selectedMode || "ets";
            examSection = "listening";
            examPart = 1;
            currentNum = examIndex.allQuestions.length ? examIndex.allQuestions[0].num : 1;
            activeP6GroupIdx = 0;
            activeP7GroupIdx = 0;
            listeningLocked = false;
            listeningRemainSec = Number(testData.listeningMinutes || meta.listeningMinutes || (testData.isFull ? 45 : 12)) * 60;
            readingRemainSec = Number(testData.readingMinutes || meta.readingMinutes || (testData.isFull ? 75 : 18)) * 60;
            elapsedSec = 0;
            answers = {};
            flagged = {};
            playedAudio = {};
          }

          activeRate = 1.0;
          accentOverride = "auto";
          activePassageTab = "all";
          audioState.statusText = examMode === "ets"
            ? "Chế độ Thi thật ETS: tốc độ cố định 1.0x • Giọng US/UK/AU • Không tua lại"
            : "Chế độ Luyện thi linh hoạt: tùy chỉnh tốc độ 0.75x–1.25x & giọng đọc";
          audioState.progressPct = 0;

          renderExamRoom(true);
          startExamTimers();
        }).catch(function (err) {
          if (seq !== fetchSeq) return;
          examShellEl.innerHTML = '<div class="exam-stage lp-glass loading-state">'
            + svgIcon("alert", 28)
            + '<div>Không tải được tệp đề thi (' + esc(err && err.message ? err.message : "lỗi mạng") + ').</div>'
            + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">'
            +   '<button type="button" class="btn btn-primary" id="btnRetryLoadTest">' + svgIcon("refresh", 14) + '<span>Thử tải lại</span></button>'
            +   '<button type="button" class="btn" id="btnBackToLobbyErr">' + svgIcon("arrowLeft", 14) + '<span>Về Sảnh đề</span></button>'
            + '</div>'
            + '</div>';
          var retryBtn = document.getElementById("btnRetryLoadTest");
          if (retryBtn) retryBtn.addEventListener("click", function () { startExam(testId, options); });
          var backBtn = document.getElementById("btnBackToLobbyErr");
          if (backBtn) backBtn.addEventListener("click", function () { switchScreen("lobby"); renderLobby(); });
        });
      }

      /* ---------------- EXAM TIMERS & AUTO-DRAFT (10s) ---------------- */
      function stopExamTimers() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        if (draftInterval) { clearInterval(draftInterval); draftInterval = null; }
      }

      function currentSectionRemainSec() {
        return examSection === "listening" ? listeningRemainSec : readingRemainSec;
      }

      function updateExamTimerUI() {
        var rem = currentSectionRemainSec();
        var box = document.getElementById("examTimerPill");
        var txt = document.getElementById("examTimerText");
        if (txt) txt.textContent = formatClock(rem);
        if (box) {
          box.classList.remove("is-warn", "is-danger");
          if (rem <= 300) box.classList.add("is-danger");
          else if (rem <= 600) box.classList.add("is-warn");
        }
      }

      function startExamTimers() {
        stopExamTimers();
        updateExamTimerUI();
        timerInterval = setInterval(function () {
          if (activeScreen !== "exam" || !activeTest) return;
          elapsedSec++;
          if (examSection === "listening") {
            if (listeningRemainSec > 0) listeningRemainSec--;
            updateExamTimerUI();
            if (listeningRemainSec === 600 && !warn10Shown) {
              warn10Shown = true;
              showToast("warn", "Còn 10 phút cho phần Listening!", 2600);
            } else if (listeningRemainSec === 300 && !warn5Shown) {
              warn5Shown = true;
              showToast("error", "Còn 5 phút cuối phần Listening!", 2800);
            }
            if (listeningRemainSec <= 0) {
              showToast("warn", "Hết giờ phần Listening — Hệ thống tự động chuyển sang phần Reading!", 3000);
              switchToReading(true);
            }
          } else {
            if (readingRemainSec > 0) readingRemainSec--;
            updateExamTimerUI();
            if (readingRemainSec === 600 && !warn10Shown) {
              warn10Shown = true;
              showToast("warn", "Còn 10 phút cho phần Reading!", 2600);
            } else if (readingRemainSec === 300 && !warn5Shown) {
              warn5Shown = true;
              showToast("error", "Còn 5 phút cuối trước khi tự nộp bài!", 2800);
            }
            if (readingRemainSec <= 0) {
              showToast("warn", "Hết thời gian làm bài — Đang tự động chấm điểm!", 2600);
              submitExam(true);
            }
          }
        }, 1000);

        // Auto-save draft every 10 seconds
        draftInterval = setInterval(function () {
          saveDraft(false);
        }, 10000);
      }

      /* ---------------- PASSAGE RENDERING HELPERS (PART 6 & PART 7) ---------------- */
      function genreIconName(genre) {
        if (genre === "email") return "mail";
        if (genre === "chat") return "chat";
        if (genre === "table") return "table";
        if (genre === "review") return "star";
        return "fileText";
      }

      function renderDocText(rawText, isPart6, enableTap, p6BaseNum) {
        var str = String(rawText == null ? "" : rawText);
        if (!str) return "";
        var fmtPlain = function (s) { return enableTap ? wrapTapWords(s) : esc(s); };
        if (!isPart6) return fmtPlain(str);
        // Support both [131] and {{1}} placeholders gracefully
        var parts = str.split(/(\[\d+\]|\{\{\d+\}\})/g);
        var out = "";
        for (var i = 0; i < parts.length; i++) {
          var seg = parts[i];
          var bm = /^\[(\d+)\]$/.exec(seg);
          var cm = /^\{\{(\d+)\}\}$/.exec(seg);
          if (bm || cm) {
            var num = bm ? Number(bm[1]) : (Number(p6BaseNum || 1) + Number(cm[1]) - 1);
            out += buildP6ChipHtml(num, enableTap);
          } else if (seg) {
            out += fmtPlain(seg);
          }
        }
        return out;
      }

      function buildP6ChipHtml(num, isReviewMode) {
        var qRec = examIndex && examIndex.byNum[num];
        var chosen = answers[num];
        var cls = "p6-blank-chip";
        var ansLabel = "";
        if (typeof chosen === "number") {
          ansLabel = ' <span>' + (LETTERS[chosen] || "") + '</span>';
          if (isReviewMode && qRec) {
            cls += (chosen === qRec.ans) ? " is-correct" : " is-wrong";
          } else {
            cls += " is-answered";
          }
        } else if (isReviewMode && qRec) {
          cls += " is-wrong";
          ansLabel = ' <span>' + (LETTERS[qRec.ans] || "") + '</span>';
        }
        if (isReviewMode) {
          return '<span class="' + cls + '">[' + num + ']' + ansLabel + '</span>';
        }
        return '<button type="button" class="' + cls + '" data-jump-num="' + num + '" data-p6-chip="' + num + '" title="Nhảy tới Câu ' + num + '">[' + num + ']' + ansLabel + '</button>';
      }

      function syncP6ChipsInDom() {
        if (!examShellEl || examPart !== 6) return;
        var chips = examShellEl.querySelectorAll(".p6-blank-chip[data-p6-chip]");
        for (var i = 0; i < chips.length; i++) {
          var chip = chips[i];
          var num = Number(chip.getAttribute("data-p6-chip"));
          var chosen = answers[num];
          chip.classList.toggle("is-answered", typeof chosen === "number");
          chip.innerHTML = "[" + num + "]" + (typeof chosen === "number" ? (' <span>' + LETTERS[chosen] + '</span>') : "");
        }
      }

      function renderDocTable(tbl, isPart6, enableTap, p6BaseNum) {
        if (!tbl || (!Array.isArray(tbl.headers) && !Array.isArray(tbl.rows))) return "";
        var headers = Array.isArray(tbl.headers) ? tbl.headers : [];
        var rows = Array.isArray(tbl.rows) ? tbl.rows : [];
        var cap = tbl.caption ? '<div class="doc-table-caption">' + renderDocText(tbl.caption, isPart6, enableTap, p6BaseNum) + '</div>' : "";
        var head = headers.length ? '<thead><tr>' + headers.map(function (h) { return '<th>' + renderDocText(h, isPart6, enableTap, p6BaseNum) + '</th>'; }).join("") + '</tr></thead>' : "";
        var body = rows.length ? '<tbody>' + rows.map(function (r) {
          var cells = Array.isArray(r) ? r : [r];
          return '<tr>' + cells.map(function (c) { return '<td>' + renderDocText(c, isPart6, enableTap, p6BaseNum) + '</td>'; }).join("") + '</tr>';
        }).join("") + '</tbody>' : "";
        var note = tbl.note ? '<div class="doc-table-note">' + renderDocText(tbl.note, isPart6, enableTap, p6BaseNum) + '</div>' : "";
        return '<div class="doc-table-wrap">' + cap + '<div class="doc-table-scroll"><table class="doc-table">' + head + body + '</table></div>' + note + '</div>';
      }

      function renderPassageCard(p, pIdx, isPart6, enableTap, p6BaseNum, hideByTab) {
        if (!p || typeof p !== "object") return "";
        var genre = String(p.genre || "notice").toLowerCase();
        var genreLbl = GENRE_LABELS[genre] || genre.toUpperCase();
        var genreCls = genre === "chat" ? " is-chat" : (genre === "table" ? " is-table" : (genre === "ad" ? " is-ad" : (genre === "review" ? " is-review" : "")));
        var meta = (p.meta && typeof p.meta === "object") ? p.meta : {};
        var isHidden = hideByTab && activePassageTab !== "all" && String(activePassageTab) !== String(pIdx);

        var headerBlock = "";
        if (genre === "email" || (genre === "memo" && (meta.to || meta.from || meta.subject))) {
          var rows = [];
          if (meta.from) rows.push({ k: "From:", v: meta.from });
          if (meta.to) rows.push({ k: "To:", v: meta.to });
          if (meta.cc) rows.push({ k: "Cc:", v: meta.cc });
          if (meta.date) rows.push({ k: "Date:", v: meta.date });
          if (meta.subject) rows.push({ k: genre === "memo" ? "Re:" : "Subject:", v: meta.subject, subj: true });
          if (meta.title && !meta.subject) rows.push({ k: "Title:", v: meta.title, subj: true });
          if (rows.length) {
            headerBlock = '<div class="doc-email-meta">' + rows.map(function (r) {
              return '<span class="doc-meta-k">' + esc(r.k) + '</span><span class="doc-meta-v' + (r.subj ? " is-subj" : "") + '">' + renderDocText(r.v, isPart6, enableTap, p6BaseNum) + '</span>';
            }).join("") + '</div>';
          }
        } else {
          var titleStr = meta.title || meta.subject || meta.product || meta.channel || "";
          var subBits = [];
          if (meta.subtitle) subBits.push(meta.subtitle);
          if (meta.author) subBits.push("By " + meta.author);
          if (meta.reviewer) subBits.push("Reviewer: " + meta.reviewer);
          if (meta.from && !meta.to) subBits.push(meta.from);
          if (meta.source) subBits.push(meta.source);
          if (meta.date) subBits.push(meta.date);
          if (titleStr || subBits.length) {
            headerBlock = '<div class="doc-head-block">'
              + (titleStr ? '<h3 class="doc-title">' + renderDocText(titleStr, isPart6, enableTap, p6BaseNum) + '</h3>' : '')
              + (subBits.length ? '<div class="doc-sub">' + renderDocText(subBits.join(" • "), isPart6, enableTap, p6BaseNum) + '</div>' : '')
              + '</div>';
          }
          if (genre === "letter" && (meta.to || meta.from || meta.address)) {
            var lRows = [];
            if (meta.from) lRows.push({ k: "From:", v: meta.from });
            if (meta.to) lRows.push({ k: "To:", v: meta.to });
            if (meta.address) lRows.push({ k: "Address:", v: meta.address });
            if (lRows.length) {
              headerBlock += '<div class="doc-email-meta">' + lRows.map(function (r) {
                return '<span class="doc-meta-k">' + esc(r.k) + '</span><span class="doc-meta-v">' + renderDocText(r.v, isPart6, enableTap, p6BaseNum) + '</span>';
              }).join("") + '</div>';
            }
          }
        }

        var chatHtml = "";
        if (Array.isArray(p.messages) && p.messages.length) {
          var senders = [];
          chatHtml = '<div class="chat-list">' + p.messages.map(function (msg) {
            var snd = String(msg.sender || "Staff");
            if (senders.indexOf(snd) === -1) senders.push(snd);
            var altCls = (senders.indexOf(snd) % 2 === 1) ? " is-alt" : "";
            return '<div class="chat-bubble' + altCls + '">'
              + '<div class="chat-meta"><span class="chat-sender">' + esc(snd) + '</span>' + (msg.time ? '<span class="chat-time">' + esc(msg.time) + '</span>' : '') + '</div>'
              + '<div class="chat-text">' + renderDocText(msg.text || "", isPart6, enableTap, p6BaseNum) + '</div>'
              + '</div>';
          }).join("") + '</div>';
        }

        var parasHtml = Array.isArray(p.paragraphs)
          ? p.paragraphs.map(function (para) { return '<p class="doc-p">' + renderDocText(para, isPart6, enableTap, p6BaseNum) + '</p>'; }).join("")
          : "";
        var tableHtml = p.table ? renderDocTable(p.table, isPart6, enableTap, p6BaseNum) : "";

        return '<article class="passage-card genre-' + esc(genre) + (isHidden ? " is-hidden" : "") + '" data-p-idx="' + pIdx + '">'
          + '<div class="passage-card-bar">'
          +   '<span class="passage-bar-left">' + svgIcon(genreIconName(genre), 14) + '<span>' + esc(p.label || ("Văn bản " + (pIdx + 1))) + '</span></span>'
          +   '<span class="genre-badge' + genreCls + '">' + esc(genreLbl) + '</span>'
          + '</div>'
          + '<div class="passage-body">' + headerBlock + chatHtml + parasHtml + tableHtml + '</div>'
          + '</article>';
      }

      function renderGraphicCard(graphic) {
        if (!graphic || typeof graphic !== "object") return "";
        var headers = Array.isArray(graphic.headers) ? graphic.headers : [];
        var rows = Array.isArray(graphic.rows) ? graphic.rows : [];
        if (!headers.length && !rows.length) return "";
        var thead = headers.length ? '<thead><tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join("") + '</tr></thead>' : "";
        var tbody = '<tbody>' + rows.map(function (r) {
          var cells = Array.isArray(r) ? r : [r];
          return '<tr>' + cells.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>';
        }).join("") + '</tbody>';
        return '<div class="graphic-card">'
          + '<div class="graphic-card-head">' + svgIcon("grid", 14) + '<span>' + esc(graphic.title || "Bảng biểu / Lịch trình") + '</span></div>'
          + (graphic.subtitle ? '<div style="font-size:12px;color:var(--lg-ink-sub);margin:-4px 0 7px;">' + esc(graphic.subtitle) + '</div>' : '')
          + '<div class="graphic-table-scroll"><table class="graphic-table">' + thead + tbody + '</table></div>'
          + (graphic.note ? '<div class="graphic-note">' + esc(graphic.note) + '</div>' : '')
          + '</div>';
      }

      /* ---------------- SCREEN 2: RENDER EXAM ROOM ---------------- */
      function getShortTestName(t) {
        if (!t) return "TOEIC Mock";
        var id = String(t.id || "");
        var m = /tm_(mini|full)_(\d+)/i.exec(id);
        if (m) return (m[1].toLowerCase() === "full" ? "Full Test " : "Mini Test ") + m[2];
        return String(t.title || "TOEIC Mock").split("—")[0].trim();
      }

      function saveCurrentGroupHighlightSnapshot() {
        var leftScroll = document.getElementById("cbtLeftScroll");
        if (!leftScroll || (examPart !== 6 && examPart !== 7)) return;
        var gKey = "p" + examPart + "_" + (examPart === 6 ? activeP6GroupIdx : activeP7GroupIdx);
        if (leftScroll.querySelector("mark.cbt-hl")) {
          groupHlHtmlMap.set(gKey, leftScroll.innerHTML);
        } else {
          groupHlHtmlMap.delete(gKey);
        }
      }

      function renderListeningAudioBar() {
        var isEts = examMode === "ets";
        var speedControls = isEts
          ? '<span class="meta-pill is-accent">' + svgIcon("lock", 11) + '<span>1.0x chuẩn ETS • Không tua lại</span></span>'
          : '<div class="seg-pills" role="group" aria-label="Tốc độ nghe">'
            + SPEED_OPTIONS.map(function (spd) {
                return '<button type="button" class="seg-pill' + (Math.abs(activeRate - spd) < 0.01 ? " active" : "") + '" data-set-rate="' + spd + '">' + spd + 'x</button>';
              }).join("")
            + '</div>'
            + '<div class="seg-pills" role="group" aria-label="Giọng đọc">'
            + [{ id: "auto", lb: "ETS" }, { id: "en-US", lb: "US" }, { id: "en-GB", lb: "UK" }, { id: "en-AU", lb: "AU" }].map(function (a) {
                return '<button type="button" class="seg-pill is-teal' + (accentOverride === a.id ? " active" : "") + '" data-set-accent="' + a.id + '">' + a.lb + '</button>';
              }).join("")
            + '</div>';

        var partKey = "part_all_" + examPart;
        var isPartLocked = isEts && Boolean(playedAudio[partKey]);
        return '<section class="audio-studio' + (audioState.playing ? " is-playing" : "") + '" id="audioStudio" aria-label="Điều khiển âm thanh phần Nghe">'
          + '<div class="audio-studio-row">'
          +   '<div class="audio-ctrl-group">'
          +     '<button type="button" class="btn btn-primary btn-sm" id="btnPlayPartAudio" data-audio-lock-key="' + partKey + '"' + (isPartLocked ? " disabled" : "") + '>'
          +       svgIcon(isPartLocked ? "lock" : "play", 13) + '<span>' + (isPartLocked ? "Đã phát Part " + examPart : "Phát toàn Part " + examPart) + '</span>'
          +     '</button>'
          +     '<button type="button" class="btn btn-danger btn-sm" id="btnAudioStop"' + (audioState.playing ? "" : " disabled") + '>' + svgIcon("stop", 12) + '<span>Dừng</span></button>'
          +   '</div>'
          +   '<div class="audio-ctrl-group">' + speedControls + '</div>'
          + '</div>'
          + '<div class="audio-status-row">'
          +   '<span class="audio-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
          +   '<span id="audioStatusText">' + esc(audioState.statusText) + '</span>'
          + '</div>'
          + '<div class="audio-prog-track"><div class="audio-prog-fill" id="audioProgressFill" style="width:' + audioState.progressPct + '%;"></div></div>'
          + '</section>';
      }

      function renderFlagBtnHtml(num) {
        var isFl = Boolean(flagged[num]);
        return '<button type="button" class="q-flag-btn' + (isFl ? " is-flagged" : "") + '" data-flag-num="' + num + '" aria-pressed="' + (isFl ? "true" : "false") + '" title="Cắm cờ xem lại câu ' + num + '">'
          + svgIcon("flag", 12) + '<span>' + (isFl ? "Đã cắm cờ" : "Flag") + '</span>'
          + '</button>';
      }

      function renderListeningStageHtml() {
        var isEts = examMode === "ets";
        var pMeta = PART_LABELS[examPart] || PART_LABELS[1];
        var body = "";

        if (examPart === 1) {
          body = examIndex.p1.map(function (it, idx) {
            var chosen = answers[it.num];
            var aKey = "p1_" + it.num;
            var locked = isEts && Boolean(playedAudio[aKey]);
            return '<article class="q-card' + (currentNum === it.num ? " is-current" : "") + (flagged[it.num] ? " is-flagged" : "") + '" id="qCard_' + it.num + '" data-card-num="' + it.num + '">'
              + '<div class="q-card-head">'
              +   '<div class="q-head-left">'
              +     '<span class="q-num-pill">Câu ' + it.num + '</span>'
              +     '<span class="meta-pill is-info">' + esc(accentShort(it.accent)) + '</span>'
              +   '</div>'
              +   '<div class="audio-ctrl-group">'
              +     '<button type="button" class="btn btn-primary btn-xs" data-play-p1="' + idx + '" data-audio-lock-key="' + aKey + '"' + (locked ? " disabled" : "") + '>'
              +       svgIcon(locked ? "lock" : "volume", 12) + '<span>' + (locked ? "Đã phát (ETS)" : "Nghe (A–D)") + '</span>'
              +     '</button>'
              +     renderFlagBtnHtml(it.num)
              +   '</div>'
              + '</div>'
              + (it.image ? '<div class="p1-img-wrap"><img class="p1-img" src="' + esc(it.image) + '" alt="' + esc(it.imageAlt || ("Tranh Part 1 câu " + it.num)) + '" loading="lazy"></div>' : '')
              + '<div class="ets-blind-prompt">' + svgIcon("listening", 14) + '<span>Nghe 4 câu mô tả tranh (đã ẩn chữ theo chuẩn ETS) và chọn (A), (B), (C) hoặc (D):</span></div>'
              + '<div class="ets-bubble-row" role="radiogroup" aria-label="Chọn đáp án câu ' + it.num + '">'
              + [0, 1, 2, 3].map(function (oIdx) {
                  return '<button type="button" class="ets-bubble-btn' + (chosen === oIdx ? " selected" : "") + '" data-pick-num="' + it.num + '" data-pick-opt="' + oIdx + '" aria-pressed="' + (chosen === oIdx ? "true" : "false") + '">(' + LETTERS[oIdx] + ')</button>';
                }).join("")
              + '</div>'
              + '</article>';
          }).join("");
        } else if (examPart === 2) {
          body = examIndex.p2.map(function (it, idx) {
            var chosen = answers[it.num];
            var aKey = "p2_" + it.num;
            var locked = isEts && Boolean(playedAudio[aKey]);
            // STRICT ETS PART 2: ONLY 3 BUTTONS (A)(B)(C) - ZERO D, ZERO TEXT!
            return '<article class="q-card' + (currentNum === it.num ? " is-current" : "") + (flagged[it.num] ? " is-flagged" : "") + '" id="qCard_' + it.num + '" data-card-num="' + it.num + '">'
              + '<div class="q-card-head">'
              +   '<div class="q-head-left">'
              +     '<span class="q-num-pill">Câu ' + it.num + '</span>'
              +     '<span class="meta-pill is-info">' + esc(accentShort(it.accent)) + '</span>'
              +     '<span class="meta-pill is-muted">Part 2 • Chỉ A / B / C</span>'
              +   '</div>'
              +   '<div class="audio-ctrl-group">'
              +     '<button type="button" class="btn btn-primary btn-xs" data-play-p2="' + idx + '" data-audio-lock-key="' + aKey + '"' + (locked ? " disabled" : "") + '>'
              +       svgIcon(locked ? "lock" : "volume", 12) + '<span>' + (locked ? "Đã phát (ETS)" : "Nghe câu hỏi & A–C") + '</span>'
              +     '</button>'
              +     renderFlagBtnHtml(it.num)
              +   '</div>'
              + '</div>'
              + '<div class="ets-blind-prompt">' + svgIcon("listening", 14) + '<span>Câu hỏi &amp; 3 đáp án đang ẩn theo chuẩn phòng thi ETS. Chọn (A), (B) hoặc (C):</span></div>'
              + '<div class="ets-bubble-row" role="radiogroup" aria-label="Chọn đáp án Part 2 câu ' + it.num + '">'
              + [0, 1, 2].map(function (oIdx) {
                  return '<button type="button" class="ets-bubble-btn' + (chosen === oIdx ? " selected" : "") + '" data-pick-num="' + it.num + '" data-pick-opt="' + oIdx + '" aria-pressed="' + (chosen === oIdx ? "true" : "false") + '">(' + LETTERS[oIdx] + ')</button>';
                }).join("")
              + '</div>'
              + '</article>';
          }).join("");
        } else {
          var groups = examPart === 3 ? examIndex.p3 : examIndex.p4;
          var kindLabel = examPart === 3 ? "hội thoại" : "bài nói";
          body = groups.map(function (grp, gIdx) {
            var qs = Array.isArray(grp.questions) ? grp.questions : [];
            var rangeStr = qs.length ? ("Câu " + qs[0].num + "–" + qs[qs.length - 1].num) : ("Cụm " + (gIdx + 1));
            var aKey = "p" + examPart + "_g" + gIdx;
            var locked = isEts && Boolean(playedAudio[aKey]);
            var qsHtml = qs.map(function (q) {
              var chosen = answers[q.num];
              var opts = Array.isArray(q.opts) ? q.opts.slice(0, 4) : (Array.isArray(q.options) ? q.options.slice(0, 4) : []);
              return '<article class="q-card' + (currentNum === q.num ? " is-current" : "") + (flagged[q.num] ? " is-flagged" : "") + '" id="qCard_' + q.num + '" data-card-num="' + q.num + '">'
                + '<div class="q-card-head">'
                +   '<div class="q-head-left"><span class="q-num-pill">Câu ' + q.num + '</span></div>'
                +   renderFlagBtnHtml(q.num)
                + '</div>'
                + '<div class="q-prompt">' + esc(q.q || "") + '</div>'
                + '<div class="quiz-opts">'
                + opts.map(function (opt, oIdx) {
                    return '<button type="button" class="q-opt' + (chosen === oIdx ? " selected" : "") + '" data-pick-num="' + q.num + '" data-pick-opt="' + oIdx + '">'
                      + '<span class="q-opt-letter">' + LETTERS[oIdx] + '</span>'
                      + '<span>' + esc(cleanOptionText(opt)) + '</span>'
                      + '</button>';
                  }).join("")
                + '</div>'
                + '</article>';
            }).join("");

            return '<section class="lgrp-card" id="lgrp_' + examPart + '_' + gIdx + '">'
              + '<div class="lgrp-head">'
              +   '<div style="min-width:0;flex:1;">'
              +     '<h3 class="lgrp-title">' + esc(rangeStr + (grp.title ? (" • " + grp.title) : "")) + '</h3>'
              +     '<div class="lgrp-sub">' + ((grp.turns || []).length) + ' lượt nói • Giọng ' + esc(accentShort(grp.accent)) + ' • Transcript ẩn khi thi</div>'
              +   '</div>'
              +   '<button type="button" class="btn btn-primary btn-xs" data-play-lgrp="' + examPart + ':' + gIdx + '" data-audio-lock-key="' + aKey + '"' + (locked ? " disabled" : "") + '>'
              +     svgIcon(locked ? "lock" : "play", 12) + '<span>' + (locked ? "Đã phát (ETS)" : ("Phát " + kindLabel)) + '</span>'
              +   '</button>'
              + '</div>'
              + (grp.graphic ? renderGraphicCard(grp.graphic) : '')
              + qsHtml
              + '</section>';
          }).join("");
        }

        var nextPartBtn = examPart < 4
          ? '<button type="button" class="btn btn-sm" data-switch-part="' + (examPart + 1) + '"><span>Sang Part ' + (examPart + 1) + '</span>' + svgIcon("arrowRight", 13) + '</button>'
          : '';

        return '<div class="exam-scroll-stage" id="examMainScroll">'
          + '<div class="exam-single-inner">'
          +   '<div class="part-head-strip">'
          +     '<div>'
          +       '<div class="part-head-title">' + svgIcon("listening", 16) + '<span>' + esc(pMeta.title) + '</span></div>'
          +       '<div class="part-head-sub">' + examIndex.byPart[examPart].length + ' câu • Phần Listening (' + examIndex.listeningCount + ' câu)</div>'
          +     '</div>'
          +     '<button type="button" class="btn btn-teal btn-sm" id="btnGoReadingTop"><span>Chuyển sang phần Reading</span>' + svgIcon("arrowRight", 13) + '</button>'
          +   '</div>'
          +   renderListeningAudioBar()
          +   body
          +   '<div class="next-sec-banner">'
          +     '<div class="next-sec-text">'
          +       (examMode === "ets"
                  ? "Hoàn tất phần Listening? Chuyển sang phần Reading sẽ khóa quay lại phần Nghe theo đúng quy chế ETS."
                  : "Chuyển sang phần Reading để làm Part 5, Part 6 & Part 7 chia đôi màn hình CBT.")
          +     '</div>'
          +     '<div style="display:flex;gap:7px;flex-wrap:wrap;">'
          +       nextPartBtn
          +       '<button type="button" class="btn btn-primary btn-sm" id="btnGoReading"><span>Chuyển sang phần Reading &rarr;</span></button>'
          +     '</div>'
          +   '</div>'
          + '</div>'
          + '</div>';
      }

      function renderReadingPromptText(rawPrompt, num, q) {
        var str = String(rawPrompt || "");
        if (examPart === 6) return esc(str);
        if (str.indexOf("_____") === -1) return esc(str);
        var chosen = answers[num];
        var opts = Array.isArray(q.opts) ? q.opts : [];
        var fillText = (typeof chosen === "number" && opts[chosen]) ? cleanOptionText(opts[chosen]) : "_____";
        return str.split("_____").map(function (ch) { return esc(ch); })
          .join('<span class="q-blank-slot" data-blank-slot="' + num + '">' + esc(fillText) + '</span>');
      }

      function renderReadingQuestionCard(q) {
        var chosen = answers[q.num];
        var opts = Array.isArray(q.opts) ? q.opts.slice(0, 4) : (Array.isArray(q.options) ? q.options.slice(0, 4) : []);
        return '<article class="q-card' + (currentNum === q.num ? " is-current" : "") + (flagged[q.num] ? " is-flagged" : "") + '" id="qCard_' + q.num + '" data-card-num="' + q.num + '">'
          + '<div class="q-card-head">'
          +   '<div class="q-head-left">'
          +     '<span class="q-num-pill">Câu ' + q.num + '</span>'
          +     (q.tag ? '<span class="meta-pill is-violet">' + esc(q.tag) + '</span>' : '')
          +   '</div>'
          +   renderFlagBtnHtml(q.num)
          + '</div>'
          + '<div class="q-prompt">' + renderReadingPromptText(q.q || "", q.num, q) + '</div>'
          + '<div class="quiz-opts">'
          + opts.map(function (opt, oIdx) {
              return '<button type="button" class="q-opt' + (chosen === oIdx ? " selected" : "") + '" data-pick-num="' + q.num + '" data-pick-opt="' + oIdx + '">'
                + '<span class="q-opt-letter">' + LETTERS[oIdx] + '</span>'
                + '<span>' + esc(cleanOptionText(opt)) + '</span>'
                + '</button>';
            }).join("")
          + '</div>'
          + '</article>';
      }

      function renderReadingStageHtml() {
        if (examPart === 5) {
          var p5Html = examIndex.p5.map(renderReadingQuestionCard).join("");
          return '<div class="exam-scroll-stage" id="examMainScroll">'
            + '<div class="exam-single-inner">'
            +   '<div class="part-head-strip">'
            +     '<div>'
            +       '<div class="part-head-title">' + svgIcon("reading", 16) + '<span>Part 5 • Hoàn thành câu (1 cột tốc độ cao)</span></div>'
            +       '<div class="part-head-sub">' + examIndex.p5.length + ' câu • Bấm đáp án để điền trực tiếp vào chỗ trống</div>'
            +     '</div>'
            +     '<button type="button" class="btn btn-primary btn-sm" data-switch-part="6"><span>Sang Part 6 CBT</span>' + svgIcon("arrowRight", 13) + '</button>'
            +   '</div>'
            +   p5Html
            +   '<div class="next-sec-banner">'
            +     '<div class="next-sec-text">Xong Part 5? Tiếp tục sang Part 6 (Điền đoạn văn CBT Split-Screen).</div>'
            +     '<button type="button" class="btn btn-primary btn-sm" data-switch-part="6"><span>Tiếp tục Part 6</span>' + svgIcon("arrowRight", 13) + '</button>'
            +   '</div>'
            + '</div>'
            + '</div>';
        }

        // Part 6 & Part 7: CBT Split-Screen (Draggable 22%-78% desktop + 3-tab mobile)
        var isPart6 = examPart === 6;
        var groups = isPart6 ? examIndex.p6 : examIndex.p7;
        var gIdx = isPart6 ? activeP6GroupIdx : activeP7GroupIdx;
        if (gIdx < 0 || gIdx >= groups.length) gIdx = 0;
        var grp = groups[gIdx];
        if (!grp) return '<div class="loading-state">Chưa có dữ liệu cho phần đọc này.</div>';

        var passages = isPart6
          ? (grp.passage ? [grp.passage] : (Array.isArray(grp.passages) ? grp.passages : []))
          : (Array.isArray(grp.passages) ? grp.passages : (grp.passage ? [grp.passage] : []));
        var qs = Array.isArray(grp.questions) ? grp.questions : [];
        var baseNum = qs.length ? Number(qs[0].num) : 131;

        var groupPillsHtml = groups.map(function (g, i) {
          var gqs = Array.isArray(g.questions) ? g.questions : [];
          var lbl = gqs.length ? ((isPart6 ? "Đoạn " : "Cụm ") + (i + 1) + " (" + gqs[0].num + "–" + gqs[gqs.length - 1].num + ")") : ("Cụm " + (i + 1));
          return '<button type="button" class="grp-pill' + (i === gIdx ? " active" : "") + '" data-select-rgrp="' + i + '">' + esc(lbl) + '</button>';
        }).join("");

        var passageTabsHtml = "";
        if (!isPart6 && passages.length >= 2) {
          passageTabsHtml = '<div class="cbt-left-tabs" role="tablist" aria-label="Chọn văn bản">'
            + '<button type="button" class="p-tab-btn' + (activePassageTab === "all" ? " active" : "") + '" data-passage-tab="all">Tất cả (' + passages.length + ')</button>'
            + passages.map(function (p, pI) {
                return '<button type="button" class="p-tab-btn' + (String(activePassageTab) === String(pI) ? " active" : "") + '" data-passage-tab="' + pI + '">Văn bản ' + (pI + 1) + '</button>';
              }).join("")
            + '</div>';
        }

        var gKey = "p" + examPart + "_" + gIdx;
        var savedHlHtml = groupHlHtmlMap.get(gKey);
        var passagesHtml = savedHlHtml
          ? savedHlHtml
          : '<div class="passage-stack">' + passages.map(function (p, pI) {
              return renderPassageCard(p, pI, isPart6, false, baseNum, !isPart6 && passages.length >= 2);
            }).join("") + '</div>';

        var kindTag = !isPart6 && grp.kind
          ? (grp.kind === "triple" ? "Đoạn ba (3 văn bản)" : (grp.kind === "double" ? "Đoạn kép (2 văn bản)" : "Đoạn đơn"))
          : "Part 6 • Bấm chip [số] để nhảy câu";

        var nextGroupAction = "";
        if (gIdx + 1 < groups.length) {
          nextGroupAction = '<button type="button" class="btn btn-primary btn-sm" data-select-rgrp="' + (gIdx + 1) + '"><span>' + (isPart6 ? "Đoạn tiếp theo" : "Cụm tiếp theo") + '</span>' + svgIcon("arrowRight", 13) + '</button>';
        } else if (isPart6) {
          nextGroupAction = '<button type="button" class="btn btn-primary btn-sm" data-switch-part="7"><span>Chuyển sang Part 7</span>' + svgIcon("arrowRight", 13) + '</button>';
        } else {
          nextGroupAction = '<button type="button" class="btn btn-ok btn-sm" id="btnSubmitBottom">' + svgIcon("send", 13) + '<span>Hoàn tất &amp; Nộp bài</span></button>';
        }

        return '<div class="cbt-subbar">'
          + '<div class="cbt-group-pills">' + groupPillsHtml + '</div>'
          + '<div class="audio-ctrl-group">'
          +   '<span class="meta-pill is-teal mk-hide-xs">' + esc(kindTag) + '</span>'
          +   '<button type="button" class="btn btn-xs hl-clear-btn" id="btnClearAllHl" title="Xóa toàn bộ Highlight">' + svgIcon("brush", 12) + '<span id="hlCountLbl">Xóa HL</span></button>'
          + '</div>'
          + '</div>'
          + '<div class="cbt-mob-switcher" role="tablist" aria-label="Chế độ xem trên di động">'
          +   '<button type="button" class="cbt-mob-tab' + (cbtMobileView === "split" ? " active" : "") + '" data-mob-view="split">' + svgIcon("split", 13) + '<span>Chia đôi</span></button>'
          +   '<button type="button" class="cbt-mob-tab' + (cbtMobileView === "left" ? " active" : "") + '" data-mob-view="left">' + svgIcon("fileText", 13) + '<span>Văn bản</span></button>'
          +   '<button type="button" class="cbt-mob-tab' + (cbtMobileView === "right" ? " active" : "") + '" data-mob-view="right">' + svgIcon("listChecks", 13) + '<span>Câu hỏi</span></button>'
          + '</div>'
          + '<div class="cbt-split mob-view-' + cbtMobileView + '" id="cbtSplitArea">'
          +   '<section class="cbt-left" id="cbtLeftPane" style="--cbt-left-pct:' + cbtLeftPct + '%;" aria-label="Cột văn bản">'
          +     passageTabsHtml
          +     '<div class="cbt-left-scroll" id="cbtLeftScroll">' + passagesHtml + '</div>'
          +   '</section>'
          +   '<div class="split-resizer" id="cbtResizer" role="separator" aria-orientation="vertical" aria-label="Kéo giãn tỷ lệ hai cột" tabindex="0" title="Kéo chỉnh 22%–78% (nhấp đúp đặt lại)"></div>'
          +   '<section class="cbt-right" id="cbtRightPane" aria-label="Cột câu hỏi">'
          +     '<div class="cbt-right-scroll" id="cbtRightScroll">'
          +       '<div style="display:flex;flex-direction:column;gap:11px;">'
          +         qs.map(renderReadingQuestionCard).join("")
          +         '<div style="display:flex;justify-content:flex-end;padding-top:4px;">' + nextGroupAction + '</div>'
          +       '</div>'
          +     '</div>'
          +   '</section>'
          + '</div>';
      }

      function renderBottomPaletteHtml() {
        var partBtns = [1, 2, 3, 4, 5, 6, 7].map(function (p) {
          var list = examIndex.byPart[p] || [];
          var doneCnt = list.filter(function (q) { return typeof answers[q.num] === "number"; }).length;
          var isLocked = (p <= 4) && listeningLocked && examMode === "ets";
          return '<button type="button" class="dock-part-btn' + (examPart === p ? " active" : "") + (isLocked ? " is-locked" : "") + '" data-switch-part="' + p + '">'
            + (isLocked ? svgIcon("lock", 11) : "")
            + '<span>Part ' + p + '</span>'
            + '<span style="opacity:0.85;">(' + doneCnt + '/' + list.length + ')</span>'
            + '</button>';
        }).join("");

        var curList = examIndex.byPart[examPart] || [];
        var numsHtml = curList.map(function (q) {
          var cls = "pal-num-btn";
          if (typeof answers[q.num] === "number") cls += " is-answered";
          if (q.num === currentNum) cls += " is-current";
          if (flagged[q.num]) cls += " is-flagged";
          return '<button type="button" class="' + cls + '" data-jump-num="' + q.num + '" title="Câu ' + q.num + '">' + q.num + '</button>';
        }).join("");

        return '<footer class="exam-bottom-dock lp-glass' + (paletteCollapsed ? " is-collapsed" : "") + '" id="examBottomDock" aria-label="Bảng chọn nhanh câu hỏi 7 Part">'
          + '<div class="dock-top-row">'
          +   '<div class="part-tabs-scroll" role="tablist" aria-label="Chuyển nhanh Part 1 đến Part 7">' + partBtns + '</div>'
          +   '<div class="dock-nav-btns">'
          +     '<button type="button" class="btn btn-xs" id="btnPrevQ" title="Câu trước">' + svgIcon("chevronLeft", 13) + '<span class="mk-hide-xs">Trước</span></button>'
          +     '<button type="button" class="btn btn-xs btn-primary" id="btnNextQ" title="Câu tiếp"><span class="mk-hide-xs">Tiếp</span>' + svgIcon("chevronRight", 13) + '</button>'
          +     '<button type="button" class="btn btn-xs" id="btnTogglePal" title="Thu gọn / Mở rộng ô số câu" aria-label="Thu gọn bảng câu">' + svgIcon(paletteCollapsed ? "chevronUp" : "chevronDown", 13) + '</button>'
          +   '</div>'
          + '</div>'
          + '<div class="palette-grid-wrap" id="paletteGrid">' + numsHtml + '</div>'
          + '</footer>';
      }

      function renderExamRoom(resetScroll) {
        if (!activeTest || !examIndex || !examShellEl) return;
        examShellEl.className = "exam-shell cbt-font-" + cbtFontSize;

        var rem = currentSectionRemainSec();
        var timerCls = "exam-timer-pill" + (rem <= 300 ? " is-danger" : (rem <= 600 ? " is-warn" : ""));
        var lcLocked = listeningLocked && examMode === "ets";
        var shortName = getShortTestName(activeTest);

        var topBarHtml = '<div class="exam-topbar lp-glass" id="examTopBar">'
          + '<div class="exam-tb-left">'
          +   '<span class="exam-short-name" title="' + esc(activeTest.title) + '">' + esc(shortName) + '</span>'
          +   '<div class="exam-sec-switch" role="tablist" aria-label="Phần thi hiện tại">'
          +     '<button type="button" class="exam-sec-btn' + (examSection === "listening" ? " active" : "") + (lcLocked ? " is-locked" : "") + '" data-switch-sec="listening">'
          +       (lcLocked ? svgIcon("lock", 11) : svgIcon("listening", 12)) + '<span class="mk-sec-full">Listening</span><span class="mk-sec-short">LC</span>'
          +     '</button>'
          +     '<button type="button" class="exam-sec-btn' + (examSection === "reading" ? " active" : "") + '" data-switch-sec="reading">'
          +       svgIcon("reading", 12) + '<span class="mk-sec-full">Reading</span><span class="mk-sec-short">RC</span>'
          +     '</button>'
          +   '</div>'
          + '</div>'
          + '<div class="exam-tb-right">'
          +   '<span class="' + timerCls + '" id="examTimerPill" title="Thời gian còn lại của phần hiện tại">'
          +     svgIcon("clock", 13) + '<span id="examTimerText">' + formatClock(rem) + '</span>'
          +   '</span>'
          +   '<div class="seg-pills exam-font-grp" role="group" aria-label="Cỡ chữ phòng thi">'
          +     '<button type="button" class="seg-pill' + (cbtFontSize === "sm" ? " active" : "") + '" data-set-font="sm">A-</button>'
          +     '<button type="button" class="seg-pill' + (cbtFontSize === "md" ? " active" : "") + '" data-set-font="md">A</button>'
          +     '<button type="button" class="seg-pill' + (cbtFontSize === "lg" ? " active" : "") + '" data-set-font="lg">A+</button>'
          +   '</div>'
          +   '<button type="button" class="btn btn-xs" id="btnExitDraft" title="Thoát và lưu nháp">'
          +     svgIcon("save", 12) + '<span class="mk-hide-xs">Thoát (Lưu nháp)</span>'
          +   '</button>'
          +   '<button type="button" class="btn btn-xs btn-ok" id="btnSubmitExam">'
          +     svgIcon("send", 12) + '<span>Nộp bài</span>'
          +   '</button>'
          + '</div>'
          + '</div>';

        var stageInner = examSection === "listening" ? renderListeningStageHtml() : renderReadingStageHtml();

        examShellEl.innerHTML = topBarHtml
          + '<div class="exam-stage lp-glass" id="examStage">' + stageInner + '</div>'
          + renderBottomPaletteHtml();

        if (examSection === "reading" && (examPart === 6 || examPart === 7)) {
          bindSplitResizer();
          syncP6ChipsInDom();
          updateHlCountUI();
        }
        if (resetScroll) {
          var sc = document.getElementById("examMainScroll");
          if (sc) sc.scrollTop = 0;
        }
      }

      function syncPaletteInPlace() {
        if (!examIndex || !examShellEl) return;
        // Update part tab counts
        [1, 2, 3, 4, 5, 6, 7].forEach(function (p) {
          var btn = examShellEl.querySelector('.dock-part-btn[data-switch-part="' + p + '"]');
          if (!btn) return;
          var list = examIndex.byPart[p] || [];
          var doneCnt = list.filter(function (q) { return typeof answers[q.num] === "number"; }).length;
          var spans = btn.querySelectorAll("span");
          if (spans.length >= 2) spans[1].textContent = "(" + doneCnt + "/" + list.length + ")";
        });
        // Update number pills
        var pills = examShellEl.querySelectorAll(".pal-num-btn[data-jump-num]");
        for (var i = 0; i < pills.length; i++) {
          var n = Number(pills[i].getAttribute("data-jump-num"));
          pills[i].classList.toggle("is-answered", typeof answers[n] === "number");
          pills[i].classList.toggle("is-current", n === currentNum);
          pills[i].classList.toggle("is-flagged", Boolean(flagged[n]));
        }
      }

      function switchToReading(isAuto) {
        if (examSection === "reading") return;
        stopAudio(false);
        if (examMode === "ets") listeningLocked = true;
        examSection = "reading";
        examPart = 5;
        var p5First = examIndex.byPart[5][0];
        if (p5First) currentNum = p5First.num;
        warn10Shown = false;
        warn5Shown = false;
        saveDraft(false);
        renderExamRoom(true);
        if (!isAuto) {
          showToast("info", examMode === "ets"
            ? "Đã chuyển sang phần Reading (đã khóa quay lại phần Listening chuẩn ETS)."
            : "Đã chuyển sang phần Reading.", 2200);
        }
      }

      function switchToListening() {
        if (examSection === "listening") return;
        if (examMode === "ets" && listeningLocked) {
          showToast("warn", "Chế độ Thi thật ETS: Đã khóa quay lại phần Listening sau khi chuyển sang Reading.", 2400);
          return;
        }
        saveCurrentGroupHighlightSnapshot();
        examSection = "listening";
        examPart = 1;
        var p1First = examIndex.byPart[1][0];
        if (p1First) currentNum = p1First.num;
        saveDraft(false);
        renderExamRoom(true);
      }

      function switchToPart(targetPart, targetNum) {
        var p = Number(targetPart);
        if (p < 1 || p > 7) return;
        if (p <= 4 && examMode === "ets" && listeningLocked) {
          showToast("warn", "Chế độ Thi thật ETS: Đã khóa quay lại phần Listening.", 2200);
          return;
        }
        if (examSection === "reading" && (examPart === 6 || examPart === 7)) {
          saveCurrentGroupHighlightSnapshot();
        }
        if (p >= 5 && examSection === "listening") {
          stopAudio(false);
          if (examMode === "ets") listeningLocked = true;
          examSection = "reading";
          warn10Shown = false;
          warn5Shown = false;
        } else if (p <= 4 && examSection === "reading") {
          examSection = "listening";
        }
        examPart = p;
        var list = examIndex.byPart[p] || [];
        var pickNum = targetNum || (list.length ? list[0].num : currentNum);
        currentNum = pickNum;

        var rec = examIndex.byNum[pickNum];
        if (rec && p === 6 && typeof rec.groupIdx === "number") {
          activeP6GroupIdx = rec.groupIdx;
        } else if (rec && p === 7 && typeof rec.groupIdx === "number") {
          activeP7GroupIdx = rec.groupIdx;
          activePassageTab = "all";
        }

        saveDraft(false);
        renderExamRoom(false);
        focusQuestionCard(pickNum);
      }

      function jumpToQuestion(num) {
        var n = Number(num);
        var rec = examIndex && examIndex.byNum[n];
        if (!rec) return;
        if (rec.part <= 4 && examMode === "ets" && listeningLocked) {
          showToast("warn", "Chế độ Thi thật ETS: Đã khóa quay lại phần Listening.", 2200);
          return;
        }
        var needReRender = (rec.part !== examPart)
          || (rec.part === 6 && rec.groupIdx !== activeP6GroupIdx)
          || (rec.part === 7 && rec.groupIdx !== activeP7GroupIdx);

        if (needReRender) {
          switchToPart(rec.part, n);
        } else {
          currentNum = n;
          if (window.innerWidth <= 820 && (examPart === 6 || examPart === 7) && cbtMobileView === "left") {
            setMobileView("split");
          }
          syncPaletteInPlace();
          focusQuestionCard(n);
        }
      }

      function focusQuestionCard(num) {
        var prev = examShellEl ? examShellEl.querySelectorAll(".q-card.is-current, .q-card.is-focused") : [];
        for (var i = 0; i < prev.length; i++) prev[i].classList.remove("is-current", "is-focused");
        var card = document.getElementById("qCard_" + num);
        if (card) {
          card.classList.add("is-current", "is-focused");
          try { card.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
          setTimeout(function () { if (card) card.classList.remove("is-focused"); }, 1200);
        }
      }

      function stepQuestion(delta) {
        if (!examIndex || !examIndex.allQuestions.length) return;
        var all = examIndex.allQuestions;
        var idx = all.findIndex(function (q) { return q.num === currentNum; });
        var nextIdx = Math.max(0, Math.min(all.length - 1, idx + delta));
        if (nextIdx === idx) return;
        var nextRec = all[nextIdx];
        if (nextRec.part <= 4 && examMode === "ets" && listeningLocked) {
          showToast("warn", "Đã ở câu đầu tiên của phần Reading (Listening đã khóa).", 2000);
          return;
        }
        jumpToQuestion(nextRec.num);
      }

      function setMobileView(mode) {
        cbtMobileView = (mode === "left" || mode === "right") ? mode : "split";
        var sp = document.getElementById("cbtSplitArea");
        if (sp) {
          sp.classList.remove("mob-view-split", "mob-view-left", "mob-view-right");
          sp.classList.add("mob-view-" + cbtMobileView);
        }
        var tabs = examShellEl ? examShellEl.querySelectorAll(".cbt-mob-tab[data-mob-view]") : [];
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mob-view") === cbtMobileView);
        }
        hideHlPopover();
      }

      function setPassageTab(val) {
        activePassageTab = String(val || "all");
        var tabs = examShellEl ? examShellEl.querySelectorAll(".p-tab-btn[data-passage-tab]") : [];
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle("active", tabs[i].getAttribute("data-passage-tab") === activePassageTab);
        }
        var cards = examShellEl ? examShellEl.querySelectorAll(".passage-card[data-p-idx]") : [];
        for (var j = 0; j < cards.length; j++) {
          cards[j].classList.toggle("is-hidden", activePassageTab !== "all" && cards[j].getAttribute("data-p-idx") !== activePassageTab);
        }
        var ls = document.getElementById("cbtLeftScroll");
        if (ls) ls.scrollTop = 0;
        hideHlPopover();
      }

      /* ---------------- DRAGGABLE SPLIT-SCREEN RESIZER (22% - 78%) ---------------- */
      var resizerGlobalsBound = false;
      var isDraggingResizer = false;

      function bindSplitResizer() {
        var resizer = document.getElementById("cbtResizer");
        if (!resizer) return;
        function startDrag(e) {
          if (window.innerWidth <= 820) return;
          isDraggingResizer = true;
          resizer.classList.add("dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          hideHlPopover();
          if (e && e.cancelable) e.preventDefault();
        }
        resizer.onmousedown = startDrag;
        resizer.addEventListener("touchstart", function (e) {
          if (e.touches && e.touches.length === 1) startDrag(e);
        }, { passive: false });
        resizer.ondblclick = function () {
          cbtLeftPct = 52;
          var lp = document.getElementById("cbtLeftPane");
          if (lp) lp.style.setProperty("--cbt-left-pct", "52%");
        };
        resizer.onkeydown = function (e) {
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            e.preventDefault();
            cbtLeftPct = Math.max(22, Math.min(78, cbtLeftPct + (e.key === "ArrowLeft" ? -3 : 3)));
            var lp = document.getElementById("cbtLeftPane");
            if (lp) lp.style.setProperty("--cbt-left-pct", cbtLeftPct + "%");
          }
        };

        if (resizerGlobalsBound) return;
        resizerGlobalsBound = true;
        function doDrag(clientX) {
          if (!isDraggingResizer) return;
          var sp = document.getElementById("cbtSplitArea");
          var lp = document.getElementById("cbtLeftPane");
          if (!sp || !lp) return;
          var rect = sp.getBoundingClientRect();
          if (!rect.width) return;
          cbtLeftPct = Math.max(22, Math.min(78, Math.round(((clientX - rect.left) / rect.width) * 100)));
          lp.style.setProperty("--cbt-left-pct", cbtLeftPct + "%");
        }
        function endDrag() {
          if (!isDraggingResizer) return;
          isDraggingResizer = false;
          var r = document.getElementById("cbtResizer");
          if (r) r.classList.remove("dragging");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        }
        window.addEventListener("mousemove", function (e) { if (isDraggingResizer) doDrag(e.clientX); });
        window.addEventListener("mouseup", endDrag);
        window.addEventListener("touchmove", function (e) {
          if (isDraggingResizer && e.touches && e.touches.length === 1) {
            doDrag(e.touches[0].clientX);
            if (e.cancelable) e.preventDefault();
          }
        }, { passive: false });
        window.addEventListener("touchend", endDrag);
        window.addEventListener("touchcancel", endDrag);
      }

      /* ---------------- PASSAGE HIGHLIGHT TOOL (IN-RAM) ---------------- */
      var lastHlRange = null;

      function isRangeInLeftPane(range) {
        var leftScroll = document.getElementById("cbtLeftScroll");
        if (!range || !leftScroll || range.collapsed) return false;
        if (!range.startContainer || !range.startContainer.isConnected) return false;
        if (!leftScroll.contains(range.commonAncestorContainer)) return false;
        return Boolean(range.toString().trim());
      }

      function hideHlPopover() {
        if (hlPopoverEl) hlPopoverEl.style.display = "none";
      }

      function positionHlPopover(range) {
        if (!hlPopoverEl || !range) return;
        var rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) { hideHlPopover(); return; }
        hlPopoverEl.style.display = "inline-flex";
        var pw = hlPopoverEl.offsetWidth || 168;
        var ph = hlPopoverEl.offsetHeight || 38;
        var top = rect.top - ph - 8;
        if (top < 54) top = rect.bottom + 8;
        var left = Math.max(8, Math.min(window.innerWidth - pw - 8, rect.left + rect.width / 2 - pw / 2));
        hlPopoverEl.style.top = Math.round(top) + "px";
        hlPopoverEl.style.left = Math.round(left) + "px";
      }

      function updateHlCountUI() {
        var ls = document.getElementById("cbtLeftScroll");
        var btn = document.getElementById("btnClearAllHl");
        var lbl = document.getElementById("hlCountLbl");
        if (!btn) return;
        var cnt = ls ? ls.querySelectorAll("mark.cbt-hl").length : 0;
        btn.classList.toggle("has-hl", cnt > 0);
        if (lbl) lbl.textContent = "Xóa HL (" + cnt + ")";
      }

      function unwrapMark(m) {
        if (!m || !m.parentNode) return;
        var p = m.parentNode;
        while (m.firstChild) p.insertBefore(m.firstChild, m);
        p.removeChild(m);
        p.normalize();
      }

      function applyHighlightToRange(range) {
        if (!isRangeInLeftPane(range)) return;
        var ls = document.getElementById("cbtLeftScroll");
        var root = range.commonAncestorContainer;
        if (root.nodeType === 3) root = root.parentNode;
        var textNodes = [];
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while ((node = walker.nextNode())) {
          if (!node.nodeValue || !node.nodeValue.trim() || !ls.contains(node)) continue;
          if (!node.parentElement || node.parentElement.closest("button, .p6-blank-chip, mark.cbt-hl")) continue;
          try { if (range.intersectsNode(node)) textNodes.push(node); } catch (e) {}
        }
        for (var i = 0; i < textNodes.length; i++) {
          var tn = textNodes[i];
          var start = (tn === range.startContainer) ? range.startOffset : 0;
          var end = (tn === range.endContainer) ? range.endOffset : tn.nodeValue.length;
          if (end <= start) continue;
          var targetNode = tn;
          if (end < targetNode.nodeValue.length) targetNode.splitText(end);
          if (start > 0) targetNode = targetNode.splitText(start);
          var mark = document.createElement("mark");
          mark.className = "cbt-hl";
          targetNode.parentNode.insertBefore(mark, targetNode);
          mark.appendChild(targetNode);
        }
        lastHlRange = null;
        var sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        updateHlCountUI();
        saveCurrentGroupHighlightSnapshot();
      }

      function removeHighlightFromRange(range) {
        var ls = document.getElementById("cbtLeftScroll");
        if (!ls) return;
        var marks = ls.querySelectorAll("mark.cbt-hl");
        var removed = 0;
        if (range && isRangeInLeftPane(range)) {
          for (var i = 0; i < marks.length; i++) {
            try { if (range.intersectsNode(marks[i])) { unwrapMark(marks[i]); removed++; } } catch (e) {}
          }
        }
        if (removed === 0 && marks.length > 0) {
          for (var j = 0; j < marks.length; j++) unwrapMark(marks[j]);
        }
        lastHlRange = null;
        var sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        updateHlCountUI();
        saveCurrentGroupHighlightSnapshot();
      }

      function clearAllHighlights() {
        var ls = document.getElementById("cbtLeftScroll");
        if (!ls) return;
        var marks = ls.querySelectorAll("mark.cbt-hl");
        for (var i = 0; i < marks.length; i++) unwrapMark(marks[i]);
        updateHlCountUI();
        saveCurrentGroupHighlightSnapshot();
        hideHlPopover();
        showToast("info", "Đã xóa toàn bộ Highlight trong đoạn này.", 1500);
      }

      var hlSelTimer = null;
      function checkLeftSelection() {
        if (activeScreen !== "exam") { hideHlPopover(); return; }
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount) {
          var r = sel.getRangeAt(0);
          if (isRangeInLeftPane(r)) {
            lastHlRange = r.cloneRange();
            positionHlPopover(r);
            return;
          }
        }
        hideHlPopover();
      }

      /* ---------------- SUBMIT EXAM & ETS REPORT (10-990) ---------------- */
      function requestSubmitExam() {
        if (!activeTest || !examIndex) return;
        var total = examIndex.allQuestions.length;
        var answered = Object.keys(answers).filter(function (k) { return typeof answers[k] === "number"; }).length;
        var flagCnt = Object.keys(flagged).filter(function (k) { return Boolean(flagged[k]); }).length;
        var msg = "Bạn đã chọn " + answered + "/" + total + " câu"
          + (flagCnt > 0 ? (" (" + flagCnt + " câu đang cắm cờ)") : "")
          + (answered < total ? ". Các câu chưa chọn sẽ tính 0 điểm." : ".")
          + " Xác nhận nộp bài và chấm điểm ETS 10–990?";

        if (window.S4UI && typeof window.S4UI.confirm === "function") {
          window.S4UI.confirm(msg, {
            title: "Nộp bài thi TOEIC",
            tone: "primary",
            confirmText: "Nộp bài ngay",
            cancelText: "Làm tiếp"
          }).then(function (ok) {
            if (ok) submitExam(false);
          });
        } else if (confirm(msg)) {
          submitExam(false);
        }
      }

      function submitExam(isAuto) {
        if (!activeTest || !examIndex) return;
        stopAudio(false);
        stopExamTimers();
        hideHlPopover();

        var partStats = {};
        var lRaw = 0, lMax = 0, rRaw = 0, rMax = 0;
        [1, 2, 3, 4, 5, 6, 7].forEach(function (p) {
          var list = examIndex.byPart[p] || [];
          var cor = 0;
          list.forEach(function (q) {
            if (answers[q.num] === q.ans) cor++;
          });
          var tot = list.length;
          partStats["p" + p] = { part: p, correct: cor, total: tot, pct: tot > 0 ? Math.round((cor / tot) * 100) : 0 };
          if (p <= 4) { lRaw += cor; lMax += tot; }
          else { rRaw += cor; rMax += tot; }
        });

        var lScore = etsScoreFromRaw(lRaw, lMax, "listening");
        var rScore = etsScoreFromRaw(rRaw, rMax, "reading");
        var totalScore = lScore + rScore;
        var cefr = getCefrInfo(totalScore);
        var isFull = Boolean(activeTest.isFull || activeTest.tier === "full" || examIndex.allQuestions.length >= 200);

        var record = {
          id: "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          testId: activeTest.id,
          title: activeTest.title,
          tier: activeTest.tier || (isFull ? "full" : "mini"),
          isFull: isFull,
          totalQuestions: examIndex.allQuestions.length,
          mode: examMode,
          listeningRaw: lRaw,
          listeningMax: lMax,
          readingRaw: rRaw,
          readingMax: rMax,
          listeningScore: lScore,
          readingScore: rScore,
          totalScore: totalScore,
          cefr: cefr.code,
          passed: totalScore >= 350,
          partStats: partStats,
          durationSec: elapsedSec,
          submittedAt: new Date().toISOString()
        };

        saveSubmission(record);
        clearDraft(activeTest.id);

        lastReport = {
          record: record,
          cefr: cefr,
          test: activeTest,
          index: examIndex,
          answers: Object.assign({}, answers),
          flagged: Object.assign({}, flagged)
        };
        reviewFilter = "all";
        reviewPartFilter = 0;

        switchScreen("report");
        renderReportScreen();
        showToast("success", (isAuto ? "Hết giờ! " : "") + "Tổng điểm quy đổi ETS: " + totalScore + "/990 (" + cefr.code + ")", 3000);
      }

      /* ---------------- SCREEN 3: REPORT & REVIEW RENDERER ---------------- */
      function renderReviewItemsHtml(rep) {
        var idx = rep.index;
        var ansMap = rep.answers;
        var flgMap = rep.flagged;
        var partsToShow = reviewPartFilter > 0 ? [reviewPartFilter] : [1, 2, 3, 4, 5, 6, 7];

        function keepQ(qRec) {
          var chosen = ansMap[qRec.num];
          var isRight = chosen === qRec.ans;
          if (reviewFilter === "wrong" && isRight) return false;
          if (reviewFilter === "flagged" && !flgMap[qRec.num]) return false;
          return true;
        }

        var htmlParts = [];

        partsToShow.forEach(function (p) {
          if (p === 1) {
            var p1Items = idx.byPart[1].filter(keepQ);
            if (!p1Items.length) return;
            htmlParts.push('<div class="part-head-strip"><div class="part-head-title">' + svgIcon("listening", 15) + '<span>Part 1 • Tả tranh (' + p1Items.length + ' câu)</span></div></div>');
            p1Items.forEach(function (qRec) {
              var it = qRec.item;
              var chosen = ansMap[qRec.num];
              var isRight = chosen === qRec.ans;
              var opts = Array.isArray(it.options) ? it.options.slice(0, 4) : [];
              var optsVi = Array.isArray(it.optionsVi) ? it.optionsVi : [];
              htmlParts.push('<article class="q-card ' + (isRight ? "is-graded-right" : "is-graded-wrong") + '">'
                + '<div class="q-card-head">'
                +   '<div class="q-head-left">'
                +     '<span class="q-num-pill">Câu ' + qRec.num + '</span>'
                +     '<span class="meta-pill ' + (isRight ? "is-ok" : "is-err") + '">' + (isRight ? "Đúng" : "Sai") + '</span>'
                +     (flgMap[qRec.num] ? '<span class="meta-pill is-warn">Đã cắm cờ</span>' : '')
                +   '</div>'

      var currentDictWord = "";
      var dictOpenSeq = 0;

      var IRREGULAR_LEMMAS = {
        held: "hold", sent: "send", paid: "pay", made: "make", wrote: "write", written: "write",
        took: "take", taken: "take", gave: "give", given: "give", spoke: "speak", spoken: "speak",
        met: "meet", sold: "sell", bought: "buy", built: "build", found: "find", kept: "keep",
        left: "leave", brought: "bring", thought: "think", told: "tell", said: "say", went: "go",
        gone: "go", saw: "see", seen: "see", came: "come", ran: "run", sat: "sit", stood: "stand",
        led: "lead", heard: "hear", understood: "understand", began: "begin", begun: "begin",
        chose: "choose", chosen: "choose", drove: "drive", driven: "drive", flew: "fly",
        flown: "fly", grew: "grow", grown: "grow", knew: "know", known: "know", spent: "spend",
        won: "win", lost: "lose", caught: "catch", taught: "teach", meant: "mean", dealt: "deal",
        drew: "draw", drawn: "draw", fell: "fall", fallen: "fall", felt: "feel", forgot: "forget",
        forgotten: "forget", got: "get", gotten: "get", hung: "hang", laid: "lay", lent: "lend",
        rose: "rise", risen: "rise", shown: "show", wore: "wear", worn: "wear", broke: "break", broken: "break"
      };

      function loadScriptOnce(src) {
        return new Promise(function (resolve) {
          var existing = document.querySelector('script[data-lazy-vocab="' + src + '"]');
          if (existing) {
            if (existing.dataset.loaded === "1") return resolve(true);
            existing.addEventListener("load", function () { resolve(true); }, { once: true });
            existing.addEventListener("error", function () { resolve(false); }, { once: true });
            return;
          }
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.dataset.lazyVocab = src;
          s.onload = function () { s.dataset.loaded = "1"; resolve(true); };
          s.onerror = function () { resolve(false); };
          document.head.appendChild(s);
        });
      }

      function buildVocabLookupMaps() {
        vocabMap = new Map();
        vocabWfMap = new Map();
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        [1, 2, 3, 4].forEach(function (lv) {
          var list = chunks[lv];
          if (!Array.isArray(list)) return;
          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            if (!item || !item.word) continue;
            var key = normalizeDictWord(item.word);
            if (key && !vocabMap.has(key)) vocabMap.set(key, item);
            if (Array.isArray(item.wf)) {
              for (var j = 0; j < item.wf.length; j++) {
                var wfHead = normalizeDictWord(String(item.wf[j] || "").replace(/\([^)]*\)/g, ""));
                if (wfHead && !vocabWfMap.has(wfHead)) vocabWfMap.set(wfHead, item);
              }
            }
          }
        });
      }

      function ensureToeicVocabLoaded() {
        if (vocabMap) return Promise.resolve(vocabMap);
        if (vocabLoadPromise) return vocabLoadPromise;
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        var jobs = [1, 2, 3, 4].map(function (lv) {
          if (Array.isArray(chunks[lv]) && chunks[lv].length) return Promise.resolve(true);
          return loadScriptOnce("../vocab/data/vocab_u_" + lv + ".js?v=1");
        });
        vocabLoadPromise = Promise.all(jobs).then(function () {
          buildVocabLookupMaps();
          return vocabMap;
        });
        return vocabLoadPromise;
      }

      function lookupToeicWord(rawWord) {
        if (!vocabMap) return null;
        var w = normalizeDictWord(rawWord);
        if (!w) return null;
        if (vocabMap.has(w)) return { entry: vocabMap.get(w), via: "" };
        var cands = [];
        if (w.endsWith("'s")) cands.push(w.slice(0, -2));
        if (IRREGULAR_LEMMAS[w]) cands.push(IRREGULAR_LEMMAS[w]);
        if (w.endsWith("ies") && w.length > 4) cands.push(w.slice(0, -3) + "y");
        if (w.endsWith("es") && w.length > 3) cands.push(w.slice(0, -2));
        if (w.endsWith("s") && w.length > 2) cands.push(w.slice(0, -1));
        if (w.endsWith("ied") && w.length > 4) cands.push(w.slice(0, -3) + "y");
        if (w.endsWith("ed") && w.length > 3) {
          var se = w.slice(0, -2);
          cands.push(se, se + "e");
          if (se.length >= 3 && se.charAt(se.length - 1) === se.charAt(se.length - 2)) cands.push(se.slice(0, -1));
        }
        if (w.endsWith("ing") && w.length > 4) {
          var si = w.slice(0, -3);
          cands.push(si, si + "e");
          if (si.length >= 3 && si.charAt(si.length - 1) === si.charAt(si.length - 2)) cands.push(si.slice(0, -1));
        }
        if (w.endsWith("ly") && w.length > 4) {
          cands.push(w.slice(0, -2));
          if (w.endsWith("ily")) cands.push(w.slice(0, -3) + "y");
        }
        for (var i = 0; i < cands.length; i++) {
          if (cands[i] && vocabMap.has(cands[i])) return { entry: vocabMap.get(cands[i]), via: cands[i] };
        }
        if (vocabWfMap && vocabWfMap.has(w)) {
          var we = vocabWfMap.get(w);
          return { entry: we, via: we.word };
        }
        return null;
      }

      function speakDictWord(word, accent) {
        var clean = String(word || "").trim();
        if (!clean) return;
        var lang = normalizeAccent(accent || "en-US");
        var audioUrl = "";
        if (currentDictEntry && normalizeDictWord(currentDictEntry.word) === normalizeDictWord(clean)) {
          if (lang === "en-GB" && currentDictEntry.localUkAudio) audioUrl = currentDictEntry.localUkAudio;
          else if (lang === "en-US" && currentDictEntry.localUsAudio) audioUrl = currentDictEntry.localUsAudio;
          if (audioUrl && audioUrl.indexOf("media/") === 0) audioUrl = "../vocab/" + audioUrl;
        }
        if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
          window.S4UI.speakEnglish(clean, { lang: lang, rate: 0.95, audioUrl: audioUrl });
        } else {
          playQueue([{ text: clean, accent: lang, speaker: "W", pauseAfterMs: 0, label: "Phát âm " + clean }], "Xong");
        }
      }

            + (wfList.length ? '<div class="dict-sec"><div class="dict-sec-lbl">Word Family</div><div class="dict-chips">' + wfList.map(function (w) { return '<span class="dict-chip">' + esc(w) + '</span>'; }).join("") + '</div></div>' : '')
            + (colList.length ? '<div class="dict-sec"><div class="dict-sec-lbl">Collocations TOEIC</div><div class="dict-chips">' + colList.map(function (c) { return '<span class="dict-chip">' + esc(c) + '</span>'; }).join("") + '</div></div>' : '')
            + (entry.trap ? '<div class="dict-trap-box"><div class="dict-trap-lbl">Nghĩa bẫy ETS</div><div>' + esc(entry.trap) + '</div></div>' : '');
        } else {

        }

        sheet.innerHTML =
          '<div class="modal-head">'
          + '<div style="min-width:0;flex:1;">'
          +   '<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;">'
          +     '<h3 class="dict-word">' + esc(displayWord) + '</h3>'
          +     (entry && entry.pos ? '<span class="dict-pos">' + esc(entry.pos) + '</span>' : '')
          +     (entry && entry.level ? '<span class="meta-pill is-accent" style="padding:2px 7px;font-size:10.4px;">Chặng ' + entry.level + '</span>' : '')
          +   '</div>'
          +   (entry && entry.ipa ? '<div class="dict-ipa">' + esc(entry.ipa) + '</div>' : '')
          + '</div>'
          + '<button type="button" class="btn btn-sm" id="btnCloseDictPopup">' + svgIcon("close", 13) + '<span>Đóng</span></button>'
          + '</div>'
          + audioBtns
          + bodyHtml;
      }

      function openDictPopup(rawWord, anchorEl) {
        var clean = String(rawWord || "").trim();
        if (!clean) return;
        var prev = document.querySelectorAll(".tap-word.is-active");
        for (var i = 0; i < prev.length; i++) prev[i].classList.remove("is-active");
        if (anchorEl) anchorEl.classList.add("is-active");

        var modal = document.getElementById("toeicDictPopup");
        if (!modal) return;
        modal.classList.add("open");

        var seq = ++dictOpenSeq;
        if (vocabMap) {
          renderDictPopupContent(clean, lookupToeicWord(clean), false);
          return;
        }
        renderDictPopupContent(clean, null, true);
        ensureToeicVocabLoaded().then(function () {
          if (seq !== dictOpenSeq) return;
          renderDictPopupContent(clean, lookupToeicWord(clean), false);
        });
      }

          // Submit Exam

          // Section Switch

          // Part Switch
          var partBtn = e.target.closest("[data-switch-part]");
          if (partBtn) {

          }
          // Reading Group Switch (Part 6 / Part 7)
          var rGrpBtn = e.target.closest("[data-select-rgrp]");

            saveCurrentGroupHighlightSnapshot();
            var gi = Number(rGrpBtn.getAttribute("data-select-rgrp"));

          var jumpBtn = e.target.closest("[data-jump-num]");
          if (jumpBtn) {
            jumpToQuestion(Number(jumpBtn.getAttribute("data-jump-num")));
            return;

          // Prev / Next question & Palette collapse
          if (e.target.closest("#btnPrevQ")) { stepQuestion(-1); return; }
          if (e.target.closest("#btnNextQ")) { stepQuestion(1); return; }
          if (e.target.closest("#btnTogglePal")) {
            paletteCollapsed = !paletteCollapsed;
            var dock = document.getElementById("examBottomDock");

          // Font size

          if (fontBtn) {
            var sz = fontBtn.getAttribute("data-set-font");
            cbtFontSize = (sz === "sm" || sz === "lg") ? sz : "md";
            examShellEl.classList.remove("cbt-font-sm", "cbt-font-md", "cbt-font-lg");
            examShellEl.classList.add("cbt-font-" + cbtFontSize);
            examShellEl.querySelectorAll("[data-set-font]").forEach(function (b) {

            return;
