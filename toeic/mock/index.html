      gap: 8px;
    }
    .audio-ctrl-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .audio-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.4px;
      font-weight: 700;
      color: var(--lg-ink-sub);
    }
    .audio-eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      flex-shrink: 0;
    }
    .audio-eq i {
      display: block;
      width: 3px;
      height: 5px;
      border-radius: 2px;
      background: var(--lg-ink-muted);
    }
    .audio-studio.is-playing .audio-eq i {
      background: var(--lg-accent);
      animation: eqPulse 0.85s ease-in-out infinite;
    }
    .audio-studio.is-playing .audio-eq i:nth-child(2) { animation-delay: 0.15s; }
    .audio-studio.is-playing .audio-eq i:nth-child(3) { animation-delay: 0.30s; }
    .audio-studio.is-playing .audio-eq i:nth-child(4) { animation-delay: 0.45s; }
    @keyframes eqPulse {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .audio-prog-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: var(--lg-bar-track);
      overflow: hidden;
    }
    .audio-prog-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lg-accent), var(--teal));
      transition: width 0.2s ease;
    }

    /* Part Banner & Cards */
    .part-head-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--lg-wash);
    }
    .part-head-title {
      font-size: 14.8px;
      font-weight: 800;
      color: var(--lg-ink);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .part-head-title svg { color: var(--lg-accent); flex-shrink: 0; }
    .part-head-sub {
      font-size: 12.2px;
      font-weight: 600;
      color: var(--lg-ink-sub);
    }

    .q-card {
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      border-radius: 16px;
      padding: 14px 15px;
      min-width: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .q-card.is-current, .q-card.is-focused {
      border-color: var(--lg-accent);
      box-shadow: 0 0 0 2.5px var(--lg-accent-soft);
    }
    .q-card.is-flagged { border-color: rgba(217, 119, 6, 0.58); }
    .q-card.is-speaking {
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .q-card.is-graded-right { border-color: rgba(22, 163, 74, 0.50); }
    .q-card.is-graded-wrong { border-color: rgba(220, 38, 38, 0.48); }

    .q-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .q-head-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .q-num-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .q-flag-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink-muted);
      font-size: 11.4px;
      font-weight: 800;
      cursor: pointer;
    }
    .q-flag-btn:hover { border-color: var(--warn); color: var(--warn); }
    .q-flag-btn.is-flagged {
      background: var(--warn-soft);
      border-color: rgba(217, 119, 6, 0.52);
      color: var(--warn);
    }

    /* Part 1 Image & Blind Bubbles */
    .p1-img-wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 12px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--lg-hairline);
      background: rgba(255, 255, 255, 0.94);
    }
    .p1-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 480 / 280;
      object-fit: contain;
    }
    .ets-blind-prompt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--lg-wash);
      border: 1px dashed var(--lg-hairline);
      font-size: 12.6px;
      font-weight: 700;
      color: var(--lg-ink-sub);
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .ets-blind-prompt svg { color: var(--lg-accent); flex-shrink: 0; }
    .ets-bubble-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 4px 0;
    }
    .ets-bubble-btn {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      border: 2px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.13s ease, border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .ets-bubble-btn:hover { border-color: var(--lg-accent); transform: translateY(-1px); }
    .ets-bubble-btn.selected {
      background: var(--lg-accent);
      border-color: var(--lg-accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.30);
    }

    /* Part 3 & 4 Groups + Graphic HTML Table */
    .lgrp-card {
      background: var(--lg-wash);
      border: 1px solid var(--lg-hairline);
      border-radius: 18px;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-width: 0;
      max-width: 100%;
    }
    .lgrp-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .lgrp-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--lg-ink);
      line-height: 1.35;
    }
    .lgrp-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--lg-ink-muted);
      margin-top: 2px;
    }
    .graphic-card {
      border-radius: 14px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      padding: 11px 13px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .graphic-card-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13.2px;
      font-weight: 800;
      color: var(--lg-accent);
    }
    .graphic-table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      border: 1px solid var(--lg-divider);
    }
    .graphic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(12.8px * var(--cbt-fs-scale));
    }
    .graphic-table th, .graphic-table td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--lg-divider);
      line-height: 1.45;
      vertical-align: top;
      overflow-wrap: normal;
      word-break: normal;
    }
    .graphic-table th {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-weight: 800;
      white-space: nowrap;
    }
    .graphic-table tbody tr:nth-child(even) td { background: var(--lg-wash); }
    .graphic-table tbody tr:last-child td { border-bottom: none; }
    .graphic-note { margin-top: 6px; font-size: 11.8px; color: var(--lg-ink-muted); font-style: italic; }

    /* Standard MCQ Options */
    .q-prompt {
      font-size: calc(14.5px * var(--cbt-fs-scale));
      font-weight: 700;
      line-height: 1.58;
      color: var(--lg-ink);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .q-blank-slot {
      display: inline-block;
      padding: 0 7px;
      margin: 0 2px;
      border-radius: 6px;
      border-bottom: 2px solid var(--lg-accent);
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-weight: 800;
    }
    .quiz-opts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .cbt-right .quiz-opts { grid-template-columns: minmax(0, 1fr); gap: 7px; }
    .q-opt {
      width: 100%;
      text-align: left;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: calc(13.6px * var(--cbt-fs-scale));
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.44;
      overflow-wrap: anywhere;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .q-opt:hover:not(:disabled):not(.is-review-opt) { border-color: var(--lg-accent); background: var(--lg-wash-hover); }
    .q-opt:disabled, .q-opt.is-review-opt { cursor: default; }
    .q-opt-letter {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--lg-seg-track);
      color: var(--lg-ink-sub);
      font-size: 11.4px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q-opt.selected { border-color: var(--lg-accent); background: var(--lg-accent-soft); font-weight: 700; }
    .q-opt.selected .q-opt-letter { background: var(--lg-accent); color: #fff; }
    .q-opt.correct { border-color: #16a34a !important; background: var(--ok-soft) !important; color: var(--ok) !important; font-weight: 800; }
    .q-opt.correct .q-opt-letter { background: #16a34a; color: #fff; }
    .q-opt.wrong { border-color: #dc2626 !important; background: var(--err-soft) !important; color: var(--err) !important; font-weight: 700; }
    .q-opt.wrong .q-opt-letter { background: #dc2626; color: #fff; }

    /* Next Section Callout Banner (Listening -> Reading) */
    .next-sec-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 13px 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--lg-accent-soft), var(--teal-soft));
      border: 1px solid rgba(180, 83, 9, 0.30);
    }
    .next-sec-text {
      font-size: 13.2px;
      font-weight: 700;
      color: var(--lg-ink);
      line-height: 1.45;
    }

    /* ---------------- CBT SPLIT-SCREEN (PART 6 & PART 7) ---------------- */
    .cbt-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--lg-divider);
      background: var(--lg-wash);
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .cbt-group-pills {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      min-width: 0;
      flex: 1 1 0%;
    }
    .cbt-subbar .audio-ctrl-group {
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .cbt-group-pills::-webkit-scrollbar { display: none; }
    .grp-pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink-sub);
      font-size: 11.4px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .grp-pill:hover { border-color: var(--lg-accent); color: var(--lg-ink); }
    .grp-pill.active { background: var(--lg-accent); color: #fff; border-color: transparent; }

    .hl-clear-btn { display: none; background: var(--hl-bg); color: var(--lg-ink); border-color: var(--hl-border); }
    .hl-clear-btn.has-hl { display: inline-flex; }

    .cbt-mob-switcher {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--lg-divider);
      background: var(--lg-seg-track);
      flex-shrink: 0;
    }
    .cbt-mob-tab {
      border: none;
      background: transparent;
      color: var(--lg-ink-sub);
      font-size: 11.8px;
      font-weight: 800;
      padding: 6px 4px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .cbt-mob-tab.active { background: var(--lg-accent); color: #fff; }

    .cbt-split {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }
    .cbt-left {
      flex: 0 0 var(--cbt-left-pct, 52%);
      width: var(--cbt-left-pct, 52%);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cbt-right {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .split-resizer {
      width: 11px;
      flex: 0 0 11px;
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lg-wash);
      border-left: 1px solid var(--lg-divider);
      border-right: 1px solid var(--lg-divider);
      user-select: none;
      touch-action: none;
      z-index: 5;
    }
    .split-resizer::before {
      content: "";
      width: 3px;
      height: 44px;
      border-radius: 999px;
      background: var(--lg-ink-muted);
      opacity: 0.45;
      transition: opacity 0.15s ease, background 0.15s ease, height 0.15s ease;
    }
    .split-resizer:hover, .split-resizer.dragging { background: var(--lg-accent-soft); }
    .split-resizer:hover::before, .split-resizer.dragging::before { background: var(--lg-accent); opacity: 1; height: 60px; }

    .cbt-left-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--lg-divider);
      background: var(--lg-wash);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .cbt-left-tabs::-webkit-scrollbar { display: none; }
    .p-tab-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink-sub);
      font-size: 11.6px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .p-tab-btn.active { background: var(--lg-accent); color: #fff; border-color: transparent; }

    .cbt-left-scroll, .cbt-right-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px 20px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Passage Genre Cards */
    .passage-stack { display: flex; flex-direction: column; gap: 12px; }
    #examShell .passage-card,
    #reportRoot .passage-card,
    .passage-card {
      border-radius: 15px !important;
      padding: 0 !important;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }
    .passage-card.is-hidden { display: none; }
    .passage-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 12px;
      background: var(--lg-wash);
      border-bottom: 1px solid var(--lg-divider);
      font-size: 12px;
      font-weight: 800;
      color: var(--lg-ink);
    }
    .passage-bar-left { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .passage-bar-left svg { color: var(--lg-accent); flex-shrink: 0; }
    .genre-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.4px;
      font-weight: 800;
      text-transform: uppercase;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      flex-shrink: 0;
    }
    .genre-badge.is-chat { background: var(--teal-soft); color: var(--teal); }
    .genre-badge.is-table { background: var(--info-soft); color: var(--info); }
    .genre-badge.is-ad { background: var(--violet-soft); color: var(--violet); }
    .genre-badge.is-review { background: var(--ok-soft); color: var(--ok); }
    .passage-body {
      padding: 12px 14px 14px;
      font-size: calc(14.4px * var(--cbt-fs-scale));
      line-height: 1.7;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .doc-email-meta {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 4px 10px;
      padding: 9px 11px;
      margin-bottom: 11px;
      border-radius: 11px;
      background: var(--lg-wash);
      border-left: 3px solid var(--lg-accent);
      font-size: calc(12.8px * var(--cbt-fs-scale));
      line-height: 1.48;
    }
    .doc-meta-k { font-weight: 800; color: var(--lg-ink-muted); white-space: nowrap; }
    .doc-meta-v { font-weight: 600; color: var(--lg-ink); min-width: 0; overflow-wrap: anywhere; }
    .doc-meta-v.is-subj { font-weight: 800; }
    .doc-head-block { margin-bottom: 11px; padding-bottom: 9px; border-bottom: 1px solid var(--lg-divider); }
    .passage-card.genre-ad .doc-head-block {
      padding: 9px 11px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--lg-accent-soft), var(--violet-soft));
      border-bottom: none;
    }
    .passage-card.genre-notice .doc-head-block { border-left: 3.5px solid var(--teal); padding-left: 10px; border-bottom: none; padding-bottom: 2px; }
    .doc-title { margin: 0; font-size: calc(15.6px * var(--cbt-fs-scale)); font-weight: 800; line-height: 1.35; color: var(--lg-ink); }
    .doc-sub { margin: 4px 0 0; font-size: calc(12.5px * var(--cbt-fs-scale)); color: var(--lg-ink-sub); font-weight: 600; }
    .doc-p { margin: 0 0 10px; font-size: calc(14.3px * var(--cbt-fs-scale)); line-height: 1.7; color: var(--lg-ink); white-space: pre-line; }
    .doc-p:last-child { margin-bottom: 0; }
    .chat-list { display: flex; flex-direction: column; gap: 8px; }
    .chat-bubble { padding: 8px 11px; border-radius: 13px; background: var(--lg-wash); border: 1px solid var(--lg-divider); max-width: 94%; }
    .chat-bubble.is-alt { align-self: flex-end; background: var(--lg-accent-soft); border-color: rgba(180, 83, 9, 0.25); }
    .chat-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
    .chat-sender { font-size: calc(12.2px * var(--cbt-fs-scale)); font-weight: 800; color: var(--lg-accent); }
    .chat-bubble.is-alt .chat-sender { color: var(--teal); }
    .chat-time { font-size: 11px; font-weight: 700; color: var(--lg-ink-muted); white-space: nowrap; }
    .chat-text { font-size: calc(13.8px * var(--cbt-fs-scale)); line-height: 1.56; color: var(--lg-ink); }
    .doc-table-wrap { margin-top: 10px; min-width: 0; max-width: 100%; }
    .doc-table-wrap:first-child { margin-top: 0; }
    .doc-table-caption { font-size: calc(12.4px * var(--cbt-fs-scale)); font-weight: 800; color: var(--lg-accent); margin-bottom: 5px; }
    .doc-table-scroll { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--lg-divider); }
    .doc-table { width: 100%; border-collapse: collapse; font-size: calc(12.8px * var(--cbt-fs-scale)); }
    .doc-table th, .doc-table td {
      padding: 7px 9px;
      text-align: left;
      border-bottom: 1px solid var(--lg-divider);
      line-height: 1.44;
      vertical-align: top;
      overflow-wrap: normal;
      word-break: normal;
    }
    .doc-table th { background: var(--lg-accent-soft); color: var(--lg-accent); font-weight: 800; white-space: nowrap; }
    .doc-table tbody tr:nth-child(even) td { background: var(--lg-wash); }
    .doc-table tbody tr:last-child td { border-bottom: none; }
    .doc-table-note { margin-top: 5px; font-size: 11.6px; color: var(--lg-ink-muted); font-style: italic; }

    /* Part 6 Blank Chips */
    .p6-blank-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      margin: 0 2px;
      border-radius: 8px;
      border: 1.5px solid var(--lg-accent);
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 0.9em;
      font-weight: 800;
      line-height: 1.45;
      cursor: pointer;
      vertical-align: baseline;
    }
    .p6-blank-chip:hover { background: var(--lg-accent); color: #fff; }
    .p6-blank-chip.is-answered { background: var(--info-soft); border-color: var(--info); color: var(--info); }
    .p6-blank-chip.is-correct { background: var(--ok-soft); border-color: #16a34a; color: var(--ok); }
    .p6-blank-chip.is-wrong { background: var(--err-soft); border-color: #dc2626; color: var(--err); }

    /* Highlight Mark & Floating Popover */
    mark.cbt-hl {
      background: var(--hl-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .cbt-hl-popover {
      position: fixed;
      z-index: 10200;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 4px 5px;
      border-radius: 999px;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      backdrop-filter: var(--lg-blur);
      -webkit-backdrop-filter: var(--lg-blur);
      border: 1px solid var(--lg-hairline);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.24);
    }
    .cbt-hl-popover button {
      border: none;
      background: transparent;
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .cbt-hl-popover button.hl-do:hover { background: var(--hl-bg); }
    .cbt-hl-popover button.hl-del { color: var(--err); }
    .cbt-hl-popover button.hl-del:hover { background: var(--err-soft); }

    /* ---------------- BOTTOM QUESTION PALETTE DOCK ---------------- */
    .exam-bottom-dock {
      border-radius: 16px;
      padding: 7px 10px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }
    .dock-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      min-width: 0;
    }
    .part-tabs-scroll {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      min-width: 0;
      flex: 1 1 auto;
    }
    .part-tabs-scroll::-webkit-scrollbar { display: none; }
    .dock-part-btn {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink-sub);
      font-size: 11.4px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dock-part-btn:hover:not(.is-locked) { border-color: var(--lg-accent); color: var(--lg-ink); }
    .dock-part-btn.active { background: var(--lg-accent); color: #fff; border-color: transparent; }
    .dock-part-btn.is-locked { opacity: 0.48; cursor: not-allowed; }
    .dock-nav-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .palette-grid-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
      max-height: 70px;
    }
    .exam-bottom-dock.is-collapsed .palette-grid-wrap { display: none; }
    .pal-num-btn {
      position: relative;
      min-width: 28px;
      height: 27px;
      padding: 0 5px;
      border-radius: 7px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink);
      font-size: 11.4px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    .pal-num-btn:hover { border-color: var(--lg-accent); }
    .pal-num-btn.is-answered { background: var(--lg-accent-soft); border-color: var(--lg-accent); color: var(--lg-accent); }
    .pal-num-btn.is-current { background: var(--lg-accent); border-color: var(--lg-accent); color: #fff; box-shadow: 0 0 0 2px var(--lg-accent-soft); }
    .pal-num-btn.is-flagged::after {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #f59e0b;
      border: 1.5px solid var(--lg-surface);
    }

    /* ---------------- SCREEN 3: REPORT & REVIEW ---------------- */
    .report-hero {
      border-radius: 24px;
      padding: 20px 22px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .report-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }
    .score-ring-card {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .score-big-badge {
      min-width: 124px;
      padding: 14px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--lg-accent), #d97706);
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 26px rgba(180, 83, 9, 0.28);
    }
    .score-big-num {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .score-big-max { font-size: 12px; font-weight: 800; opacity: 0.9; margin-top: 2px; }
    .score-sub-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .score-sub-cell {
      padding: 11px 13px;
      border-radius: 15px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      min-width: 0;
    }
    .score-sub-lbl { font-size: 11.4px; font-weight: 800; color: var(--lg-ink-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .score-sub-val { font-size: 20px; font-weight: 900; color: var(--lg-ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .score-sub-note { font-size: 11.8px; font-weight: 700; color: var(--lg-ink-sub); margin-top: 2px; }

    /* 7-Part Chart */
    .part-chart-card {
      border-radius: 22px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .part-chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }
    .part-chart-title {
      margin: 0;
      font-size: 15.8px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--lg-ink);
    }
    .part-chart-title svg { color: var(--lg-accent); flex-shrink: 0; }
    .part-bars { display: flex; flex-direction: column; gap: 9px; }
    .part-bar-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 86px;
      align-items: center;
      gap: 10px;
    }
    .part-bar-lbl {
      font-size: 12.6px;
      font-weight: 800;
      color: var(--lg-ink);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .part-bar-track {
      height: 11px;
      border-radius: 999px;
      background: var(--lg-bar-track);
      overflow: hidden;
    }
    .part-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lg-accent), #f59e0b);
      transition: width 0.4s ease;
    }
    .part-bar-fill.is-good { background: linear-gradient(90deg, #16a34a, #22c55e); }
    .part-bar-fill.is-weak { background: linear-gradient(90deg, #dc2626, #f97316); }
    .part-bar-val {
      font-size: 12.2px;
      font-weight: 800;
      color: var(--lg-ink-sub);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .weak-callout {
      margin-top: 13px;
      padding: 12px 14px;
      border-radius: 15px;
      background: var(--warn-soft);
      border: 1px solid rgba(217, 119, 6, 0.36);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .weak-callout-txt { font-size: 13px; font-weight: 700; color: var(--lg-ink); line-height: 1.45; }

    /* Review Mode */
    .review-toolbar {
      border-radius: 18px;
      padding: 12px 15px;
      margin-bottom: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .review-list { display: flex; flex-direction: column; gap: 13px; }
    .rev-opt-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-wash);
    }
    .rev-opt-row.correct { border-color: #16a34a; background: var(--ok-soft); }
    .rev-opt-row.wrong { border-color: #dc2626; background: var(--err-soft); }
    .rev-opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--lg-seg-track);
      color: var(--lg-ink);
      font-size: 11.8px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rev-opt-row.correct .rev-opt-letter { background: #16a34a; color: #fff; }
    .rev-opt-row.wrong .rev-opt-letter { background: #dc2626; color: #fff; }
    .rev-opt-en { font-size: 13.8px; font-weight: 700; line-height: 1.54; color: var(--lg-ink); overflow-wrap: anywhere; }
    .rev-opt-vi { font-size: 12.6px; color: var(--lg-ink-sub); margin-top: 2px; line-height: 1.45; }
    .mini-spk-btn {
      width: 29px;
      height: 29px;
      border-radius: 8px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mini-spk-btn:hover { background: var(--lg-accent); color: #fff; border-color: transparent; }

    .transcript-box {
      border-radius: 14px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .transcript-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--teal);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .turn-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--lg-wash);
    }
    .turn-spk-pill {
      display: inline-flex;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 10.8px;
      font-weight: 800;
      white-space: nowrap;
      background: var(--info-soft);
      color: var(--info);
    }
    .turn-spk-pill.is-w { background: var(--rose-soft); color: var(--rose); }
    .turn-spk-pill.is-m2 { background: var(--violet-soft); color: var(--violet); }
    .turn-en { font-size: 13.8px; font-weight: 600; line-height: 1.56; color: var(--lg-ink); overflow-wrap: anywhere; }
    .turn-vi { font-size: 12.5px; color: var(--lg-ink-sub); margin-top: 2px; line-height: 1.45; }

    .q-exp-box {
      margin-top: 9px;
      padding: 9px 12px;
      border-radius: 11px;
      background: var(--lg-wash);
      border-left: 3.5px solid var(--lg-accent);
      font-size: 13px;
      line-height: 1.56;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .q-exp-box.is-ok { border-left-color: #16a34a; }
    .q-exp-box.is-err { border-left-color: #dc2626; }
    .q-exp-head { font-size: 11.8px; font-weight: 800; margin-bottom: 3px; display: inline-flex; align-items: center; gap: 5px; }
    .q-exp-box.is-ok .q-exp-head { color: var(--ok); }
    .q-exp-box.is-err .q-exp-head { color: var(--err); }

    /* Paraphrase Table */
    .para-card {
      border-radius: 14px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      padding: 11px 13px;
      min-width: 0;
      max-width: 100%;
    }
    .para-title { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--teal); margin-bottom: 8px; }
    .para-table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
    .para-table th, .para-table td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--lg-divider); line-height: 1.45; vertical-align: top; overflow-wrap: anywhere; }
    .para-table th { background: var(--teal-soft); color: var(--teal); font-weight: 800; font-size: 11.6px; }
    .para-table tbody tr:nth-child(even) td { background: var(--lg-wash); }
    .para-table tbody tr:last-child td { border-bottom: none; }
    .para-en-src { font-weight: 700; color: var(--lg-ink); }
    .para-en-ans { font-weight: 800; color: var(--lg-accent); }

    /* ---------------- TAP-TO-LOOKUP & MODALS ---------------- */
    .tap-word {
      display: inline;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 1px;
      border-bottom: 1px dotted rgba(180, 83, 9, 0.42);
      transition: background 0.12s ease, color 0.12s ease;
    }
    html.dark .tap-word { border-bottom-color: rgba(245, 158, 11, 0.48); }
    .tap-word:hover, .tap-word:focus-visible, .tap-word.is-active {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      border-bottom-color: var(--lg-accent);
      outline: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10300;
      background: var(--lg-modal-backdrop, rgba(15, 23, 42, 0.42));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 540px;
      max-height: 84vh;
      overflow-y: auto;
      padding: 18px 18px 20px;
      border-radius: 22px;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      border: 1px solid var(--lg-hairline);
      box-shadow: 0 22px 52px rgba(15, 23, 42, 0.34), inset 0 1px 0 var(--lg-rim-top, rgba(255, 255, 255, 0.45));
      color: var(--lg-ink);
      overscroll-behavior: contain;
    }
    .dict-sheet { max-width: 470px; }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .modal-title { margin: 0; font-size: 17.5px; font-weight: 800; color: var(--lg-ink); display: inline-flex; align-items: center; gap: 7px; }
    .modal-title svg { color: var(--lg-accent); }
    .dict-word { font-size: 20px; font-weight: 800; color: var(--lg-accent); margin: 0; }
    .dict-pos { font-size: 12.5px; font-weight: 800; color: var(--teal); }
    .dict-ipa { font-size: 13px; color: var(--lg-ink-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 3px; }
    .dict-audio-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 11px; }
    .dict-accent-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .dict-accent-btn:hover { background: var(--lg-accent); color: #fff; border-color: transparent; }
    .dict-def-vi { font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--lg-ink); margin-bottom: 5px; }
    .dict-def-en { font-size: 13px; color: var(--lg-ink-sub); line-height: 1.5; margin-bottom: 10px; }
    .dict-sec { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--lg-divider); }
    .dict-sec-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--lg-ink-muted); margin-bottom: 6px; }
    .dict-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .dict-chip { padding: 3px 9px; border-radius: 8px; background: var(--lg-wash); border: 1px solid var(--lg-divider); font-size: 12px; font-weight: 700; color: var(--lg-ink); }
    .dict-trap-box { margin-top: 10px; padding: 9px 11px; border-radius: 11px; background: var(--err-soft); border: 1px solid rgba(220, 38, 38, 0.25); font-size: 12.6px; line-height: 1.5; }
    .dict-trap-lbl { font-size: 10.8px; font-weight: 800; color: var(--err); text-transform: uppercase; margin-bottom: 2px; }
    .dict-fallback-note { padding: 10px 12px; border-radius: 12px; background: var(--lg-wash); font-size: 13px; color: var(--lg-ink-sub); line-height: 1.55; }

    .hist-item {
      padding: 11px 13px;
      border-radius: 14px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hist-item:last-child { margin-bottom: 0; }
    .hist-score-pill {
      padding: 5px 11px;
      border-radius: 11px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hist-score-pill.is-pass { background: var(--ok-soft); color: var(--ok); }

    .loading-state {
      padding: 46px 18px;
      text-align: center;
      color: var(--lg-ink-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    /* ---------------- RESPONSIVE (820px, 640px, 580px / 360px) ---------------- */
    @media (max-width: 820px) {
      .cbt-mob-switcher { display: grid; }
      .cbt-split { flex-direction: column; }
      .split-resizer { display: none !important; }
      .cbt-left { width: 100% !important; flex: 0 0 46%; border-bottom: 2px solid var(--lg-hairline); }
      .cbt-right { width: 100% !important; flex: 1 1 54%; }
      .cbt-split.mob-view-left .cbt-left { flex: 1 1 100%; border-bottom: none; }
      .cbt-split.mob-view-left .cbt-right { display: none; }
      .cbt-split.mob-view-right .cbt-left { display: none; }
      .cbt-split.mob-view-right .cbt-right { flex: 1 1 100%; }
      .exam-font-grp { display: none; }
    }

    @media (max-width: 640px) {
      .mode-grid { grid-template-columns: minmax(0, 1fr); }
      .mock-grid { grid-template-columns: minmax(0, 1fr); gap: 11px; }
      .quiz-opts { grid-template-columns: minmax(0, 1fr); }
      .score-sub-grid { grid-template-columns: minmax(0, 1fr); }
      .part-bar-row { grid-template-columns: 112px minmax(0, 1fr) 74px; gap: 7px; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-sheet { max-width: 100%; border-radius: 22px 22px 0 0; padding: 16px 15px calc(18px + env(safe-area-inset-bottom, 0px)); }
      .para-table thead { display: none; }
      .para-table, .para-table tbody, .para-table tr, .para-table td { display: block; width: 100%; }
      .para-table tr { padding: 8px 9px; margin-bottom: 7px; border-radius: 11px; border: 1px solid var(--lg-divider); background: var(--lg-wash); }
      .para-table tr:last-child { margin-bottom: 0; }
      .para-table td { padding: 2px 0; border-bottom: none; background: transparent !important; }
      .para-table td::before { content: attr(data-label) ": "; font-size: 10.6px; font-weight: 800; text-transform: uppercase; color: var(--lg-ink-muted); }
    }

    @media (max-width: 580px) {
      .mk-topbar-wrap { padding: calc(5px + var(--s4-safe-top, 0px)) 7px 0; }
      body.in-exam-view .mk-topbar-wrap { padding: calc(4px + var(--s4-safe-top, 0px)) 7px 0; }
      .mk-topbar-wrap .lp-topbar { padding: 4px 8px; gap: 5px; min-height: 44px; height: 44px; border-radius: 16px; }
      .mk-topbar-wrap .lp-brand { display: none; }
      .mk-topbar-wrap .lp-back-pill { height: 32px; padding: 0 9px; font-size: 12px; gap: 3px; }
      .mk-topbar-wrap .lp-icon-btn { height: 32px; min-width: 32px; padding: 0 7px; font-size: 11.6px; }

      .mk-shell { padding: 9px 8px calc(26px + env(safe-area-inset-bottom, 6px)); }
      .lobby-hero-card { padding: 14px 13px; border-radius: 18px; }
      .lobby-hero-title { font-size: 17px; }
      .mock-card { padding: 14px 13px; border-radius: 18px; }

      .exam-shell { padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 4px)); gap: 5px; }
      .exam-topbar { padding: 5px 7px; gap: 4px; border-radius: 14px; overflow: hidden; }

  <script>
    (function () {
      "use strict";

      var SUBMISSIONS_KEY = "lp_toeic_mock_submissions_v1";
      var DRAFT_PREFIX = "lp_toeic_mock_draft_v1:";
      var DAYS_KEY = "lp_toeic_vocab_days_v1";
      var LETTERS = ["A", "B", "C", "D"];
      var SPEED_OPTIONS = [0.75, 1.0, 1.15, 1.25];
      var ACCENT_LABELS = { "en-US": "US", "en-GB": "UK", "en-AU": "AU" };

      var PART_LABELS = {
        1: { short: "P1", title: "Part 1 • Tả tranh", section: "listening", link: "../listening/index.html?part=part1" },
        2: { short: "P2", title: "Part 2 • Hỏi–Đáp", section: "listening", link: "../listening/index.html?part=part2" },
        3: { short: "P3", title: "Part 3 • Hội thoại", section: "listening", link: "../listening/index.html?part=part3" },
        4: { short: "P4", title: "Part 4 • Bài nói ngắn", section: "listening", link: "../listening/index.html?part=part4" },
        5: { short: "P5", title: "Part 5 • Hoàn thành câu", section: "reading", link: "../reading/index.html?part=part5" },
        6: { short: "P6", title: "Part 6 • Điền đoạn văn", section: "reading", link: "../reading/index.html?part=part6" },
        7: { short: "P7", title: "Part 7 • Đọc hiểu", section: "reading", link: "../reading/index.html?part=part7s" }
      };

      var GENRE_LABELS = {
        email: "Email", chat: "Tin nhắn", memo: "Memo nội bộ", notice: "Thông báo",
        letter: "Thư tín", article: "Bài báo", ad: "Quảng cáo", review: "Đánh giá", table: "Bảng biểu"
      };

      var CUSTOM_SVG = {
        mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
        chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        fileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
        table: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/>',
        split: '<rect width="18" height="18" x="3" y="3" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>',
        star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
        listChecks: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
        send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
        save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
        chevronUp: '<path d="m18 15-6-6-6 6"/>'
      };

      // Fallback ETS conversion table (101 points: 0..100 -> 5..495) if catalog table unavailable
      function buildFallbackEtsTable() {
        var l = [], r = [];
        for (var i = 0; i <= 100; i++) {
          l.push(i <= 6 ? 5 : (i >= 93 ? 495 : Math.min(495, Math.round((5 + ((i - 6) / 87) * 490) / 5) * 5)));
          r.push(i <= 6 ? 5 : (i >= 97 ? 495 : Math.min(495, Math.round((5 + ((i - 6) / 91) * 490) / 5) * 5)));
        }
        return { listening: l, reading: r };
      }

      var CATALOG = window.LP_TOEIC_MOCK_CATALOG || {};
      var ALL_TESTS = Array.isArray(CATALOG.tests) ? CATALOG.tests.slice() : [];
      ALL_TESTS.sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
      var ETS_TABLE = (CATALOG.etsTable && Array.isArray(CATALOG.etsTable.listening) && CATALOG.etsTable.listening.length === 101 && Array.isArray(CATALOG.etsTable.reading) && CATALOG.etsTable.reading.length === 101)
        ? CATALOG.etsTable
        : buildFallbackEtsTable();

      var testCache = new Map();
      var fetchSeq = 0;

      // View & Lobby State
      var activeScreen = "lobby"; // "lobby" | "exam" | "report"
      var selectedMode = "ets";   // "ets" | "practice"
      var filterTier = "all";     // "all" | "mini" | "full"
      var filterLevel = "all";    // "all" | "1" | "2" | "3" | "4"

      // Active Exam State
      var activeTestMeta = null;
      var activeTest = null;
      var examIndex = null;
      var examMode = "ets";
      var examSection = "listening"; // "listening" | "reading"
      var examPart = 1;
      var currentNum = 1;
      var activeP6GroupIdx = 0;
      var activeP7GroupIdx = 0;
      var listeningLocked = false;
      var listeningRemainSec = 0;
      var readingRemainSec = 0;
      var elapsedSec = 0;
      var answers = {};        // num -> optIdx (0..3)
      var flagged = {};        // num -> boolean
      var playedAudio = {};    // audioKey -> true (enforces no-replay in ETS mode)
      var activeRate = 1.0;
      var accentOverride = "auto";
      var cbtLeftPct = 52;
      var cbtFontSize = "md";
      var cbtMobileView = "split";
      var activePassageTab = "all";
      var paletteCollapsed = false;
      var groupHlHtmlMap = new Map();
      var timerInterval = null;
      var draftInterval = null;
      var warn10Shown = false;
      var warn5Shown = false;

      // Report & Review State
      var lastReport = null;
      var reviewFilter = "all"; // "all" | "wrong" | "flagged"
      var reviewPartFilter = 0; // 0 = all, 1..7

      // DOM refs
      var viewLobbyEl = document.getElementById("viewLobby");
      var viewExamEl = document.getElementById("viewExam");
      var viewReportEl = document.getElementById("viewReport");
      var lobbyRootEl = document.getElementById("lobbyRoot");
      var examShellEl = document.getElementById("examShell");
      var reportRootEl = document.getElementById("reportRoot");
      var hlPopoverEl = document.getElementById("cbtHlPopover");

      /* ---------------- HELPERS ---------------- */
      function safeReadJson(key, fb) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fb;
          var parsed = JSON.parse(raw);
          return parsed !== null && parsed !== undefined ? parsed : fb;
        } catch (e) { return fb; }
      }

      function esc(str) {
        if (window.S4UI && typeof window.S4UI.escapeHtml === "function") {
          return window.S4UI.escapeHtml(str);
        }
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function svgIcon(name, size) {
        var sz = Number(size) > 0 ? Number(size) : 15;
        if (CUSTOM_SVG[name]) {
          return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + CUSTOM_SVG[name] + '</svg>';
        }
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          return window.S4UI.icon(name, sz);
        }
        return "";
      }

      function pad2(n) {
        var v = Number(n) || 0;
        return v < 10 ? "0" + v : String(v);
      }

      function formatClock(sec) {
        var s = Math.max(0, Math.floor(Number(sec) || 0));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return pad2(m) + ":" + pad2(r);
      }

      function formatDurationVi(sec) {
        var s = Math.max(0, Math.floor(Number(sec) || 0));
        var m = Math.floor(s / 60);
        var r = s % 60;
        if (m <= 0) return r + " giây";
        return m + "p " + pad2(r) + "s";
      }

      function showToast(type, msg, duration) {
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast({ type: type || "info", message: String(msg || ""), duration: duration || 2300 });
        }
      }

      function cleanOptionText(raw) {
        return String(raw == null ? "" : raw).replace(/^\s*\(?[A-D]\)?[.):]\s+/i, "").trim();
      }

      function normalizeAccent(raw) {
        var s = String(raw || "en-US").toLowerCase().replace("_", "-");
        if (s.indexOf("gb") !== -1 || s === "uk") return "en-GB";
        if (s.indexOf("au") !== -1 || s === "au") return "en-AU";
        return "en-US";
      }

      function accentShort(raw) {
        return ACCENT_LABELS[normalizeAccent(raw)] || "US";
      }

      function normalizeDictWord(raw) {
        return String(raw == null ? "" : raw)
          .toLowerCase()
          .replace(/[’‘`]/g, "'")
          .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
          .trim();
      }

      function wrapTapWords(rawText) {
        var str = String(rawText == null ? "" : rawText);
        if (!str) return "";
        var re = /[\u00C0-\u1EF9A-Za-z]+(?:['’-][\u00C0-\u1EF9A-Za-z]+)*/g;
        var asciiRe = /^[A-Za-z]{2,}(?:['’-][A-Za-z]+)*$/;
        var out = "";
        var lastIdx = 0;
        var m;
        while ((m = re.exec(str)) !== null) {
          if (m.index > lastIdx) out += esc(str.slice(lastIdx, m.index));
          var token = m[0];
          if (asciiRe.test(token)) {
            var norm = token.toLowerCase().replace(/’/g, "'");
            out += '<span class="tap-word" data-word="' + esc(norm) + '" role="button" tabindex="0">' + esc(token) + '</span>';
          } else {
            out += esc(token);
          }
          lastIdx = m.index + token.length;
        }
        if (lastIdx < str.length) out += esc(str.slice(lastIdx));
        return out;
      }

      function getCefrInfo(totalScore) {
        var sc = Number(totalScore) || 0;
        if (sc >= 945) return { code: "C1", label: "Cao cấp (C1)", desc: "Giao tiếp và xử lý văn bản thương mại chuyên sâu đạt chuẩn lãnh đạo quốc tế." };
        if (sc >= 785) return { code: "B2", label: "Trên trung cấp (B2)", desc: "Đủ năng lực làm việc độc lập tại doanh nghiệp đa quốc gia, xử lý tốt Part 7 kép/ba." };
        if (sc >= 550) return { code: "B1", label: "Trung cấp (B1)", desc: "Đạt chuẩn đầu ra đại học và tuyển dụng phổ thông; hãy tăng tốc Part 3–4 & Part 7." };
        if (sc >= 225) return { code: "A2", label: "Sơ cấp (A2)", desc: "Đã nắm khung câu cơ bản; nên củng cố 600 từ Barron's, Part 2 và Ngữ pháp 5s Part 5." };
        return { code: "A1", label: "Nhập môn (A1)", desc: "Bắt đầu lấy gốc với Chặng 1: Từ loại, 6 thì cốt lõi, Dictation chậm 0.75x và Part 1." };
      }

      function etsScoreFromRaw(raw, maxCount, skill) {
        var r = Math.max(0, Number(raw) || 0);
        var mx = Math.max(1, Number(maxCount) || 100);
        var scaled = mx === 100 ? Math.min(100, r) : Math.max(0, Math.min(100, Math.round((r / mx) * 100)));
        var tbl = skill === "listening" ? ETS_TABLE.listening : ETS_TABLE.reading;
        var val = tbl[scaled];
        return Number.isFinite(Number(val)) ? Number(val) : 5;
      }

      /* ---------------- STORAGE: SUBMISSIONS, DRAFTS & STREAK ---------------- */
      function getSubmissions() {
        var raw = safeReadJson(SUBMISSIONS_KEY, []);
        return Array.isArray(raw) ? raw : [];
      }

      function saveSubmission(record) {
        var list = getSubmissions();
        list.unshift(record);
        if (list.length > 120) list = list.slice(0, 120);
        try { localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(list)); } catch (e) {}
        recordMockStreak(record.testId);
        if (window.S4Auth && typeof window.S4Auth.scheduleCloudSync === "function") {
          try { window.S4Auth.scheduleCloudSync(); } catch (e) {}
        }
      }

      function recordMockStreak(testId) {
        if (!testId) return;
        var key = "m_" + testId;
        try {
          var days = safeReadJson(DAYS_KEY, {});
          if (!days || typeof days !== "object" || Array.isArray(days)) days = {};
          var now = new Date();
          var today = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
          var arr = Array.isArray(days[today]) ? days[today] : [];
          if (arr.indexOf(key) === -1) arr.push(key);
          days[today] = arr;
          localStorage.setItem(DAYS_KEY, JSON.stringify(days));
        } catch (e) {}
      }

      function getBestByTestId() {
        var subs = getSubmissions();
        var best = {};
        subs.forEach(function (r) {
          if (!r || !r.testId) return;
          var prev = best[r.testId];
          if (!prev || Number(r.totalScore || 0) > Number(prev.totalScore || 0)) {
            best[r.testId] = r;
          }
        });
        return best;
      }

      function getDraftKey(testId) {
        return DRAFT_PREFIX + String(testId || "");
      }

      function readDraft(testId) {
        if (!testId) return null;
        var d = safeReadJson(getDraftKey(testId), null);
        return (d && typeof d === "object" && d.testId === testId) ? d : null;
      }

      function clearDraft(testId) {
        if (!testId) return;
        try { localStorage.removeItem(getDraftKey(testId)); } catch (e) {}
      }

      function saveDraft(notify) {
        if (activeScreen !== "exam" || !activeTest) return;
        var payload = {
          testId: activeTest.id,
          mode: examMode,
          section: examSection,
          part: examPart,
          currentNum: currentNum,
          activeP6GroupIdx: activeP6GroupIdx,
          activeP7GroupIdx: activeP7GroupIdx,
          listeningLocked: listeningLocked,
          listeningRemainSec: listeningRemainSec,
          readingRemainSec: readingRemainSec,
          elapsedSec: elapsedSec,
          answers: answers,
          flagged: flagged,
          playedAudio: playedAudio,
          savedAt: new Date().toISOString()
        };
        try { localStorage.setItem(getDraftKey(activeTest.id), JSON.stringify(payload)); } catch (e) {}
        if (notify) {
          showToast("success", "Đã lưu nháp bài thi vào thiết bị!", 1800);
        }
      }

      /* ---------------- THEME CONTROLS ---------------- */
      function syncDarkBtn() {
        var btn = document.getElementById("btnMockDark");
        if (!btn) return;
        var isDark = document.documentElement.classList.contains("dark");
        if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn, isDark);
        } else {
          btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
        }
      }

      function toggleDark() {
        if (typeof window.toggleDarkModeOnly === "function") {
          window.toggleDarkModeOnly();
        } else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          if (document.body) document.body.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
          var s = localStorage.getItem("s4_theme_style") || "ghibli";

      /* ---------------- TEST DATA NORMALIZER ---------------- */
      function indexTestData(test) {
        var L = (test && test.listening) || {};
        var R = (test && test.reading) || {};
        var p1 = Array.isArray(L.part1) ? L.part1 : [];
        var p2 = Array.isArray(L.part2) ? L.part2 : [];
        var p3 = Array.isArray(L.part3) ? L.part3 : [];
        var p4 = Array.isArray(L.part4) ? L.part4 : [];
        var p5 = Array.isArray(R.part5) ? R.part5 : [];
        var p6 = Array.isArray(R.part6) ? R.part6 : [];
        var p7 = Array.isArray(R.part7) ? R.part7 : [];

        var allQuestions = [];
        var byNum = {};
        var byPart = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };

        function pushQ(rec) {
          allQuestions.push(rec);
          byNum[rec.num] = rec;
          byPart[rec.part].push(rec);
        }

        p1.forEach(function (it, idx) {
          pushQ({
            num: Number(it.num) || (idx + 1),
            part: 1, section: "listening", itemIdx: idx, item: it,
            ans: Number(it.ans), optCount: 4, exp: it.exp || ""
          });
        });
        p2.forEach(function (it, idx) {
          pushQ({
            num: Number(it.num) || (p1.length + idx + 1),
            part: 2, section: "listening", itemIdx: idx, item: it,
            ans: Number(it.ans), optCount: 3, exp: it.exp || ""
          });
        });
        p3.forEach(function (grp, gIdx) {
          (grp.questions || []).forEach(function (q, qIdx) {
            pushQ({
              num: Number(q.num),
              part: 3, section: "listening", groupIdx: gIdx, qIdx: qIdx, group: grp, q: q,
              ans: Number(q.ans), optCount: 4, exp: q.exp || ""
            });
          });
        });
        p4.forEach(function (grp, gIdx) {
          (grp.questions || []).forEach(function (q, qIdx) {
            pushQ({
              num: Number(q.num),
              part: 4, section: "listening", groupIdx: gIdx, qIdx: qIdx, group: grp, q: q,
              ans: Number(q.ans), optCount: 4, exp: q.exp || ""
            });
          });
        });
        p5.forEach(function (q, idx) {
          pushQ({
            num: Number(q.num),
            part: 5, section: "reading", itemIdx: idx, q: q,
            ans: Number(q.ans), optCount: 4, exp: q.exp || ""
          });
        });
        p6.forEach(function (grp, gIdx) {
          (grp.questions || []).forEach(function (q, qIdx) {
            pushQ({
              num: Number(q.num),
              part: 6, section: "reading", groupIdx: gIdx, qIdx: qIdx, group: grp, q: q,
              ans: Number(q.ans), optCount: 4, exp: q.exp || ""
            });
          });
        });
        p7.forEach(function (grp, gIdx) {
          (grp.questions || []).forEach(function (q, qIdx) {
            pushQ({
              num: Number(q.num),
              part: 7, section: "reading", groupIdx: gIdx, qIdx: qIdx, group: grp, q: q,
              ans: Number(q.ans), optCount: 4, exp: q.exp || ""
            });
          });
        });

        allQuestions.sort(function (a, b) { return a.num - b.num; });
        return {
          p1: p1, p2: p2, p3: p3, p4: p4, p5: p5, p6: p6, p7: p7,
          allQuestions: allQuestions,
          byNum: byNum,
          byPart: byPart,
          listeningCount: byPart[1].length + byPart[2].length + byPart[3].length + byPart[4].length,
          readingCount: byPart[5].length + byPart[6].length + byPart[7].length
        };
      }

      /* ---------------- ETS MULTI-ACCENT SPEECH ENGINE ---------------- */
      var audioState = {
        token: 0,
        playing: false,
        timer: null,
        watchdog: null,
        statusText: "Sẵn sàng phát âm đa giọng ETS (US • UK • AU)",
        progressPct: 0
      };

      var FEMALE_VOICE_RE = /female|woman|zira|hazel|susan|jenny|aria|sonia|libby|natasha|samantha|victoria|karen|catherine|moira|tessa|serena|kate|helen|fiona|eva|michelle|emma|ava|clara|amy|salli|joanna|kendra|kimberly|martha/i;
      var MALE_VOICE_RE = /male|man|david|mark|george|ryan|guy|william|daniel|alex|fred|arthur|oliver|james|richard|christopher|eric|andrew|brian|steffan|matthew|joey|justin|russell|lee|thomas|stephen/i;

      function ensureVoicesReady(maxWaitMs) {
        return new Promise(function (resolve) {
          if (!("speechSynthesis" in window) || typeof window.speechSynthesis.getVoices !== "function") {
            return resolve([]);
          }
          var initial = window.speechSynthesis.getVoices() || [];
          if (initial.length) return resolve(initial);
          var finished = false;
          function done() {
            if (finished) return;
            finished = true;
            clearTimeout(t);
            try {
              if (window.speechSynthesis.removeEventListener) window.speechSynthesis.removeEventListener("voiceschanged", onCh);
            } catch (e) {}
            resolve(window.speechSynthesis.getVoices() || []);
          }
          function onCh() {
            if ((window.speechSynthesis.getVoices() || []).length) done();
          }
          var t = setTimeout(done, maxWaitMs || 260);
          try {
            if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener("voiceschanged", onCh);
          } catch (e) {}
        });
      }

      function pickRoleVoice(voices, accent, speaker) {
        var target = normalizeAccent(accent).toLowerCase();
        var enVoices = (voices || []).filter(function (v) { return /^en([-_]|$)/i.test(v.lang || ""); });
        if (!enVoices.length) return null;
        var spk = String(speaker || "N").toUpperCase();
        var wantFemale = spk.charAt(0) === "W";
        var wantMale = spk.charAt(0) === "M";
        var isSecond = spk.indexOf("2") !== -1;

        function score(v) {
          var sc = 0;
          var vl = String(v.lang || "").toLowerCase().replace("_", "-");
          var vn = String(v.name || "");
          if (vl === target) sc += 120;
          else if (vl.indexOf(target.slice(0, 5)) === 0) sc += 95;
          else if (vl.indexOf("en-us") === 0 || vl.indexOf("en-gb") === 0 || vl.indexOf("en-au") === 0) sc += 25;
          if (wantFemale) { if (FEMALE_VOICE_RE.test(vn)) sc += 60; else if (MALE_VOICE_RE.test(vn)) sc -= 35; }
          else if (wantMale) { if (MALE_VOICE_RE.test(vn)) sc += 60; else if (FEMALE_VOICE_RE.test(vn)) sc -= 35; }
          if (/natural|neural|google|online|microsoft/i.test(vn)) sc += 24;
          if (/espeak|compact|eloquence/i.test(vn)) sc -= 30;
          return sc;
        }
        enVoices.sort(function (a, b) { return score(b) - score(a); });
        if (isSecond && enVoices.length > 1) {
          var alt = enVoices.find(function (v, idx) {
            if (idx === 0) return false;
            return wantMale ? !FEMALE_VOICE_RE.test(v.name || "") : (wantFemale ? !MALE_VOICE_RE.test(v.name || "") : true);
          });
          if (alt) return alt;
        }
        return enVoices[0] || null;
      }

      function rolePitch(speaker) {
        var spk = String(speaker || "N").toUpperCase();
        if (spk === "M2" || spk === "M3") return 0.84;
        if (spk === "M" || spk === "M1") return 0.93;
        if (spk === "W2") return 1.15;
        if (spk === "W" || spk === "W1") return 1.07;
        return 1.0;
      }

      function clearAudioHighlights() {
        var prev = document.querySelectorAll(".is-speaking");
        for (var i = 0; i < prev.length; i++) prev[i].classList.remove("is-speaking");
      }

      function updateAudioUI() {
        var studio = document.getElementById("audioStudio");
        if (studio) studio.classList.toggle("is-playing", audioState.playing);
        var stEl = document.getElementById("audioStatusText");
        if (stEl) stEl.textContent = audioState.statusText;
        var fill = document.getElementById("audioProgressFill");
        if (fill) fill.style.width = Math.max(0, Math.min(100, audioState.progressPct)) + "%";
        var stopBtn = document.getElementById("btnAudioStop");
        if (stopBtn) stopBtn.disabled = !audioState.playing;
      }

      function stopAudio(resetLabel) {
        audioState.token++;
        audioState.playing = false;
        if (audioState.timer) { clearTimeout(audioState.timer); audioState.timer = null; }
        if (audioState.watchdog) { clearTimeout(audioState.watchdog); audioState.watchdog = null; }
        if ("speechSynthesis" in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        if (window.S4UI && typeof window.S4UI.stopEnglish === "function") {
          window.S4UI.stopEnglish();
        }
        clearAudioHighlights();
        if (resetLabel !== false) {
          audioState.statusText = "Đã dừng phát âm thanh";
          audioState.progressPct = 0;
        }
        updateAudioUI();
      }

      function speakStepOnce(step, myToken, voices) {
        return new Promise(function (resolve) {
          if (myToken !== audioState.token) return resolve(false);
          var text = String(step.text || "").trim();
          if (!text) return resolve(true);

          var effRate = (activeScreen === "exam" && examMode === "ets") ? 1.0 : activeRate;
          var lang = (activeScreen === "exam" && examMode === "ets")
            ? normalizeAccent(step.accent || "en-US")
            : (accentOverride === "auto" ? normalizeAccent(step.accent || "en-US") : accentOverride);
          var rate = Math.max(0.65, Math.min(1.4, Number(step.rate || effRate) || 1.0));
          var hasSpeech = ("speechSynthesis" in window) && typeof window.SpeechSynthesisUtterance === "function";

          if (!hasSpeech) {
            if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
              window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () {
                resolve(myToken === audioState.token);
              }, function () { resolve(false); });
              return;
            }
            return resolve(false);
          }

          var done = false;
          function finish(ok) {
            if (done) return;
            done = true;
            if (audioState.watchdog) { clearTimeout(audioState.watchdog); audioState.watchdog = null; }
            resolve(ok && myToken === audioState.token);
          }

          try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(text);
            var voice = pickRoleVoice(voices, lang, step.speaker);
            if (voice) { u.voice = voice; u.lang = voice.lang || lang; }
            else u.lang = lang;
            u.rate = rate;
            u.pitch = rolePitch(step.speaker);
            u.onend = function () { finish(true); };
            u.onerror = function () {
              if (myToken !== audioState.token) return finish(false);
              if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
                window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () { finish(true); }, function () { finish(false); });
              } else finish(false);
            };
            var estMs = Math.max(4500, Math.min(28000, Math.round((text.length * 95) / rate) + 3500));
            audioState.watchdog = setTimeout(function () { finish(true); }, estMs);
            window.speechSynthesis.speak(u);
          } catch (e) {
            if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
              window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () { finish(true); }, function () { finish(false); });
            } else finish(false);
          }
        });
      }

      async function playQueue(steps, endStatusText) {
        if (!Array.isArray(steps) || !steps.length) return;
        stopAudio(false);
        var myToken = audioState.token;
        audioState.playing = true;
        audioState.progressPct = 0;
        audioState.statusText = steps[0].label || "Đang khởi tạo giọng đọc ETS...";
        updateAudioUI();

        var voices = await ensureVoicesReady(240);
        if (myToken !== audioState.token) return;

        for (var i = 0; i < steps.length; i++) {
          if (myToken !== audioState.token) return;
          var st = steps[i];
          audioState.statusText = st.label || ("Đang phát " + (i + 1) + "/" + steps.length);
          audioState.progressPct = Math.round(((i + 0.35) / steps.length) * 100);
          clearAudioHighlights();
          if (st.highlightId) {
            var hlEl = document.getElementById(st.highlightId);
            if (hlEl) hlEl.classList.add("is-speaking");
          }
          updateAudioUI();

          await speakStepOnce(st, myToken, voices);
          if (myToken !== audioState.token) return;

          audioState.progressPct = Math.round(((i + 1) / steps.length) * 100);
          updateAudioUI();

          var pauseMs = Number(st.pauseAfterMs) || 0;
          if (pauseMs > 0 && i < steps.length - 1) {
            await new Promise(function (res) {
              audioState.timer = setTimeout(function () { audioState.timer = null; res(); }, pauseMs);
            });
          }
        }

        if (myToken === audioState.token) {
          audioState.playing = false;
          clearAudioHighlights();
          audioState.statusText = endStatusText || "Đã phát xong";
          audioState.progressPct = 100;
          updateAudioUI();
        }
      }

      function buildStepsForPart1Item(it, idx) {
        var acc = normalizeAccent(it.accent || "en-US");
        var accTag = accentShort(acc);
        var steps = [{
          text: "Number " + it.num + ".",
          accent: acc, speaker: "N", pauseAfterMs: 360,
          highlightId: "qCard_" + it.num,
          label: "Part 1 • Câu " + it.num + " • Giọng " + accTag
        }];
        var opts = Array.isArray(it.options) ? it.options.slice(0, 4) : [];
        opts.forEach(function (opt, oIdx) {
          steps.push({
            text: LETTERS[oIdx] + ". " + cleanOptionText(opt),
            accent: acc, speaker: it.speaker || (idx % 2 === 0 ? "M" : "W"),
            pauseAfterMs: oIdx < opts.length - 1 ? 340 : 620,
            highlightId: "qCard_" + it.num,
            label: "Part 1 • Câu " + it.num + " • Đáp án (" + LETTERS[oIdx] + ") • " + accTag
          });
        });
        return steps;
      }

      function buildStepsForPart2Item(it, idx) {
        var acc = normalizeAccent(it.accent || "en-US");
        var accTag = accentShort(acc);
        var qSpk = it.speaker || (idx % 2 === 0 ? "W" : "M");
        var aSpk = qSpk.charAt(0) === "W" ? "M" : "W";
        var steps = [
          {
            text: "Number " + it.num + ".",
            accent: acc, speaker: "N", pauseAfterMs: 300,
            highlightId: "qCard_" + it.num,
            label: "Part 2 • Câu " + it.num + " • Chuẩn bị nghe"
          },
          {
            text: it.question || "",
            accent: acc, speaker: qSpk, pauseAfterMs: 440,
            highlightId: "qCard_" + it.num,
            label: "Part 2 • Câu " + it.num + " • Câu hỏi • " + accTag
          }
        ];
        // STRICT PART 2: ONLY 3 OPTIONS A/B/C
        var opts = Array.isArray(it.options) ? it.options.slice(0, 3) : [];
        opts.forEach(function (opt, oIdx) {
          steps.push({
            text: LETTERS[oIdx] + ". " + cleanOptionText(opt),
            accent: acc, speaker: aSpk,
            pauseAfterMs: oIdx < opts.length - 1 ? 340 : 620,

            label: "Part 2 • Câu " + it.num + " • Đáp án (" + LETTERS[oIdx] + ") • " + accTag
          });
        });
        return steps;
      }

      function buildStepsForListeningGroup(part, grp, gIdx) {
        var steps = [];
        var turns = Array.isArray(grp.turns) ? grp.turns : [];
        var qs = Array.isArray(grp.questions) ? grp.questions : [];
        var rangeLbl = qs.length ? ("Câu " + qs[0].num + "–" + qs[qs.length - 1].num) : ("Đoạn " + (gIdx + 1));
        turns.forEach(function (t, tIdx) {
          var acc = normalizeAccent(t.accent || grp.accent || "en-US");
          var spkName = t.name || (t.spk === "W" ? "Woman" : (t.spk === "M2" ? "Man 2" : "Man"));
          steps.push({
            text: t.en || "",
            accent: acc, speaker: t.spk || "M",
            pauseAfterMs: tIdx < turns.length - 1 ? 300 : 700,
            highlightId: "lgrp_" + part + "_" + gIdx,
            label: "Part " + part + " • " + rangeLbl + " • " + spkName + " (" + accentShort(acc) + ")"
          });
        });
        return steps;
      }

          +   '<button type="button" class="mode-opt' + (selectedMode === "ets" ? " active" : "") + '" data-select-mode="ets" aria-pressed="' + (selectedMode === "ets" ? "true" : "false") + '">'
          +     '<div class="mode-opt-head">'
          +       '<span class="mode-opt-title">' + svgIcon("lock", 15) + '<span>Thi thật chuẩn ETS</span></span>'
          +       '<span class="meta-pill is-accent">Khuyên dùng</span>'
          +     '</div>'
          +     '<div class="mode-opt-desc">Khóa giờ 2 phần (45p LC &rarr; 75p RC / Mini 12p &rarr; 18p), Listening 1.0x không tua lại, ẩn chữ Part 1–2 và khóa quay lại Listening khi sang Reading.</div>'
          +   '</button>'
          +   '<button type="button" class="mode-opt' + (selectedMode === "practice" ? " active" : "") + '" data-select-mode="practice" aria-pressed="' + (selectedMode === "practice" ? "true" : "false") + '">'
          +     '<div class="mode-opt-head">'
          +       '<span class="mode-opt-title">' + svgIcon("sliders", 15) + '<span>Luyện thi linh hoạt</span></span>'
          +       '<span class="meta-pill is-teal">Tự do</span>'
          +     '</div>'
          +     '<div class="mode-opt-desc">Tùy chỉnh tốc độ nghe 0.75x–1.25x, chọn giọng US/UK/AU, nghe lại câu thoải mái và chuyển tự do giữa 2 phần Nghe – Đọc.</div>'
          +   '</button>'
          + '</div>'
          + '</section>'

          + '<div class="filter-strip">'
          +   '<div class="filter-row" role="tablist" aria-label="Lọc theo loại đề">'
          +     '<button type="button" class="flt-pill' + (filterTier === "all" ? " active" : "") + '" data-flt-tier="all">Tất cả (' + ALL_TESTS.length + ')</button>'
          +     '<button type="button" class="flt-pill' + (filterTier === "mini" ? " active" : "") + '" data-flt-tier="mini">Mini Test 50 câu (' + miniCount + ')</button>'
          +     '<button type="button" class="flt-pill' + (filterTier === "full" ? " active" : "") + '" data-flt-tier="full">Full Test 200 câu (' + fullCount + ')</button>'
          +   '</div>'
          +   '<div class="filter-row" role="tablist" aria-label="Lọc theo mục tiêu điểm">'
          +     '<button type="button" class="flt-pill is-band' + (filterLevel === "all" ? " active" : "") + '" data-flt-level="all">Mọi mục tiêu</button>'
          +     '<button type="button" class="flt-pill is-band' + (filterLevel === "1" ? " active" : "") + '" data-flt-level="1">350+ (Lấy gốc)</button>'
          +     '<button type="button" class="flt-pill is-band' + (filterLevel === "2" ? " active" : "") + '" data-flt-level="2">550+ (Đầu ra)</button>'
          +     '<button type="button" class="flt-pill is-band' + (filterLevel === "3" ? " active" : "") + '" data-flt-level="3">750+ (Doanh nghiệp)</button>'
          +     '<button type="button" class="flt-pill is-band' + (filterLevel === "4" ? " active" : "") + '" data-flt-level="4">850+ (Bứt phá)</button>'
          +   '</div>'
