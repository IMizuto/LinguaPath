          if (mobBtn) { setMobileView(mobBtn.getAttribute("data-mob-view")); return; }
          var pTab = e.target.closest("[data-passage-tab]");
          if (pTab) { setPassageTab(pTab.getAttribute("data-passage-tab")); return; }
          if (e.target.closest("#btnClearAllHl")) { clearAllHighlights(); return; }

          // Listening Audio controls
          if (e.target.closest("#btnAudioStop")) { stopAudio(true); return; }
          var rateBtn = e.target.closest("[data-set-rate]");
          if (rateBtn && examMode === "practice") {
            activeRate = Number(rateBtn.getAttribute("data-set-rate") || 1.0);
            if (audioState.playing) stopAudio(false);
            audioState.statusText = "Tốc độ phát: " + activeRate + "x";
            examShellEl.querySelectorAll("[data-set-rate]").forEach(function (b) {
              b.classList.toggle("active", Math.abs(Number(b.getAttribute("data-set-rate")) - activeRate) < 0.01);
            });
            updateAudioUI();
            return;
          }
          var accBtn = e.target.closest("[data-set-accent]");
          if (accBtn && examMode === "practice") {
            accentOverride = accBtn.getAttribute("data-set-accent") || "auto";
            if (audioState.playing) stopAudio(false);
            audioState.statusText = "Giọng đọc: " + (accentOverride === "auto" ? "Chuẩn ETS (US/UK/AU)" : accentShort(accentOverride));
            examShellEl.querySelectorAll("[data-set-accent]").forEach(function (b) {
              b.classList.toggle("active", b.getAttribute("data-set-accent") === accentOverride);
            });
            updateAudioUI();
            return;
          }
          if (e.target.closest("#btnPlayPartAudio")) {
            var pKey = "part_all_" + examPart;
            if (examMode === "ets" && playedAudio[pKey]) return;
            var allSteps = [];
            if (examPart === 1) {
              examIndex.p1.forEach(function (it, i) { allSteps = allSteps.concat(buildStepsForPart1Item(it, i)); });
            } else if (examPart === 2) {
              examIndex.p2.forEach(function (it, i) { allSteps = allSteps.concat(buildStepsForPart2Item(it, i)); });
            } else if (examPart === 3 || examPart === 4) {
              var lGrps = examPart === 3 ? examIndex.p3 : examIndex.p4;
              lGrps.forEach(function (g, i) { allSteps = allSteps.concat(buildStepsForListeningGroup(examPart, g, i)); });
            }
            markAudioPlayed(pKey);
            playQueue(allSteps, "Đã phát xong Part " + examPart);
            return;
          }
          var p1Play = e.target.closest("[data-play-p1]");
          if (p1Play) {
            var idx1 = Number(p1Play.getAttribute("data-play-p1"));
            var it1 = examIndex.p1[idx1];
            if (it1) {
              var k1 = "p1_" + it1.num;
              if (examMode === "ets" && playedAudio[k1]) return;
              markAudioPlayed(k1);
              playQueue(buildStepsForPart1Item(it1, idx1), "Đã phát xong Câu " + it1.num);
            }
            return;
          }
          var p2Play = e.target.closest("[data-play-p2]");
          if (p2Play) {
            var idx2 = Number(p2Play.getAttribute("data-play-p2"));
            var it2 = examIndex.p2[idx2];
            if (it2) {
              var k2 = "p2_" + it2.num;
              if (examMode === "ets" && playedAudio[k2]) return;
              markAudioPlayed(k2);
              playQueue(buildStepsForPart2Item(it2, idx2), "Đã phát xong Câu " + it2.num);
            }
            return;
          }
          var lGrpPlay = e.target.closest("[data-play-lgrp]");
          if (lGrpPlay) {
            var segs = String(lGrpPlay.getAttribute("data-play-lgrp") || "").split(":");
            var lp = Number(segs[0]), lg = Number(segs[1]);
            var grp = (lp === 3 ? examIndex.p3 : examIndex.p4)[lg];
            if (grp) {
              var kg = "p" + lp + "_g" + lg;
              if (examMode === "ets" && playedAudio[kg]) return;
              markAudioPlayed(kg);
              playQueue(buildStepsForListeningGroup(lp, grp, lg), "Đã phát xong đoạn Part " + lp);
            }
            return;
          }

          // Flag Question (in-place update, preserves highlights!)
          var flagBtn = e.target.closest("[data-flag-num]");
          if (flagBtn) {
            var fn = Number(flagBtn.getAttribute("data-flag-num"));
            flagged[fn] = !flagged[fn];
            flagBtn.classList.toggle("is-flagged", Boolean(flagged[fn]));
            flagBtn.setAttribute("aria-pressed", flagged[fn] ? "true" : "false");
            var fSpan = flagBtn.querySelector("span");
            if (fSpan) fSpan.textContent = flagged[fn] ? "Đã cắm cờ" : "Flag";
            var fCard = document.getElementById("qCard_" + fn);
            if (fCard) fCard.classList.toggle("is-flagged", Boolean(flagged[fn]));
            syncPaletteInPlace();
            saveDraft(false);
            return;
          }

          // Pick Answer (in-place DOM update so highlights stay intact!)
          var pickBtn = e.target.closest("[data-pick-num]");
          if (pickBtn) {
            var qNum = Number(pickBtn.getAttribute("data-pick-num"));
            var oIdx = Number(pickBtn.getAttribute("data-pick-opt"));
            answers[qNum] = oIdx;
            currentNum = qNum;
            var card = document.getElementById("qCard_" + qNum);
            if (card) {
              var allBtns = card.querySelectorAll("[data-pick-opt]");
              for (var k = 0; k < allBtns.length; k++) {
                var isSel = Number(allBtns[k].getAttribute("data-pick-opt")) === oIdx;
                allBtns[k].classList.toggle("selected", isSel);
                if (allBtns[k].hasAttribute("aria-pressed")) allBtns[k].setAttribute("aria-pressed", isSel ? "true" : "false");
              }
              var blankSlot = card.querySelector('[data-blank-slot="' + qNum + '"]');
              var rec = examIndex.byNum[qNum];
              if (blankSlot && rec && rec.q && rec.q.opts && rec.q.opts[oIdx]) {
                blankSlot.textContent = cleanOptionText(rec.q.opts[oIdx]);
              }
            }
            syncPaletteInPlace();
            syncP6ChipsInDom();
            saveDraft(false);
          }
        });
      }

      // Report & Review clicks
      if (reportRootEl) {
        reportRootEl.addEventListener("keydown", function (e) {
          var tw = e.target.closest(".tap-word[data-word]");
          if (tw && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            openDictPopup(tw.getAttribute("data-word") || tw.textContent, tw);
          }
        });

        reportRootEl.addEventListener("click", function (e) {
          if (!lastReport) return;

          // Tap-to-lookup word in Review Mode
          var tapW = e.target.closest(".tap-word[data-word]");
          if (tapW) {
            e.stopPropagation();
            openDictPopup(tapW.getAttribute("data-word") || tapW.textContent, tapW);
            return;
          }

          if (e.target.closest("#btnReportToLobby")) {
            stopAudio(false);
            switchScreen("lobby");
            renderLobby();
            return;
          }
          if (e.target.closest("#btnRetakeTest")) {
            stopAudio(false);
            startExam(lastReport.record.testId, { mode: selectedMode, resumeDraft: false });
            return;
          }

          var revFlt = e.target.closest("[data-rev-filter]");
          if (revFlt) {
            reviewFilter = revFlt.getAttribute("data-rev-filter") || "all";
            renderReportScreen();
            return;
          }
          var revPart = e.target.closest("[data-rev-part]");
          if (revPart) {
            reviewPartFilter = Number(revPart.getAttribute("data-rev-part") || 0);
            renderReportScreen();
            return;
          }

          // Review Audio Replay
          var sayBtn = e.target.closest("[data-rev-say]");
          if (sayBtn) {
            var txt = sayBtn.getAttribute("data-rev-say") || "";
            var acc = sayBtn.getAttribute("data-rev-acc") || "en-US";
            playQueue([{ text: txt, accent: acc, speaker: "W", pauseAfterMs: 0, label: "Nghe lại câu" }], "Đã phát xong");
            return;
          }
          var rp1 = e.target.closest("[data-rev-play-p1]");
          if (rp1) {
            var i1 = Number(rp1.getAttribute("data-rev-play-p1"));
            var it1 = lastReport.index.p1[i1];
            if (it1) playQueue(buildStepsForPart1Item(it1, i1), "Đã phát xong");
            return;
          }
          var rp2 = e.target.closest("[data-rev-play-p2]");
          if (rp2) {
            var i2 = Number(rp2.getAttribute("data-rev-play-p2"));
            var it2 = lastReport.index.p2[i2];
            if (it2) playQueue(buildStepsForPart2Item(it2, i2), "Đã phát xong");
            return;
          }
          var rlg = e.target.closest("[data-rev-play-lgrp]");
          if (rlg) {
            var sp = String(rlg.getAttribute("data-rev-play-lgrp") || "").split(":");
            var pNum = Number(sp[0]), gI = Number(sp[1]);
            var grp = (pNum === 3 ? lastReport.index.p3 : lastReport.index.p4)[gI];
            if (grp) playQueue(buildStepsForListeningGroup(pNum, grp, gI), "Đã phát xong");
          }
        });
      }

      // Highlight popover events
      document.addEventListener("selectionchange", function () {
        clearTimeout(hlSelTimer);
        hlSelTimer = setTimeout(checkLeftSelection, 90);
      });
      document.addEventListener("mouseup", function (e) {
        if (e.target && e.target.closest && e.target.closest("#cbtHlPopover")) return;
        setTimeout(checkLeftSelection, 30);
      });
      document.addEventListener("touchend", function (e) {
        if (e.target && e.target.closest && e.target.closest("#cbtHlPopover")) return;
        setTimeout(checkLeftSelection, 60);
      });
      if (hlPopoverEl) {
        hlPopoverEl.addEventListener("mousedown", function (e) { e.preventDefault(); });
      }
      var btnApplyHl = document.getElementById("btnApplyHl");
      if (btnApplyHl) {
        btnApplyHl.addEventListener("click", function () {
          var sel = window.getSelection();
          var r = (sel && !sel.isCollapsed && sel.rangeCount && isRangeInLeftPane(sel.getRangeAt(0)))
            ? sel.getRangeAt(0).cloneRange() : lastHlRange;
          if (r) applyHighlightToRange(r);
          hideHlPopover();
        });
      }
      var btnRemoveHl = document.getElementById("btnRemoveHl");
      if (btnRemoveHl) {
        btnRemoveHl.addEventListener("click", function () {
          var sel = window.getSelection();
          var r = (sel && !sel.isCollapsed && sel.rangeCount && isRangeInLeftPane(sel.getRangeAt(0)))
            ? sel.getRangeAt(0).cloneRange() : lastHlRange;
          removeHighlightFromRange(r);
          hideHlPopover();
        });
      }

      // History Modal events
      var histModal = document.getElementById("historyModal");
      if (histModal) {
        histModal.addEventListener("click", function (e) {
          if (e.target === histModal || e.target.closest("#btnCloseHistory")) {
            closeHistoryModal();
            return;
          }
          if (e.target.closest("#btnClearHistory")) {
            var doClear = function () {
              try { localStorage.removeItem(SUBMISSIONS_KEY); } catch (err) {}
              if (window.S4Auth && typeof window.S4Auth.scheduleCloudSync === "function") {
                try { window.S4Auth.scheduleCloudSync(); } catch (err) {}
              }
              closeHistoryModal();
              if (activeScreen === "lobby") renderLobby();
              showToast("info", "Đã xóa toàn bộ lịch sử thi thử TOEIC.");
            };
            if (window.S4UI && typeof window.S4UI.confirm === "function") {
              window.S4UI.confirm("Xóa toàn bộ lịch sử điểm thi thử TOEIC trên thiết bị này?", {
                title: "Xóa lịch sử thi",
                tone: "danger",
                confirmText: "Xóa lịch sử"
              }).then(function (ok) { if (ok) doClear(); });
            } else if (confirm("Xóa toàn bộ lịch sử điểm thi thử TOEIC?")) {
              doClear();
            }
          }
        });
      }

      // Dict Popup events
      var dictModal = document.getElementById("toeicDictPopup");
      if (dictModal) {
        dictModal.addEventListener("click", function (e) {
          if (e.target === dictModal || e.target.closest("#btnCloseDictPopup")) {
            closeDictPopup();
            return;
          }
          var spkBtn = e.target.closest("[data-dict-spk]");
          if (spkBtn) speakDictWord(currentDictWord, spkBtn.getAttribute("data-dict-spk"));
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (dictModal && dictModal.classList.contains("open")) closeDictPopup();
          else if (histModal && histModal.classList.contains("open")) closeHistoryModal();
          else hideHlPopover();
        }
      });

      window.addEventListener("pagehide", function () {
        if (activeScreen === "exam" && activeTest) saveDraft(false);
        stopAudio(false);
      });
      window.addEventListener("beforeunload", function () {
        if (activeScreen === "exam" && activeTest) saveDraft(false);
        stopAudio(false);
      });

      /* ---------------- BOOT & URL QUERY PARAMS ---------------- */
      (function init() {
        var sp = null;
        try { sp = new URLSearchParams(window.location.search); } catch (e) {}

        var reqTier = sp ? String(sp.get("tier") || "").trim().toLowerCase() : "";
        if (reqTier === "mini" || reqTier === "full") filterTier = reqTier;

        var reqLv = sp ? String(sp.get("level") || "").trim() : "";
        if (reqLv === "1" || reqLv === "2" || reqLv === "3" || reqLv === "4") filterLevel = reqLv;

        var reqMode = sp ? String(sp.get("mode") || "").trim().toLowerCase() : "";
        if (reqMode === "practice" || reqMode === "ets") selectedMode = reqMode;

        renderLobby();

        var reqId = sp ? String(sp.get("id") || "").trim() : "";
        if (reqId && ALL_TESTS.some(function (t) { return t.id === reqId; })) {
          var hasD = Boolean(readDraft(reqId));
          startExam(reqId, { mode: selectedMode, resumeDraft: hasD });
        }
      })();
    })();
  </script>
</body>
</html>
