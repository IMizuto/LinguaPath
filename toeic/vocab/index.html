  <script>
  (function () {
    "use strict";

    /* ---------- 1. Hằng số & Chuẩn hóa Manifest ---------- */
    const KEYS = {
      srs: "lp_toeic_vocab_srs_v1",
      days: "lp_toeic_vocab_days_v1",
      settings: "lp_toeic_vocab_settings_v1",
      session: "lp_toeic_vocab_session_v1"
    };
    const DEFAULT_SETTINGS = {
      dailyNewLimit: 20,
      reviewCap: 100,
      autoAudio: true,
      defaultAccent: "us", // us | uk | au | mix
      queueOrder: "mix",
      bonusTodayDate: "",
      bonusTodayCount: 0,
      lastTopic: ""
    };

    const DEFAULT_LEVEL_DEFS = [
      { level: 1, short: "0–350", title: "Chặng 1: 0–350 • Lấy gốc & Part 1", file: "data/vocab_u_1.js", count: 0 },
      { level: 2, short: "350–550", title: "Chặng 2: 350–550 • Barron's 600 & Văn phòng", file: "data/vocab_u_2.js", count: 0 },
      { level: 3, short: "550–750", title: "Chặng 3: 550–750 • Hackers, ETS & Susan Chyn", file: "data/vocab_u_3.js", count: 0 },
      { level: 4, short: "750–990", title: "Chặng 4: 750–990 • 850–990 & Paraphrase Part 7", file: "data/vocab_u_4.js", count: 0 }
    ];

    const DEFAULT_BOOK_DEFS = [
      { id: "part1", label: "Part 1", levels: [1] },
      { id: "barrons600", label: "Barron's 600", levels: [1, 2] },
      { id: "hackers", label: "Hackers", levels: [2, 3, 4] },
      { id: "ets", label: "ETS Official", levels: [1, 2, 3, 4] },
      { id: "susanchyn", label: "Susan Chyn", levels: [3] },
      { id: "adv990", label: "850–990", levels: [4] }
    ];

    function normalizeManifest(raw) {
      const m = raw && typeof raw === "object" ? raw : {};
      const levels = DEFAULT_LEVEL_DEFS.map(d => Object.assign({}, d, { topics: [] }));
      const rawLevels = m.levels;
      if (Array.isArray(rawLevels)) {
        rawLevels.forEach(item => {
          const lv = Number(item && (item.level || item.id));
          if (lv >= 1 && lv <= 4) {
            const target = levels[lv - 1];
            if (item.short || item.range) target.short = item.short || item.range;
            if (item.title || item.label || item.name) target.title = item.title || item.label || item.name;
            if (item.file || item.src || item.path) {
              const f = String(item.file || item.src || item.path);
              target.file = f.startsWith("data/") ? f : ("data/" + f.replace(/^\/+/, ""));
            }
            if (Number.isFinite(Number(item.count))) target.count = Number(item.count);
            if (Array.isArray(item.topics)) {
              item.topics.forEach(tp => {
                const name = typeof tp === "string" ? tp : (tp.name || tp.topic || tp.title || "");
                if (!name) return;
                target.topics.push({
                  level: lv,
                  name: name,
                  key: lv + "::" + name,
                  count: typeof tp === "object" ? Number(tp.count || 0) : 0,
                  books: typeof tp === "object" && Array.isArray(tp.books) ? tp.books.slice() : []
                });
              });
            }
          }
        });
      } else if (rawLevels && typeof rawLevels === "object") {
        [1, 2, 3, 4].forEach(lv => {
          const item = rawLevels[lv] || rawLevels[String(lv)];
          if (!item) return;
          const target = levels[lv - 1];
          if (typeof item === "number") {
            target.count = item;
          } else if (typeof item === "object") {
            if (item.short || item.range) target.short = item.short || item.range;
            if (item.title || item.label || item.name) target.title = item.title || item.label || item.name;
            if (item.file || item.src || item.path) {
              const f = String(item.file || item.src || item.path);
              target.file = f.startsWith("data/") ? f : ("data/" + f.replace(/^\/+/, ""));
            }
            if (Number.isFinite(Number(item.count))) target.count = Number(item.count);
            if (Array.isArray(item.topics)) {
              item.topics.forEach(tp => {
                const name = typeof tp === "string" ? tp : (tp.name || tp.topic || tp.title || "");
                if (!name) return;
                target.topics.push({
                  level: lv,
                  name: name,
                  key: lv + "::" + name,
                  count: typeof tp === "object" ? Number(tp.count || 0) : 0,
                  books: typeof tp === "object" && Array.isArray(tp.books) ? tp.books.slice() : []
                });
              });
            }
          }
        });
      }

      if (Array.isArray(m.topics)) {
        m.topics.forEach(tp => {
          if (!tp || typeof tp !== "object") return;
          const lv = Number(tp.level || 1);
          const name = tp.name || tp.topic || tp.title || "";
          if (!name || lv < 1 || lv > 4) return;
          const target = levels[lv - 1];
          if (!target.topics.some(x => x.name === name)) {
            target.topics.push({
              id: String(tp.id || ""),
              level: lv,
              name: name,
              key: lv + "::" + name,
              count: Number(tp.count || 0),
              books: Array.isArray(tp.books) ? tp.books.slice() : []
            });
          }
        });
      }

      levels.forEach(lvObj => {
        if (!lvObj.count && lvObj.topics.length) {
          lvObj.count = lvObj.topics.reduce((acc, t) => acc + (Number(t.count) || 0), 0);
        }
      });

      const bookMap = new Map();
      DEFAULT_BOOK_DEFS.forEach(b => bookMap.set(b.id, Object.assign({ count: 0 }, b)));
      const rawBooks = m.books;
      if (Array.isArray(rawBooks)) {
        rawBooks.forEach(b => {
          if (!b || !b.id) return;
          const id = String(b.id);
          const prev = bookMap.get(id) || { id, label: id, levels: [1, 2, 3, 4], count: 0 };
          bookMap.set(id, {
            id,
            label: b.label || b.short || b.name || prev.label,
            count: Number(b.count || prev.count || 0),
            levels: Array.isArray(b.levels) && b.levels.length ? b.levels.map(Number) : prev.levels
          });
        });
      } else if (rawBooks && typeof rawBooks === "object") {
        Object.keys(rawBooks).forEach(id => {
          const val = rawBooks[id];
          const prev = bookMap.get(id) || { id, label: id, levels: [1, 2, 3, 4], count: 0 };
          if (typeof val === "number") {
            bookMap.set(id, Object.assign({}, prev, { count: val }));
          } else if (val && typeof val === "object") {
            bookMap.set(id, {
              id,
              label: val.label || val.short || val.name || prev.label,
              count: Number(val.count || prev.count || 0),
              levels: Array.isArray(val.levels) && val.levels.length ? val.levels.map(Number) : prev.levels
            });
          }
        });
      }

      const books = Array.from(bookMap.values());
      const allTopics = [];
      levels.forEach(l => l.topics.forEach(t => allTopics.push(t)));
      books.forEach(b => {
        const inferred = new Set();
        allTopics.forEach(t => {
          if (Array.isArray(t.books) && t.books.includes(b.id)) inferred.add(t.level);
        });
        if (inferred.size) b.levels = Array.from(inferred).sort((a, c) => a - c);
      });
      const total = Number(m.totalWords || m.total || 0) || levels.reduce((acc, l) => acc + (Number(l.count) || 0), 0);
      return { total, levels, books, topics: allTopics, bookMap };
    }

    const MANIFEST = normalizeManifest(window.LP_TOEIC_VOCAB_MANIFEST);
    const BOOK_LABELS = {};
    MANIFEST.books.forEach(b => { BOOK_LABELS[b.id] = b.label; });

    /* ---------- 2. Kho từ nạp lười theo Chặng (RAM-Friendly) ---------- */
    window.__LP_TOEIC_VOCAB_CHUNKS = window.__LP_TOEIC_VOCAB_CHUNKS || {};
    const LOADED_LEVELS = new Set();
    const LEVEL_PROMISES = {};
    const LOADED_WORDS = [];
    const VOCAB_BY_ID = new Map();
    const WORDS_BY_LEVEL = { 1: [], 2: [], 3: [], 4: [] };
    let vocabSearchIndex = null;
    let isLoadingChunks = false;

    if (window.S4SearchEngine) {
      try { window.S4SearchEngine.initWasm("../../assets/s4-core.wasm?v=1"); } catch (e) {}
    }

    function normalizeWordItem(raw, fallbackLv) {
      if (!raw || !raw.id) return null;
      const lv = Number(raw.level || fallbackLv || 1);
      const defVi = String(raw.defVi || "").trim();
      const defEn = String(raw.defEn || "").trim();
      const defRaw = String(raw.defRaw || (defVi + (defEn ? ("\n" + defEn) : ""))).trim();
      return {
        id: String(raw.id),
        level: lv,
        topic: String(raw.topic || "Tổng hợp"),
        topicKey: lv + "::" + String(raw.topic || "Tổng hợp"),
        word: String(raw.word || "").trim(),
        pos: String(raw.pos || "").trim(),
        ipa: String(raw.ipa || "").trim(),
        defVi: defVi || defRaw,
        defEn: defEn,
        defRaw: defRaw,
        examples: Array.isArray(raw.examples) ? raw.examples.filter(Boolean) : [],
        books: Array.isArray(raw.books) ? raw.books.map(String).filter(Boolean) : [],
        wf: Array.isArray(raw.wf) ? raw.wf.map(String).filter(Boolean) : [],
        col: Array.isArray(raw.col) ? raw.col.map(String).filter(Boolean) : [],
        syn: Array.isArray(raw.syn) ? raw.syn.map(String).filter(Boolean) : [],
        trap: String(raw.trap || "").trim(),
        localImg: String(raw.localImg || "").trim(),
        localUkAudio: String(raw.localUkAudio || "").trim(),
        localUsAudio: String(raw.localUsAudio || "").trim()
      };
    }

    function rebuildSearchIndex() {
      if (!window.S4SearchEngine || typeof window.S4SearchEngine.createIndex !== "function") {
        vocabSearchIndex = null;
        return;
      }
      vocabSearchIndex = window.S4SearchEngine.createIndex(LOADED_WORDS, {
        lazy: true,
        fields: [
          { name: "word", get: v => v.word, weight: 2.5 },
          { name: "defVi", get: v => v.defVi, weight: 1.5 },
          { name: "defEn", get: v => v.defEn, weight: 1.1 },

          { name: "examples", get: v => v.examples, weight: 0.65 }
        ]
      });
    }

    function ingestLevelChunk(lv, arr) {
      if (LOADED_LEVELS.has(lv)) return;
      const list = Array.isArray(arr) ? arr : [];
      const bucket = [];
      const topicCounts = {};
      for (let i = 0; i < list.length; i++) {
        const norm = normalizeWordItem(list[i], lv);
        if (!norm || VOCAB_BY_ID.has(norm.id)) continue;
        VOCAB_BY_ID.set(norm.id, norm);
        LOADED_WORDS.push(norm);
        bucket.push(norm);
        topicCounts[norm.topic] = (topicCounts[norm.topic] || 0) + 1;
      }
      WORDS_BY_LEVEL[lv] = bucket;
      LOADED_LEVELS.add(lv);

      // Đồng bộ danh sách chủ đề của chặng nếu manifest thiếu chi tiết
      const lvObj = MANIFEST.levels[lv - 1];
      if (lvObj) {
        if (!lvObj.count) lvObj.count = bucket.length;
        if (!lvObj.topics.length) {
          Object.keys(topicCounts).forEach(tpName => {
            const tpObj = { level: lv, name: tpName, key: lv + "::" + tpName, count: topicCounts[tpName], books: [] };
            lvObj.topics.push(tpObj);
            MANIFEST.topics.push(tpObj);
          });
        }
      }
      rebuildSearchIndex();
    }

    function loadLevelChunk(lv) {
      const levelNum = Number(lv);
      if (levelNum < 1 || levelNum > 4) return Promise.resolve();
      if (LOADED_LEVELS.has(levelNum)) return Promise.resolve();
      if (Array.isArray(window.__LP_TOEIC_VOCAB_CHUNKS[levelNum])) {
        ingestLevelChunk(levelNum, window.__LP_TOEIC_VOCAB_CHUNKS[levelNum]);
        return Promise.resolve();
      }
      if (LEVEL_PROMISES[levelNum]) return LEVEL_PROMISES[levelNum];

      const lvMeta = MANIFEST.levels[levelNum - 1];
      const src = (lvMeta && lvMeta.file ? lvMeta.file : ("data/vocab_u_" + levelNum + ".js")) + "?v=1";
      LEVEL_PROMISES[levelNum] = new Promise((resolve) => {
        const sc = document.createElement("script");
        sc.src = src;
        sc.async = true;
        sc.onload = () => {
          const data = window.__LP_TOEIC_VOCAB_CHUNKS && window.__LP_TOEIC_VOCAB_CHUNKS[levelNum];
          ingestLevelChunk(levelNum, Array.isArray(data) ? data : []);
          resolve();
        };
        sc.onerror = () => {
          delete LEVEL_PROMISES[levelNum];
          resolve();
        };
        document.head.appendChild(sc);
      });
      return LEVEL_PROMISES[levelNum];
    }

    async function ensureLevelsLoaded(levelsArr, silent) {
      const needed = Array.from(new Set((levelsArr || []).map(Number).filter(n => n >= 1 && n <= 4 && !LOADED_LEVELS.has(n))));
      if (!needed.length) return;
      if (!silent) {
        isLoadingChunks = true;
        renderLoadingCard(needed);
      }
      await Promise.all(needed.map(loadLevelChunk));
      isLoadingChunks = false;
    }

    function levelsNeededForDue(levelFilter) {
      const now = Date.now();
      const set = new Set();
      Object.keys(srsData).forEach(id => {
        const st = srsData[id];
        if (!st || st.ignored) return;
        if (now < Number(st.due || 0)) return;
        const m = /^toeic([1-4])_/.exec(id);
        if (m) {
          const lv = Number(m[1]);
          if (levelFilter === "ALL" || Number(levelFilter) === lv) set.add(lv);
        }
      });
      if (!set.size) {
        if (levelFilter !== "ALL") set.add(Number(levelFilter));
        else set.add(1);
      }
      return Array.from(set);
    }

    function levelsForBook(bookId) {

      if (currentLevelFilter !== "ALL") {

        lvs = lvs.includes(f) ? [f] : [f];

      return lvs;
    }

    function readSessionMap() {
      const m = loadJSON(KEYS.session, {});

    }
    function writeSessionMap(map) {
      try {
        const drafts = map.__drafts && typeof map.__drafts === "object" && !Array.isArray(map.__drafts) ? map.__drafts : {};
        const dKeys = Object.keys(drafts);
        if (dKeys.length > 500) {
          dKeys.sort((a, b) => (drafts[b].updatedAt || 0) - (drafts[a].updatedAt || 0)).slice(500).forEach(k => { delete drafts[k]; });
        }
        if (Object.keys(drafts).length) map.__drafts = drafts; else delete map.__drafts;
        const tKeys = Object.keys(map).filter(k => k !== "__drafts");
        if (tKeys.length > 60) {
          tKeys.sort((a, b) => (map[b] && map[b].savedAt || 0) - (map[a] && map[a].savedAt || 0)).slice(60).forEach(k => { delete map[k]; });
        }
        if (Object.keys(map).length) localStorage.setItem(KEYS.session, JSON.stringify(map));
        else localStorage.removeItem(KEYS.session);
      } catch (e) {}
    }
    function syncVocabDrafts(map, queue, now) {
      if (extraPracticeMode || !Array.isArray(queue)) return;
      const drafts = map.__drafts && typeof map.__drafts === "object" && !Array.isArray(map.__drafts) ? map.__drafts : (map.__drafts = {});
      queue.forEach(w => {
        if (!w || !w.id) return;
        const stage = typeof w._stage === "number" ? w._stage : (w._new ? 0 : 1);
        const baseStage = w._new ? 0 : 1;
        if (stage > baseStage || (w._mistakes || 0) > 0 || w._relearn || w._resume) {
          drafts[w.id] = {
            new: !!w._new, stage, mistakes: w._mistakes || 0, resume: w._resume || null,
            relearn: !!w._relearn, lastTask: w._lastTask || null, updatedAt: now
          };
        }
      });
    }

    }
    function saveActiveSession(removeWordIds) {
      const map = readSessionMap();

      if (!extraPracticeMode) {
        if (Array.isArray(removeWordIds) && map.__drafts && typeof map.__drafts === "object") {
          removeWordIds.forEach(id => { if (id) delete map.__drafts[id]; });
        }

        if (!studyQueue || !studyQueue.length) {

              _mistakes: w._mistakes || 0, _resume: w._resume || null,
              _relearn: !!w._relearn, _lapsed: !!w._lapsed, _relearned: !!w._relearned,
              _rated: !!w._rated, _hardRepeated: !!w._hardRepeated,
              _task: w._task || null, _lastTask: w._lastTask || null
            }))

      }

    }
    function clearActiveSession(sKey, dropWordIds) {
      if (!sKey) { localStorage.removeItem(KEYS.session); return; }

    function tryRestoreActiveSession() {

      const now = Date.now();
      const savedAt = Number(raw.savedAt || 0);
      const drafts = map.__drafts && typeof map.__drafts === "object" ? map.__drafts : {};
      const list = [];
      for (const item of raw.queue) {
        if (!item || !item.id) continue;
        const full = VOCAB_BY_ID.get(item.id);
        if (!full) continue;
        const st = srsData[item.id];
        if (st && st.ignored) continue;
        if (st) {
          const reviewedAt = Number(st.lastReview || st.updatedAt || 0);
          const inFlightRepeat = (item._lapsed && !item._relearned) || (item._hardRepeated && raw.mode === "flashcard");
          if ((inFlightRepeat ? reviewedAt > savedAt : reviewedAt >= savedAt) && Number(st.due || 0) > now) continue;
        }
        if (item._new && st && Number(st.due || 0) > now && (raw.mode === "smart" || !(item._lapsed || item._hardRepeated || item._rated))) continue;
        if (item._new && st && !(item._lapsed || item._hardRepeated || item._rated)) continue;
        const restored = Object.assign({}, full, item);
        const d = drafts[item.id];
        if (d && Number(d.updatedAt || 0) > savedAt && !(st && Number(st.lastReview || st.updatedAt || 0) >= Number(d.updatedAt || 0) && Number(st.due || 0) > now)) {
          if (typeof d.stage === "number" && d.stage !== item._stage) restored._task = null;
          restored._stage = typeof d.stage === "number" ? d.stage : restored._stage;
          restored._mistakes = d.mistakes || 0;
          restored._resume = d.resume || null;
          restored._relearn = !!d.relearn;
          restored._lastTask = d.lastTask || restored._lastTask;
        }
        if (typeof restored._stage !== "number") restored._stage = restored._new ? 0 : 1;
        list.push(restored);
      }
      if (!list.length) { clearActiveSession(sKey); return false; }
      if (raw.mode && raw.mode !== "list" && ["smart", "flashcard", "quiz", "listen", "match", "cloze"].includes(raw.mode)) {
        currentMode = raw.mode;
        syncModeUi(currentMode);
      }
      studyQueue = list;
      sessionTopic = sKey;
      sessionTotal = Math.max(Number(raw.sessionTotal || 0), list.length + Number(raw.sessionDone || 0));
      sessionDone = Number(raw.sessionDone || 0);
      smartTick = Number(raw.smartTick || 0);
      lastSmartWordId = raw.lastSmartWordId || (studyQueue[0] && studyQueue[0].id) || "";
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length && !studyQueue[0]._task) pickNextSmartItem(true);
      return true;
    }

    function saveState() {
      try {
        localStorage.setItem(KEYS.srs, JSON.stringify(srsData));
        localStorage.setItem(KEYS.days, JSON.stringify(dayLog));
        localStorage.setItem(KEYS.settings, JSON.stringify(userSettings));
      } catch (e) {}
      saveActiveSession();
    }
    function logActivity(id) {
      const today = getTodayStr();
      const arr = dayLog[today] || (dayLog[today] = []);
      if (!arr.includes(id)) arr.push(id);
      saveState();
    }

    /* ---------- 7. Hạn mức & Thuật toán SM-2 cải tiến ---------- */
    function getNewWordsLearnedTodayCount() {
      const today = getTodayStr();
      return Object.values(srsData).filter(st => st && !st.ignored && st.firstLearnedDate === today).length;
    }
    function getDailyTarget() {
      const bonus = userSettings.bonusTodayDate === getTodayStr() ? (userSettings.bonusTodayCount || 0) : 0;
      return Number(userSettings.dailyNewLimit) + bonus;
    }
    function getRemainingDailyNewQuota() { return Math.max(0, getDailyTarget() - getNewWordsLearnedTodayCount()); }

    function dueAt(days) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + Math.max(1, Math.round(days)));
      return d.getTime();
    }
    function fuzz(i) { return i >= 7 ? Math.round(i * (0.92 + Math.random() * 0.16)) : i; }

    function rateWordSRS(id, quality, relearned) {
      const now = Date.now();
      let st = srsData[id];
      if (!st || st.ignored) st = { reps: 0, interval: 0, ease: 2.5, due: 0, lapses: 0, firstLearnedDate: getTodayStr() };
      if (!st.firstLearnedDate) st.firstLearnedDate = getTodayStr();
      st.ignored = false;

      if (quality === 0) {
        st.reps = 0;
        st.lapses = (st.lapses || 0) + 1;
        st.ease = Math.max(1.3, st.ease - 0.2);
        if (relearned) { st.interval = 1; st.due = dueAt(1); }
        else { st.interval = 0; st.due = now + 10 * 60 * 1000; }
      } else {
        st.reps += 1;
        if (quality === 1) {
          st.reps = Math.max(1, st.reps - 1);
          st.interval = st.interval < 1 ? 1 : Math.min(14, Math.max(1, Math.round(st.interval * 0.5)));
          st.ease = Math.max(1.3, st.ease - 0.15);
        } else if (quality === 2) {
          st.interval = st.reps === 1 ? 1 : st.reps === 2 ? 3 : Math.max(st.interval + 1, Math.round(st.interval * st.ease));
        } else {
          st.interval = st.reps === 1 ? 4 : st.reps === 2 ? 7 : Math.max(st.interval + 2, Math.round(st.interval * st.ease * 1.3));
          st.ease = Math.min(3, st.ease + 0.15);
        }
        st.interval = Math.min(365, fuzz(st.interval));
        st.due = dueAt(st.interval);
      }
      st.lastReview = now;
      st.updatedAt = now;
      srsData[id] = st;
      saveState();
    }

    function rateOnce(v, q) {
      if (extraPracticeMode) { logActivity(v.id); return; }
      if (v._lapsed) {
        if (!v._relearned && q >= 1) { v._relearned = true; rateWordSRS(v.id, q >= 2 ? 2 : 1); }
        else logActivity(v.id);
        return;
      }
      if (v._rated) { logActivity(v.id); return; }
      v._rated = true;
      rateWordSRS(v.id, q);
      logActivity(v.id);
    }

    /* ---------- 8. Phạm vi từ & Hàng đợi phiên học ---------- */
    function searchQuery() { return ($("searchWordInput") ? $("searchWordInput").value : "").trim(); }
    function isDueWord(v, now) { const st = srsData[v.id]; return !!st && !st.ignored && now >= Number(st.due || 0); }

    function applyBookFilter(list) {
      if (currentBookFilter === "ALL") return list;
      return list.filter(v => Array.isArray(v.books) && v.books.includes(currentBookFilter));
    }

    function getScopeWords() {
      const q = searchQuery();
      let base;
      if (q) {
        if (vocabSearchIndex && typeof vocabSearchIndex.filter === "function") {
          base = vocabSearchIndex.filter(q);
        } else {
          const ql = q.toLowerCase();
          base = LOADED_WORDS.filter(v =>
            (window.S4UI && typeof window.S4UI.matchesSearch === "function")
              ? window.S4UI.matchesSearch(v.word + " " + v.defVi + " " + v.defEn + " " + (v.col || []).join(" ") + " " + (v.syn || []).join(" ") + " " + v.trap, q)
              : (v.word.toLowerCase().includes(ql) || v.defVi.toLowerCase().includes(ql) || v.defEn.toLowerCase().includes(ql))
          );
        }
        if (currentLevelFilter !== "ALL") base = base.filter(v => v.level === Number(currentLevelFilter));
        return applyBookFilter(base);
      }

      if (currentTopic === "ALL") {
        base = currentLevelFilter === "ALL" ? LOADED_WORDS : (WORDS_BY_LEVEL[Number(currentLevelFilter)] || []);
        return applyBookFilter(base);
      }
      if (currentTopic === "ALL_DUE") {
        const now = Date.now();
        base = currentLevelFilter === "ALL" ? LOADED_WORDS : (WORDS_BY_LEVEL[Number(currentLevelFilter)] || []);
        base = applyBookFilter(base);
        return base.filter(v => isDueWord(v, now)).sort((a, b) => Number(srsData[a.id].due || 0) - Number(srsData[b.id].due || 0));
      }
      if (currentTopic.startsWith("LEVEL_")) {
        const lv = Number(currentTopic.slice(6)) || 1;
        return applyBookFilter(WORDS_BY_LEVEL[lv] || []);
      }
      base = LOADED_WORDS.filter(v => v.topicKey === currentTopic || v.topic === currentTopic);
      return applyBookFilter(base);
    }

    function randomMerge(a, b) {
      const out = []; let i = 0, j = 0;
      while (i < a.length || j < b.length) {
        const la = a.length - i, lb = b.length - j;
        if (Math.random() < la / (la + lb)) out.push(a[i++]); else out.push(b[j++]);
      }
      return out;
    }

    function buildStudyQueue(forceReset, skipDraftHydration) {
      const sessionScoped = !extraPracticeMode && !searchQuery();
      const sKey = currentSessionKey();
      if (!forceReset && tryRestoreActiveSession()) return;
      if (forceReset && sessionScoped) clearActiveSession(sKey, skipDraftHydration ? studyQueue.map(w => w.id) : undefined);

      const now = Date.now();
      const scope = getScopeWords();
      let list = [];

      if (extraPracticeMode) {
        list = shuffle(scope.filter(v => srsData[v.id] && !srsData[v.id].ignored)).slice(0, 25);
      } else {
        const cap = Number(userSettings.reviewCap) >= 9999 ? Infinity : Number(userSettings.reviewCap);
        const dueSource = (searchQuery() || currentTopic === "ALL_DUE" || currentBookFilter !== "ALL") ? scope : LOADED_WORDS;
        const due = dueSource.filter(v => isDueWord(v, now))
          .sort((a, b) => Number(srsData[a.id].due || 0) - Number(srsData[b.id].due || 0))
          .slice(0, cap);
        const fresh = currentTopic === "ALL_DUE" ? [] : scope.filter(v => !srsData[v.id]).slice(0, getRemainingDailyNewQuota());
        if (userSettings.queueOrder === "due_first") list = [...due, ...fresh];
        else if (userSettings.queueOrder === "new_first") list = [...fresh, ...due];
        else list = randomMerge(due, fresh);
      }

      const drafts = (!skipDraftHydration && !extraPracticeMode) ? (readSessionMap().__drafts || {}) : {};
      studyQueue = list.map(w => {
        const isNew = !srsData[w.id];
        const item = Object.assign({ _new: isNew }, w);
        const d = drafts[w.id];
        if (d && (!isNew || d.new)) {
          item._stage = typeof d.stage === "number" ? d.stage : (isNew ? 0 : 1);
          item._mistakes = d.mistakes || 0;
          item._resume = d.resume || null;
          item._relearn = !!d.relearn;
          item._lastTask = d.lastTask || null;
        }
        return item;
      });
      sessionTopic = sessionScoped ? sKey : "";
      sessionTotal = studyQueue.length;
      sessionDone = 0;
      smartTick = 0;
      lastSmartWordId = "";
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length) pickNextSmartItem(true);
      saveActiveSession();
    }

    function advanceQueueWithQuality(q) {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      const qLen = studyQueue.length;
      let droppedId = null;
      if (q === 0) {
        if (!v._lapsed && !extraPracticeMode) { v._lapsed = true; v._rated = true; rateWordSRS(v.id, 0); }
        else v._lapsed = true;
        logActivity(v.id);
        const minGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(3, Math.floor(qLen * 0.25)));
        const maxGap = qLen <= 3 ? qLen : Math.min(qLen, Math.max(6, Math.floor(qLen * 0.75)));
        studyQueue.splice(rint(minGap, maxGap), 0, v);
      } else if (q === 1 && !v._hardRepeated && !v._lapsed && qLen >= 3) {
        rateOnce(v, 1);
        v._hardRepeated = true;
        studyQueue.splice(rint(Math.ceil(qLen * 0.45), qLen), 0, v);
      } else {
        rateOnce(v, q);
        sessionDone++;
        droppedId = v.id;
      }
      isFlipped = false;
      bumpCard();
      saveActiveSession(droppedId ? [droppedId] : undefined);
      renderAll();
    }

    function handleResult(ok) {
      if (currentMode === "smart") completeSmartStep(ok);
      else advanceQueueWithQuality(ok ? 2 : 0);
    }

    /* ---------- 9. Chế độ Học 4 bước (Smart) ---------- */
    function pickNextSmartItem(preserveFront) {
      if (!studyQueue.length) return;
      smartTick++;
      for (let i = 0; i < studyQueue.length; i++) {
        const w = studyQueue[i];
        if (typeof w._stage !== "number") {
          w._stage = w._new ? 0 : 1;
          w._mistakes = 0;
        }
      }
      let pickIdx = 0;
      if (!preserveFront) {
        const frontCount = Math.min(4, studyQueue.length);
        const candidates = [];
        for (let i = 0; i < frontCount; i++) {
          if (studyQueue[i].id !== lastSmartWordId) candidates.push(i);
        }
        pickIdx = candidates.length ? candidates[rint(0, candidates.length - 1)] : 0;
      }
      if (pickIdx > 0) {
        const picked = studyQueue.splice(pickIdx, 1)[0];
        studyQueue.unshift(picked);
      }
      const pick = studyQueue[0];
      lastSmartWordId = pick.id;
      const exclude = pick._lastTask;
      const choose = list => { const l = list.filter(t => t !== exclude); const src = l.length ? l : list; return src[rint(0, src.length - 1)]; };
      if (pick._stage === 0) pick._task = "intro";
      else if (pick._stage === 1) pick._task = choose(["mcq_en2vi", "mcq_vi2en", "listen_choice"]);
      else if (pick._stage === 2) pick._task = choose(["mcq_vi2en", "listen_choice", "mcq_en2vi"]);
      else pick._task = choose(makeCloze(pick) ? ["cloze", "dictation"] : ["dictation"]);
      pick._lastTask = pick._task;
      bumpCard();
    }

    function completeSmartStep(ok) {
      if (!studyQueue.length) return;
      const v = studyQueue[0];
      const s = v._stage;
      if (s === 0) {
        v._stage = v._resume || 1;
        v._resume = null;
        v._relearn = false;
      } else if (ok) {
        if (s >= 3) { graduateSmartWord(v); return; }
        v._stage = s + 1;
      } else {
        v._mistakes = (v._mistakes || 0) + 1;
        v._resume = Math.max(1, s - 1);
        v._stage = 0;
        v._relearn = true;
      }
      v._task = null;
      studyQueue.shift();
      const qLen = studyQueue.length;
      let insertPos = qLen;
      if (qLen > 3) {
        if (ok || s === 0) {
          insertPos = rint(Math.min(qLen, Math.max(4, Math.floor(qLen * 0.35))), qLen);
        } else {
          insertPos = rint(Math.min(qLen, Math.max(3, Math.floor(qLen * 0.20))), Math.min(qLen, Math.max(6, Math.floor(qLen * 0.60))));
        }
      }
      studyQueue.splice(insertPos, 0, v);
      isFlipped = false;
      pickNextSmartItem();
      saveActiveSession();
      renderAll();
    }

    function graduateSmartWord(v) {
      studyQueue.shift();
      const m = v._mistakes || 0;
      if (!extraPracticeMode) {
        if (v._new) rateWordSRS(v.id, m >= 2 ? 1 : 2);
        else if (m === 0) rateWordSRS(v.id, 3);
        else if (m === 1) rateWordSRS(v.id, 1);
        else rateWordSRS(v.id, 0, true);
      }
      logActivity(v.id);
      sessionDone++;
      isFlipped = false;
      if (studyQueue.length) { pickNextSmartItem(); saveActiveSession([v.id]); }
      else { clearActiveSession(sessionTopic || currentSessionKey(), [v.id]); bumpCard(); }
      renderAll();
    }

    /* ---------- 10. Vũ khí 1: Âm thanh 3 giọng UK • US • AU ---------- */
    let audioPlayToken = 0;
    function speakWithLang(text, lang, token) {
      if (token !== audioPlayToken || !text) return;
      if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
        window.S4UI.speakEnglish(text, { lang: lang || "en-US", rate: 0.96 });
        return;
      }
      if ("speechSynthesis" in window) {
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang || "en-US";
          u.rate = 0.96;
          speechSynthesis.speak(u);
        } catch (e) {}
      }
    }
    function playAudio(src, word, lang) {
      const token = ++audioPlayToken;
      const p = $("audioPlayer");
      if (window.S4UI && typeof window.S4UI.stopEnglish === "function") {
        window.S4UI.stopEnglish();
      } else if ("speechSynthesis" in window) {
        try { speechSynthesis.cancel(); } catch (e) {}
      }
      if (p) { try { p.pause(); } catch (e) {} }
      if (src && p) {
        p.src = src;
        p.play().catch(() => {
          if (token !== audioPlayToken) return;
          speakWithLang(word, lang, token);
        });
      } else {
        speakWithLang(word, lang, token);
      }
    }
    function playVocab(id, accent) {
      const v = VOCAB_BY_ID.get(id);
      if (!v) return;
      const acc = accent === "mix" ? ["us", "uk", "au"][rint(0, 2)] : (accent || userSettings.defaultAccent || "us");
      if (acc === "uk") playAudio(v.localUkAudio, v.word, "en-GB");
      else if (acc === "au") playAudio("", v.word, "en-AU");
      else playAudio(v.localUsAudio, v.word, "en-US");
    }
    function autoPlayIfNeeded() {
      if (lastPlayedSerial === cardSerial || !studyQueue.length || currentMode === "list" || currentMode === "match") return;
      lastPlayedSerial = cardSerial;
      const v = studyQueue[0];
      let should = false;
      if (currentMode === "listen") should = true;
      else if (currentMode === "smart") should = ["listen_choice", "dictation"].includes(v._task) || (userSettings.autoAudio && ["intro", "mcq_en2vi"].includes(v._task));
      else if (currentMode === "flashcard") should = userSettings.autoAudio;
      else if (currentMode === "quiz") should = userSettings.autoAudio && !!(cardCache.quiz && cardCache.quiz.enToVi);
      if (should) setTimeout(() => playVocab(v.id, userSettings.defaultAccent || "us"), 120);
    }

    /* ---------- 11. Thống kê toàn cục không cần tải hết 4 gói ---------- */
    function computeStats() {
      const now = Date.now();
      const s = {
        total: MANIFEST.total || LOADED_WORDS.length,
        learning: 0, ignored: 0, due: 0, mastered: 0,
        levels: {
          1: { total: MANIFEST.levels[0].count, touched: 0, due: 0 },
          2: { total: MANIFEST.levels[1].count, touched: 0, due: 0 },
          3: { total: MANIFEST.levels[2].count, touched: 0, due: 0 },
          4: { total: MANIFEST.levels[3].count, touched: 0, due: 0 }
        },
        topics: {}
      };

      // Đếm tổng & theo Chặng từ srsData (nhanh tức thì dù chỉ tải 1 chặng!)
      Object.keys(srsData).forEach(id => {
        const st = srsData[id];
        if (!st || typeof st !== "object") return;
        const m = /^toeic([1-4])_/.exec(id);
        const lv = m ? Number(m[1]) : 0;
        if (lv && s.levels[lv]) s.levels[lv].touched++;
        if (st.ignored) { s.ignored++; return; }
        s.learning++;
        if (now >= Number(st.due || 0)) {
          s.due++;
          if (lv && s.levels[lv]) s.levels[lv].due++;
        } else if (Number(st.interval || 0) >= 7) {
          s.mastered++;
        }
      });

      // Khởi tạo topic counts từ manifest
      MANIFEST.topics.forEach(tp => {
        s.topics[tp.key] = { total: tp.count, touched: 0, due: 0 };
      });
      // Tính chính xác theo từng chủ đề của các chặng đã tải
      for (let i = 0; i < LOADED_WORDS.length; i++) {
        const v = LOADED_WORDS[i];
        const t = s.topics[v.topicKey] || (s.topics[v.topicKey] = { total: 0, touched: 0, due: 0 });
        if (!t._countedLoaded) { t._countedLoaded = true; t._loadedTotal = 0; }
        t._loadedTotal++;
        const st = srsData[v.id];
        if (!st) continue;
        t.touched++;
        if (!st.ignored && now >= Number(st.due || 0)) t.due++;
      }
      Object.keys(s.topics).forEach(k => {
        const t = s.topics[k];
        if (t._loadedTotal && !t.total) t.total = t._loadedTotal;
      });
      return s;
    }

    /* ---------- 12. Sidebar & Bộ lọc kép (Chặng + Nguồn sách) ---------- */
    function toggleSidebar(open) {
      const isOpen = !!open && window.innerWidth <= 768;
      $("sidebar").classList.toggle("open", isOpen);
      document.body.classList.toggle("sidebar-open", isOpen);
      const bd = $("sidebarBackdrop");
      if (bd) bd.classList.toggle("open", isOpen);
    }
    function syncDrawerViewport() {
      if (window.innerWidth > 768 && (document.body.classList.contains("sidebar-open") || $("sidebar")?.classList.contains("open"))) {
        toggleSidebar(false);
      }
    }
    window.addEventListener("resize", syncDrawerViewport);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) toggleSidebar(false);
    });

    async function setLevelFilter(lv) {
      currentLevelFilter = String(lv);
      if (lv !== "ALL") {
        const lvNum = Number(lv);
        openLevels.add(lvNum);
        await ensureLevelsLoaded([lvNum]);
        if (currentTopic !== "ALL_DUE" && levelOfTopicKey(currentTopic) !== lvNum) {
          currentTopic = "LEVEL_" + lvNum;
          userSettings.lastTopic = currentTopic;
        }
      }
      saveState();
      buildStudyQueue();
      renderAll();
    }

    async function setBookFilter(bookId) {
      currentBookFilter = String(bookId || "ALL");
      if (currentBookFilter !== "ALL") {
        await ensureLevelsLoaded(levelsForBook(currentBookFilter));
        // Nếu chủ đề hiện tại không có từ thuộc sách đang chọn -> chuyển sang phạm vi rộng hơn
        if (getScopeWords().length === 0) {
          currentTopic = currentLevelFilter === "ALL" ? "ALL" : ("LEVEL_" + currentLevelFilter);
        }
      }
      buildStudyQueue(true);
      renderAll();
    }

    function toggleLevelGroup(key) {
      if (openLevels.has(key)) openLevels.delete(key);
      else openLevels.add(key);
      renderSidebar();
    }

    async function selectTopic(tKey) {
      currentTopic = tKey;
      userSettings.lastTopic = tKey;
      extraPracticeMode = false;
      modeBeforeSearch = "";
      const inp = $("searchWordInput");
      if (inp && inp.value) {
        inp.value = "";
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
      }
      toggleSidebar(false);

      if (tKey === "ALL") {
        await ensureLevelsLoaded(currentLevelFilter === "ALL" ? [1, 2, 3, 4] : [Number(currentLevelFilter)]);
      } else if (tKey === "ALL_DUE") {
        await ensureLevelsLoaded(levelsNeededForDue(currentLevelFilter));
      } else {
        const lv = levelOfTopicKey(tKey);
        openLevels.add(lv);
        await ensureLevelsLoaded([lv]);
      }
      saveState();
      buildStudyQueue();
      renderAll();
    }

    function renderSidebar() {
      const st = lastStats || computeStats();

      // 1. Tabs 4 Chặng điểm
      const lvTabs = $("levelTabs");
      if (lvTabs) {
        let html = `<button type="button" class="cat-tab ${currentLevelFilter === "ALL" ? "active" : ""}" onclick="setLevelFilter('ALL')">Tất cả</button>`;
        MANIFEST.levels.forEach(l => {
          html += `<button type="button" class="cat-tab ${currentLevelFilter === String(l.level) ? "active" : ""}" onclick="setLevelFilter('${l.level}')">${escHtml(l.short)}</button>`;
        });
        lvTabs.innerHTML = html;
      }

      // 2. Bộ lọc Nguồn sách
      const bookWrap = $("bookFilterWrap");
      if (bookWrap) {
        let bHtml = `<div class="book-filter-lbl"><span>Lọc nguồn sách</span>${currentBookFilter !== "ALL" ? `<button type="button" class="skip-known-btn" style="padding:2px 7px;font-size:10.5px;" onclick="setBookFilter('ALL')">Xóa lọc</button>` : ""}</div><div class="book-chips">`;
        bHtml += `<button type="button" class="book-chip ${currentBookFilter === "ALL" ? "active" : ""}" onclick="setBookFilter('ALL')">Tất cả sách</button>`;
        MANIFEST.books.forEach(b => {
          bHtml += `<button type="button" class="book-chip ${currentBookFilter === b.id ? "active" : ""}" onclick="setBookFilter('${escJsAttr(b.id)}')">${escHtml(b.label)}</button>`;
        });
        bHtml += `</div>`;
        bookWrap.innerHTML = bHtml;
      }

      // 3. Danh sách Accordion Chặng & Chủ đề
      const itemHtml = (key, nameHtml, metaHtml, pct) =>
        `<div class="topic-item ${currentTopic === key ? "active" : ""}" onclick="selectTopic('${escJsAttr(key)}')">
          <div class="topic-name">${nameHtml}</div>${metaHtml}
          ${pct === null ? "" : `<div class="progress-mini"><div class="progress-mini-bar" style="width:${pct}%"></div></div>`}
        </div>`;

      let html = "";
      if (currentLevelFilter === "ALL") {
        const spOpen = openLevels.has("special");
        html += `<div class="cat-group ${spOpen ? "open" : ""}">
          <div class="cat-header" onclick="toggleLevelGroup('special')">
            <span>Ôn tập &amp; Tổng hợp</span>
            <span class="cat-meta"><span style="color:var(--danger);font-weight:800;">Ôn ${st.due}</span>${vIcon(spOpen ? "chevronDown" : "chevronRight", 13)}</span>
          </div>
          <div class="cat-items">
            ${itemHtml("ALL_DUE", `${vIcon("bell", 14)} <span>Cần ôn tập hôm nay</span>`, `<div class="topic-meta"><span>Đến hạn ôn SRS</span><b style="color:var(--danger)">${st.due} từ</b></div>`, null)}
            ${itemHtml("ALL", `${vIcon("layers", 14)} <span>Toàn bộ kho từ TOEIC</span>`, `<div class="topic-meta"><span>4 chặng • 0–990</span><b>${st.total.toLocaleString("en-US")} từ</b></div>`, null)}
          </div>
        </div>`;
      }

      MANIFEST.levels.forEach(lvObj => {
        if (currentLevelFilter !== "ALL" && String(lvObj.level) !== currentLevelFilter) return;
        const lvStat = st.levels[lvObj.level] || { total: lvObj.count, touched: 0, due: 0 };
        const lvTotal = lvStat.total || lvObj.count || 0;
        const lvPct = lvTotal ? Math.min(100, Math.round((lvStat.touched / lvTotal) * 100)) : 0;
        const isOpen = currentLevelFilter === String(lvObj.level) || openLevels.has(lvObj.level);
        const isLoaded = LOADED_LEVELS.has(lvObj.level);

        let items = itemHtml(
          "LEVEL_" + lvObj.level,
          `${vIcon("briefcase", 13)} <span>Cả Chặng ${lvObj.level} (${escHtml(lvObj.short)})</span>`,
          `<div class="topic-meta"><span>${lvStat.touched}/${lvTotal}${lvStat.due ? ` • <b style="color:var(--danger)">ôn ${lvStat.due}</b>` : ""}</span><b>${lvPct}%</b></div>`,
          lvPct
        );

        lvObj.topics.forEach((tp, idx) => {
          const ts = st.topics[tp.key] || { total: tp.count, touched: 0, due: 0 };
          const tTotal = ts.total || tp.count || 0;
          const pct = tTotal ? Math.min(100, Math.round((ts.touched / tTotal) * 100)) : 0;
          const metaTxt = isLoaded
            ? `${ts.touched}/${tTotal}${ts.due ? ` • <b style="color:var(--danger)">ôn ${ts.due}</b>` : ""}`
            : `${tTotal} từ`;
          const displayName = /^\d+\.\s/.test(tp.name) ? tp.name : ((idx + 1) + ". " + tp.name);
          items += itemHtml(
            tp.key,
            `<span>${escHtml(displayName)}</span>`,
            `<div class="topic-meta"><span>${metaTxt}</span><b>${isLoaded ? (pct + "%") : ""}</b></div>`,
            isLoaded ? pct : null
          );
        });

        const lvHeading = /^Chặng\s/i.test(lvObj.title) ? lvObj.title : ("Chặng " + lvObj.level + ": " + lvObj.short + " • " + lvObj.title);
        html += `<div class="cat-group ${isOpen ? "open" : ""}">
          <div class="cat-header" onclick="toggleLevelGroup(${lvObj.level})">
            <span style="line-height:1.3;">${escHtml(lvHeading)}</span>
            <span class="cat-meta">
              <span style="${lvPct === 100 ? "color:var(--success);font-weight:800;" : ""}">${lvStat.touched}/${lvTotal}</span>
              ${vIcon(isOpen ? "chevronDown" : "chevronRight", 13)}
            </span>
          </div>
          <div class="cat-items">${items}</div>
        </div>`;
      });

      $("topicList").innerHTML = html;
    }

    /* ---------- 13. Mode Switcher, Settings & Calendar ---------- */
    const MODE_META = {
      smart: { icon: "graduation", label: "Học 4 bước" },
      flashcard: { icon: "layers", label: "Flashcard" },
      quiz: { icon: "help", label: "Trắc nghiệm" },
      listen: { icon: "listening", label: "Nghe & Chính tả" },
      cloze: { icon: "edit", label: "Điền từ" },
      match: { icon: "grid", label: "Ghép cặp" },
      list: { icon: "reading", label: "Danh sách từ" }
    };

    function syncModeUi(m) {
      document.querySelectorAll("#modeNav .mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
      document.querySelectorAll("#modeDdMenu .mode-dd-item").forEach(b => {
        const act = b.dataset.mode === m;
        b.classList.toggle("active", act);
        const chk = b.querySelector(".dd-chk");
        if (chk) chk.innerHTML = act ? vIcon("check", 14) : "";
      });
      const lbl = $("modeDdLabel");
      if (lbl && MODE_META[m]) {
        lbl.innerHTML = `${vIcon(MODE_META[m].icon, 14)}<span>${MODE_META[m].label}</span>`;
      }
      const menu = $("modeDdMenu");
      if (menu) menu.classList.remove("open");
    }

    function setMode(m) {
      if (!MODE_META[m]) return;
      if (m !== "list") modeBeforeSearch = "";
      currentMode = m;
      syncModeUi(m);
      isFlipped = false;
      if (m === "smart" && studyQueue.length && !studyQueue[0]._task) pickNextSmartItem(true);
      else bumpCard();
      if (m !== "list") saveActiveSession();
      renderMain();
    }
    document.addEventListener("click", () => {
      const menu = $("modeDdMenu");
      if (menu) menu.classList.remove("open");
    });

    function togglePanel(p) {
      panel = panel === p ? "" : p;
      document.body.classList.toggle("scroll-mode", currentMode === "list" || !!panel);
      renderStats();
    }
    function shiftCalMonth(d) { calMonthOffset = Math.min(0, calMonthOffset + d); renderStats(); }

    function setOpt(key, val) {
      if (key === "autoAudio") { userSettings.autoAudio = !!val; saveState(); return; }
      if (key === "defaultAccent") { userSettings.defaultAccent = String(val); saveState(); return; }
      if (key === "queueOrder") userSettings.queueOrder = String(val);
      else userSettings[key] = Number(val);
      saveState();
      buildStudyQueue(true);
      renderAll();
    }
    function addBonusNewWords(n) {
      const today = getTodayStr();
      if (userSettings.bonusTodayDate !== today) { userSettings.bonusTodayDate = today; userSettings.bonusTodayCount = 0; }
      userSettings.bonusTodayCount += n;
      extraPracticeMode = false;
      saveState();
      buildStudyQueue();
      renderAll();
    }
    function startFreePractice() { extraPracticeMode = true; buildStudyQueue(); renderAll(); }
    function exitPractice() { extraPracticeMode = false; buildStudyQueue(); renderAll(); }
    async function startDueReview() {
      extraPracticeMode = false;
      currentTopic = "ALL_DUE";
      userSettings.lastTopic = "ALL_DUE";
      const inp = $("searchWordInput");
      if (inp && inp.value) {
        inp.value = "";
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
      }
      await ensureLevelsLoaded(levelsNeededForDue(currentLevelFilter));
      saveState();
      buildStudyQueue(true, true);
      renderAll();
    }

    function calendarHtml() {
      const base = new Date();
      base.setDate(1);
      base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDow = (new Date(year, month, 1).getDay() + 6) % 7;
      const todayStr = getTodayStr();
      const keyOf = d => year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");

      let total = 0, active = 0;
      let cells = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(n => `<div class="cal-dow">${n}</div>`).join("") + "<div></div>".repeat(startDow);
      for (let d = 1; d <= daysInMonth; d++) {
        const key = keyOf(d);
        const cnt = (dayLog[key] || []).length;
        total += cnt; if (cnt) active++;
        const lv = !cnt ? 0 : cnt < 10 ? 1 : cnt < 20 ? 2 : cnt < 40 ? 3 : 4;
        cells += `<div class="cal-day lv${lv}${key === todayStr ? " today" : ""}" title="${d}/${month + 1}: ${cnt} từ">${d}${cnt ? `<span>${cnt}</span>` : ""}</div>`;
      }
      let streak = 0;
      const cur = new Date();
      if (!(dayLog[localDateStr(cur)] || []).length) cur.setDate(cur.getDate() - 1);
      while ((dayLog[localDateStr(cur)] || []).length) { streak++; cur.setDate(cur.getDate() - 1); }

      return `<div class="cal-wrap">
        <div class="cal-head">
          <button type="button" class="mode-btn" onclick="shiftCalMonth(-1)" aria-label="Tháng trước">${vIcon("chevronLeft", 14)}</button>
          <b>Tháng ${month + 1}/${year}</b>
          <button type="button" class="mode-btn" onclick="shiftCalMonth(1)" ${calMonthOffset >= 0 ? 'disabled style="opacity:.4"' : ""} aria-label="Tháng sau">${vIcon("chevronRight", 14)}</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot">
          <span class="v-chip">${vIcon("flame", 13)} Chuỗi <b>${streak}</b> ngày</span>
          <span class="v-chip">${vIcon("calendar", 13)} <b>${active}</b> ngày học</span>
          <span class="v-chip">${vIcon("edit", 13)} <b>${total}</b> từ</span>
          <span class="cal-legend">Ít <i class="cal-day lv1"></i><i class="cal-day lv2"></i><i class="cal-day lv3"></i><i class="cal-day lv4"></i> Nhiều</span>
        </div>
      </div>`;
    }

    function settingsHtml() {
      const opt = (val, label, cur) => `<option value="${val}" ${String(cur) === String(val) ? "selected" : ""}>${label}</option>`;
      const limits = [10, 15, 20, 30, 50, 100, 9999].map(l => opt(l, l === 9999 ? "Không giới hạn" : l + " từ", userSettings.dailyNewLimit)).join("");
      const caps = [30, 50, 100, 200, 9999].map(l => opt(l, l === 9999 ? "Không giới hạn" : l + " từ", userSettings.reviewCap)).join("");
      const orders = [["mix", "Trộn ngẫu nhiên"], ["due_first", "Ôn trước, mới sau"], ["new_first", "Mới trước, ôn sau"]].map(o => opt(o[0], o[1], userSettings.queueOrder)).join("");
      const accents = [["us", "US (Mỹ)"], ["uk", "UK (Anh)"], ["au", "AU (Úc)"], ["mix", "Xoay vòng US/UK/AU"]].map(a => opt(a[0], a[1], userSettings.defaultAccent)).join("");
      return `<div class="panel v-settings-panel">
        <label class="v-set-item"><span>Từ mới/ngày</span><select class="limit-select" onchange="setOpt('dailyNewLimit',this.value)">${limits}</select></label>
        <label class="v-set-item"><span>Ôn tối đa</span><select class="limit-select" onchange="setOpt('reviewCap',this.value)">${caps}</select></label>
        <label class="v-set-item"><span>Thứ tự</span><select class="limit-select" onchange="setOpt('queueOrder',this.value)">${orders}</select></label>
        <label class="v-set-item"><span>Giọng tự động</span><select class="limit-select" onchange="setOpt('defaultAccent',this.value)">${accents}</select></label>
        <label class="v-set-chk">
          <span class="lp-switch"><input type="checkbox" ${userSettings.autoAudio ? "checked" : ""} onchange="setOpt('autoAudio',this.checked)"><span class="lp-switch-slider"></span></span>
          <span>${vIcon("volume", 14)} Tự phát âm khi mở thẻ</span>
        </label>
      </div>`;
    }

    function renderStats() {
      const st = lastStats || computeStats();
      const target = getDailyTarget();
      const unseen = Math.max(0, st.total - st.learning - st.ignored);
      const bookBadge = currentBookFilter !== "ALL"
        ? `<div class="active-filter-banner"><span>Đang lọc sách: <b style="color:var(--primary)">${escHtml(BOOK_LABELS[currentBookFilter] || currentBookFilter)}</b> (${getScopeWords().length} từ)</span><button type="button" class="skip-known-btn" onclick="setBookFilter('ALL')">${vIcon("close", 12)} Bỏ lọc sách</button></div>`
        : "";
      $("statsHost").innerHTML = `<div class="stats-card">
        <div class="stats-top">
          <div class="stats-mini-inline">
            <span class="quota-pill">${vIcon("sparkle", 13)} <span class="v-stat-lbl">Hôm nay </span>${getNewWordsLearnedTodayCount()}/${target >= 9000 ? "∞" : target}</span>
            <span class="v-chip">${vIcon("reading", 13)} <span class="v-stat-lbl">Đã học: </span><b style="color:var(--primary)">${st.learning}</b></span>
            <span class="v-chip">${vIcon("bell", 13)} <span class="v-stat-lbl">Ôn: </span><b style="color:var(--danger)">${st.due}</b></span>
          </div>
          <div class="stats-btns">
            <button type="button" class="mode-btn ${panel === "stats" ? "active" : ""}" onclick="togglePanel('stats')">${vIcon("chart", 14)} <span class="v-btn-lbl">Chi tiết</span></button>
            <button type="button" class="mode-btn ${panel === "calendar" ? "active" : ""}" onclick="togglePanel('calendar')" title="Lịch sử học theo ngày">${vIcon("calendar", 14)}<span class="v-cal-lbl"> Lịch</span></button>
            <button type="button" class="mode-btn v-set-btn ${panel === "settings" ? "active" : ""}" onclick="togglePanel('settings')" title="Cài đặt học từ" aria-label="Cài đặt học từ">${vIcon("settings", 14)}</button>
          </div>
        </div>
        ${bookBadge}
        ${panel === "stats" ? `<div class="stats-grid">
          <div><div class="stat-num" style="color:var(--primary)">${st.learning}</div><div class="stat-label">Đã học</div></div>
          <div><div class="stat-num" style="color:var(--danger)">${st.due}</div><div class="stat-label">Cần ôn</div></div>
          <div><div class="stat-num" style="color:var(--success)">${st.mastered}</div><div class="stat-label">Nhớ kỹ</div></div>
          <div><div class="stat-num" style="color:var(--warn)">${st.ignored}</div><div class="stat-label">Đã biết</div></div>
          <div><div class="stat-num">${unseen}</div><div class="stat-label">Chưa học</div></div>
        </div>` : ""}
        ${panel === "settings" ? settingsHtml() : ""}
        ${panel === "calendar" ? `<div class="panel">${calendarHtml()}</div>` : ""}
      </div>`;
    }

    /* ---------- 14. Vũ khí 2 & 3: Minh họa 3 tầng + Khung phân tích TOEIC ---------- */
    window._lpFallbackScene = function (imgEl) {
      if (!imgEl) return;
      imgEl.style.display = "none";
      const sib = imgEl.nextElementSibling;
      if (sib && sib.classList.contains("fc-scene-card")) sib.style.display = "flex";
    };

    function visualSceneCardHtml(v, hiddenByDefault) {
      const lvObj = MANIFEST.levels[(v.level || 1) - 1] || MANIFEST.levels[0];
      const iconName = pickSceneIconName(v);
      const bookTags = (v.books || []).slice(0, 2).map(b => `<span class="fc-scene-book">${escHtml(BOOK_LABELS[b] || b)}</span>`).join("");
      const cue = (v.col && v.col.length) ? v.col[0] : (v.topic || "Từ vựng Thương mại TOEIC");
      const sub = (v.col && v.col.length) ? v.topic : ("Ngữ cảnh Chặng " + (v.level || 1) + " • " + (lvObj ? lvObj.short : ""));
      return `<div class="fc-scene-card" style="${hiddenByDefault ? "display:none;" : ""}">
        <div class="fc-scene-icon" aria-hidden="true">${vIcon(iconName, 22)}</div>
        <div class="fc-scene-body">
          <div class="fc-scene-meta">
            <span class="fc-scene-stage">${escHtml(lvObj ? lvObj.short : "TOEIC")}</span>
            ${bookTags}
          </div>
          <div class="fc-scene-cue">${escHtml(cue)}</div>
          <div class="fc-scene-sub">${escHtml(sub)}</div>
        </div>
      </div>`;
    }

    function mediaTierHtml(v, maxH) {
      const styleH = maxH ? ` style="max-height:${maxH}px;"` : "";
      if (v.localImg) {
        return `<div class="fc-media-wrap">
          <img class="fc-front-img"${styleH} loading="lazy" decoding="async" src="${escHtml(v.localImg)}" alt="${escHtml(v.word)}" onerror="window._lpFallbackScene(this)">
          ${visualSceneCardHtml(v, true)}
        </div>`;
      }
      return `<div class="fc-media-wrap">${visualSceneCardHtml(v, false)}</div>`;
    }

    function audioRowHtml(v, large) {
      const safeId = escJsAttr(v.id);
      const st = large ? ' style="font-size:14.5px;padding:8px 16px;"' : "";
      const icoSz = large ? 15 : 13;
      return `<div class="audio-row">
        <button type="button" class="audio-pill"${st} onclick="playVocab('${safeId}','uk')" title="Phát âm giọng Anh (UK)">${vIcon("volume", icoSz)} UK</button>
        <button type="button" class="audio-pill"${st} onclick="playVocab('${safeId}','us')" title="Phát âm giọng Mỹ (US)">${vIcon("volume", icoSz)} US</button>
        <button type="button" class="audio-pill is-au"${st} onclick="playVocab('${safeId}','au')" title="Phát âm giọng Úc (AU)">${vIcon("volume", icoSz)} AU</button>
      </div>`;
    }

    function exampleHtml(list) { return (list || []).map(e => "• " + e).join("<br>"); }

    function toeicAnalysisHtml(v) {
      const books = (v.books || []).map(b => `<span class="fc-book-badge">${escHtml(BOOK_LABELS[b] || b)}</span>`).join("");
      const wf = (v.wf || []).length
        ? `<div class="fc-toeic-row"><span class="fc-toeic-lbl">Word Family:</span>${v.wf.map(x => `<span class="fc-pill-wf">${escHtml(x)}</span>`).join("")}</div>`
        : "";
      const col = (v.col || []).length
        ? `<div class="fc-toeic-row"><span class="fc-toeic-lbl">Collocations:</span>${v.col.map(x => `<span class="fc-pill-col">${escHtml(x)}</span>`).join("")}</div>`
        : "";
      const syn = (v.syn || []).length
        ? `<div class="fc-toeic-row"><span class="fc-toeic-lbl">Paraphrase P7:</span>${v.syn.map(x => `<span class="fc-pill-syn">${escHtml(x)}</span>`).join("")}</div>`
        : "";
      if (!books && !wf && !col && !syn) return "";
      return `<div class="fc-toeic-box">
        <div class="fc-toeic-hd">
          <span class="fc-toeic-title">${vIcon("briefcase", 13)} Phân tích TOEIC</span>
          ${books ? `<div class="fc-book-badges">${books}</div>` : ""}
        </div>
        ${wf}${col}${syn}
      </div>`;
