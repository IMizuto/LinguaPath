    function trapBoxHtml(v) {
      if (!v || !v.trap) return "";
      return `<div class="fc-trap-box">
        <span class="fc-trap-ico" aria-hidden="true">${vIcon("alert", 16)}</span>
        <div>
          <div class="fc-trap-hd">Cảnh báo Nghĩa bẫy TOEIC</div>
          <div>${escHtml(v.trap)}</div>
        </div>
      </div>`;
    }

    function backHtml(v) {
      return `<div class="fc-back">
        <div class="def-box">
          <div class="def-vi-main">${escHtml(v.defVi)}</div>
          ${v.defEn ? `<div class="def-en-sub">${escHtml(v.defEn)}</div>` : ""}
        </div>
        ${v.examples && v.examples.length ? `<div class="ex-box"><b>Ví dụ ngữ cảnh:</b><br>${exampleHtml(v.examples)}</div>` : ""}
        ${toeicAnalysisHtml(v)}
        ${trapBoxHtml(v)}
      </div>`;
    }

    function tagHtml(v) {
      return (v._new ? `<span class="tag new">${vIcon("sparkle", 12)} Từ mới</span>` : `<span class="tag rev">${vIcon("refresh", 12)} Ôn lại</span>`) +
        `<span style="margin-left:7px;font-weight:700;">${escHtml(shortTopicName(v.topic))}</span>`;
    }
    const STEP_NAMES = ["Làm quen", "Nhận diện", "Nghe & Nhớ", "Ghi nhớ sâu"];
    function stepsHtml(v) {
      if (currentMode !== "smart" || typeof v._stage !== "number") return "";
      const stepNum = Math.min(4, Math.max(1, v._stage + 1));
      return `<span class="steps" title="Bước ${stepNum}/4: ${STEP_NAMES[stepNum - 1] || ""}">${[0, 1, 2, 3].map(i => `<i class="${i < v._stage ? "done" : i === v._stage ? "cur" : ""}"></i>`).join("")}<b class="step-lbl">Bước ${stepNum}/4</b></span>`;
    }
    function headerHtml(v, extra) {
      return `<div class="fc-top-bar"><div>${tagHtml(v)}${stepsHtml(v)}</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;">${extra || ""}<button type="button" class="skip-known-btn" onclick="ignoreCurrentWord()">${vIcon("check", 12)} Đã biết</button></div></div>`;
    }

    function flashcardHtml(v, extraBody, actionFooter) {
      return `<div class="flashcard-wrap">
        ${headerHtml(v)}
        <div class="fc-scroll-body">
          <div class="fc-front">
            ${mediaTierHtml(v)}
            <div><span class="fc-word">${escHtml(v.word)}</span> <span class="fc-pos">${escHtml(v.pos)}</span></div>
            <div class="fc-ipa">${escHtml(v.ipa)}</div>
            ${audioRowHtml(v, false)}
          </div>
          ${extraBody || ""}
        </div>
        <div class="fc-action-dock">${actionFooter || ""}</div>
      </div>`;
    }

    function flipCard() { if (tapTooSoon()) return; isFlipped = true; tapLockAt = Date.now(); renderMain(); }
    function rateBtn(q) { if (tapTooSoon()) return; advanceQueueWithQuality(q); }
    function introDone() { if (tapTooSoon()) return; completeSmartStep(true); }

    function ignoreCurrentWord() {
      if (!studyQueue.length) return;
      const v = studyQueue.shift();
      const wasNew = !srsData[v.id];
      srsData[v.id] = { ignored: true, updatedAt: Date.now() };
      sessionDone++;
      saveState();
      if (wasNew && !extraPracticeMode && currentTopic !== "ALL_DUE") {
        const queued = new Set(studyQueue.map(x => x.id));
        const rep = getScopeWords().find(w => !srsData[w.id] && !queued.has(w.id));
        if (rep) { studyQueue.push(Object.assign({ _new: true }, rep)); sessionTotal++; }
      }
      isFlipped = false;
      bumpCard();
      if (currentMode === "smart" && studyQueue.length) pickNextSmartItem();
      saveActiveSession([v.id]);
      renderAll();
    }
    function unignoreWord(id) { delete srsData[id]; saveState(); saveActiveSession([id]); afterListChange(); }
    function markKnown(id) { srsData[id] = { ignored: true, updatedAt: Date.now() }; saveState(); saveActiveSession([id]); afterListChange(); }
    function afterListChange() { if (!studyQueue.length) buildStudyQueue(); renderAll(); }

    /* ---------- 15. Quiz, Listen/Dictation, Cloze, Match, List ---------- */
    function pickDistractors(v) {
      const pool = (WORDS_BY_LEVEL[v.level] && WORDS_BY_LEVEL[v.level].length >= 12) ? WORDS_BY_LEVEL[v.level] : LOADED_WORDS;
      const out = [], used = new Set([v.id]);
      const samePos = Math.random() < 0.7;
      let guard = 0;
      while (out.length < 3 && guard++ < 500 && pool.length > 1) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        if (!c || used.has(c.id) || c.word.toLowerCase() === v.word.toLowerCase()) continue;
        if (samePos && guard < 240 && c.pos !== v.pos) continue;
        used.add(c.id);
        out.push(c);
      }
      return out;
    }

    function quizHtml(v, dir) {
      const q = cacheGet("quiz", () => ({
        enToVi: dir === "en2vi" || (dir === "mix" && Math.random() < 0.5),
        choices: shuffle([v, ...pickDistractors(v)])
      }));
      const prompt = q.enToVi
        ? `<div class="center">${mediaTierHtml(v, 130)}<div class="fc-word">${escHtml(v.word)} <span class="fc-pos">${escHtml(v.pos)}</span></div>
             <div class="fc-ipa">${escHtml(v.ipa)}</div>${audioRowHtml(v, false)}</div>`
        : `<div class="prompt-box"><b>Định nghĩa:</b><br><span class="def-vi-main">${escHtml(v.defVi)}</span>${v.defEn ? `<div class="def-en-sub">${escHtml(v.defEn)}</div>` : ""}</div>`;
      const opts = q.choices.map(c => {
        const label = q.enToVi ? escHtml(c.defVi) : `<b>${escHtml(c.word)}</b> <span class="fc-pos">${escHtml(c.pos)}</span>`;
        return `<button type="button" class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)">${label}</button>`;
      }).join("");
      const dirBtns = currentMode === "quiz"
        ? [["en2vi", "Anh → Việt"], ["vi2en", "Việt → Anh"], ["mix", "Trộn"]].map(([k, l]) =>
            `<button type="button" class="mode-btn ${quizDirection === k ? "active" : ""}" onclick="setQuizDir('${k}')">${l}</button>`
          ).join("")
        : "";
      return `<div class="quiz-box">${headerHtml(v, dirBtns)}${prompt}<div class="options-grid">${opts}</div></div>`;
    }
    function setQuizDir(d) { quizDirection = d; cardCache = {}; renderMain(); }
    function setListenSub(d) { listenSubMode = d; cardCache = {}; renderMain(); }

    function answerChoice(btn) {
      if (tapTooSoon()) return;
      const grid = btn.parentElement;
      if (grid.dataset.locked === "1") return;
      grid.dataset.locked = "1";
      const ok = btn.dataset.correct === "true";
      btn.classList.add(ok ? "correct" : "wrong");
      if (!ok) { const r = grid.querySelector('[data-correct="true"]'); if (r) r.classList.add("correct"); }
      const serial = cardSerial;
      setTimeout(() => { if (serial === cardSerial) handleResult(ok); }, ok ? 1050 : 2100);
    }

    function normalizeAns(s) { return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").trim(); }
    function showAnsToast(ok, rightAns) {
      if (window.S4UI && typeof window.S4UI.toast === "function") {
        window.S4UI.toast(ok ? "success" : "error", ok ? "Chính xác" : ("Đáp án: " + rightAns), { duration: ok ? 1300 : 2300 });
      }
    }
    function scrollInputIntoOptimalView(el) {
      if (!el) return;
      setTimeout(() => { try { el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); } catch (e) {} }, 140);
    }
    function onAnsInputEdit(inp) {
      if (!inp) return;
      inp.dataset.wrongWaiting = "0";
      inp.classList.remove("correct", "wrong");
    }
    function handleAnsKeydown(ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const inp = $("ansInput");
        if (inp && inp.dataset.wrongWaiting === "1") { handleResult(false); return; }
        checkText();
      }
    }
    function checkText() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      const answers = cardCache.answers || [];
      finishText(inp, answers.includes(normalizeAns(inp.value)), false);
    }
    function giveUp() {
      const inp = $("ansInput");
      if (!inp || inp.dataset.locked === "1") return;
      finishText(inp, false, true);
    }
    function finishText(inp, ok, isGiveUp) {
      const rightAns = (studyQueue[0] && studyQueue[0].word) || (cardCache.answers || [""])[0];
      if (isGiveUp) inp.value = rightAns;
      inp.classList.remove("correct", "wrong");
      inp.classList.add(ok ? "correct" : "wrong");
      document.querySelectorAll("#cardHost .blank").forEach(b => {
        b.classList.remove("correct", "wrong");
        b.classList.add(ok ? "correct" : "wrong");
        b.textContent = rightAns;
      });
      const fb = $("ansFeedback");
      const nextBtn = $("nextAfterWrongBtn");
      const w = studyQueue[0];
      if (ok) {
        inp.dataset.locked = "1";
        inp.dataset.wrongWaiting = "0";
        if (fb) { fb.style.color = "var(--success)"; fb.innerHTML = `<span class="v-chip">${vIcon("check", 14)} Chính xác: <b>${escHtml(rightAns)}</b></span>`; }
        if (nextBtn) nextBtn.style.display = "none";
        showAnsToast(true, rightAns);
        if (w) playVocab(w.id, userSettings.defaultAccent || "us");
        const passSrs = inp.dataset.hadWrong !== "1";
        const serial = cardSerial;
        setTimeout(() => { if (serial === cardSerial) handleResult(passSrs); }, 1050);
      } else {
        inp.dataset.hadWrong = "1";
        inp.dataset.wrongWaiting = "1";
        if (fb) { fb.style.color = "var(--danger)"; fb.innerHTML = `<span class="v-chip">${vIcon("close", 14)} Chưa đúng — Đáp án: <span class="dic-ans-hint">${escHtml(rightAns)}</span></span>`; }
        if (nextBtn) nextBtn.style.display = "inline-flex";
        if (w) playVocab(w.id, userSettings.defaultAccent || "us");
      }
    }
    function textInputHtml(placeholder) {
      return `<input type="text" id="ansInput" class="text-input" placeholder="${escHtml(placeholder)}" autocomplete="off" autocapitalize="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" oninput="onAnsInputEdit(this)" onkeydown="handleAnsKeydown(event)">
        <div id="ansFeedback" style="margin-top:8px;font-weight:700;font-size:13.5px;min-height:22px;"></div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">
          <button type="button" class="mode-btn active" onclick="checkText()">${vIcon("check", 14)} Kiểm tra</button>
          <button type="button" class="mode-btn" onclick="giveUp()">${vIcon("lightbulb", 14)} Hiện đáp án</button>
          <button type="button" class="mode-btn" id="nextAfterWrongBtn" style="display:none;background:var(--primary-solid);color:#fff;border-color:var(--primary-solid);" onclick="handleResult(false)">Câu tiếp theo ${vIcon("arrowRight", 14)}</button>
        </div>`;
    }

    function listenHtml(v, sub) {
      cardCache.answers = [normalizeAns(v.word)];
      let body;
      if (sub === "choice") {
        const choices = cacheGet("listen", () => shuffle([v, ...pickDistractors(v)]));
        body = `<div class="options-grid">${choices.map(c => `<button type="button" class="opt-btn" data-correct="${c.id === v.id}" onclick="answerChoice(this)"><b>${escHtml(c.word)}</b> <span class="fc-pos">${escHtml(c.pos)}</span></button>`).join("")}</div>`;
      } else {
        body = `<div class="center" style="margin-top:12px;color:var(--lg-ink-muted,var(--muted));">Nghĩa: <b style="color:var(--lg-ink,var(--text))">${escHtml(v.defVi)}</b> ${escHtml(v.pos)}</div>${textInputHtml("Gõ từ tiếng Anh bạn nghe được...")}`;
      }
      const subBtns = currentMode === "listen"
        ? `<button type="button" class="mode-btn ${sub === "choice" ? "active" : ""}" onclick="setListenSub('choice')">Chọn từ</button><button type="button" class="mode-btn ${sub === "dictation" ? "active" : ""}" onclick="setListenSub('dictation')">Chính tả</button>`
        : "";
      return `<div class="quiz-box">${headerHtml(v, subBtns)}
        <div style="margin:12px 0;">${audioRowHtml(v, true)}</div>
        ${body}</div>`;
    }

    function makeCloze(v) {
      const ex = (v.examples || []).find(e => /<b[^>]*>[^<]+<\/b>/i.test(e));
      if (ex) {
        const answers = [normalizeAns(v.word)];
        const html = ex.replace(/<b[^>]*>([^<]+)<\/b>/gi, (m, t) => {
          answers.push(normalizeAns(t));
          return '<span class="blank">_____</span>';
        });
        return { html, answers };
      }
      const firstEx = (v.examples || [])[0];
      if (firstEx && v.word) {
        const re = new RegExp("\\b" + v.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
        if (re.test(firstEx)) {
          return { html: firstEx.replace(re, '<span class="blank">_____</span>'), answers: [normalizeAns(v.word)] };
        }
      }
      return null;
    }

    function clozeHtml(v) {
      const c = makeCloze(v);
      cardCache.answers = c ? c.answers : [normalizeAns(v.word)];
      const hint = `Gợi ý: <b>${escHtml((v.word || "")[0] || "")}… (${(v.word || "").length} ký tự)</b>`;
      return `<div class="quiz-box center">${headerHtml(v, `<span style="font-size:12px;color:var(--lg-ink-muted,var(--muted));">${hint}</span>`)}
        ${mediaTierHtml(v, 118)}
        <div class="prompt-box" style="font-size:16.5px;margin:10px 0;text-align:left;">${c ? c.html : escHtml(v.defEn || v.defVi)}</div>
        <div style="color:var(--lg-ink-muted,var(--muted));">Nghĩa: <b style="color:var(--lg-ink,var(--text))">${escHtml(v.defVi)}</b> ${escHtml(v.pos)}</div>
        ${textInputHtml("Nhập từ điền vào chỗ trống...")}</div>`;
    }

    function smartHtml() {
      if (!studyQueue[0]._task) pickNextSmartItem();
      const v = studyQueue[0];
      switch (v._task) {
        case "intro": {
          const label = v._relearn ? `Đã xem lại ${vIcon("arrowRight", 15)}` : `Đã hiểu ${vIcon("arrowRight", 15)}`;
          return flashcardHtml(v, backHtml(v), `<button type="button" class="btn-flip green" onclick="introDone()">${label}</button>`);
        }
        case "mcq_en2vi": return quizHtml(v, "en2vi");
        case "mcq_vi2en": return quizHtml(v, "vi2en");
        case "listen_choice": return listenHtml(v, "choice");
        case "dictation": return listenHtml(v, "dictation");
        default: return clozeHtml(v);
      }
    }

    function matchHtml() {
      const tiles = cacheGet("tiles", () => {
        const t = [];
        studyQueue.slice(0, 6).forEach(w => {
          t.push({ id: w.id, html: `<b>${escHtml(w.word)}</b><br><span style="font-size:11.5px;color:var(--lg-ink-muted,var(--muted))">${escHtml(w.ipa)}</span>` });
          t.push({ id: w.id, html: escHtml((w.defVi || "").slice(0, 72)) });
        });
        return shuffle(t);
      });
      return `<div class="quiz-box"><b class="v-chip" style="color:var(--primary);">${vIcon("grid", 15)} Ghép cặp 6 thẻ từ ↔ nghĩa</b>
        <div class="match-grid" id="matchGrid">${tiles.map(t => `<div class="match-tile" data-pair="${escHtml(t.id)}" onclick="clickMatchTile(this)"><div>${t.html}</div></div>`).join("")}</div></div>`;
    }
    let matchSelected = null;
    function clickMatchTile(el) {
      if (el.classList.contains("matched")) return;
      if (!matchSelected) { matchSelected = el; el.classList.add("selected"); return; }
      if (matchSelected === el) { el.classList.remove("selected"); matchSelected = null; return; }
      const prev = matchSelected;
      matchSelected = null;
      if (prev.dataset.pair === el.dataset.pair) {
        prev.classList.remove("selected");
        prev.classList.add("matched"); el.classList.add("matched");
        const idx = studyQueue.findIndex(x => x.id === el.dataset.pair);
        if (idx !== -1) {
          const matchedId = studyQueue[idx].id;
          rateOnce(studyQueue[idx], 2);
          studyQueue.splice(idx, 1);
          sessionDone++;
          saveActiveSession([matchedId]);
        }
        if (!document.querySelector("#matchGrid .match-tile:not(.matched)")) {
          const serial = cardSerial;
          setTimeout(() => { if (serial === cardSerial) { bumpCard(); renderAll(); } }, 450);
        }
      } else {
        el.classList.add("error");
        setTimeout(() => { prev.classList.remove("selected"); el.classList.remove("error"); }, 450);
      }
    }

    function renderVocabListBodyHtml(words) {
      const q = searchQuery();
      let f = words;
      if (listFilter === "learned") f = words.filter(v => srsData[v.id] && !srsData[v.id].ignored);
      else if (listFilter === "ignored") f = words.filter(v => srsData[v.id] && srsData[v.id].ignored);
      else if (listFilter === "unseen") f = words.filter(v => !srsData[v.id]);
      const cnt = fn => words.filter(fn).length;
      const btn = (k, label) => `<button type="button" class="mode-btn ${listFilter === k ? "active" : ""}" onclick="setVocabListFilter('${k}')">${label}</button>`;
      const loadAllBtn = LOADED_LEVELS.size < 4
        ? `<button type="button" class="mode-btn" style="margin-left:auto;" onclick="loadAllForSearch()">${vIcon("layers", 13)} Tải đủ 4 chặng (${MANIFEST.total.toLocaleString("en-US")} từ)</button>`
        : "";
      const bar = `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        ${btn("all", `Tất cả (${words.length})`)}
        ${btn("unseen", `Chưa học (${cnt(v => !srsData[v.id])})`)}
        ${btn("learned", `Đã thuộc / Đang học (${cnt(v => srsData[v.id] && !srsData[v.id].ignored)})`)}
        ${btn("ignored", `Đã ẩn (${cnt(v => srsData[v.id] && srsData[v.id].ignored)})`)}
        ${q ? `<span class="v-chip" style="font-size:12px;color:var(--lg-ink-muted,var(--muted));font-weight:700;margin-left:auto;">${vIcon("search", 13)} Khớp ${f.length}/${LOADED_WORDS.length.toLocaleString("en-US")} từ đã nạp</span>` : loadAllBtn}
      </div>`;

      const rows = f.slice(0, listLimit).map(v => {
        const st = srsData[v.id];
        const safeId = escJsAttr(v.id);
        const status = st && st.ignored
          ? `<span class="badge-status ign">Đã ẩn</span> <button type="button" class="mode-btn" style="padding:3px 8px;font-size:11px;" onclick="unignoreWord('${safeId}')">${vIcon("refresh", 12)} Học lại</button>`
          : st ? `<span class="badge-status">Chu kỳ ${Math.max(1, Math.round(st.interval || 1))} ngày</span>`
          : `<button type="button" class="skip-known-btn" style="padding:3px 8px;font-size:11px;" onclick="markKnown('${safeId}')">${vIcon("check", 12)} Đã biết</button>`;
        const bookBadges = (v.books || []).map(b => `<span class="fc-book-badge">${escHtml(BOOK_LABELS[b] || b)}</span>`).join("");
        const metaChips = [
          (v.wf && v.wf.length) ? `<div class="fc-toeic-row" style="margin-top:6px;"><span class="fc-toeic-lbl">WF:</span>${v.wf.slice(0, 4).map(x => `<span class="fc-pill-wf">${escHtml(x)}</span>`).join("")}</div>` : "",
          (v.col && v.col.length) ? `<div class="fc-toeic-row"><span class="fc-toeic-lbl">Col:</span>${v.col.slice(0, 3).map(x => `<span class="fc-pill-col">${escHtml(x)}</span>`).join("")}</div>` : "",
          (v.syn && v.syn.length) ? `<div class="fc-toeic-row"><span class="fc-toeic-lbl">P7:</span>${v.syn.slice(0, 3).map(x => `<span class="fc-pill-syn">${escHtml(x)}</span>`).join("")}</div>` : ""
        ].join("");
        return `<div class="word-card"><div style="flex:1;min-width:220px;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-size:19px;font-weight:800;color:var(--primary);">${highlightText(v.word, q)}</span>
            <span style="color:var(--lg-ink-muted,var(--muted));font-weight:600;">${escHtml(v.pos)}</span>
            <span style="color:var(--danger);font-family:monospace;font-size:13.5px;">${escHtml(v.ipa)}</span>
            <button type="button" class="audio-pill" style="padding:2px 8px;font-size:11.5px;" onclick="playVocab('${safeId}','uk')">${vIcon("volume", 11)} UK</button>
            <button type="button" class="audio-pill" style="padding:2px 8px;font-size:11.5px;" onclick="playVocab('${safeId}','us')">${vIcon("volume", 11)} US</button>
            <button type="button" class="audio-pill is-au" style="padding:2px 8px;font-size:11.5px;" onclick="playVocab('${safeId}','au')">${vIcon("volume", 11)} AU</button>
            ${status}
          </div>
          ${bookBadges ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;">${bookBadges}<span class="fc-scene-stage">Chặng ${v.level}</span></div>` : ""}
          <div style="margin-top:7px;line-height:1.48;"><b>${highlightText(v.defVi, q)}</b>${v.defEn ? `<div style="font-size:12.5px;color:var(--lg-ink-muted,var(--muted));margin-top:2px;">${highlightText(v.defEn, q)}</div>` : ""}</div>
          ${v.examples && v.examples.length ? `<div style="margin-top:6px;font-size:13.2px;color:var(--success);line-height:1.5;">${exampleHtml(v.examples.slice(0, 1))}</div>` : ""}
          ${metaChips}
          ${v.trap ? `<div class="fc-trap-box" style="margin-top:7px;padding:6px 9px;font-size:12px;"><span class="fc-trap-ico">${vIcon("alert", 14)}</span><div><b>Bẫy TOEIC:</b> ${escHtml(v.trap)}</div></div>` : ""}
        </div>${v.localImg ? `<img class="word-card-img" loading="lazy" decoding="async" src="${escHtml(v.localImg)}" alt="" onerror="this.style.display='none'">` : ""}</div>`;
      }).join("");

      const more = f.length > listLimit ? `<button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;width:100%;" onclick="loadMoreVocabList()">Hiện thêm (${f.length - listLimit} từ)</button>` : "";
      const emptyHtml = q
        ? `<div class="s4-empty-state" style="margin-top:10px;">
            <div style="color:var(--lg-ink-muted,var(--muted));display:inline-flex;">${vIcon("search", 30)}</div>
            <div style="font-size:15px;font-weight:800;color:var(--lg-ink,var(--text));">Không tìm thấy từ vựng phù hợp</div>
            <div style="font-size:13px;">Từ khóa "<strong>${escHtml(q)}</strong>" không khớp trong các chặng đang mở.</div>
            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
              ${LOADED_LEVELS.size < 4 ? `<button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;" onclick="loadAllForSearch()">${vIcon("layers", 14)} Tải đủ 4 chặng để tìm</button>` : ""}
              <button type="button" class="btn-action" style="background:var(--lg-wash,var(--bg));color:var(--lg-ink,var(--text));border:1px solid var(--lg-hairline,var(--border));" onclick="clearVocabSearch()">${vIcon("close", 14)} Xóa tìm kiếm</button>
            </div>
          </div>`
        : '<div class="quiz-box center">Không có từ nào trong bộ lọc hiện tại.</div>';
      return bar + (rows || emptyHtml) + more;
    }

    function listHtml(words) {
      const q = searchQuery();
      return `<div class="list-search-row">
        <div class="list-search-field">
          <input id="inlineListSearchInput" type="text" class="list-search-input" value="${escHtml(q)}" placeholder="Tra cứu mờ từ vựng TOEIC (từ, nghĩa, collocation, bẫy)..." autocomplete="off" oninput="onInlineListSearch(this.value)">
          <button id="inlineListSearchClear" type="button" class="list-search-clear" style="display:${q ? "inline-flex" : "none"};" title="Xóa tìm kiếm" aria-label="Xóa tìm kiếm" onclick="clearVocabSearch(true)">${vIcon("close", 13)}</button>
        </div>
      </div>
      <div id="vocabListBody">${renderVocabListBodyHtml(words)}</div>`;
    }

    function renderLoadingCard(levels) {
      const host = $("cardHost");
      if (!host) return;
      host.innerHTML = `<div class="loading-card">
        <div style="color:var(--primary);display:inline-flex;margin-bottom:8px;">${vIcon("loader", 32, "lp-spin")}</div>
        <div style="font-size:15px;font-weight:800;">Đang nạp dữ liệu Chặng ${levels.join(", ")}...</div>
        <div style="font-size:12.5px;color:var(--lg-ink-muted,var(--muted));margin-top:4px;">Tối ưu bộ nhớ RAM — chỉ tải đúng chặng bạn cần học</div>
      </div>`;
    }

    function finishHtml(words) {
      const q = searchQuery();
      if (q && words.length === 0) {
        return `<div class="s4-empty-state" style="margin-top:14px;">
          <div style="color:var(--lg-ink-muted,var(--muted));display:inline-flex;">${vIcon("search", 32)}</div>
          <div style="font-size:16px;font-weight:800;">Không tìm thấy từ vựng phù hợp</div>
          <div style="font-size:13.5px;">Từ khóa "<strong>${escHtml(q)}</strong>" không khớp.</div>
          <button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;" onclick="clearVocabSearch()">${vIcon("close", 14)} Xóa tìm kiếm</button>
        </div>`;
      }
      const now = Date.now();
      const dueInScope = words.filter(v => isDueWord(v, now)).length;
      const totalDue = lastStats ? lastStats.due : dueInScope;
      const unseen = currentTopic === "ALL_DUE" ? 0 : words.filter(v => !srsData[v.id]).length;
      const hasLearned = words.some(v => srsData[v.id] && !srsData[v.id].ignored);
      return `<div class="finish-box"><div style="color:var(--success);display:inline-flex;">${vIcon("award", 44)}</div>
        <h2 style="margin:8px 0 0 0;color:var(--success);">${currentTopic === "ALL_DUE" ? "Đã ôn sạch từ đến hạn!" : (extraPracticeMode ? "Xong lượt ôn luyện!" : "Hoàn thành phiên học!")}</h2>
        ${sessionDone ? `<p style="color:var(--lg-ink-muted,var(--muted));margin:8px 0 0 0;">Đã xử lý ${sessionDone} từ vựng TOEIC</p>` : ""}
        <div class="finish-actions">
          ${!extraPracticeMode && (dueInScope > 0 || totalDue > 0) ? `<button type="button" class="btn-action" style="background:var(--danger);color:#fff;" onclick="startDueReview()">${vIcon("bell", 15)} Ôn ngay ${dueInScope || totalDue} từ đến hạn</button>` : ""}
          ${extraPracticeMode ? `<button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;" onclick="exitPractice()">Quay lại học chính</button>` : ""}
          ${!extraPracticeMode && unseen > 0 ? `<button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;" onclick="addBonusNewWords(10)">${vIcon("plus", 15)} Học thêm 10 từ mới</button>` : ""}
          ${currentTopic === "ALL_DUE" ? `<button type="button" class="btn-action" style="background:var(--primary-solid);color:#fff;" onclick="selectTopic('LEVEL_1')">${vIcon("graduation", 15)} Học từ mới Chặng 1</button>` : ""}
          ${hasLearned ? `<button type="button" class="btn-action" style="background:var(--success);color:#fff;" onclick="startFreePractice()">${vIcon("refresh", 15)} Ôn luyện thêm</button>` : ""}
          <button type="button" class="btn-action" style="background:var(--lg-wash,var(--bg));color:var(--lg-ink,var(--text));border:1px solid var(--lg-hairline,var(--border));" onclick="setMode('list')">${vIcon("reading", 15)} Danh sách từ</button>
        </div></div>`;
    }

    function sessionBarHtml() {
      const pct = sessionTotal ? Math.round((sessionDone / sessionTotal) * 100) : 0;
      const inProgress = !!sessionTopic && !extraPracticeMode && !searchQuery() &&
        (sessionDone > 0 || studyQueue.some(w => (w._mistakes || 0) > 0 || w._stage > (w._new ? 0 : 1)));
      return `<div class="sess-row">
        <span>
          ${extraPracticeMode ? "Ôn luyện tự do (không đổi lịch SRS)" : "Phiên học TOEIC"}
          ${extraPracticeMode ? ` <button type="button" class="skip-known-btn" onclick="exitPractice()">Thoát</button>` : ""}
          ${inProgress ? ` <button type="button" class="skip-known-btn" style="color:var(--danger);margin-left:4px;" onclick="restartSession()" title="Tạo phiên học mới">${vIcon("refresh", 12)} Phiên mới</button>` : ""}
        </span>
        <span>${sessionDone}/${sessionTotal}</span>
      </div>
      <div class="sess-bar"><i style="width:${pct}%"></i></div>`;
    }

    async function restartSession() {
      const msg = "Bỏ tiến trình dở dang của phiên này và tạo phiên mới?\n(Các từ đã học xong vẫn được giữ nguyên.)";
      const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
        ? await window.S4UI.confirm(msg, { title: "Tạo phiên học mới", tone: "warn", confirmText: "Tạo phiên mới" })
        : confirm(msg);
      if (!ok) return;
      clearActiveSession(sessionTopic || currentSessionKey(), studyQueue.map(w => w.id));
      buildStudyQueue(true, true);
      renderAll();
    }

    function renderMain() {
      document.body.classList.toggle("scroll-mode", currentMode === "list" || !!panel);
      renderStats();
      if (isLoadingChunks) return;
      const host = $("cardHost");
      if (currentMode === "list") { host.innerHTML = listHtml(getScopeWords()); return; }
      if (!studyQueue.length) { host.innerHTML = finishHtml(getScopeWords()); return; }
      const v = studyQueue[0];
      let html;
      switch (currentMode) {
        case "flashcard":
          html = isFlipped
            ? flashcardHtml(v, backHtml(v), `<div class="srs-buttons">
                <button type="button" class="srs-btn is-forget" onclick="rateBtn(0)"><span class="lp-srs-dot"></span><span>Quên</span><kbd class="lp-srs-kbd">1</kbd></button>
                <button type="button" class="srs-btn is-hard" onclick="rateBtn(1)"><span class="lp-srs-dot"></span><span>Khó</span><kbd class="lp-srs-kbd">2</kbd></button>
                <button type="button" class="srs-btn is-good" onclick="rateBtn(2)"><span class="lp-srs-dot"></span><span>Nhớ</span><kbd class="lp-srs-kbd">3</kbd></button>
                <button type="button" class="srs-btn is-easy" onclick="rateBtn(3)"><span class="lp-srs-dot"></span><span>Rất dễ</span><kbd class="lp-srs-kbd">4</kbd></button></div>`)
            : flashcardHtml(v, "", `<button type="button" class="btn-flip" onclick="flipCard()">Hiện nghĩa &amp; Phân tích TOEIC</button>`);
          break;
        case "smart": html = smartHtml(); break;
        case "quiz": html = quizHtml(v, quizDirection); break;
        case "listen": html = listenHtml(v, listenSubMode); break;
        case "match": html = matchHtml(); break;
        default: html = clozeHtml(v);
      }
      host.innerHTML = sessionBarHtml() + html;
      const inp = host.querySelector(".text-input");
      if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }
      autoPlayIfNeeded();
    }

    function renderAll() {
      lastStats = computeStats();
      renderSidebar();
      renderMain();
    }

    /* ---------- 16. Phím tắt ---------- */
    window.addEventListener("keydown", e => {
      const tag = e.target && e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (currentMode === "list" || !studyQueue.length) return;
      const key = e.key.toLowerCase();
      if (key === "x") { e.preventDefault(); ignoreCurrentWord(); return; }
      if (["1", "2", "3", "4"].includes(key)) {
        const opts = document.querySelectorAll("#cardHost .opt-btn");
        if (opts.length) { const b = opts[Number(key) - 1]; if (b) b.click(); return; }
      }
      if (currentMode === "smart" && (e.code === "Space" || e.key === "Enter") && studyQueue[0]._task === "intro") { e.preventDefault(); introDone(); return; }
      if (currentMode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); if (!isFlipped) flipCard(); }
        else if (isFlipped && ["1", "2", "3", "4"].includes(key)) advanceQueueWithQuality(Number(key) - 1);
      }
    });

    /* ---------- 17. Sao lưu / Khôi phục / Đặt lại ---------- */
    function exportProgress() {
      const data = {
        app: "linguapath-toeic-vocab",
        version: 1,
        exportedAt: new Date().toISOString(),
        srsData, dayLog, userSettings,
        activeSessions: readSessionMap()
      };
      const a = document.createElement("a");
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
      a.href = url;
      a.download = "LinguaPath_TOEIC_Vocab_Backup_" + getTodayStr() + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function importProgress(ev) {
      const f = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const obj = JSON.parse(r.result);
          if (!obj || !obj.srsData || typeof obj.srsData !== "object") throw new Error("invalid");
          const msg = "Tiến độ từ vựng TOEIC hiện tại sẽ bị thay bằng bản sao lưu. Tiếp tục?";
          const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
            ? await window.S4UI.confirm(msg, { title: "Khôi phục bản sao lưu", tone: "warn", confirmText: "Khôi phục" })
            : confirm(msg);
          if (!ok) return;
          srsData = {};
          Object.keys(obj.srsData).forEach(k => {
            if (/^toeic[1-4]_/.test(k) && obj.srsData[k] && typeof obj.srsData[k] === "object") {
              srsData[k] = obj.srsData[k];
            }
          });
          dayLog = obj.dayLog && typeof obj.dayLog === "object" ? obj.dayLog : {};
          userSettings = Object.assign({}, DEFAULT_SETTINGS, obj.userSettings || {});
          studyQueue = []; sessionTopic = ""; clearActiveSession();
          if (obj.activeSessions && typeof obj.activeSessions === "object" && !Array.isArray(obj.activeSessions)) {
            writeSessionMap(obj.activeSessions);
          }
          saveState();
          buildStudyQueue(true);
          renderAll();
          if (window.S4UI && typeof window.S4UI.toast === "function") window.S4UI.toast("success", "Đã khôi phục tiến độ từ vựng TOEIC.");
        } catch (e) {
          if (window.S4UI && typeof window.S4UI.alert === "function") window.S4UI.alert("File sao lưu không hợp lệ hoặc bị hỏng.", { title: "Lỗi đọc file", tone: "error" });
          else alert("File sao lưu không hợp lệ.");
        }
      };
      r.readAsText(f);
    }

    async function resetProgress() {
      const msg = "Xóa TOÀN BỘ tiến độ từ vựng TOEIC (từ đã học, lịch ôn SRS, lịch sử ngày, cài đặt)?\nNên bấm Sao lưu trước. Hành động này không thể hoàn tác.";
      const ok = (window.S4UI && typeof window.S4UI.confirm === "function")
        ? await window.S4UI.confirm(msg, { title: "Đặt lại tiến độ TOEIC", tone: "danger", confirmText: "Xóa tất cả" })
        : confirm(msg);
      if (!ok) return;
      [KEYS.srs, KEYS.days, KEYS.settings, KEYS.session].forEach(k => localStorage.removeItem(k));
      studyQueue = []; sessionTopic = "";
      srsData = {}; dayLog = {};
      userSettings = Object.assign({}, DEFAULT_SETTINGS);
      currentLevelFilter = "ALL";
      currentBookFilter = "ALL";
      currentTopic = "LEVEL_1";
      extraPracticeMode = false;
      await ensureLevelsLoaded([1]);
      buildStudyQueue(true);
      renderAll();
      if (window.S4UI && typeof window.S4UI.toast === "function") window.S4UI.toast("info", "Đã đặt lại tiến độ từ vựng TOEIC.");
    }

    /* ---------- 18. Tìm kiếm mờ S4SearchEngine ---------- */
    let searchTimer = null;
    async function loadAllForSearch() {
      await ensureLevelsLoaded([1, 2, 3, 4]);
      renderAll();
    }
    let searchBgLoading = false;
    function applyVocabSearchChange(fromInline) {
      const q = searchQuery();
      const inlineInp = $("inlineListSearchInput");
      const inlineClr = $("inlineListSearchClear");
      if (inlineInp && !fromInline && inlineInp.value !== $("searchWordInput").value) {
        inlineInp.value = $("searchWordInput").value;
      }
      if (inlineClr) inlineClr.style.display = q ? "inline-flex" : "none";

      if (q.length >= 2 && LOADED_LEVELS.size < 4 && !searchBgLoading) {
        searchBgLoading = true;
        ensureLevelsLoaded([1, 2, 3, 4], true).then(() => {
          searchBgLoading = false;
          if (searchQuery() && currentMode === "list") {
            const bodyEl = $("vocabListBody");
            if (bodyEl) bodyEl.innerHTML = renderVocabListBodyHtml(getScopeWords());
          }
        });
      }

      if (q && currentMode !== "list") {
        if (!modeBeforeSearch) modeBeforeSearch = currentMode;
        currentMode = "list";
        listFilter = "all";
        listLimit = 100;
        syncModeUi("list");
        buildStudyQueue();
        renderAll();
        return;
      }
      if (!q && !fromInline && modeBeforeSearch) {
        currentMode = modeBeforeSearch;
        modeBeforeSearch = "";
        syncModeUi(currentMode);
        buildStudyQueue();
        renderAll();
        return;
      }
      const body = $("vocabListBody");
      if (currentMode === "list" && body) {
        listLimit = 100;
        body.innerHTML = renderVocabListBodyHtml(getScopeWords());
      } else {
        buildStudyQueue();
        renderAll();
      }
    }

    /* ---------- 19. Theme & Smart Back Button ---------- */
    function syncVocabThemeBtn(isDarkOverride) {
      const btn = $("vocabThemeBtn");
      if (!btn) return;
      const isDark = typeof isDarkOverride === "boolean" ? isDarkOverride : document.documentElement.classList.contains("dark");
      if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
        window.S4UI.renderThemeButton(btn, isDark);
      } else {
        btn.innerHTML = isDark
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      }
    }
    function toggleDark() {
      if (window.toggleDarkModeOnly) {
        window.toggleDarkModeOnly();
      } else {
        const isDark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", isDark);
        document.body.classList.toggle("dark", isDark);
        localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0");
        const mt = $("metaThemeColor");
        if (mt) mt.setAttribute("content", isDark ? "#0d1813" : "#efe8d5");
      }
      syncVocabThemeBtn();
    }

    (function initChrome() {
      const d = localStorage.getItem("s4_vocab_dark");
      const isDark = !(d === "0" || d === "false");
      document.documentElement.classList.toggle("dark", isDark);
      document.body.classList.toggle("dark", isDark);
      syncVocabThemeBtn(isDark);
      const tBtn = $("vocabThemeBtn");
      if (tBtn) tBtn.addEventListener("click", toggleDark);
      if (typeof MutationObserver !== "undefined") {
        new MutationObserver(() => syncVocabThemeBtn()).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      }
      if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
        window.S4UI.initSmartBackButton({
          element: "#vocabBackBtn",
          defaultUrl: "../index.html",
          defaultLabel: "TOEIC",
          roadmapUrl: "../roadmap/index.html",
          roadmapLabel: "Lộ trình"
        });
      }
      if (window.S4UI && typeof window.S4UI.bindSearchBar === "function") {
        window.S4UI.bindSearchBar({
          input: "searchWordInput",
          clearBtn: "searchWordInput_clear",
          searchBtn: "searchWordInput_btn",
          delay: 180,
          onSearch: () => { clearTimeout(searchTimer); applyVocabSearchChange(false); }
        });
      } else if ($("searchWordInput")) {
        $("searchWordInput").oninput = () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => applyVocabSearchChange(false), 180);
        };
      }
    })();

    /* ---------- 20. Expose Handlers cho Inline Events ---------- */
    Object.assign(window, {
      toggleSidebar, setLevelFilter, setBookFilter, toggleLevelGroup, selectTopic,
      setMode, togglePanel, shiftCalMonth, setOpt, addBonusNewWords,
      startFreePractice, exitPractice, startDueReview, restartSession,
      playVocab, flipCard, rateBtn, introDone, ignoreCurrentWord, unignoreWord, markKnown,
      setQuizDir, setListenSub, answerChoice, scrollInputIntoOptimalView, onAnsInputEdit,
      handleAnsKeydown, checkText, giveUp, handleResult, clickMatchTile,
      exportProgress, importProgress, resetProgress, loadAllForSearch,
      setVocabListFilter: function (f) {
        listFilter = f; listLimit = 100;
        const body = $("vocabListBody");
        if (currentMode === "list" && body) body.innerHTML = renderVocabListBodyHtml(getScopeWords());
        else renderMain();
      },
      loadMoreVocabList: function () {
        listLimit += 100;
        const body = $("vocabListBody");
        if (currentMode === "list" && body) body.innerHTML = renderVocabListBodyHtml(getScopeWords());
        else renderMain();
      },
      onInlineListSearch: function (val) {
        const sideInp = $("searchWordInput");
        if (sideInp) {
          sideInp.value = String(val == null ? "" : val);
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(sideInp);
        }
        applyVocabSearchChange(true);
      },
      clearVocabSearch: function (keepInline) {
        const inp = $("searchWordInput");
        if (inp) {
          inp.value = "";
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
          if (!keepInline) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
        }
        const inlineInp = $("inlineListSearchInput");
        if (inlineInp) {
          inlineInp.value = "";
          if (keepInline) { try { inlineInp.focus({ preventScroll: true }); } catch (e) {} }
        }
        clearTimeout(searchTimer);
        if (keepInline) modeBeforeSearch = "";
        applyVocabSearchChange(!!keepInline);
      }
    });

    /* ---------- 21. Khởi động & Đọc Query Params ---------- */
    (async function boot() {
      let levelsToLoad = [1];
      try {
        const sp = new URLSearchParams(window.location.search);
        const lvParam = sp.get("level");
        const filterParam = (sp.get("filter") || "").toLowerCase();
        const topicParam = sp.get("topic");
        const bookParam = sp.get("book");
        const qParam = sp.get("q");
        const modeParam = sp.get("mode");

        if (lvParam && ["1", "2", "3", "4"].includes(lvParam)) {
          currentLevelFilter = lvParam;
          openLevels = new Set(["special", Number(lvParam)]);
          currentTopic = "LEVEL_" + lvParam;
          levelsToLoad = [Number(lvParam)];
        } else if (userSettings.lastTopic) {
          currentTopic = userSettings.lastTopic;
          if (currentTopic === "ALL") levelsToLoad = [1, 2, 3, 4];
          else if (currentTopic === "ALL_DUE") levelsToLoad = levelsNeededForDue("ALL");
          else {
            const lv = levelOfTopicKey(currentTopic);
            openLevels.add(lv);
            levelsToLoad = [lv];
          }
        }

        if (bookParam && MANIFEST.bookMap.has(bookParam)) {
          currentBookFilter = bookParam;
          levelsToLoad = Array.from(new Set(levelsToLoad.concat(levelsForBook(bookParam))));
        }

        if (topicParam) {
          const matched = MANIFEST.topics.find(t => t.key === topicParam || (t.id && t.id === topicParam) || t.name.toLowerCase() === topicParam.toLowerCase());
          if (matched) {
            currentTopic = matched.key;
            openLevels.add(matched.level);
            levelsToLoad = [matched.level];
          } else if (topicParam === "ALL" || topicParam === "ALL_DUE") {
            currentTopic = topicParam;
            levelsToLoad = topicParam === "ALL" ? [1, 2, 3, 4] : levelsNeededForDue(currentLevelFilter);
          }
        }

        if (filterParam === "due") {
          currentTopic = "ALL_DUE";
          levelsToLoad = levelsNeededForDue(currentLevelFilter);
        }

        if (qParam) {
          const inp = $("searchWordInput");
          if (inp) {
            inp.value = qParam;
            if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
          }
          currentMode = "list";
          listFilter = "all";
          levelsToLoad = [1, 2, 3, 4];
        } else if (modeParam && MODE_META[modeParam]) {
          currentMode = modeParam;
        }
      } catch (e) {}

      syncModeUi(currentMode);
      renderSidebar();
      renderStats();
      await ensureLevelsLoaded(levelsToLoad);
      buildStudyQueue();
      renderAll();
    })();
  })();
  </script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=27"></script>
</body>
</html>
