  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = !(d === "0" || d === "false");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
      function syncSafeTop() {
        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isPortrait = window.innerHeight >= window.innerWidth;
        var maxDim = Math.max(window.screen.height || 0, window.screen.width || 0);
        var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || (isIOS && isPortrait && Math.abs(window.innerHeight - maxDim) < 28);
        document.documentElement.style.setProperty("--s4-safe-top", (isIOS && isStandalone && isPortrait) ? (maxDim >= 812 ? "50px" : "24px") : "0px");
      }
      syncSafeTop();
      window.addEventListener("resize", syncSafeTop);
      window.addEventListener("orientationchange", function () { setTimeout(syncSafeTop, 80); });
    } catch (e) {}
  })();
  </script>

      margin-top: 2px;
    }
    .rm-skip-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: var(--lg-seg-track);
      color: var(--lg-ink-sub);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .rm-skip-btn:hover { background: var(--lg-wash-hover); color: var(--lg-ink); }
    .rm-skip-btn.active {
      background: var(--lg-green-soft);
      color: var(--lg-green);
    }

    .rm-skill-strip {
      border-radius: 20px;
      padding: 11px 14px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .rm-skill-cell {
      border: 1px solid transparent;
      background: var(--lg-wash);
      border-radius: 14px;
      padding: 9px 10px;
      text-align: left;
      font-family: inherit;
      color: var(--lg-ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.14s ease;
    }
    .rm-skill-cell:hover { background: var(--lg-wash-hover); border-color: var(--lg-hairline); transform: translateY(-1px); }
    .rm-skill-cell.is-lagging { border-color: rgba(217, 119, 6, 0.45); background: rgba(245, 158, 11, 0.10); }
    .rm-skill-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .rm-skill-name { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--lg-ink); }
    .rm-skill-pct { font-size: 12.5px; font-weight: 800; color: var(--lg-ink); }
    .rm-skill-sub { font-size: 10.5px; font-weight: 700; color: var(--lg-ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rm-skill-cell.is-lagging .rm-skill-sub { color: var(--lg-amber); }

    .rm-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: var(--lg-modal-backdrop, rgba(15, 23, 42, 0.36));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }
    .rm-modal-card {
      width: 100%;
      max-width: 600px;
      border-radius: 22px;
      padding: 18px;
      margin: auto;
      background: var(--lg-modal-surface, var(--lg-surface-strong));
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    .rm-pt-q {
      padding: 11px 12px;
      border-radius: 14px;
      background: var(--lg-wash);
    }
    .rm-pt-opt {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--lg-hairline);
      background: transparent;
      color: var(--lg-ink);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .rm-pt-opt:hover { background: var(--lg-wash-hover); }
    .rm-pt-opt.selected { border-color: var(--lg-accent); background: var(--lg-accent-soft); }

    @media (max-width: 760px) {
      .rm-seg-grid, .rm-focus-grid, .rm-tasks-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 580px) {
      .rm-brand-sub, .rm-hide-xs { display: none; }
      .rm-skill-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; border-radius: 18px; gap: 8px; }
      .rm-topbar { padding: 7px 9px; border-radius: 18px; }
      .rm-summary-strip { padding: 10px 4px; border-radius: 18px; }
      .rm-sum-num { font-size: 17.5px; }
      .rm-sum-lbl { font-size: 11px; }
      .rm-panel { padding: 14px; border-radius: 20px; }
      .rm-stage { border-radius: 20px; }
      .rm-stage-head { padding: 14px; }
      .rm-stage-bar-wrap { padding: 0 14px 12px; }
      .rm-stage-body { padding: 12px 14px 14px; }
    }
    @media (max-width: 390px) {
      .rm-seg-track { flex-wrap: wrap; }
      .rm-seg-btn { flex: 1 1 calc(50% - 4px); }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var FALLBACK_SVG = {
        vocab: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>',
        grammar: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/>',
        listening: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3Z"/>',
        reading: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
        mock: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        play: '<polygon points="6 4 20 12 6 20 6 4"/>',
        arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        chevronDown: '<path d="m6 9 6 6 6-6"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        sparkle: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
        volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'
      };

      var MODULE_ICON_MAP = {
        vocab: "vocab",
        grammar: "grammar",
        listening: "listening",
        reading: "reading",
        mock: "award"
      };

      function svgIcon(name, size) {
        var sz = size || 16;
        var mapped = MODULE_ICON_MAP[name] || name;
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          return window.S4UI.icon(mapped, sz);
        }
        var body = FALLBACK_SVG[name] || FALLBACK_SVG[mapped] || FALLBACK_SVG.sparkle;
        return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
      }

      var MODULE_FILTERS = [
        { id: "all", icon: "sparkle", label: "Tất cả" },
        { id: "vocab", icon: "vocab", label: "Từ vựng SRS" },
        { id: "grammar", icon: "grammar", label: "Ngữ pháp" },
        { id: "listening", icon: "listening", label: "Nghe P1–4" },
        { id: "reading", icon: "reading", label: "Đọc P5–7" },
        { id: "mock", icon: "mock", label: "Thi thử ETS" }
      ];

      var MODULE_STEP_MAP = {
        vocab: "Phân hệ Từ vựng TOEIC (Bước 2)",
        grammar: "Phân hệ Ngữ pháp TOEIC (Bước 3)",
        listening: "Phân hệ Luyện Nghe Part 1–4 (Bước 4)",
        reading: "Phân hệ Luyện Đọc Part 5–7 (Bước 5)",
        mock: "Phòng Thi Thử TOEIC 10–990 (Bước 6)"
      };

      var openStages = {};
      var userToggledStage = false;
      var activeModuleFilter = "all";

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function syncDarkIcon() {
        var btn = document.getElementById("rmDarkBtn");
        if (!btn) return;
        var isDark = document.documentElement.classList.contains("dark");
        if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn, isDark);
          return;
        }
        btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
        btn.title = isDark ? "Đang ở chế độ Tối — Bấm để chuyển sang Sáng" : "Đang ở chế độ Sáng — Bấm để chuyển sang Tối";
      }

      function toggleDarkMode() {
        if (window.toggleDarkModeOnly) {
          window.toggleDarkModeOnly();
        } else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          if (document.body) document.body.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
        }
        syncDarkIcon();
      }

      function notifyPendingModule(mod) {
        var label = MODULE_STEP_MAP[mod] || "Phân hệ này";
        var msg = label + " sẽ được mở khóa ở các bước triển khai kế tiếp.";
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast("info", msg);
        } else {
          alert(msg);
        }
      }

      function renderAll() {
        var data = window.LP_TOEIC_ROADMAP_DATA;
        var api = window.LPToeicRoadmap;
        if (!data || !api) return;

        var ev = api.evaluateRoadmap({ urlPrefix: "../../" });
        if (!ev) return;

        if (!userToggledStage && ev.activeStage) {
          openStages = {};
          openStages[ev.activeStage.id] = true;
        }

        document.getElementById("sumOverallPct").textContent = ev.overallPct + "%";
        document.getElementById("sumTasksDone").textContent = ev.completedTasks + " / " + ev.totalTasks + " học phần";
        document.getElementById("sumCurrentStage").textContent = ev.activeStage ? ("Chặng " + ev.activeStage.order) : "Hoàn tất";
        document.getElementById("sumStageLevel").textContent = ev.activeStage ? (ev.activeStage.levelRange + " • " + ev.activeStage.estWeeks) : "900+";
        document.getElementById("sumDueWords").textContent = ev.dueWordsTotal.toLocaleString("en-US");
        var dueLinkEl = document.getElementById("sumDueLink");
        if (dueLinkEl) {
          if (ev.dueTargetUrl) dueLinkEl.setAttribute("href", ev.dueTargetUrl);
          dueLinkEl.setAttribute("data-pending-mod", data.READY_MODULES.vocab === false ? "vocab" : "");
        }

        var skillStrip = document.getElementById("skillBreakdownStrip");
        if (skillStrip && ev.skillBreakdown && Array.isArray(ev.skillBreakdown.items)) {
          skillStrip.innerHTML = ev.skillBreakdown.items.map(function (it) {
            var lagCls = it.isLagging ? " is-lagging" : "";
            var sub = it.isLagging
              ? ("Cần ưu tiên • " + it.doneTasks + "/" + it.totalTasks + " phần")
              : (it.doneTasks + "/" + it.totalTasks + " học phần");
            return '<button type="button" class="rm-skill-cell' + lagCls + '" data-action="filter-mod" data-id="' + esc(it.key) + '" title="Lọc nhanh các học phần ' + esc(it.label) + '">'
              + '<div class="rm-skill-top">'
              + '  <span class="rm-skill-name">' + svgIcon(it.icon, 14) + '<span>' + esc(it.label) + '</span></span>'
              + '  <span class="rm-skill-pct">' + it.pct + '%</span>'
              + '</div>'
              + '<div class="rm-bar" style="height:4px;"><div class="rm-bar-fill" style="width:' + it.pct + '%;background:' + esc(it.color) + ';"></div></div>'
              + '<div class="rm-skill-sub">' + esc(sub) + '</div>'
              + '</button>';
          }).join("");
        }

        document.getElementById("startLevelChips").innerHTML = data.START_LEVELS.map(function (lv) {
          var act = lv.id === ev.state.startLevel ? " active" : "";
          return '<button type="button" class="rm-seg-btn' + act + '" data-action="start" data-id="' + esc(lv.id) + '">'
            + esc(lv.shortLabel || lv.label) + '<small>' + esc(lv.badge) + '</small></button>';
        }).join("");

        document.getElementById("paceChips").innerHTML = data.PACES.map(function (pc) {
          var act = pc.id === ev.state.pace ? " active" : "";
          return '<button type="button" class="rm-seg-btn' + act + '" data-action="pace" data-id="' + esc(pc.id) + '">'
            + esc(pc.label) + '<small>' + esc(pc.dailyDesc) + '</small></button>';
        }).join("");

        var ptSavedNote = "";
        try {
          var ptSaved = JSON.parse(localStorage.getItem(data.PLACEMENT_KEY) || "null");
          if (ptSaved && typeof ptSaved.score === "number" && ptSaved.recLabel) {
            ptSavedNote = ' • Đánh giá gần nhất: <b>' + ptSaved.score + '/10</b> (Gợi ý: <b>' + esc(ptSaved.recLabel) + '</b>).';
          }
        } catch (e) {}

        document.getElementById("prefDescNote").innerHTML = svgIcon("info", 15)
          + '<span>' + esc(ev.startLevel.desc)
          + (ev.activeStage ? (' Lịch tham khảo <b>Chặng ' + ev.activeStage.order + '</b>: <b>' + esc(ev.activeStage.estWeeks) + '</b> (' + esc(ev.pace.dailyDesc) + ').') : '')
          + ptSavedNote + '</span>';

        document.getElementById("focusStageLabel").textContent = ev.activeStage
          ? ("Chặng " + ev.activeStage.order + " • " + ev.activeStage.levelRange)

      function handleActionClick(e) {
        var pendLink = e.target && e.target.closest ? e.target.closest("[data-pending-mod]") : null;
        if (pendLink) {
          var pendMod = pendLink.getAttribute("data-pending-mod");
          if (pendMod) {
            e.preventDefault();
            notifyPendingModule(pendMod);
            return;
          }
        }
        var btn = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
        if (!btn) return;
        var action = btn.getAttribute("data-action");
        var id = btn.getAttribute("data-id") || "";
        var api = window.LPToeicRoadmap;
        var data = window.LP_TOEIC_ROADMAP_DATA;

        if (action === "start" && api) {
          api.setStartLevel(id);
          userToggledStage = false;
          renderAll();
        } else if (action === "pace" && api) {
          api.setPace(id);
          renderAll();
        } else if (action === "skip-task" && api) {
          api.toggleSkipTask(id);
          renderAll();
        } else if (action === "jump-stage") {
          userToggledStage = true;
          openStages[id] = true;
          renderAll();
          var el = document.getElementById("stageCard_" + id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (action === "filter-mod") {
          activeModuleFilter = id || "all";
          if (activeModuleFilter !== "all" && data) {
            userToggledStage = true;
            data.STAGES.forEach(function (s) { openStages[s.id] = true; });
          }
          renderAll();
        } else if (action === "toggle-stage") {
          userToggledStage = true;
          openStages[id] = !openStages[id];
          var card = document.getElementById("stageCard_" + id);
          if (card) card.classList.toggle("open", Boolean(openStages[id]));
          var toggleBtn = document.getElementById("btnToggleAllStages");
          if (toggleBtn && data) {
            var allOpen = data.STAGES.every(function (s) { return Boolean(openStages[s.id]); });
            toggleBtn.textContent = allOpen ? "Thu gọn" : "Mở tất cả";
          }
        }
      }

      document.addEventListener("click", handleActionClick);

      var darkBtnEl = document.getElementById("rmDarkBtn");
      if (darkBtnEl) darkBtnEl.addEventListener("click", toggleDarkMode);

      var donateBtnEl = document.getElementById("rmDonateBtn");
      if (donateBtnEl) {

      // Đánh giá đầu vào TOEIC nhanh (10 câu • ~5 phút • 3 giọng US/UK/AU + Part 5–7)

      function getToeicRecommendation(score) {
        if (score <= 3) return { levelId: "zero", label: "Chặng 1 • Mất gốc (0 → 350+)", note: "Nên bắt đầu từ Chặng 1 với 12 chuyên đề từ loại/thì cơ bản, 800 từ tả tranh Part 1 và nghe chậm 0.75x." };
        if (score <= 5) return { levelId: "basic", label: "Chặng 2 • Nền tảng (~350 → 550+)", note: "Bạn đã có nền cơ bản; phù hợp đi từ Chặng 2 (600 Essential Words, Part 2 hỏi–đáp, Part 6 & Part 7 đoạn đơn)." };
        if (score <= 8) return { levelId: "intermediate", label: "Chặng 3 • Trung cấp (~550 → 750+)", note: "Nền tảng khá tốt! Hãy vào Chặng 3 luyện Part 3–4 hội thoại/bài nói, Part 7 đoạn kép và Full Test." };
        return { levelId: "advanced", label: "Chặng 4 • Bứt phá (~750 → 900+)", note: "Trình độ rất tốt! Phù hợp luyện đảo ngữ/giả định, bẫy Part 2 gián tiếp, Part 7 ba đoạn và Full Test mốc 900+." };
      }

      function playPlacementSample(text, accent) {
        if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
          window.S4UI.speakEnglish(text, accent || "en-US");
          return;
        }
        if (typeof speechSynthesis !== "undefined") {
          try {
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = accent || "en-US";
            u.rate = 0.95;
            speechSynthesis.speak(u);
          } catch (e) {}
        }
      }

      function renderPlacementModal() {
        var body = document.getElementById("placementBody");
        if (!body) return;
        var data = window.LP_TOEIC_ROADMAP_DATA;
        if (ptSubmitted) {
          var score = 0;
          var byGroup = {};
          TOEIC_PLACEMENT_QS.forEach(function (q) {
            if (!byGroup[q.group]) byGroup[q.group] = { ok: 0, total: 0 };
            byGroup[q.group].total++;
            if (ptAns[q.id] === q.ans) { score++; byGroup[q.group].ok++; }
          });
          var rec = getToeicRecommendation(score);
          try {
            localStorage.setItem((data && data.PLACEMENT_KEY) || "lp_toeic_placement_v1", JSON.stringify({
              score: score, total: TOEIC_PLACEMENT_QS.length, recLevel: rec.levelId, recLabel: rec.label, at: new Date().toISOString()
            }));
          } catch (e) {}
          var grpHtml = Object.keys(byGroup).map(function (g) {
            return '<span class="rm-badge" style="padding:4px 9px;">' + esc(g) + ': ' + byGroup[g].ok + '/' + byGroup[g].total + '</span>';
          }).join("");
          body.innerHTML = '<div class="rm-pt-q" style="margin-bottom:12px;">'
            + '<div style="font-size:18px;font-weight:800;color:var(--lg-accent);">Kết quả: ' + score + '/' + TOEIC_PLACEMENT_QS.length + ' câu đúng</div>'
            + '<div style="font-size:14px;font-weight:800;color:var(--lg-ink);margin-top:4px;">Gợi ý xuất phát điểm: ' + esc(rec.label) + '</div>'
            + '<p style="margin:6px 0 8px;font-size:12.5px;color:var(--lg-ink-sub);line-height:1.45;">' + esc(rec.note) + '</p>'
            + '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + grpHtml + '</div>'
            + '</div>'
            + '<p style="margin:0 0 12px;font-size:12px;color:var(--lg-ink-muted);">Toàn bộ 4 chặng TOEIC luôn mở tự do — gợi ý này chỉ giúp xếp đúng điểm xuất phát và bạn có thể đổi bất cứ lúc nào.</p>'
            + '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">'

            + '  <button type="button" class="rm-cta-btn" id="btnApplyPlacement" style="border:none;cursor:pointer;" data-rec-level="' + esc(rec.levelId) + '">Áp dụng gợi ý ngay</button>'
            + '</div>';
          var retryB = document.getElementById("btnRetryPlacement");
          if (retryB) retryB.addEventListener("click", function () { ptAns = {}; ptSubmitted = false; renderPlacementModal(); });
          var applyB = document.getElementById("btnApplyPlacement");
          if (applyB) applyB.addEventListener("click", function () { window.__toeicPtApply(rec.levelId); });
          return;
        }

        var answered = Object.keys(ptAns).length;
        body.innerHTML = '<p style="margin:0 0 10px;font-size:12.5px;color:var(--lg-ink-muted);">Bài test tùy chọn gồm 10 câu (có đủ 3 giọng Nghe Mỹ/Anh/Úc &amp; Part 5–7) giúp gợi ý chặng xuất phát. <b>Không khóa bài học nào</b>. Đã chọn: <b>' + answered + '/' + TOEIC_PLACEMENT_QS.length + '</b>.</p>'
          + '<div style="display:grid;gap:10px;">' + TOEIC_PLACEMENT_QS.map(function (q, i) {
            var playBtn = q.audioText
              ? '<button type="button" class="rm-ghost-btn" data-tpt-play="' + i + '" style="flex-shrink:0;">' + svgIcon("volume", 13) + '<span>Nghe mẫu</span></button>'

              + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">'

              + '  <div style="font-size:13px;font-weight:800;color:var(--lg-ink);line-height:1.4;">' + esc(q.prompt) + '</div></div>'
              +    playBtn
              + '</div>'
              + '<div style="display:grid;gap:6px;">' + q.opts.map(function (op, oi) {
                var sel = ptAns[q.id] === oi ? " selected" : "";
                return '<button type="button" class="rm-pt-opt' + sel + '" data-tpt-q="' + esc(q.id) + '" data-tpt-opt="' + oi + '">' + esc(op) + '</button>';
              }).join("") + '</div></div>';
          }).join("") + '</div>'
          + '<div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;">'
          + '  <button type="button" class="rm-cta-btn" id="btnSubmitPlacement" style="border:none;cursor:pointer;">Chấm điểm &amp; xem gợi ý</button>'
          + '</div>';

        body.querySelectorAll("[data-tpt-play]").forEach(function (b) {
          b.addEventListener("click", function () {
            var q = TOEIC_PLACEMENT_QS[Number(b.getAttribute("data-tpt-play"))];
            if (q && q.audioText) playPlacementSample(q.audioText, q.audioAccent);
          });
        });
        body.querySelectorAll("[data-tpt-q]").forEach(function (b) {
          b.addEventListener("click", function () {
            ptAns[b.getAttribute("data-tpt-q")] = Number(b.getAttribute("data-tpt-opt"));
            renderPlacementModal();
          });
        });
        var subB = document.getElementById("btnSubmitPlacement");
        if (subB) subB.addEventListener("click", function () { ptSubmitted = true; renderPlacementModal(); });
      }

      var releasePlacementFocus;
      window.__toeicOpenPlacement = function () {
        ptAns = {};
        ptSubmitted = false;
        var m = document.getElementById("placementModal");
        if (m) m.style.display = "flex";
        renderPlacementModal();
        if (!releasePlacementFocus && m && window.S4UI && window.S4UI.keepDialogFocus) {
          releasePlacementFocus = window.S4UI.keepDialogFocus(m);
        }
      };
      window.__toeicClosePlacement = function () {
        var m = document.getElementById("placementModal");
        if (m) m.style.display = "none";
        if (releasePlacementFocus) releasePlacementFocus();
        releasePlacementFocus = null;
      };
      window.__toeicPtApply = function (levelId) {
        if (window.LPToeicRoadmap) window.LPToeicRoadmap.setStartLevel(levelId);
        userToggledStage = false;
        window.__toeicClosePlacement();
        renderAll();
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast("success", "Đã áp dụng chặng xuất phát TOEIC theo kết quả đánh giá đầu vào.");
        }
      };

      var openPtBtn = document.getElementById("btnOpenPlacement");
      if (openPtBtn) openPtBtn.addEventListener("click", window.__toeicOpenPlacement);
      var closePtBtn = document.getElementById("btnClosePlacement");
      if (closePtBtn) closePtBtn.addEventListener("click", window.__toeicClosePlacement);
      var ptModalEl = document.getElementById("placementModal");
      if (ptModalEl) {
        ptModalEl.addEventListener("click", function (ev) {
          if (ev.target === ptModalEl) window.__toeicClosePlacement();
        });
      }
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") window.__toeicClosePlacement();
      });

      syncDarkIcon();
      renderAll();
      if (typeof MutationObserver !== "undefined") {
        new MutationObserver(syncDarkIcon).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      }
      window.addEventListener("pageshow", function () { syncDarkIcon(); renderAll(); });
      window.addEventListener("focus", renderAll);
      window.addEventListener("storage", renderAll);
    })();
  </script>
  <script src="../../assets/ghibli/ghibli-theme.js?v=27"></script>
</body>
