      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lg-accent), var(--teal));
      transition: width 0.22s ease;
    }

    /* ---------------- TIPS & MODE STRIP ---------------- */
    .listen-tip-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 15px;
      background: var(--lg-wash);
      border-left: 3.5px solid var(--lg-accent);
      margin-bottom: 14px;
    }
    .listen-tip-ico {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .listen-tip-lbl {
      font-size: 10.8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: var(--lg-accent);
      margin-bottom: 2px;
    }
    .listen-tip-text {
      font-size: 13.6px;
      font-weight: 600;
      line-height: 1.52;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }

    .ets-mode-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 13px;
      border-radius: 14px;
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      margin-bottom: 15px;
    }
    .ets-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.6px;
      font-weight: 800;
      color: var(--lg-ink);
    }
    .ets-mode-badge svg { color: var(--lg-accent); flex-shrink: 0; }
    .ets-mode-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    /* ---------------- SCORE BANNER ---------------- */
    .score-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 13.8px;
      font-weight: 800;
      line-height: 1.48;
    }
    .score-banner.is-pass {
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid rgba(22, 163, 74, 0.36);
    }
    .score-banner.is-retry {
      background: var(--err-soft);
      color: var(--err);
      border: 1px solid rgba(220, 38, 38, 0.34);
    }

    /* ---------------- SHARED ITEM CARDS ---------------- */
    .drill-list { display: flex; flex-direction: column; gap: 13px; }
    .drill-card {
      background: var(--lg-wash);
      border: 1px solid var(--lg-divider);
      border-radius: 18px;
      padding: 15px 16px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
      min-width: 0;
    }
    .drill-card.is-speaking {
      border-color: var(--lg-accent);
      box-shadow: 0 0 0 2px var(--lg-accent-soft);
    }
    .drill-card.is-graded-right { border-color: rgba(22, 163, 74, 0.48); }
    .drill-card.is-graded-wrong { border-color: rgba(220, 38, 38, 0.44); }

    .drill-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 11px;
    }
    .drill-card-head-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }
    .q-num-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-size: 12px;
      font-weight: 800;
    }
    .accent-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--info-soft);
      color: var(--info);
      font-size: 11px;
      font-weight: 800;
    }
    .qtype-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--violet-soft);
      color: var(--violet);
      font-size: 11px;
      font-weight: 800;
    }

    /* ---------------- MODE 1: DICTATION ---------------- */
    .dict-sentence-wrap {
      font-size: 15.5px;
      line-height: 2.15;
      font-weight: 600;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .dict-blank-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      vertical-align: baseline;
      margin: 0 2px;
    }
    .dict-input {
      padding: 3px 8px;
      border-radius: 8px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink);
      font-size: 14.5px;
      font-weight: 700;
      min-width: 74px;
      max-width: 100%;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .dict-input:focus {
      border-color: var(--lg-accent);
      box-shadow: 0 0 0 2px var(--lg-accent-soft);
    }
    .dict-input.is-correct {
      border-color: #16a34a;
      background: var(--ok-soft);
      color: var(--ok);
    }
    .dict-input.is-wrong {
      border-color: #dc2626;
      background: var(--err-soft);
      color: var(--err);
    }
    .dict-ans-chip {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 6px;
      background: var(--ok-soft);
      color: var(--ok);
      font-size: 12.5px;
      font-weight: 800;
    }
    .dict-reveal-box {
      margin-top: 11px;
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .dict-full-en {
      font-size: 14.6px;
      font-weight: 700;
      line-height: 1.62;
      color: var(--lg-ink);
    }
    .dict-full-vi {
      font-size: 13.3px;
      color: var(--lg-ink-sub);
      line-height: 1.5;
    }
    .dict-phonetic-tip {
      font-size: 12.5px;
      color: var(--teal);
      font-weight: 700;
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin-top: 2px;
      line-height: 1.45;
    }

    /* ---------------- MODE 2: PART 1 PHOTO ---------------- */
    .p1-img-wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 14px;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid var(--lg-hairline);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    html.dark .p1-img-wrap {
      background: rgba(248, 250, 252, 0.95);
    }
    .p1-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 480 / 280;
      object-fit: contain;
    }

    /* ---------------- ETS BLIND BUBBLES (PART 1 & PART 2) ---------------- */
    .ets-blind-prompt {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border-radius: 12px;
      background: var(--lg-surface);
      border: 1px dashed var(--lg-hairline);
      font-size: 13px;
      font-weight: 700;
      color: var(--lg-ink-sub);
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .ets-blind-prompt svg { color: var(--lg-accent); flex-shrink: 0; }

    .ets-bubble-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 6px 0;
    }
    .ets-bubble-btn {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: 2px solid var(--lg-hairline);
      background: var(--lg-surface);
      color: var(--lg-ink);
      font-size: 16.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .ets-bubble-btn:hover:not(:disabled) {
      border-color: var(--lg-accent);
      transform: translateY(-2px);
    }
    .ets-bubble-btn:active:not(:disabled) { transform: scale(0.95); }
    .ets-bubble-btn.selected {
      background: var(--lg-accent);
      border-color: var(--lg-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.32);
    }
    .ets-bubble-btn.correct {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }
    .ets-bubble-btn.wrong {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    /* ---------------- REVEALED OPTIONS (PART 1 & 2) ---------------- */
    .p2-q-reveal {
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .p2-q-en {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.55;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .p2-q-vi {
      font-size: 13px;
      color: var(--lg-ink-sub);
      margin-top: 3px;
      line-height: 1.45;
    }

    .revealed-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rev-opt-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-surface);
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .rev-opt-row.is-clickable { cursor: pointer; }
    .rev-opt-row.is-clickable:hover { border-color: var(--lg-accent); }
    .rev-opt-row.selected {
      border-color: var(--lg-accent);
      background: var(--lg-accent-soft);
    }
    .rev-opt-row.correct {
      border-color: #16a34a !important;
      background: var(--ok-soft) !important;
    }
    .rev-opt-row.wrong {
      border-color: #dc2626 !important;
      background: var(--err-soft) !important;
    }
    .rev-opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: none;
      background: var(--lg-seg-track);
      color: var(--lg-ink);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .rev-opt-row.selected .rev-opt-letter { background: var(--lg-accent); color: #fff; }
    .rev-opt-row.correct .rev-opt-letter { background: #16a34a; color: #fff; }
    .rev-opt-row.wrong .rev-opt-letter { background: #dc2626; color: #fff; }
    .rev-opt-body { flex: 1; min-width: 0; }
    .rev-opt-en {
      font-size: 14.2px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .rev-opt-vi {
      font-size: 12.8px;
      color: var(--lg-ink-sub);
      margin-top: 2px;
      line-height: 1.45;
    }

    .mini-spk-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .mini-spk-btn:hover { background: var(--lg-accent); color: #fff; border-color: transparent; }

    /* ---------------- MODE 3 & 4: PART 3 & PART 4 GROUPS ---------------- */
    .group-card {
      background: var(--lg-wash);
      border: 1px solid var(--lg-hairline);
      border-radius: 20px;
      padding: 16px 17px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-width: 0;
      max-width: 100%;
    }
    .group-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .group-title-wrap { min-width: 0; flex: 1 1 240px; }
    .group-title {
      margin: 0;
      font-size: 15.8px;
      font-weight: 800;
      color: var(--lg-ink);
      line-height: 1.38;
      overflow-wrap: anywhere;
    }
    .group-turn-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--lg-ink-muted);
      margin-top: 3px;
    }
    .group-prog-bar {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: var(--lg-bar-track);
      overflow: hidden;
      margin-top: -4px;
    }
    .group-prog-fill {
      height: 100%;
      width: 0%;
      background: var(--lg-accent);
      transition: width 0.2s ease;
    }

    /* Graphic Table Card (Mobile 360px safe scroll!) */
    .graphic-card {
      border-radius: 15px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-hairline);
      padding: 12px 14px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .graphic-card-head {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--lg-accent);
    }
    .graphic-table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 11px;
      border: 1px solid var(--lg-divider);
    }
    .graphic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 300px;
    }
    .graphic-table th, .graphic-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--lg-divider);
      line-height: 1.45;
      vertical-align: top;
    }
    .graphic-table th {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      font-weight: 800;
      white-space: nowrap;
    }
    .graphic-table tbody tr:nth-child(even) td {
      background: var(--lg-wash);
    }
    .graphic-table tbody tr:last-child td { border-bottom: none; }
    .graphic-note {
      margin-top: 7px;
      font-size: 12px;
      color: var(--lg-ink-muted);
      font-style: italic;
    }

    /* Transcript Box (Part 3 & 4) */
    .transcript-locked {
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--lg-surface);
      border: 1px dashed var(--lg-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.8px;
      color: var(--lg-ink-sub);
      font-weight: 600;
    }
    .transcript-box {
      border-radius: 15px;
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .transcript-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.2px;
      font-weight: 800;
      color: var(--teal);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--lg-divider);
    }
    .turn-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8px 9px;
      border-radius: 11px;
      background: var(--lg-wash);
      border: 1px solid transparent;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .turn-row.is-speaking {
      border-color: var(--lg-accent);
      background: var(--lg-accent-soft);
    }
    .turn-spk-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 62px;
      flex-shrink: 0;
    }
    .turn-spk-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .turn-spk-pill.is-m { background: var(--info-soft); color: var(--info); }
    .turn-spk-pill.is-w { background: var(--rose-soft); color: var(--rose); }
    .turn-spk-pill.is-m2 { background: var(--violet-soft); color: var(--violet); }
    .turn-spk-pill.is-n { background: var(--lg-accent-soft); color: var(--lg-accent); }
    .turn-body { flex: 1; min-width: 0; }
    .turn-en {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.58;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .turn-vi {
      font-size: 12.8px;
      color: var(--lg-ink-sub);
      margin-top: 3px;
      line-height: 1.48;
      overflow-wrap: anywhere;
    }

    /* Part 3/4 Question Cards */
    .p34-q-list { display: flex; flex-direction: column; gap: 10px; }
    .p34-q-card {
      background: var(--lg-surface);
      border: 1px solid var(--lg-divider);
      border-radius: 14px;
      padding: 13px 14px;
    }
    .p34-q-card.is-graded-right { border-color: rgba(22, 163, 74, 0.45); }
    .p34-q-card.is-graded-wrong { border-color: rgba(220, 38, 38, 0.42); }
    .quiz-q-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .quiz-q-text {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .quiz-opts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .q-opt {
      width: 100%;
      text-align: left;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1.5px solid var(--lg-hairline);
      background: var(--lg-wash);
      color: var(--lg-ink);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.42;
      overflow-wrap: anywhere;
      transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .q-opt:hover:not(:disabled) { border-color: var(--lg-accent); background: var(--lg-wash-hover); }
    .q-opt:disabled { cursor: default; }
    .q-opt-letter {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--lg-seg-track);
      color: var(--lg-ink-sub);
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .q-opt.selected {
      border-color: var(--lg-accent);
      background: var(--lg-accent-soft);
      font-weight: 700;
    }
    .q-opt.selected .q-opt-letter { background: var(--lg-accent); color: #fff; }
    .q-opt.correct {
      border-color: #16a34a !important;
      background: var(--ok-soft) !important;
      color: var(--ok) !important;
      font-weight: 800;
    }
    .q-opt.correct .q-opt-letter { background: #16a34a; color: #fff; }
    .q-opt.wrong {
      border-color: #dc2626 !important;
      background: var(--err-soft) !important;
      color: var(--err) !important;
      font-weight: 700;
    }
    .q-opt.wrong .q-opt-letter { background: #dc2626; color: #fff; }

    /* Explanation Box */
    .q-exp-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 11px;
      background: var(--lg-wash);
      border-left: 3.5px solid var(--lg-accent);
      font-size: 13.2px;
      line-height: 1.56;
      color: var(--lg-ink);
      overflow-wrap: anywhere;
    }
    .q-exp-box.is-ok { border-left-color: #16a34a; }
    .q-exp-box.is-err { border-left-color: #dc2626; }
    .q-exp-head {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .q-exp-box.is-ok .q-exp-head { color: var(--ok); }
    .q-exp-box.is-err .q-exp-head { color: var(--err); }

    /* ---------------- TAP-TO-LOOKUP WORDS & POPUP ---------------- */
    .tap-word {
      display: inline;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 1px;
      border-bottom: 1px dotted rgba(180, 83, 9, 0.36);
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    html.dark .tap-word { border-bottom-color: rgba(245, 158, 11, 0.42); }
    .tap-word:hover, .tap-word:focus-visible, .tap-word.is-active {
      background: var(--lg-accent-soft);
      color: var(--lg-accent);
      border-bottom-color: var(--lg-accent);
      outline: none;
    }

    .dict-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10300;
      background: var(--lg-modal-backdrop, rgba(15, 23, 42, 0.38));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .dict-backdrop.open { display: flex; }
    .dict-sheet {
      width: 100%;
      max-width: 470px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 18px 18px 20px;

  <script>
    (function () {
      "use strict";

      var DONE_KEY = "lp_toeic_listening_done_v1";
      var LAST_KEY = "lp_toeic_listening_last_v1";
      var DAYS_KEY = "lp_toeic_vocab_days_v1";
      var LETTERS = ["A", "B", "C", "D"];
      var SPEED_OPTIONS = [0.75, 1.0, 1.15, 1.25];

      var LEVEL_META = {
        1: { label: "0–350", title: "Chặng 1 • Lấy gốc Dictation & Part 1 (0–350)", shortName: "Chặng 1 • 0–350" },
        2: { label: "350–550", title: "Chặng 2 • Part 2 Hỏi–Đáp chuẩn ETS (350–550)", shortName: "Chặng 2 • 350–550" },
        3: { label: "550–750", title: "Chặng 3 • Part 3 Hội thoại & Part 4 Bài nói (550–750)", shortName: "Chặng 3 • 550–750" },
        4: { label: "750–990", title: "Chặng 4 • Bẫy Gián tiếp & Nghe nhanh 1.2x (750–990)", shortName: "Chặng 4 • 750–990" }
      };

      var PART_FILTERS = [
        { id: "all", label: "Tất cả" },
        { id: "dictation", label: "Dictation" },
        { id: "part1", label: "Part 1" },
        { id: "part2", label: "Part 2" },
        { id: "part3", label: "Part 3" },
        { id: "part4", label: "Part 4" }
      ];

      var ACCENT_LABELS = {
        "en-US": "US",
        "en-GB": "UK",
        "en-AU": "AU"
      };

      var MANIFEST = window.LP_TOEIC_LISTENING_MANIFEST || { lessons: [] };
      var ALL_LESSONS = Array.isArray(MANIFEST.lessons) ? MANIFEST.lessons.slice() : [];
      ALL_LESSONS.sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });

      var drillCache = new Map();
      var fetchSeq = 0;

      // App State
      var completedMap = safeReadJson(DONE_KEY, {});
      var currentLevelFilter = 0; // 0 = All, 1..4
      var currentPartFilter = "all";
      var currentSearchQuery = "";
      var openLevels = new Set([1]);
      var activeId = "";
      var activeDrill = null;
      var activeRate = 1.0;
      var accentOverride = "auto"; // "auto" | "en-US" | "en-GB" | "en-AU"

      // Exercise State (reset per lesson)
      var answers = {};          // key -> selected index (number)
      var dictInputs = {};       // "itemIdx:blankIdx" -> string
      var dictHinted = {};       // "itemIdx:blankIdx" -> boolean
      var graded = false;
      var transcriptVisible = false;

      // DOM refs
      var listEl = document.getElementById("lessonList");
      var contentEl = document.getElementById("lessonContent");
      var searchInput = document.getElementById("searchInput");
      var sidebarEl = document.getElementById("sidebar");
      var levelTabsEl = document.getElementById("levelTabs");
      var partTabsEl = document.getElementById("partTabs");

      function safeReadJson(key, fb) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fb;
          var parsed = JSON.parse(raw);
          return parsed !== null && typeof parsed === "object" ? parsed : fb;
        } catch (e) { return fb; }
      }

      function esc(str) {
        if (window.S4UI && typeof window.S4UI.escapeHtml === "function") {
          return window.S4UI.escapeHtml(str);
        }
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function svgIcon(name, size) {
        if (window.S4UI && typeof window.S4UI.icon === "function") {
          return window.S4UI.icon(name, size || 15);
        }
        return "";
      }

      function pad2(n) {
        var v = Number(n) || 0;
        return v < 10 ? "0" + v : String(v);
      }

      function showToast(type, msg, duration) {
        if (window.S4UI && typeof window.S4UI.toast === "function") {
          window.S4UI.toast({ type: type || "info", message: String(msg || ""), duration: duration || 2200 });
        }
      }

      function normalizeAccent(raw) {
        var s = String(raw || "en-US").toLowerCase().replace("_", "-");
        if (s.indexOf("gb") !== -1 || s === "uk") return "en-GB";
        if (s.indexOf("au") !== -1 || s === "au") return "en-AU";
        return "en-US";
      }

      function accentShort(raw) {
        return ACCENT_LABELS[normalizeAccent(raw)] || "US";
      }

      function snapSpeedOption(rate) {
        var r = Number(rate) || 1.0;
        if (r <= 0.87) return 0.75;
        if (r <= 1.07) return 1.0;
        if (r < 1.2) return 1.15;
        return 1.25;
      }

      function cleanOptionText(raw) {
        return String(raw == null ? "" : raw).replace(/^\s*\(?[A-D]\)?[.):]\s+/i, "").trim();
      }

      function wrapTapWords(rawText) {
        var str = String(rawText == null ? "" : rawText);
        if (!str) return "";
        var re = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
        var out = "";
        var lastIdx = 0;
        var m;
        while ((m = re.exec(str)) !== null) {
          if (m.index > lastIdx) {
            out += esc(str.slice(lastIdx, m.index));
          }
          var token = m[0];
          var norm = token.toLowerCase().replace(/’/g, "'");
          out += '<span class="tap-word" data-word="' + esc(norm) + '" role="button" tabindex="0">' + esc(token) + '</span>';
          lastIdx = m.index + token.length;
        }
        if (lastIdx < str.length) {
          out += esc(str.slice(lastIdx));
        }
        return out;
      }

      function normalizeDictWord(raw) {
        return String(raw == null ? "" : raw)
          .toLowerCase()
          .replace(/[’‘`]/g, "'")
          .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
          .trim();
      }

      function normalizeBlankAnswer(raw) {
        return String(raw == null ? "" : raw)
          .toLowerCase()
          .replace(/[’‘`]/g, "'")
          .replace(/[.,!?;:"()]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      /* ---------------- THEME & SIDEBAR CONTROLS ---------------- */
      function syncDarkBtn() {
        var btn = document.getElementById("btnListenDark");
        if (!btn) return;
        var isDark = document.documentElement.classList.contains("dark");
        if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
          window.S4UI.renderThemeButton(btn, isDark);
        } else {
          btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
        }
      }

      window.toggleDark = function () {
        if (typeof window.toggleDarkModeOnly === "function") {
          window.toggleDarkModeOnly();
        } else {
          var isDark = !document.documentElement.classList.contains("dark");
          document.documentElement.classList.toggle("dark", isDark);
          if (document.body) document.body.classList.toggle("dark", isDark);
          try { localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0"); } catch (e) {}
          var s = localStorage.getItem("s4_theme_style") || "ghibli";
          var mt = document.getElementById("metaThemeColor");
          if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0b1120") : (s === "ghibli" ? "#efe8d5" : "#eaf1fb"));
        }
        syncDarkBtn();
      };

      window.toggleMenu = function (open) {
        if (window.S4UI && typeof window.S4UI.toggleSidebar === "function") {
          var opened = window.S4UI.toggleSidebar(typeof open === "boolean" ? open : undefined);
          var isMobile = window.innerWidth <= 1024;
          document.body.classList.toggle("sidebar-open", isMobile && opened);
          var mw = document.querySelector(".main-wrap");
          if (mw && "inert" in mw) mw.inert = isMobile && opened;
          return opened;
        }
        var isOpen = Boolean(open) && window.innerWidth <= 1024;
        if (sidebarEl) sidebarEl.classList.toggle("open", isOpen);
        document.body.classList.toggle("sidebar-open", isOpen);
        var bd = document.getElementById("sidebarBackdrop");
        if (bd) bd.classList.toggle("open", isOpen);
        var mw2 = document.querySelector(".main-wrap");
        if (mw2 && "inert" in mw2) mw2.inert = isOpen;
        return isOpen;
      };

      /* ---------------- ETS MULTI-ACCENT SPEECH QUEUE ENGINE ---------------- */
      var audioState = {
        token: 0,
        playing: false,
        timer: null,
        watchdog: null,
        activeHighlight: "",
        activeGroupIdx: -1,
        statusText: "Sẵn sàng phát âm đa giọng ETS (US • UK • AU)",
        progressPct: 0
      };

      var FEMALE_VOICE_RE = /female|woman|zira|hazel|susan|jenny|aria|sonia|libby|natasha|samantha|victoria|karen|catherine|moira|tessa|serena|kate|helen|fiona|eva|michelle|emma|ava|clara|amy|salli|joanna|kendra|kimberly|martha/i;
      var MALE_VOICE_RE = /male|man|david|mark|george|ryan|guy|william|daniel|alex|fred|arthur|oliver|james|richard|christopher|eric|andrew|brian|steffan|matthew|joey|justin|russell|lee|thomas|stephen/i;

      function ensureVoicesReady(maxWaitMs) {
        return new Promise(function (resolve) {
          if (!("speechSynthesis" in window) || typeof window.speechSynthesis.getVoices !== "function") {
            return resolve([]);
          }
          var initial = window.speechSynthesis.getVoices() || [];
          if (initial.length) return resolve(initial);
          var finished = false;
          function done() {
            if (finished) return;
            finished = true;
            clearTimeout(t);
            try {
              if (window.speechSynthesis.removeEventListener) {
                window.speechSynthesis.removeEventListener("voiceschanged", onChange);
              }
            } catch (e) {}
            resolve(window.speechSynthesis.getVoices() || []);
          }
          function onChange() {
            var v = window.speechSynthesis.getVoices() || [];
            if (v.length) done();
          }
          var t = setTimeout(done, maxWaitMs || 260);
          try {
            if (window.speechSynthesis.addEventListener) {
              window.speechSynthesis.addEventListener("voiceschanged", onChange);
            }
          } catch (e) {}
        });
      }

      function pickRoleVoice(voices, accent, speaker) {
        var target = normalizeAccent(accent).toLowerCase();
        var enVoices = (voices || []).filter(function (v) { return /^en([-_]|$)/i.test(v.lang || ""); });
        if (!enVoices.length) return null;

        var spk = String(speaker || "N").toUpperCase();
        var wantFemale = spk.charAt(0) === "W";
        var wantMale = spk.charAt(0) === "M";
        var isSecond = spk.indexOf("2") !== -1;

        function score(v) {
          var sc = 0;
          var vl = String(v.lang || "").toLowerCase().replace("_", "-");
          var vn = String(v.name || "");
          if (vl === target) sc += 120;
          else if (vl.indexOf(target.slice(0, 5)) === 0) sc += 95;
          else if (vl.indexOf("en-us") === 0 || vl.indexOf("en-gb") === 0 || vl.indexOf("en-au") === 0) sc += 25;

          if (wantFemale) {
            if (FEMALE_VOICE_RE.test(vn)) sc += 60;
            else if (MALE_VOICE_RE.test(vn)) sc -= 35;
          } else if (wantMale) {
            if (MALE_VOICE_RE.test(vn)) sc += 60;
            else if (FEMALE_VOICE_RE.test(vn)) sc -= 35;
          }

          if (/natural|neural|google|online|microsoft/i.test(vn)) sc += 24;
          if (/espeak|compact|eloquence/i.test(vn)) sc -= 30;
          return sc;
        }

        enVoices.sort(function (a, b) { return score(b) - score(a); });
        if (isSecond && enVoices.length > 1) {
          var alt = enVoices.find(function (v, idx) {
            if (idx === 0) return false;
            return wantMale ? !FEMALE_VOICE_RE.test(v.name || "") : (wantFemale ? !MALE_VOICE_RE.test(v.name || "") : true);
          });
          if (alt) return alt;
        }
        return enVoices[0] || null;
      }

      function rolePitch(speaker) {
        var spk = String(speaker || "N").toUpperCase();
        if (spk === "M2" || spk === "M3") return 0.84;
        if (spk === "M" || spk === "M1") return 0.93;
        if (spk === "W2") return 1.15;
        if (spk === "W" || spk === "W1") return 1.07;
        return 1.0;
      }

      function clearAudioHighlights() {
        var prev = contentEl ? contentEl.querySelectorAll(".is-speaking") : [];
        for (var i = 0; i < prev.length; i++) prev[i].classList.remove("is-speaking");
      }

      function updateAudioUI() {
        var studio = document.getElementById("audioStudio");
        if (studio) studio.classList.toggle("is-playing", audioState.playing);
        var stEl = document.getElementById("audioStatusText");
        if (stEl) stEl.textContent = audioState.statusText;
        var fill = document.getElementById("audioProgressFill");
        if (fill) fill.style.width = Math.max(0, Math.min(100, audioState.progressPct)) + "%";
        var stopBtn = document.getElementById("btnAudioStop");
        if (stopBtn) stopBtn.disabled = !audioState.playing;
        var playBtn = document.getElementById("btnAudioPlayAll");
        if (playBtn) {
          playBtn.innerHTML = audioState.playing
            ? (svgIcon("volume", 14) + "<span>Đang phát...</span>")
            : (svgIcon("play", 14) + "<span>Phát cả bài</span>");
        }
      }

      function setAudioHighlight(key, groupIdx, groupTurnLabel, groupPct) {
        clearAudioHighlights();
        audioState.activeHighlight = key || "";
        audioState.activeGroupIdx = typeof groupIdx === "number" ? groupIdx : -1;
        if (key && contentEl) {
          var target = contentEl.querySelector('[data-speak-hl="' + key + '"]');
          if (target) target.classList.add("is-speaking");
        }
        if (typeof groupIdx === "number" && groupIdx >= 0) {
          var gStatus = document.getElementById("groupStatus_" + groupIdx);
          if (gStatus && groupTurnLabel) gStatus.textContent = groupTurnLabel;
          var gFill = document.getElementById("groupProg_" + groupIdx);
          if (gFill && typeof groupPct === "number") gFill.style.width = groupPct + "%";
        }
      }

      function stopAudio(resetLabel) {
        audioState.token++;
        audioState.playing = false;
        if (audioState.timer) { clearTimeout(audioState.timer); audioState.timer = null; }
        if (audioState.watchdog) { clearTimeout(audioState.watchdog); audioState.watchdog = null; }
        if ("speechSynthesis" in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        if (window.S4UI && typeof window.S4UI.stopEnglish === "function") {
          window.S4UI.stopEnglish();
        }
        clearAudioHighlights();
        if (resetLabel !== false) {
          audioState.statusText = "Đã dừng phát • Sẵn sàng nghe lại (" + activeRate + "x)";
          audioState.progressPct = 0;
        }
        updateAudioUI();
      }

      function speakStepOnce(step, myToken, voices) {
        return new Promise(function (resolve) {
          if (myToken !== audioState.token) return resolve(false);
          var text = String(step.text || "").trim();
          if (!text) return resolve(true);

          var lang = accentOverride === "auto"
            ? normalizeAccent(step.accent || (activeDrill && activeDrill.accent) || "en-US")
            : accentOverride;
          var rate = Math.max(0.65, Math.min(1.4, Number(step.rate || activeRate) || 1.0));
          var hasSpeech = ("speechSynthesis" in window) && typeof window.SpeechSynthesisUtterance === "function";

          if (!hasSpeech) {
            if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
              window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () {
                resolve(myToken === audioState.token);
              }, function () { resolve(false); });
              return;
            }
            return resolve(false);
          }

          var done = false;
          function finish(ok) {
            if (done) return;
            done = true;
            if (audioState.watchdog) { clearTimeout(audioState.watchdog); audioState.watchdog = null; }
            resolve(ok && myToken === audioState.token);
          }

          try {
            window.speechSynthesis.cancel();
            var u = new window.SpeechSynthesisUtterance(text);
            var voice = pickRoleVoice(voices, lang, step.speaker);
            if (voice) {
              u.voice = voice;
              u.lang = voice.lang || lang;
            } else {
              u.lang = lang;
            }
            u.rate = rate;
            u.pitch = rolePitch(step.speaker);
            u.onend = function () { finish(true); };
            u.onerror = function () {
              if (myToken !== audioState.token) return finish(false);
              if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
                window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () {
                  finish(true);
                }, function () { finish(false); });
              } else {
                finish(false);
              }
            };
            // Safety watchdog so a stalled browser TTS engine never deadlocks queue
            var estMs = Math.max(4500, Math.min(28000, Math.round((text.length * 95) / rate) + 3500));
            audioState.watchdog = setTimeout(function () { finish(true); }, estMs);
            window.speechSynthesis.speak(u);
          } catch (e) {
            if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
              window.S4UI.speakEnglish(text, { lang: lang, rate: rate }).then(function () {
                finish(true);
              }, function () { finish(false); });
            } else {
              finish(false);
            }
          }
        });
      }

      async function playQueue(steps, endStatusText) {
        if (!Array.isArray(steps) || !steps.length) return;
        stopAudio(false);
        var myToken = audioState.token;
        audioState.playing = true;
        audioState.progressPct = 0;
        audioState.statusText = steps[0].label || "Đang khởi tạo giọng đọc ETS...";
        updateAudioUI();

        var voices = await ensureVoicesReady(260);
        if (myToken !== audioState.token) return;

        for (var i = 0; i < steps.length; i++) {
          if (myToken !== audioState.token) return;
          var st = steps[i];
          var pct = Math.round(((i + 0.35) / steps.length) * 100);
          audioState.statusText = st.label || ("Đang phát " + (i + 1) + "/" + steps.length);
          audioState.progressPct = pct;
          setAudioHighlight(st.highlightKey, st.groupIdx, st.groupTurnLabel, st.groupPct);
          updateAudioUI();

          await speakStepOnce(st, myToken, voices);
          if (myToken !== audioState.token) return;

          audioState.progressPct = Math.round(((i + 1) / steps.length) * 100);
          updateAudioUI();

          var pauseMs = Number(st.pauseAfterMs) || 0;
          if (pauseMs > 0 && i < steps.length - 1) {
            await new Promise(function (res) {
              audioState.timer = setTimeout(function () {
                audioState.timer = null;
                res();
              }, pauseMs);
            });
          }
        }

        if (myToken === audioState.token) {
          audioState.playing = false;
          clearAudioHighlights();
          audioState.statusText = endStatusText || "Đã phát xong • Bấm Phát để nghe lại";
          audioState.progressPct = 100;
          updateAudioUI();
        }
      }

      function buildStepsForDrillItem(drill, itemIdx) {
        var steps = [];
        var part = drill.part;
        var items = Array.isArray(drill.items) ? drill.items : [];
        var item = items[itemIdx];
        if (!item) return steps;
        var acc = normalizeAccent(item.accent || drill.accent || "en-US");
        var accTag = accentOverride === "auto" ? accentShort(acc) : accentShort(accentOverride);

        if (part === "dictation") {
          steps.push({
            text: item.sentence || "",
            accent: acc,
            speaker: item.speaker || "W",
            pauseAfterMs: 650,
            highlightKey: "item_" + itemIdx,
            label: "Câu " + (item.num || (itemIdx + 1)) + "/" + items.length + " • Giọng " + accTag + " • " + activeRate + "x"
          });
        } else if (part === "part1") {
          steps.push({
            text: "Number " + (item.num || (itemIdx + 1)) + ".",
            accent: acc,
            speaker: "N",
            pauseAfterMs: 420,
            highlightKey: "item_" + itemIdx,
            label: "Câu " + (item.num || (itemIdx + 1)) + " • Chuẩn bị nghe 4 đáp án (A–D)"
          });
          var opts1 = Array.isArray(item.options) ? item.options.slice(0, 4) : [];
          opts1.forEach(function (opt, oIdx) {
            var letter = LETTERS[oIdx] || String(oIdx + 1);
            steps.push({
              text: letter + ". " + cleanOptionText(opt),
              accent: acc,
              speaker: item.speaker || (itemIdx % 2 === 0 ? "M" : "W"),
              pauseAfterMs: oIdx < opts1.length - 1 ? 360 : 650,
              highlightKey: "item_" + itemIdx,
              label: "Câu " + (item.num || (itemIdx + 1)) + " • Đang đọc (" + letter + ") • " + accTag + " • " + activeRate + "x"
            });
          });
        } else if (part === "part2") {
          var qSpk = item.speaker || (itemIdx % 2 === 0 ? "W" : "M");
          var aSpk = qSpk.charAt(0) === "W" ? "M" : "W";
          steps.push({
            text: "Number " + (item.num || (itemIdx + 1)) + ".",
            accent: acc,
            speaker: "N",
            pauseAfterMs: 320,
            highlightKey: "item_" + itemIdx,
            label: "Câu " + (item.num || (itemIdx + 1)) + " • Chuẩn bị câu hỏi Part 2"
          });
          steps.push({
            text: item.question || "",
            accent: acc,
            speaker: qSpk,
            pauseAfterMs: 460,
            highlightKey: "item_" + itemIdx,
            label: "Câu " + (item.num || (itemIdx + 1)) + " • Đang đọc Câu hỏi • " + accTag + " • " + activeRate + "x"
          });
          var opts2 = Array.isArray(item.options) ? item.options.slice(0, 3) : [];
          opts2.forEach(function (opt, oIdx) {
            var letter = LETTERS[oIdx] || String(oIdx + 1);
            steps.push({
              text: letter + ". " + cleanOptionText(opt),
              accent: acc,
              speaker: aSpk,
              pauseAfterMs: oIdx < opts2.length - 1 ? 350 : 650,
              highlightKey: "item_" + itemIdx,
              label: "Câu " + (item.num || (itemIdx + 1)) + " • Đang đọc (" + letter + ") • " + accTag + " • " + activeRate + "x"
            });
          });
        }
        return steps;
      }

      function buildStepsForGroup(drill, gIdx) {
        var steps = [];
        var groups = Array.isArray(drill.groups) ? drill.groups : [];
        var grp = groups[gIdx];
        if (!grp) return steps;
        var turns = Array.isArray(grp.turns) ? grp.turns : [];
        turns.forEach(function (t, tIdx) {
          var acc = normalizeAccent(t.accent || grp.accent || drill.accent || "en-US");
          var accTag = accentOverride === "auto" ? accentShort(acc) : accentShort(accentOverride);
          var spkName = t.name || (t.spk === "W" ? "Woman" : (t.spk === "M2" ? "Man 2" : (t.spk === "M1" ? "Man 1" : (t.spk === "M" ? "Man" : "Speaker"))));
          var turnPct = turns.length > 0 ? Math.round(((tIdx + 1) / turns.length) * 100) : 100;
          var turnLbl = "Lượt " + (tIdx + 1) + "/" + turns.length + " • " + spkName + " (" + accTag + ")";
          steps.push({
            text: t.en || "",
            accent: acc,
            speaker: t.spk || "M",
            pauseAfterMs: tIdx < turns.length - 1 ? 320 : 700,
            highlightKey: "turn_" + gIdx + "_" + tIdx,
            groupIdx: gIdx,
            groupTurnLabel: turnLbl,
            groupPct: turnPct,
            label: "Đoạn " + (gIdx + 1) + " • " + turnLbl + " • " + activeRate + "x"
          });
        });
        return steps;
      }

      function playAllActiveDrill() {
        if (!activeDrill) return;
        var steps = [];
        if (activeDrill.part === "part3" || activeDrill.part === "part4") {
          var groups = Array.isArray(activeDrill.groups) ? activeDrill.groups : [];
          for (var g = 0; g < groups.length; g++) {
            steps = steps.concat(buildStepsForGroup(activeDrill, g));
          }
        } else {
          var items = Array.isArray(activeDrill.items) ? activeDrill.items : [];
          for (var i = 0; i < items.length; i++) {
            steps = steps.concat(buildStepsForDrillItem(activeDrill, i));
          }
        }
        playQueue(steps, "Đã phát xong toàn bộ bài nghe • Bấm Phát để nghe lại");
      }

      function playSingleText(text, accent, speaker, label) {
        if (!text) return;
        playQueue([{
          text: text,
          accent: normalizeAccent(accent || (activeDrill && activeDrill.accent) || "en-US"),
          speaker: speaker || "N",
          pauseAfterMs: 0,
          label: label || "Đang phát câu chọn"
        }], "Đã phát xong");
      }

      /* ---------------- PROGRESS & STREAK ---------------- */
      function recordListeningStreak(id, isDone) {
        var lKey = "l_" + id;
        try {
          var days = safeReadJson(DAYS_KEY, {});
          if (isDone) {
            var now = new Date();
            var today = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
            var arr = Array.isArray(days[today]) ? days[today] : [];
            if (arr.indexOf(lKey) === -1) arr.push(lKey);
            days[today] = arr;
            localStorage.setItem(DAYS_KEY, JSON.stringify(days));
          } else {
            var changed = false;
            Object.keys(days).forEach(function (dateKey) {
              if (Array.isArray(days[dateKey]) && days[dateKey].indexOf(lKey) !== -1) {
                days[dateKey] = days[dateKey].filter(function (x) { return x !== lKey; });
                if (days[dateKey].length === 0) delete days[dateKey];
                changed = true;
              }
            });
            if (changed) localStorage.setItem(DAYS_KEY, JSON.stringify(days));
          }
        } catch (e) {}
      }

      function setLessonDone(id, forceState, silentToast) {
        if (!id) return;
        var next = typeof forceState === "boolean" ? forceState : !completedMap[id];
        if (next) completedMap[id] = true;
        else delete completedMap[id];
        try { localStorage.setItem(DONE_KEY, JSON.stringify(completedMap)); } catch (e) {}
        recordListeningStreak(id, next);
        updateProgressUI();
        renderSidebar();
        syncDoneButtons(id);
        if (!silentToast) {
          showToast(next ? "success" : "info", next ? "Đã đánh dấu hoàn thành bài nghe!" : "Đã bỏ đánh dấu hoàn thành.");
        }
      }

      function syncDoneButtons(id) {
        if (id !== activeId) return;
        var isDone = Boolean(completedMap[id]);
        var html = isDone
          ? (svgIcon("check", 14) + "<span>Đã hoàn thành</span>")
          : (svgIcon("target", 14) + "<span>Đánh dấu hoàn thành</span>");
        ["btnToggleDone", "btnFooterDone"].forEach(function (btnId) {
          var el = document.getElementById(btnId);
          if (el) {
            el.classList.toggle("completed", isDone);
            el.innerHTML = html;
          }
        });
      }

      function updateProgressUI() {
        var total = ALL_LESSONS.length || 48;
        var done = ALL_LESSONS.filter(function (x) { return Boolean(completedMap[x.id]); }).length;
        var pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
        var badge = document.getElementById("sidebarProgBadge");
        var bar = document.getElementById("sidebarProgBar");
        if (badge) badge.textContent = done + "/" + total;
        if (bar) bar.style.width = pct + "%";
      }

      /* ---------------- SIDEBAR FILTERING & RENDERING ---------------- */
      function matchesLesson(l, q) {
        if (!q) return true;
        var hay = [
          l.id, "bai " + l.order, l.title, l.subtitle, l.part, l.partLabel, l.accent, accentShort(l.accent)
        ].join(" ");
        if (window.S4UI && typeof window.S4UI.matchesSearch === "function") {
          return window.S4UI.matchesSearch(hay, q);
        }
        return hay.toLowerCase().indexOf(q.toLowerCase()) !== -1;
      }

      function getFilteredLessons() {
        var q = currentSearchQuery.trim();
        return ALL_LESSONS.filter(function (l) {
          if (currentLevelFilter > 0 && Number(l.level) !== currentLevelFilter) return false;
          if (currentPartFilter !== "all" && String(l.part || "").toLowerCase() !== currentPartFilter) return false;
          return matchesLesson(l, q);
        });
      }

      function renderFilterTabs() {
        if (levelTabsEl) {
          var lvTabs = [
            { lv: 0, label: "Tất cả" },
            { lv: 1, label: "0–350" },
            { lv: 2, label: "350–550" },
            { lv: 3, label: "550–750" },
            { lv: 4, label: "750–990" }
          ];
          levelTabsEl.innerHTML = lvTabs.map(function (t) {
            var active = currentLevelFilter === t.lv ? " active" : "";
            return '<button type="button" class="level-tab' + active + '" data-lv="' + t.lv + '" role="tab" aria-selected="' + (currentLevelFilter === t.lv ? "true" : "false") + '">' + t.label + '</button>';
          }).join("");
        }
        if (partTabsEl) {
          partTabsEl.innerHTML = PART_FILTERS.map(function (p) {
            var active = currentPartFilter === p.id ? " active" : "";
            return '<button type="button" class="part-tab' + active + '" data-part="' + p.id + '" role="tab" aria-selected="' + (currentPartFilter === p.id ? "true" : "false") + '">' + p.label + '</button>';
          }).join("");
        }
      }

      function clearFilters() {
        currentLevelFilter = 0;
        currentPartFilter = "all";
        currentSearchQuery = "";
        if (searchInput) {
          searchInput.value = "";
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") {
            window.S4UI.syncSearchClear(searchInput);
          }
        }
        renderSidebar();
      }

      function renderSidebar() {
        renderFilterTabs();
        updateProgressUI();
        if (!listEl) return;

        var filtered = getFilteredLessons();
        var q = currentSearchQuery.trim();

        if (!filtered.length) {
          listEl.innerHTML = '<div class="s4-empty-state" style="margin-top:8px;padding:24px 12px;">'
            + '<div style="color:var(--lg-ink-muted);">' + svgIcon("search", 26) + '</div>'
            + '<div style="font-size:13.5px;font-weight:800;color:var(--lg-ink);">Không tìm thấy bài nghe phù hợp</div>'
            + (q ? '<div style="font-size:12px;">Từ khóa "<strong>' + esc(q) + '</strong>" không khớp bài nào.</div>' : "")
            + '<button type="button" class="s4-pz-clear-chip" id="btnClearSearchEmpty">' + svgIcon("close", 12) + '<span>Xóa bộ lọc</span></button>'
            + '</div>';
          var clrBtn = document.getElementById("btnClearSearchEmpty");
          if (clrBtn) clrBtn.addEventListener("click", clearFilters);
          return;
        }

        var byLevel = new Map();
        filtered.forEach(function (l) {
          var lv = Number(l.level) || 1;
          if (!byLevel.has(lv)) byLevel.set(lv, []);
          byLevel.get(lv).push(l);
        });

        var html = "";
        [1, 2, 3, 4].forEach(function (lv) {
          var items = byLevel.get(lv);
          if (!items || !items.length) return;
          var meta = LEVEL_META[lv] || LEVEL_META[1];
          var doneCount = items.filter(function (x) { return Boolean(completedMap[x.id]); }).length;
          var isOpen = Boolean(q) || currentLevelFilter === lv || currentPartFilter !== "all" || openLevels.has(lv);
          var isFull = doneCount === items.length && items.length > 0;

          html += '<div class="unit-group' + (isOpen ? " open" : "") + '" data-unit-lv="' + lv + '">'
            + '<div class="unit-header" data-toggle-unit="' + lv + '">'
            +   '<div class="unit-header-top">'
            +     '<span class="unit-name">' + esc(meta.title) + '</span>'
            +     '<span class="unit-meta' + (isFull ? " is-full" : "") + '">' + svgIcon(isOpen ? "chevronDown" : "chevronRight", 13) + '</span>'
            +   '</div>'
            +   '<span class="unit-meta' + (isFull ? " is-full" : "") + '">' + doneCount + '/' + items.length + ' bài</span>'
            + '</div>'
            + '<div class="unit-items">'
            + items.map(function (l) {
                var isAct = l.id === activeId;
                var isDone = Boolean(completedMap[l.id]);
                var qCnt = Number(l.questionCount) || 0;
                return '<button type="button" class="lesson-item' + (isAct ? " active" : "") + '" data-lesson-id="' + esc(l.id) + '">'
                  + '<span class="lesson-item-left">'
                  +   '<span class="lesson-num">' + pad2(l.order) + '</span>'
                  +   '<span class="lesson-item-body">'
                  +     '<span class="lesson-item-title">' + esc(l.title) + '</span>'
                  +     '<span class="lesson-item-sub">'
                  +       '<span>' + esc(l.partLabel || l.part) + '</span>'
                  +       '<span class="sb-mini-badge">' + esc(accentShort(l.accent)) + '</span>'
                  +       (qCnt > 0 ? '<span>' + qCnt + ' câu</span>' : '')
                  +       (l.hasGraphic ? '<span class="sb-mini-badge">Graphic</span>' : '')
                  +     '</span>'
                  +   '</span>'
                  + '</span>'
                  + (isDone ? '<span class="done-dot" aria-label="Đã hoàn thành">' + svgIcon("check", 14) + '</span>' : '')
                  + '</button>';
              }).join("")
            + '</div>'
            + '</div>';
        });

        listEl.innerHTML = html;
      }

      /* ---------------- LAZY DRILL LOADER ---------------- */
      function resolveDrillUrl(meta) {
        var f = String((meta && meta.file) || "").trim();
        if (!f) return "data/drills/" + encodeURIComponent(meta.id) + ".json";
        if (/^(https?:|\/|data\/|\.\.?\/)/i.test(f)) return f;
        return "data/" + f.replace(/^\/+/, "");
      }

      function fetchDrill(meta) {
        if (!meta || !meta.id) return Promise.reject(new Error("Thiếu mã bài nghe"));
        if (drillCache.has(meta.id)) {
          return Promise.resolve(drillCache.get(meta.id));
        }
        var url = resolveDrillUrl(meta);
        return fetch(url, { cache: "default" }).then(function (resp) {
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return resp.json();
        }).then(function (json) {
          drillCache.set(meta.id, json);
          return json;
        });
      }

      function selectLesson(id, resetScroll) {
        var meta = ALL_LESSONS.find(function (x) { return x.id === id; });
        if (!meta) return;
        stopAudio(false);
        activeId = meta.id;
        activeDrill = null;
        answers = {};
        dictInputs = {};
        dictHinted = {};
        graded = false;
        transcriptVisible = false;
        activeRate = snapSpeedOption(meta.defaultRate || 1.0);
        accentOverride = "auto";
        openLevels.add(Number(meta.level) || 1);
        try { localStorage.setItem(LAST_KEY, meta.id); } catch (e) {}
        renderSidebar();

        if (contentEl) {
          contentEl.innerHTML = '<div class="loading-state">'
            + svgIcon("listening", 28)
            + '<div>Đang nạp bài nghe ' + esc(meta.title) + '...</div>'
            + '</div>';
        }
        if (resetScroll !== false) {
          var scroller = document.getElementById("mainScroll");
          if (scroller) scroller.scrollTop = 0;
        }

        var seq = ++fetchSeq;
        fetchDrill(meta).then(function (drill) {
          if (seq !== fetchSeq) return;
          activeDrill = drill;
          activeRate = snapSpeedOption(drill.defaultRate || meta.defaultRate || 1.0);
          audioState.statusText = "Sẵn sàng phát âm đa giọng ETS (" + accentShort(drill.accent) + " • " + activeRate + "x)";
          audioState.progressPct = 0;
          renderLesson(resetScroll !== false);
        }).catch(function (err) {
          if (seq !== fetchSeq) return;
          if (contentEl) {
            contentEl.innerHTML = '<div class="loading-state">'
              + svgIcon("alert", 28)
              + '<div>Không tải được dữ liệu bài nghe (' + esc(err && err.message ? err.message : "lỗi mạng") + ').</div>'
              + '<button type="button" class="btn btn-primary" id="btnRetryDrill">' + svgIcon("refresh", 14) + '<span>Thử tải lại</span></button>'
              + '</div>';
            var retry = document.getElementById("btnRetryDrill");
            if (retry) retry.addEventListener("click", function () { selectLesson(meta.id, false); });
          }
        });
      }

      /* ---------------- SCORE COMPUTATION ---------------- */
      function computeScore(drill) {
        if (!drill) return { correct: 0, total: 0, pct: 0, answered: 0, unit: "câu" };
        if (drill.part === "dictation") {
          var items = Array.isArray(drill.items) ? drill.items : [];
          var totalBlanks = 0;
          var correctBlanks = 0;
          var filledBlanks = 0;
          items.forEach(function (it, iIdx) {
            var blanks = Array.isArray(it.blanks) ? it.blanks : [];
            blanks.forEach(function (b, bIdx) {
              totalBlanks++;
              var val = dictInputs[iIdx + ":" + bIdx] || "";
              if (val.trim()) filledBlanks++;
              if (normalizeBlankAnswer(val) === normalizeBlankAnswer(b)) correctBlanks++;
            });
          });
          var pctD = totalBlanks > 0 ? Math.round((correctBlanks / totalBlanks) * 100) : 0;
          return { correct: correctBlanks, total: totalBlanks, pct: pctD, answered: filledBlanks, unit: "ô trống" };
        }
        if (drill.part === "part3" || drill.part === "part4") {
          var groups = Array.isArray(drill.groups) ? drill.groups : [];
          var totG = 0, corG = 0, ansG = 0;
          groups.forEach(function (g, gIdx) {
            (g.questions || []).forEach(function (q, qIdx) {
              totG++;
              var chosen = answers[gIdx + ":" + qIdx];
              if (typeof chosen === "number") ansG++;
              if (chosen === q.ans) corG++;
            });
          });
          var pctG = totG > 0 ? Math.round((corG / totG) * 100) : 0;
          return { correct: corG, total: totG, pct: pctG, answered: ansG, unit: "câu" };
        }
        // Part 1 & Part 2
        var list = Array.isArray(drill.items) ? drill.items : [];
        var tot = list.length, cor = 0, ans = 0;
        list.forEach(function (it, idx) {
          var chosen = answers[String(idx)];
          if (typeof chosen === "number") ans++;
          if (chosen === it.ans) cor++;
        });
        var pct = tot > 0 ? Math.round((cor / tot) * 100) : 0;
        return { correct: cor, total: tot, pct: pct, answered: ans, unit: "câu" };
      }

      /* ---------------- RENDERERS FOR 4 ETS MODES ---------------- */
      function renderAudioStudio(drill) {
        var speedBtns = SPEED_OPTIONS.map(function (spd) {
          var act = Math.abs(activeRate - spd) < 0.01 ? " active" : "";
          return '<button type="button" class="seg-pill' + act + '" data-set-rate="' + spd + '">' + spd + 'x</button>';
        }).join("");

        var accentOpts = [
          { id: "auto", label: "Chuẩn ETS" },
          { id: "en-US", label: "US" },
          { id: "en-GB", label: "UK" },
          { id: "en-AU", label: "AU" }
        ];
        var accentBtns = accentOpts.map(function (a) {
          var act = accentOverride === a.id ? " active" : "";
          return '<button type="button" class="seg-pill is-accent-pill' + act + '" data-set-accent="' + a.id + '">' + a.label + '</button>';
        }).join("");

        return '<section class="audio-studio' + (audioState.playing ? " is-playing" : "") + '" id="audioStudio" aria-label="Điều khiển phát âm đa giọng ETS">'
          + '<div class="audio-studio-row">'
          +   '<div class="audio-ctrl-group">'
          +     '<button type="button" class="btn btn-primary btn-sm" id="btnAudioPlayAll">' + svgIcon(audioState.playing ? "volume" : "play", 14) + '<span>' + (audioState.playing ? "Đang phát..." : "Phát cả bài") + '</span></button>'
          +     '<button type="button" class="btn btn-stop btn-sm" id="btnAudioStop"' + (audioState.playing ? '' : ' disabled') + '>' + svgIcon("stop", 13) + '<span>Dừng phát</span></button>'
          +   '</div>'
          +   '<div class="audio-ctrl-group">'
          +     '<div class="seg-pills" role="group" aria-label="Tốc độ phát">' + speedBtns + '</div>'
          +     '<div class="seg-pills" role="group" aria-label="Giọng đọc ETS">' + accentBtns + '</div>'
          +   '</div>'
          + '</div>'
          + '<div class="audio-status-row">'
          +   '<span class="audio-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'
          +   '<span class="audio-status-text" id="audioStatusText">' + esc(audioState.statusText) + '</span>'
          + '</div>'
          + '<div class="audio-prog-track"><div class="audio-prog-fill" id="audioProgressFill" style="width:' + audioState.progressPct + '%;"></div></div>'
          + '</section>';
      }

      function renderModeStrip(drill, scoreInfo) {
        var isRevealed = graded || transcriptVisible;
        var modeDesc = "";
        if (drill.part === "dictation") {
          modeDesc = "Nghe chép chính tả đục lỗ • Đã điền " + scoreInfo.answered + "/" + scoreInfo.total + " ô";
        } else if (drill.part === "part1") {
          modeDesc = isRevealed
            ? "Đã mở Transcript song ngữ Part 1 (chạm vào bất kỳ từ tiếng Anh nào để tra từ)"
            : "Chế độ Thi chuẩn ETS: Ẩn chữ 4 đáp án (A–D) khi nghe • Đã chọn " + scoreInfo.answered + "/" + scoreInfo.total;
        } else if (drill.part === "part2") {
          modeDesc = isRevealed
            ? "Đã mở Câu hỏi & 3 phương án (A–C) song ngữ — chạm từ để tra từ điển TOEIC"
            : "Chế độ Thi chuẩn ETS: Ẩn câu hỏi & chỉ 3 lựa chọn (A–C) • Đã chọn " + scoreInfo.answered + "/" + scoreInfo.total;
        } else {
          modeDesc = isRevealed
            ? "Đã mở Transcript hội thoại/bài nói (bấm loa nhỏ để nghe từng lượt, chạm từ để tra)"
            : "Chế độ Thi chuẩn ETS: Đọc 3 câu hỏi trước khi bấm Phát • Đã chọn " + scoreInfo.answered + "/" + scoreInfo.total;
        }

        var toggleTxt = transcriptVisible ? "Ẩn Transcript" : "Hiện Transcript";
        return '<div class="ets-mode-strip">'
          + '<div class="ets-mode-badge">' + svgIcon(isRevealed ? "eye" : "eyeOff", 15) + '<span>' + esc(modeDesc) + '</span></div>'
          + '<div class="ets-mode-actions">'
          +   '<button type="button" class="btn btn-sm btn-teal" id="btnToggleTranscript">' + svgIcon(transcriptVisible ? "eyeOff" : "eye", 13) + '<span>' + toggleTxt + '</span></button>'
          + '</div>'
          + '</div>';
      }

      function renderScoreBanner(scoreInfo) {
        if (!graded) return "";
        var passed = scoreInfo.pct >= 70;
        var msg = passed
          ? ("Tuyệt vời! Bạn đúng " + scoreInfo.correct + "/" + scoreInfo.total + " " + scoreInfo.unit + " (" + scoreInfo.pct + "%) — Đã tự động đánh dấu hoàn thành bài nghe!")
          : ("Bạn đúng " + scoreInfo.correct + "/" + scoreInfo.total + " " + scoreInfo.unit + " (" + scoreInfo.pct + "%). Đạt từ 70% trở lên để hoàn thành tự động — hãy nghe lại cùng Transcript song ngữ nhé!");
        return '<div class="score-banner ' + (passed ? "is-pass" : "is-retry") + '" id="drillScoreBanner">'
          + svgIcon(passed ? "award" : "alert", 18)
          + '<span>' + esc(msg) + '</span>'
          + '</div>';
      }

      function renderDictationMode(drill) {
        var items = Array.isArray(drill.items) ? drill.items : [];
        var isRevealed = graded || transcriptVisible;

        var cardsHtml = items.map(function (it, iIdx) {
          var blanks = Array.isArray(it.blanks) ? it.blanks : [];
          var parts = String(it.masked || "").split(/_{2,}/g);
          var sentenceHtml = "";
          var allRight = blanks.length > 0;

          for (var p = 0; p < parts.length; p++) {
            sentenceHtml += esc(parts[p]);
            if (p < blanks.length) {
              var k = iIdx + ":" + p;
              var userVal = dictInputs[k] || "";
              var expected = String(blanks[p] || "");
              var isRight = normalizeBlankAnswer(userVal) === normalizeBlankAnswer(expected);
              if (!isRight) allRight = false;
              var cls = "dict-input" + (graded ? (isRight ? " is-correct" : " is-wrong") : "");
              var wCh = Math.max(8, Math.min(20, expected.length + 3));
              var ph = dictHinted[k] && expected ? (expected.charAt(0) + "... (" + expected.length + " ký tự)") : ("Từ " + (p + 1));

              sentenceHtml += '<span class="dict-blank-wrap">'
                + '<input type="text" class="' + cls + '" data-dict-key="' + k + '" value="' + esc(userVal) + '" placeholder="' + esc(ph) + '" style="width:' + wCh + 'ch;" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu ' + (iIdx + 1) + ' chỗ trống ' + (p + 1) + '">'
                + (graded && !isRight ? '<span class="dict-ans-chip">' + esc(expected) + '</span>' : '')
                + '</span>';
            }
          }

          var cardCls = "drill-card" + (graded ? (allRight ? " is-graded-right" : " is-graded-wrong") : "");
          var revealHtml = isRevealed
            ? '<div class="dict-reveal-box">'
              + '<div class="dict-full-en">' + wrapTapWords(it.sentence || "") + '</div>'
              + (it.vi ? '<div class="dict-full-vi">' + esc(it.vi) + '</div>' : '')
              + (it.phoneticTip ? '<div class="dict-phonetic-tip">' + svgIcon("lightbulb", 13) + '<span>' + esc(it.phoneticTip) + '</span></div>' : '')
              + '</div>'
            : '';

          return '<article class="' + cardCls + '" data-speak-hl="item_' + iIdx + '">'
            + '<div class="drill-card-head">'
            +   '<div class="drill-card-head-left">'
            +     '<span class="q-num-pill">Câu ' + (it.num || (iIdx + 1)) + '</span>'
            +     '<span class="accent-tag">' + esc(accentShort(it.accent || drill.accent)) + '</span>'
            +   '</div>'
            +   '<div class="audio-ctrl-group">'
            +     '<button type="button" class="btn btn-sm" data-hint-item="' + iIdx + '">' + svgIcon("lightbulb", 13) + '<span>Gợi ý chữ cái đầu</span></button>'
            +     '<button type="button" class="btn btn-sm btn-primary" data-play-item="' + iIdx + '">' + svgIcon("volume", 13) + '<span>Nghe câu</span></button>'
            +   '</div>'
            + '</div>'
            + '<div class="dict-sentence-wrap">' + sentenceHtml + '</div>'
            + revealHtml
            + '</article>';
        }).join("");

        return '<div class="drill-list">' + cardsHtml + '</div>';
      }

      function renderPart1Mode(drill) {
        var items = Array.isArray(drill.items) ? drill.items : [];
        var isRevealed = graded || transcriptVisible;

        var cardsHtml = items.map(function (it, iIdx) {
          var chosen = answers[String(iIdx)];
          var isRight = graded && chosen === it.ans;
          var cardCls = "drill-card" + (graded ? (isRight ? " is-graded-right" : " is-graded-wrong") : "");
          var opts = Array.isArray(it.options) ? it.options.slice(0, 4) : [];
          var optsVi = Array.isArray(it.optionsVi) ? it.optionsVi : [];

          var choicesHtml = "";
          if (!isRevealed) {
            // ETS Blind Exam Mode: ZERO option text rendered in DOM!
            choicesHtml = '<div class="ets-blind-prompt">' + svgIcon("listening", 15) + '<span>Nhìn tranh, bấm Phát để nghe 4 câu mô tả và chọn đáp án đúng (A / B / C / D):</span></div>'
              + '<div class="ets-bubble-row cols-4" role="radiogroup" aria-label="Chọn đáp án câu ' + (iIdx + 1) + '">'
              + [0, 1, 2, 3].map(function (oIdx) {

                  var selCls = chosen === oIdx ? " selected" : "";
                  return '<button type="button" class="ets-bubble-btn' + selCls + '" data-pick-item="' + iIdx + '" data-pick-opt="' + oIdx + '" aria-pressed="' + (chosen === oIdx ? "true" : "false") + '">(' + letter + ')</button>';
                }).join("")
              + '</div>';
          } else {
            choicesHtml = '<div class="revealed-opts">'
              + opts.map(function (optText, oIdx) {
                  var letter = LETTERS[oIdx];
                  var rowCls = "rev-opt-row" + (!graded ? " is-clickable" : "");

                    + '</div>';

          var expHtml = "";

            expHtml = '<div class="q-exp-box ' + (isRight ? "is-ok" : "is-err") + '">'

          return '<article class="' + cardCls + '" data-speak-hl="item_' + iIdx + '">'
            + '<div class="drill-card-head">'
            +   '<div class="drill-card-head-left">'
            +     '<span class="q-num-pill">Tranh ' + (it.num || (iIdx + 1)) + '</span>'
            +     '<span class="accent-tag">' + esc(accentShort(it.accent || drill.accent)) + '</span>'
            +   '</div>'
            +   '<button type="button" class="btn btn-sm btn-primary" data-play-item="' + iIdx + '">' + svgIcon("volume", 13) + '<span>Phát câu (A–D)</span></button>'
            + '</div>'
            + (it.image ? '<div class="p1-img-wrap"><img class="p1-img" src="' + esc(it.image) + '" alt="' + esc(it.imageAlt || ("Tranh Part 1 câu " + (iIdx + 1))) + '" loading="lazy"></div>' : '')
            + choicesHtml
            + expHtml
            + '</article>';
        }).join("");

        return '<div class="drill-list">' + cardsHtml + '</div>';
      }

      /* ---------------- LAZY TAP-TO-LOOKUP TOEIC DICTIONARY (0 KB ON BOOT) ---------------- */
      var vocabLoadPromise = null;
      var vocabMap = null;
      var vocabWfMap = null;

      var IRREGULAR_LEMMAS = {
        held: "hold", sent: "send", paid: "pay", made: "make", wrote: "write", written: "write",
        took: "take", taken: "take", gave: "give", given: "give", spoke: "speak", spoken: "speak",
        met: "meet", sold: "sell", bought: "buy", built: "build", found: "find", kept: "keep",
        left: "leave", brought: "bring", thought: "think", told: "tell", said: "say", went: "go",
        gone: "go", saw: "see", seen: "see", came: "come", ran: "run", sat: "sit", stood: "stand",
        led: "lead", heard: "hear", understood: "understand", began: "begin", begun: "begin",
        chose: "choose", chosen: "choose", drove: "drive", driven: "drive", flew: "fly",
        flown: "fly", grew: "grow", grown: "grow", knew: "know", known: "know", spent: "spend",
        won: "win", lost: "lose", caught: "catch", taught: "teach", meant: "mean", dealt: "deal",
        drew: "draw", drawn: "draw", fell: "fall", fallen: "fall", felt: "feel", forgot: "forget",
        forgotten: "forget", got: "get", gotten: "get", hung: "hang", laid: "lay", lent: "lend",
        lit: "light", rose: "rise", risen: "rise", shown: "show", wore: "wear", worn: "wear",
        broke: "break", broken: "break", torn: "tear", tore: "tear"
      };

      function loadScriptOnce(src) {
        return new Promise(function (resolve) {
          var existing = document.querySelector('script[data-lazy-vocab="' + src + '"]');
          if (existing) {
            if (existing.dataset.loaded === "1") return resolve(true);
            existing.addEventListener("load", function () { resolve(true); }, { once: true });
            existing.addEventListener("error", function () { resolve(false); }, { once: true });
            return;
          }
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.dataset.lazyVocab = src;
          s.onload = function () { s.dataset.loaded = "1"; resolve(true); };
          s.onerror = function () { resolve(false); };
          document.head.appendChild(s);
        });
      }

      function buildVocabLookupMaps() {
        vocabMap = new Map();
        vocabWfMap = new Map();
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        [1, 2, 3, 4].forEach(function (lv) {
          var list = chunks[lv];
          if (!Array.isArray(list)) return;
          for (var i = 0; i < list.length; i++) {
            var item = list[i];
            if (!item || !item.word) continue;
            var key = normalizeDictWord(item.word);
            if (key && !vocabMap.has(key)) {
              vocabMap.set(key, item);
            }
            if (Array.isArray(item.wf)) {
              for (var j = 0; j < item.wf.length; j++) {
                var wfHead = normalizeDictWord(String(item.wf[j] || "").replace(/\([^)]*\)/g, ""));
                if (wfHead && !vocabWfMap.has(wfHead)) {
                  vocabWfMap.set(wfHead, item);
                }
              }
            }
          }
        });
      }

      function ensureToeicVocabLoaded() {
        if (vocabMap) return Promise.resolve(vocabMap);
        if (vocabLoadPromise) return vocabLoadPromise;
        var chunks = window.__LP_TOEIC_VOCAB_CHUNKS || {};
        var jobs = [1, 2, 3, 4].map(function (lv) {
          if (Array.isArray(chunks[lv]) && chunks[lv].length) return Promise.resolve(true);
          return loadScriptOnce("../vocab/data/vocab_u_" + lv + ".js?v=1");
        });
        vocabLoadPromise = Promise.all(jobs).then(function () {
          buildVocabLookupMaps();
          return vocabMap;
        });
        return vocabLoadPromise;
      }

      function lookupToeicWord(rawWord) {
        if (!vocabMap) return null;
        var w = normalizeDictWord(rawWord);
        if (!w) return null;
        if (vocabMap.has(w)) return { entry: vocabMap.get(w), via: "" };

        var candidates = [];
        if (w.endsWith("'s")) candidates.push(w.slice(0, -2));
        if (IRREGULAR_LEMMAS[w]) candidates.push(IRREGULAR_LEMMAS[w]);
        if (w.endsWith("ies") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("es") && w.length > 3) candidates.push(w.slice(0, -2));
        if (w.endsWith("s") && w.length > 2) candidates.push(w.slice(0, -1));
        if (w.endsWith("ied") && w.length > 4) candidates.push(w.slice(0, -3) + "y");
        if (w.endsWith("ed") && w.length > 3) {
          var stemEd = w.slice(0, -2);
          candidates.push(stemEd, stemEd + "e");
          if (stemEd.length >= 3 && stemEd.charAt(stemEd.length - 1) === stemEd.charAt(stemEd.length - 2)) {
            candidates.push(stemEd.slice(0, -1));
          }
        }
        if (w.endsWith("ing") && w.length > 4) {
          var stemIng = w.slice(0, -3);
          candidates.push(stemIng, stemIng + "e");
          if (stemIng.length >= 3 && stemIng.charAt(stemIng.length - 1) === stemIng.charAt(stemIng.length - 2)) {
            candidates.push(stemIng.slice(0, -1));
          }
        }
        if (w.endsWith("ly") && w.length > 4) {
          candidates.push(w.slice(0, -2));
          if (w.endsWith("ily")) candidates.push(w.slice(0, -3) + "y");
        }
        if (w.endsWith("er") && w.length > 4) candidates.push(w.slice(0, -2), w.slice(0, -1));
        if (w.endsWith("est") && w.length > 5) candidates.push(w.slice(0, -3), w.slice(0, -2));

        for (var i = 0; i < candidates.length; i++) {
          var c = candidates[i];
          if (c && vocabMap.has(c)) {
            return { entry: vocabMap.get(c), via: c };
          }
        }
        if (vocabWfMap && vocabWfMap.has(w)) {
          var wfEntry = vocabWfMap.get(w);
          return { entry: wfEntry, via: wfEntry.word };
        }
        return null;
      }

      var currentDictEntry = null;
      var currentDictWord = "";

      function speakDictWord(word, accent) {
        var clean = String(word || "").trim();
        if (!clean) return;
        var lang = normalizeAccent(accent || "en-US");
        var audioUrl = "";
        if (currentDictEntry && normalizeDictWord(currentDictEntry.word) === normalizeDictWord(clean)) {
          if (lang === "en-GB" && currentDictEntry.localUkAudio) audioUrl = currentDictEntry.localUkAudio;
          else if (lang === "en-US" && currentDictEntry.localUsAudio) audioUrl = currentDictEntry.localUsAudio;
          if (audioUrl && audioUrl.indexOf("media/") === 0) audioUrl = "../vocab/" + audioUrl;
        }
        if (window.S4UI && typeof window.S4UI.speakEnglish === "function") {
          window.S4UI.speakEnglish(clean, { lang: lang, rate: 0.95, audioUrl: audioUrl });
        } else {
          playSingleText(clean, lang, "W", "Phát âm từ " + clean);
        }
      }
