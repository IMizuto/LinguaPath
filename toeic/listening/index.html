            + (wfList.length
              ? '<div class="dict-sec"><div class="dict-sec-lbl">Word Family</div><div class="dict-chips">'
                + wfList.map(function (w) { return '<span class="dict-chip">' + esc(w) + '</span>'; }).join("")
                + '</div></div>'
              : '')
            + (colList.length
              ? '<div class="dict-sec"><div class="dict-sec-lbl">Collocations chuẩn TOEIC</div><div class="dict-chips">'
                + colList.map(function (c) { return '<span class="dict-chip">' + esc(c) + '</span>'; }).join("")
                + '</div></div>'
              : '')
            + (entry.trap
              ? '<div class="dict-trap-box"><div class="dict-trap-lbl">Nghĩa bẫy hay gặp trong ETS</div><div>' + esc(entry.trap) + '</div></div>'
              : '');
        } else {
          bodyHtml = '<div class="dict-fallback-note">'
            + 'Từ <strong>' + esc(tappedRaw) + '</strong> chưa nằm trong 3.189 từ trọng tâm TOEIC (thường là từ chức năng, tên riêng hoặc con số). Bạn vẫn có thể bấm 3 nút <strong>UK / US / AU</strong> ở trên để nghe phát âm chuẩn.'
            + '</div>';
        }

        sheet.innerHTML =
          '<div class="dict-head">'
          + '<div style="min-width:0;flex:1;">'
          +   '<div class="dict-word-line">'
          +     '<h3 class="dict-word">' + esc(displayWord) + '</h3>'
          +     (entry && entry.pos ? '<span class="dict-pos">' + esc(entry.pos) + '</span>' : '')
          +     (entry && entry.level ? '<span class="meta-pill is-stage" style="padding:2px 7px;font-size:10.5px;">Chặng ' + entry.level + '</span>' : '')
          +   '</div>'
          +   (entry && entry.ipa ? '<div class="dict-ipa">' + esc(entry.ipa) + '</div>' : '')
          + '</div>'
          + '<button type="button" class="btn btn-sm" id="btnCloseDictPopup" aria-label="Đóng tra từ">' + svgIcon("close", 13) + '<span>Đóng</span></button>'
          + '</div>'
          + audioBtns
          + bodyHtml;
      }

      var dictOpenSeq = 0;
      function openDictPopup(rawWord, anchorEl) {
        var clean = String(rawWord || "").trim();
        if (!clean) return;
        var prevAct = contentEl ? contentEl.querySelectorAll(".tap-word.is-active") : [];
        for (var i = 0; i < prevAct.length; i++) prevAct[i].classList.remove("is-active");
        if (anchorEl) anchorEl.classList.add("is-active");

        var modal = document.getElementById("toeicDictPopup");
        if (!modal) return;
        modal.classList.add("open");

        var seq = ++dictOpenSeq;
        if (vocabMap) {
          var hitNow = lookupToeicWord(clean);
          renderDictPopupContent(clean, hitNow, false);
          return;
        }
        renderDictPopupContent(clean, null, true);
        ensureToeicVocabLoaded().then(function () {
          if (seq !== dictOpenSeq) return;
          var hit = lookupToeicWord(clean);
          renderDictPopupContent(clean, hit, false);
        });
      }

      function closeDictPopup() {
        var modal = document.getElementById("toeicDictPopup");
        if (modal) modal.classList.remove("open");
        var prevAct = contentEl ? contentEl.querySelectorAll(".tap-word.is-active") : [];
        for (var i = 0; i < prevAct.length; i++) prevAct[i].classList.remove("is-active");
      }

      /* ---------------- EVENT BINDINGS ---------------- */
      if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
        window.S4UI.initSmartBackButton({
          element: "#lpBackBtn",
          defaultUrl: "../index.html",
          defaultLabel: "TOEIC",
          roadmapUrl: "../roadmap/index.html",
          roadmapLabel: "Lộ trình"
        });
      }

      var btnToggleSb = document.getElementById("btnToggleSidebar");
      if (btnToggleSb) btnToggleSb.addEventListener("click", function () { window.toggleMenu(); });
      var btnCloseSb = document.getElementById("btnCloseSidebar");
      if (btnCloseSb) btnCloseSb.addEventListener("click", function () { window.toggleMenu(false); });
      var sbBackdrop = document.getElementById("sidebarBackdrop");
      if (sbBackdrop) sbBackdrop.addEventListener("click", function () { window.toggleMenu(false); });

      var btnDonate = document.getElementById("btnListenDonate");
      if (btnDonate) {
        btnDonate.addEventListener("click", function () {
          if (window.S4Auth && typeof window.S4Auth.openDonateModal === "function") {
            window.S4Auth.openDonateModal();
          }
        });
      }

      var btnDark = document.getElementById("btnListenDark");
      if (btnDark) btnDark.addEventListener("click", function () { window.toggleDark(); });
      syncDarkBtn();
      if (typeof MutationObserver !== "undefined") {
        new MutationObserver(syncDarkBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      }

      if (levelTabsEl) {
        levelTabsEl.addEventListener("click", function (e) {
          var btn = e.target.closest(".level-tab");
          if (!btn) return;
          currentLevelFilter = Number(btn.getAttribute("data-lv") || 0);
          if (currentLevelFilter > 0) openLevels.add(currentLevelFilter);
          renderSidebar();
        });
      }

      if (partTabsEl) {
        partTabsEl.addEventListener("click", function (e) {
          var btn = e.target.closest(".part-tab");
          if (!btn) return;
          currentPartFilter = btn.getAttribute("data-part") || "all";
          renderSidebar();
        });
      }

      if (listEl) {
        listEl.addEventListener("click", function (e) {
          var unitHdr = e.target.closest("[data-toggle-unit]");
          if (unitHdr) {
            var uLv = Number(unitHdr.getAttribute("data-toggle-unit") || 1);
            if (openLevels.has(uLv)) openLevels.delete(uLv);
            else openLevels.add(uLv);
            renderSidebar();
            return;
          }
          var itemBtn = e.target.closest("[data-lesson-id]");
          if (itemBtn) {
            var lid = itemBtn.getAttribute("data-lesson-id");
            if (lid) {
              selectLesson(lid, true);
              if (window.innerWidth <= 1024) window.toggleMenu(false);
            }
          }
        });
      }

      if (contentEl) {
        contentEl.addEventListener("input", function (e) {
          var inp = e.target.closest(".dict-input[data-dict-key]");
          if (!inp) return;
          dictInputs[inp.getAttribute("data-dict-key")] = inp.value;
        });

        contentEl.addEventListener("keydown", function (e) {
          var tw = e.target.closest(".tap-word[data-word]");
          if (tw && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            openDictPopup(tw.getAttribute("data-word") || tw.textContent, tw);
          }
        });

        contentEl.addEventListener("click", function (e) {
          // 1. Tap-to-lookup word in unlocked Transcript
          var tapWord = e.target.closest(".tap-word[data-word]");
          if (tapWord) {
            e.stopPropagation();
            openDictPopup(tapWord.getAttribute("data-word") || tapWord.textContent, tapWord);
            return;
          }

          // 2. Audio studio controls
          if (e.target.closest("#btnAudioPlayAll")) {
            playAllActiveDrill();
            return;
          }
          if (e.target.closest("#btnAudioStop")) {
            stopAudio(true);
            return;
          }
          var rateBtn = e.target.closest("[data-set-rate]");
          if (rateBtn) {
            activeRate = Number(rateBtn.getAttribute("data-set-rate") || 1.0);
            if (audioState.playing) stopAudio(false);
            audioState.statusText = "Đã đặt tốc độ phát " + activeRate + "x";
            renderLesson(false);
            return;
          }
          var accBtn = e.target.closest("[data-set-accent]");
          if (accBtn) {
            accentOverride = accBtn.getAttribute("data-set-accent") || "auto";
            if (audioState.playing) stopAudio(false);
            var accName = accentOverride === "auto" ? "Đa giọng chuẩn ETS" : ("Giọng " + accentShort(accentOverride));
            audioState.statusText = "Đã chọn " + accName + " • " + activeRate + "x";
            renderLesson(false);
            return;
          }

          // 3. Play specific item / group / single turn / single option / single question
          var playItemBtn = e.target.closest("[data-play-item]");
          if (playItemBtn && activeDrill) {
            var iIdx = Number(playItemBtn.getAttribute("data-play-item"));
            playQueue(buildStepsForDrillItem(activeDrill, iIdx), "Đã phát xong câu " + (iIdx + 1));
            return;
          }
          var playGrpBtn = e.target.closest("[data-play-group]");
          if (playGrpBtn && activeDrill) {
            var gIdx = Number(playGrpBtn.getAttribute("data-play-group"));
            playQueue(buildStepsForGroup(activeDrill, gIdx), "Đã phát xong đoạn " + (gIdx + 1));
            return;
          }
          var playTurnBtn = e.target.closest("[data-play-turn]");
          if (playTurnBtn && activeDrill) {
            var parts = String(playTurnBtn.getAttribute("data-play-turn") || "").split(":");
            var tg = Number(parts[0]), tt = Number(parts[1]);
            var grp = activeDrill.groups && activeDrill.groups[tg];
            var turn = grp && grp.turns && grp.turns[tt];
            if (turn) {
              playQueue([{
                text: turn.en || "",
                accent: normalizeAccent(turn.accent || grp.accent || activeDrill.accent),
                speaker: turn.spk || "M",
                pauseAfterMs: 0,
                highlightKey: "turn_" + tg + "_" + tt,
                label: "Nghe lại lượt " + (tt + 1) + " • " + (turn.name || turn.spk || "Speaker")
              }], "Đã phát xong lượt nói");
            }
            return;
          }
          var spkQBtn = e.target.closest("[data-speak-q]");
          if (spkQBtn && activeDrill && activeDrill.items) {
            var qi = Number(spkQBtn.getAttribute("data-speak-q"));
            var itemQ = activeDrill.items[qi];
            if (itemQ) {
              playSingleText(itemQ.question, itemQ.accent || activeDrill.accent, qi % 2 === 0 ? "W" : "M", "Đang nghe lại câu hỏi " + (qi + 1));
            }
            return;
          }
          var spkOptBtn = e.target.closest("[data-speak-opt]");
          if (spkOptBtn && activeDrill && activeDrill.items) {
            var segs = String(spkOptBtn.getAttribute("data-speak-opt") || "").split(":");
            var oi = Number(segs[1]), oo = Number(segs[2]);
            var itO = activeDrill.items[oi];
            if (itO && itO.options && itO.options[oo]) {
              playSingleText(cleanOptionText(itO.options[oo]), itO.accent || activeDrill.accent, "M", "Đang nghe lại phương án (" + LETTERS[oo] + ")");
            }
            return;
          }

          // 4. Dictation hint button
          var hintBtn = e.target.closest("[data-hint-item]");
          if (hintBtn && activeDrill && activeDrill.items) {
            var hIdx = Number(hintBtn.getAttribute("data-hint-item"));
            var hItem = activeDrill.items[hIdx];
            if (hItem && Array.isArray(hItem.blanks)) {
              hItem.blanks.forEach(function (b, bIdx) {
                var k = hIdx + ":" + bIdx;
                dictHinted[k] = true;
                if (!String(dictInputs[k] || "").trim() && b) {
                  dictInputs[k] = String(b).charAt(0);
                }
              });
              renderLesson(false);
              showToast("info", "Đã gợi ý chữ cái đầu cho Câu " + (hIdx + 1) + ".", 1600);
            }
            return;
          }

          // 5. Toggle transcript
          if (e.target.closest("#btnToggleTranscript")) {
            transcriptVisible = !transcriptVisible;
            renderLesson(false);
            return;
          }

          // 6. Pick answer (Part 1 & Part 2)
          var pickItemEl = e.target.closest("[data-pick-item]");
          if (pickItemEl && !graded) {
            if (e.target.closest(".mini-spk-btn") || e.target.closest(".tap-word")) return;
            var pi = pickItemEl.getAttribute("data-pick-item");
            var po = Number(pickItemEl.getAttribute("data-pick-opt"));
            answers[String(pi)] = po;
            renderLesson(false);
            return;
          }

          // 7. Pick answer (Part 3 & Part 4)
          var pickGrpEl = e.target.closest("[data-pick-grp]");
          if (pickGrpEl && !graded) {
            var gk = pickGrpEl.getAttribute("data-pick-grp");
            var go = Number(pickGrpEl.getAttribute("data-pick-opt"));
            answers[gk] = go;
            var qCard = contentEl.querySelector('[data-grp-q="' + gk + '"]');
            if (qCard) {
              qCard.querySelectorAll(".q-opt").forEach(function (b) {
                b.classList.toggle("selected", Number(b.getAttribute("data-pick-opt")) === go);
              });
            }
            var scNow = computeScore(activeDrill);
            var modeBadge = contentEl.querySelector(".ets-mode-badge span");
            if (modeBadge && !transcriptVisible) {
              modeBadge.textContent = "Chế độ Thi chuẩn ETS: Đọc 3 câu hỏi trước khi bấm Phát • Đã chọn " + scNow.answered + "/" + scNow.total;
            }
            return;
          }

          // 8. Grade / Reset / Done / Nav
          if (e.target.closest("#btnGradeDrill")) {
            gradeActiveDrill();
            return;
          }
          if (e.target.closest("#btnResetDrill")) {
            resetActiveDrill();
            return;
          }
          if (e.target.closest("#btnToggleDone") || e.target.closest("#btnFooterDone")) {
            setLessonDone(activeId);
            return;
          }
          var navBtn = e.target.closest("[data-nav-id]");
          if (navBtn) {
            selectLesson(navBtn.getAttribute("data-nav-id"), true);
          }
        });
      }

      // Dict Popup events
      var dictModal = document.getElementById("toeicDictPopup");
      if (dictModal) {
        dictModal.addEventListener("click", function (e) {
          if (e.target === dictModal || e.target.closest("#btnCloseDictPopup")) {
            closeDictPopup();
            return;
          }
          var spkBtn = e.target.closest("[data-dict-spk]");
          if (spkBtn) {
            speakDictWord(currentDictWord, spkBtn.getAttribute("data-dict-spk"));
          }
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (dictModal && dictModal.classList.contains("open")) {
            closeDictPopup();
          } else if (document.body.classList.contains("sidebar-open")) {
            window.toggleMenu(false);
          }
        }
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 1024 && (
          document.body.classList.contains("sidebar-open") ||
          (sidebarEl && sidebarEl.classList.contains("open"))
        )) {
          window.toggleMenu(false);
        }
      });

      window.addEventListener("pagehide", function () { stopAudio(false); });
      window.addEventListener("beforeunload", function () { stopAudio(false); });

      var searchTimer = null;
      if (window.S4UI && typeof window.S4UI.bindSearchBar === "function" && searchInput) {
        window.S4UI.bindSearchBar({
          input: searchInput,
          clearBtn: "searchInput_clear",
          searchBtn: "searchInput_btn",
          delay: 160,
          onSearch: function (val) {
            clearTimeout(searchTimer);
            currentSearchQuery = val || "";
            renderSidebar();
          }
        });
      } else if (searchInput) {
        searchInput.addEventListener("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () {
            currentSearchQuery = searchInput.value || "";
            renderSidebar();
          }, 160);
        });
      }

      /* ---------------- INIT FROM URL QUERY ---------------- */
      (function init() {
        var sp = null;
        try { sp = new URLSearchParams(window.location.search); } catch (e) {}

        var reqLv = sp ? Number(sp.get("level") || 0) : 0;
        if (reqLv >= 1 && reqLv <= 4) {
          currentLevelFilter = reqLv;
          openLevels = new Set([reqLv]);
        }

        var reqPart = sp ? String(sp.get("part") || "").trim().toLowerCase() : "";
        if (reqPart && PART_FILTERS.some(function (p) { return p.id === reqPart; })) {
          currentPartFilter = reqPart;
        }

        var reqQ = sp ? String(sp.get("q") || "").trim() : "";
        if (reqQ && searchInput) {
          currentSearchQuery = reqQ;
          searchInput.value = reqQ;
          if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") {
            window.S4UI.syncSearchClear(searchInput);
          }
        }

        var reqId = sp ? String(sp.get("id") || "").trim() : "";
        var picked = null;
        if (reqId) {
          picked = ALL_LESSONS.find(function (x) { return x.id === reqId; }) || null;
        }
        if (!picked && (currentLevelFilter > 0 || currentPartFilter !== "all")) {
          var filteredInit = getFilteredLessons();
          if (filteredInit.length) picked = filteredInit[0];
        }
        if (!picked) {
          var saved = "";
          try { saved = localStorage.getItem(LAST_KEY) || ""; } catch (e) {}
          if (saved) picked = ALL_LESSONS.find(function (x) { return x.id === saved; }) || null;
        }
        if (!picked && ALL_LESSONS.length) {
          picked = ALL_LESSONS[0];
        }

        if (picked) {
          openLevels = new Set([Number(picked.level) || 1]);
          selectLesson(picked.id, true);
          if (listEl) {
            var actItem = listEl.querySelector(".lesson-item.active");
            if (actItem && typeof actItem.scrollIntoView === "function") {
              try { actItem.scrollIntoView({ block: "nearest" }); } catch (e) {}
            }
          }
        } else {
          renderSidebar();
          renderLesson(true);
        }
      })();
    })();
  </script>
</body>
</html>
