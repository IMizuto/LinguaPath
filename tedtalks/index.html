    function evaluateShadowTranscript(transcript, isFinalStop, acousticInfo) {
      if (acousticInfo) lastShadowAcoustic = acousticInfo;
      const ac = acousticInfo || lastShadowAcoustic;
      const resEl = document.getElementById("shadResultText");
      const spans = [...document.querySelectorAll("#shadWordsHost .shad-word")];
      if (!spans.length) return { pct: 0, matched: 0, closeCount: 0, total: 0, acoustic: ac || null };

      const targetWordsList = spans.map(sp => sp.textContent || sp.getAttribute("data-w") || "");
      const aligned = alignTedShadowWords(targetWordsList, transcript);
      spans.forEach((sp, idx) => {
        sp.classList.remove("ok", "close", "miss", "punct");
        const st = aligned.statuses[idx];
        if (st === "ok") sp.classList.add("ok");
        else if (st === "close") sp.classList.add("close");
        else if (st === "punct") sp.classList.add("punct");
        else if (isFinalStop) sp.classList.add("miss");
      });

      const pct = aligned.pct;
      lastShadowEval = { transcript, pct, matched: aligned.matched, closeCount: aligned.closeCount, total: aligned.total, acoustic: ac || null };

      if (resEl) {
        const safeTranscript = escHtml(transcript || "");
        const acHtml = formatTedAcousticHtml(ac);
        const closeHint = aligned.closeCount ? ` • ${aligned.closeCount} gần đúng` : "";
        if (!isFinalStop) {
          resEl.style.color = "var(--text)";
          resEl.innerHTML = `Đang nghe: <strong style="color:var(--primary);">"${safeTranscript || "..."}"</strong> — Đã khớp <strong>${aligned.matched}/${aligned.total} từ${closeHint} (${pct}%)</strong>`;
        } else {
          const badgeColor = pct >= 80 ? "var(--success)" : (pct >= 50 ? "#f59e0b" : "var(--danger)");
          const label = pct >= 80 ? "Phát âm rất chuẩn!" : (pct >= 50 ? "Khá tốt! Bấm vào các từ cam/đỏ để nghe lại" : "Hãy nghe lại mẫu và thử nói chậm, rõ từng từ");
          resEl.style.color = badgeColor;
          resEl.innerHTML = `
            <div style="width:100%;">
              <div>${label} — Độ khớp: <strong>${pct}% (${aligned.matched}/${aligned.total} từ${closeHint})</strong></div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:3px;">Bạn đã nói: "${safeTranscript || "(Chưa thu được tiếng)"}"</div>
              ${acHtml}
            </div>
          `;
        }
      }
      return lastShadowEval;
    }

    function countShadowMatchesForTranscript(transcript) {
      const spans = [...document.querySelectorAll("#shadWordsHost .shad-word")];
      if (!spans.length || !transcript) return 0;
      const targetWordsList = spans.map(sp => sp.textContent || sp.getAttribute("data-w") || "");
      return alignTedShadowWords(targetWordsList, transcript).weightedScore;
    }

    function stopShadowRecording(finalizeScore = true, keepStatusText = false) {
      if (tedTailTimer) {
        clearTimeout(tedTailTimer);
        tedTailTimer = null;
      }
      isTedStoppingTail = false;
      shadowSessionGen++;
      pendingAutoRecordAfterListen = false;
      const wasRecording = isShadowRecording;
      isShadowRecording = false;
      if (shadSilenceTimer) {
        clearTimeout(shadSilenceTimer);
        shadSilenceTimer = null;
      }
      if (shadRecRestartTimer) {
        clearTimeout(shadRecRestartTimer);
        shadRecRestartTimer = null;
      }
      if (activeRec) {
        try {
          activeRec.onresult = null;
          activeRec.onerror = null;
          activeRec.onend = null;
          activeRec.stop();
        } catch (e) {}
        activeRec = null;
      }
      const recorderRef = mediaRecorder;
      mediaRecorder = null;
      const hasRecordedAudio = !!(recorderRef && recorderRef.state !== "inactive");
      const it = getActiveItem();
      const sub = (it && it.subs && it.subs[currentSubIdx]) || null;
      const targetEn = sub ? (sub.en || "") : "";
      const recDurSec = shadStartTs ? Math.max(0.5, (Date.now() - shadStartTs) / 1000) : 0;
      const liveEval = (finalizeScore && shadAccumFinal.trim()) ? evaluateShadowTranscript(shadAccumFinal.trim(), true) : null;
      const incompleteStt = !shadAccumFinal.trim()
        || (liveEval && liveEval.pct < 65)
        || (window.S4Whisper && window.S4Whisper.isTranscriptIncomplete && window.S4Whisper.isTranscriptIncomplete(shadAccumFinal, {
          targetText: targetEn,
          durationSec: recDurSec,
          sttErrored: shadSttErrored
        }));

      pendingWhisperTranscribe = Boolean(
        finalizeScore
        && wasRecording
        && incompleteStt
        && hasRecordedAudio
        && window.S4Whisper
        && window.S4Whisper.isSupported()
      );
      if (recorderRef) {
        recorderRef._pendingWhisper = pendingWhisperTranscribe;
      }
      if (hasRecordedAudio) {
        try {
          if (recorderRef.state === "recording" && typeof recorderRef.requestData === "function") {
            recorderRef.requestData();
          }
        } catch (e) {}
        try { recorderRef.stop(); } catch (e) {}
      }
      // Keep Warm Mic Stream alive across consecutive sentences to prevent iOS turn-2 freeze
      if (mediaStream) {
        scheduleWarmMicIdleRelease();
      }
      const btn = document.getElementById("btnStartShadow");
      if (btn) {
        btn.classList.remove("recording");
        btn.innerHTML = svgIcon("mic", 15) + "<span>Bấm để nói lại</span>";
      }
      if (finalizeScore && shadAccumFinal.trim() && !pendingWhisperTranscribe) {
        const res = liveEval || evaluateShadowTranscript(shadAccumFinal.trim(), true);
        showToast(res.pct >= 70, `Độ khớp phát âm: ${res.pct}% (${res.matched}/${res.total} từ)`);
      } else if (pendingWhisperTranscribe) {
        if (!shadAccumFinal.trim()) {
          setTedShadowStatus('Đang nhận diện giọng nói bằng Whisper AI... (Có thể bấm Nghe lại giọng bạn ở trên)', "var(--primary)");
        }
      } else if (wasRecording && !keepStatusText && hasRecordedAudio) {
        setTedShadowStatus('Đã lưu bản ghi âm. Bấm "Nghe lại giọng bạn" ở trên để tự đối chiếu.', "var(--primary)");
      }
    }

    async function toggleShadowRecord() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const canMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      const btn = document.getElementById("btnStartShadow");

      // Nếu đang thu âm (hoặc chỉ thu audio fallback) -> Bấm lần nữa để Dừng
      if (isShadowRecording || activeRec) {
        if (isTedStoppingTail) return;
        if ((Date.now() - shadStartTs) >= 400) {
          isTedStoppingTail = true;
          const snapGen = shadowSessionGen;
          if (btn) btn.innerHTML = svgIcon("clock", 15) + "<span>Đang chốt âm...</span>";
          tedTailTimer = setTimeout(() => {
            tedTailTimer = null;
            isTedStoppingTail = false;
            if (snapGen === shadowSessionGen) stopShadowRecording(true);
          }, 180);
          return;
        }
        stopShadowRecording(true);
        return;
      }

      if (!SR && !canMedia) {
        setTedShadowStatus("Trình duyệt hiện tại không hỗ trợ Microphone hoặc nhận diện giọng nói.", "var(--danger)");
        return;
      }

      // Unlock shared AudioContext synchronously on user tap (iOS Safari requirement)
      if (window.S4Whisper && typeof window.S4Whisper.getSharedAudioContext === "function") {
        try { window.S4Whisper.getSharedAudioContext(); } catch (e) {}
      }

      // Tạm dừng YouTube / Video TED gốc / Podcast để tránh tiếng video lọt vào mic
      if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
        try { ytPlayer.pauseVideo(); } catch (e) {}
      }
      const tedVid = document.getElementById("tedVideoPlayer");
      if (tedVid && !tedVid.paused) {
        try { tedVid.pause(); } catch (e) {}
      }
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (bgAudio && !bgAudio.paused) {
        try { bgAudio.pause(); } catch (e) {}
      }

      if (shadRecRestartTimer) {
        clearTimeout(shadRecRestartTimer);
        shadRecRestartTimer = null;
      }

      // Xoá trạng thái xanh/đỏ cũ trên các từ
      document.querySelectorAll("#shadWordsHost .shad-word").forEach(sp => sp.classList.remove("ok", "close", "miss", "punct"));
      shadAccumFinal = "";
      shadCommittedFinal = "";
      lastShadowEval = null;
      lastShadowAcoustic = null;
      pendingWhisperTranscribe = false;
      shadSttErrored = false;
      shadStartTs = Date.now();

      const sessId = ++shadowSessionGen;

      // Khởi tạo / tái sử dụng Warm Mic Stream cho MediaRecorder (cho phép nghe lại giọng mình & hybrid STT)
      if (canMedia) {
        try {
          const activeStream = await ensureWarmMicStream();
          if (!activeStream || sessId !== shadowSessionGen) {
            return;
          }
          recordedChunks = [];
          const mr = (window.S4Whisper && typeof window.S4Whisper.createVoiceRecorder === "function")
            ? window.S4Whisper.createVoiceRecorder(activeStream, { audioBitsPerSecond: 48000 })
            : new MediaRecorder(activeStream);
          mediaRecorder = mr;
          mr.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };
          mr.onstop = () => {
            const shouldWhisper = Boolean(mr._pendingWhisper || pendingWhisperTranscribe);
            pendingWhisperTranscribe = false;
            const stopGen = shadowSessionGen;
            const stopActiveId = activeId;
            const stopSubIdx = currentSubIdx;
            if (recordedChunks.length > 0) {
              if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
              const recMime = (mr && (mr.mimeType || mr._lpPreferredMime)) || "audio/webm";
              const blob = new Blob(recordedChunks, { type: recMime });
              recordedBlobUrl = URL.createObjectURL(blob);
              const userAud = document.getElementById("shadUserAudio");
              const replayBtn = document.getElementById("btnReplayUserVoice");
              if (userAud) {
                userAud.src = recordedBlobUrl;
                try { userAud.load(); } catch (e) {}
              }
              if (replayBtn) replayBtn.style.display = "inline-flex";

              if (shouldWhisper && window.S4Whisper) {
                window.S4Whisper.transcribeBlob(blob, {
                  forceLocal: true,
                  onProgress: (info) => {
                    if (stopGen !== shadowSessionGen || stopActiveId !== activeId || stopSubIdx !== currentSubIdx || currentMode !== "shadowing") return;
                    if (info && info.status === "progress" && typeof info.progress === "number" && !shadAccumFinal.trim()) {
                      setTedShadowStatus("Đang tải bộ nhận diện giọng nói Whisper Offline (" + Math.round(info.progress) + "%)... Có thể bấm Nghe lại ở trên.", "var(--primary)");
                    }
                  }
                }).then((wRes) => {
                  if (wRes && wRes.ok && wRes.transcript) {
                    consecutiveSilentCount = 0;
                  } else if (wRes && wRes.reason === "silent_audio") {
                    consecutiveSilentCount += 1;
                  }
                  if (wRes && wRes.acoustic) {
                    lastShadowAcoustic = wRes.acoustic;
                  }
                  if (stopGen !== shadowSessionGen || stopActiveId !== activeId || stopSubIdx !== currentSubIdx || currentMode !== "shadowing") return;
                  if (wRes && wRes.ok && wRes.transcript) {
                    const wOnly = String(wRes.transcript).trim();
                    const prevTx = shadAccumFinal.trim();
                    let bestTx = wOnly;
                    if (prevTx) {
                      const merged = (prevTx + " " + wOnly).replace(/\s+/g, " ").trim();
                      const wScore = countShadowMatchesForTranscript(wOnly);
                      const pScore = countShadowMatchesForTranscript(prevTx);
                      const mScore = countShadowMatchesForTranscript(merged);
                      if (pScore > wScore && pScore >= mScore) bestTx = prevTx;
                      else if (mScore > wScore) bestTx = merged;
                    }
                    shadAccumFinal = bestTx;
                    const res = evaluateShadowTranscript(bestTx, true, wRes.acoustic || null);
                    showToast(res.pct >= 70, "Whisper đã chấm phát âm: " + res.pct + "% (" + res.matched + "/" + res.total + " từ)");
                  } else if (!shadAccumFinal.trim() && !(wRes && (wRes.cancelled || wRes.reason === "cancelled"))) {
                    const acBoxHtml = (wRes && wRes.acoustic && wRes.acoustic.voicedFrames > 0) ? formatTedAcousticHtml(wRes.acoustic) : "";
                    if (wRes && wRes.reason === "silent_audio") {
                      setTedShadowStatus('Đã lưu bản ghi âm (chưa phát hiện giọng nói rõ). Hãy nói to hơn hoặc bấm Nghe lại.', "#f59e0b");
                    } else if (acBoxHtml) {
                      const resEl = document.getElementById("shadResultText");
                      if (resEl) {
                        resEl.style.color = "var(--primary)";
                        resEl.innerHTML = `<div style="width:100%;"><div>Đã lưu bản ghi âm. Bấm Nghe lại giọng bạn ở trên để đối chiếu.</div>${acBoxHtml}</div>`;
                      }
                    } else {
                      setTedShadowStatus('Đã lưu bản ghi âm. Bấm Nghe lại giọng bạn ở trên để đối chiếu.', "var(--primary)");
                    }
                  } else if (shadAccumFinal.trim() && wRes && wRes.acoustic) {
                    evaluateShadowTranscript(shadAccumFinal.trim(), true, wRes.acoustic);
                  }
                });
              } else if (window.S4Whisper && typeof window.S4Whisper.analyzeBlobAcoustics === "function") {
                window.S4Whisper.analyzeBlobAcoustics(blob).then((acRes) => {
                  if (stopGen !== shadowSessionGen || stopActiveId !== activeId || stopSubIdx !== currentSubIdx || currentMode !== "shadowing") return;
                  if (!acRes || !acRes.acoustic || !(acRes.acoustic.voicedFrames > 0)) return;
                  lastShadowAcoustic = acRes.acoustic;
                  if (shadAccumFinal.trim()) {
                    evaluateShadowTranscript(shadAccumFinal.trim(), true, acRes.acoustic);
                  } else {
                    const resEl = document.getElementById("shadResultText");
                    if (resEl) {
                      resEl.style.color = "var(--primary)";
                      resEl.innerHTML = `<div style="width:100%;"><div>Đã lưu bản ghi âm. Bấm Nghe lại giọng bạn ở trên để đối chiếu.</div>${formatTedAcousticHtml(acRes.acoustic)}</div>`;
                    }
                  }
                }).catch(() => {});
              }
            }
          };
          mr.start(250);
        } catch (err) {
          mediaRecorder = null;
          releaseWarmMicStream();
          const errMsg = describeTedMediaError(err);
          const fatalMic = err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError" || err.name === "NotFoundError" || err.name === "NotReadableError" || err.name === "SecurityError");
          if (!SR || fatalMic) {
            setTedShadowStatus(errMsg, "var(--danger)");
            return;
          }
        }
      }

      isShadowRecording = true;

      // Fallback chỉ thu âm bằng MediaRecorder khi trình duyệt/WebView thiếu SpeechRecognition
      if (!SR) {
        if (btn) {
          btn.classList.add("recording");
          btn.innerHTML = svgIcon("stop", 15) + "<span>Dừng thu âm</span>";
        }
        setTedShadowStatus(TED_STT_MESSAGES["not-supported"], "#f59e0b");
        return;
      }

      const rec = new SR();
      activeRec = rec;
      rec._sessionFinal = "";
      let sttErrored = false;
      let emptyRestartCount = 0;
      rec.lang = shadowVoiceLang;
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 3;

      if (btn) {
        btn.classList.add("recording");
        btn.innerHTML = svgIcon("stop", 15) + "<span>Đang nghe... (Dừng &amp; chấm)</span>";
      }
      setTedShadowStatus("Hãy đọc to câu tiếng Anh ở trên...", "var(--primary)");

      rec.onresult = (ev) => {
        if (sessId !== shadowSessionGen) return;
        let finalPart = "";
        let interimPart = "";
        for (let i = 0; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript || "";
          if (ev.results[i].isFinal) finalPart += t + " ";
          else interimPart += t + " ";
        }
        rec._sessionFinal = finalPart.trim();
        const combined = [shadCommittedFinal, rec._sessionFinal, interimPart.trim()].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
        if (combined) {
          emptyRestartCount = 0;
          shadAccumFinal = combined;
          const evRes = evaluateShadowTranscript(combined, false);

          // Tự động kết thúc nếu người học đã nói khớp 100% các từ trong câu
          if (evRes.total > 0 && evRes.matched >= evRes.total) {
            stopShadowRecording(true);
            return;
          }

          // Chỉ tự chốt khi đã khớp ít nhất 65% câu và dừng nói 2.2 giây
          if (shadSilenceTimer) clearTimeout(shadSilenceTimer);
          if (evRes.pct >= 65) {
            shadSilenceTimer = setTimeout(() => {
              if (activeRec && shadAccumFinal.trim()) {
                stopShadowRecording(true);
              }
            }, 2200);
          }
        }
      };

      rec.onerror = (ev) => {
        if (sessId !== shadowSessionGen) return;
        sttErrored = true;
        shadSttErrored = true;
        const errCode = ev && ev.error ? ev.error : "";
        const friendly = TED_STT_MESSAGES[errCode] || ("Lỗi nhận diện giọng nói (" + (errCode || "unknown") + ").");

        if (errCode === "no-speech" && shadAccumFinal.trim()) {
          sttErrored = false;
          shadSttErrored = false;
          return;
        }
        const hasActiveMr = Boolean(mediaRecorder && mediaRecorder.state === "recording");
        const isLateNotAllowed = (errCode === "not-allowed" && hasActiveMr && (recordedChunks.length > 0 || (Date.now() - shadStartTs) > 800 || isIosSafariLike()));
        if (hasActiveMr && (errCode !== "not-allowed" || isLateNotAllowed)) {
          activeRec = null;
          if (btn) btn.innerHTML = svgIcon("stop", 15) + "<span>Đang thu âm... (Dừng &amp; chấm)</span>";
          return;
        }
        setTedShadowStatus(friendly, "var(--danger)");
        stopShadowRecording(false, true);
      };

      rec.onend = () => {
        if (rec._sessionFinal) {
          shadCommittedFinal = [shadCommittedFinal, rec._sessionFinal].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
          shadAccumFinal = shadCommittedFinal;
          rec._sessionFinal = "";
        }
        if (sessId !== shadowSessionGen || sttErrored || shadSttErrored) return;
        if (isIosSafariLike()) {
          shadSttErrored = true;
          try {
            rec.onresult = null;
            rec.onerror = null;
            rec.onend = null;
          } catch (e) {}
          if (activeRec === rec) activeRec = null;
          return;
        }
        if (activeRec === rec && isShadowRecording) {
          if (lastShadowEval && lastShadowEval.pct >= 85) {
            stopShadowRecording(true);
            return;
          }
          if (/Android/i.test((navigator && navigator.userAgent) || "") && mediaRecorder && mediaRecorder.state === "recording" && !shadAccumFinal.trim() && emptyRestartCount >= 1) {
            shadSttErrored = true;
            try {
              rec.onresult = null;
              rec.onerror = null;
              rec.onend = null;
            } catch (e) {}
            activeRec = null;
            return;
          }
          if (emptyRestartCount < 4) {
            emptyRestartCount++;
            if (shadRecRestartTimer) clearTimeout(shadRecRestartTimer);
            shadRecRestartTimer = setTimeout(() => {
              if (sessId !== shadowSessionGen || !isShadowRecording || activeRec !== rec || shadSttErrored) return;
              try {
                rec.start();
              } catch (e) {
                shadSttErrored = true;
                if (mediaRecorder && mediaRecorder.state === "recording") {
                  activeRec = null;
                } else {
                  setTedShadowStatus(TED_STT_MESSAGES["aborted"], "var(--danger)");
                  stopShadowRecording(false, true);
                }
              }
            }, 150);
            return;
          }
          shadSttErrored = true;
          if (mediaRecorder && mediaRecorder.state === "recording") {
            activeRec = null;
          } else {
            setTedShadowStatus(TED_STT_MESSAGES["no-speech"], "var(--danger)");
            stopShadowRecording(false, true);
          }
        }
      };

      try {
        rec.start();
      } catch (e) {
        shadSttErrored = true;
        if (mediaRecorder && mediaRecorder.state === "recording") {
          activeRec = null;
          if (btn) btn.innerHTML = svgIcon("stop", 15) + "<span>Dừng thu âm</span>";
          setTedShadowStatus(TED_STT_MESSAGES["aborted"], "#f59e0b");
        } else {
          setTedShadowStatus(TED_STT_MESSAGES["aborted"], "var(--danger)");
          stopShadowRecording(false, true);
        }
      }
    }

    /* ---------- Chế độ 4: Podcast Chạy Nền (Background Play + MediaSession) ---------- */
    let hlsInstance = null;
    let podcastLoadedId = null;
    let podcastLoadGen = 0;
    let podcastAutoNext = true;

    function destroyPodcastStream() {
      podcastLoadGen++;
      podcastLoadedId = null;
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
      }
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (bgAudio) {
        try { bgAudio.pause(); } catch (e) {}
        try {
          bgAudio.removeAttribute("src");
          bgAudio.load();
        } catch (e) {}
      }
    }

    function setupPodcastEvents() {
      const bgAudio = document.getElementById("bgPodcastAudio");
      const seekEl = document.getElementById("podSeek");
      const curEl = document.getElementById("podCurTime");
      const durEl = document.getElementById("podDurTime");
      const playBtn = document.getElementById("podPlayBtn");
      if (!bgAudio) return;

      const resetPodcastPlayUi = () => {
        if (playBtn) playBtn.innerHTML = svgIcon("play", 14) + "<span>Phát Podcast</span>";
        const podWrap = document.getElementById("podcastBoxWrap");
        if (podWrap) podWrap.classList.remove("playing");
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      };
      bgAudio.addEventListener("play", () => {
        startSyncLoop();
        if (playBtn) playBtn.innerHTML = svgIcon("stop", 14) + "<span>Tạm dừng</span>";
        const podWrap = document.getElementById("podcastBoxWrap");
        if (podWrap) podWrap.classList.add("playing");
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      });
      bgAudio.addEventListener("pause", () => { resetPodcastPlayUi(); maybeStopSyncLoop(); });
      bgAudio.addEventListener("ended", maybeStopSyncLoop);
      bgAudio.addEventListener("error", () => {
        resetPodcastPlayUi();
        if (currentMode === "podcast" && bgAudio.getAttribute("src")) {
          showToast(false, "Không tải được luồng âm thanh Podcast. Hãy thử lại hoặc mở trên YouTube!");
        }
      });
      bgAudio.addEventListener("loadedmetadata", () => {
        const dur = Math.floor(bgAudio.duration || 0);
        if (seekEl && dur > 0) seekEl.max = dur;
        if (durEl) durEl.textContent = fmtTime(dur * 1000);
      });
      bgAudio.addEventListener("timeupdate", () => {
        const sec = bgAudio.currentTime || 0;
        const dur = bgAudio.duration || 0;
        if (seekEl && !seekEl.matches(":active")) seekEl.value = Math.floor(sec);
        if (curEl) curEl.textContent = fmtTime(sec * 1000);
        if (durEl && dur > 0) durEl.textContent = fmtTime(dur * 1000);

        if (currentMode === "podcast") {
          const it = getActiveItem();
          if (it && it.subs.length) {
            const offsetMs = Number(it.podOffsetMs || 0);
            const ms = (sec * 1000) - offsetMs;
            let foundIdx = 0;
            for (let i = 0; i < it.subs.length; i++) {
              if (ms >= it.subs[i].time) foundIdx = i;
              else break;
            }
            if (foundIdx !== playbackSubIdx) {
              playbackSubIdx = foundIdx;
              highlightTranscriptRow(foundIdx);
            }
          }
        }

        if ("mediaSession" in navigator && dur > 0 && !isNaN(dur) && isFinite(dur)) {
          try {
            navigator.mediaSession.setPositionState({
              duration: dur,
              playbackRate: bgAudio.playbackRate || 1,
              position: Math.min(Math.max(0, sec), dur)
            });
          } catch (e) {}
        }
      });
      bgAudio.addEventListener("ended", () => {
        if (podcastAutoNext) {
          stepLesson(1, true);
        }
      });
      if (seekEl) {
        seekEl.addEventListener("input", () => {
          bgAudio.currentTime = Number(seekEl.value || 0);
        });
      }
    }

    function updateMediaSessionMeta(it) {
      if (!("mediaSession" in navigator) || !it) return;
      const parts = it.title.split("|").map(s => s.trim());
      const talkTitle = parts[0] || it.title;
      const speaker = parts[1] || "TED Talks";
      const thumbUrl = `https://i.ytimg.com/vi/${it.youtubeId}/hqdefault.jpg`;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: talkTitle,
          artist: speaker + " • LinguaPath TED Talks",
          album: it.unit,
          artwork: [
            { src: thumbUrl, sizes: "480x360", type: "image/jpeg" }
          ]
        });
        navigator.mediaSession.setActionHandler("play", () => {
          const a = document.getElementById("bgPodcastAudio");
          if (a) a.play().catch(() => {});
        });
        navigator.mediaSession.setActionHandler("pause", () => {
          const a = document.getElementById("bgPodcastAudio");
          if (a) a.pause();
        });
        navigator.mediaSession.setActionHandler("previoustrack", () => stepLesson(-1, true));
        navigator.mediaSession.setActionHandler("nexttrack", () => stepLesson(1, true));
        navigator.mediaSession.setActionHandler("seekbackward", (details) => {
          const skip = (details && details.seekOffset) || 10;
          seekPodcast(-skip);
        });
        navigator.mediaSession.setActionHandler("seekforward", (details) => {
          const skip = (details && details.seekOffset) || 10;
          seekPodcast(skip);
        });
        navigator.mediaSession.setActionHandler("seekto", (details) => {
          const a = document.getElementById("bgPodcastAudio");
          if (a && details && typeof details.seekTime === "number") a.currentTime = details.seekTime;
        });
      } catch (e) {}
    }

    function loadPodcastStream(it, autoPlay) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio || !it) return;
      const parts = it.title.split("|").map(s => s.trim());
      const speakerEl = document.getElementById("podSpeaker");
      const thumbEl = document.getElementById("podThumb");
      if (speakerEl) speakerEl.textContent = (parts[1] ? parts[1] + " • " : "") + it.unit;
      if (thumbEl) thumbEl.src = `https://i.ytimg.com/vi/${it.youtubeId}/hqdefault.jpg`;
      updateMediaSessionMeta(it);

      if (!tedAudioUrl(it)) {
        destroyPodcastStream();
        const seekEl = document.getElementById("podSeek");
        const curEl = document.getElementById("podCurTime");
        const durEl = document.getElementById("podDurTime");
        const playBtn = document.getElementById("podPlayBtn");
        const podWrap = document.getElementById("podcastBoxWrap");
        if (seekEl) seekEl.value = 0;
        if (curEl) curEl.textContent = "0:00";
        if (durEl) durEl.textContent = "0:00";
        if (playBtn) playBtn.innerHTML = svgIcon("play", 14) + "<span>Phát Podcast</span>";
        if (podWrap) podWrap.classList.remove("playing");
        if (speakerEl) speakerEl.textContent = "Bài này chỉ có nguồn Video YouTube (hãy chuyển sang Nghe & Transcript)";
        if (currentMode === "podcast") {
          showToast(false, "Bài này chỉ hỗ trợ nguồn Video YouTube!");
        }
        return;
      }

      if (podcastLoadedId === it.id && (bgAudio.getAttribute("src") || bgAudio.src)) {
        if (autoPlay && currentMode === "podcast" && activeId === it.id && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
        return;
      }
      const loadGen = ++podcastLoadGen;
      podcastLoadedId = it.id;

      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
      }

      const rateSel = document.getElementById("podRateSel");
      const rate = rateSel ? Number(rateSel.value || 1) : 1;

      if (it.mp4) {
        bgAudio.src = it.mp4;
        bgAudio.playbackRate = rate;
        if (autoPlay && currentMode === "podcast" && activeId === it.id) bgAudio.play().catch(() => {});
      } else if (it.audioHls || it.hls) {
        const streamUrl = it.audioHls || it.hls;
        if (bgAudio.canPlayType("application/vnd.apple.mpegurl")) {
          bgAudio.src = streamUrl;
          bgAudio.playbackRate = rate;
          if (autoPlay && currentMode === "podcast" && activeId === it.id) bgAudio.play().catch(() => {});
        } else if (window.Hls && Hls.isSupported()) {
          const hls = new Hls();
          hlsInstance = hls;
          hls.loadSource(streamUrl);
          hls.attachMedia(bgAudio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (loadGen !== podcastLoadGen || currentMode !== "podcast" || activeId !== it.id) {
              if (activeId !== it.id && hlsInstance === hls) {
                try { hls.destroy(); } catch (e) {}
                hlsInstance = null;
              }
              return;
            }
            bgAudio.playbackRate = rate;
            if (autoPlay) bgAudio.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data && data.fatal) {
              const playBtn = document.getElementById("podPlayBtn");
              const podWrap = document.getElementById("podcastBoxWrap");
              if (playBtn) playBtn.innerHTML = svgIcon("play", 14) + "<span>Phát Podcast</span>";
              if (podWrap) podWrap.classList.remove("playing");
              if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
            }
          });
        }
      }
    }

    function togglePodcastPlay() {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio) return;
      const it = getActiveItem();
      if (it && !tedAudioUrl(it)) {
        loadPodcastStream(it, false);
        return;
      }
      if (!podcastLoadedId) loadPodcastStream(it, true);
      else if (bgAudio.paused) bgAudio.play().catch(() => {});
      else bgAudio.pause();
    }

    function seekPodcast(deltaSec) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio) return;
      bgAudio.currentTime = Math.max(0, Math.min(bgAudio.duration || 99999, (bgAudio.currentTime || 0) + deltaSec));
    }

    function setPodcastRate(v) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (bgAudio) bgAudio.playbackRate = Number(v || 1);
    }

    function renderPodcastMode(it) {
      const box = document.getElementById("modeContainer");
      const rowsHtml = buildSubRowsHtml(it);

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="font-weight:800;font-size:13.5px;color:var(--success);display:inline-flex;align-items:center;gap:6px;">${svgIcon("volume", 15)}<span>Podcast chạy nền (tắt màn hình vẫn phát)</span></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="ctrl-btn" onclick="showEnSub=!showEnSub;renderModeContent()">${svgIcon(showEnSub ? "eyeOff" : "eye", 14)}<span>${showEnSub ? "Ẩn Anh" : "Hiện Anh"}</span></button>
            <button type="button" class="ctrl-btn" onclick="toggleViSub()">${svgIcon(showViSub ? "eyeOff" : "eye", 14)}<span>${showViSub ? "Ẩn Việt" : "Hiện Việt"}</span></button>
          </div>
        </div>
        <div class="subs-list" id="subsList">${rowsHtml}</div>
      `;
      if (playbackSubIdx > 0) {
        requestAnimationFrame(() => highlightTranscriptRow(playbackSubIdx));
      }
    }

    function renderModeContent(opts) {
      const it = getActiveItem();
      if (!it) return;
      if (currentMode === "transcript") renderTranscriptMode(it);
      else if (currentMode === "shadowing") renderShadowingMode(it);
      else if (currentMode === "podcast") renderPodcastMode(it);
      else renderDictationMode(it, opts);

      const host = document.getElementById("modeContainer");
      const idx = ITEMS.findIndex(x => x.id === it.id);
      if (host && idx >= 0) {
        const prevIt = idx > 0 ? ITEMS[idx - 1] : null;
        const nextIt = idx + 1 < ITEMS.length ? ITEMS[idx + 1] : null;
        const escTitle = (s) => escHtml(s);
        const nav = document.createElement("div");
        nav.id = "tedLessonNav";
        nav.className = "ted-lesson-nav";
        nav.innerHTML = `
          <button type="button" class="ctrl-btn" id="btnPrevTedLesson" ${prevIt ? `onclick="stepLesson(-1)" title="Bài trước: ${escTitle(prevIt.title)}"` : 'disabled title="Đã ở bài đầu tiên"'}>${svgIcon("arrowLeft", 14)}<span>Bài trước</span></button>
          <span style="font-size:12px;font-weight:700;color:var(--lg-ink-muted);">Bài ${idx + 1}/${ITEMS.length}</span>
          <button type="button" class="ctrl-btn primary" id="btnNextTedLesson" ${nextIt ? `onclick="stepLesson(1)" title="Bài tiếp theo: ${escTitle(nextIt.title)}"` : 'disabled title="Đã ở bài cuối cùng"'}><span>Bài tiếp</span>${svgIcon("arrowRight", 14)}</button>
        `;
        host.appendChild(nav);
      }
    }

    let tedSearchTimer = null;
    window.clearTedSearch = function () {
      const inp = document.getElementById("searchInput");
      if (inp) {
        inp.value = "";
        if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
        try { inp.focus({ preventScroll: true }); } catch (e) {}
      }
      renderSidebar();
    };
    if (window.S4UI && typeof window.S4UI.bindSearchBar === "function") {
      window.S4UI.bindSearchBar({
        input: "searchInput",
        clearBtn: "searchInput_clear",
        searchBtn: "searchInput_btn",
        delay: 180,
        onSearch: () => { clearTimeout(tedSearchTimer); renderSidebar(); }
      });
    } else {
      document.getElementById("searchInput").oninput = () => {
        clearTimeout(tedSearchTimer);
        tedSearchTimer = setTimeout(renderSidebar, 180);
      };
    }
    setupPodcastEvents();
    setupTedVideoEvents();
    (function bootTedDeepLink() {
      let hasJump = false;
      let jumpIdx = -1;
      try {
        const sp = new URLSearchParams(window.location.search);
        const qParam = sp.get("q");
        if (qParam) {
          const inp = document.getElementById("searchInput");
          if (inp) {
            inp.value = qParam;
            if (window.S4UI && typeof window.S4UI.syncSearchClear === "function") window.S4UI.syncSearchClear(inp);
          }
        }
        const idParam = sp.get("id");
        if (idParam) {
          const found = ITEMS.find(x => x.id === idParam);
          if (found) {
            activeId = found.id;
            localStorage.setItem(STORAGE_LAST, activeId);
          }
        }
        const modeParam = sp.get("mode");
        if (modeParam && ["dictation", "transcript", "shadowing", "podcast"].includes(modeParam)) {
          currentMode = modeParam;
          document.querySelectorAll(".mode-pill").forEach(b => {
            b.classList.toggle("active", b.getAttribute("data-mode") === modeParam);
          });
          const ytWrap = document.getElementById("ytBoxWrap");
          const podWrap = document.getElementById("podcastBoxWrap");
          if (modeParam === "podcast") {
            if (ytWrap) ytWrap.style.display = "none";
            if (podWrap) podWrap.style.display = "block";
          } else {
            if (podWrap) podWrap.style.display = "none";
            if (ytWrap) ytWrap.style.display = "block";
          }
        }
        const subRaw = sp.get("sub");
        if (subRaw !== null && subRaw !== "") {
          const subNum = parseInt(subRaw, 10);
          const curIt = getActiveItem();
          if (Number.isFinite(subNum) && subNum >= 0 && curIt && Array.isArray(curIt.subs) && subNum < curIt.subs.length) {
            hasJump = true;
            jumpIdx = subNum;
            currentSubIdx = subNum;
            playbackSubIdx = subNum;
            saveSubPos();
          }
        } else if (idParam) {
          const curIt = getActiveItem();
          const saved = Number(posMap[activeId] || 0);
          currentSubIdx = (curIt && Array.isArray(curIt.subs) && saved >= 0 && saved < curIt.subs.length) ? saved : 0;
          playbackSubIdx = 0;
        }
      } catch (e) {}
      renderSidebar();
      setTimeout(() => {
        const act = document.querySelector("#lessonList .lesson-item.active");
        if (act) { try { act.scrollIntoView({ block: "center", behavior: "auto" }); } catch (e) {} }
      }, 50);
      loadActiveVideo(currentMode === "podcast");
      renderModeContent({ autoFocus: false });
      if (hasJump) {
        scheduleSubJump(activeId, jumpIdx, currentMode);
      }
    })();
  </script>
  <script src="../assets/ghibli/ghibli-theme.js?v=26"></script>
</body>
</html>
