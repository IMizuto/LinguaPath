<!DOCTYPE html>
<html lang="vi">
<head>
  <script>
  (function () {
    try {
      var s = localStorage.getItem("s4_theme_style");
      if (s === null) { s = "ghibli"; localStorage.setItem("s4_theme_style", "ghibli"); }
      var d = localStorage.getItem("s4_vocab_dark");
      if (d === null) { d = "1"; localStorage.setItem("s4_vocab_dark", "1"); }
      var isDark = (d === "1");
      var cl = document.documentElement.classList;
      if (s === "ghibli") cl.add("theme-ghibli"); else cl.remove("theme-ghibli");
      if (isDark) cl.add("dark"); else cl.remove("dark");
      var mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? (s === "ghibli" ? "#0d1813" : "#0f172a") : (s === "ghibli" ? "#efe8d5" : "#f1f5f9"));
    } catch (e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" id="metaThemeColor" content="#f1f5f9">
  <title>TED Talks English - Luyện Nghe & Shadowing (40 Bài)</title>
  
  <style>
    @view-transition { navigation: auto; }
    :root {

    html.dark, body.dark {

      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #ef4444;
      --primary-soft: #450a0a;
      --success: #22c55e;
      --success-soft: #052e16;
      --danger: #ef4444;
      --danger-soft: #450a0a;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; max-width: 100%; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

    .close-menu-btn { display: none; background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; font-size: 20px; cursor: pointer; }

    .mode-pills::-webkit-scrollbar { display: none; }
    .mode-pill { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease; }
    .mode-pill:hover { border-color: var(--primary); }

    @keyframes fadeSlideUp {

      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popCorrect {
      0% { transform: scale(0.95); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    @keyframes eqPulse {
      0%, 100% { height: 4px; }
      50% { height: 13px; }
    }

    .main { flex: 1; overflow-y: auto; padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)) 20px; -webkit-overflow-scrolling: touch; }
    .workspace { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 440px 1fr; gap: 18px; align-items: start; }
    .video-panel { min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
    .video-title { font-size: 16px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.35; }
    .yt-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
    .yt-box iframe { width: 100%; height: 100%; border: none; }
    .video-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn-done { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 700; font-size: 12.5px; cursor: pointer; transition: all 0.18s ease; }
    .btn-done:active { transform: scale(0.96); }
    .btn-done.completed { background: var(--success-soft); color: var(--success); border-color: var(--success); }

    .content-panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; min-width: 0; box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
    .ctrl-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .ctrl-btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
    .ctrl-btn:hover { border-color: var(--primary); }
    .ctrl-btn:active { transform: scale(0.96); }
    .ctrl-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(220,38,38,0.22); }
    .ctrl-select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; outline: none; }

    /* Mode 1: Transcript list */
    .subs-list { max-height: 62vh; overflow-y: auto; padding-right: 4px; animation: fadeSlideUp 0.22s ease; scroll-behavior: smooth; }
    .sub-item { padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; margin-bottom: 6px; cursor: pointer; transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease; display: flex; gap: 10px; align-items: flex-start; }
    .sub-item:hover { background: var(--bg); border-color: var(--border); transform: translateX(2px); }
    .sub-item.active { background: var(--primary-soft); border-color: var(--primary); box-shadow: 0 2px 10px rgba(220,38,38,0.1); }
    .sub-time { font-size: 11.5px; font-weight: 700; color: var(--primary); background: rgba(220,38,38,0.1); padding: 2px 7px; border-radius: 6px; flex-shrink: 0; margin-top: 2px; font-family: monospace; }
    .sub-en { font-size: 15px; font-weight: 700; line-height: 1.45; }
    .sub-vi { font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

    /* Mode 2: Dictation */
    .dic-box { padding: 6px 0; animation: fadeSlideUp 0.2s ease; }
    .dic-prog-track { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
    .dic-prog-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #f97316); border-radius: 999px; transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
    .dic-progress { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .dic-sentence { overflow-wrap: anywhere; font-size: 17px; line-height: 2.15; padding: 16px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; transition: border-color 0.2s ease; }
    .dic-input { padding: 5px 8px; font-size: 16px; font-weight: 700; border: 2px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); outline: none; text-align: center; margin: 2px 3px; transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; }
    .dic-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(220,38,38,0.14); }
    .dic-input.correct { border-color: var(--success) !important; background: var(--success-soft) !important; color: var(--success) !important; animation: popCorrect 0.24s ease; }
    .dic-input.wrong { border-color: var(--danger) !important; background: var(--danger-soft) !important; color: var(--danger) !important; animation: shakeWrong 0.26s ease; }
    .dic-full-input { width: 100%; padding: 12px 14px; font-size: 16px; font-weight: 600; border: 2px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .dic-full-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(220,38,38,0.14); }
    .dic-full-input.correct { border-color: var(--success) !important; background: var(--success-soft) !important; color: var(--success) !important; animation: popCorrect 0.24s ease; }
    .dic-full-input.wrong { border-color: var(--danger) !important; background: var(--danger-soft) !important; color: var(--danger) !important; animation: shakeWrong 0.26s ease; }
    .dic-vi-hint { font-size: 14px; color: var(--muted); padding: 10px 12px; border-left: 3px solid var(--primary); background: var(--bg); border-radius: 6px; margin-bottom: 12px; }
    .dic-ans-reveal { font-size: 14.5px; font-weight: 700; color: var(--success); margin-top: 8px; min-height: 20px; }

    /* Mode 3: Shadowing */
    .shad-card { padding: 20px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 12px; animation: fadeSlideUp 0.22s ease; }
    .shad-en { font-size: 20px; font-weight: 800; line-height: 1.65; margin-bottom: 10px; }
    .shad-vi { font-size: 14.5px; color: var(--muted); margin-bottom: 8px; }
    .shad-word { display: inline-block; padding: 2px 5px; border-radius: 6px; margin: 1px 1px; cursor: pointer; border-bottom: 1px dashed rgba(148,163,184,0.4); transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease; }
    .shad-word:hover { background: rgba(220,38,38,0.12); transform: translateY(-1px); }
    .shad-word.ok { color: var(--success); background: var(--success-soft); border-bottom-color: var(--success); animation: popCorrect 0.22s ease; }
    .shad-word.miss { color: var(--danger); background: var(--danger-soft); text-decoration: underline; border-bottom-color: var(--danger); }
    .rec-btn { padding: 11px 22px; border-radius: 999px; border: none; background: var(--primary); color: #fff; font-weight: 800; font-size: 14.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .rec-btn:active { transform: scale(0.96); }
    .rec-btn.recording { background: #dc2626; animation: pulseRec 1.1s infinite; }
    .shad-live-box { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); font-size: 14px; min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    @keyframes pulseRec { 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); } 50% { box-shadow: 0 0 0 10px rgba(220,38,38,0); } }

    /* Mode 4: Podcast Background Player */
    .podcast-box { display: none; background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); color: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #334155; animation: fadeSlideUp 0.22s ease; }
    .podcast-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .podcast-thumb { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(239,68,68,0.6); flex-shrink: 0; background: #000; transition: transform 0.3s ease; }
    .podcast-box.playing .podcast-thumb { border-color: #4ade80; box-shadow: 0 0 14px rgba(74,222,128,0.28); }
    .podcast-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #4ade80; background: rgba(34,197,94,0.16); padding: 3px 9px; border-radius: 999px; margin-bottom: 4px; }
    .eq-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }

    .podcast-box.playing .eq-bar:nth-child(2) { animation: eqPulse 0.42s infinite ease-in-out 0.15s; }
    .podcast-box.playing .eq-bar:nth-child(3) { animation: eqPulse 0.65s infinite ease-in-out 0.08s; }
    .podcast-seek { width: 100%; accent-color: #ef4444; cursor: pointer; margin: 6px 0 4px 0; height: 6px; }
    .podcast-time-row { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; font-family: monospace; margin-bottom: 10px; }
    .podcast-ctrls { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pod-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 8px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; }
    .pod-btn:hover { background: rgba(255,255,255,0.18); }
    .pod-btn:active { transform: scale(0.95); }
    .pod-btn.play-main { background: #ef4444; border-color: #ef4444; padding: 9px 18px; font-size: 14px; border-radius: 999px; box-shadow: 0 4px 12px rgba(239,68,68,0.35); }
    .pod-sub-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #cbd5e1; flex-wrap: wrap; }

    .s4-toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 9999; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.18); pointer-events: none; opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease; }
    .s4-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .s4-toast.good { background: #16a34a; }
    .s4-toast.warn { background: #dc2626; }

    .ted-engine-bar { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .engine-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .engine-btn { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease; }
    .engine-btn:hover { border-color: var(--primary); }
    .engine-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .engine-btn.ext { color: #ef4444; border-color: rgba(239, 68, 68, 0.35); }
    .engine-status { display: none; font-size: 11.5px; color: #d97706; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); padding: 5px 10px; border-radius: 8px; line-height: 1.35; }

    @media (max-width: 900px) {

                    <div class="yt-box" id="ytBoxWrap">

                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1.0x</option>

                  <option value="1.5">1.5x</option>

            <span style="font-size:12.5px;color:var(--muted);font-weight:600;" id="videoMetaInfo">0 câu phụ đề</span>
            <button class="btn-done" id="btnDoneLesson" onclick="toggleDoneCurrent()">⬜ Đánh dấu hoàn thành</button>

        <!-- Cột phải: Nội dung luyện tập theo chế độ -->

  <script src="tedtalks_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <!-- YouTube API lazy-loaded on demand when user switches to YouTube engine -->
  <script>
    const ITEMS = window.STUDY4_TED_DATA || [];
    const STORAGE_DONE = "s4_ted_done";
    const STORAGE_LAST = "s4_ted_last";
    const STORAGE_POS = "s4_ted_pos";

    let doneMap = JSON.parse(localStorage.getItem(STORAGE_DONE) || "{}");
    let posMap = JSON.parse(localStorage.getItem(STORAGE_POS) || "{}");
    let activeId = localStorage.getItem(STORAGE_LAST) || (ITEMS[0] && ITEMS[0].id);
    let unitFilter = "ALL";
    let currentMode = "dictation"; // 'dictation' | 'transcript' | 'shadowing' | 'podcast'
    let currentSubIdx = Math.max(0, Number(posMap[activeId] || 0));
    let dicLevel = "word"; // 'word' | 'word_hard' | 'sentence'
    let showEnSub = true;
    let showViSub = localStorage.getItem("s4_ted_show_vi") !== "0";
    let autoPauseSentence = true;
    let repeatSentence = false;
    let segmentEndSec = null;

    function saveSubPos() {
      if (!activeId) return;
      posMap[activeId] = currentSubIdx;
      try { localStorage.setItem(STORAGE_POS, JSON.stringify(posMap)); } catch (e) {}
    }

    function toggleViSub() {
      showViSub = !showViSub;
      localStorage.setItem("s4_ted_show_vi", showViSub ? "1" : "0");
      renderModeContent();
    }

    let ytPlayer = null;
    let ytReady = false;
    let syncTimer = null;

    function toggleDark() {
      const isDark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", isDark);
      document.body.classList.toggle("dark", isDark);
      localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0");
      const mt = document.getElementById("metaThemeColor");
      if (mt) mt.setAttribute("content", isDark ? "#0f172a" : "#f1f5f9");
    }

    function toggleMenu(open) {
      document.getElementById("sidebar").classList.toggle("open", open);
      document.getElementById("sidebarBackdrop").classList.toggle("open", open);
      document.body.classList.toggle("sidebar-open", open);
    }

    let toastTimer = null;
    function showToast(good, text) {
      let t = document.getElementById("s4TedToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4TedToast";
        document.body.appendChild(t);
      }
      if (toastTimer) clearTimeout(toastTimer);
      t.className = "s4-toast " + (good ? "good" : "warn");
      t.textContent = text;
      requestAnimationFrame(() => t.classList.add("show"));
      toastTimer = setTimeout(() => t.classList.remove("show"), good ? 1100 : 1800);
    }

    function fmtTime(ms) {
      const totalSec = Math.max(0, Math.floor((ms || 0) / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m + ":" + (s < 10 ? "0" + s : s);
    }

    function getActiveItem() {
      return ITEMS.find(x => x.id === activeId) || ITEMS[0];
    }

    function setUnitFilter(f, btn) {
      unitFilter = f;
      document.querySelectorAll(".unit-tab").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderSidebar();
    }

    function renderSidebar() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const listEl = document.getElementById("lessonList");
      const filtered = ITEMS.filter(it => {
        if (unitFilter === "Short" && !it.unit.includes("Short")) return false;
        if (unitFilter === "Long" && !it.unit.includes("Long")) return false;
        if (q && !it.title.toLowerCase().includes(q)) return false;
        return true;
      });

      const byUnit = {};
      filtered.forEach(it => {
        if (!byUnit[it.unit]) byUnit[it.unit] = [];
        byUnit[it.unit].push(it);
      });

      let html = "";
      Object.keys(byUnit).forEach(uName => {
        const arr = byUnit[uName];
        const doneCnt = arr.filter(x => doneMap[x.id]).length;
        html += `<div class="unit-title"><span>${uName}</span><span>${doneCnt}/${arr.length}</span></div>`;
        arr.forEach(it => {
          const isAct = it.id === activeId;
          const isDone = !!doneMap[it.id];
          const savedIdx = Number(posMap[it.id] || 0);
          const progBadge = isDone ? `<span class="done-dot">✔</span>` : (savedIdx > 0 ? `<span style="font-size:11px;opacity:0.75;flex-shrink:0;">${savedIdx + 1}/${it.subs.length}</span>` : "");
          html += `<div class="lesson-item ${isAct ? "active" : ""}" onclick="selectLesson('${it.id}')">
            <span style="overflow:hidden;text-overflow:ellipsis;">${it.index}. ${it.title}</span>
            ${progBadge}
          </div>`;
        });
      });
      listEl.innerHTML = html || `<div style="padding:16px;text-align:center;color:var(--muted);">Không tìm thấy bài nào.</div>`;
    }

    function selectLesson(id, autoPlayPodcast) {
      activeId = id;
      localStorage.setItem(STORAGE_LAST, id);
      const it = getActiveItem();
      const saved = Number(posMap[id] || 0);
      currentSubIdx = (it && saved >= 0 && saved < it.subs.length) ? saved : 0;
      segmentEndSec = null;
      toggleMenu(false);
      renderSidebar();
      loadActiveVideo(autoPlayPodcast);
      renderModeContent();
    }

    function stepLesson(delta, autoPlayPodcast) {
      const idx = ITEMS.findIndex(x => x.id === activeId);
      if (idx < 0) return;
      const nextIdx = (idx + delta + ITEMS.length) % ITEMS.length;
      selectLesson(ITEMS[nextIdx].id, autoPlayPodcast !== undefined ? autoPlayPodcast : (currentMode === "podcast"));
    }

    function toggleDoneCurrent() {
      const it = getActiveItem();
      if (!it) return;
      doneMap[it.id] = !doneMap[it.id];
      if (!doneMap[it.id]) delete doneMap[it.id];
      localStorage.setItem(STORAGE_DONE, JSON.stringify(doneMap));
      updateDoneBtn();
      renderSidebar();
    }

    function updateDoneBtn() {
      const it = getActiveItem();
      const btn = document.getElementById("btnDoneLesson");
      if (!it || !btn) return;
      const done = !!doneMap[it.id];
      btn.className = "btn-done" + (done ? " completed" : "");
      btn.textContent = done ? "✅ Đã hoàn thành" : "⬜ Đánh dấu hoàn thành";
    }

    function switchMode(m) {
      currentMode = m;
      segmentEndSec = null;
      document.querySelectorAll(".mode-pill").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-mode") === m);
      });
      const ytWrap = document.getElementById("ytBoxWrap");
      const podWrap = document.getElementById("podcastBoxWrap");
      const bgAudio = document.getElementById("bgPodcastAudio");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (m === "podcast") {
        if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
          try { ytPlayer.pauseVideo(); } catch (e) {}
        }
        if (tedVid && !tedVid.paused) {
          try { tedVid.pause(); } catch (e) {}
        }
        if (ytWrap) ytWrap.style.display = "none";
        if (podWrap) podWrap.style.display = "block";
        loadPodcastStream(getActiveItem(), true);
      } else {
        if (bgAudio && !bgAudio.paused) {
          try { bgAudio.pause(); } catch (e) {}
        }
        if (podWrap) podWrap.style.display = "none";
        if (ytWrap) ytWrap.style.display = "block";
      }
      renderModeContent();
    }

    /* ---------- Dual-Engine Player: YouTube + Native TED CDN Stream ---------- */
    let currentEngine = "ted"; // "ted" (mac dinh) | "yt"
    let ytWanted = false;
    let ytError = false;

    function focusCurrentDicInput() {
      if (currentMode !== "dictation") return;
      const box = document.getElementById("modeContainer");
      if (!box) return;
      const target = box.querySelector(".dic-input:not(.correct), .dic-full-input:not(.correct)") || box.querySelector(".dic-input, .dic-full-input");
      if (target) { try { target.focus({ preventScroll: true }); } catch (e) {} }
    }

    function tedVideoUrl(it) {
      if (!it) return "";
      const a = it.audioHls || it.hls || "";
      if (a) return a.replace(/index-f\d+-a\d+\.m3u8.*$/, "manifest.m3u8");
      return it.mp4 || "";
    }
    let tedHls = null;
    let tedVidLoadedUrl = "";
    function loadTedVideo(vid, it) {
      const url = tedVideoUrl(it);
      if (!vid || !url || tedVidLoadedUrl === url) return;
      tedVidLoadedUrl = url;
      if (tedHls) { try { tedHls.destroy(); } catch (e) {} tedHls = null; }
      if (/\.m3u8/.test(url) && window.Hls && Hls.isSupported()) {
        tedHls = new Hls({ enableWorker: true, maxBufferLength: 20, maxMaxBufferLength: 40 });
        tedHls.loadSource(url);
        tedHls.attachMedia(vid);
      } else {
        vid.src = url;
        vid.load();
      }
    }
    function ensureYouTubeApi() {
      if (window.YT && window.YT.Player) { if (!ytPlayer) window.onYouTubeIframeAPIReady(); return; }
      if (document.getElementById("ytApiScript")) return;
      const s = document.createElement("script");
      s.id = "ytApiScript";
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }

    function setMediaEngine(eng, isAutoFallback) {
      currentEngine = eng;
      const it = getActiveItem();
      const btnYt = document.getElementById("btnEngYt");
      const btnTed = document.getElementById("btnEngTed");
      const statusEl = document.getElementById("tedEngineStatus");
      if (btnYt) btnYt.classList.toggle("active", eng === "yt");
      if (btnTed) btnTed.classList.toggle("active", eng === "ted");

      if (eng === "ted") {
        if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
          try { ytPlayer.pauseVideo(); } catch (e) {}
        }
        showTedPlayerUI();
        if (statusEl) {
          statusEl.style.display = "block";
          statusEl.innerHTML = isAutoFallback
            ? "⚠️ YouTube bị hạn chế nhúng (Lỗi 150) — Đã chuyển sang luồng TED gốc ổn định 100%!"
            : "📻 Đang phát qua luồng TED Video/Audio gốc từ máy chủ TED CDN.";
        }
        if (isAutoFallback) showToast(false, "Đã chuyển sang luồng TED gốc!");
      } else {
        ytError = false;
        const tedVid = document.getElementById("tedVideoPlayer");
        if (tedVid && !tedVid.paused) {
          try { tedVid.pause(); } catch (e) {}
        }
        showYtPlayerUI();
        if (statusEl) statusEl.style.display = "none";
        if (ytReady && ytPlayer && ytPlayer.cueVideoById && it) {
          try { ytPlayer.cueVideoById(it.youtubeId); } catch (e) {}
        }
      }
    }

    function showTedPlayerUI() {
      const ytBox = document.getElementById("ytPlayer");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (ytBox) ytBox.style.display = "none";
      if (tedVid) {
        tedVid.style.display = "block";
        const it = getActiveItem();
        loadTedVideo(tedVid, it);
      }
    }

    function showYtPlayerUI() {
      const ytBox = document.getElementById("ytPlayer");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (ytBox) ytBox.style.display = "block";
      if (tedVid) tedVid.style.display = "none";
    }

    window.onYouTubeIframeAPIReady = function () {
      if (currentEngine === "ted" && !ytWanted) return;
      const it = getActiveItem();
      if (!it) return;
      const pVars = { rel: 0, modestbranding: 1, playsinline: 1 };
      // origin omitted to prevent YouTube postMessage mismatch warnings on GitHub Pages
      try {
        ytPlayer = new YT.Player("ytPlayer", {
          videoId: it.youtubeId,
          playerVars: pVars,
          events: {
            onReady: () => {
              ytReady = true;
              ytError = false;
              startSyncLoop();
              if (currentEngine === "ted" && !ytWanted && ytPlayer && ytPlayer.pauseVideo) {
                try { ytPlayer.pauseVideo(); } catch (e) {}
              }
            },
            onStateChange: (ev) => {
              if (ev && ev.data === 1 && (currentMode === "dictation" || currentMode === "shadowing")) {
                const curIt = getActiveItem();
                const curSub = curIt && curIt.subs[currentSubIdx];
                const nextSub = curIt && curIt.subs[currentSubIdx + 1];
                if (curSub) {
                  const startSec = Math.max(0, (curSub.time || 0) / 1000 - 0.08);
                  const endSec = nextSub ? (nextSub.time / 1000 - 0.04) : null;
                  if (autoPauseSentence) segmentEndSec = endSec;
                  const nowSec = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
                  if (nowSec < startSec - 0.6 || (endSec !== null && nowSec >= endSec - 0.15)) {
                    ytPlayer.seekTo(startSec, true);
                  }
                }
                setTimeout(focusCurrentDicInput, 60);
              }
            },
            onError: (ev) => {
              console.warn("YouTube Player error:", ev && ev.data);
              ytError = true;
              setMediaEngine("ted", true);
            }
          }
        });
      } catch (err) {
        console.warn("YT.Player init failed:", err);
        ytError = true;
        setMediaEngine("ted", true);
      }
    };

    if (window.YT && window.YT.Player) {
      window.onYouTubeIframeAPIReady();
    }

    function loadActiveVideo(autoPlayPodcast) {
      const it = getActiveItem();
      if (!it) return;
      document.getElementById("videoTitle").textContent = it.title;
      document.getElementById("videoMetaInfo").textContent = `${it.unit} • ${it.subs.length} câu phụ đề`;
      updateDoneBtn();

      const extBtn = document.getElementById("btnEngExtYt");
      if (extBtn) extBtn.href = `https://www.youtube.com/watch?v=${it.youtubeId}`;

      const tedVid = document.getElementById("tedVideoPlayer");
      if (tedVid && it.mp4) {
        tedVid.src = it.mp4;
        tedVid.load();
      }

      if (currentMode === "podcast") {
        loadPodcastStream(it, !!autoPlayPodcast);
      } else if (currentEngine === "ted") {
        showTedPlayerUI();
      } else if (ytReady && ytPlayer && ytPlayer.cueVideoById) {
        try { ytPlayer.cueVideoById(it.youtubeId); } catch (e) {}
      }
    }

    function playSubSegment(idx) {
      const it = getActiveItem();
      if (!it || !it.subs[idx]) return;
      const cur = it.subs[idx];
      const next = it.subs[idx + 1];
      const startSec = Math.max(0, (cur.time || 0) / 1000 - 0.08);
      segmentEndSec = (autoPauseSentence && next) ? (next.time / 1000 - 0.04) : null;

      if (currentEngine === "ted" || !ytReady || ytError) {
        if (currentEngine !== "ted") setMediaEngine("ted", true);
        const tedVid = document.getElementById("tedVideoPlayer");
        const bgAudio = document.getElementById("bgPodcastAudio");
        const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
        const offsetSec = Number(it.podOffsetMs || 0) / 1000;
        if (activeMedia) {
          activeMedia.currentTime = Math.max(0, startSec + offsetSec);
          activeMedia.play().catch(() => {});
        }
      } else if (ytReady && ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(startSec, true);
        ytPlayer.playVideo();
      }
      setTimeout(focusCurrentDicInput, 60);
    }

    function startSyncLoop() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(() => {
        const it = getActiveItem();
        if (!it || !it.subs || !it.subs.length) return;

        let sec = -1;
        let isPlaying = false;

        if (currentEngine === "ted" || currentMode === "podcast" || !ytReady || ytError) {
          const tedVid = document.getElementById("tedVideoPlayer");
          const bgAudio = document.getElementById("bgPodcastAudio");
          const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
          if (activeMedia && !activeMedia.paused) {
            isPlaying = true;
            const offsetSec = Number(it.podOffsetMs || 0) / 1000;
            sec = Math.max(0, activeMedia.currentTime - offsetSec);
          }
        } else if (ytReady && ytPlayer && typeof ytPlayer.getCurrentTime === "function") {
          const state = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
          if (state === 1) {
            isPlaying = true;
            sec = ytPlayer.getCurrentTime();
          }
        }

        if (!isPlaying || sec < 0) return;

        // Auto pause on end of sentence (Dictation & Shadowing)
        if ((currentMode === "dictation" || currentMode === "shadowing") && autoPauseSentence) {
          const curSub = it.subs[currentSubIdx];
          const nextSub = it.subs[currentSubIdx + 1];
          const cutoff = segmentEndSec !== null ? segmentEndSec : (nextSub ? (nextSub.time / 1000 - 0.04) : null);
          if (cutoff !== null && sec >= cutoff) {
            if (repeatSentence && curSub) {
              const repeatStart = Math.max(0, (curSub.time || 0) / 1000 - 0.08);
              if (currentEngine === "ted" || currentMode === "podcast" || !ytReady) {
                const tedVid = document.getElementById("tedVideoPlayer");
                const bgAudio = document.getElementById("bgPodcastAudio");
                const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
                const offsetSec = Number(it.podOffsetMs || 0) / 1000;
                if (activeMedia) activeMedia.currentTime = repeatStart + offsetSec;
              } else {
                ytPlayer.seekTo(repeatStart, true);
              }
            } else {
              if (currentEngine === "ted" || currentMode === "podcast" || !ytReady) {
                const tedVid = document.getElementById("tedVideoPlayer");
                const bgAudio = document.getElementById("bgPodcastAudio");
                const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
                if (activeMedia) activeMedia.pause();
              } else {
                ytPlayer.pauseVideo();
              }
              segmentEndSec = null;
              focusCurrentDicInput();
              if (currentMode === "shadowing" && pendingAutoRecordAfterListen) {
                pendingAutoRecordAfterListen = false;
                setTimeout(() => {
                  if (currentMode === "shadowing" && !activeRec) toggleShadowRecord();
                }, 220);
              }
            }
            return;
          }
        }

        // Subtitle highlight tracking
        if (currentMode === "transcript" || !autoPauseSentence) {
          const ms = sec * 1000;
          let foundIdx = 0;
          for (let i = 0; i < it.subs.length; i++) {
            if (ms >= it.subs[i].time) foundIdx = i;
            else break;
          }
          if (foundIdx !== currentSubIdx) {
            currentSubIdx = foundIdx;
            if (currentMode === "transcript") highlightTranscriptRow(foundIdx);
            else renderModeContent();
          }
        }
      }, 80);
    }

    function highlightTranscriptRow(idx) {
      const rows = document.querySelectorAll(".sub-item");
      rows.forEach((r, i) => r.classList.toggle("active", i === idx));
      const activeRow = rows[idx];
      if (activeRow) {
        activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    /* ---------- Chế độ 1: Nghe & Transcript ---------- */
    function renderTranscriptMode(it) {
      const box = document.getElementById("modeContainer");
      const rowsHtml = it.subs.map((s, idx) => `
        <div class="sub-item ${idx === currentSubIdx ? "active" : ""}" onclick="clickTranscriptRow(${idx})">

            ${showEnSub ? `<div class="sub-en">${s.en}</div>` : `<div class="sub-en" style="color:var(--muted);">••• (Đã ẩn phụ đề Anh)</div>`}
            ${showViSub && s.vi ? `<div class="sub-vi">${s.vi}</div>` : ""}

      `).join("");

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="font-weight:800;font-size:14px;">🎧 Bấm vào câu bất kỳ để tua Video tới câu đó</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="ctrl-btn" onclick="showEnSub=!showEnSub;renderModeContent()">${showEnSub ? "👁️ Ẩn tiếng Anh" : "👁️ Hiện tiếng Anh"}</button>
            <button class="ctrl-btn" onclick="toggleViSub()">${showViSub ? "🇻🇳 Ẩn nghĩa Việt" : "🇻🇳 Hiện nghĩa Việt"}</button>
          </div>

      `;
    }

    function clickTranscriptRow(idx) {
      const it = getActiveItem();
      if (!it || !it.subs[idx]) return;
      currentSubIdx = idx;
      saveSubPos();
      segmentEndSec = null;
      highlightTranscriptRow(idx);

      const startSec = Math.max(0, it.subs[idx].time / 1000);
      if (currentMode === "podcast" || currentEngine === "ted" || !ytReady || ytError) {
        if (currentEngine !== "ted" && currentMode !== "podcast") setMediaEngine("ted", true);
        const tedVid = document.getElementById("tedVideoPlayer");
        const bgAudio = document.getElementById("bgPodcastAudio");
        const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
        const offsetSec = Number(it.podOffsetMs || 0) / 1000;
        if (activeMedia) {
          activeMedia.currentTime = Math.max(0, startSec + offsetSec);
          activeMedia.play().catch(() => {});

        ytPlayer.seekTo(startSec, true);
        ytPlayer.playVideo();
      }
    }

    /* ---------- Chế độ 2: Chép chính tả (Dictation) ---------- */
    function buildDictationTokens(sentence, idx, level) {
      const words = sentence.trim().split(/\s+/);
      let lastBlank = false;
      let blankCount = 0;
      const tokens = words.map((rawW, wIdx) => {
        const m = rawW.match(/^([^A-Za-z0-9'’‘]*)([A-Za-z0-9'’‘-]+)([^A-Za-z0-9'’‘]*)$/);
        if (!m) { lastBlank = false; return { isBlank: false, raw: rawW }; }
        const prefix = m[1], clean = m[2], suffix = m[3];
        if (clean.length <= 2 && words.length > 3) { lastBlank = false; return { isBlank: false, raw: rawW }; }
        const hash = (idx * 31 + wIdx * 17 + clean.charCodeAt(0)) % 10;
        let hide = false;
        if (level === "word_hard") {
          hide = hash < 6;
        } else {
          // Chế độ Trung bình: không ẩn 2 từ sát nhau, ưu tiên từ dài
          hide = !lastBlank && (hash < 3);
        }
        if (hide) blankCount++;
        lastBlank = hide;
        return { isBlank: hide, prefix, answer: clean, suffix, raw: rawW };
      });
      // Đảm bảo ít nhất 1 ô trống trong câu
      if (blankCount === 0 && tokens.length > 0) {
        const cand = tokens.findIndex(t => t.answer && t.answer.length > 2);
        const pick = cand >= 0 ? cand : tokens.findIndex(t => t.answer);
        if (pick >= 0) tokens[pick].isBlank = true;
      }
      return tokens;
    }

    function renderDictationMode(it) {
      const box = document.getElementById("modeContainer");
      const sub = it.subs[currentSubIdx] || { time: 0, en: "", vi: "" };
      const progPct = it.subs.length ? Math.round(((currentSubIdx + 1) / it.subs.length) * 100) : 0;

      let inputAreaHtml = "";
      if (dicLevel === "sentence") {
        inputAreaHtml = `
          <div class="dic-sentence">
            <input type="text" id="dicFullInput" class="dic-full-input" placeholder="Nghe và gõ lại cả câu tiếng Anh..." autocomplete="off" spellcheck="false" onkeydown="handleDicKey(event, this)">
          </div>`;
      } else {
        const tokens = buildDictationTokens(sub.en, currentSubIdx, dicLevel);
        inputAreaHtml = `<div class="dic-sentence">` + tokens.map(tk => {
          if (!tk.isBlank) return `<span>${tk.raw} </span>`;
          const w = Math.max(66, tk.answer.length * 10 + 18);
          return `${tk.prefix}<input type="text" class="dic-input" data-ans="${tk.answer.replace(/"/g, "&quot;")}" style="width:${w}px;" autocomplete="off" spellcheck="false" oninput="handleDicInput(this)" onkeydown="handleDicKey(event, this)">${tk.suffix} `;
        }).join("") + `</div>`;
      }

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <select class="ctrl-select" onchange="dicLevel=this.value;renderModeContent()">
              <option value="word" ${dicLevel === "word" ? "selected" : ""}>Điền từ (Trung bình)</option>
              <option value="word_hard" ${dicLevel === "word_hard" ? "selected" : ""}>Điền từ (Khó)</option>
              <option value="sentence" ${dicLevel === "sentence" ? "selected" : ""}>Chép cả câu</option>
            </select>
            <button class="ctrl-btn" onclick="toggleViSub()" title="Bật/Tắt phụ đề nghĩa Tiếng Việt">${showViSub ? "🇻🇳 Nghĩa Việt: Bật" : "🇻🇳 Nghĩa Việt: Tắt"}</button>
            <button class="ctrl-btn" onclick="autoPauseSentence=!autoPauseSentence;renderModeContent()" title="Tự động dừng video khi hết câu để điền từ">${autoPauseSentence ? "⏸️ Dừng từng câu: Bật" : "▶️ Chạy liên tục"}</button>
            <button class="ctrl-btn" onclick="repeatSentence=!repeatSentence;renderModeContent()" title="Tự động phát lặp lại câu hiện tại">${repeatSentence ? "🔁 Lặp câu: Bật" : "🔁 Lặp câu: Tắt"}</button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="ctrl-btn" onclick="stepSub(-1)">◀ Câu trước</button>
            <button class="ctrl-btn primary" onclick="playSubSegment(currentSubIdx)">🔊 Nghe câu này (${fmtTime(sub.time)})</button>
            <button class="ctrl-btn" onclick="stepSub(1)">Câu sau ▶</button>
          </div>
        </div>

        <div class="dic-box">
          <div class="dic-prog-track"><div class="dic-prog-fill" style="width:${progPct}%"></div></div>
          <div class="dic-progress">
            <span>Câu ${currentSubIdx + 1} / ${it.subs.length} (${progPct}%)</span>
            <span>Space/Tab: Ô kế • Enter: Kiểm tra • Phím \\: Nghe lại</span>
          </div>
          ${(showViSub && sub.vi) ? `<div class="dic-vi-hint">🇻🇳 Nghĩa: <b>${sub.vi}</b></div>` : ""}
          ${inputAreaHtml}
          <div class="dic-ans-reveal" id="dicAnsReveal"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
            <button class="ctrl-btn primary" onclick="checkDictation()">✔️ Kiểm tra</button>
            <button class="ctrl-btn" onclick="revealDictation()">🏳️ Đáp án</button>
            <button class="ctrl-btn" onclick="renderModeContent()">🔄 Xoá làm lại</button>
          </div>
        </div>
      `;

      const firstInp = box.querySelector(".dic-input, .dic-full-input");
      if (firstInp) { try { firstInp.focus({ preventScroll: true }); } catch (e) {} }
    }

    let autoNextTimer = null;
    function clearAutoNext() {
      if (autoNextTimer) {
        clearTimeout(autoNextTimer);
        autoNextTimer = null;
      }
    }

    function triggerAutoAdvance() {
      clearAutoNext();
      const it = getActiveItem();
      if (!it || currentSubIdx >= it.subs.length - 1) {
        showToast(true, "🎉 Đã hoàn thành câu cuối của bài!");
        return;
      }
      showToast(true, "✓ Chính xác — Tự chuyển câu tiếp...");
      autoNextTimer = setTimeout(() => {
        autoNextTimer = null;
        stepSub(1);
      }, 900);
    }

    function handleDicInput(el) {
      if (!el) return;
      // Không tự chấm khi đang gõ; chỉ xoá màu xanh/đỏ cũ nếu người dùng sửa lại chữ trong ô
      el.classList.remove("correct", "wrong");
    }

    function handleDicKey(ev, el) {
      if (ev.key === "\\") {
        ev.preventDefault();
        playSubSegment(currentSubIdx);
        return;
      }
      if (ev.key === "Enter") {
        ev.preventDefault();
        const allInps = [...document.querySelectorAll(".dic-input, .dic-full-input")];
        if (allInps.length && allInps.every(i => i.classList.contains("correct"))) {
          clearAutoNext();
          stepSub(1);
          return;
        }
        checkDictation();
        return;
      }
      if (dicLevel !== "sentence" && (ev.key === " " || ev.key === "Tab") && !ev.shiftKey) {
        const inputs = [...document.querySelectorAll(".dic-input")];
        const idx = inputs.indexOf(el);
        if (idx >= 0 && idx < inputs.length - 1) {
          ev.preventDefault();
          inputs[idx + 1].focus();
        }
        return;
      }
      if (dicLevel !== "sentence" && ev.key === "Backspace" && el.value === "") {
        const inputs = [...document.querySelectorAll(".dic-input")];
        const idx = inputs.indexOf(el);
        if (idx > 0) {
          ev.preventDefault();
          inputs[idx - 1].focus();
        }
      }
    }

    function normWord(s) {
      return (s || "").toLowerCase().replace(/[’‘']/g, "").replace(/[^a-z0-9]/g, "").trim();
    }

    function checkDictation() {
      const it = getActiveItem();
      const sub = it && it.subs[currentSubIdx];
      if (!sub) return;

      if (dicLevel === "sentence") {
        const inp = document.getElementById("dicFullInput");
        if (!inp) return;
        const ok = normWord(inp.value) === normWord(sub.en);
        inp.classList.remove("correct", "wrong");
        inp.classList.add(ok ? "correct" : "wrong");
        document.getElementById("dicAnsReveal").textContent = ok ? "" : "Đáp án: " + sub.en;
        if (ok) triggerAutoAdvance();
        else showToast(false, "✗ Chưa đúng");
        return;
      }

      const inputs = [...document.querySelectorAll(".dic-input")];
      if (!inputs.length) return;
      let allOk = true;
      let firstWrong = null;
      inputs.forEach(inp => {
        const ans = inp.getAttribute("data-ans") || "";
        const ok = normWord(inp.value) === normWord(ans);
        inp.classList.remove("correct", "wrong");
        inp.classList.add(ok ? "correct" : "wrong");
        if (!ok) {
          allOk = false;
          if (!firstWrong) firstWrong = inp;
        }
      });
      document.getElementById("dicAnsReveal").textContent = allOk ? "" : "Đáp án: " + sub.en;
      if (allOk) {
        triggerAutoAdvance();
      } else {
        showToast(false, "✗ Xem các ô tô đỏ");
        if (firstWrong) firstWrong.focus();
      }
    }

    function revealDictation() {
      clearAutoNext();
      const it = getActiveItem();
      const sub = it && it.subs[currentSubIdx];
      if (!sub) return;
      const fullInp = document.getElementById("dicFullInput");
      if (fullInp) {
        fullInp.value = sub.en;
        fullInp.classList.remove("wrong");
        fullInp.classList.add("correct");
      }
      document.querySelectorAll(".dic-input").forEach(inp => {
        inp.value = inp.getAttribute("data-ans") || "";
        inp.classList.remove("wrong");
        inp.classList.add("correct");
      });
      document.getElementById("dicAnsReveal").textContent = "Đáp án: " + sub.en;
    }

    function stepSub(delta) {
      clearAutoNext();
      stopShadowRecording(false);
      const it = getActiveItem();
      if (!it || !it.subs.length) return;
      currentSubIdx = Math.max(0, Math.min(it.subs.length - 1, currentSubIdx + delta));
      saveSubPos();
      renderSidebar();
      renderModeContent();
      playSubSegment(currentSubIdx);
    }

    /* ---------- Chế độ 3: Shadowing (Real-time SpeechRecognition + MediaRecorder Voice Playback) ---------- */
    let activeRec = null;
    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];
    let recordedBlobUrl = "";
    let shadAccumFinal = "";
    let shadSilenceTimer = null;
    let pendingAutoRecordAfterListen = false;
    let lastShadowEval = null; // { transcript, pct, matched, total }

    const CONTRACTION_MAP = {
      "im": ["i", "am"],
      "youre": ["you", "are"],
      "were": ["we", "are"],
      "theyre": ["they", "are"],
      "hes": ["he", "is"],
      "shes": ["she", "is"],
      "its": ["it", "is"],
      "thats": ["that", "is"],
      "theres": ["there", "is"],
      "whats": ["what", "is"],
      "whos": ["who", "is"],
      "ive": ["i", "have"],
      "youve": ["you", "have"],
      "weve": ["we", "have"],
      "theyve": ["they", "have"],
      "ill": ["i", "will"],
      "youll": ["you", "will"],
      "well": ["we", "will"],
      "theyll": ["they", "will"],
      "id": ["i", "would"],
      "youd": ["you", "would"],
      "dont": ["do", "not"],
      "doesnt": ["does", "not"],
      "didnt": ["did", "not"],
      "cant": ["cannot", "can", "not"],
      "cannot": ["cant", "can", "not"],
      "wont": ["will", "not"],
      "wouldnt": ["would", "not"],
      "couldnt": ["could", "not"],
      "shouldnt": ["should", "not"],
      "isnt": ["is", "not"],
      "arent": ["are", "not"],
      "wasnt": ["was", "not"],
      "werent": ["were", "not"],
      "hasnt": ["has", "not"],
      "havent": ["have", "not"],
      "hadnt": ["had", "not"],
      "gonna": ["going", "to"],
      "wanna": ["want", "to"],
      "1": ["one"], "2": ["two"], "3": ["three"], "4": ["four"], "5": ["five"],
      "6": ["six"], "7": ["seven"], "8": ["eight"], "9": ["nine"], "10": ["ten"],
      "one": ["1"], "two": ["2"], "three": ["3"], "four": ["4"], "five": ["5"],
      "six": ["6"], "seven": ["7"], "eight": ["8"], "nine": ["9"], "ten": ["10"]
    };

    function buildSpokenLookupSet(transcript) {
      const rawWords = (transcript || "").toLowerCase().split(/\s+/).map(normWord).filter(Boolean);
      const set = new Set(rawWords);
      // Expand contractions from spoken words
      rawWords.forEach(w => {
        if (CONTRACTION_MAP[w]) CONTRACTION_MAP[w].forEach(ex => set.add(ex));
      });
      // Also check adjacent pairs (e.g. spoken "i am" -> matches target "im")
      for (let i = 0; i < rawWords.length - 1; i++) {
        const pair = rawWords[i] + " " + rawWords[i + 1];
        Object.keys(CONTRACTION_MAP).forEach(k => {
          if (CONTRACTION_MAP[k].join(" ") === pair) set.add(k);
        });
      }
      return set;
    }

    function isShadowWordMatched(targetNorm, spokenSet) {
      if (!targetNorm) return true;
      if (spokenSet.has(targetNorm)) return true;
      const alts = CONTRACTION_MAP[targetNorm];
      if (alts && alts.every(a => spokenSet.has(a))) return true;
      return false;
    }

    window.speakSingleWord = function(rawWord) {
      const clean = (rawWord || "").replace(/[^A-Za-z0-9'’‘-]/g, "");
      if (!clean || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "en-US";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    };

    window.listenThenAutoShadow = function() {
      stopShadowRecording(false);
      pendingAutoRecordAfterListen = true;
      autoPauseSentence = true;
      const resEl = document.getElementById("shadResultText");
      if (resEl) {
        resEl.style.color = "var(--primary)";
        resEl.textContent = "🔊 Đang phát câu mẫu... Mic sẽ tự động bật ngay khi câu kết thúc!";
      }
      playSubSegment(currentSubIdx);
    };

    window.playRecordedShadowVoice = function() {
      const a = document.getElementById("shadUserAudio");
      if (a && recordedBlobUrl) {
        a.currentTime = 0;
        a.play().catch(() => {});
      }
    };

    function renderShadowingMode(it) {
      const box = document.getElementById("modeContainer");
      const sub = it.subs[currentSubIdx] || { time: 0, en: "", vi: "" };
      const wordsHtml = (sub.en || "").split(/\s+/).map(w => {
        const nw = normWord(w);
        const safeW = w.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        return `<span class="shad-word" data-w="${nw}" onclick="speakSingleWord('${safeW}')" title="🔊 Bấm để nghe phát âm từ này">${w}</span>`;
      }).join(" ");

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-weight:800;font-size:14px;">🗣️ Shadowing (Câu ${currentSubIdx + 1}/${it.subs.length})</span>
            <button class="ctrl-btn" onclick="toggleViSub()">${showViSub ? "🇻🇳 Nghĩa Việt: Bật" : "🇻🇳 Nghĩa Việt: Tắt"}</button>
            <button class="ctrl-btn" onclick="autoPauseSentence=!autoPauseSentence;renderModeContent()">${autoPauseSentence ? "⏸️ Dừng từng câu: Bật" : "▶️ Chạy liên tục"}</button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="ctrl-btn" onclick="stepSub(-1)">◀ Câu trước</button>
            <button class="ctrl-btn primary" onclick="playSubSegment(currentSubIdx)">🔊 Nghe mẫu (${fmtTime(sub.time)})</button>
            <button class="ctrl-btn" style="border-color:var(--primary);color:var(--primary);" onclick="listenThenAutoShadow()">🎧➔🎙️ Nghe mẫu & Tự thu</button>
            <button class="ctrl-btn" onclick="stepSub(1)">Câu sau ▶</button>
          </div>
        </div>
        <div class="shad-card">
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">💡 Bấm vào từ bất kỳ trong câu để nghe phát âm chuẩn từng từ</div>
          <div class="shad-en" id="shadWordsHost">${wordsHtml}</div>
          ${(showViSub && sub.vi) ? `<div class="shad-vi">🇻🇳 ${sub.vi}</div>` : ""}
          <div style="margin-top:16px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;">
            <button class="rec-btn" id="btnStartShadow" onclick="toggleShadowRecord()">🎙️ Bấm để nói theo</button>
            <button class="ctrl-btn" id="btnReplayUserVoice" style="${recordedBlobUrl ? "" : "display:none;"}font-weight:800;border-color:#16a34a;color:#16a34a;" onclick="playRecordedShadowVoice()">▶️ Nghe lại giọng bạn vừa thu</button>
          </div>
          <audio id="shadUserAudio" src="${recordedBlobUrl || ""}" style="display:none;"></audio>
          <div class="shad-live-box" id="shadResultText" style="color:var(--muted);font-weight:700;">
            🎙️ Nhấn "Bấm để nói theo" (hoặc "🎧➔🎙️ Nghe mẫu & Tự thu") và đọc to câu tiếng Anh ở trên.
          </div>
        </div>
      `;
    }

    function evaluateShadowTranscript(transcript, isFinalStop) {
      const resEl = document.getElementById("shadResultText");
      const spans = [...document.querySelectorAll("#shadWordsHost .shad-word")];
      if (!spans.length) return { pct: 0, matched: 0, total: 0 };

      const spokenSet = buildSpokenLookupSet(transcript);
      let matched = 0;
      spans.forEach(sp => {
        const w = sp.getAttribute("data-w");
        const ok = isShadowWordMatched(w, spokenSet);
        sp.classList.remove("ok", "miss");
        if (ok) {
          sp.classList.add("ok");
          matched++;
        } else if (isFinalStop) {
          sp.classList.add("miss");
        }
      });

      const pct = Math.round((matched / spans.length) * 100);
      lastShadowEval = { transcript, pct, matched, total: spans.length };

      if (resEl) {
        if (!isFinalStop) {
          resEl.style.color = "var(--text)";
          resEl.innerHTML = `🎙️ Đang nghe: <strong style="color:var(--primary);">"${transcript || "..."}"</strong> — Đã khớp <strong>${matched}/${spans.length} từ (${pct}%)</strong>`;
        } else {
          const badgeColor = pct >= 80 ? "var(--success)" : (pct >= 50 ? "#f59e0b" : "var(--danger)");
          const label = pct >= 80 ? "🌟 Phát âm rất chuẩn!" : (pct >= 50 ? "👍 Khá tốt! Hãy bấm vào các từ gạch đỏ để nghe lại" : "💪 Hãy nghe lại mẫu và thử nói chậm, rõ từng từ");
          resEl.style.color = badgeColor;
          resEl.innerHTML = `
            <div>
              <div>${label} — Độ khớp: <strong>${pct}% (${matched}/${spans.length} từ)</strong></div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:3px;">Bạn đã nói: "${transcript || "(Chưa thu được tiếng)"}"</div>
            </div>
          `;
        }
      }
      return lastShadowEval;
    }

    function stopShadowRecording(finalizeScore = true) {
      pendingAutoRecordAfterListen = false;
      if (shadSilenceTimer) {
        clearTimeout(shadSilenceTimer);
        shadSilenceTimer = null;
      }
      if (activeRec) {
        try { activeRec.onend = null; activeRec.stop(); } catch (e) {}
        activeRec = null;
      }
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      if (mediaStream) {
        try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
        mediaStream = null;
      }
      const btn = document.getElementById("btnStartShadow");
      if (btn) {
        btn.classList.remove("recording");
        btn.textContent = "🎙️ Bấm để nói lại";
      }
      if (finalizeScore && shadAccumFinal.trim()) {
        const res = evaluateShadowTranscript(shadAccumFinal.trim(), true);
        showToast(res.pct >= 70, `Độ khớp phát âm: ${res.pct}% (${res.matched}/${res.total} từ)`);
      }
    }

    async function toggleShadowRecord() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const btn = document.getElementById("btnStartShadow");
      const resEl = document.getElementById("shadResultText");

      if (!SR) {
        if (resEl) resEl.textContent = "Trình duyệt hiện tại chưa hỗ trợ nhận diện giọng nói trực tiếp (Hãy dùng Chrome hoặc Edge).";
        return;
      }

      // Nếu đang thu âm -> Bấm lần nữa để Dừng & Chấm điểm
      if (activeRec) {
        stopShadowRecording(true);
        return;
      }

      // Tạm dừng YouTube / Podcast để tránh tiếng video lọt vào mic
      if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
        try { ytPlayer.pauseVideo(); } catch (e) {}
      }
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (bgAudio && !bgAudio.paused) {
        try { bgAudio.pause(); } catch (e) {}
      }

      // Xoá trạng thái xanh/đỏ cũ trên các từ
      document.querySelectorAll("#shadWordsHost .shad-word").forEach(sp => sp.classList.remove("ok", "miss"));
      shadAccumFinal = "";
      lastShadowEval = null;

      // Khởi tạo MediaRecorder để thu âm giọng thật của người học (cho phép nghe lại giọng mình)
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(mediaStream);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            if (recordedChunks.length > 0) {
              if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
              const blob = new Blob(recordedChunks, { type: "audio/webm" });
              recordedBlobUrl = URL.createObjectURL(blob);
              const userAud = document.getElementById("shadUserAudio");
              const replayBtn = document.getElementById("btnReplayUserVoice");
              if (userAud) userAud.src = recordedBlobUrl;
              if (replayBtn) replayBtn.style.display = "inline-flex";
            }
          };
          mediaRecorder.start();
        } catch (err) {
          // Nếu người dùng từ chối quyền mic hoặc không có mic
        }
      }

      const rec = new SR();
      activeRec = rec;
      rec.lang = "en-US";
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 3;

      if (btn) {
        btn.classList.add("recording");
        btn.textContent = "⏹️ Đang nghe... (Bấm để dừng & chấm)";
      }
      if (resEl) {
        resEl.style.color = "var(--primary)";
        resEl.textContent = "🎙️ Hãy đọc to câu tiếng Anh ở trên... (Từ đọc đúng sẽ sáng màu xanh ngay khi bạn nói)";
      }

      rec.onresult = (ev) => {
        let finalPart = "";
        let interimPart = "";
        for (let i = 0; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript || "";
          if (ev.results[i].isFinal) finalPart += t + " ";
          else interimPart += t + " ";
        }
        const combined = (finalPart + " " + interimPart).replace(/\s+/g, " ").trim();
        if (combined) {
          shadAccumFinal = combined;
          const evRes = evaluateShadowTranscript(combined, false);

          // Tự động kết thúc nếu người học đã nói khớp 100% các từ trong câu
          if (evRes.total > 0 && evRes.matched >= evRes.total) {
            stopShadowRecording(true);
            return;
          }

          // Nếu người học dừng nói 2.2 giây sau khi đã đọc được ít nhất 65% câu -> tự động chốt điểm
          if (shadSilenceTimer) clearTimeout(shadSilenceTimer);
          shadSilenceTimer = setTimeout(() => {
            if (activeRec && shadAccumFinal.trim()) {
              stopShadowRecording(true);
            }
          }, 2200);
        }
      };

      rec.onerror = (ev) => {
        const errCode = ev && ev.error ? ev.error : "";
        if (errCode === "not-allowed" || errCode === "service-not-allowed") {
          if (resEl) {
            resEl.style.color = "var(--danger)";
            resEl.textContent = "⚠️ Trình duyệt đang chặn quyền Microphone. Hãy bấm biểu tượng ổ khóa trên thanh địa chỉ để Cho phép (Allow) Microphone.";
          }
          stopShadowRecording(false);
        } else if (errCode === "no-speech" && !shadAccumFinal.trim()) {
          if (resEl) {
            resEl.style.color = "var(--danger)";
            resEl.textContent = "⚠️ Không nghe thấy giọng nói. Hãy kiểm tra Micro và bấm nói lại.";
          }
          stopShadowRecording(false);
        }
      };

      rec.onend = () => {
        if (activeRec) {
          stopShadowRecording(true);
        }
      };

      try {
        rec.start();
      } catch (e) {
        stopShadowRecording(false);
      }
    }

    /* ---------- Chế độ 4: Podcast Chạy Nền (Background Play + MediaSession) ---------- */
    let hlsInstance = null;
    let podcastLoadedId = null;
    let podcastAutoNext = true;

    function setupPodcastEvents() {
      const bgAudio = document.getElementById("bgPodcastAudio");
      const seekEl = document.getElementById("podSeek");
      const curEl = document.getElementById("podCurTime");
      const durEl = document.getElementById("podDurTime");
      const playBtn = document.getElementById("podPlayBtn");
      if (!bgAudio) return;

      bgAudio.addEventListener("play", () => {
        if (playBtn) playBtn.textContent = "⏸️ Tạm dừng";
        const podWrap = document.getElementById("podcastBoxWrap");
        if (podWrap) podWrap.classList.add("playing");
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      });
      bgAudio.addEventListener("pause", () => {
        if (playBtn) playBtn.textContent = "▶️ Phát Podcast";
        const podWrap = document.getElementById("podcastBoxWrap");
        if (podWrap) podWrap.classList.remove("playing");
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      });
      bgAudio.addEventListener("loadedmetadata", () => {
        const dur = Math.floor(bgAudio.duration || 0);
        if (seekEl && dur > 0) seekEl.max = dur;
        if (durEl) durEl.textContent = fmtTime(dur * 1000);
      });
      bgAudio.addEventListener("timeupdate", () => {
        const sec = bgAudio.currentTime || 0;
        const dur = bgAudio.duration || 0;
        if (seekEl && !seekEl.matches(":active")) seekEl.value = Math.floor(sec);
        if (curEl) curEl.textContent = fmtTime(sec * 1000);
        if (durEl && dur > 0) durEl.textContent = fmtTime(dur * 1000);

        if (currentMode === "podcast") {
          const it = getActiveItem();
          if (it && it.subs.length) {
            const offsetMs = Number(it.podOffsetMs || 0);
            const ms = (sec * 1000) - offsetMs;
            let foundIdx = 0;
            for (let i = 0; i < it.subs.length; i++) {
              if (ms >= it.subs[i].time) foundIdx = i;
              else break;
            }
            if (foundIdx !== currentSubIdx) {
              currentSubIdx = foundIdx;
              saveSubPos();
              highlightTranscriptRow(foundIdx);
            }
          }
        }

        if ("mediaSession" in navigator && dur > 0 && !isNaN(dur) && isFinite(dur)) {
          try {
            navigator.mediaSession.setPositionState({
              duration: dur,
              playbackRate: bgAudio.playbackRate || 1,
              position: Math.min(Math.max(0, sec), dur)
            });
          } catch (e) {}
        }
      });
      bgAudio.addEventListener("ended", () => {
        if (podcastAutoNext) {
          stepLesson(1, true);
        }
      });
      if (seekEl) {
        seekEl.addEventListener("input", () => {
          bgAudio.currentTime = Number(seekEl.value || 0);
        });
      }
    }

    function updateMediaSessionMeta(it) {
      if (!("mediaSession" in navigator) || !it) return;
      const parts = it.title.split("|").map(s => s.trim());
      const talkTitle = parts[0] || it.title;
      const speaker = parts[1] || "TED Talks";
      const thumbUrl = `https://i.ytimg.com/vi/${it.youtubeId}/hqdefault.jpg`;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: talkTitle,
          artist: speaker + " • Study4 TED Talks",
          album: it.unit,
          artwork: [
            { src: thumbUrl, sizes: "480x360", type: "image/jpeg" }
          ]
        });
        navigator.mediaSession.setActionHandler("play", () => {
          const a = document.getElementById("bgPodcastAudio");
          if (a) a.play().catch(() => {});
        });
        navigator.mediaSession.setActionHandler("pause", () => {
          const a = document.getElementById("bgPodcastAudio");
          if (a) a.pause();
        });
        navigator.mediaSession.setActionHandler("previoustrack", () => stepLesson(-1, true));
        navigator.mediaSession.setActionHandler("nexttrack", () => stepLesson(1, true));
        navigator.mediaSession.setActionHandler("seekbackward", (details) => {
          const skip = (details && details.seekOffset) || 10;
          seekPodcast(-skip);
        });
        navigator.mediaSession.setActionHandler("seekforward", (details) => {
          const skip = (details && details.seekOffset) || 10;
          seekPodcast(skip);
        });
        navigator.mediaSession.setActionHandler("seekto", (details) => {
          const a = document.getElementById("bgPodcastAudio");
          if (a && details && typeof details.seekTime === "number") a.currentTime = details.seekTime;
        });
      } catch (e) {}
    }

    function loadPodcastStream(it, autoPlay) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio || !it) return;
      const parts = it.title.split("|").map(s => s.trim());
      const speakerEl = document.getElementById("podSpeaker");
      const thumbEl = document.getElementById("podThumb");
      if (speakerEl) speakerEl.textContent = (parts[1] ? parts[1] + " • " : "") + it.unit;
      if (thumbEl) thumbEl.src = `https://i.ytimg.com/vi/${it.youtubeId}/hqdefault.jpg`;
      updateMediaSessionMeta(it);

      if (podcastLoadedId === it.id && bgAudio.src) {
        if (autoPlay && bgAudio.paused) bgAudio.play().catch(() => {});
        return;
      }
      podcastLoadedId = it.id;

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const rateSel = document.getElementById("podRateSel");
      const rate = rateSel ? Number(rateSel.value || 1) : 1;

      if (it.mp4) {
        bgAudio.src = it.mp4;
        bgAudio.playbackRate = rate;
        if (autoPlay) bgAudio.play().catch(() => {});
      } else if (it.audioHls || it.hls) {
        const streamUrl = it.audioHls || it.hls;
        if (bgAudio.canPlayType("application/vnd.apple.mpegurl")) {
          bgAudio.src = streamUrl;
          bgAudio.playbackRate = rate;
          if (autoPlay) bgAudio.play().catch(() => {});
        } else if (window.Hls && Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(streamUrl);
          hlsInstance.attachMedia(bgAudio);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            bgAudio.playbackRate = rate;
            if (autoPlay) bgAudio.play().catch(() => {});
          });
        }
      }
    }

    function togglePodcastPlay() {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio) return;
      if (!podcastLoadedId) loadPodcastStream(getActiveItem(), true);
      else if (bgAudio.paused) bgAudio.play().catch(() => {});
      else bgAudio.pause();
    }

    function seekPodcast(deltaSec) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (!bgAudio) return;
      bgAudio.currentTime = Math.max(0, Math.min(bgAudio.duration || 99999, (bgAudio.currentTime || 0) + deltaSec));
    }

    function setPodcastRate(v) {
      const bgAudio = document.getElementById("bgPodcastAudio");
      if (bgAudio) bgAudio.playbackRate = Number(v || 1);
    }

    function renderPodcastMode(it) {
      const box = document.getElementById("modeContainer");
      const rowsHtml = it.subs.map((s, idx) => `
        <div class="sub-item ${idx === currentSubIdx ? "active" : ""}" onclick="clickTranscriptRow(${idx})">
          <span class="sub-time">${fmtTime(s.time)}</span>
          <div style="flex:1;min-width:0;">
            ${showEnSub ? `<div class="sub-en">${s.en}</div>` : `<div class="sub-en" style="color:var(--muted);">••• (Đã ẩn phụ đề Anh)</div>`}
            ${showViSub && s.vi ? `<div class="sub-vi">${s.vi}</div>` : ""}
          </div>
        </div>
      `).join("");

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="font-weight:800;font-size:13.5px;color:var(--success);">📻 Đang ở chế độ Podcast Chạy Nền — Tắt màn hình hoặc thoát app vẫn nghe liên tục</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="ctrl-btn" onclick="showEnSub=!showEnSub;renderModeContent()">${showEnSub ? "👁️ Ẩn tiếng Anh" : "👁️ Hiện tiếng Anh"}</button>
            <button class="ctrl-btn" onclick="toggleViSub()">${showViSub ? "🇻🇳 Ẩn nghĩa Việt" : "🇻🇳 Hiện nghĩa Việt"}</button>
          </div>
        </div>
        <div class="subs-list" id="subsList">${rowsHtml}</div>
      `;
    }

    function renderModeContent() {
      const it = getActiveItem();
      if (!it) return;
      if (currentMode === "transcript") renderTranscriptMode(it);
      else if (currentMode === "shadowing") renderShadowingMode(it);
      else if (currentMode === "podcast") renderPodcastMode(it);
      else renderDictationMode(it);
    }

    document.getElementById("searchInput").oninput = renderSidebar;
    setupPodcastEvents();
    renderSidebar();
    loadActiveVideo();
    renderModeContent();
  </script>
