  </div>

  <script src="tedtalks_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <!-- YouTube API lazy-loaded on demand when user switches to YouTube engine -->
  <script src="../assets/s4-ui.js?v=69"></script>
  <script src="../assets/s4-search-engine.js?v=1"></script>
  <script src="../assets/s4-whisper.js?v=6"></script>
  <script src="../auth.js?v=38"></script>
  <script>
    const ITEMS = window.STUDY4_TED_DATA || [];
    if (window.S4SearchEngine) window.S4SearchEngine.initWasm("../assets/s4-core.wasm?v=1");
    const tedSubtitleIndex = (window.S4SearchEngine && typeof window.S4SearchEngine.createSubtitleIndex === "function")
      ? window.S4SearchEngine.createSubtitleIndex(ITEMS, { lazy: true })
      : null;
    const STORAGE_DONE = "s4_ted_done";
    const STORAGE_LAST = "s4_ted_last";
    const STORAGE_POS = "s4_ted_pos";

    function safeParseObj(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "{}");
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch (e) {
        return {};
      }
    }
    let doneMap = safeParseObj(STORAGE_DONE);
    let posMap = safeParseObj(STORAGE_POS);
    let activeId = localStorage.getItem(STORAGE_LAST) || (ITEMS[0] && ITEMS[0].id);
    let unitFilter = "ALL";
    let currentMode = "dictation"; // 'dictation' | 'transcript' | 'shadowing' | 'podcast'
    let currentSubIdx = Math.max(0, Number(posMap[activeId] || 0)); // Vị trí câu đang học (Dictation & Shadowing)
    let playbackSubIdx = 0; // Vị trí câu âm thanh/video đang phát tới (Transcript & Podcast độc lập)
    let dicLevel = "word"; // 'word' | 'word_hard' | 'sentence'
    let showEnSub = true;
    let showViSub = localStorage.getItem("s4_ted_show_vi") !== "0";
    let autoPauseSentence = true;
    let repeatSentence = false;
    let segmentEndSec = null;

    function escHtml(s) {
      if (window.S4UI && typeof window.S4UI.escapeHtml === "function") return window.S4UI.escapeHtml(s);
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escJsAttr(s) {
      return escHtml(
        String(s == null ? "" : s)
          .replace(/\\/g, "\\\\")
          .replace(/\r?\n/g, " ")
          .replace(/'/g, "\\'")
      );
    }

    function saveSubPos() {
      if (!activeId) return;
      posMap[activeId] = currentSubIdx;
      try { localStorage.setItem(STORAGE_POS, JSON.stringify(posMap)); } catch (e) {}
    }

    function toggleViSub() {
      showViSub = !showViSub;
      localStorage.setItem("s4_ted_show_vi", showViSub ? "1" : "0");
      renderModeContent();
    }

    function svgIcon(name, size) {
      if (window.S4UI && typeof window.S4UI.icon === "function") return window.S4UI.icon(name, size || 15);
      return "";
    }
    function syncDarkBtn() {
      const btn = document.getElementById("btnTedDark");
      if (!btn) return;
      const isDark = document.documentElement.classList.contains("dark");
      if (window.S4UI && typeof window.S4UI.renderThemeButton === "function") {
        window.S4UI.renderThemeButton(btn, isDark);
      } else {
        btn.innerHTML = svgIcon(isDark ? "sun" : "moon", 16);
      }
    }

    let ytPlayer = null;
    let ytReady = false;
    let syncTimer = null;

    function toggleDark() {
      if (window.toggleDarkModeOnly) {
        window.toggleDarkModeOnly();
      } else {
        const isDark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", isDark);
        document.body.classList.toggle("dark", isDark);
        localStorage.setItem("s4_vocab_dark", isDark ? "1" : "0");
        const mt = document.getElementById("metaThemeColor");
        if (mt) mt.setAttribute("content", isDark ? "#0b1120" : "#eaf1fb");
      }
      syncDarkBtn();
    }

    function toggleMenu(open) {
      if (window.S4UI && typeof window.S4UI.toggleSidebar === "function") {
        const opened = window.S4UI.toggleSidebar(typeof open === "boolean" ? open : undefined);
        const isMobile = window.innerWidth <= 1024;
        document.body.classList.toggle("sidebar-open", isMobile && opened);
        const mw = document.querySelector(".main-wrap");
        if (mw && "inert" in mw) mw.inert = isMobile && opened;
        return opened;
      }
      const isOpen = !!open && window.innerWidth <= 1024;
      document.getElementById("sidebar").classList.toggle("open", isOpen);
      document.getElementById("sidebarBackdrop").classList.toggle("open", isOpen);
      document.body.classList.toggle("sidebar-open", isOpen);
      const mw = document.querySelector(".main-wrap");
      if (mw && "inert" in mw) mw.inert = isOpen;
      return isOpen;
    }
    if (window.S4UI && typeof window.S4UI.initSmartBackButton === "function") {
      window.S4UI.initSmartBackButton({
        element: "#lpBackBtn",
        defaultUrl: "../index.html",
        defaultLabel: "Khóa học",
        roadmapUrl: "../ielts/roadmap/index.html",
        roadmapLabel: "Lộ trình IELTS"
      });
    }
    const sbToggleEl = document.getElementById("btnToggleSidebar");
    if (sbToggleEl) sbToggleEl.addEventListener("click", () => toggleMenu());
    const sbCloseEl = document.getElementById("btnCloseSidebar");
    if (sbCloseEl) sbCloseEl.addEventListener("click", () => toggleMenu(false));
    const sbBackdropEl = document.getElementById("sidebarBackdrop");
    if (sbBackdropEl) sbBackdropEl.addEventListener("click", () => toggleMenu(false));
    const tedDonateEl = document.getElementById("btnTedDonate");
    if (tedDonateEl) tedDonateEl.addEventListener("click", () => window.S4Auth && window.S4Auth.openDonateModal());
    const tedDarkEl = document.getElementById("btnTedDark");
    if (tedDarkEl) tedDarkEl.addEventListener("click", () => toggleDark());
    syncDarkBtn();
    if (typeof MutationObserver !== "undefined") {
      new MutationObserver(syncDarkBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    }
    function syncTedDrawerViewport() {
      if (window.innerWidth > 1024 && (
        document.body.classList.contains("sidebar-open") ||
        document.getElementById("sidebar")?.classList.contains("open") ||
        document.getElementById("sidebarBackdrop")?.classList.contains("open")
      )) {
        toggleMenu(false);
      }
    }
    window.addEventListener("resize", syncTedDrawerViewport);
    if (window.matchMedia) {
      const tMq = window.matchMedia("(min-width: 1025px)");
      if (tMq.addEventListener) tMq.addEventListener("change", (e) => { if (e.matches) toggleMenu(false); });
      else if (tMq.addListener) tMq.addListener((e) => { if (e.matches) toggleMenu(false); });
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) toggleMenu(false);
    });
    function toggleTedVideoPin() {
      const unpinned = document.body.classList.toggle("ted-unpin-video");
      const btn = document.getElementById("btnTogglePinVideo");
      if (btn) {
        btn.classList.toggle("active", !unpinned);
        btn.innerHTML = svgIcon("flag", 13) + '<span>' + (unpinned ? "Ghim video" : "Đang ghim") + '</span>';
      }
    }

    let toastTimer = null;
    function showToast(good, text) {
      if (window.S4UI && typeof window.S4UI.toast === "function") {
        window.S4UI.toast(
          good ? "success" : "warn",
          text,
          { duration: good ? 1100 : 1800 }
        );
        return;
      }
      let t = document.getElementById("s4TedToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "s4TedToast";
        document.body.appendChild(t);
      }
      if (toastTimer) clearTimeout(toastTimer);
      t.className = "s4-toast " + (good ? "good" : "warn");
      t.textContent = text;
      requestAnimationFrame(() => t.classList.add("show"));
      toastTimer = setTimeout(() => t.classList.remove("show"), good ? 1100 : 1800);
    }

    function fmtTime(ms) {
      const totalSec = Math.max(0, Math.floor((ms || 0) / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m + ":" + (s < 10 ? "0" + s : s);
    }

    function getActiveItem() {
      return ITEMS.find(x => x.id === activeId) || ITEMS[0];
    }

    function setUnitFilter(f, btn) {
      unitFilter = f;
      document.querySelectorAll(".unit-tab").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderSidebar();
    }

    function highlightTedText(str, q) {
      if (q && window.S4SearchEngine && typeof window.S4SearchEngine.highlightHtml === "function") {
        return window.S4SearchEngine.highlightHtml(str, q);
      }
      return escHtml(str);
    }

    function renderSidebar() {
      const q = (document.getElementById("searchInput").value || "").trim();
      const listEl = document.getElementById("lessonList");
      const unitPass = (it) => {
        if (unitFilter === "Short" && !it.unit.includes("Short")) return false;
        if (unitFilter === "Long" && !it.unit.includes("Long")) return false;
        return true;
      };
      const buildProgBadge = (it, isDone, savedIdx) => isDone
        ? `<span class="done-dot">${svgIcon("check", 14)}</span>`
        : (savedIdx > 0 ? `<span style="font-size:11px;opacity:0.75;flex-shrink:0;">${savedIdx + 1}/${it.subs.length}</span>` : "");

      let html = "";
      if (q && tedSubtitleIndex && typeof tedSubtitleIndex.search === "function") {
        const hits = tedSubtitleIndex.search(q, { filterFn: unitPass, limit: ITEMS.length });
        if (hits.length) {
          const qNorm = window.S4SearchEngine ? window.S4SearchEngine.normalize(q) : "";
          html += `<div style="font-size:11.5px;color:var(--muted);padding:2px 6px 6px;font-weight:700;display:flex;align-items:center;gap:5px;">${svgIcon("search", 13)}<span>Khớp ${hits.length} bài diễn thuyết</span></div>`;
          hits.forEach(hit => {
            const it = hit.item;
            const isAct = it.id === activeId;
            const isDone = !!doneMap[it.id];
            const savedIdx = Number(posMap[it.id] || 0);
            const progBadge = buildProgBadge(it, isDone, savedIdx);
            const hasSub = hit.matchedSubIdx >= 0 && it.subs && it.subs[hit.matchedSubIdx];
            let subSnippetHtml = "";
            if (hasSub) {
              const tLabel = fmtTime(getSubDisplayTimeMs(it, it.subs[hit.matchedSubIdx]));
              const extraCnt = hit.matchCount > 1 ? `<span class="ted-sub-badge">+${hit.matchCount - 1} câu</span>` : "";
              const enNorm = window.S4SearchEngine && hit.snippetEn ? window.S4SearchEngine.normalize(hit.snippetEn) : "";
              const showViSnippet = hit.snippetVi && (showViSub || !qNorm || enNorm.indexOf(qNorm) === -1);
              subSnippetHtml = `<div class="ted-sub-hit">
                <div class="ted-sub-hit-meta"><span class="ted-sub-time">${svgIcon("clock", 11)} ${tLabel}</span>${extraCnt}</div>
                ${hit.snippetEn ? `<div>${highlightTedText(hit.snippetEn, q)}</div>` : ""}
                ${showViSnippet ? `<div class="ted-sub-vi">${highlightTedText(hit.snippetVi, q)}</div>` : ""}
              </div>`;
            }
            const jumpIdx = hasSub ? hit.matchedSubIdx : -1;
            html += `<div class="lesson-item ${isAct ? "active" : ""} ${hasSub ? "has-sub-hit" : ""}" data-sub-idx="${jumpIdx}" onclick="selectLesson('${escJsAttr(it.id)}', undefined, ${jumpIdx})">
              <div class="lesson-item-head">
                <span style="overflow:hidden;text-overflow:ellipsis;">${highlightTedText((it.index || "") + ". " + it.title, q)}</span>
                ${progBadge}
              </div>
              ${subSnippetHtml}
            </div>`;
          });
        }
      } else {
        const filtered = ITEMS.filter(it => {
          if (!unitPass(it)) return false;
          if (q) {
            return (window.S4UI && typeof window.S4UI.matchesSearch === "function")
              ? window.S4UI.matchesSearch((it.index || "") + " " + it.title + " " + (it.unit || ""), q)
              : it.title.toLowerCase().includes(q.toLowerCase());
          }
          return true;
        });

        const byUnit = {};
        filtered.forEach(it => {
          if (!byUnit[it.unit]) byUnit[it.unit] = [];
          byUnit[it.unit].push(it);
        });

        Object.keys(byUnit).forEach(uName => {
          const arr = byUnit[uName];
          const doneCnt = arr.filter(x => doneMap[x.id]).length;
          html += `<div class="unit-title"><span>${escHtml(uName)}</span><span>${doneCnt}/${arr.length}</span></div>`;
          arr.forEach(it => {
            const isAct = it.id === activeId;
            const isDone = !!doneMap[it.id];
            const savedIdx = Number(posMap[it.id] || 0);
            const progBadge = buildProgBadge(it, isDone, savedIdx);
            html += `<div class="lesson-item ${isAct ? "active" : ""}" onclick="selectLesson('${escJsAttr(it.id)}')">
              <span style="overflow:hidden;text-overflow:ellipsis;">${escHtml(it.index)}. ${escHtml(it.title)}</span>
              ${progBadge}
            </div>`;
          });
        });
      }

      const safeQ = window.S4UI ? window.S4UI.escapeHtml(q) : escHtml(q);
      listEl.innerHTML = html || `<div class="s4-empty-state" style="margin-top:8px;padding:24px 12px;">
        <div style="color:var(--lg-ink-muted);">${svgIcon("search", 26)}</div>
        <div style="font-size:13.5px;font-weight:800;color:var(--text);">Không tìm thấy bài TED Talks phù hợp</div>
        ${q ? `<div style="font-size:12px;">Từ khóa "<strong>${safeQ}</strong>" không khớp tiêu đề hay lời thoại nào.</div>` : ""}
        <button type="button" class="s4-pz-clear-chip" onclick="clearTedSearch()">${svgIcon("close", 12)} <span>Xóa tìm kiếm</span></button>
      </div>`;
    }

    function scheduleSubJump(targetId, subIdx, modeAtSelect) {
      const runJump = () => {
        if (activeId !== targetId) return;
        if (modeAtSelect === "transcript" || modeAtSelect === "podcast") {
          clickTranscriptRow(subIdx);
        } else {
          playSubSegment(subIdx);
        }
      };
      const tedVid = document.getElementById("tedVideoPlayer");
      if (modeAtSelect !== "podcast" && tedVid && currentEngine === "ted" && tedVid.readyState < 1) {
        const onMeta = () => {
          tedVid.removeEventListener("loadedmetadata", onMeta);
          runJump();
        };
        tedVid.addEventListener("loadedmetadata", onMeta, { once: true });
      }
      setTimeout(runJump, modeAtSelect === "transcript" ? 60 : 120);
    }

    function selectLesson(id, autoPlayPodcast, jumpSubIdx) {
      if (typeof stopShadowRecording === "function") stopShadowRecording(false);
      if (typeof clearRecordedShadowAudio === "function") clearRecordedShadowAudio();
      if (id !== activeId) {
        if (typeof destroyPodcastStream === "function") destroyPodcastStream();
        if (typeof clearTedVideoFallbackTimer === "function") clearTedVideoFallbackTimer();
        if (tedHls) { try { tedHls.destroy(); } catch (e) {} tedHls = null; }
        tedVidLoadedUrl = "";
      }
      activeId = id;
      localStorage.setItem(STORAGE_LAST, id);
      const it = getActiveItem();
      const hasJumpSub = typeof jumpSubIdx === "number" && jumpSubIdx >= 0 && it && Array.isArray(it.subs) && jumpSubIdx < it.subs.length;
      if (hasJumpSub) {
        currentSubIdx = jumpSubIdx;
        playbackSubIdx = jumpSubIdx;
        saveSubPos();
      } else {
        const saved = Number(posMap[id] || 0);
        currentSubIdx = (it && Array.isArray(it.subs) && saved >= 0 && saved < it.subs.length) ? saved : 0;
        playbackSubIdx = 0;
      }
      segmentEndSec = null;
      toggleMenu(false);
      renderSidebar();
      setTimeout(() => {
        const act = document.querySelector("#lessonList .lesson-item.active");
        if (act) { try { act.scrollIntoView({ block: "center", behavior: "auto" }); } catch (e) {} }
      }, 50);
      loadActiveVideo(autoPlayPodcast);
      renderModeContent({ autoFocus: false });
      if (hasJumpSub) {
        scheduleSubJump(id, jumpSubIdx, currentMode);
      }
      try {
        const mainWrap = document.querySelector(".main-wrap");
        if (mainWrap && mainWrap.scrollTop > 0) mainWrap.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: "auto" });
      } catch (e) {}
    }

    function stepLesson(delta, autoPlayPodcast) {
      const idx = ITEMS.findIndex(x => x.id === activeId);
      if (idx < 0) return;
      const nextIdx = (idx + delta + ITEMS.length) % ITEMS.length;
      selectLesson(ITEMS[nextIdx].id, autoPlayPodcast !== undefined ? autoPlayPodcast : (currentMode === "podcast"));
    }

    function toggleDoneCurrent() {
      const it = getActiveItem();
      if (!it) return;
      doneMap[it.id] = !doneMap[it.id];
      if (!doneMap[it.id]) delete doneMap[it.id];
      localStorage.setItem(STORAGE_DONE, JSON.stringify(doneMap));
      updateDoneBtn();
      renderSidebar();
    }

    function updateDoneBtn() {
      const it = getActiveItem();
      const btn = document.getElementById("btnDoneLesson");
      if (!it || !btn) return;
      const done = !!doneMap[it.id];
      btn.className = "btn-done" + (done ? " completed" : "");
      btn.innerHTML = svgIcon(done ? "check" : "target", 13) + '<span>' + (done ? "Đã hoàn thành" : "Đánh dấu hoàn thành") + '</span>';
    }

    function switchMode(m) {
      if (m !== currentMode && typeof stopShadowRecording === "function") stopShadowRecording(false);
      if (m !== currentMode && typeof clearRecordedShadowAudio === "function") clearRecordedShadowAudio();
      if (m !== "shadowing" && typeof releaseWarmMicStream === "function") {
        if (typeof warmAcquireGen === "number") warmAcquireGen++;
        releaseWarmMicStream();
      }
      currentMode = m;
      if (m === "shadowing") {
        setTimeout(() => {
          if (currentMode === "shadowing" && window.S4Whisper && typeof window.S4Whisper.preload === "function" && !window.S4Whisper.isReady()) {
            window.S4Whisper.preload().catch(() => {});
          }
        }, 600);
      }
      segmentEndSec = null;
      document.querySelectorAll(".mode-pill").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-mode") === m);
      });
      const ytWrap = document.getElementById("ytBoxWrap");
      const podWrap = document.getElementById("podcastBoxWrap");
      const bgAudio = document.getElementById("bgPodcastAudio");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (m === "podcast") {
        if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
          try { ytPlayer.pauseVideo(); } catch (e) {}
        }
        if (tedVid && !tedVid.paused) {
          try { tedVid.pause(); } catch (e) {}
        }
        if (ytWrap) ytWrap.style.display = "none";
        if (podWrap) podWrap.style.display = "block";
        loadPodcastStream(getActiveItem(), true);
      } else {
        if (typeof podcastLoadGen === "number") podcastLoadGen++;
        if (bgAudio && !bgAudio.paused) {
          try { bgAudio.pause(); } catch (e) {}
        }
        if (podWrap) podWrap.style.display = "none";
        if (ytWrap) ytWrap.style.display = "block";
      }
      renderModeContent();
    }

    /* ---------- Dual-Engine Player: YouTube + Native TED CDN Stream ---------- */
    let currentEngine = "ted"; // "ted" (mac dinh) | "yt"
    let ytWanted = false;
    let ytError = false;

    function scrollInputIntoOptimalView(el) {
      if (!el) return;
      setTimeout(() => {
        try {
          el.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
        } catch (e) {
          try { el.scrollIntoView(); } catch (err) {}
        }
      }, 160);
    }

    function focusCurrentDicInput() {
      if (currentMode !== "dictation") return;
      const box = document.getElementById("modeContainer");
      if (!box) return;
      const target = box.querySelector(".dic-input:not(.correct), .dic-full-input:not(.correct)") || box.querySelector(".dic-input, .dic-full-input");
      if (target) {
        try {
          target.focus();
          scrollInputIntoOptimalView(target);
        } catch (e) {}
      }
    }

    function tedVideoUrl(it) {
      if (!it) return "";
      const a = it.audioHls || it.hls || "";
      if (a) return a.replace(/index-f\d+-a\d+\.m3u8.*$/, "manifest.m3u8");
      return it.mp4 || "";
    }
    function tedAudioUrl(it) {
      if (!it) return "";
      return it.mp4 || it.audioHls || it.hls || "";
    }
    function getTedOffsetMs(it) {
      if (!it || !tedVideoUrl(it)) return 0;
      if (currentMode === "podcast" || currentEngine === "ted" || !ytReady || ytError) {
        return Number(it.podOffsetMs || 0);
      }
      return 0;
    }
    function getSubDisplayTimeMs(it, sub) {
      if (!sub) return 0;
      return Math.max(0, Number(sub.time || 0) + getTedOffsetMs(it));
    }
    let tedHls = null;
    let tedVidLoadedUrl = "";
    let tedVidFallbackTimer = null;
    function clearTedVideoFallbackTimer() {
      if (tedVidFallbackTimer) {
        clearTimeout(tedVidFallbackTimer);
        tedVidFallbackTimer = null;
      }
    }
    function loadTedVideo(vid, it) {
      const url = tedVideoUrl(it);
      if (!vid) return;
      clearTedVideoFallbackTimer();
      if (!url) {
        tedVidLoadedUrl = "";
        if (tedHls) { try { tedHls.destroy(); } catch (e) {} tedHls = null; }
        try { vid.pause(); vid.removeAttribute("src"); vid.load(); } catch (e) {}
        if (it && it.youtubeId) setMediaEngine("yt");
        return;
      }
      if (tedVidLoadedUrl === url && (tedHls || vid.src === url)) return;
      tedVidLoadedUrl = url;
      if (tedHls) { try { tedHls.destroy(); } catch (e) {} tedHls = null; }
      let fellBack = false;
      const onLoadedOk = () => clearTedVideoFallbackTimer();
      vid.onloadedmetadata = onLoadedOk;
      vid.oncanplay = onLoadedOk;
      const fallbackToMp4OrYt = () => {
        if (fellBack) return;
        fellBack = true;
        clearTedVideoFallbackTimer();
        if (tedHls) { try { tedHls.destroy(); } catch (e) {} tedHls = null; }
        if (it && it.mp4 && tedVidLoadedUrl !== it.mp4) {
          tedVidLoadedUrl = it.mp4;
          vid.onerror = () => {
            vid.onerror = null;
            if (it && it.youtubeId && currentEngine === "ted") setMediaEngine("yt", true);
          };
          vid.src = it.mp4;
          vid.load();
          tedVidFallbackTimer = setTimeout(() => {
            if (currentEngine === "ted" && activeId === it.id && vid.readyState === 0 && it.youtubeId) {
              setMediaEngine("yt", true);
            }
          }, 4500);
        } else if (it && it.youtubeId && currentEngine === "ted") {
          setMediaEngine("yt", true);
        }
      };
      if (/\.m3u8/.test(url)) {
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            maxBufferLength: 20,
            maxMaxBufferLength: 40,
            manifestLoadingTimeOut: 3800,
            manifestLoadingMaxRetry: 0,
            levelLoadingTimeOut: 4000,
            levelLoadingMaxRetry: 1
          });
          tedHls = hls;
          hls.on(Hls.Events.MANIFEST_PARSED, onLoadedOk);
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data && (data.fatal || data.details === "manifestLoadError" || data.details === "manifestLoadTimeOut") && tedHls === hls) {
              fallbackToMp4OrYt();
            }
          });
          hls.loadSource(url);
          hls.attachMedia(vid);
          tedVidFallbackTimer = setTimeout(() => {
            if (tedHls === hls && currentEngine === "ted" && activeId === it.id && vid.readyState === 0) {
              fallbackToMp4OrYt();
            }
          }, 4200);
        } else if (vid.canPlayType && vid.canPlayType("application/vnd.apple.mpegurl")) {
          vid.onerror = () => {
            vid.onerror = null;
            fallbackToMp4OrYt();
          };
          vid.src = url;
          vid.load();
          tedVidFallbackTimer = setTimeout(() => {
            if (currentEngine === "ted" && activeId === it.id && vid.readyState === 0) {
              fallbackToMp4OrYt();
            }
          }, 4200);
        } else {
          fallbackToMp4OrYt();
        }
      } else {
        vid.onerror = () => {
          vid.onerror = null;
          if (it && it.youtubeId && currentEngine === "ted") setMediaEngine("yt", true);
        };
        vid.src = url;
        vid.load();
      }
    }
    let ytApiFailed = false;
    function setTedEngineStatus(htmlMsg) {
      const statusEl = document.getElementById("tedEngineStatus");
      if (!statusEl) return;
      if (htmlMsg) {
        statusEl.style.display = "block";
        statusEl.innerHTML = htmlMsg;
      } else {
        statusEl.style.display = "none";
      }
    }
    function ensureYouTubeApi() {
      if (window.YT && window.YT.Player) {
        if (!ytPlayer) window.onYouTubeIframeAPIReady();
        return;
      }
      if (ytApiFailed) {
        setTedEngineStatus("Không tải được trình phát YouTube nhúng (mạng bị chặn hoặc ngoại tuyến). Hãy bấm <b>Mở YouTube</b> hoặc chuyển về <b>Video TED gốc</b>.");
        return;
      }
      if (!document.getElementById("ytApiScript")) {
        const s = document.createElement("script");
        s.id = "ytApiScript";
        s.src = "https://www.youtube.com/iframe_api";
        s.onerror = () => {
          ytApiFailed = true;
          if (currentEngine === "yt") {
            setTedEngineStatus("Không tải được trình phát YouTube nhúng (mạng bị chặn hoặc ngoại tuyến). Hãy bấm <b>Mở YouTube</b> hoặc chuyển về <b>Video TED gốc</b>.");
          }
        };
        document.head.appendChild(s);
      }
      setTimeout(() => {
        if (currentEngine === "yt" && !ytReady && !ytPlayer) {
          setTedEngineStatus("Trình phát YouTube nhúng đang phản hồi chậm. Có thể bấm <b>Mở YouTube</b> hoặc quay lại <b>Video TED gốc</b>.");
        }
      }, 6500);
    }

    function setMediaEngine(eng, isAutoFallback) {
      const it = getActiveItem();
      const btnYt = document.getElementById("btnEngYt");
      const btnTed = document.getElementById("btnEngTed");
      if (eng === "ted" && it && !tedVideoUrl(it) && it.youtubeId) {
        currentEngine = "yt";
        if (btnYt) btnYt.classList.add("active");
        if (btnTed) btnTed.classList.remove("active");
        ytWanted = true;
        ytError = false;
        showYtPlayerUI();
        if (ytReady && ytPlayer && ytPlayer.cueVideoById) {
          try { ytPlayer.cueVideoById(it.youtubeId); } catch (e) {}
        } else {
          ensureYouTubeApi();
        }
        setTedEngineStatus("Bài học này chỉ hỗ trợ nguồn Video YouTube.");
        if (!isAutoFallback) showToast(false, "Bài học này chỉ hỗ trợ nguồn Video YouTube!");
        return;
      }
      currentEngine = eng;
      if (btnYt) btnYt.classList.toggle("active", eng === "yt");
      if (btnTed) btnTed.classList.toggle("active", eng === "ted");

      if (eng === "ted") {
        if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
          try { ytPlayer.pauseVideo(); } catch (e) {}
        }
        showTedPlayerUI();
        setTedEngineStatus(isAutoFallback
          ? "YouTube bị hạn chế nhúng — Đã chuyển sang luồng TED gốc."
          : "Đang phát qua luồng TED Video/Audio gốc.");
        if (isAutoFallback) showToast(false, "Đã chuyển sang luồng TED gốc!");
      } else {
        ytWanted = true;
        ytError = false;
        const tedVid = document.getElementById("tedVideoPlayer");
        if (tedVid && !tedVid.paused) {
          try { tedVid.pause(); } catch (e) {}
        }
        showYtPlayerUI();
        if (ytReady && ytPlayer && ytPlayer.cueVideoById && it) {
          setTedEngineStatus("");
          try { ytPlayer.cueVideoById(it.youtubeId); } catch (e) {}
        } else {
          setTedEngineStatus("Đang nạp trình phát YouTube dự phòng...");
          ensureYouTubeApi();
        }
      }
    }

    function showTedPlayerUI() {
      const ytBox = document.getElementById("ytPlayer");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (ytBox) ytBox.style.display = "none";
      if (tedVid) {
        tedVid.style.display = "block";
        const it = getActiveItem();
        loadTedVideo(tedVid, it);
      }

    function showYtPlayerUI() {
      const ytBox = document.getElementById("ytPlayer");
      const tedVid = document.getElementById("tedVideoPlayer");
      if (ytBox) ytBox.style.display = "block";
      if (tedVid) tedVid.style.display = "none";
    }

    window.onYouTubeIframeAPIReady = function () {
      if (currentEngine === "ted" && !ytWanted) return;
      const it = getActiveItem();
      if (!it) return;
      const pVars = { rel: 0, modestbranding: 1, playsinline: 1 };
      // origin omitted to prevent YouTube postMessage mismatch warnings on GitHub Pages
      try {
        ytPlayer = new YT.Player("ytPlayer", {
          videoId: it.youtubeId,
          playerVars: pVars,
          events: {
            onReady: () => {
              ytReady = true;
              ytError = false;
              try {
                const ifr = ytPlayer && typeof ytPlayer.getIframe === "function" ? ytPlayer.getIframe() : null;
                if (ifr) ifr.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
              } catch (e) {}
              if (currentEngine === "yt") setTedEngineStatus("");
              startSyncLoop();
              if (currentEngine === "ted" && !ytWanted && ytPlayer && ytPlayer.pauseVideo) {
                try { ytPlayer.pauseVideo(); } catch (e) {}
              }
            },
            onStateChange: (ev) => {
              if (ev && ev.data === 1) startSyncLoop();
              else maybeStopSyncLoop();
              if (ev && ev.data === 1 && (currentMode === "dictation" || currentMode === "shadowing")) {
                const curIt = getActiveItem();
                const curSub = curIt && curIt.subs[currentSubIdx];
                const nextSub = curIt && curIt.subs[currentSubIdx + 1];
                if (curSub) {
                  const startSec = Math.max(0, (curSub.time || 0) / 1000 - 0.08);
                  const endSec = nextSub ? (nextSub.time / 1000 - 0.04) : null;
                  if (autoPauseSentence) segmentEndSec = endSec;
                  const nowSec = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
                  if (nowSec < startSec - 0.6 || (endSec !== null && nowSec >= endSec - 0.15)) {
                    ytPlayer.seekTo(startSec, true);
                  }
                }
                setTimeout(focusCurrentDicInput, 60);
              }
            },
            onError: (ev) => {
              console.warn("YouTube Player error:", ev && ev.data);
              ytError = true;
              setMediaEngine("ted", true);
            }
          }
        });
      } catch (err) {
        console.warn("YT.Player init failed:", err);
        ytError = true;
        setMediaEngine("ted", true);
      }
    };

    if (window.YT && window.YT.Player) {
      window.onYouTubeIframeAPIReady();
    }

    function loadActiveVideo(autoPlayPodcast) {
      const it = getActiveItem();
      if (!it) return;
      document.getElementById("videoTitle").textContent = it.title;
      document.getElementById("videoMetaInfo").textContent = `${it.unit} • ${it.subs.length} câu phụ đề`;
      updateDoneBtn();

      const extBtn = document.getElementById("btnEngExtYt");
      if (extBtn) extBtn.href = `https://www.youtube.com/watch?v=${it.youtubeId}`;

      const hasTedStream = !!tedVideoUrl(it);

      if (currentMode === "podcast") {
        loadPodcastStream(it, !!autoPlayPodcast);
      }
      if (!hasTedStream && it.youtubeId) {
        ytWanted = true;
        ensureYouTubeApi();
        setMediaEngine("yt", true);
      } else if (currentMode !== "podcast") {
        if (currentEngine === "ted") {
          showTedPlayerUI();
        } else if (ytReady && ytPlayer && ytPlayer.cueVideoById) {
          try { ytPlayer.cueVideoById(it.youtubeId); } catch (e) {}
        }
      }
    }

    function playSubSegment(idx) {
      const it = getActiveItem();
      if (!it || !it.subs[idx]) return;
      const cur = it.subs[idx];
      const next = it.subs[idx + 1];
      const startSec = Math.max(0, (cur.time || 0) / 1000 - 0.08);
      segmentEndSec = autoPauseSentence ? (next ? (next.time / 1000 - 0.04) : ((cur.time / 1000) + 12)) : null;
      const hasTed = !!tedVideoUrl(it);

      if (hasTed && (currentEngine === "ted" || !ytReady || ytError)) {
        if (currentEngine !== "ted") setMediaEngine("ted", true);
        const tedVid = document.getElementById("tedVideoPlayer");
        const bgAudio = document.getElementById("bgPodcastAudio");
        const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid || bgAudio);
        const offsetSec = Number(it.podOffsetMs || 0) / 1000;
        if (activeMedia) {
          activeMedia.currentTime = Math.max(0, startSec + offsetSec);
          activeMedia.play().catch(() => {});
        }
      } else if (ytReady && ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(startSec, true);
        ytPlayer.playVideo();
      }
      setTimeout(focusCurrentDicInput, 60);
    }

    function setupTedVideoEvents() {
      const tedVid = document.getElementById("tedVideoPlayer");
      if (!tedVid || tedVid._s4PauseAttached) return;
      tedVid._s4PauseAttached = true;
      tedVid.addEventListener("play", startSyncLoop);
      tedVid.addEventListener("pause", maybeStopSyncLoop);
      tedVid.addEventListener("ended", maybeStopSyncLoop);
      tedVid.addEventListener("timeupdate", () => {
        if ((currentMode === "dictation" || currentMode === "shadowing") && autoPauseSentence) {
          const it = getActiveItem();
          if (!it || !it.subs) return;
          const offsetSec = Number(it.podOffsetMs || 0) / 1000;
          const unadjustedSec = tedVid.currentTime - offsetSec;
          const curSub = it.subs[currentSubIdx];
          const nextSub = it.subs[currentSubIdx + 1];
          const cutoff = segmentEndSec !== null ? segmentEndSec : (nextSub ? (nextSub.time / 1000 - 0.04) : ((curSub.time / 1000) + 12));
          if (cutoff !== null && unadjustedSec >= cutoff && !tedVid.paused) {
            if (repeatSentence && curSub) {
              const repeatStart = Math.max(0, (curSub.time || 0) / 1000 - 0.08);
              tedVid.currentTime = Math.max(0, repeatStart + offsetSec);
            } else {
              tedVid.pause();
              segmentEndSec = null;
              focusCurrentDicInput();
              if (currentMode === "shadowing" && pendingAutoRecordAfterListen) {
                pendingAutoRecordAfterListen = false;
                setTimeout(() => {
                  if (currentMode === "shadowing" && !activeRec) toggleShadowRecord();
                }, 220);
              }
            }
          }
        }
      });
    }

    function stopSyncLoop() {
      if (syncTimer) {
        clearInterval(syncTimer);
        syncTimer = null;
      }
    }
    function maybeStopSyncLoop() {
      const tedVid = document.getElementById("tedVideoPlayer");
      const bgAudio = document.getElementById("bgPodcastAudio");
      const tedPlaying = Boolean(tedVid && !tedVid.paused && !tedVid.ended);
      const podPlaying = Boolean(bgAudio && !bgAudio.paused && !bgAudio.ended);
      const ytPlaying = Boolean(ytReady && ytPlayer && typeof ytPlayer.getPlayerState === "function" && ytPlayer.getPlayerState() === 1);
      if (!tedPlaying && !podPlaying && !ytPlaying) {
        stopSyncLoop();
      }
    }

    function startSyncLoop() {
      if (syncTimer) return;
      syncTimer = setInterval(() => {
        const it = getActiveItem();
        if (!it || !it.subs || !it.subs.length) return;

        let sec = -1;
        let isPlaying = false;

        const tedVid = document.getElementById("tedVideoPlayer");
        const bgAudio = document.getElementById("bgPodcastAudio");

        if (currentEngine === "ted" || !ytReady || ytError) {
          const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid || bgAudio);
          if (activeMedia && !activeMedia.paused) {
            isPlaying = true;
            const offsetSec = Number(it.podOffsetMs || 0) / 1000;
            sec = Math.max(0, activeMedia.currentTime - offsetSec);
          }
        } else if (ytReady && ytPlayer && typeof ytPlayer.getCurrentTime === "function") {
          const state = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
          if (state === 1) {
            isPlaying = true;
            sec = ytPlayer.getCurrentTime();
          }
        }

        if (!isPlaying || sec < 0) {
          maybeStopSyncLoop();
          return;
        }

        // Auto pause on end of sentence (Dictation & Shadowing)
        if ((currentMode === "dictation" || currentMode === "shadowing") && autoPauseSentence) {
          const curSub = it.subs[currentSubIdx];
          const nextSub = it.subs[currentSubIdx + 1];
          const cutoff = segmentEndSec !== null ? segmentEndSec : (nextSub ? (nextSub.time / 1000 - 0.04) : ((curSub.time / 1000) + 12));
          if (cutoff !== null && sec >= cutoff) {
            if (repeatSentence && curSub) {
              const repeatStart = Math.max(0, (curSub.time || 0) / 1000 - 0.08);
              if (currentEngine === "ted" || !ytReady || ytError) {
                const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid || bgAudio);
                const offsetSec = Number(it.podOffsetMs || 0) / 1000;
                if (activeMedia) activeMedia.currentTime = Math.max(0, repeatStart + offsetSec);
              } else if (ytReady && ytPlayer && ytPlayer.seekTo) {
                ytPlayer.seekTo(repeatStart, true);
              }
            } else {
              if (currentEngine === "ted" || !ytReady || ytError) {
                const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid || bgAudio);
                if (activeMedia) activeMedia.pause();
              } else if (ytReady && ytPlayer && ytPlayer.pauseVideo) {
                ytPlayer.pauseVideo();
              }
              segmentEndSec = null;
              focusCurrentDicInput();
              if (currentMode === "shadowing" && pendingAutoRecordAfterListen) {
                pendingAutoRecordAfterListen = false;
                setTimeout(() => {
                  if (currentMode === "shadowing" && !activeRec) toggleShadowRecord();
                }, 220);
              }
            }
            return;
          }
        }

        // Subtitle highlight tracking cho Transcript (độc lập, không ghi đè vị trí bài học Dictation/Shadowing)
        if (currentMode === "transcript") {
          const ms = sec * 1000;
          let foundIdx = 0;
          for (let i = 0; i < it.subs.length; i++) {
            if (ms >= it.subs[i].time) foundIdx = i;
            else break;
          }
          if (foundIdx !== playbackSubIdx) {
            playbackSubIdx = foundIdx;
            highlightTranscriptRow(foundIdx);
          }
        }
      }, 40);
    }

    function highlightTranscriptRow(idx) {
      playbackSubIdx = idx;
      const rows = document.querySelectorAll(".sub-item");
      rows.forEach((r, i) => r.classList.toggle("active", i === idx));
      const activeRow = rows[idx];
      if (activeRow) {
        activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    /* ---------- Chế độ 1: Nghe & Transcript ---------- */
    function buildSubRowsHtml(it) {
      const activeQ = (document.getElementById("searchInput")?.value || "").trim();
      return (it.subs || []).map((s, idx) => `
        <div class="sub-item ${idx === playbackSubIdx ? "active" : ""}" onclick="clickTranscriptRow(${idx})">
          <span class="sub-time">${fmtTime(getSubDisplayTimeMs(it, s))}</span>
          <div style="flex:1;min-width:0;">
            ${showEnSub ? `<div class="sub-en">${highlightTedText(s.en, activeQ)}</div>` : `<div class="sub-en" style="color:var(--muted);">••• (Đã ẩn phụ đề Anh)</div>`}
            ${showViSub && s.vi ? `<div class="sub-vi">${highlightTedText(s.vi, activeQ)}</div>` : ""}
          </div>
        </div>

    }

    function renderTranscriptMode(it) {

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;">${svgIcon("listening", 15)}<span>Chạm câu bất kỳ để tua tới đoạn đó</span></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="ctrl-btn" onclick="showEnSub=!showEnSub;renderModeContent()">${svgIcon(showEnSub ? "eyeOff" : "eye", 14)}<span>${showEnSub ? "Ẩn Anh" : "Hiện Anh"}</span></button>
            <button type="button" class="ctrl-btn" onclick="toggleViSub()">${svgIcon(showViSub ? "eyeOff" : "eye", 14)}<span>${showViSub ? "Ẩn Việt" : "Hiện Việt"}</span></button>
          </div>

      if (playbackSubIdx > 0) {

    function clickTranscriptRow(idx) {
      const it = getActiveItem();
      if (!it || !it.subs[idx]) return;
      playbackSubIdx = idx;
      segmentEndSec = null;
      highlightTranscriptRow(idx);

      const startSec = Math.max(0, it.subs[idx].time / 1000);
      const hasTed = !!tedVideoUrl(it);
      if (hasTed && (currentMode === "podcast" || currentEngine === "ted" || !ytReady || ytError)) {
        if (currentEngine !== "ted" && currentMode !== "podcast") setMediaEngine("ted", true);
        const tedVid = document.getElementById("tedVideoPlayer");
        const bgAudio = document.getElementById("bgPodcastAudio");
        const activeMedia = (currentMode === "podcast") ? bgAudio : (tedVid && tedVid.src ? tedVid : bgAudio);
        const offsetSec = Number(it.podOffsetMs || 0) / 1000;
        if (activeMedia) {
          activeMedia.currentTime = Math.max(0, startSec + offsetSec);
          activeMedia.play().catch(() => {});
        }
        return;
      }

      if (ytReady && ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(startSec, true);
        ytPlayer.playVideo();
      }
    }

    /* ---------- Chế độ 2: Chép chính tả (Dictation) ---------- */
    function buildDictationTokens(sentence, idx, level) {
      const words = sentence.trim().split(/\s+/);
      let lastBlank = false;
      let blankCount = 0;
      const tokens = words.map((rawW, wIdx) => {
        const m = rawW.match(/^([^A-Za-z0-9'’‘]*)([A-Za-z0-9'’‘-]+)([^A-Za-z0-9'’‘]*)$/);
        if (!m) { lastBlank = false; return { isBlank: false, raw: rawW }; }
        const prefix = m[1], clean = m[2], suffix = m[3];
        if (clean.length <= 2 && words.length > 3) { lastBlank = false; return { isBlank: false, raw: rawW }; }
        const hash = (idx * 31 + wIdx * 17 + clean.charCodeAt(0)) % 10;
        let hide = false;
        if (level === "word_hard") {
          hide = hash < 6;
        } else {
          // Chế độ Trung bình: không ẩn 2 từ sát nhau, ưu tiên từ dài
          hide = !lastBlank && (hash < 3);
        }
        if (hide) blankCount++;
        lastBlank = hide;
        return { isBlank: hide, prefix, answer: clean, suffix, raw: rawW };
      });
      // Đảm bảo ít nhất 1 ô trống trong câu
      if (blankCount === 0 && tokens.length > 0) {
        const cand = tokens.findIndex(t => t.answer && t.answer.length > 2);
        const pick = cand >= 0 ? cand : tokens.findIndex(t => t.answer);
        if (pick >= 0) tokens[pick].isBlank = true;
      }
      return tokens;
    }

    function renderDictationMode(it, opts) {
      const box = document.getElementById("modeContainer");
      const sub = it.subs[currentSubIdx] || { time: 0, en: "", vi: "" };
      const progPct = it.subs.length ? Math.round(((currentSubIdx + 1) / it.subs.length) * 100) : 0;

      let inputAreaHtml = "";
      if (dicLevel === "sentence") {
        inputAreaHtml = `
          <div class="dic-sentence">
            <input type="text" id="dicFullInput" class="dic-full-input" placeholder="Nghe và gõ lại cả câu tiếng Anh..." autocomplete="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" onkeydown="handleDicKey(event, this)">
          </div>`;
      } else {
        const tokens = buildDictationTokens(sub.en, currentSubIdx, dicLevel);
        inputAreaHtml = `<div class="dic-sentence">` + tokens.map(tk => {
          if (!tk.isBlank) return `<span>${escHtml(tk.raw)} </span>`;
          const w = Math.max(82, tk.answer.length * 10 + 22);
          return `${escHtml(tk.prefix)}<input type="text" class="dic-input" data-ans="${escHtml(tk.answer)}" data-min-w="${w}" style="width:${w}px;" autocomplete="off" spellcheck="false" onfocus="scrollInputIntoOptimalView(this)" oninput="handleDicInput(this)" onkeydown="handleDicKey(event, this)">${escHtml(tk.suffix)} `;
        }).join("") + `</div>`;
      }

      box.innerHTML = `
        <div class="ctrl-bar">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <select class="ctrl-select" onchange="dicLevel=this.value;renderModeContent()">
              <option value="word" ${dicLevel === "word" ? "selected" : ""}>Điền từ (Trung bình)</option>
              <option value="word_hard" ${dicLevel === "word_hard" ? "selected" : ""}>Điền từ (Khó)</option>
              <option value="sentence" ${dicLevel === "sentence" ? "selected" : ""}>Chép cả câu</option>
            </select>
            <button type="button" class="ctrl-btn" onclick="toggleViSub()" title="Bật/Tắt phụ đề nghĩa Tiếng Việt">${svgIcon(showViSub ? "eye" : "eyeOff", 13)}<span>Nghĩa Việt: ${showViSub ? "Bật" : "Tắt"}</span></button>
            <button type="button" class="ctrl-btn" onclick="autoPauseSentence=!autoPauseSentence;renderModeContent()" title="Tự động dừng video khi hết câu để điền từ">${svgIcon(autoPauseSentence ? "clock" : "play", 13)}<span>${autoPauseSentence ? "Dừng từng câu" : "Chạy liên tục"}</span></button>
            <button type="button" class="ctrl-btn" onclick="repeatSentence=!repeatSentence;renderModeContent()" title="Tự động phát lặp lại câu hiện tại">${svgIcon("refresh", 13)}<span>Lặp câu: ${repeatSentence ? "Bật" : "Tắt"}</span></button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="ctrl-btn" onclick="stepSub(-1)">${svgIcon("chevronLeft", 13)}<span>Câu trước</span></button>
            <button type="button" class="ctrl-btn primary" onclick="playSubSegment(currentSubIdx)">${svgIcon("volume", 13)}<span>Nghe (${fmtTime(getSubDisplayTimeMs(it, sub))})</span></button>
            <button type="button" class="ctrl-btn" onclick="stepSub(1)"><span>Câu sau</span>${svgIcon("chevronRight", 13)}</button>
          </div>
        </div>

        <div class="dic-box">
          <div class="dic-prog-track"><div class="dic-prog-fill" style="width:${progPct}%"></div></div>
          <div class="dic-progress">
            <span>Câu ${currentSubIdx + 1} / ${it.subs.length} (${progPct}%)</span>
            <span class="dic-shortcut-hint">Space/Tab: Ô kế • Enter: Chấm • \\: Nghe lại</span>
          </div>

    let autoNextTimer = null;
    function clearAutoNext() {
      if (autoNextTimer) {
        clearTimeout(autoNextTimer);
        autoNextTimer = null;
      }
    }

    function triggerAutoAdvance() {
      clearAutoNext();
      const it = getActiveItem();
      if (!it || currentSubIdx >= it.subs.length - 1) {
        showToast(true, "Đã hoàn thành câu cuối của bài!");
        return;
      }
      showToast(true, "Chính xác — Tự chuyển câu tiếp...");
      autoNextTimer = setTimeout(() => {
        autoNextTimer = null;
        stepSub(1);
      }, 900);
    }

    function handleDicInput(el) {
      if (!el) return;
      // Tự giãn ô nhập linh hoạt theo độ dài chữ người dùng gõ để tránh cắt ký tự
      const baseW = Number(el.getAttribute("data-min-w") || 82);
      const neededW = Math.max(baseW, (el.value || "").length * 10 + 24);
      el.style.width = Math.min(neededW, 280) + "px";
      // Không tự chấm khi đang gõ; chỉ xoá màu xanh/đỏ cũ và nhãn đáp án nếu người dùng sửa lại chữ trong ô
      el.classList.remove("correct", "wrong");
      const next = el.nextElementSibling;
      if (next && next.classList.contains("dic-ans-hint")) next.remove();
    }

    function handleDicKey(ev, el) {
      if (ev.isComposing || ev.keyCode === 229) return;
      if (ev.key === "\\") {
        ev.preventDefault();
        playSubSegment(currentSubIdx);
        return;
      }
      if (ev.key === "Enter") {
        ev.preventDefault();
        const allInps = [...document.querySelectorAll(".dic-input, .dic-full-input")];
        if (allInps.length && allInps.every(i => i.classList.contains("correct"))) {
          clearAutoNext();
          stepSub(1);
          return;
        }
        checkDictation();
        return;
      }
      if (dicLevel !== "sentence" && (ev.key === " " || ev.key === "Tab") && !ev.shiftKey) {
        if (ev.key === " ") {
          const ansAttr = el.getAttribute("data-ans") || "";
          // Don't skip an empty box on accidental Space, or block typing space in a hyphenated/multi-part word
          if (!el.value.trim()) {
            ev.preventDefault();
            return;
          }
          if (ansAttr.includes("-")) return;
        }
        const inputs = [...document.querySelectorAll(".dic-input")];
        const idx = inputs.indexOf(el);
        if (idx >= 0 && idx < inputs.length - 1) {
          ev.preventDefault();
          inputs[idx + 1].focus();
          scrollInputIntoOptimalView(inputs[idx + 1]);
        }
        return;
      }
      if (dicLevel !== "sentence" && ev.key === "Backspace" && el.value === "") {
        const inputs = [...document.querySelectorAll(".dic-input")];
        const idx = inputs.indexOf(el);
        if (idx > 0) {
          ev.preventDefault();
          inputs[idx - 1].focus();
          scrollInputIntoOptimalView(inputs[idx - 1]);
        }
      }
    }

    function normWord(s) {
      return (s || "").toLowerCase().replace(/[’‘']/g, "").replace(/[^a-z0-9]/g, "").trim();
    }

    const NUM_WORD_TO_DIGIT = {
      "zero": "0", "one": "1", "two": "2", "three": "3", "four": "4", "five": "5",
      "six": "6", "seven": "7", "eight": "8", "nine": "9", "ten": "10",
      "eleven": "11", "twelve": "12", "thirteen": "13", "fourteen": "14", "fifteen": "15",
      "sixteen": "16", "seventeen": "17", "eighteen": "18", "nineteen": "19", "twenty": "20",
      "thirty": "30", "forty": "40", "fifty": "50", "sixty": "60", "seventy": "70",
      "eighty": "80", "ninety": "90", "hundred": "100", "thousand": "1000",
      "first": "1st", "second": "2nd", "third": "3rd", "fourth": "4th", "fifth": "5th",
      "sixth": "6th", "seventh": "7th", "eighth": "8th", "ninth": "9th", "tenth": "10th"
    };

    function canonicalizeDictTokens(str) {
      // Normalize hyphens to spaces, expand common contractions & map number words to digits
      const cleaned = String(str || "")
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/[-–—]/g, " ")
        .replace(/[^a-z0-9'\s]/g, " ")
        .trim();
      if (!cleaned) return "";
      const rawToks = cleaned.split(/\s+/).filter(Boolean);
      const out = [];
      for (let i = 0; i < rawToks.length; i++) {
        const noApo = rawToks[i].replace(/'/g, "");
        if (!noApo) continue;
        if (typeof CONTRACTION_MAP !== "undefined" && CONTRACTION_MAP[noApo] && CONTRACTION_MAP[noApo][0]) {
          // Use canonical first expansion for unambiguous contractions (skip ambiguous 'id'/'wed' unless needed)
          const cMap = {
            "im": ["i", "am"], "youre": ["you", "are"], "were": ["we", "are"], "theyre": ["they", "are"],
            "ive": ["i", "have"], "youve": ["you", "have"], "weve": ["we", "have"], "theyve": ["they", "have"],
            "dont": ["do", "not"], "doesnt": ["does", "not"], "didnt": ["did", "not"],
            "cant": ["cannot"], "wont": ["will", "not"], "wouldnt": ["would", "not"],
            "couldnt": ["could", "not"], "shouldnt": ["should", "not"], "isnt": ["is", "not"],
            "arent": ["are", "not"], "wasnt": ["was", "not"], "werent": ["were", "not"],
            "hasnt": ["has", "not"], "havent": ["have", "not"], "hadnt": ["had", "not"],
            "lets": ["let", "us"], "gonna": ["going", "to"], "wanna": ["want", "to"]
          };
          if (cMap[noApo]) {
            cMap[noApo].forEach(t => out.push(t));
            continue;
          }
        }
        // Merge compound numbers like "twenty one" -> "21"
        const d1 = NUM_WORD_TO_DIGIT[noApo];
        if (d1 && /^\d0$/.test(d1) && Number(d1) >= 20 && Number(d1) <= 90 && i + 1 < rawToks.length) {
          const nextD = NUM_WORD_TO_DIGIT[rawToks[i + 1].replace(/'/g, "")];
          if (nextD && /^[1-9]$/.test(nextD)) {
            out.push(String(Number(d1) + Number(nextD)));
            i++;
            continue;
          }
        }
        out.push(d1 || noApo);
      }
      return out.join("");
    }

    function isDictationEquivalent(userVal, ansVal) {
      const uNorm = normWord(userVal);
      const aNorm = normWord(ansVal);
      if (!uNorm || !aNorm) return false;
      if (uNorm === aNorm) return true;
      const uCan = canonicalizeDictTokens(userVal);
      const aCan = canonicalizeDictTokens(ansVal);
      return Boolean(uCan && uCan === aCan);
    }

    function checkDictation() {
      const it = getActiveItem();
      const sub = it && it.subs[currentSubIdx];
      if (!sub) return;

      if (dicLevel === "sentence") {
        const inp = document.getElementById("dicFullInput");
        if (!inp) return;
        const ok = isDictationEquivalent(inp.value, sub.en);
        inp.classList.remove("correct", "wrong");
        inp.classList.add(ok ? "correct" : "wrong");
        document.getElementById("dicAnsReveal").textContent = ok ? "" : "Đáp án: " + sub.en;
        if (ok) triggerAutoAdvance();
        else showToast(false, "✗ Chưa đúng");
        return;
      }

      const inputs = [...document.querySelectorAll(".dic-input")];
      if (!inputs.length) return;
      document.querySelectorAll(".dic-sentence .dic-ans-hint").forEach(h => h.remove());
      let allOk = true;
      let firstWrong = null;
      inputs.forEach(inp => {
        const ans = inp.getAttribute("data-ans") || "";
        const ok = isDictationEquivalent(inp.value, ans);
        inp.classList.remove("correct", "wrong");
        inp.classList.add(ok ? "correct" : "wrong");
        if (!ok) {
          allOk = false;
          if (!firstWrong) firstWrong = inp;
          const hint = document.createElement("span");
          hint.className = "dic-ans-hint";
          hint.textContent = "✓ " + ans;
          inp.insertAdjacentElement("afterend", hint);
        }
      });
      document.getElementById("dicAnsReveal").innerHTML = allOk
        ? `<span style="color:var(--success)">✓ Chính xác: ${escHtml(sub.en)}</span>`
        : `<span style="color:var(--danger)">✗ Chưa đúng — Đáp án đầy đủ:</span> <span style="color:var(--success)">${escHtml(sub.en)}</span>`;
      if (allOk) {
        triggerAutoAdvance();
      } else {
        showToast(false, "✗ Xem các ô tô đỏ & đáp án đúng bên cạnh");
        if (firstWrong) {
          firstWrong.focus();
          scrollInputIntoOptimalView(firstWrong);
        }
      }
    }

    function revealDictation() {
      clearAutoNext();
      const it = getActiveItem();
      const sub = it && it.subs[currentSubIdx];
      if (!sub) return;
      const fullInp = document.getElementById("dicFullInput");
      if (fullInp) {
        fullInp.value = sub.en;
        fullInp.classList.remove("wrong");
        fullInp.classList.add("correct");
      }
      document.querySelectorAll(".dic-sentence .dic-ans-hint").forEach(h => h.remove());
      document.querySelectorAll(".dic-input").forEach(inp => {
        inp.value = inp.getAttribute("data-ans") || "";
        inp.classList.remove("wrong");
        inp.classList.add("correct");
      });
      document.getElementById("dicAnsReveal").textContent = "Đáp án: " + sub.en;
    }

    function stepSub(delta) {
      clearAutoNext();
      stopShadowRecording(false);
      clearRecordedShadowAudio();
      const it = getActiveItem();
      if (!it || !it.subs.length) return;
      currentSubIdx = Math.max(0, Math.min(it.subs.length - 1, currentSubIdx + delta));
      saveSubPos();
      renderSidebar();
      renderModeContent({ autoFocus: true });
      playSubSegment(currentSubIdx);
    }

    /* ---------- Chế độ 3: Shadowing (Real-time SpeechRecognition + MediaRecorder Voice Playback) ---------- */
    let activeRec = null;
    let mediaRecorder = null;
    let mediaStream = null;
    let recordedChunks = [];
    let recordedBlobUrl = "";
    function clearRecordedShadowAudio() {
      if (recordedBlobUrl) {
        try { URL.revokeObjectURL(recordedBlobUrl); } catch (e) {}
        recordedBlobUrl = "";
      }
      recordedChunks = [];
      lastShadowEval = null;
      lastShadowAcoustic = null;
    }
    let shadAccumFinal = "";
    let shadCommittedFinal = "";
    let shadSilenceTimer = null;
    let shadRecRestartTimer = null;
    let isTedStoppingTail = false;
    let tedTailTimer = null;
    let pendingAutoRecordAfterListen = false;
    let lastShadowEval = null; // { transcript, pct, matched, total, closeCount, acoustic }
    let lastShadowAcoustic = null;
    let isShadowRecording = false;
    let shadowSessionGen = 0;
    let pendingWhisperTranscribe = false;
    let shadSttErrored = false;
    let shadStartTs = 0;
    let warmMicIdleTimer = null;
    let warmMuteSinceTs = 0;
    let consecutiveSilentCount = 0;
    let warmAcquireGen = 0;
    const MUTE_GRACE_MS = 2500;

    function isIosSafariLike() {
      try {
        const ua = String((typeof navigator !== "undefined" && navigator.userAgent) || "");
        const maxTouch = (typeof navigator !== "undefined" && navigator.maxTouchPoints) || 0;
        return /iPad|iPhone|iPod/i.test(ua) || (/Macintosh/i.test(ua) && maxTouch > 1);
      } catch (e) {
        return false;
      }
    }

    function isWarmStreamHealthy(s) {
      return Boolean(
        s
        && s.active
        && typeof s.getAudioTracks === "function"
        && s.getAudioTracks().some(t => t.readyState === "live" && t.enabled !== false)
      );
    }

    function attachTedTrackMuteListeners(s) {
      if (!s || typeof s.getAudioTracks !== "function") return;
      s.getAudioTracks().forEach((t) => {
        if (!t || t._lpTedMuteBound) return;
        t._lpTedMuteBound = true;
        const onMute = () => {
          if (!warmMuteSinceTs) warmMuteSinceTs = Date.now();
        };
        const onUnmute = () => {
          warmMuteSinceTs = 0;
        };
        if (typeof t.addEventListener === "function") {
          t.addEventListener("mute", onMute);
          t.addEventListener("unmute", onUnmute);
          t.addEventListener("ended", onMute);
        } else {
          t.onmute = onMute;
          t.onunmute = onUnmute;
          t.onended = onMute;
        }
        t._lpTedUnbindMute = () => {
          if (typeof t.removeEventListener === "function") {
            t.removeEventListener("mute", onMute);
            t.removeEventListener("unmute", onUnmute);
            t.removeEventListener("ended", onMute);
          } else {
            if (t.onmute === onMute) t.onmute = null;
            if (t.onunmute === onUnmute) t.onunmute = null;
            if (t.onended === onMute) t.onended = null;
          }
          delete t._lpTedMuteBound;
        };
        if (t.muted === true) {
          onMute();
        }
      });
    }

    function shouldReacquireTedWarmStream(s) {
      if (!isWarmStreamHealthy(s)) return true;
      if (consecutiveSilentCount >= 2) return true;
      const tracks = typeof s.getAudioTracks === "function" ? s.getAudioTracks() : [];
      const allMuted = tracks.length > 0 && tracks.every(t => t && t.muted === true);
      if (allMuted && warmMuteSinceTs && (Date.now() - warmMuteSinceTs >= MUTE_GRACE_MS)) {
        return true;
      }
      if (!allMuted && warmMuteSinceTs) {
        warmMuteSinceTs = 0;
      }
      return false;
    }

    function releaseWarmMicStream() {
      warmMuteSinceTs = 0;
      if (warmMicIdleTimer) {
        clearTimeout(warmMicIdleTimer);
        warmMicIdleTimer = null;
      }
      if (mediaStream) {
        try {
          mediaStream.getTracks().forEach(t => {
            if (t && typeof t._lpTedUnbindMute === "function") t._lpTedUnbindMute();
            t.stop();
          });
        } catch (e) {}
        mediaStream = null;
      }
    }

    function scheduleWarmMicIdleRelease() {
      if (warmMicIdleTimer) clearTimeout(warmMicIdleTimer);
      warmMicIdleTimer = setTimeout(() => {
        warmMicIdleTimer = null;
        if (!isShadowRecording) {
          releaseWarmMicStream();
        }
      }, 180000);
    }

    async function ensureWarmMicStream() {
      if (!shouldReacquireTedWarmStream(mediaStream)) {
        attachTedTrackMuteListeners(mediaStream);
        scheduleWarmMicIdleRelease();
        return mediaStream;
      }
      releaseWarmMicStream();
      consecutiveSilentCount = 0;
      const myGen = ++warmAcquireGen;
      const s = (window.S4Whisper && typeof window.S4Whisper.acquireVoiceStream === "function")
        ? await window.S4Whisper.acquireVoiceStream()
        : await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: { ideal: 1 }, echoCancellation: { ideal: true }, noiseSuppression: { ideal: true }, autoGainControl: { ideal: true } }
          }).catch(() => navigator.mediaDevices.getUserMedia({ audio: true }));
      if (myGen !== warmAcquireGen) {
        try { if (s) s.getTracks().forEach(t => t.stop()); } catch (e) {}
        return null;
      }
      mediaStream = s;
      attachTedTrackMuteListeners(mediaStream);
      scheduleWarmMicIdleRelease();
      return s;
    }

    const TED_DIGIT_TO_WORD = {
      "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five",
      "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten",

    function expandTedShadowTokens(text) {
      const raw = String(text || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[-–—\/]+/g, " ").split(/\s+/).filter(Boolean);
      const out = [];
      raw.forEach(tok => {
        const apo = tok.replace(/^[^a-z0-9']+|[^a-z0-9']+$/g, "");
        if (apo && TED_APO_CONTRACTIONS[apo]) {
          TED_APO_CONTRACTIONS[apo].forEach(p => out.push(p));
          return;
        }
        const nw = normWord(tok);
        if (!nw) return;
        if (TED_APO_CONTRACTIONS[nw]) {
          TED_APO_CONTRACTIONS[nw].forEach(p => out.push(p));
        } else if (TED_DIGIT_TO_WORD[nw]) {
          out.push(TED_DIGIT_TO_WORD[nw]);
        } else {
          out.push(nw);
        }
      });
      return out;
    }

    function phoneticKeyTed(word) {
      let w = String(word || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      if (!w) return "";
      w = w
        .replace(/(?:tion|sion)$/, "shn")
        .replace(/^kn/, "n")
        .replace(/^wr/, "r")
        .replace(/^wh/, "w")
        .replace(/ph/g, "f")
        .replace(/dge/g, "j")
        .replace(/tch/g, "ch")
        .replace(/ck/g, "k")
        .replace(/qu/g, "kw")
        .replace(/gh(?=$|t)/g, "")
        .replace(/([a-z])\1+/g, "$1");
      if (w.length > 4) w = w.replace(/ies$/, "y").replace(/ied$/, "y").replace(/(?:es|ed|s|d)$/, "");
      else if (w.length > 3) w = w.replace(/s$/, "");
      return w;
    }

    function levenshteinTed(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      const prev = new Array(n + 1);
      for (let j = 0; j <= n; j++) prev[j] = j;
      for (let i = 1; i <= m; i++) {
        let diag = prev[0];
        prev[0] = i;
        for (let j = 1; j <= n; j++) {
          const old = prev[j];
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          prev[j] = Math.min(old + 1, prev[j - 1] + 1, diag + cost);
          diag = old;
        }
      }
      return prev[n];
    }

    function tedWordSimilarity(pw, sw) {
      if (!pw || !sw) return 0;
      if (pw === sw) return 1.0;
      const hp = TED_HOMOPHONES[pw];
      const hs = TED_HOMOPHONES[sw];
      if (hp && hs && hp === hs) return 1.0;
      const altsP = CONTRACTION_MAP[pw];
      if (altsP && altsP.some(ph => ph.length === 1 && ph[0] === sw)) return 1.0;
      if (pw.length >= 4 && (sw === pw + "s" || pw === sw + "s" || sw === pw + "es" || pw === sw + "es" || sw === pw + "ed" || pw === sw + "ed" || sw === pw + "d" || pw === sw + "d")) {
        return 0.72;
      }
      if (pw.length >= 3 && sw.length >= 3 && phoneticKeyTed(pw) === phoneticKeyTed(sw)) {
        return 0.72;
      }
      const dist = levenshteinTed(pw, sw);
      if (pw.length >= 7 && dist <= 2) return 0.72;
      if (pw.length >= 4 && dist <= 1) return 0.72;
      return 0;
    }

    function alignTedShadowWords(targetWordsList, spokenText) {
      const spokenTokens = expandTedShadowTokens(spokenText);
      const flatTargets = [];
      const wordParts = targetWordsList.map((rawWord, idx) => {
        const parts = expandTedShadowTokens(rawWord);
        const idxs = [];
        for (let p = 0; p < parts.length; p++) {
          idxs.push(flatTargets.length);
          flatTargets.push({ rawIdx: idx, text: parts[p] });
        }
        return idxs;
      });

      const T = flatTargets.length;
      const S = spokenTokens.length;
      const partScores = new Array(T).fill(0);

      if (T > 0 && S > 0) {
        const cols = S + 1;
        const dp = new Int32Array((T + 1) * cols);
        const bt = new Uint8Array((T + 1) * cols);
        for (let ti = 1; ti <= T; ti++) { dp[ti * cols] = -ti; bt[ti * cols] = 2; }
        for (let sj = 1; sj <= S; sj++) { dp[sj] = -sj; bt[sj] = 3; }

        for (let i = 1; i <= T; i++) {
          const tw = flatTargets[i - 1].text;
          const rOff = i * cols;
          const pOff = (i - 1) * cols;
          for (let j = 1; j <= S; j++) {
            const skipT = dp[pOff + j] - 1;
            const skipS = dp[rOff + j - 1] - 1;
            let best = skipT;
            let mv = 2;
            if (skipS > best) { best = skipS; mv = 3; }
            const sim = tedWordSimilarity(tw, spokenTokens[j - 1]);
            if (sim > 0) {
              const align = dp[pOff + j - 1] + Math.round(sim * 1000) + 10;
              if (align >= best) { best = align; mv = 1; }
            }
            dp[rOff + j] = best;
            bt[rOff + j] = mv;
          }
        }

        let ci = T, cj = S;
        while (ci > 0 || cj > 0) {
          const mv = bt[ci * cols + cj];
          if (mv === 1 && ci > 0 && cj > 0) {
            partScores[ci - 1] = tedWordSimilarity(flatTargets[ci - 1].text, spokenTokens[cj - 1]);
            ci--; cj--;
          } else if (mv === 2 && ci > 0) {
            ci--;
          } else if (cj > 0) {
            cj--;
          } else {
            break;
          }
        }
      }

      let matchedExact = 0;
      let matchedClose = 0;
      let weightedSum = 0;
      let realTotal = 0;
      const statuses = wordParts.map(idxs => {
        if (!idxs.length) {
          return "punct";
        }
        realTotal++;
        let ex = 0, cl = 0;
        for (let p = 0; p < idxs.length; p++) {
          if (partScores[idxs[p]] >= 0.99) ex++;
          else if (partScores[idxs[p]] > 0) cl++;
        }
        if (ex === idxs.length) {
          matchedExact++;
          weightedSum += 1;
          return "ok";
        }
        if (ex + cl > 0) {
          matchedClose++;
          weightedSum += 0.72;
          return "close";
        }
        return "miss";
      });

      const pct = realTotal ? Math.min(100, Math.round((weightedSum / realTotal) * 100)) : 0;
      return { statuses, pct, matched: matchedExact, closeCount: matchedClose, weightedScore: weightedSum, total: realTotal };
    }
